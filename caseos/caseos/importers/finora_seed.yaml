  - {alias: U02, kind: QUESTION, title: "¿Qué cambió y desde cuándo?", hugo: "Preguntaste por dirección, momento y comparación; incluso si ventas podía estar creciendo más lento.", added: "Partner/Bulletproof: no afirmar caída cuando podría ser desaceleración o una comparación de periodos distintos."}
  - {alias: U03, kind: PROPOSAL, title: "Separar lo comercial del revenue", hugo: "Propusiste distinguir atribución comercial e ingreso generado.", added: "Partner: separar origen del cliente de cambios de suscripción, tarifa y descuento; «atribución» estaba nombrando dos preguntas."}
  - {alias: U04, kind: USER_INTUITION, title: "Entraron muchos leads no calificados", hugo: "Tu lectura fue que creció una máquina de leads y posiblemente bajó la calidad.", added: "Partner: dejarlo como hipótesis; New no prueba calidad ni inversión causal. Bulletproof: probar antes si cambió la mezcla o el tiempo observado."}
