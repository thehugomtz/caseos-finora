    falsifier: "Si la diferencia persiste en una comparación justa, puede matizar la lectura económica. Si no hay seguimiento comparable, no concluir deterioro."
    capacity: "Parcial. Sólo hacerlo si puede cambiar la interpretación de HO1–HO3; no prueba calidad de todos los leads."
    priority: "2 × 2 = 4 · P2 · si cambia la lectura"
    origin: [Tú, Partner, Bulletproof]
    source: "brief v0.3 §07 · HO4"
  - alias: HO5
    branch: OBS
    question: "¿El gasto y los resultados pagados se están moviendo distinto?"
    statement: "Gasto agregado y resultados pagados evolucionan de forma diferente."
    alternative: "La diferencia viene de cobertura o clasificación, o ambas series se mueven parecido."
    evidence_needed: "Series comparables, conceptos de gasto claros y moneda/escala consistente."
    falsifier: "Si no añade una conclusión que cambie la historia, dejarlo fuera. Si divergen, sólo describirlo, sin atribuir el resultado al gasto."
    capacity: "Parcial e indirecto. No prueba retorno de inversión ni costo de adquisición por canal."
    priority: "1 × 2 = 2 · P3 · dejar pendiente por defecto"
    origin: [Tú, Partner, Bulletproof]
    source: "brief v0.3 §07 · HO5"

