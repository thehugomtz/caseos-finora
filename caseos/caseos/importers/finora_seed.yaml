# Finora — seed transcribed from Hugo's own working brief "Alegra · V0.3 completa en lenguaje claro"
# (~/Documents/Codex/2026-09-28/new-chat/outputs/alegra_brief_de_trabajo.html, declared the case's source of truth on
# 28-sep-2026). Every item keeps its section of origin (`source`). Texts are transcribed, not rewritten; where a label
# had to be phrased as a question it says so in `note`. Nothing here is a numeric finding: numbers come from finora-eda.
source_doc: "brief v0.3 (alegra_brief_de_trabajo.html)"

brief:
  title: "Business Analytics: del dato a la decisión"
  client: "Alegra · reto técnico"
  company: "Finora — SaaS ficticio para PyMEs; montos en COP"
  objective: "Entender qué explicaciones podríamos defender ante CRO y CFO, qué sigue siendo una posibilidad y qué información permitiría elegir entre ellas."
  objective_source: "brief v0.3 §01 · Qué estamos tratando de conseguir"
  audience: [CEO, CRO, CFO]
  audience_note: "CRO: cómo conseguimos clientes. CFO: qué mueve el ingreso recurrente. CEO: cómo se conectan ambas cosas. Marketing, Sales, Producto y Finanzas pueden aportar contexto; no elegimos un culpable. (brief v0.3 §01)"
  context: >-
    Caso 1 · CRO: más volumen arriba del funnel (New → Working → Engaged → SQL → Demo → Proposal → Won, con entradas
    self-serve, entradas directas a SQL y leads estancados) sin que los clientes nuevos crezcan al mismo ritmo.
    Caso 2 · CFO: ¿el modelo cliente + mes + monto permite separar el comportamiento del cliente del precio y de los
    descuentos temporales que se van a introducir? El caso relata más entradas en primeras etapas y menor crecimiento
    relativo de clientes nuevos; también plantea introducir descuentos temporales. Todavía no fijamos el periodo ni el
    signo del cambio económico.
  context_source: "Resumen del enunciado en las notas del proyecto (27-sep-2026) + brief v0.3 §01 · Qué sabemos del escenario"
  deliverables:
    - "Video ejecutivo ≤ 5 min para CEO, CRO y CFO: Situación → Hallazgo → Implicación → Decisión → Acción"
    - "Link a la demo + video ≤ 5 min del proceso con IA"
    - "Material de soporte"
    - "Nota corta: prioridades, supuestos, información faltante, cambios al modelo, cómo se usó y validó la IA"
  deliverables_source: "Notas del proyecto (27-sep-2026), resumen del enunciado de Alegra"
  constraints:
    - "El reto original da cinco días; no sabemos cuánto queda. Esfuerzo relativo, no fechas. (brief v0.3 §01)"
    - "No vamos a llamar “causa” a algo que sólo muestra una asociación. (brief v0.3 §01)"
    - "No hay datos de funnel: el Caso 1 se responde como propuesta de medición, no como diagnóstico. (notas del proyecto)"
    - "Solución fuera de esta etapa: sin dashboards, métricas definitivas, modelo de datos ni deck hasta que se decida. (brief v0.3 §11)"
  data_available:
    - "Transactions.csv — cliente · mes · monto (COP)"
    - "Industry.csv — industria del cliente"
    - "S&M_spend.csv — gasto mensual por rubro (unidad sin documentar)"
    - "Workspace de exploración (finora-eda) con el análisis de la Fase 1, 39 hallazgos canónicos verificados en código y respuestas W0–W5"
  success_criteria:
    - "Preguntas separadas sin contar lo mismo dos veces; hipótesis con una explicación alternativa; evidencia que ayude a distinguirlas; tareas que sepamos cuándo cerrar. (brief v0.3 §01)"
  gaps:
    - "El texto literal del enunciado de Alegra no está en el repositorio: este brief se reconstruyó desde las notas del proyecto (27-sep) y el brief v0.3. Pendiente adjuntar el enunciado original."
    - "Qué entiende el CRO por adquirir un cliente: cerrar una venta, primer pago o suscripción activa (sin fijar)."
    - "Si el monto representa suscripción recurrente, facturación o cobro; y a qué periodo pertenece (sin confirmar)."

executive_question: "¿Qué explicaciones podemos defender ante el CRO y el CFO con los datos disponibles, qué sigue siendo solo una posibilidad y qué información permitiría elegir entre ellas?"
executive_question_note: "Formulada como pregunta desde brief v0.3 §01 · Qué estamos tratando de conseguir."

executive_questions:
  - key: CRO
    audience: CRO
    text: "¿Por qué está llegando más gente, pero los clientes nuevos no crecen en la misma proporción?"
    source: "brief v0.3 §05"
  - key: CFO
    audience: CFO
    text: "¿Por qué cambió el ingreso recurrente y cuánto se explica por lo que el cliente contrata, por la tarifa o por descuentos?"
    source: "brief v0.3 §06"
  - key: CEO
    audience: CEO
    text: "¿Cómo se conectan cómo conseguimos clientes y qué mueve el ingreso recurrente?"
    source: "brief v0.3 §01 (Para quién: «CEO: cómo se conectan ambas cosas») y §10"
    note: "Etiqueta del brief formulada como pregunta."

branches:
  - {key: C1, parent: CRO, text: "¿Realmente aumentó igual la entrada total?", scope: "Cuántas personas o cuentas únicas entran por todas las vías. No confundimos entradas con personas acumuladas en una etapa.", source: "brief v0.3 §05 · Rama C1"}
  - {key: C2, parent: CRO, text: "¿Cambió la gente que entra o el tiempo que ha tenido para comprar?", scope: "Cambia la mezcla de perfiles, vías de ingreso y fechas de entrada. No estamos diciendo todavía que un mismo tipo de persona compre peor.", source: "brief v0.3 §05 · Rama C2"}
  - {key: C3, parent: CRO, text: "¿Personas similares están comprando menos o comprando más tarde?", scope: "Comparamos el comportamiento a igual tiempo desde la entrada. No creamos dos ramas independientes para «nunca comprará» y «comprará después».", source: "brief v0.3 §05 · Rama C3"}
  - {key: F1, parent: CFO, text: "¿Cuánto aportan los clientes que entran?", scope: "Todo el aporte de esa cuenta queda en este grupo, incluido su descuento inicial. Distinguimos nuevos de quienes regresan.", source: "brief v0.3 §06 · Rama F1"}
  - {key: F2, parent: CFO, text: "¿Cuánto dejan de aportar los clientes que salen?", scope: "Sólo bajas reales de la relación recurrente. Su suscripción y su descuento previos se tratan dentro del mismo grupo.", source: "brief v0.3 §06 · Rama F2"}
  - {key: F3, parent: CFO, text: "¿Qué cambió en quienes permanecen?", scope: "La cuenta está activa en ambas fechas; que el pago neto no cambie no demuestra que todo siga igual.", source: "brief v0.3 §06 · Rama F3"}

hypotheses:
  # ---- CRO (C1–C3)
  - alias: HC1
    branch: C1
    question: "¿New creció más que el total real?"
    statement: "New creció, pero otras entradas bajaron. Entonces el total de personas que podrían comprar no creció tanto como parecía."
    alternative: "Sí creció igual el total, y el problema está en quién entra o en lo que ocurre después."
    evidence_needed: "Todas las entradas únicas de producto y ventas, cuándo llegaron y cómo se identifica a una misma cuenta en ambas fuentes. Antes se aclaran duplicados y la diferencia entre entradas nuevas y cuentas acumuladas."
    falsifier: "Si el total crece menos, corregimos la magnitud de la premisa. Si crece como esperaba el CRO, dejamos de usar falta de demanda total como explicación de la menor proporción que compra."
    capacity: "No directamente. Los pagos no muestran todas las entradas y el gasto no nos dice cuántos leads hubo. Capacidad actual: 0."
    priority: "3 × 0 = 0 · Importante, faltan datos"
    origin: [Tú, Enunciado, Partner, Bulletproof]
    source: "brief v0.3 §05 · HC1"
  - alias: HC2a
    branch: C2
    question: "¿Ahora pesa más un tipo de entrada que suele comprar menos o tardar más?"
    statement: "Aumentó la proporción de personas que históricamente compran menos o tardan más en hacerlo."
    alternative: "La mezcla sigue parecida, o no alcanza para explicar la diferencia; algo cambió dentro de los grupos."
    evidence_needed: "Características y vía de ingreso conocidas cuando cada persona entra, más su compra posterior a tiempos comparables. Incluye a quienes no compraron."
    falsifier: "Si la mezcla nueva con el comportamiento habitual de cada grupo explica la diferencia, esa lectura gana fuerza. Si queda una diferencia dentro de grupos, pasamos a C3."
    capacity: "No directamente. Industry describe industrias de clientes, pero no necesariamente a todos los leads. Capacidad: 0."
    priority: "3 × 0 = 0 · Importante, faltan datos"
    origin: [Tú, Enunciado, Partner, Bulletproof]
    source: "brief v0.3 §05 · HC2a"
  - alias: HC2b
    branch: C2
    question: "¿Estamos comparando personas demasiado recientes?"
    statement: "Hay más entradas recientes que todavía no tuvieron la misma oportunidad de comprar."
    alternative: "Aun dando el mismo tiempo a personas comparables, la compra sigue siendo menor."
    evidence_needed: "Fecha de ingreso, fecha de observación y cuándo compraron o qué pasó con quienes no lo hicieron."
    falsifier: "Si al igualar tiempo y perfil desaparece la diferencia, la juventud del grupo es una explicación compatible. Si no desaparece, «sólo necesitan más tiempo» deja de ser suficiente."
    capacity: "No. Agrupar desde primer pago sirve para ver qué pasa después de pagar; no nos dice cuánto tardaron desde que llegaron. Capacidad: 0."
    priority: "3 × 0 = 0 · Importante, faltan datos"
    origin: [Tú, Enunciado, Partner, Bulletproof]
    source: "brief v0.3 §05 · HC2b"
  - alias: HC3ab
    branch: C3
    question: "¿La diferencia temprana se recupera o sigue abierta?"
    statement: "HC3a: al principio compran menos, pero después alcanzan un resultado parecido. HC3b: la diferencia sigue existiendo incluso con más seguimiento comparable."
    alternative: "El comportamiento dentro de grupos no cambió y el total se explica por C1/C2; o todavía no pasó suficiente tiempo para distinguir ambas posibilidades."
    evidence_needed: "La historia de todas las entradas: quienes compraron, quienes siguen abiertos y quienes no compraron, en periodos de seguimiento que ambos grupos tengan."
    falsifier: "Si se recupera, pierde fuerza la explicación de una caída persistente en ese periodo. Si no se recupera, el retraso pierde fuerza como explicación suficiente; aun así no demuestra que esas personas nunca comprarán."
    capacity: "No con pagos solos: faltan fecha de entrada y personas que nunca pagaron. Capacidad: 0."
