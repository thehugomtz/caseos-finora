candidate_frames:
  - {name: "CRO por cuánto entra, quién entra y cómo compra con el tiempo", description: "Incluye rutas distintas sin asumir que sabemos quién comprará en el futuro. C1, C2 y C3.", when_it_wins: "Es el corte elegido.", chosen: true}
  - {name: "CFO por clientes que entran / salen / permanecen", description: "Evita contar la misma cuenta en dos grupos entre las mismas fechas; dentro de cada grupo distinguimos suscripción y descuento.", when_it_wins: "Es el corte elegido.", chosen: true}
  - {name: "CRO por etapas comerciales", description: "Dónde se detiene el avance cuando sí hay historial de etapas.", when_it_wins: "No sirve igual para self-serve ni entradas directas; las etapas quedan como lugar donde investigar dentro de C3.", chosen: false}
  - {name: "CFO por comportamiento / precio / descuentos", description: "Se parece a la pregunta del ejecutivo.", when_it_wins: "No separa causas limpiamente: un precio o descuento puede cambiar el comportamiento. Se investigan dentro de los grupos.", chosen: false}

perspectives:
  - {who: CEO, question: "¿Y si estamos comparando leads recientes con compras de personas que llegaron antes?", changes: "Antes de afirmar que algo empeoró, revisar si la comparación tiene sentido."}
  - {who: Cliente, question: "¿Y si no soy un lead malo, sino que el producto, precio o experiencia no me convence?", changes: "No aceptar como hecho la explicación de Sales."}
  - {who: Competidor, question: "¿Y si apareció una alternativa mejor, aunque nuestra atención no haya cambiado?", changes: "Dejar esa posibilidad abierta; investigar afuera sólo si aparece una señal que lo justifique."}
  - {who: CFO, question: "¿Y si cambió cuándo cobramos o cómo registramos, y no la suscripción?", changes: "Aclarar el significado del monto antes de explicar su cambio."}
  - {who: "Lectura del enunciado", question: "¿Y si no había descuentos y el reto pide prepararnos para cuando existan?", changes: "Dar espacio a la prueba de si el modelo distingue escenarios, sin atribuir descuentos al pasado."}

# brief v0.3 §10 · la explicación provisional que estamos conservando
initial_storyline:
  - "Qué sabemos: el caso relata más volumen comercial sin aumento proporcional de clientes nuevos, y plantea distinguir cambios de ingreso al introducir descuentos."
  - "Qué nos impide cerrar la explicación: las fuentes muestran pagos, industria y gasto, pero no toda la historia de quienes entraron ni los componentes del valor recurrente."
  - "Cómo proponemos avanzar: usar los pagos para describir lo que sí vemos, revisar con los ejemplos qué distingue el modelo y dejar claras las preguntas que requieren más evidencia."
  - "Qué tan seguros estamos: la separación de preguntas es defendible bajo las definiciones que explicamos; todavía tenemos poca evidencia para elegir una causa real del desempeño."
  - "Qué cambiaría el plan: descubrir eventos completos de entradas y compras, o información separada de suscripciones, tarifas y descuentos."

decisions_needed:
  - "Qué unidad cuenta como entrada (contacto, usuario, oportunidad o cliente)."
  - "Qué significa adquirir un cliente para el CRO: cerrar una venta, primer pago o suscripción activa."

parked:
  - "Inferir canales mediante grupos de pagos; benchmarks generales; atribución multicanal; estimar LTV o CAC causal; modelar quién comprará «algún día»; adivinar descuentos históricos; diseñar o mostrar funciones de la herramienta. (brief v0.3 §08 · Lo que dejamos fuera por ahora)"

