id: C-001
type: claim
key: overview-brecha
question: ¿Qué tan sano está el modelo si suma clientes mucho más rápido que monto pagado?
headline: Los clientes activos crecen 4,5× y el MRR pagado observado, 2,8×
answer: Entre ene-22 y oct-24, los clientes con pago en el mes pasan de 377 a 1.678 (4,5×) y el MRR pagado observado,
  de COP 35,0 millones a COP 97,0 millones (2,8×). En consecuencia, el MRR pagado observado por cliente activo baja
  de COP 92,8 mil a COP 57,8 mil (−38%). Esa brecha abre Growth (quién entra) y Revenue (qué se paga y por qué cambia).
