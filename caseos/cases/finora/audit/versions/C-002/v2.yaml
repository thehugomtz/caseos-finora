id: C-002
type: claim
key: overview-mezcla
question: ¿El −38% por cliente viene de la base que ya teníamos o de quién entra?
headline: La caída por cliente se asocia a quién entra; la base previa sostiene su monto
answer: Entre ene-22 y oct-24, la descomposición por cosecha asigna a la composición de la base 108% del cambio
  del MRR pagado observado por cliente activo, y −8% al efecto dentro de las cosechas; con base dic-22, a la composición
  le asigna 84%. Los clientes activos en ene-22 pasan de COP 92,8 mil a COP 97,4 mil por cliente (+5%). En cambio,
  las cosechas 2023 y 2024 ya son 65% de los activos y 50% del MRR en oct-24, con COP 46,3 mil y COP 43,0 mil por
  cliente.
