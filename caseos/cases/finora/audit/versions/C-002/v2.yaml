limitations:
- 'Pendiente de tu aceptación: F-075, F-076, F-056, F-058, F-097 y F-019 están propuestos.'
- 'Composición ≠ causa: no separa si las cosechas nuevas pagan menos por tipo de cliente, plan, tarifa o descuento;
  el panel no trae esas tablas (F-062).'
- La magnitud depende de la base (108% con ene-22, 84% con dic-22); la dirección se mantiene.
- '«Quién entra» describe primeros pagadores observados, no la calidad de los leads: H-005 no se evalúa con pagos.'
- La salida de pocas cuentas grandes también baja el promedio (F-101, F-102) y aquí no está separada.
visual_intent: 'Mezcla que arrastra: la base previa se sostiene mientras las cosechas nuevas, de menor monto por
  cliente, ganan peso y bajan el promedio.'
hugo_wording: 'Observaciones generales y salud del negocio: el −38% por cliente activo se asocia a la mezcla de
  quienes entran; la base previa no pierde monto por cliente.'
