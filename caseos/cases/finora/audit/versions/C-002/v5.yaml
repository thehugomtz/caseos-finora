limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- 'Composición no es causa: no separa tipo de cliente, plan, tarifa ni descuento; el panel no trae esas tablas (F-062).'
- La base de comparación (ene-22 o dic-22) es una decisión pendiente (X-060).
- La salida de pocas cuentas grandes también baja el promedio (F-101, F-102) y aquí no se separa.
- «Quién entra» describe primeros pagadores observados, no la calidad de los leads.
visual_intent: 'Mezcla que arrastra: la base previa sostiene su monto mientras las cosechas nuevas, con menos monto
  por cliente, ganan peso y bajan el promedio.'
hugo_wording: Observaciones generales y salud del negocio que introducen las secciones siguientes.
