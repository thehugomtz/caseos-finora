id: C-002
type: claim
key: overview-mezcla
question: ¿El −38% por cliente viene de la base que ya teníamos o de quién entra?
headline: La caída por cliente se asocia a quién entra; la base previa sostiene su monto
answer: 'Con base ene-22, la descomposición por cosecha asigna 108% del cambio del MRR pagado observado por cliente
  activo a la composición de la base; con base dic-22, 84%. La cifra depende de la ventana; la dirección no. Los
  clientes activos en ene-22 pasan de COP 92,8 mil a COP 97,4 mil por cliente (+5%), mientras que las cosechas 2023
  y 2024 ya son 65% de los activos y 50% del MRR en oct-24, con COP 46,3 mil y COP 43,0 mil por cliente. Propuesta:
  reportar el monto por cliente siempre partido en base previa y cosechas, con una base de comparación fija que
  decidas tú.'
