limitations:
- 'Pendiente de tu aceptación: F-110, F-113, F-112, F-114, F-100, F-030 y los demás citados están propuestos (F-039,
  confianza media).'
- 'Primer pago observado ≠ adquisición: no es Won ni suscripción activa. El hito lo acuerda el CRO.'
- 'El escalón de inicios de 2023 puede ser en parte un efecto de registro (H-024) o un cambio operativo (H-025):
  sin confirmar.'
- Con la ventana mar–oct igualada el cambio se mantiene (F-043). La magnitud depende de la medida (F-046); por F-139,
  el ticket de entrada debería medirse con un monto estabilizado.
- Entre 2023 y 2024 el ticket no siguió bajando (T-033). Eso concilia R-003 con R-010 (H-030, X-018).
- Si las entradas del CRO siguieron creciendo después de ene-23, la meseta sería el tramo de «más leads, no más
  ventas». Las entradas no están en los datos (Q-001).
- 'La industria es la única segmentación disponible: no sustituye al canal ni a la motion.'
visual_intent: 'Outgrow: el conteo de primeros pagadores sube en escalón y se aplana, mientras el valor inicial
  que traen crece mucho menos. Volumen y valor se desacoplan.'
hugo_wording: Revisar entradas y actividad económica de clientes y segmentos.
