id: C-003
type: claim
key: growth-entradas
question: ¿Qué cambió en quién entra y en qué industrias?
headline: Entran más primeros pagadores, con menor ticket, en las 6 industrias
answer: 'Los primeros pagadores observados pasan de 27,2 por mes en 2022 (mar–dic) a 54,7 desde ene-23. Es un escalón
  a inicios de 2023, sin tendencia distinguible después (pendiente +0,47 por mes; intervalo de 95% de −0,40 a +1,33).
  El valor que traen crece menos: entre 2022 y 2024 los primeros pagadores por mes suben +104%, mientras el valor
  inicial incorporado por mes sube +6% (run-rate temprano) o +17% (monto habitual); la mediana del primer pago pasa
  de COP 63,0 mil en 2022 a COP 36,8 mil en 2023 y COP 42,0 mil en 2024. Pasa en las 6 industrias: 97% del cambio
  del ticket ocurre dentro de cada industria, no por mezcla.'
