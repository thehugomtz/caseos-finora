limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos; F-160 a F-163 tienen confianza media.'
- 'Primer pago observado no es adquisición: no es Won ni suscripción activa. El hito lo acuerda el CRO (X-052).'
- El escalón de inicios de 2023 puede ser en parte registro (H-024) o un cambio operativo (H-025, H-068). Sin confirmar.
- 'El ticket estabilizado sigue siendo monto pagado: no separa tarifa, plan, empaquetamiento ni descuento (F-167).'
- 'La industria es la única segmentación disponible: no sustituye al canal ni a la ruta.'
visual_intent: 'Outgrow: el conteo de primeros pagadores sube en escalón y se aplana, mientras el valor que traen
  crece mucho menos.'
hugo_wording: Revisar entradas y actividad económica de clientes y segmentos.
