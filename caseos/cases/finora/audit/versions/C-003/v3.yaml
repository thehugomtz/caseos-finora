id: C-003
type: claim
key: growth-entradas
question: ¿Qué cambió en quién entra y en qué industrias?
headline: Entran más primeros pagadores, con menor ticket estabilizado, en las 6 industrias
answer: 'Los primeros pagadores observados pasan de 27,2 por mes en 2022 (mar–dic) a 54,7 desde ene-23. Es un escalón
  sin tendencia distinguible después: pendiente de +0,47 por mes, con intervalo de −0,40 a +1,33. Entre 2022 y 2024
  suben +104% por mes, mientras el valor inicial que incorporan sube +6% (run-rate temprano) o +17% (monto habitual).
  Con ticket estabilizado, la mediana del segundo pago baja de COP 52,5 mil en 2022 a COP 36,8 mil en 2023 y COP
  38,9 mil en 2024. El efecto dentro de cada industria explica 91% del cambio 2022→2023 y 96% del 2022→2024.'
