limitations:
- 'Pendiente de tu aceptación: F-107, F-118, F-063, F-066 y los demás citados están propuestos (la mayoría, de confianza
  media).'
- 'Coincidir en fechas no es causa: no hay etapas del funnel con fechas ni fuente del lead que liguen el gasto de
  un mes con clientes concretos (F-119).'
- 'La unidad no está documentada: no se lee como COP ni se combina con el monto pagado (X-001).'
- 'PayrollExpenses es negativo en 5 meses y Freelance queda en cero desde mediados de 2023: el valle puede ser en
  parte contable (H-023). F-117 fecha ese cero en may-23 y T-009 marca jun-23 como último mes con valor: hay que
  reconciliarlo.'
- 'La columna «capacidad_por_mes» de T-013 es gasto de Team, no capacidad de SDR/AE (X-014): conviene renombrarla
  antes de mostrarla.'
- No se puede decidir con estos datos si SoftwareTools/Freelance son Habilitación o producto (F-068).
visual_intent: 'Divergencia sin causa: en 2023 el gasto por categoría baja mientras los primeros pagadores suben.
  Coinciden en fechas; ninguno mueve al otro.'
hugo_wording: 'Inversión de S&M por categoría (Generación de Demanda ToFu: Paid Media y publicidad no web · Team:
  Payroll Expenses y Travel · Habilitación, ¿producto?: Software Tools y Freelance) y hasta dónde se puede relacionar
  con ventas cruzando fechas.'
