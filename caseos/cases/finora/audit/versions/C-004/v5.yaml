limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- 'Asociación no es efecto: no hay etapas con fecha ni fuente del lead que liguen gasto y clientes (F-119).'
- No se puede decidir si SoftwareTools y Freelance son habilitación comercial o producto (F-068).
- PayrollExpenses es negativo en algunos meses (T-007) y el primer tramo parece una asignación de arriba hacia abajo.
visual_intent: 'Dos paneles con los mismos meses (ene-22 a oct-24): arriba el S&M total por mes (unidad reportada),
  abajo las altas por mes; en 2023 jun-dic el gasto baja mientras las altas suben (T-101). Apoyo: dispersión de
  S&M contra altas con un mes de rezago (F-220, T-107) y barras por ventana de altas por mes y S&M por alta (T-108).
  Sin atribuir ventas al gasto.'
hugo_wording: 'inversión de S&M por categoría (ToFu: Paid Media y publicidad no web · Team: Payroll Expenses y Travel
  · habilitación: Software Tools y Freelance) y hasta dónde se puede relacionar con ventas cruzando fechas'
