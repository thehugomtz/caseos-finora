id: C-004
type: claim
key: growth-gasto
question: ¿Hasta dónde se puede relacionar la Inversión en Marketing por categoría con las ventas cruzando fechas?
headline: Gasto de S&M y primeros pagadores van en sentidos distintos; cruzar fechas no atribuye ventas
answer: 'En 2023 jun–dic hay 60,6 primeros pagadores por mes, frente a 45,2 en ene–may. En esos mismos tramos, la
  Generación de Demanda (ToFu) baja de 1,73 u a 0,82 u por mes y el S&M total de 3,01 u a 1,44 u. La correlación
  en niveles entre S&M total y primeros pagadores del mismo mes es −0,57; en cambios mes a mes, el mayor valor absoluto
  es 0,27 (p mínimo 0,14). No hay una relación positiva que leer. El archivo viene en unidades reportadas (u), sin
  escala a COP, y hasta may-23 Team es un 12% fijo del total durante 17 meses. Propuesta: que Finora documente la
  unidad y la clasificación funcional del gasto y lo registre por canal y funnel. La inversión se decide con gasto
  por canal y experimentos, no cruzando fechas.'
