- W y el umbral de «estancado» son parámetros a acordar con Finora, no estándares de mercado.
- 'Con los datos del caso no se calcula ninguna conversión: los pagos no incluyen a quien no compró.'
- La atribución por canal reparte crédito; no prueba causa (F-144).
