id: C-006
type: claim
key: funnel-conversion
question: ¿Qué conversion rate usar si hay entradas recientes y leads que se estancan semanas?
headline: Proponemos medir conversión por cohorte de entrada y ventana fija, por puerta y canal
answer: 'La tasa es «% de las entradas del mes que pagan dentro de W días», por puerta y Canal de adquisición, calculada
  solo en las cohortes que ya cumplieron la ventana. La tasa de período y el promedio de solo los que convirtieron
  castigan a las entradas recientes y confunden «compran más tarde» con «compran menos», que es justo lo que hay
  que separar en la premisa del CRO (H-003, H-004). Para medirla hay que instrumentar en origen: fechas por etapa
  en el CRM, puerta y canal por cuenta, y gasto por canal.'
