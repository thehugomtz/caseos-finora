id: C-006
type: claim
key: funnel-conversion
question: ¿Cómo se mide la conversión si cada funnel tiene su unidad y sus tiempos?
headline: Proponemos medir por cohorte de entrada con ventana fija y comparar entre puertas, no rutas
answer: 'La tasa que sirve es el % de las entradas de una cohorte que llega al primer pago dentro de una ventana
  fija, por puerta y canal, y solo en cohortes que ya cumplieron esa ventana. La tasa de periodo castiga a las entradas
  recientes. Antes del nudo, cada funnel se lee dentro de sí mismo. Entre funnels solo se compara del primer pago
  hacia la derecha: ticket estabilizado, permanencia temprana y churn observado y persistente. La conversión de
  Hybrid no mide lo que aporta la persona, porque los SDR/AE eligen a quién tocar. Por eso se compara entre puertas,
  que quedan fijas al entrar, y se reporta el mix de rutas dentro de cada puerta. AAARRR queda como vocabulario
  común, no como secuencia. La ventana se acuerda con Finora.'
