- 'La industria es la única segmentación: no hay tamaño de cliente, canal, precio, descuento ni motivo de churn
  (F-106). No se fabrican segmentos por clustering.'
- Churn persistente = no vuelve a pagar en un trimestre. Es un proxy con ventana de gracia, no retención contractual.
- 'Quienes se van pagaban más en promedio, pero no en mediana: pesan pocas cuentas grandes (F-101, F-102).'
