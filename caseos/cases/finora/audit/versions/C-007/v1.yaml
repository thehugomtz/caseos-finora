id: C-007
type: claim
key: perdida-cosechas
question: ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento?
headline: La pérdida se concentra en cosechas de menor ticket, no en una industria
answer: 'Entre dic-22 y oct-24, el MRR pagado observado por cliente activo cambia −COP 31,7 mil (−35%): la descomposición
  asigna −COP 26,6 mil (84%) a la composición de cosechas y −COP 5,2 mil al efecto dentro de las cosechas. Bajó
  en las 6 industrias, más en Servicios profesionales (−46,6%), Restaurantes (−45,6%) y Retail (−43,1%) que en Producción
  (−18,8%), Tecnología (−15,5%) y Salud (−14,4%). La salida persistente no sube: el churn que no vuelve a pagar
  en un trimestre es 0,98% en 2022, 1,09% en 2023 y 0,96% en 2024.'
