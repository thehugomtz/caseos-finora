id: C-007
type: claim
key: perdida-cosechas
question: ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento?
headline: La pérdida está en el monto por cliente de cosechas de menor ticket
answer: 'Está en el monto por cliente, no en el número de clientes: entre dic-22 y oct-24 los clientes activos suben
  en las 6 industrias y el MRR por cliente activo baja en las 6, de −46,6% en Servicios profesionales a −14,4% en
  Salud. Está dentro de cada industria: con el monto usual temprano, el efecto dentro explica 91% del cambio del
  ticket de entrada 2022→2023 y 96% del 2022→2024. Y está en las cosechas de menor ticket: la composición explica
  84% del cambio del MRR por cliente activo desde dic-22 (108% desde ene-22; la ventana la decides tú). Las cosechas
  2023 y 2024 ya son 65% de los activos, con COP 46,3 mil y COP 43,0 mil por cliente, frente a COP 97,4 mil de la
  base previa. Las salidas persistentes no la explican: el churn observado baja de 3,52% a 2,04% y el que no vuelve
  a pagar pasa de 0,98% a 0,96%.'
