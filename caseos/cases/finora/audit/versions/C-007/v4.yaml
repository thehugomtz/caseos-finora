limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- La cifra de composición depende de la ventana (X-060).
- El churn observado de 2024 tiene dos cifras en el caso (T-034 frente a T-002). Falta conciliarlas (X-099, X-101).
- 'Por promedio, quienes se van pagaban más; por mediana, no: el efecto está en pocas cuentas grandes (F-101, F-102).'
- La cosecha 2022 también baja (F-059), y puede ser real o efecto de edad (X-062). No hay tamaño de cliente ni otra
  segmentación (F-106).
visual_intent: 'Mezcla que arrastra: las cosechas nuevas de menor ticket ganan peso; por industria, todas bajan
  con distinta intensidad.'
