id: C-007
type: claim
key: perdida-cosechas
question: ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento?
headline: La pérdida está en el monto por cliente de cosechas de menor ticket
answer: 'Entre dic-22 y oct-24 el MRR pagado observado por cliente activo cambia −COP 31,7 mil (−35%). La descomposición
  asigna −COP 26,6 mil (84%) a la composición de cosechas y −COP 5,2 mil al efecto dentro de las cosechas. La caída
  aparece en las 6 industrias, pero es mayor en Servicios profesionales (−46,6%), Restaurantes (−45,6%) y Retail
  (−43,1%) que en Producción (−18,8%), Tecnología (−15,5%) y Salud (−14,4%); medido con el monto usual temprano,
  96% del cambio del ticket de entrada 2022→2024 ocurre dentro de cada industria. No se asocia a salidas persistentes:
  el churn observado baja de 3,52% en 2022 a 2,04% en 2024, mientras el churn persistente pasa de 0,98% a 0,96%.'
