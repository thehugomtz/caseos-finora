limitations:
- El churn de 2024 cubre ene–jul, porque hace falta ventana de seguimiento. T-034 da 1,9% para 2024 con otra ventana
  (X-099, X-101).
- Churn observado no es retención contractual. Persistente = no vuelve a pagar en el trimestre siguiente.
- 'Quienes hacen churn pagan más en promedio, pero no en mediana: la salida de pocas cuentas grandes también baja
  el promedio (F-101, F-102).'
- La base de comparación (dic-22 o ene-22) está pendiente (X-060).
- 'La industria es la única segmentación: no hay tamaño, canal ni ruta.'
- La burbuja de Salud (C-008) sale de la lámina por N-057 y queda en anexo como señal a validar.
visual_intent: 'Leak: el monto por cliente se diluye con la entrada de cosechas de menor ticket en todas las industrias,
  mientras las salidas persistentes se quedan planas.'
hugo_wording: Dónde y en qué segmentos se concentra la pérdida de crecimiento (industria, churn, low tickets, mix).
