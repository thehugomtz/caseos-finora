question: ¿Hay industrias de bajo churn, ticket alto y poco volumen?
headline: 'Salud combina menor churn persistente, ticket alto y poco volumen: señal a validar'
answer: En 2024, Salud tiene el menor churn persistente (0,56 puntos porcentuales mensuales), el mayor ticket de
  entrada mediano (COP 52,5 mil, igual que Restaurantes) y 124 clientes activos en oct-24, frente a 459 en Restaurantes
  y 360 en Retail. En el otro extremo, Retail combina el mayor churn persistente (1,33) con el menor ticket mediano
  (COP 26,2 mil). Salud y Tecnología también muestran las menores caídas del MRR pagado observado por cliente activo
  entre dic-22 y oct-24 (−14,4% y −15,5%).
