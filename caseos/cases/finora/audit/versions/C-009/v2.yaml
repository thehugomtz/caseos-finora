limitations:
- Propuesta de especialista (R-018), pendiente de tu aceptación. F-137 y F-138 vienen de fuente sin verificar.
- 'Churn observado 2024: T-002 da 2,04% y T-034, 1,9%. Hay que reconciliar la ventana o el denominador antes de
  mostrarlo.'
- NRR/GRR y retención se calculan sobre pagos observados, no son retención contractual.
- 'Antes de llamar churn o MRR a lo observado hacen falta una regla de normalización y una ventana de gracia: los
  atrasos y los pagos multimes inflan churn, reactivación y expansión (F-136).'
- El ARPA de entrada se mide con monto estabilizado (segundo pago o monto usual), no con el primer pago (F-139).
- 'D-007 (activa) dejó las métricas definitivas fuera de etapa: esto es una propuesta.'
visual_intent: 'Jerarquía: del resultado (MRR) a los drivers y la economía unitaria, con cada métrica marcada según
  qué tan medible es hoy.'
hugo_wording: Qué métricas propondrías que hoy no existen (MRR, ARR, ARPU, CAC, LTV, Churn, UCM) y cómo medirlas,
  robustecerlo y bajar lo que tenga sentido.
