id: C-009
type: claim
key: metricas-semaforo
question: ¿Qué métricas propondrías que hoy no existen y cuáles se pueden calcular ya?
headline: 'Proponemos un árbol de ingreso recurrente con semáforo: qué se mide hoy y qué no'
answer: 'En verde, con nombre honesto: MRR pagado observado y su puente, clientes activos, ARPA por cliente (lo
  que se pide como ARPU; no hay datos por usuario), churn observado junto a uno con ventana de gracia, NRR/GRR de
  la base y métricas por cohorte; el ARR, solo como run-rate anualizado. El churn muestra por qué importa el nombre:
  el observado baja de 3,52% en 2022 a 2,04% en 2024, mientras el que no vuelve a pagar en un trimestre pasa de
  0,98% a 0,96%. En rojo, porque piden datos nuevos: CAC en COP y por motion o canal, payback, LTV con margen, LTV:CAC
  y UCM. Hoy solo cabe un «LTV empírico de ingreso» por cohorte, a horizonte fijo.'
