key: metricas-cac-proxy
question: ¿Tenemos hoy un CAC que podamos usar?
headline: 'Hoy solo existe S&M por primer pagador en unidades reportadas: no es CAC'
answer: 'El S&M total por primer pagador observado pasa de 0,105 u en 2022 a 0,036 u en 2024 (−66%), en una unidad
  sin escala a COP. Su nivel depende de si SoftwareTools y Freelance cuentan como Habilitación comercial: sin ellos,
  queda en 0,093 u y 0,034 u. Leerlo como CAC o como mejora de eficiencia es prematuro: el gasto no se liga a clientes
  concretos y el denominador cuenta primeros pagos, no adquisiciones acordadas.'
