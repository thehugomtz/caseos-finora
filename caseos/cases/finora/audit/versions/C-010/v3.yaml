id: C-010
type: claim
key: metricas-cac-proxy
question: ¿Hay CAC hoy?
headline: 'Hoy solo existe S&M por primer pagador en unidades reportadas: no es CAC'
answer: 'El S&M total por alta pasa de 0,105 u en 2022 a 0,036 u en 2024 (−66%), en una unidad sin escala a COP.
  Su nivel depende de si Habilitación cuenta como gasto comercial: pesa 12% del S&M en 2022 y 4% en 2024, y el gasto
  por alta pasa de 0,11 a 0,04 incluyéndola y de 0,09 a 0,03 sin ella. Propuesta: para tener CAC en COP y por funnel,
  Finora documenta la unidad del gasto, acordamos qué es adquirir un cliente (Won, primer pago o suscripción activa)
  y el gasto se registra por canal y funnel. Con eso el CFO decide el payback por funnel.'
