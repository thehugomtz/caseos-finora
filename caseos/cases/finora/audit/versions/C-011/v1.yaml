id: C-011
type: claim
key: hipotesis-arbol
question: ¿Qué podría explicar «más leads, pero no más ventas» y qué dato validaría o descartaría cada explicación?
headline: Proponemos descartar primero artefactos de medición y después contrastar causas ToFu y BoFu
answer: 'Antes de las causas, la premisa: con pagos, «no más ventas» se sostiene en jul–oct del último año frente
  al anterior, pero no en mar–oct, así que depende de la ventana. El árbol separa los artefactos —conteo, es decir,
  si la demanda creció de verdad (H-001); mezcla (H-002); y tiempo de exposición (H-003 y la parte de H-004 en que
  compran más tarde y terminan igual)— de las explicaciones a contrastar: calidad al entrar (H-005, ToFu), atención
  y capacidad (H-006), el tramo post-SQL (H-007, BoFu) y la oferta, es decir producto, precio o condiciones (H-008,
  BoFu). Las entradas únicas con fecha (con canal, motion y segmento) y su vínculo con el pago bastan para distinguir
  H-001 a H-004. H-005 a H-007 necesitan datos que suelen estar en un CRM, aunque no siempre con su historia, y
  H-008 pide más que las razones de pérdida.'
