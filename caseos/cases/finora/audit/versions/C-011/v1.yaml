limitations:
- Propuesta de especialista (R-010), pendiente de tu aceptación. F-126 viene de fuente sin verificar y F-129 es
  de confianza baja.
- 'Con los datos del caso no se valida ni se descarta ninguna de H-001 a H-008: no hay entradas ni vínculo lead→pago.'
- 'H-004 no es toda artefacto: solo lo es «compran más tarde y terminan igual». «Compran menos aun con seguimiento
  comparable» es una diferencia real (X-017).'
- La caída del último tramo puede ser en parte un efecto de borde o de rezago de los pagos (H-029).
- Calidad, atención, post-SQL y oferta son explicaciones a contrastar, no causas confirmadas (D-003).
visual_intent: 'Descarte por eliminación: primero se podan los artefactos; lo que queda son causas, cada una con
  el dato que la decide.'
hugo_wording: Definir qué hipótesis ToFu y BoFu (demanda, calidad, velocidad de atención, conversión post-SQL) podrían
  estar afectando su motor y qué datos validarían o descartarían cada una; aquí no hay research en data, es una
  propuesta.
