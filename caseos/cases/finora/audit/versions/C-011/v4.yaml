id: C-011
type: claim
key: hipotesis-arbol
question: ¿Qué hipótesis ToFu y BoFu podrían explicar «más leads, pero no más ventas» y en qué orden se descartan?
headline: Proponemos descartar primero artefactos de medición y después contrastar causas ToFu, MoFu y BoFu
answer: '«Llega más gente» es lo que dice el CRO, no un dato del caso: los datos no traen leads. El paso 1 ya se
  hizo con los pagos. Sin oct-24, las altas por mes de 2024 son 56, frente a 54 en 2023. Altas y reactivaciones
  van en flujos separados: 1.476 clientes distintos con alta, 0 con pago previo y 468 reactivaciones aparte. El
  cambio de ID no se puede verificar, aunque en 2023 el emparejamiento por monto e industria con churns recientes
  (175) no supera al placebo (196). El estancamiento de altas queda como señal para contrastar con causas, no como
  artefacto. Después, en orden: artefactos del lado de leads (necesitan el CRM) → ToFu → MoFu → BoFu → después del
  cierre. En cada paso se comparan cohortes de entrada a igual edad y el cambio se parte en volumen, mezcla y tasa
  por funnel.'
