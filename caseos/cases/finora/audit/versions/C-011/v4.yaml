limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- Con los pagos solo se acotan los artefactos del lado de pagadores; los del lado de leads necesitan el CRM.
- 'La premisa depende de la ventana: con pagos, la caída de primeros pagadores está en jul–oct 2024 (F-125, F-204,
  X-106). Hay que fijar el periodo con el CRO.'
- En 2024 el placebo casi no tiene pares (T-100), probablemente porque el panel termina en oct-24. La prueba de
  IDs solo sirve para 2022–2023.
visual_intent: 'Escalera de descarte: cada peldaño cierra artefactos antes de pasar a causas.'
hugo_wording: Definir que hipótesis ToFu y BoFu podrían estar afectando su motor de acuerdo a su problema definido
  y qué datos validarían o descartarían cada una
