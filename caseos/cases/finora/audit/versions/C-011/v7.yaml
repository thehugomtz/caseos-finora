limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- 'No se afirma que la medición quedó descartada: con los pagos solo se acotan las revisiones del lado de pagadores.'
- No se puede verificar si un primer pagador es un negocio que ya pagaba con otro ID (F-202). En 2024 el placebo
  no sirve porque hay pocos churns posteriores.
- Primer pago no es Won. La ventana jul–oct 2024 es corta y puede incluir compra adelantada (H-066, H-075).
visual_intent: 'Filtro: la premisa pasa por las revisiones de medición del lado de pagos y la brecha sigue en pie;
  lo del lado de leads queda en espera del CRM.'
hugo_wording: Definir qué hipótesis ToFu y BoFu podrían estar afectando su motor y qué datos validarían o descartarían
