limitations:
- Propuesta de especialista (R-014), pendiente de tu aceptación. F-120 viene de fuente sin verificar.
- 'No se responde con los datos del caso: no hay entradas, grupo de entrada, SDR/AE ni tiempos de contacto.'
- El gasto de Team/Payroll no mide la capacidad de SDR/AE (X-011, X-014).
- Self Service como grupo de control (F-123, fuente sin verificar) solo vale si existía sin SDR/AE en ambos periodos
  (X-012). Por eso queda fuera del claim.
- Las bandas de ajuste se validan en el periodo base antes de usarlas; los experimentos naturales van antes que
  uno aleatorio.
visual_intent: 'Partición: el cambio de compra se parte en mezcla de ajuste (calidad) vs tasa dentro de banda (capacidad),
  con la carga semanal como moderador.'
hugo_wording: P. ej. la capacidad comercial instalada no alcanza la demanda generada, o la calidad de la máquina
  de leads bajó.
