id: C-012
type: claim
key: hipotesis-capacidad
question: ¿La capacidad comercial no alcanza la demanda generada, o bajó la calidad de la máquina de leads?
headline: Capacidad y calidad se separan comparando mezcla contra tasa por grupo de entrada
answer: Si empeora la mezcla de ajuste al entrar, apunta a calidad (H-005); si cae la tasa dentro de cada banda
  de ajuste, sobre todo en entradas atendidas lento y en semanas de alta carga, apunta a capacidad (H-006). El dato
  mínimo es una tabla de entradas con el ajuste congelado al entrar, la fecha del primer contacto humano y la compra
  en ventana fija, más un roster semanal de SDR/AE que distinga el ramp. H-028 plantea que ambas pueden operar a
  la vez (con más volumen, los equipos dejarían sin trabajar primero las entradas que perciben peores), así que
  la comparación se hace por grupo de entrada, entre un periodo base y el periodo de caída.
