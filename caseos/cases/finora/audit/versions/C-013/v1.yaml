id: C-013
type: claim
key: operar-fuentes
question: ¿Qué hace falta en la capa técnica para que el CRO opere el funnel de forma recurrente?
headline: Proponemos primero definiciones y fuentes comunes, unidas por un ID de cuenta
answer: 'La capa técnica: CRM con motion e historial de etapas; analítica digital que registre el Canal de adquisición
  desde la primera visita; y facturación con MRR contratado y estado de suscripción. Todo se une por un ID de cuenta
  en el modelo analítico que ya existe. La facturación va primero: el lado Revenue ya se puede operar mes a mes,
  pero con pagos observados el CRO confundiría el momento del cobro con churn y expansión. El lado Growth no está
  en los datos del caso: sin motion, canal ni fechas de hitos no hay conversión ni CAC por motion, y hoy solo se
  ve la mezcla de gasto.'
