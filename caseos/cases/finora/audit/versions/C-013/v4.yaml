id: C-013
type: claim
key: operar-fuentes
question: ¿Qué base técnica necesita el CRO para operar el funnel y qué puede operar desde el primer mes?
headline: Proponemos primero definiciones y fuentes comunes, unidas por un ID de cuenta
answer: 'Capa de datos: un CRM con puerta, canal e historial de etapas fechado (quién movió cada tramo); analítica
  digital que registre el canal desde la primera visita; facturación con suscripción, tarifa, descuento y periodo
  de servicio; y un ID de cuenta que cruce CRM, producto y cobro. Desde el primer mes, con los pagos, se opera el
  nudo y el lado derecho: primeros pagos, ticket estabilizado, puente del MRR pagado observado, churn observado
  junto al persistente y la vuelta de pagadores. Hay que saber que hoy el cobro se confunde con churn y con expansión.
  Todo el lado izquierdo espera al CRM: entradas por puerta, conversión por cohorte, estancamientos, carga y tiempos.
  La prueba más rápida es que Finora etiquete hacia atrás, desde el CRM, a los pagadores observados.'
