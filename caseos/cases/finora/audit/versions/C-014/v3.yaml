id: C-014
type: claim
key: operar-foros
question: ¿Qué decisiones le permite tomar al CRO y en qué foro?
headline: 'Proponemos un tablero por foro atado a decisiones: semanal, mensual y trimestral'
answer: 'Semanal · pregunta: ¿qué entradas y oportunidades se están atorando? · métricas: estancamientos por etapa,
  cobertura de primer contacto y carga por SDR/AE · decisión: reasignar SDR/AE entre funnels, reactivar o descalificar
  · dueños: el CRO con los líderes de SDR y AE.

  Mensual · pregunta: ¿qué funnel y qué canal traen clientes que se quedan? · métricas: alcance a primer pago por
  cohorte y puerta, ticket estabilizado y permanencia temprana por canal · decisión: mover inversión entre canales
  y ajustar la regla de calificación o de reparto · dueños: el CRO con Marketing y Finanzas.

  Trimestral · pregunta: ¿dónde poner capacidad e inversión y qué pasa con el precio de entrada? · métricas: payback
  por funnel cuando exista CAC en COP, retención por cohorte y mix de rutas · decisión: revisar precio o plan de
  entrada, y contratar o reasignar capacidad · dueños: CEO, CFO y CRO.

  Los análisis ad hoc se abren por hipótesis de la matriz. Los agentes de IA y la atribución van encima: trabajan
  solo sobre métricas gobernadas y entran con un piloto controlado, y la atribución reparte crédito, no prueba causa.'
