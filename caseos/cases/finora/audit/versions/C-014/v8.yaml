id: C-014
type: claim
key: operar-foros
question: ¿Qué solución analítica le permite al CRO operar el funnel de forma recurrente y qué decisiones le habilita?
headline: Proponemos una vía formal por foro y otra de agentes para el día a día
answer: 'Vía formal: dashboards automatizados por foro sobre métricas gobernadas. El foro semanal decide oportunidades,
  estancamientos y handoffs; el mensual, la mezcla de ruta y canal; el trimestral, la inversión y la capacidad.
  Cuando un foro lo pida se suman análisis ad hoc por hoja del árbol. Vía del día a día: agentes de IA montados
  encima, que solo lean métricas gobernadas y entren con un piloto controlado; la atribución reparte crédito, pero
  para decidir presupuesto hacen falta experimentos. Antes de todo esto, operar el funnel pide la cuenta común (un
  ID que una CRM, producto, facturación y pagos) y el historial de etapas con fechas, que el CRM suele traer de
  forma nativa.'
