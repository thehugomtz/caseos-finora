limitations:
- 'Las decisiones del CRO por foro son propuesta: todavía no están definidas con Finora.'
- 'La cuenta común y el historial de etapas no están en el caso: las tres fuentes de hoy son de después del pago
  (F-238). El as-is vs to-be completo queda en anexo (C-013, R-033).'
- Lo que no se capture desde ya no se reconstruye después, salvo que Finora tenga historial en sus sistemas (F-242).
- Con pagos observados, el CRO confundiría el momento de cobro con churn y expansión. La facturación es la primera
  pieza técnica (F-145).
- D-007 sigue activa y choca con D-018 (propuesta) sobre si las propuestas de diseño entran a la historia.
visual_intent: 'Split: una vía formal que baja por foros atados a decisiones y una vía de agentes para el día a
  día, las dos encima de una base común (cuenta y etapas).'
hugo_wording: 'Proponemos dos vías: una formal y ejecutiva a través de dashboards adhoc a los foros recurrentes
  y otro para preguntas del día a día a través de agentes.'
