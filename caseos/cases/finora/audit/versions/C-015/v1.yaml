id: C-015
type: claim
key: pricing-entrada
question: ¿Qué data observable de pricing introductorio podemos sacar?
headline: Lo observable es el primer y segundo pago; el descuento no es verificable
answer: 'La mediana del primer pago observado es COP 63,0 mil en 2022, COP 36,8 mil en 2023 y COP 42,0 mil en 2024;
  la del segundo pago queda por debajo: COP 46,2 mil, COP 35,0 mil y COP 37,8 mil. El segundo pago coincide exacto
  con el primero en 73,5%, 90,3% y 77,3% de los primeros pagadores. El primero supera al segundo 1,5× o más en 23,2%,
  7,1% y 11,6%, y lo inverso ocurre en 1,1%, 1,5% y 0,9%. Son datos de comportamiento del monto, no de descuento:
  sin catálogo de precios, ninguno se puede leer como precio introductorio.'
