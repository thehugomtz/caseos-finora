id: C-015
type: claim
key: pricing-entrada
question: ¿Qué data observable de pricing introductorio podemos sacar?
headline: Lo observable es el primer y segundo pago; el descuento no es verificable
answer: 'Del pricing de entrada solo se observa lo que pagan las altas en sus primeros meses. La mediana del primer
  pago es COP 63,0 mil en 2022, COP 36,8 mil en 2023 y COP 42,0 mil en 2024, y la del segundo pago, COP 52,5 mil,
  COP 36,8 mil y COP 38,9 mil. En 2022 el primer pago supera con holgura al segundo en 23,2% de las altas, frente
  a 7,1% en 2023 y 11,6% en 2024, y el segundo pago repite exacto el primero en 73,5%, 90,3% y 77,3%: un patrón
  que coincide con pagos iniciales grandes o cobros retroactivos en 2022 más que con un cambio de tarifa. Precio
  de lista, descuento introductorio, crédito o pausa no se pueden separar: el dato es un monto por cliente y mes,
  sin catálogo de precios.'
