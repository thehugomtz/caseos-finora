id: C-016
type: claim
key: monto-dos-lecturas
question: ¿Por qué con los datos actuales no se puede contestar cuánto cambió el MRR por suscripción, tarifa o descuento?
headline: Con solo el monto pagado, cada ejemplo del CFO admite lecturas distintas
answer: 'El dato es cliente × mes × monto pagado: en los ejemplos construidos del CFO, un cambio de suscripción
  y un descuento dan exactamente el mismo monto, y no hay catálogo de precios, descuentos, créditos ni pausas. Además,
  el monto es consistente con cobro más que con contrato: 25,3% del movimiento bruto sin primeros pagadores (COP
  282,8 millones entre mar-22 y sep-24) vuelve exacto al nivel previo al mes siguiente. Es una prueba de lo que
  se puede distinguir, no una lectura de lo que pasó.'
