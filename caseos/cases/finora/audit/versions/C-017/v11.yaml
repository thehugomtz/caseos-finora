limitations:
- 'Es propuesta: el histórico no trae tarifas ni descuentos y no se afirma que hubo descuentos; el caso habla de
  introducirlos.'
- La convención de cómo pega el descuento en el MRR la decide y declara el CFO; la propuesta se aparta del default
  del mercado (F-236).
- 'Qué vista aplica (MRR neto, revenue o caja) depende de si los contratos son mensuales cancelables o a plazo fijo:
  falta confirmarlo (F-153).'
- La relación entre descuento y clientes de menor valor es evidencia externa, no dato de Finora; se mide con cohortes
  marcadas y un grupo comparable (F-154).
- Si el source no se captura para todos los clientes, el código de descuento quedaría como la única atribución (H-073).
- 'El revenue que dejamos de capturar no tiene cifra histórica: se mide hacia adelante.'
visual_intent: 'Separate: el descuento sale de lo contratado y del precio de lista como pieza propia, con su origen
  y su fecha de fin.'
hugo_wording: Cómo debería Finora introducir descuentos temporales (mecanismo propuesto, implicaciones multidisciplinarias,
  preguntas del CFO contestadas con el modelo propuesto).
