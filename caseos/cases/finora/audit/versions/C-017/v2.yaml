id: C-017
type: claim
key: descuento-objeto
question: ¿Cómo introducir descuentos temporales sin perder la respuesta a «¿por qué cambió nuestro MRR?»?
headline: Proponemos que el descuento exista como objeto propio, con fecha de fin
answer: Cada descuento se registra con tipo, monto, inicio, fin, motivo, Canal y aprobador, separado de la cantidad
  contratada y del precio de lista, y se lee desde la factura. El puente de MRR suma líneas propias de «descuento
  nuevo/aumentado» y «descuento reducido/terminado». Las herramientas revisadas (ChartMogul, Chargebee, Stripe),
  según cómo se configuren, lo mezclan con expansión o contracción o lo excluyen. Usadas tal cual, el fin de un
  descuento aparecería como expansión, y una subida de suscripción compensada por un descuento, como «sin cambio».
