limitations:
- 'Pendiente de tu aceptación: F-233 a F-237 y los demás findings citados están propuestos.'
- 'No afirmamos que hubo descuentos en el histórico: el diseño es hacia adelante. Los ejemplos de promociones de
  R-034 son ilustrativos, no datos de Finora.'
- No sabemos si Finora captura hoy el source en el alta de todos los clientes. Si no, el código de descuento se
  volvería la única atribución (H-073).
- Sin la regla «precio especial = lista + descuento», los descuentos negociados, de partner o de retención quedarían
  como precio menor (H-074).
- Los efectos comerciales del descuento (cohortes de menor valor, churn al vencer) son evidencia externa, no de
  Finora (F-154, H-049).
visual_intent: 'Trazabilidad: cada peso de descuento se sigue desde la oferta y su canal hasta su línea del puente,
  separado de lo contratado; lo digital y lo físico llegan al mismo objeto con distinto source.'
hugo_wording: «C-017 lo mismo quiero ver un modelo de datos y considera mas casuisticas, un descuento podría provenir
  de una promocion tanto digital como fisica y si es digital hay que considerar el source tambiem»
