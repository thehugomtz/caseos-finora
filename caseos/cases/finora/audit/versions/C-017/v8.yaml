limitations:
- 'Funciona hacia adelante: el histórico no trae tarifas ni descuentos, y no hay cifra histórica de revenue no capturado.'
- La evidencia externa asocia la adquisición con descuento a clientes de menor valor, y el churn al vencer el descuento
  tiene otras causas posibles (F-154).
- La convención «fin de descuento no es expansión» se aparta del default del mercado y hay que declararla (F-236).
- Si el source solo vive en el código, el código se vuelve la única atribución (H-073). Sin la regla «precio especial
  = lista + descuento», parte de los descuentos quedaría como precio menor (H-074).
- La lámina de convención y capas (C-018) queda en anexo; aquí queda en una línea.
visual_intent: 'Converge: todos los orígenes (promoción, negociación, retención, partner) desembocan en un solo
  objeto descuento, separado de la suscripción y del precio de lista, con sus implicaciones por área.'
hugo_wording: Cómo debería Finora introducir descuentos temporales (mecanismo propuesto, implicaciones multidisciplinarias,
  preguntas del CFO contestadas con el modelo propuesto).
