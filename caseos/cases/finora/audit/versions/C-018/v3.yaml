id: C-018
type: claim
key: descuento-capas
question: ¿Qué convención de MRR usar y qué vistas se separan cuando hay descuentos?
headline: El CFO decide la convención; con descuentos, MRR neto, revenue y caja se separan
answer: No hay un estándar de mercado para tratar descuentos temporales en el MRR, y la convención «solo neto» borra
  justo lo que pregunta el CFO. Proponemos mostrar las capas de MRR de lista, descuento y MRR neto, más revenue
  reconocido y caja, y que el CFO declare cuál es la oficial. Qué vista aplica depende de si los contratos de Finora
  son mensuales cancelables o a plazo fijo, algo que el caso no dice.
