id: C-018
type: claim
key: descuento-capas
question: ¿Cómo debería Finora introducir descuentos temporales sin perder el porqué del MRR?
headline: El CFO decide la convención; con descuentos, MRR neto, revenue y caja se separan
answer: 'Mecanismo Propuesto: el CFO declara la convención, porque no hay un estándar de mercado y la de C-020 se
  aparta del default de herramientas como ChartMogul · el MRR se reporta en dos capas, lista y neto, y el descuento
  es la diferencia: el revenue que dejamos de capturar, abierto por origen · las cohortes que entren con descuento
  se marcan y se comparan con cohortes sin descuento. Con descuentos, el MRR neto, el revenue reconocido y la caja
  se separan; cuál vista manda depende de si los contratos son mensuales cancelables o a plazo fijo. Implicaciones
  Multidisciplinarias: Finanzas fija la convención y el reconocimiento; Marketing y Ventas crean promociones, códigos
  y aprobaciones; Producto y Billing registran el descuento con su vigencia; Data arma la foto de cierre y el puente.'
