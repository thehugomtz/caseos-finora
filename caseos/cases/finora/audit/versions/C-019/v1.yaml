id: C-019
type: claim
key: modelo-escalera
question: ¿Cómo separar el valor de la suscripción del precio efectivamente pagado?
headline: La Propuesta de Modelo de datos separa el valor en una escalera con vigencias
answer: 'El panel actual es cliente × mes × monto pagado: caja, no contrato. La propuesta registra, por suscripción
  y mes, cada peldaño de valor con su fuente y su vigencia: tarifa de lista (price_book_entry, por versión de plan,
  periodo y moneda, con valid_from/valid_to) → precio pactado (subscription_item_version: plan, cantidad, add-ons)
  → descuento con inicio, fin y motivo → MRR neto → facturado → cobrado. Así el MRR se guarda en bruto, descuento
  y neto por separado, y la convención oficial queda como decisión del CFO.'
