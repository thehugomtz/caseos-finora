limitations:
- 'Es propuesta: hoy el modelo es cliente × mes × monto pagado y no separa suscripción, tarifa, descuento ni momento
  de cobro (F-130).'
- Se sabe qué evidencia confirmaría cada componente; no se sabe si Finora la tiene (F-133).
- 'La regla de «Descuento» es convención, no hecho: se aparta del default del mercado y el CFO la declara (F-236,
  F-151).'
- Las reglas que son decisiones de negocio quedan por escribir antes de construir (F-241).
- Los ejemplos de clasificación son ilustrativos, no datos del caso.
visual_intent: 'Ladder: el valor baja peldaño a peldaño, de la tarifa de lista a lo cobrado, y cada movimiento del
  mes se ubica en el peldaño donde nace.'
hugo_wording: 'Cómo separar el valor de la suscripción del precio efectivamente pagado: propuesta de modelo de datos
  (campos, tablas, definiciones); el inicio y fin de un descuento probablemente lo integra la misma propuesta de
  modelo de datos.'
