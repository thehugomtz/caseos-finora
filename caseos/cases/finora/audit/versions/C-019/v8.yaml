id: C-019
type: claim
key: modelo-escalera
question: ¿Cómo separar el valor de la suscripción del precio efectivamente pagado y clasificar el inicio y el fin
  de un descuento?
headline: La Propuesta de Modelo de datos separa el valor en una escalera con vigencias
answer: 'Proponemos una escalera por suscripción y mes, en la que cada peldaño tiene su fuente y su vigencia: tarifa
  de lista → precio pactado (plan, cantidad, add-ons) → descuento → MRR neto → facturado → cobrado. Los movimientos
  de MRR (nuevo, expansión, contracción, churn, reactivación, tarifa y «Descuento») se clasifican comparando cierres
  de mes sobre los peldaños de valor. Lo facturado y lo cobrado son caja y solo generan un efecto de cobro, y el
  panel actual queda como capa de monto pagado observado que se concilia contra lo cobrado. Regla de clasificación:
  si la suscripción no cambia, el inicio o el fin de un descuento va a la línea «Descuento», nunca a contracción
  ni a expansión. Si suscripción y descuento cambian el mismo mes, primero se mide el efecto de la suscripción con
  los términos de descuento previos y el resto va a «Descuento». Quien sale con un descuento vigente cuenta como
  churn, sin registrar un fin de descuento.'
