id: C-020
type: claim
key: descuento-clasificacion
question: ¿Cómo clasificar inicio y fin de un descuento para que no se confundan con contracción o expansión reales?
headline: Si la suscripción no cambia, inicio o fin de descuento va a «Descuento»
answer: 'La clasificación compara cierres de mes por componente (suscripción, tarifa, descuento). Si la suscripción
  no cambia, el inicio o el fin de un descuento va a una línea «Descuento» del puente y no cuenta como contracción
  ni expansión; si cambian suscripción y descuento a la vez, cada efecto va a su línea. Hoy el puente observado
  no puede hacerlo: en 2024 registra COP 13,6 millones de expansión observada y −COP 21,5 millones de contracción
  observada con lectura indeterminada, y parte de esa contracción tiene forma de efecto de cobro (el cliente vuelve
  a su monto usual tras un mes más alto).'
