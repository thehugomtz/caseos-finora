id: C-020
type: claim
key: descuento-clasificacion
question: ¿Cómo clasificar el inicio y el fin de un descuento para que no se confundan con contracción o expansión
  reales?
headline: Si la suscripción no cambia, inicio o fin de descuento va a «Descuento»
answer: 'Regla base: New, Expansión, Contracción, Churn y Reactivación se definen sobre el MRR contratado y el estado
  de la suscripción entre cierres de mes, nunca sobre el monto pagado. La línea «Descuento» se define sobre cambios
  en los términos de los descuentos y lleva su origen (promoción digital o física, negociación, retención o partner).
  Si la suscripción no cambia, el inicio de un descuento es «Descuento (inicio)», con signo negativo, y su fin es
  «Descuento (fin)», positivo: nunca Contracción ni Expansión. Si cambian las dos cosas el mismo mes, se aplica
  una regla secuencial: primero el efecto suscripción, con los términos de descuento del mes anterior; lo que resta
  es efecto descuento. Además: cambio de términos → «Descuento (cambio)»; descuento único → fuera del MRR, resta
  solo en lo facturado; mes gratis → «Descuento (inicio)» con bandera sin cobro, no churn; pausa → estado de suscripción,
  no descuento; downgrade de retención → Contracción; quien sale con descuento → Churn por su neto, sin «Descuento
  (fin)». Control: por suscripción y mes, la suma de líneas iguala el cambio del MRR neto.'
