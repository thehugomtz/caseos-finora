id: C-021
type: claim
key: funnel-etapas
question: ¿Qué etapas tiene cada funnel, con qué criterio se entra y se sale, y quién es el dueño?
headline: Cada funnel tiene sus etapas, criterios de salida y dueño; los tramos se pueden saltar
answer: 'Executive, con dueño SDR hasta SQL y AE desde Demo: New → Working SDR → Engaged SDR → SQL SDR → Demo AE
  → Proposal AE → Won → primer pago. Se sale de cada etapa con un cambio fechado en el CRM; lo primero es acordar
  qué hace a un lead Engaged o SQL. Self Service, con dueño Producto/Growth: canal → registro → activación (si existe)
  → checkout → primer pago. Falta saber si hay prueba gratis, freemium o pago al registrarse. Hybrid usa las etapas
  del tramo que recorre, con dueño por tramo: la persona en los tramos con SDR/AE y el producto en los tramos que
  el cliente hace solo. Su primer tramo lo marca como A o B. Reactivate: estancado más allá del umbral de su etapa
  → reactivado (contacto de ida y vuelta o regreso por su cuenta) → asignado a un funnel, con dueño SDR o RevOps.
  Cada hito se mide como «alcanzó o superó», para que las etapas saltadas no rompan las tasas.'
