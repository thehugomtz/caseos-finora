limitations:
- 'Pendiente de tu aceptación: F-209, F-211, F-210, F-191 y F-155 están propuestos.'
- El brief da la secuencia y un traspaso SDR → AE que ocurre «sobre todo» y «normalmente». Los criterios de etapa
  no están definidos.
- Las etapas de Self Service e Hybrid y los dueños son una propuesta, no las de Finora.
- Parte de lo que parecen recorridos distintos puede ser cómo se registra en el CRM (H-051).
