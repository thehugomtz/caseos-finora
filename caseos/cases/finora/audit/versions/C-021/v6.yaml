limitations:
- 'Es una propuesta: el caso no trae CRM ni etapas, y hoy no se puede medir ninguna etapa antes del primer pago
  ni la puerta (F-223, F-191).'
- Las etapas del AE (Demo, Proposal) y la entrada por referido o partner están por confirmar contra el CRM de Finora.
- No sabemos si Self Service existe como compra sin humano, ni si hay prueba gratis, freemium o pago al registrarse
  (Q-046).
- Qué cuenta como intervención (Q-063) y el umbral de estancamiento por etapa (Q-064) son parámetros a acordar con
  Finora, no estándares de mercado.
- Usa tus definiciones de Hybrid B y Reactivate. R-035 las había cambiado y aquí no se usa esa versión.
- Una entrada que pide persona y que nadie atiende termina como Self Service con bandera (H-072).
- Comparar la conversión de Hybrid con la de Self Service o Executive es asociación, no el aporte de la intervención
  (H-050).
- La vuelta de pagadores que se ve en pagos es un loop de Revenue, no Reactivate (F-213).
visual_intent: 'Split: una lista maestra de etapas de la que cada ruta toma solo sus tramos, con el dueño de cada
  tramo y el canal como atributo de la entrada. Reactivate aparece como loop que devuelve estancados a su ruta.'
hugo_wording: Cómo definir y medir el funnel si no todos lo recorren igual (self-serve, entrada directa a SQL, estancamientos
  de semanas). «6 se puede ir, pero si hay alguna nota importante plasmarla en 7, solo si es demasiado importante»
  (N-056).
