id: C-022
type: claim
key: metricas-catalogo
question: ¿Qué métricas mide cada funnel, cuáles se calculan hoy y en qué foro se leen?
headline: 'Proponemos un catálogo por funnel: definición, si existe hoy, fuente faltante y foro'
answer: 'Executive: SQL u oportunidades por cohorte, alcance SQL→Won en ventana fija, ciclo de venta con el % aún
  abierto, estancamientos por etapa y Won→primer pago. Falta el historial de etapas del CRM; se lee en el foro semanal.
  Self Service: registros por canal, activación (si existe) y registro→primer pago en ventana. Faltan los eventos
  de producto y el canal de origen; se lee en el foro mensual. Hybrid: tasa de escalamiento (entradas de producto
  que reciben a una persona antes de pagar), mix de rutas dentro de cada puerta, tiempo a primer contacto y carga
  por SDR/AE. Faltan las actividades de ida y vuelta y el roster; se lee en los foros semanal y mensual. Reactivate:
  estancados por etapa, reactivados, asignados y su primer pago con bandera; foro semanal. Desde el nudo, lo único
  que se calcula hoy con nombre honesto es: primeros pagos, ticket de entrada estabilizado, permanencia temprana,
  churn observado y persistente, MRR pagado observado y S&M por alta en unidades reportadas. Se lee en los foros
  mensual y trimestral.'
