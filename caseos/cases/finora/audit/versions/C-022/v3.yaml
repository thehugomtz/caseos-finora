id: C-022
type: claim
key: metricas-catalogo
question: ¿Cómo se evita que una métrica aparezca en dos lugares o con dos fórmulas?
headline: Cada métrica vive en un solo lugar del catálogo, con dueño, fuente y foro
answer: 'El catálogo no suma métricas: gobierna las del funnel (C-006) y las comunes (C-009). Cada métrica entra
  una sola vez con nombre, fórmula versionada, grano, dueño, semáforo de hoy, el evento o la tabla que le falta
  en el to-be (C-013) y el foro que la usa (C-014). Reglas MECE: un nombre, una fórmula y un lugar; puerta, ruta,
  canal, industria y cohorte son cortes; las tasas de etapa se leen dentro de su ruta y solo la capa común se compara
  entre puertas. Controles de cada mes: las entradas por puerta suman el total; los primeros pagos por ruta, más
  los que no se cruzan con el CRM, igualan los primeros pagos del mes; y los puentes de clientes y de MRR cierran.'
