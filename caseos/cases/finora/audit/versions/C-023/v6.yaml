id: C-023
type: claim
key: hipotesis-matriz
question: ¿Qué hipótesis ToFu y BoFu podrían explicar «más leads, pero no más ventas», ordenadas sin solapes?
headline: 'Proponemos un árbol MECE: cada pedazo de la brecha cae en una sola hoja'
answer: 'Antes del árbol se fija qué es «venta» y qué ventana se compara, porque en los pagos la premisa cambia
  según la unidad y el trimestre que se elijan. Después, la brecha se reparte en orden por identidad (validez del
  lead, puerta, mezcla contra tasa, etapa y cobro) para que cada pedazo caiga en una sola hoja. Las ramas son: el
  aumento de New no es demanda comprable (no-prospectos, desfase o cambio de definición, misma demanda por otra
  puerta); entra peor mezcla (calidad al entrar); la caída está antes del SQL (capacidad y primer toque, estancados);
  está después del SQL (incentivos del SDR, decisión en Proposal); o está entre Won y el primer pago. Con el modelo
  del caso no se puede validar ni descartar ninguna hoja antes del cobro, y del cobro solo se ve el arranque: es
  una propuesta para correr con los datos del CRM.'
