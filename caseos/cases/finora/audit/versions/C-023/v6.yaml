limitations:
- 'Hojas e IDs: no-prospectos H-052, desfase o definición H-027/H-069, misma demanda por otra puerta H-053, calidad
  al entrar H-005, capacidad H-006, estancados H-055, incentivos del SDR H-054, decisión en Proposal H-056, Won
  → pago H-057.'
- La forma del árbol toca D-001 (tres ramas) y D-003. Si los reemplaza lo decides tú (X-150).
- Metas o comisiones de SDR/AE, precio o competencia son causas candidatas sin evidencia en el caso.
- 'La caída post-SQL no se atribuye al AE: puede nacer antes del traspaso (SQL inflados) o en la oferta.'
- Con los pagos solo se acotan artefactos del lado de pagadores; los del lado de leads piden el CRM.
- El árbol completo con las palancas del CRO (R-032) y C-011 quedan en anexo.
visual_intent: 'Split: la brecha se reparte en ramas ordenadas y cada pedazo cae en una sola hoja. El Paso 0 (qué
  es venta y qué ventana) es la puerta de entrada al árbol.'
hugo_wording: Definir qué hipótesis ToFu y BoFu (demanda, calidad, velocidad de atención, conversión post-SQL) podrían
  estar afectando su motor; aquí no hay que hacer research en data, es una propuesta.
