limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- R-011 ubica buena parte de la contracción justo después de un primer pago o una reactivación (X-037), y R-028
  solo prueba la reversión al mes siguiente (X-100). Se reconcilian así, sin una cifra conjunta.
- Una parte del MRR de reactivación no encaja en firmas de cobro (T-082). Podrían ser regresos reales (H-064).
- El puente normalizado exacto no es medible sin periodo de servicio (F-186).
