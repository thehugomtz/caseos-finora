id: C-024
type: claim
key: observable-semaforo
question: Con solo cliente, mes y monto pagado, ¿qué podemos afirmar del ingreso y qué no?
headline: Con cliente, mes y monto se ve qué cambió, no por qué
answer: 'Con el monto pagado se puede operar hoy el MRR pagado observado y su puente, pero el puente mezcla orígenes.
  En la expansión, 29% del MRR se revierte al mes siguiente, y 25,3% del movimiento bruto sin altas (que suma COP
  282,8 millones entre mar-22 y sep-24) vuelve exacto al nivel previo. En el churn, 44% de los 751 churns observados
  vuelve a pagar al mes siguiente; en la reactivación, la parte cuyo monto cubre los meses del hueco más el corriente
  explica 42,6% del MRR, frente a 11,5% que regresa al monto usual, y el resto, 45,9%, no encaja en esas firmas.
  La contracción, en cambio, no muestra firma de cobro: 88,9% de su MRR sigue igual o más abajo al mes siguiente
  y 4,0% regresa al nivel previo. Sin estado de suscripción ni periodo de servicio no se sabe por qué cambió: antes
  de llamar churn o MRR a esos movimientos hace falta una regla de normalización y una ventana de gracia.'
