limitations:
- 'Es monto pagado observado: sin estado de suscripción, periodo de servicio ni fecha de factura, el puente normalizado
  exacto no es medible, solo se acota (F-186).'
- Las firmas de cobro son lecturas de patrón, no confirmación de atraso o prepago (F-136).
- 'La prueba de la contracción solo mira el mes siguiente: no descarta cobros de primer pago o de reactivación que
  caen en la contracción (X-100).'
- El 44% dice que vuelve a pagar, no con qué monto (X-102, X-145).
- La vuelta de pagadores es un loop de Revenue, no el Reactivate del CRO (F-213).
visual_intent: 'Separate: lo que el monto pagado muestra (qué cambió) frente a lo que no puede decir (por qué);
  dentro del puente, expansión y reactivación se revierten y la contracción se sostiene.'
hugo_wording: 'Qué data observable podemos sacar (S3.1): lo que vemos y lo que no vemos con cliente, mes y monto.'
