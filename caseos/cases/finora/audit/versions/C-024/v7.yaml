limitations:
- La prueba de contracción solo mira el mes siguiente (X-100).
- El 44% vuelve a pagar, pero no necesariamente con el mismo monto (X-102, X-145).
- 'El puente normalizado exacto no se puede medir: no hay periodo devengado por pago (F-186).'
- No se usan etiquetas contractuales (alta, baja, expansión) sin vigencia verificada.
visual_intent: 'Split: lo que el monto deja ver (qué cambió) frente a lo que no separa (por qué), con el semáforo
  verde, amarillo y rojo.'
hugo_wording: 'Revenue: con solo el monto pagado, cada ejemplo del CFO admite dos lecturas (cambio de suscripción
  o descuento).'
