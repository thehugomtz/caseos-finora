id: C-024
type: claim
key: observable-semaforo
question: ¿Qué se puede leer hoy del MRR con cliente, mes y monto, y qué no?
headline: Con cliente, mes y monto se ve qué cambió, no por qué
answer: 'Con cliente, mes y monto se arma el puente del MRR pagado observado, pero el monto mezcla fecha de cobro
  con mes de servicio. 29% del MRR de expansión se revierte al mes siguiente, 44% de los churns observados vuelve
  a pagar al mes siguiente y 42,6% del MRR de reactivación llega con un monto que cubre los meses del hueco más
  el corriente. La contracción no muestra esa firma (88,9% sigue igual o más abajo al mes siguiente), pero tampoco
  dice si fue suscripción, tarifa o descuento. Semáforo: en verde, el MRR pagado observado y su puente, los clientes
  activos, el ARPA, el churn observado y las cohortes; en amarillo, el MRR normalizado y el churn con ventana de
  gracia, que piden una regla que apruebes; en rojo, lista, descuento y MRR contratado.'
