id: C-025
type: claim
key: cfo-casos
question: 'El CFO pregunta: si un cliente pagaba 100 y ahora paga 80, ¿es contracción o descuento? Si la suscripción
  pasa de 100 a 130 con un descuento de 30 y sigue pagando 100, ¿qué pasó? ¿Y si desaparece el descuento? ¿Qué pasa
  con el negocio subyacente y cuánto revenue dejamos de capturar?'
headline: Con el modelo propuesto, cada caso del CFO se lee en su capa
answer: 'Con las cifras del enunciado, como ejemplo. Si pagaba 100 y ahora paga 80, se mira la lista: si el bruto
  bajó a 80, es contracción; si sigue en 100, es un descuento nuevo en su línea. Si la suscripción pasa de 100 a
  130 con un descuento de 30 y sigue pagando 100, se registran una expansión de +30 en suscripción y un descuento
  nuevo de −30, y el neto no cambia. Si después desaparece el descuento y paga 130, esos +30 son fin de descuento,
  no expansión. El negocio subyacente se lee en el MRR de lista, y el revenue que se deja de capturar, en la capa
  de descuento, vigente y por vencer. Hacia atrás no se puede medir, porque el histórico no trae lista ni descuentos.
  El costo real de un descuento pide un grupo comparable, y la convención la decide el CFO. Hoy el puente de monto
  pagado ya confunde cobro con expansión y churn: 29% de la expansión se revierte al mes siguiente y 44% de los
  churns vuelve a pagar al mes siguiente. Lo que se ve es composición, no beneficio comercial.'
