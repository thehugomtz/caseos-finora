limitations:
- 'Los casos son ejemplos del enunciado, no observaciones de Finora: prueban qué se puede distinguir, no qué pasó
  (X-097).'
- Sin precios ni descuentos registrados, una lista mayor con descuento y un precio neto menor dan el mismo monto
  (F-177).
- No hay cifra histórica de revenue no capturado ni puente histórico por tarifa y descuento.
- La composición no es beneficio comercial (F-178). Q-026 junta dos preguntas distintas (X-072).
visual_intent: 'Split por capas: cada caso del CFO cae en la capa que lo explica (suscripción, descuento, neto),
  frente a la lectura única que da hoy el monto pagado.'
hugo_wording: Preguntas del CFO contestadas con el modelo propuesto.
