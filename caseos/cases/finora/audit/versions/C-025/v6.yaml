id: C-025
type: claim
key: cfo-casos
question: '(CFO) Paga 100 y luego 80; la suscripción pasa de 100 a 130 con un descuento de 30 y sigue pagando 100;
  desaparece el descuento: ¿cómo se lee cada caso, qué pasa con el negocio subyacente y cuánto revenue dejamos de
  capturar?'
headline: Con el modelo propuesto, cada caso del CFO se lee en su capa
answer: 'Si paga 100 y luego 80, el modelo lo registra como contracción si bajó la suscripción, o como inicio de
  descuento si el valor de lista no cambió; hoy el panel marca los dos casos como contracción. Si la suscripción
  pasa de 100 a 130 con un descuento de 30 y sigue pagando 100, se registran una expansión de +30 y un inicio de
  descuento de −30, y el neto no cambia; cuando el descuento desaparece, ese +30 va a «fin de descuento», no a expansión.
  El negocio subyacente se lee en el MRR de lista, y el revenue que dejamos de capturar, en la línea «Descuento»
  por origen, de aquí en adelante. Con el histórico solo se ve composición: el MRR pagado por cliente activo baja
  de COP 92,8 mil a COP 57,8 mil (−38%), con la base previa en +5%.'
