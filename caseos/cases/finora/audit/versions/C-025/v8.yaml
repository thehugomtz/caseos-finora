limitations:
- 'Los casos son los ejemplos del enunciado del CFO: prueban qué distingue el modelo, no describen lo que pasó en
  Finora.'
- El puente por capas (lista, descuento y neto) no es construible con los datos del caso (F-168).
- 'No se puede repartir la caída por cliente entre un precio de lista distinto y un descuento: ambos coinciden en
  el mismo monto observado (F-177).'
- 'El −38% no se presenta como deterioro de la salud: todavía no se separan la mezcla de entrada, el precio y las
  salidas.'
- 'El revenue que dejamos de capturar no tiene cifra histórica: el histórico no trae tarifas ni descuentos; se mide
  hacia adelante.'
- La convención de cómo pega el descuento en el MRR la decide el CFO (F-151).
visual_intent: 'Unfold: el mismo pago observado se abre en capas (contratado, descuento, neto) y cada caso del CFO
  cae en una capa distinta.'
hugo_wording: 'Preguntas del CFO contestadas con el modelo propuesto: qué pasa con el negocio subyacente y cuánto
  revenue dejamos de capturar por decisiones comerciales.'
