id: C-027
type: claim
key: funnel-medicion
question: ¿Cómo se mide cada tipo de funnel y qué métricas específicas de cada familia mediríamos en cada uno?
headline: Proponemos medir cada funnel en sus etapas y compararlos solo en resultados comunes
answer: 'Cada funnel se mide con las mismas familias sobre sus propias etapas (volumen de entrada, alcance por etapa
  de la cohorte dentro de una ventana fija, tiempo por tramo y estancamiento), más la métrica de su mecanismo. En
  Executive: speed to lead del SDR y aceptación de SQL por el AE, separando la entrada por New de la entrada directa
  a SQL. En Self Service: alcance de New a Won sin persona. En Hybrid A: tasa de intervención y su uplift. En Hybrid
  B: salida a self-serve, brecha de MRR e incrementalidad del contacto. En Reactivate: tasa de reactivación, re-estancamiento
  y envejecimiento del pool. Entre funnels solo se compara la capa común (Won, MRR inicial, retención temprana,
  CAC y payback), cortada por funnel y conciliada contra las altas observadas en pagos. El funnel se asigna al cierre
  de la ventana con reglas explícitas: ¿nace de un estancado?, ¿quién inició?, ¿hubo toque humano?, ¿quién cerró?
  Hoy no se puede calcular ninguna métrica propia de funnel, porque el modelo empieza en el primer pago. Además,
  el uplift de los híbridos pide un holdout: comparar tocados contra no tocados reparte crédito, pero no prueba
  efecto.'
