limitations:
- 'Pendiente de tu aceptación: F-248 a F-252 (R-036) y F-244 (R-035) están propuestos. Sin ellos el paquete no puede
  marcarse Ready.'
- R-035 cambió las definiciones de Hybrid B (entrada directa a SQL) y Reactivate (ex-clientes). De R-035 solo se
  reusa la capa común cortada por ruta de entrada.
- La ventana, el múltiplo de estancamiento y el plazo del speed to lead son parámetros a acordar con Finora. Los
  benchmarks externos son contexto, no metas.
- Won solo existe en las rutas con vendedor. Won y primer pago no son lo mismo, y la conciliación mide justamente
  esa brecha (X-052).
- Las tasas de etapas intermedias no se comparan entre rutas (por ejemplo, SQL contra activación).
- La «reactivación» de los pagos es la vuelta de clientes (loop de Revenue), no el Reactivate de leads (F-213, F-226).
- El catálogo completo (fórmula, grano e hito por métrica) queda en anexo (R-036). Reemplaza a C-006.
visual_intent: 'Split y converge: a la izquierda, cada funnel con sus propias familias y la métrica de su mecanismo;
  todos convergen a la derecha en una capa común cortada por funnel. La conciliación con las altas en pagos cierra
  el lazo.'
hugo_wording: «me gustaría saber como en cada tipo de funnel y que métricas especificas de cada una de esas categorias
  mediriamos por tipo de funnel, quiero otra propuesta de lámina ahi» (N-058).
