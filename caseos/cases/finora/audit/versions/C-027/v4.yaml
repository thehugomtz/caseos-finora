id: C-027
type: claim
key: funnel-medicion
question: ¿Cómo se mide cada funnel si no todos lo recorren igual, y qué se puede comparar entre ellos?
headline: Proponemos medir cada funnel en sus etapas y compararlos solo en resultados comunes
answer: 'Proponemos medir cada funnel (Executive, Self Service, Hybrid A, Hybrid B y el loop de Reactivate) en sus
  propias etapas y con las mismas familias: volumen de entradas, alcance por etapa en cohorte de entrada con ventana
  fija (solo en cohortes que ya la cumplieron), tiempo por tramo, estancamiento y la métrica del mecanismo de cada
  ruta, como el speed to lead en Executive o el uplift de la intervención en Hybrid A, medido con holdout. Entre
  funnels solo se comparan resultados comunes desde el nudo (Won, MRR inicial, retención temprana, CAC y payback),
  siempre cortados por funnel, y las tasas se comparan por puerta, no por ruta. Con tus definiciones, Hybrid A empieza
  solo y luego interviene una persona, Hybrid B empieza con persona y termina solo, y Reactivate es el loop de los
  leads estancados; la vuelta de clientes que se ve en los pagos es otra población y se mide aparte. La clasificación
  sale de reglas explícitas al cierre de una ventana fija: si nace de un estancado, quién inició, si hubo toque
  humano y quién cerró. Hoy no se puede calcular ninguna métrica propia de funnel: el modelo empieza en el primer
  pago.'
