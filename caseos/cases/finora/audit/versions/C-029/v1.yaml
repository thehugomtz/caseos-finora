limitations:
- 'Es una propuesta: que esos datos no estén en el caso no prueba que Finora no los registre (H-076).'
- Los motivos de pérdida del CRM no alcanzan para la decisión en Proposal (F-129).
- Separar capacidad de calidad con mezcla contra tasa es observacional. Probar la palanca (que más capacidad recupere
  compras) pide un experimento (F-159), y la priorización de los reps confunde la relación entre tiempo de contacto
  y compra (H-028).
- La banda de ajuste se fija al entrar y se valida en el periodo base antes de usarla.
- La ventana de deduplicación, los días de estancado y el SLA son propuestas a acordar con Finora.
- Sigue las hojas y el orden de hipotesis-matriz. Reemplaza a C-012, que queda en anexo.
visual_intent: 'Split alineado: cada hoja del árbol, en el mismo orden, con su firma, qué la valida, qué la descarta,
  su dato mínimo y si ese dato existe hoy en el caso.'
hugo_wording: «y qué datos usarías para validar o descartar cada una? se deberia responder con 16 pero no me queda
  claro tampoco deben relacionarse estas 2» (N-060).
