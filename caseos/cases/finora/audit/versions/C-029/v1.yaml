id: C-029
type: claim
key: hipotesis-datos
question: ¿Qué datos usaríamos para validar o descartar cada hipótesis del árbol?
headline: Cada hoja del árbol tiene firma y dato propios; hoy no están en el caso
answer: 'Una hoja se valida si, al controlarla, la brecha se cierra en esa magnitud, y se descarta si queda igual;
  siempre con datos que no dependan de lo que Sales opine después. En el orden del árbol: venta y ventana, con la
  fecha de entrada y de venta por cuenta; no-prospectos, con el export de leads cruzado con customer_id (¿sube la
  proporción de duplicados, clientes actuales o spam?); desfase o definición, con una bitácora fechada de cambios
  de formulario, regla o reparto; misma demanda por otra puerta, con la puerta por cuenta y el cruce de identidad;
  calidad al entrar, con señales congeladas al crear el lead (empeora la mezcla de ajuste y no la tasa por banda);
  capacidad, con el primer contacto humano y un roster semanal de SDR/AE con ramp (la tasa cae en entradas lentas
  y en semanas de alta carga); estancados, con el historial de etapas y la última actividad (crece la bolsa y los
  retomados sí compran); incentivos del SDR, con la aceptación del AE por origen del SQL; decisión en Proposal,
  con motivos validados con compradores; y cobro, con la fecha de Won y la llave CRM ↔ customer_id. Ninguno de esos
  datos está en el caso (del cobro solo se ve el arranque en los pagos), y el gasto de Team no sirve como proxy
  de capacidad.'
