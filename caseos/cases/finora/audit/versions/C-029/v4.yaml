id: C-029
type: claim
key: hipotesis-datos
question: ¿Qué dato valida o descarta cada hoja del árbol, y lo tenemos hoy?
headline: Cada hoja del árbol tiene firma y dato propios; hoy no están en el caso
answer: 'En el mismo orden del árbol, cada hoja tiene una firma y un dato mínimo. Artefactos: export de leads con
  fecha, fuente y dominio, cruzado con customer_id y con leads previos, para quitar no-prospectos y duplicados,
  y el cruce de identidad para ver la misma demanda por otra puerta; las entradas únicas con fecha (con canal, motion
  y segmento) y su vínculo con el pago bastan para separar conteo, mezcla y tiempo. Mezcla o calidad: señales de
  ajuste congeladas al crear el lead, comparando mezcla contra tasa dentro de cada puerta, nunca con lo que Sales
  opinó después. Antes del SQL: tiempo a primer toque humano y carga por SDR/AE, con un roster semanal que distinga
  ramp (capacidad), y la bolsa de estancados con fechas por etapa y lo que compran los retomados (estancamiento).
  Después del SQL: aceptación del AE según el origen del SQL (incentivos del SDR) y motivos validados con compradores
  (oferta o precio), porque las razones de pérdida del CRM no alcanzan. Cobro: Won ligado al primer pago. Nada de
  esto está en el caso: el modelo empieza en el primer pago, el gasto de S&M no sirve como proxy de capacidad ni
  de leads, y probar la palanca de capacidad pide un experimento; la prueba más rápida es que Finora etiquete hacia
  atrás, desde su CRM, a los pagadores ya observados.'
