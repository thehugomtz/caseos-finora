limitations:
- 'Es propuesta: ninguna hoja tiene hoy su dato en el caso (F-230, F-126).'
- 'Que el caso no traiga canal ni etapas no prueba que Finora no los registre: parte puede estar en su CRM, aunque
  no siempre con historia (F-128, H-076).'
- Ventana de deduplicación, SLA y umbral de estancamiento son parámetros a acordar con Finora, no estándar de mercado.
- Comparar tocados contra no tocados asigna crédito, no efecto; la palanca de capacidad pide experimento (F-159).
- 'Comparar entradas directas a SQL contra SQL del SDR no es un experimento: solo sirve ver cómo cambia cada grupo
  en el tiempo, y sigue siendo asociación.'
- Con los pagos solo se acotan los artefactos del lado de pagadores; los del lado de leads necesitan el CRM.
visual_intent: 'Match: cada hoja del árbol, en el mismo orden, se empareja con su firma y su dato mínimo; ninguna
  tiene hoy su dato.'
hugo_wording: …y qué datos validarían o descartarían cada una; aquí no hay que hacer research en data, es una propuesta.
