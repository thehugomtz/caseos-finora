id: F-120
type: finding
headline: 'Con el modelo actual no se puede separar H-005 de H-006: faltan las entradas, los reps y los tiempos
  de contacto.'
evidence_text: El catálogo solo tiene pagos cliente × mes, industria y gasto S&M por rubro. Lo único parecido a
  capacidad es el gasto de Team, PayrollExpenses y Travel, en una unidad que no está documentada. Team sube de 0,24
  a 0,453 entre ene-22 y oct-24, y PayrollExpenses es negativo en 5 meses, así que no mide personas (FTE) ni carga.
confidence: low
limitations:
- Finora puede tener CRM y roster fuera del modelo del caso; no lo sabemos.
