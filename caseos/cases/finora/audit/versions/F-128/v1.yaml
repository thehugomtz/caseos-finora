id: F-128
type: finding
headline: H-005, H-006 y H-007 necesitan datos que suelen estar en un CRM, pero no siempre con su historia. La evidencia
  externa hace plausible H-006, pero no la prueba para Finora.
evidence_text: El resumen de HBR dice que la mayoría de las empresas es «far too slow» para dar seguimiento a los
  leads (EXT-01). InsideSales reporta conversión 8 veces mayor en los primeros cinco minutos y que el 57,1% de los
  primeros intentos de llamada llega después de una semana (EXT-02; estudio de un proveedor, observacional). Forrester
  y el modelo Bowtie proponen medir por oportunidad o buying group, y por volumen, conversión y tiempo en cada etapa
  (EXT-07, EXT-06).
confidence: medium
limitations:
- 'Es evidencia observacional: las mejores entradas suelen atenderse antes. Para hablar de causa hace falta un experimento
  o un experimento natural (Q-023).'
kind: measurement
claims:
- claim: 'Resumen de HBR (Oldroyd, McElheran y Elkington, 2011): «Companies spend billions of dollars on internet-generated
    sales leads, but most are far too slow to follow up on them.»'
  source_id: EXT-01
  source_type: expert
  confidence: medium
  freshness: '2011'
  supports_or_contests: context
  notes: 'Solo se recuperó el resumen: las cifras del artículo no se usan porque no se pudo leer el texto completo.
    Hace plausible el mecanismo de H-006; no es evidencia sobre Finora.'
- claim: 'InsideSales (2021; 55 millones de actividades, 5,7 millones de leads inbound, más de 400 empresas): «Conversion
    rates are 8x greater in the first five minutes». Solo el 0,1% de los leads inbound se atiende en 5 minutos y
    el 57,1% de los primeros intentos de llamada ocurre después de más de una semana.'
  source_id: EXT-02
  source_type: marketing
  confidence: low
  freshness: '2021'
  supports_or_contests: context
  notes: Estudio de un proveedor, observacional y sin metodología publicada. Es contexto para H-006; no prueba causa.
- claim: 'El Bowtie conecta volumen, conversión y velocidad en cada etapa, de adquisición a expansión: «the classic
    funnel stops where recurring revenue actually begins».'
  source_id: EXT-06
  source_type: industry
  confidence: medium
  freshness: Sin fecha visible; consultado 2026-09-29
  supports_or_contests: context
  notes: Es un framework alternativo, útil si se quiere unir Growth con Revenue.
- claim: 'Forrester: «Most B2B organizations recognize the limitations of lead-centric demand processes». Propone
    contar «opportunities with connected buying groups».'
  source_id: EXT-07
  source_type: industry
  confidence: medium
  freshness: Sin fecha visible; consultado 2026-09-29
  supports_or_contests: context
  notes: Relevante para la unidad de conteo en Executive/KAM (H-001).
