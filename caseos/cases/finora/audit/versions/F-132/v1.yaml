- claim: Chargebee incluye en el MRR los descuentos recurrentes y excluye por defecto los de una vez (configurable
    con included_in_mrr). Excluye cargos de instalación, ajustes de crédito, cargos puntuales e impuestos.
  source_id: S8, S9
