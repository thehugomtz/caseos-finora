id: F-132
type: finding
headline: No hay una convención única de mercado para el descuento en el MRR, y la convención «solo neto» borra
  justo las distinciones que pide el CFO. El modelo debe guardar bruto, descuento y neto por separado; la convención
  oficial queda como decisión.
evidence_text: 'ChartMogul reporta el MRR solo neto: aplicar un descuento es contracción y su vencimiento es expansión.
  ProfitWell siempre resta descuentos y créditos para no reescribir el MRR histórico. En Stripe es configurable,
  pero los descuentos permanentes siempre se restan. Chargebee incluye los descuentos recurrentes y excluye por
  defecto los de una sola vez. Con la convención solo neto, la expansión del caso A de Q-025 no se ve, y B1/B2 y
  C1/C2 se ven iguales.'
confidence: low
limitations:
- 'Son convenciones de proveedores: sirven de contexto, no son evidencia sobre Finora ni una recomendación.'
kind: data_engineering
claims:
- claim: 'ChartMogul reporta el MRR solo neto de descuentos: aplicar un descuento es contracción, su vencimiento
    es expansión, cancelar una de varias suscripciones (sin cancelar la última) es contracción, y un cambio de plan
    sin cambio de MRR es un movimiento neutral.'
  source_id: S1, S2
  source_type: company
  confidence: low
  freshness: blog 2025-01-20; ayuda con fecha 2026-09-17; consultado 2026-09-29
  supports_or_contests: context
  notes: 'Convención de un proveedor: contexto, no recomendación.'
  unverified: true
- claim: ProfitWell (Paddle) siempre resta descuentos y créditos antes de calcular el MRR; cuando el descuento termina,
    el MRR vuelve al precio completo. Lo justifica en no reescribir el MRR histórico y en la consistencia.
  source_id: S10
  source_type: company
  confidence: high
  freshness: sin fecha visible; consultado 2026-09-29
  supports_or_contests: context
  notes: Aporta el argumento a favor de congelar el histórico.
- claim: En Stripe se configura si se restan del MRR los descuentos recurrentes y los de una vez; los descuentos
    recurrentes permanentes siempre se restan. Si se restan descuentos, un cupón del 100 % cuenta como churn.
  source_id: S4, S5
  source_type: company
  confidence: low
  freshness: consultado 2026-09-29
  supports_or_contests: context
  notes: Muestra que la convención es una elección.
