id: F-134
type: finding
headline: La huella de un descuento temporal limpio casi no aparece en el histórico (34 de 1.247 contracciones).
  Eso es consistente con que los descuentos sean algo por introducir, pero no prueba que no existieran.
evidence_text: Solo 34 contracciones vuelven exactamente al monto anterior después de 1 a 6 meses planos; 434 se
  mantienen al menos 6 meses.
confidence: low
limitations:
- 'No encontrar la huella no prueba que no hubiera descuentos: pudieron ser permanentes, darse como créditos o terminar
  junto con otro cambio. Una «V» también puede ser un downgrade temporal.'
kind: data_engineering
claims:
- claim: El patrón que dejaría un descuento temporal limpio (baja y regreso exacto al monto previo después de 1
    a 6 meses planos) aparece en 34 de 1.247 contracciones; 434 contracciones se mantienen al menos 6 meses.
