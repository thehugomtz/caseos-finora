id: F-146
type: finding
headline: El lado Growth no existe en los datos. Sin motion, canal ni fechas de hitos no se puede calcular ninguna
  conversión ni CAC por motion; hoy solo se ve la mezcla de gasto.
evidence_text: 'El modelo cubre 34 meses con pagos cliente × mes, industria (6 valores) y gasto S&M en 7 rubros
  con unidad no documentada. No tiene leads, oportunidades, motion, canal, owner ni estado contractual (DM-0, DM-1,
  DM-2, DM-3). Del lado de la inversión solo se ve la mezcla: Generación de Demanda pesa entre 57% y 61% cada año;
  la capacidad comercial pasa de 28,7% (2022) a 35,5% (2023) y 34,8% (2024); Habilitación baja de 11,3% a 4,3% (DM-7).
  Además, 377 clientes ya pagaban en ene-22 y 108 aparecen en feb-22 con sospecha de arrastre, así que no se conoce
  su inicio real (DM-6).'
confidence: low
limitations:
- 'La mezcla está en las unidades del archivo: no permite hablar de montos ni de eficiencia por motion. Que falte
  en el modelo no significa que falte en Finora: puede existir en un CRM que no se entregó.'
kind: measurement
claims:
- claim: El modelo del caso no tiene leads, oportunidades, motion, canal de adquisición, owner, plan ni estado contractual.
    Solo tiene pagos cliente × mes, la industria de cada cliente y el gasto S&M mensual por rubro.
  source_id: DM-0
  source_type: data_model
  confidence: low
