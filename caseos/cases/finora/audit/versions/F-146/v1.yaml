  supports_or_contests: supports
  notes: 'Que falte en el modelo no significa que falte en Finora: puede existir en un CRM que no se entregó. Soporta
    la necesidad de la capa técnica. · fuente no recuperada en la corrida (CaseOS)'
  unverified: false
