id: F-166
type: finding
headline: En la cohorte 2022 el primer pago promedio (COP 128,7 mil) supera al pago promedio del segundo mes (COP
  59,0 mil) y la razón entre la mediana de M1 y la mediana de M0 es 0,83; esa brecha desaparece en las cohortes
  siguientes, con razón 1,00 en 2023 y 0,93 en 2024, patrón consistente con pagos iniciales grandes y cobros retroactivos
  más que con un cambio de tarifa.
