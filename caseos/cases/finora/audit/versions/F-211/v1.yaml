id: F-211
type: finding
headline: 'Reactivate funciona como loop sobre episodios estancados, no como cuarta ruta: conserva fecha y puerta,
  y el primer pago cuenta una sola vez en su ruta, con bandera.'
evidence_text: 'Forrester trata como «desvío» lo que se sale del camino (estancada, cerrada-perdida, rechazada,
  descalificada), le asigna un código de motivo y lo reasigna al punto del waterfall más adecuado para su estado
  (SRC-02). Es exactamente lo que describe N-038. Las prácticas de reciclaje usan disparadores por tiempo, actividad
  y etapa con umbrales de ejemplo, y separan motivos reciclables de no reciclables (SRC-04). Son ejemplos, no un
  estándar: confirma que el umbral de Q-064 es un parámetro de Finora. Reciclado es distinto de rechazado y de expirado,
  y los resultados mutuamente excluyentes suman 100% (SRC-05). Si Reactivate fuera una línea más del mix, cada reactivado
  estaría en dos funnels a la vez; como bandera transversal, el mix sigue siendo MECE. Tras reactivar, la ruta se
  recalcula según quién mueve los tramos siguientes: un Self Service reactivado por un SDR pasa a Hybrid A.'
confidence: medium
limitations:
- Ninguna fuente dice qué pasa con la fecha original al reciclar (SRC-04 no lo trata). La regla «conserva fecha,
  sin entrada nueva, con caducidad que abre un episodio nuevo enlazado» es propuesta propia. Umbral y caducidad
  los acuerda Finora.
kind: measurement
