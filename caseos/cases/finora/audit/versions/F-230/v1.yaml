  notes: Debilita la parte de arranque de H-057 como problema creciente. Un pago de varios meses por adelantado
    también deja M1 en cero. El tramo Won → primer pago no se ve.
- claim: En Salesforce, el historial estándar de campos se conserva 18 meses en la interfaz y hasta 24 meses vía
    API; Field Audit Trail permite retenerlo más tiempo.
  source_id: W-09
