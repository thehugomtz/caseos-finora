  supports_or_contests: context
  notes: 'Define qué hojas son comprobables hoy: ninguna de las ramas 1 a 4.'
- claim: 'De las altas de mar–oct con M1 observable, no pagaron en M1: 17 de 227 (7,5%) en 2022, 12 de 433 (2,8%)
    en 2023 y 13 de 415 (3,1%) en 2024.'
  source_id: DM-03
