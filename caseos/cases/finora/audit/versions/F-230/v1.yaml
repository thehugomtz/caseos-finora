id: F-230
type: finding
headline: Con el modelo actual no se puede validar ni descartar ninguna hoja de las ramas 1 a 4, y de H-057 solo
  se ve el arranque.
evidence_text: 'El catálogo solo tiene pagos cliente × mes, industria y gasto S&M por rubro; no hay leads, estados,
  oportunidades ni registros de producto (DM-01). Del arranque: las altas que pagan M0 y no M1 fueron 17 de 227
  (7,5%) en 2022, 12 de 433 (2,8%) en 2023 y 13 de 415 (3,1%) en 2024 (DM-03). Si Finora usa Salesforce, el historial
  estándar de campos se guarda 18 meses en la interfaz y 24 vía API (W-09), así que el periodo base podría no poder
  reconstruirse.'
confidence: high
limitations:
- Un M1 en cero también puede ser un pago de varios meses por adelantado. No sabemos qué CRM usa Finora ni qué historial
  guarda.
kind: measurement
claims:
- claim: El modelo del caso solo tiene pagos cliente × mes, industria por cliente y gasto S&M mensual por rubro;
    no hay tablas de leads, estados del CRM, oportunidades ni registros de producto.
  source_id: DM-01
