  supports_or_contests: supports
  notes: Respalda las vigencias de C-019.
- claim: 'Kimball: una foto periódica tiene grano de periodo y es densa (hay fila aunque no haya actividad), a diferencia
    de la tabla de transacciones.'
  source_id: W-17
  source_type: expert
