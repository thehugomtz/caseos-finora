id: F-236
type: finding
headline: 'Cómo pega un descuento en el MRR es una convención, no un hecho: C-020 se sostiene, pero se aparta del
  default del mercado y hay que declararla.'
evidence_text: 'ChartMogul reporta el MRR neto de descuentos y clasifica aplicar un descuento como contracción y
  su vencimiento como expansión (W-05, W-06); para un 100% usa downgrade por defecto, con opción de churn (W-07).
  Recurly deja incluir el descuento en el MRR (recomendado) o excluirlo (W-10). Stripe siempre resta los descuentos
  permanentes y deja configurar los recurrentes y los únicos (W-03). Chargebee mete los cupones únicos al MRR cuando
  aplican en la siguiente renovación, lo que puede parecer downgrade (W-09), y tiene el flag included_in_mrr para
  los únicos (W-08). En Stripe, actualizar un descuento no genera prorrateo: eso solo pasa con cambios de precio,
  cantidad, ítems o ciclo (W-01).'
confidence: high
limitations:
- 'No hay una respuesta correcta única: la elección es de Hugo y del CFO. Lo que sí es firme es que el modelo debe
  guardar las capas para poder recalcular con otra convención.'
kind: data_engineering
claims:
- claim: 'En Stripe, actualizar descuentos no crea prorrateos ni facturas: solo los cambios de precio, cantidad,
    ítems o ciclo afectan lo facturable. Además, los precios y los códigos promocionales se aplican por separado.'
  source_id: W-01
  source_type: industry
  confidence: high
  freshness: consultado 2026-09-29
  supports_or_contests: supports
  notes: 'Respaldo técnico para C-020: el descuento y el cambio de suscripción son eventos distintos.'
- claim: Chargebee modela el descuento con type (fixed_amount, percentage, offer_quantity), duration_type (one_time,
    forever, limited_period, con period y period_unit), apply_on (invoice_amount o specific_item_price) y un flag
    included_in_mrr que aplica solo a one_time.
  source_id: W-08
  source_type: industry
  confidence: high
  freshness: consultado 2026-09-29
  supports_or_contests: supports
  notes: El flag muestra que meter o no un descuento único en el MRR es configuración, no un hecho.
- claim: Chargebee incluye los cupones únicos en el MRR cuando aplican en la siguiente renovación, lo que puede
    verse como downgrades.
  source_id: W-09
  source_type: industry
  confidence: medium
  freshness: documentación 1.0, sin fecha; puede no reflejar la versión actual
  supports_or_contests: contests
  notes: Choca con la propuesta de dejar los descuentos únicos fuera del MRR.
- claim: Stripe Billing siempre resta del MRR los descuentos permanentes y deja elegir si resta los recurrentes,
    los únicos o ambos.
  source_id: W-03
  source_type: industry
  confidence: high
  freshness: consultado 2026-09-29
  supports_or_contests: context
  notes: 'El tratamiento es configurable: es una convención.'
- claim: Recurly ofrece incluir el descuento en el MRR (opción recomendada) o excluirlo.
  source_id: W-10
  source_type: industry
  confidence: medium
  freshness: documentación versionada v2.29, sin fecha
  supports_or_contests: context
  notes: Otra muestra de que es una convención.
- claim: ChartMogul clasifica aplicar un descuento como contracción y su vencimiento como expansión.
  source_id: W-06
  source_type: industry
  confidence: high
  freshness: consultado 2026-09-29
  supports_or_contests: contests
  notes: El default de mercado es distinto de C-020 (línea propia «Descuento»).
- claim: ChartMogul reporta el MRR neto de descuentos y advierte que no restarlos puede distorsionar la salud del
    negocio, y que un cliente con descuento puede ser más difícil de renovar a precio completo.
  source_id: W-05
  source_type: industry
  confidence: medium
  freshness: '2025-01-20'
  supports_or_contests: context
  notes: Es la postura de un proveedor; el riesgo de renovación es un argumento, no un dato de Finora.
- claim: ChartMogul trata por defecto un descuento del 100% o el paso a un plan gratis como downgrade, y permite
    cambiarlo a churn.
  source_id: W-07
  source_type: industry
  confidence: medium
  freshness: 2022-06-24; puede haber cambiado
  supports_or_contests: contests
  notes: La propuesta para Finora es no tratarlo como churn ni como contracción, sino como «Descuento» con marca
    de mes sin cobro.
