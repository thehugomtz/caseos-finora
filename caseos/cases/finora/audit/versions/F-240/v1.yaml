  source_id: W-04
  source_type: official
  confidence: high
  freshness: Vigente; consultado 2026-09-29
  supports_or_contests: supports
  notes: Define los campos mínimos de touch, channel y campaign.
- claim: 'La spec B2B SaaS de Segment usa context.groupId como ID de la cuenta en eventos como Account Created,
