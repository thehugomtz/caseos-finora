id: F-240
type: finding
headline: 'El to-be de la hipótesis de trabajo se sostiene con patrones estándar, con tres ajustes: espina de identidad,
  puerta separada de ruta, y suscripción dividida en contratado, descontado, facturado y cobrado.'
evidence_text: 'Referencias que lo respaldan: el Lead con fuente, estado, dueño y conversión a cuenta y oportunidad;
  CampaignMember; OpportunityHistory con etapa, monto, fecha y autor; Task con quién, sobre qué y dueño; UTM source/medium/campaign
  (+utm_id); la spec B2B con groupId como ID de cuenta. Para las entradas, el accumulating snapshot (una fila por
  ítem, una fecha por hito, lags entre hitos). Para cuenta × mes, el periodic snapshot denso. SCD2 para asignación,
  plan y descuentos, y el historial diario que generan los paquetes de CRM. HubSpot muestra el enfoque alternativo:
  fechas de entrada y salida por etapa guardadas como propiedades.'
confidence: medium
limitations:
- 'Son patrones de industria, no evidencia sobre Finora: su stack y sus definiciones no están en el caso. Los esquemas
  de Salesforce vienen de documentación de terceros (la página oficial devolvió 403).'
kind: data_engineering
claims:
- claim: 'Kimball define el accumulating snapshot para procesos con inicio, pasos intermedios y fin: una fila por
    ítem, una fecha por cada hito, que se actualiza a medida que avanza e incluye los lags entre hitos.'
  source_id: W-01
  source_type: expert
  confidence: high
  freshness: s.f.; consultado 2026-09-29
  supports_or_contests: supports
  notes: Es el grano natural de funnel_entry para cohortes con ventana fija (C-006).
- claim: Kimball define el periodic snapshot con grano = periodo y filas densas aunque no haya actividad (ceros).
  source_id: W-03
  source_type: expert
  confidence: high
  freshness: s.f.; consultado 2026-09-29
  supports_or_contests: supports
  notes: Es el patrón de mart.customer_month hoy y de account_month en el to-be.
- claim: 'Kimball: un cambio tipo 2 agrega una fila nueva con fecha de inicio, fecha de expiración e indicador de
    fila vigente.'
  source_id: W-02
  source_type: expert
  confidence: high
  freshness: s.f.; consultado 2026-09-29
  supports_or_contests: supports
  notes: Patrón para asignación, industria, plan/precio, descuentos y mapeo de canal.
- claim: Google exige utm_source, utm_medium y utm_campaign, recomienda utm_id y utm_source_platform, y advierte
