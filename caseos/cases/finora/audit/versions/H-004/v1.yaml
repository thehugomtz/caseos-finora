id: H-004
type: hypothesis
statement: 'HC3a: al principio compran menos, pero después alcanzan un resultado parecido. HC3b: la diferencia sigue
  existiendo incluso con más seguimiento comparable.'
question: ¿La diferencia temprana se recupera o sigue abierta?
alternative: El comportamiento dentro de grupos no cambió y el total se explica por C1/C2; o todavía no pasó suficiente
  tiempo para distinguir ambas posibilidades.
evidence_needed: 'La historia de todas las entradas: quienes compraron, quienes siguen abiertos y quienes no compraron,
  en periodos de seguimiento que ambos grupos tengan.'
falsifier: Si se recupera, pierde fuerza la explicación de una caída persistente en ese periodo. Si no se recupera,
  el retraso pierde fuerza como explicación suficiente; aun así no demuestra que esas personas nunca comprarán.
capacity: 'No con pagos solos: faltan fecha de entrada y personas que nunca pagaron. Capacidad: 0.'
