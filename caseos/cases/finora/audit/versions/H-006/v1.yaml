id: H-006
type: hypothesis
statement: La menor compra coincide con más demora en atender a personas comparables.
question: ¿Estamos tardando más en atender?
alternative: Puede que el equipo atienda primero a quienes ya tenían más probabilidad de comprar; o que otra cosa
  cambie al mismo tiempo.
evidence_needed: Ingreso, asignación, primer intento y contacto efectivo, carga del equipo y seguimiento posterior.
falsifier: Si los tiempos no empeoraron donde cae la compra, la hipótesis pierde fuerza. Si empeoraron antes del
  resultado, es compatible, pero no prueba causalidad.
capacity: No está en las tres fuentes.
