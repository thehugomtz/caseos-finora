falsifier: Si hay contradicciones, ajustar los nombres y el alcance antes de interpretar. Si no sabemos que es MRR,
  llamarlo monto observado.
capacity: Podemos revisar qué está verificado y qué falta; no presuponemos que todo está correcto.
