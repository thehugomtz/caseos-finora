id: H-020
type: hypothesis
statement: El cambio se concentra en uno o varios de esos componentes observados.
question: ¿El monto cambió por quienes aparecen, desaparecen, regresan o siguen pagando?
alternative: Los componentes se compensan o no hay una concentración clara; también podría haber un problema de
  datos.
evidence_needed: Separación de grupos observados que sume exactamente al cambio total, mostrando aumentos y caídas.
falsifier: Si no suma, corregir antes de interpretar. Si se compensan, no decir que no pasó nada porque el neto
  sea pequeño.
