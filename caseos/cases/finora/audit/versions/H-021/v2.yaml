id: H-021
type: hypothesis
statement: Los grupos que empezaron a pagar en distintos momentos difieren en sus pagos posteriores.
question: ¿Los nuevos pagadores aportan distinto después de su primera compra?
alternative: Parecen distintos porque unos llevan menos tiempo observados o porque cambió la cobertura.
evidence_needed: Grupos desde primer pago con el mismo tiempo de seguimiento y base suficiente.
falsifier: Si la diferencia persiste en una comparación justa, puede matizar la lectura económica. Si no hay seguimiento
  comparable, no concluir deterioro.
capacity: Parcial. Sólo hacerlo si puede cambiar la interpretación de HO1–HO3; no prueba calidad de todos los leads.
priority: 2 × 2 = 4 · P2 · si cambia la lectura
