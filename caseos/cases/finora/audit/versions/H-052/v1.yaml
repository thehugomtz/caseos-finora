structured: '[Paso 1 · artefacto] Parte del aumento en New no son prospectos que puedan comprar: clientes actuales
  que usan el formulario para soporte o upgrade, duplicados de la misma persona o empresa que entra por varios canales,
  spam o bots. Inflan los leads sin poder volverse clientes nuevos. Tendría que ser cierto: sube la proporción de
  New que coincide con un cliente actual (correo, dominio o identificador fiscal), que es duplicado o que se descalifica
  como «no es prospecto», y al quitarlos los leads y los clientes nuevos crecen parecido. Dato mínimo: leads del
  CRM con fecha, correo o dominio y motivo de descalificación, más la lista de clientes; no está en el caso.'
