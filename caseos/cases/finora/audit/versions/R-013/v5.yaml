shaping_task: RT-004
slides:
- S2.2
task_why: 'Define si el cruce de S2.2 puede usar montos o solo formas en el tiempo, y si Habilitación se queda como
  gasto comercial o sale como producto (versión mejorada de RT-004: suma S2.2, respuesta de arranque y pasos).'
task:
  work: datos
  draft_answer: 'El archivo no documenta la unidad (viene en texto con «$») y no sabemos si está en la misma escala
    que los pagos. Por eso, por ahora solo se comparan formas y tiempos, no ratios. Tu duda de si Software Tools
    + Freelance es producto es válida: mi arranque es dejarlo en Habilitación, con el supuesto a la vista, hasta
    que Finora lo confirme. Del archivo sí sale qué meses cubre cada rubro, cómo se mueve cada uno y con qué otros
    rubros se mueve junto; eso es una pista, no una prueba.'
  hugo_said:
  - text: Habilitación ¿producto tal vez? (Software Tools + Freelance)
    ref: N-023
  steps:
  - kind: data
    what: 'Describir el archivo: meses cubiertos por rubro, vacíos, formato del texto con «$», magnitud y tendencia
      de cada rubro. El orden de magnitud se compara con el monto pagado solo como pista, nunca como conversión
      a COP.'
    where:
    - raw.sm_spend
    - staging.stg_sm_spend
    - mart.sm_monthly
    - mart.monthly_metrics
  - kind: data
    what: Revisar si Software Tools y Freelance se mueven con Team / Payroll Expenses (gente) o con Paid Media /
      Publicidad no web (campañas). Validar también la agrupación que ya trae el mart (demand_gen_spend, sales_capacity_spend,
      enablement_spend).
    where:
    - mart.sm_monthly
  - kind: proposal
    what: 'Clasificación de rubros (Generación de Demanda ToFu, Team, Habilitación) con el supuesto de Software
      Tools + Freelance a la vista. Incluye las dos preguntas para Finora: unidad y moneda del archivo, y naturaleza
      de esos dos rubros.'
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: ''
short_answer: 'El archivo documenta cobertura mensual, pero no unidad ni clasificación funcional. No es posible
  decidir con estos datos si SoftwareTools y Freelance son habilitación comercial o gasto de producto: el archivo
  solo trae el nombre del rubro y su monto mensual, sin centro de costo ni atribución funcional. Sí está documentada
  la cobertura de 34 meses de ene-22 a oct-24 sin valores ausentes, en unidades reportadas (u) sin factor de escala,
  que no se pueden leer como COP'
headline: El archivo documenta cobertura mensual, pero no unidad ni clasificación funcional
what_is_established:
- 'El archivo no documenta moneda ni factor de escala: los montos están en unidades reportadas (u) y sus magnitudes
  no admiten lectura como COP.'
- 'La cobertura formal del panel está íntegra: 34 meses de ene-22 a oct-24 sin valores ausentes. La cobertura efectiva
  es desigual, porque Freelance queda en cero en 17 meses y PayrollExpenses toma valor negativo en 5.'
- Que Team equivalga a 12% del S&M total en 17 meses hasta may-23 y luego se mueva entre 19% y 38% con 17 valores
  distintos en 17 meses es consistente con una asignación por porcentaje fijo en el primer tramo y con un cambio
  de método desde jun-23.
- Freelance registra su último valor distinto de cero en jun-23 y aporta 0,00 al total de 2024, de modo que desde
  ese corte Habilitación coincide con SoftwareTools. La serie no mide lo mismo antes y después.
- 'La pregunta queda No evaluable: el archivo solo trae el nombre del rubro y su monto mensual. Faltan centro de
  costo, proveedor y atribución funcional; agruparlos en Habilitación es una convención del catálogo de métricas.'
- 'Habilitación pasa de 12% en 2022 a 7% en 2023 y 4% en 2024, así que el nivel del gasto por alta depende de si
  el rubro se cuenta como comercial. La dirección de la tendencia coincide en ambos criterios: baja de 0,11 a 0,04
  incluyéndola y de 0,09 a 0,03 excluyéndola.'
what_is_contested: []
what_remains_unknown:
- 'No se puede decidir con estos datos si SoftwareTools y Freelance son habilitación comercial o gasto de producto:
  falta centro de costo, proveedor y atribución funcional, y la agrupación actual es una convención del catálogo
  de métricas.'
- No se puede expresar ningún monto en COP ni comparar contra el estado de resultados, porque el archivo no documenta
  unidad ni factor de escala.
- No se puede tratar cada rubro como una medición independiente en el tramo hasta may-23, donde Team equivale a
  12% del S&M total en 17 meses.
alternative_explanations: []
case_implication: Si el archivo va a alimentar decisiones de presupuesto, convendría exigir primero el factor de
  escala, la moneda de origen y una conciliación contra el estado de resultados. Si la asignación de SoftwareTools
  tiene efecto en el presupuesto comercial, podría resolverse solo con el libro mayor con centro de costo y proveedor
  por línea.
changes_current_story:
