task:
  work: propuesta
  draft_answer: 'Mi arranque: no hay un funnel, hay uno por puerta. Self Service se registra, usa y paga sin hablar
    con ventas. Assisted entra por campañas, referidos, partners o prospección, y lo trabajan SDR y luego AE (New
    → Working → Engaged → SQL → Demo → Proposal → Won). Executive está por definir: ¿son las entradas directas a
    SQL, las cuentas que atiende un KAM, o ambas? Además hace falta una regla para quien cambia de puerta, como
    un Self Service que pide demo. Todas las puertas se juntan en un mismo hito de compra (Won, primer pago o suscripción
    activa, por acordar), con una vista AAARRR común encima. La conversión se mide por grupo de entrada (de los
    que entraron en un mes, cuántos llegan al hito en cierto plazo) y el estancamiento como tiempo en etapa, con
    plazos que se acuerdan con Finora. Lo primero es poder decir por qué puerta y canal entró cada cliente, y eso
    no viene en los datos del caso.'
  hugo_said:
  - text: 'Assisted / Self Service / Executive · Canales: Canal de adquisición 3, Canal de adquisición 2, Digital,
      WoM, Clientes que no requirieron un KAM · Funnel Propuesto · AAARRR · Conversion Rate · Métricas Clave'
    ref: N-008
  - text: Assisted / Self Service / Executive
    ref: N-024
  steps:
  - kind: data
    what: 'Dejar claro el límite: el modelo no trae leads, etapas ni canal, y no hay proxy válido para asignar puerta
      (ni la industria ni el ticket la sustituyen). Solo sirve para dimensionar lo que el funnel tendría que explicar:
      primeras apariciones de pago por mes y su primer pago.'
    where:
    - mart.new_customers
  - kind: research
    what: 'Cómo definen y miden el funnel las empresas SaaS con modelo híbrido (self-serve + ventas): puertas de
      entrada, entrada directa a SQL, leads que cambian de puerta, conversión por grupo de entrada vs por etapa,
      y tiempo en etapa. Sirve para apoyar la propuesta en prácticas y no inventarla; los plazos siguen siendo parámetros
      de Finora.'
    where: []
  - kind: proposal
    what: Taxonomía de puertas (Assisted / Self Service / Executive) con su regla de entrada y de cambio de puerta,
      y el mapa de canales (Digital, WoM, clientes que no requirieron KAM y los dos canales por nombrar).
    where: []
