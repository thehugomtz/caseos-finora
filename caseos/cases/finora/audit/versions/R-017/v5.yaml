new_questions:
- ¿Cuánto del MRR por cliente de Salud y Tecnología se sostiene por retención de cohortes y cuánto por su menor
  peso de altas recientes?
- ¿Qué participación de las altas de Retail y Servicios profesionales sigue pagando al año, y con qué monto usual,
  frente a las altas de Salud?
- ¿El churn persistente por industria se mantiene igual si se excluyen los retornos con liquidación de meses pendientes?
- ¿Qué campos habría que capturar (tamaño de cliente, plan, motivo de salida) para separar segmentos accionables
  dentro de cada industria?
