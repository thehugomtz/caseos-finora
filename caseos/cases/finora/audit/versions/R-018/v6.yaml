task_why: Separa lo que CEO, CRO y CFO pueden ver hoy de lo que requiere datos nuevos, y evita poner CAC, LTV o
  UCM en la lámina sin base.
task:
  work: propuesta
  draft_answer: Como no sabemos qué mide hoy Finora, propondría un set de métricas y no una lista de «lo que falta».
    Con el modelo del caso ya salen MRR y ARR (como monto pagado observado), ARPU o MRR por cliente activo, churn
    observado de clientes y de monto, y expansión y contracción del monto. El CAC combinado depende de documentar
    la unidad del gasto (RT-004) y de acordar qué cuenta como «adquirir» un cliente. LTV y UCM necesitan margen
    y costo por cliente, que no tenemos, así que van como definición y dato requerido, sin cifra. Cuando existan
    descuentos, el MRR se parte en antes y después de descuento, amarrado al modelo de S3.3.
  hugo_said:
  - text: No es posible determinar las métricas actuales, pero típicamente pensaría en abordar estos frameworks
      de Growth (MRR, ARR, ARPU, CAC, LTV, Churn, UCM)
    ref: N-025
  steps:
  - kind: data
    what: 'Qué métricas salen hoy y con qué nombre, respetando lo que R-001 dice que se puede nombrar: monto pagado
      (MRR/ARR observados), MRR por cliente activo, churn observado de clientes y de monto, expansión, contracción,
      reactivación y retención de monto por cosecha.'
    where:
    - mart.monthly_metrics
    - mart.customer_month
    - mart.vintage_month
  - kind: research
    what: Definiciones estándar para SaaS de suscripción mensual (MRR/ARR, ARPU, churn de clientes vs de ingreso,
      CAC combinado vs pagado, LTV, UCM o margen de contribución, payback), para anclar las fórmulas y no inventarlas.
    where: []
  - kind: proposal
    what: 'Árbol de métricas: definición, fórmula, grano, fuente, dueño y estado (hoy / con dato X / no calculable),
      y cómo baja a Growth (por puerta) y a Revenue (por componente).'
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: 'Define qué métricas entran al Overview como salud y con qué nombre, y qué tiene que pedir la Propuesta
  de Modelo de datos. Si en una lámina aparecen un CAC, un LTV o un ARR calculados con la fórmula estándar a partir
  de estos datos, el CFO puede rechazarla: el S&M no tiene unidad, no hay margen y lo que llamamos MRR es monto
  pagado.'
short_answer: 'Estas se pueden calcular hoy, siempre que se nombren tal como son: el MRR (como «MRR pagado observado»
  y su puente de movimientos), el ARPA por cliente (lo que se pide como ARPU; no hay datos por usuario), el churn
  (el observado y, como proxy, uno con ventana de gracia) y la retención e ingreso acumulado por cohorte. El ARR
  solo se puede dar como run-rate anualizado. El CAC existe solo como «S&M por alta en unidades reportadas», porque
  la unidad del gasto no está documentada; el CAC en COP y por motion o canal, el payback, el LTV con margen, el
  LTV:CAC y el UCM necesitan datos nuevos: unidad del S&M, margen o costo de servir, facturación con periodo de
  servicio, y motion y canal por cliente. Confianza alta en esta clasificación y media en los proxies (MRR normalizado
  y churn con gracia), que dependen de reglas que tienes que aprobar tú.'
