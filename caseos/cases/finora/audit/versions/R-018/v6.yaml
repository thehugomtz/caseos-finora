  summary: 'R-018: de las 7 métricas, se pueden calcular hoy el MRR (como pagado observado), el ARPA (no ARPU por
    usuario), el churn y las cohortes. El ARR solo como run-rate y el CAC solo como S&M por alta en unidades sin
    documentar; LTV con margen, payback, LTV:CAC y UCM necesitan datos nuevos. Las distorsiones de cobro (atrasos
    y pagos multimes) inflan el churn y la expansión observados, lo que debilita H-017 a nivel de movimiento.'
  recommended_next: 'Llevar a Hugo dos decisiones: los nombres de las métricas del Overview y la regla de churn
