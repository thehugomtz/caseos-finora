- SELECT month, window_flag, active_customers, new_customers, churned_customers, reactivated_customers, expanded_customers,
  contracted_customers, total_paid_mrr_cop, new_mrr_cop, expansion_mrr_cop, reactivation_mrr_cop, contraction_mrr_cop,
  churned_mrr_cop, mrr_per_active_customer_cop, logo_churn_rate, gross_mrr_churn_rate, net_mrr_retention_existing,
  quick_ratio, total_sm_spend, multi_month_payment_signatures, share_churn_returning_next_month FROM mart.monthly_metrics_phase1
  ORDER BY month
- SELECT * FROM raw.sm_spend LIMIT 5
- SELECT * FROM raw.transactions LIMIT 5
- SELECT COUNT(*) AS filas, COUNT(DISTINCT customer_id) AS clientes, COUNT(DISTINCT month) AS meses, MIN(month)
  AS primer_mes, MAX(month) AS ultimo_mes, SUM(CASE WHEN observed_amount = 0 THEN 1 ELSE 0 END) AS filas_en_cero,
  SUM(CASE WHEN observed_amount > 0 THEN 1 ELSE 0 END) AS filas_con_pago, SUM(CASE WHEN observed_amount < 0 THEN
  1 ELSE 0 END) AS filas_negativas, SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS filas_firma_multimes
  FROM mart.customer_month
- SELECT multi_month_payment_signature AS k, COUNT(*) AS filas, ROUND(SUM(paid_mrr_cop),0) AS monto_cop FROM mart.customer_month
  WHERE observed_amount > 0 GROUP BY multi_month_payment_signature ORDER BY k
- SELECT CASE WHEN months_to_return IS NULL THEN 'no vuelve antes de oct-24' WHEN months_to_return = 1 THEN '1 mes'
  WHEN months_to_return = 2 THEN '2 meses' WHEN months_to_return = 3 THEN '3 meses' WHEN months_to_return BETWEEN
  4 AND 6 THEN '4-6 meses' ELSE '7+ meses' END AS vuelve_en, COUNT(*) AS eventos_churn FROM mart.churn_events GROUP
  BY 1 ORDER BY 1
- SELECT ROUND(SUM(demand_gen_spend),3) AS generacion_demanda, ROUND(SUM(sales_capacity_spend),3) AS capacidad_comercial_team,
  ROUND(SUM(enablement_spend),3) AS habilitacion, ROUND(SUM(total_sm_spend),3) AS total_sm, ROUND(SUM(team + payroll_expenses)/SUM(total_sm_spend),3)
  AS share_team_payroll, ROUND(SUM(paid_media)/SUM(total_sm_spend),3) AS share_paid_media, COUNT(*) AS meses FROM
  mart.sm_monthly
- SELECT ROUND(SUM(CASE WHEN multi_month_payment_signature > 0 THEN paid_mrr_cop ELSE 0 END)/SUM(paid_mrr_cop),4)
  AS share_monto_firma_multimes, ROUND(1.0*SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END)/SUM(CASE
  WHEN observed_amount > 0 THEN 1 ELSE 0 END),4) AS share_filas_firma_multimes, COUNT(DISTINCT CASE WHEN multi_month_payment_signature
  > 0 THEN customer_id END) AS clientes_con_firma FROM mart.customer_month
- SELECT COUNT(*) AS churn_rows, SUM(c.returned_next_month) AS vuelve_t1, SUM(c.returned_same_amount_next_month)
  AS vuelve_t1_mismo_monto, SUM(CASE WHEN n.observed_amount > 0 AND ABS(n.observed_amount*10000 - 2*c.previous_month_mrr)
  <= 0.005*2*c.previous_month_mrr THEN 1 ELSE 0 END) AS vuelve_t1_con_doble_pago, SUM(CASE WHEN c.month_index >=
  31 THEN 1 ELSE 0 END) AS churn_en_ultimos_3_meses FROM mart.customer_month c LEFT JOIN mart.customer_month n ON
  n.customer_id = c.customer_id AND n.month_index = c.month_index + 1 WHERE c.churned_customer = 1
- SELECT usual_amount_cop, COUNT(DISTINCT customer_id) AS clientes FROM mart.customer_month GROUP BY usual_amount_cop
  ORDER BY clientes DESC LIMIT 12
- SELECT cohort_flag, COUNT(DISTINCT customer_id) AS clientes FROM mart.customer_month GROUP BY cohort_flag ORDER
  BY 1
- SELECT COUNT(*) AS filas_con_pago, SUM(CASE WHEN CAST(ROUND(observed_amount*100) AS BIGINT) % 21 = 0 THEN 1 ELSE
  0 END) AS filas_multiplo_2100_cop, COUNT(DISTINCT usual_amount_cop) AS montos_usuales_distintos FROM mart.customer_month
  WHERE observed_amount > 0
- SELECT vintage, COUNT(*) AS altas, SUM(CASE WHEN m1_cop IS NULL THEN 1 ELSE 0 END) AS sin_m1, SUM(CASE WHEN m1_cop
  > m0_cop THEN 1 ELSE 0 END) AS m1_mayor_m0, SUM(CASE WHEN m1_cop = m0_cop THEN 1 ELSE 0 END) AS m1_igual_m0, SUM(CASE
  WHEN m1_cop < m0_cop THEN 1 ELSE 0 END) AS m1_menor_m0, ROUND(MEDIAN(m0_cop),0) AS mediana_m0, ROUND(MEDIAN(early_run_rate_cop),0)
  AS mediana_run_rate FROM mart.new_customers GROUP BY vintage ORDER BY vintage
- SELECT vintage, MIN(month) AS desde, MAX(month) AS hasta, ROUND(MIN(arpa_cop),0) AS arpa_min, ROUND(MAX(arpa_cop),0)
  AS arpa_max FROM mart.vintage_month GROUP BY vintage ORDER BY vintage
- SELECT vintage, COUNT(DISTINCT customer_id) AS altas, ROUND(SUM(CASE WHEN tenure_month BETWEEN 0 AND 11 THEN paid_mrr_cop
  ELSE 0 END)/COUNT(DISTINCT customer_id),0) AS ingreso_obs_12m_por_alta_cop, ROUND(1.0*COUNT(DISTINCT CASE WHEN
  tenure_month = 12 AND observed_amount > 0 THEN customer_id END)/COUNT(DISTINCT customer_id),3) AS share_pagando_m12
  FROM mart.customer_month WHERE cohort_flag = 'clean' AND cohort_month <= '2023-10' GROUP BY vintage ORDER BY vintage
- SELECT ROUND(SUM(total_sm_spend),3) AS sm_mar22_oct24_unidades, SUM(new_customers) AS altas_mar22_oct24, ROUND(SUM(total_sm_spend)/SUM(new_customers),5)
  AS sm_por_alta_unidades, ROUND(SUM(new_mrr_cop),0) AS new_mrr_cop_total FROM mart.monthly_metrics_phase1 WHERE
  window_flag = 'clean'
- SELECT c.multi_month_payment_signature >= 2 AS firma, COUNT(*) AS filas, SUM(CASE WHEN p.observed_amount = 0 THEN
  1 ELSE 0 END) AS mes_previo_en_cero, SUM(CASE WHEN n.observed_amount = 0 THEN 1 ELSE 0 END) AS mes_siguiente_en_cero,
  SUM(CASE WHEN p.observed_amount > 0 AND (n.observed_amount > 0) THEN 1 ELSE 0 END) AS rodeado_de_pagos FROM mart.customer_month
  c LEFT JOIN mart.customer_month p ON p.customer_id = c.customer_id AND p.month_index = c.month_index - 1 LEFT
  JOIN mart.customer_month n ON n.customer_id = c.customer_id AND n.month_index = c.month_index + 1 WHERE c.multi_month_payment_signature
  >= 2 GROUP BY 1
- SELECT movement_type, COUNT(*) AS filas FROM mart.customer_month GROUP BY movement_type ORDER BY filas DESC
- SELECT movement_type, COUNT(*) AS filas, SUM(reverts_next_month) AS revierte_t1, ROUND(1.0*SUM(reverts_next_month)/COUNT(*),3)
  AS share_revierte FROM mart.customer_month WHERE movement_type IN ('expansion','contraction') AND month_index
  < 33 GROUP BY movement_type
- SELECT industry, COUNT(*) AS clientes FROM staging.stg_customers GROUP BY industry ORDER BY clientes DESC
