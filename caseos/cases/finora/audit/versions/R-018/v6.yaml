alternative_explanations:
- 'Los meses en cero seguidos de un pago doble pueden ser atrasos de cobro con el servicio activo o pausas reales
  del servicio que luego se pagan: los pagos no permiten distinguirlos.'
- Los pagos multimes rodeados de pagos (183 filas) pueden ser cargos únicos, add-ons o consumo variable, y no varios
  meses de suscripción.
- La caída del ARPA total es compatible con un efecto mezcla (cosechas nuevas con ARPA menor), pero también con
  cambios de precio o de plan dentro de las cohortes; aquí no se separó.
- Que M0 sea mayor que M1 puede deberse a un cargo de alta, al prorrateo del primer mes o a pagos de arrastre (sobre
  todo en feb-22), y no necesariamente a un cliente que vale menos.
- Una razón S&M por alta estable puede esconder rezagos entre el gasto y la alta, y «altas» que en realidad son
  clientes anteriores a 2022 que vuelven a pagar.
what_is_established:
- El panel cliente × mes está completo (1.961 × 34 meses, ene-22–oct-24), con ceros explícitos y sin montos negativos.
- El puente de MRR pagado (altas, expansión, reactivación, contracción y churn) ya se calcula en el mart y cuadra
  con la Fase 1.
- 'La unidad es el cliente (cuenta): el modelo no tiene usuarios o licencias, plan, intervalo de facturación, periodo
  de servicio, motion, canal, margen ni costo de servir.'
- 'El gasto S&M no tiene unidad documentada: hoy no hay CAC en COP.'
- 'El churn observado incluye muchos regresos rápidos: 330 de 751 eventos vuelven a pagar al mes siguiente.'
- Según el estándar externo (ChartMogul, a16z), el MRR normaliza los pagos multi-periodo y excluye cargos únicos,
  el ARR no es un mes × 12 cuando hay cargos no recurrentes, y el LTV requiere margen.
what_is_contested:
- Si el monto pagado equivale a MRR recurrente (la recurrencia no está confirmada).
- 'Qué ventana de gracia define el churn (1, 2 o 3 meses): es una política, no un hecho.'
- Si Team y PayrollExpenses son gasto de adquisición o incluyen KAM o retención.
- Si la caída del ARPA se debe a la mezcla de cohortes o a cambios de precio o plan.
- Si la «alta» (primera aparición) equivale a la adquisición del cliente.
what_remains_unknown:
- Unidad y moneda del archivo de S&M.
- Margen bruto y costos variables por cliente (necesarios para LTV con margen y UCM).
- Plan, precio de lista, intervalo de facturación y licencias por cliente.
- Motion (Self Service, Assisted, Executive) y canal (Digital, KAM) de cada cliente.
- Historia de los clientes antes de ene-22.
- Qué entiende Finora por UCM (aquí se asume Unit Contribution Margin).
case_implication: 'Para el Overview, el set defendible es este: MRR pagado observado con su puente, clientes activos,
  ARPA por cliente (también por cohorte), churn observado mostrado junto a un churn con ventana de gracia, NRR/GRR
  de la base, y retención e ingreso acumulado por cohorte limpia. El ARR solo tiene sentido como run-rate anualizado,
  y únicamente si el CEO lo necesita. CAC, payback, LTV con margen, LTV:CAC y UCM pasan a la Propuesta de Modelo
  de datos como huecos del WoW, cada uno con el dato que lo destraba. Respecto de Q-010: el monto pagado y las primeras
  apariciones se pueden nombrar y comparar dentro de cohortes limpias (desde mar-22), pero el churn, la reactivación
  y la expansión observados tienen distorsiones de cobro que hay que neutralizar con una regla o declarar abiertamente.
  Respecto de Q-003: hoy el vínculo entre cómo conseguimos clientes y el ingreso recurrente solo se puede mostrar
  por cohorte e industria, no por motion ni por canal de adquisición.'
changes_current_story:
