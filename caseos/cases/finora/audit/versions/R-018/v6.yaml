  summary: 'R-018 no cambia el diagnóstico: lo baja a métricas. Hoy se pueden mostrar con su nombre real: MRR pagado
    observado y su puente, clientes activos, ARPA por cliente (no ARPU), churn observado y métricas de cohorte.
    El ARR solo sale como run-rate anualizado. El CAC solo existe como «S&M por alta en unidades reportadas». No
    se pueden calcular sin datos nuevos: CAC en COP y por motion o canal, payback, LTV con margen, LTV:CAC y UCM.


    Lo que te toca decidir:

    1. **H-017** pierde fuerza con un mecanismo concreto: el monto mezcla la fecha de cobro con el mes de servicio.
    R-018 te pide aprobar la ventana de gracia y la regla para los pagos que cubren varios meses.

    2. **Nombre de la métrica:** «MRR pagado observado» choca con el framing, que dice «monto pagado observado».

    3. **Q-003:** se cuenta con la conexión observada, no con CAC ni LTV.

    4. **Dos chequeos pequeños** antes de la story: el puente (H-020) y el ticket de entrada, que hoy se mide con
    el primer pago (T-004).


    Q-010 queda respondida a nivel de métricas. Orden sugerido: H-017 → framing → T-004 → H-020 → Q-003.'
  run_id: RUN-20260929-110140-cos-d716
  at: '2026-09-29T11:32:01-06:00'
  impacts:
  - target: H-017
    effect: weakens
    why: 'Hallazgo: el panel está completo (1.961 clientes × 34 meses, ceros explícitos, sin negativos) y el puente
      cuadra en total. Pero el monto mezcla la fecha de cobro con el mes de servicio, y el modelo no tiene periodo
      de servicio ni intervalo de facturación. Por qué importa: no cambia el veredicto del agente (No soportada),
      lo precisa. Lo que no aguanta son dos cosas: los movimientos mes a mes, porque los atrasos y los pagos que
      cubren varios meses inflan el churn, la reactivación y la expansión (F-136); y el primer pago como monto de
      entrada (F-139). Los sustitutos que propone R-018 (MRR normalizado, churn con gracia) tienen confianza media
      y dependen de reglas que solo tú puedes aprobar.'
  - target: framing
    effect: changes_framing
    why: 'Hallazgo: R-018 propone el nombre «MRR pagado observado», usa «S&M por alta» y deja fuera CAC en COP,
      payback, LTV con margen, LTV:CAC y UCM. Por qué importa: el framing dice que se habla de «monto pagado observado»
      mientras la recurrencia no se confirme, y R-001 no la confirmó. Además reserva «alta» como etiqueta contractual
      y no pone límites a CAC, LTV, ARPU ni ARR, así que el borrador de storytelling (D-016) podría usarlos sin
      control. R-004, R-005 y R-009 ya hablan de «MRR», o sea que los nombres ya están mezclados. Framing está en
      needs_review: buen momento para ajustarlo.'
  - target: Q-003
    effect: changes_story
    why: 'Hallazgo: hoy no se pueden calcular CAC en COP, CAC por Self Service/Assisted/Executive o por Digital/KAM,
      payback, LTV con margen, LTV:CAC ni UCM. Faltan la unidad del S&M, el margen o costo de servir, y el motion
      y canal de cada cliente. Por qué importa: son justo las métricas que conectarían cómo conseguimos clientes
      con qué mueve el ingreso recurrente. Lo que sí hay es una conexión observada, en paralelo: más primeros pagadores
      con un primer pago menor (R-003), menor aporte por cohorte a igual edad (R-006), una caída del monto por cliente
      concentrada en quién entra (R-009) y un S&M por alta que baja −66% en unidades reportadas entre 2022 y 2024
      (R-015, T-014). Es asociación, no efecto (T-025).'
  - target: H-020
    effect: requires_research
    why: 'Hallazgo: los atrasos y los pagos que cubren varios meses inflan el churn, la reactivación y la expansión
      observados (F-136). Por qué importa: H-020 (Direccional) se apoya en el puente de R-004 y T-003, donde el
      cambio se concentra en la entrada de nuevos pagadores. Pero en ese mismo puente la reactivación (COP 86,5
      millones) y la contracción (−COP 89,5 millones) pesan casi lo mismo que la entrada de nuevos pagadores (COP
      94,3 millones). El total cuadra; lo que no sabemos es cuánto de esos componentes es solo efecto de las fechas
      de cobro.'
  - target: T-004
    effect: requires_research
    why: 'Hallazgo: F-139 dice que el ARPA de entrada se mide con un monto estabilizado (M1 o monto usual), no con
      el primer pago. Por qué importa: el ticket de entrada de T-004 y T-018 (COP 63,0 mil en 2022, 36,8 mil en
      2023 y 42,0 mil en 2024) se mide con el primer pago, como lo describe R-003. El valor inicial de T-019 también,
      si usa la misma base. Si el primer pago no representa el monto usual (por ejemplo, un mes parcial), parte
      de esa caída podría ser de medición. R-006 y R-009 apuntan en la misma dirección con medidas que no son solo
      el primer pago: la dirección podría sostenerse, pero la magnitud no la sabemos.'
  - target: Q-010
    effect: supports
    why: 'R-018 lleva la respuesta de R-001 del monto a las métricas. Hoy se pueden nombrar: MRR pagado observado
      y su puente, clientes activos, ARPA por cliente (no ARPU), churn observado, NRR/GRR de la base, retención
      e ingreso acumulado por cohorte, ARR solo como run-rate anualizado y CAC solo como S&M por alta en unidades
      reportadas. Quedan fuera CAC en COP, payback, LTV con margen, LTV:CAC y UCM. Los sustitutos dependen de la
      regla de H-017, y el choque de nombres va en la alerta de framing.'
