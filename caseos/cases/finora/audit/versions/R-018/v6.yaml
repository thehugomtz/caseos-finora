    required_dimensions:
    - dimension: Cliente (cuenta)
      why: Es la unidad de todas las métricas (el ID es «Cliente N»). Sin usuarios no hay ARPU por usuario.
    - dimension: Mes calendario y tenure (M0…Mn)
      why: Permite los cortes mensuales y las cohortes; M0 = primera aparición.
    - dimension: Cohorte y cohort_flag (base previa ene-22 / arrastre feb-22 / limpia)
      why: Solo las cohortes limpias (1.476 clientes desde mar-22) son comparables para ARPA de entrada, retención
        y S&M por alta (Q-010).
    - dimension: Industria (Restaurantes, Producción, Retail, Tecnología, Servicios profesionales, Salud)
      why: Es la única segmentación disponible hoy.
    - dimension: Tramo de monto usual
      why: 'Sirve hoy como proxy de plan: hay 395 montos usuales distintos y los más frecuentes son 42.000, 63.000
        y 31.500 COP.'
    - dimension: Estado de pago (al día / hueco ≤ G / churn confirmado / reactivado)
      why: Separa el cobro del servicio y alimenta el churn con gracia y el MRR normalizado.
    - dimension: Motion (Self Service / Assisted / Executive)
      why: Hace falta para el CAC y para medir por motion sin forzar un funnel lineal; hoy no existe.
    - dimension: Canal de adquisición (Digital / KAM)
      why: Hace falta para separar paid CAC de blended y para la atribución; hoy no existe.
    - dimension: Plan, intervalo de facturación y licencias
      why: Hacen falta para el MRR contractual, un ARR real y el ARPU por usuario; hoy no existen.
    - dimension: Grupo de S&M (Generación de Demanda, Team, Habilitación)
      why: Ya existe; falta la unidad y moneda, y la asignación entre adquisición y KAM.
    decision_enabled: 'Qué métricas entran al Overview como salud y con qué nombre (verde), cuáles se muestran como
      proxy con sensibilidad (amarillo) y qué se pide a Finora en la Propuesta de Modelo de datos (rojo) para poder
      hablar de CAC, payback, LTV y UCM ante el CFO. También qué comparaciones sostener ante el CRO y el CFO: cohortes
      limpias desde mar-22 y churn con una regla explícita.'
    limitations:
    - 'Solo hay pagos: nada sobre leads ni sobre la conversión del funnel.'
    - Monto pagado observado ≠ MRR contratado; la recurrencia no está confirmada.
    - 'Primera aparición ≠ adquisición: la base de ene-22 está censurada a la izquierda, y los clientes anteriores
      a 2022 que regresan aparecerían como altas.'
    - 'La ventana termina en oct-24: el churn reciente y las cohortes jóvenes están censurados a la derecha.'
    - El S&M no tiene unidad documentada, así que no hay ningún CAC en COP.
    - Sin margen ni costo de servir no hay LTV con margen ni UCM.
    - 'Los proxies (MRR normalizado, churn con gracia) son reglas, no hechos: cambian las cifras y necesitan sensibilidad.'
    - Los benchmarks externos (LTV:CAC mayor que 3, payback de 5–7 meses) son contexto, no metas para Finora.
    implementation_implications:
    - 'Renombrar en el mart y en las láminas: «MRR pagado observado», «ARPA por cliente», «churn observado», «ARR
      run-rate».'
    - 'Data Engineering: construir vistas de churn con gracia (G = 1, 2, 3) y de MRR normalizado a partir de mart.customer_month
      (usual_amount_cop, multi_month_payment_signature, months_to_return).'
    - Crear una tabla cohorte × tenure con logos, MRR e ingreso acumulado, solo para cohortes limpias.
    - 'Propuesta de Modelo de datos: pedir la unidad y moneda del S&M y la asignación de Team; un export de facturación
      con periodo de servicio y concepto; los eventos de cancelación y de pago fallido; el motion y canal de cada
      cliente desde el CRM; y el costo de servir mensual.'
    - No publicar una tasa de conversión mezclada ni CAC o LTV numéricos hasta tener los datos en rojo.
