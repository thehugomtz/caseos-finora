specialist:
  measurement:
    problem_interpretation: 'Pides un set de métricas SaaS (MRR, ARR, ARPU, CAC, LTV, Churn, UCM). Las definiciones
      estándar ya existen; el problema real es cuáles se sostienen con lo que hay (pagos observados por cliente
      y mes, y gasto S&M sin unidad) y con qué nombre. Unidad: cliente (cuenta, «Cliente N»). Grano: cliente × mes.
      Hito de inicio: la primera aparición con pago dentro de ene-22–oct-24, que no es la adquisición. Dinero: monto
      × 10.000 = COP, y es monto pagado observado, no contratado. No hay datos de leads, motion, canal, plan, usuarios,
      margen ni costo de servir.'
    measurement_objective: Dar al Overview un set mínimo de salud separado en volumen (clientes activos, altas),
      tasa (churn, retención, NRR/GRR) y valor (MRR, ARPA, ingreso acumulado por alta), todo con nombre honesto.
      Y convertir CAC, payback, LTV con margen y UCM en requerimientos concretos (evento + dimensión) para la Propuesta
      de Modelo de datos.
    recommended_framework:
      name: Árbol de ingreso recurrente con semáforo de medibilidad
      structure: 'Resultado: MRR (el pagado observado y, como proxy, el normalizado). Puente mensual: altas + expansión
        + reactivación − contracción − churn. Drivers: clientes activos × ARPA; altas × ARPA de entrada; retención
        de logos e ingreso por cohorte. Economía unitaria: ingreso acumulado por alta (hoy) × margen = LTV (dato
        nuevo); S&M ÷ altas (hoy, en unidades del archivo) → CAC en COP por motion y canal (dato nuevo) → payback
        y LTV:CAC; UCM = ARPA − costo variable (dato nuevo). Cada métrica lleva semáforo: VERDE = se calcula hoy
        con nombre honesto; AMARILLO = hoy como proxy, con una regla a aprobar y sensibilidad; ROJO = requiere datos
        nuevos (y se dice cuáles).'
      why: Responde exactamente a la pregunta (qué se mide, cómo, qué sale hoy y qué necesita datos nuevos). Respeta
        las reglas del caso (monto observado ≠ MRR contratado; primera aparición ≠ adquisición), separa volumen,
        tasa y valor, y conecta cada métrica en rojo con el evento que la habilita, que es justo el insumo de la
        Propuesta de Modelo de datos. Evita una tasa de conversión mezclada que no describe a nadie.
    alternative_frameworks:
    - name: Tablero SaaS clásico con benchmarks (MRR/ARR/ARPU/CAC/LTV/Churn con estado HEALTHY/WATCH/CRITICAL)
      when_better: Cuando hay facturación contractual (plan, intervalo, periodo de servicio), S&M en moneda conocida
        y margen bruto.
      tradeoff: Aquí presentaría proxies como hechos e invitaría a comparar con benchmarks (LTV:CAC mayor que 3,
        payback de 5–7 meses) que no aplican a datos sin margen ni unidad.
    - name: Cohortes primero (grid de logos e ingreso + ingreso acumulado por alta)
      when_better: Cuando la decisión es sobre la calidad de la retención y el valor por cosecha, y el CAC no se
        puede medir.
      tradeoff: No da una foto mensual de salud para el CEO, y las cohortes recientes están censuradas a la derecha.
    metric_definitions:
    - metric: MRR pagado observado (lo que hoy se llama MRR)
      definition: Suma de lo que pagaron los clientes en el mes, en COP. Es monto cobrado observado, no MRR contratado.
      formula: MRR_obs(m) = Σ_c amount(c,m) × 10.000
      grain: mes (agregado de cliente × mes)
      milestone: mes calendario de cobro
      notes: 'VERDE. Ya existe en el mart: 35,0 millones de COP en ene-22 y 97,0 millones en oct-24. Incluye atrasos
        y pagos multimes (3,07% del monto). No compararlo con benchmarks de MRR contractual.'
    - metric: Puente de MRR (altas, expansión, reactivación, contracción, churn)
      definition: Descompone el cambio mensual del MRR pagado en cinco movimientos, clasificados cliente por cliente.
      formula: ΔMRR_obs(m) = new + expansión + reactivación − contracción − churn
      grain: cliente × mes → mes
      milestone: 'mes calendario; primer mes clasificable: feb-22 (con posible arrastre)'
      notes: 'VERDE (cuadra con la Fase 1). Leer los movimientos con cuidado: el 44% del churn observado vuelve
        en t+1 y el 16,5% de las expansiones revierte al mes siguiente. El quick ratio está disponible, pero es
        muy ruidoso mes a mes (de 0,33 a 8,07): mejor usarlo trimestral.'
    - metric: MRR normalizado (proxy de MRR recurrente)
      definition: 'MRR re-expresado por mes de servicio: los pagos que son k veces el monto usual se reparten entre
        los k meses que cubren, y los excedentes sin patrón se reportan aparte.'
      formula: Si hay firma k≥2 y los k−1 meses previos están en cero → amount/k en cada uno (puesta al día). Si
        los ceros vienen después → amount/k hacia adelante (prepago). Si está rodeado de pagos → monto usual en
        el MRR y el excedente en «no clasificado». En el resto de filas, monto observado.
      grain: cliente × mes → mes
      milestone: mes de servicio inferido (no de cobro)
      notes: AMARILLO. Es una regla que tienes que aprobar; mostrarlo siempre junto al observado. Sigue el estándar
        de repartir los pagos multi-periodo entre los meses del intervalo (EXT-01). Sin periodo de servicio en la
        factura, es inferencia.
    - metric: ARR (run-rate anualizado)
      definition: Foto anualizada del MRR normalizado. Se llama run-rate, no ARR contractual.
      formula: 'ARR_rr(m) = 12 × MRR_norm(m); sensibilidad: 12 × promedio de 3 meses del MRR_obs'
      grain: mes (cierre)
      milestone: cierre de mes
      notes: AMARILLO. Según a16z, multiplicar un mes × 12 cuando hay cargos no recurrentes no es ARR. Si no se
        aprueba el MRR normalizado, mejor no mostrar ARR.
    - metric: ARPA por cliente (lo que se pide como ARPU)
      definition: 'Monto mensual promedio por cliente activo. Unidad: cuenta («Cliente N»), no usuario.'
      formula: ARPA(m) = MRR(m) ÷ clientes con pago > 0 en m; también por cohorte y por industria
      grain: mes; mes × cohorte; mes × industria
      milestone: mes calendario
      notes: 'VERDE. Pasa de 92.839 COP (ene-22) a 57.811 COP (oct-24). Reportarlo por cohorte: la base previa se
        mueve entre 82.884 y 110.073 COP y la cosecha 2024 entre 40.593 y 52.238 COP. El ARPU por usuario está en
        ROJO (no hay usuarios ni licencias).'
    - metric: ARPA de entrada (altas)
      definition: Monto mensual estabilizado con el que entra una cohorte.
      formula: Mediana de M1 (o del monto usual) de las altas de la cohorte; no usar M0
      grain: cohorte mensual o anual
      milestone: primera aparición (M0) → M1
      notes: VERDE, solo en cohortes limpias (desde mar-22). M1 es menor que M0 en 66 de 272 altas de 2022, 48 de
        650 de 2023 y 68 de 554 de 2024. ChartMogul y Skok recomiendan seguirlo aparte del ARPA total.
    - metric: Churn de logos observado
      definition: Clientes que pagaron el mes anterior y este mes pagan cero, sobre los activos del mes anterior.
        No es cancelación.
      formula: 'churn_obs(m) = #c{pago(m−1) > 0 y pago(m) = 0} ÷ activos(m−1)'
      grain: mes
      milestone: primer mes en cero
      notes: 'VERDE como dato, pero sesgado al alza como «churn»: 330 de 751 eventos vuelven a pagar al mes siguiente
        (117 con pago doble). Rango mensual entre 1,0% y 11,3% (mar-22–oct-24).'
    - metric: Churn de logos con ventana de gracia G
      definition: Cliente que pagó en m−1 y no paga en ninguno de los G meses siguientes. Si vuelve después, cuenta
        como reactivación.
      formula: 'churn_G(m) = #c{pago(m−1) > 0 y pago = 0 en m…m+G−1} ÷ activos(m−1); base G=3, sensibilidad G=1
        (= observado) y G=2'
      grain: mes (del primer mes sin pago)
      milestone: último mes con pago
      notes: 'AMARILLO: política a aprobar. Con G=3, 392 de 751 eventos (los que vuelven en 1–2 meses) dejan de
        ser churn, y los 56 eventos de sep–oct 24 quedan abiertos (censura a la derecha). ChartMogul trata la mora
        como una política configurable.'
    - metric: Churn bruto de MRR y GRR
      definition: 'MRR perdido por churn y contracción sobre el MRR del mes anterior. El GRR es su complemento:
        retención sin contar la expansión.'
      formula: gross_churn(m) = (|churn_MRR| + |contracción_MRR|) ÷ MRR(m−1); GRR = 1 − gross_churn; GRR 12m = Σ_c
        min(MRR_c(m), MRR_c(m−12)) ÷ Σ_c MRR_c(m−12)
      grain: mes; ventana de 12 meses
      milestone: mes calendario
      notes: VERDE sobre el MRR observado, AMARILLO sobre el normalizado. La fórmula del churn bruto sigue a ChartMogul;
        el GRR a 12 meses es una definición propuesta (sin fuente) y se puede calcular desde ene-23.
    - metric: NRR de la base existente
      definition: Cuánto MRR conservan y amplían los clientes que ya pagaban, sin contar las altas.
      formula: 'Mensual: (MRR(m−1) + expansión − contracción − churn) ÷ MRR(m−1). A 12 meses: MRR(m) de los activos
        en m−12 ÷ su MRR(m−12)'
      grain: mes; ventana de 12 meses; cohorte × tenure
      milestone: mes calendario / M12 de la cohorte
      notes: VERDE. La versión mensual ya está en el mart y excluye la reactivación (comprobado con feb-22). La
        reactivación se reporta aparte porque mezcla atrasos de cobro.
    - metric: Retención por cohorte (logos e ingreso)
      definition: Porcentaje de las altas de una cohorte que pagan en Mn, y MRR de la cohorte en Mn sobre su MRR
        de entrada.
      formula: 'Logos: activos_cohorte(Mn) ÷ altas_cohorte. Ingreso: MRR_cohorte(Mn) ÷ MRR_cohorte(M1)'
      grain: cohorte × tenure (Mn)
      milestone: primera aparición (M0)
      notes: 'VERDE para cohortes limpias. En M12 pagan el 87,1% (cosecha 2022) y el 89,1% (cosecha 2023, altas
        hasta oct-23). Con huecos de cobro, «paga en Mn» subestima la retención: calcularla también con la regla
        G.'
    - metric: Ingreso acumulado por alta a N meses (LTV empírico de ingreso)
      definition: Lo que pagó en promedio cada alta de una cohorte en sus primeros N meses.
      formula: Σ_{c∈cohorte} Σ_{t=0..N−1} pago(c,t) ÷ altas_cohorte; N = 12 (24 para las cosechas 2022)
      grain: cohorte
      milestone: primera aparición (M0)
      notes: 'VERDE. A 12 meses: 706.688 COP (cosecha 2022) y 496.402 COP (cosecha 2023, altas hasta oct-23). No
        es un LTV de vida completa ni con margen; es la base del LTV cuando exista el margen.'
    - metric: S&M por alta (proxy de CAC blended)
      definition: Gasto S&M del periodo dividido entre las altas del periodo, en las unidades del archivo.
      formula: 'Σ total_sm_spend ÷ Σ altas limpias (también en versión trimestral móvil); por grupo: Generación
        de Demanda, Team, Habilitación'
      grain: mes / trimestre móvil
      milestone: primera aparición
      notes: AMARILLO-ROJO. Da 0,0498 unidades por alta (mar-22–oct-24). No se puede convertir a COP ni comparar
        con el ARPA. Incluye Team + PayrollExpenses (26% del S&M) sin saber si es adquisición o KAM.
    - metric: CAC en COP por motion y canal, y CAC payback
      definition: Costo de adquisición asignado a cada motion (Self Service, Assisted, Executive) y canal (Digital,
        KAM) por cliente ganado. El payback son los meses de margen necesarios para recuperarlo.
      formula: CAC_motion = S&M de adquisición del motion ÷ clientes ganados del motion; payback = CAC ÷ (ARPA de
        entrada × margen bruto %)
      grain: motion × canal × trimestre; cohorte
      milestone: cierre ganado (CRM) o primer pago
      notes: ROJO. Requiere la unidad y moneda del S&M, la asignación de Team (adquisición frente a KAM), el motion
        y canal de cada cliente, y el margen bruto. Según a16z, hay que separar el paid CAC del blended.
    - metric: LTV con margen y LTV:CAC
      definition: Margen bruto que deja un cliente en un horizonte fijo, comparado con lo que costó adquirirlo.
      formula: LTV_N = margen bruto % × ingreso acumulado por alta a N meses (N = 24); como referencia, ARPA × margen
        ÷ churn mensual; LTV:CAC = LTV_N ÷ CAC
      grain: cohorte × motion
      milestone: primera aparición / cierre ganado
      notes: 'ROJO (faltan margen y CAC). La fórmula simple asume churn lineal, ignora la expansión (ChartMogul)
        y cambia con la regla G: es preferible un horizonte fijo por cohorte.'
    - metric: UCM (margen de contribución unitario)
      definition: Lo que queda del ingreso mensual de un cliente después de restar los costos variables de servirlo.
      formula: UCM = ARPA − costo variable por cliente (infraestructura, pasarela de pagos, soporte/onboarding,
        success, herramientas por usuario); UCM% = UCM ÷ ARPA
      grain: cliente × mes, o segmento (industria, tramo de monto, motion) × mes
      milestone: mes calendario
      notes: ROJO. El modelo no tiene costos de servir. Confirmar con Finora que UCM significa Unit Contribution
        Margin.
    required_events:
