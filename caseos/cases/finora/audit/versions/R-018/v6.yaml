- id: DM-01
  title: 'Métricas mensuales: MRR pagado, movimientos, ARPA, churn, NRR y S&M (ene-22–oct-24)'
  url: ''
  publisher: Finora · modelo analítico (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT month, window_flag, active_customers, new_customers, churned_customers, reactivated_customers, expanded_customers,
    contracted_customers, total_paid_mrr_cop, new_mrr_cop, expansion_mrr_cop, reactivation_mrr_cop, contraction_mrr_cop,
    churned_mrr_cop, mrr_per_active_customer_cop, logo_churn_rate, gross_mrr_churn_rate, net_mrr_retention_existing,
    quick_ratio, total_sm_spend, multi_month_payment_signatures, share_churn_returning_next_month FROM mart.monthly_metrics_phase1
    ORDER BY month
  verified: true
- id: DM-02
  title: Cobertura del panel cliente × mes
  url: ''
  publisher: Finora · modelo analítico (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT COUNT(*) AS filas, COUNT(DISTINCT customer_id) AS clientes, COUNT(DISTINCT month) AS meses, MIN(month)
    AS primer_mes, MAX(month) AS ultimo_mes, SUM(CASE WHEN observed_amount = 0 THEN 1 ELSE 0 END) AS filas_en_cero,
    SUM(CASE WHEN observed_amount > 0 THEN 1 ELSE 0 END) AS filas_con_pago, SUM(CASE WHEN observed_amount < 0 THEN
    1 ELSE 0 END) AS filas_negativas, SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS filas_firma_multimes
    FROM mart.customer_month
  verified: true
- id: DM-03
  title: Peso de los pagos con firma multimes en el monto total
  url: ''
  publisher: Finora · modelo analítico (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT ROUND(SUM(CASE WHEN multi_month_payment_signature > 0 THEN paid_mrr_cop ELSE 0 END)/SUM(paid_mrr_cop),4)
    AS share_monto_firma_multimes, ROUND(1.0*SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END)/SUM(CASE
    WHEN observed_amount > 0 THEN 1 ELSE 0 END),4) AS share_filas_firma_multimes, COUNT(DISTINCT CASE WHEN multi_month_payment_signature
    > 0 THEN customer_id END) AS clientes_con_firma FROM mart.customer_month
  verified: true
- id: DM-04
  title: Meses hasta volver a pagar tras un churn observado
  url: ''
  publisher: Finora · modelo analítico (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT CASE WHEN months_to_return IS NULL THEN 'no vuelve antes de oct-24' WHEN months_to_return = 1 THEN
    '1 mes' WHEN months_to_return = 2 THEN '2 meses' WHEN months_to_return = 3 THEN '3 meses' WHEN months_to_return
    BETWEEN 4 AND 6 THEN '4-6 meses' ELSE '7+ meses' END AS vuelve_en, COUNT(*) AS eventos_churn FROM mart.churn_events
    GROUP BY 1 ORDER BY 1
  verified: true
- id: DM-05
  title: Churn observado que vuelve en t+1 y con qué monto
  url: ''
  publisher: Finora · modelo analítico (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT COUNT(*) AS churn_rows, SUM(c.returned_next_month) AS vuelve_t1, SUM(c.returned_same_amount_next_month)
    AS vuelve_t1_mismo_monto, SUM(CASE WHEN n.observed_amount > 0 AND ABS(n.observed_amount*10000 - 2*c.previous_month_mrr)
    <= 0.005*2*c.previous_month_mrr THEN 1 ELSE 0 END) AS vuelve_t1_con_doble_pago, SUM(CASE WHEN c.month_index
    >= 31 THEN 1 ELSE 0 END) AS churn_en_ultimos_3_meses FROM mart.customer_month c LEFT JOIN mart.customer_month
    n ON n.customer_id = c.customer_id AND n.month_index = c.month_index + 1 WHERE c.churned_customer = 1
  verified: true
- id: DM-06
