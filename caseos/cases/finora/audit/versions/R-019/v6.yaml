cos_assessment:
  summary: 'R-019 trae dos cosas. La primera es un diagnóstico con confianza alta. El lado Revenue tiene base: el
    puente de MRR pagado observado cuadra 33 de 33 meses. Pero tiene ruido: el 44% del churn observado vuelve a
    pagar al mes siguiente con el mismo monto. El lado Growth no está en los datos: no hay leads, oportunidades,
    motion ni canal. La segunda es una propuesta con confianza media, basada en práctica y proveedores y sin evidencia
    de impacto: fuentes unidas por ID de cuenta, un bowtie por motion y un tablero por foro.


    Impacto:

    - **Q-003 cambia de framing.** La conexión que pide el CEO no se puede mostrar cuenta por cuenta. Propongo responderla
    por mitades más el eslabón que falta.

    - **D-007 queda en tensión.** R-019 es justo el diseño que D-007 dejó fuera, y D-015 sigue propuesta.

    - **Q-016 avanza, pero a medias.** La capa técnica no cubre H-005, H-006 ni H-008.


    Antes de aceptar F-145 a F-149, cuatro ajustes:

    1. El gasto de S&M no está en la capa técnica, y los foros mensual y trimestral dependen de él (R-013).

    2. Lo de «viene de forma nativa» (F-148) está documentado para HubSpot y Salesforce, pero no sabemos qué CRM
    usa Finora.

    3. Según F-149, decidir presupuesto pide experimentos. El foro mensual que mueve la Inversión en Marketing no
    se sostiene solo con un tablero.

    4. Lo que R-019 no puede concluir va como supuestos explícitos: herramientas, cómo se asigna el motion, evento
    de activación, unidad del gasto y margen.


    Siguientes pasos:

    1. Decidir entre D-015 y D-007.

    2. Aprobar o ajustar la reformulación de Q-003 para el Overview.

    3. Cruzar las fuentes de R-019 con el dato mínimo de R-010 y R-014.

    4. Revisar findings: hoy hay 0 aceptados, y sin eso nada entra al Story.'
  run_id: RUN-20260929-110606-cos-2530
  at: '2026-09-29T11:41:56-06:00'
  impacts:
  - target: Q-003
    effect: changes_framing
    why: 'R-019 deja establecido, con confianza alta (DM-0), que en los datos no hay leads, oportunidades, motion
      ni canal. Hoy no se puede unir, cuenta por cuenta, cómo llegó un cliente con cómo se mueve su MRR pagado observado.
      Solo hay dos mitades sueltas. En Revenue, el cambio se concentra en quién entra (R-004, R-009) y los clientes
      nuevos aportan menos a igual edad (R-006); nada de esto está aceptado todavía. En Growth solo hay mezcla de
      gasto, y la relación entre gasto y altas es una asociación agregada: el paso a efecto no es evaluable (R-015,
      T-025). Tal como está redactada, Q-003 promete una conexión que los datos no pueden mostrar. Además, el ID
      de cuenta de R-019 no basta para unir las dos mitades: también hace falta el gasto con unidad y clasificación
      (R-013), y la capa técnica de R-019 no lo incluye.'
  - target: Q-016
    effect: supports
    why: 'R-019 confirma con confianza alta que hoy no existe la evidencia mínima (DM-0), en línea con R-007 («la
      respuesta es la lista de evidencia que falta»). Además le pone contenedor: motion e historial de etapas en
      el CRM, canal desde la primera visita y estado de suscripción, todo unido por ID de cuenta. El avance es parcial.
      A primera vista, eso permitiría separar cantidad, mezcla y tiempo (las tres ramas de D-001) y ubicar el punto
      del recorrido donde se deteriora (H-007). Pero no trae lo que piden calidad al entrar (H-005), atención y
      capacidad (H-006, que según R-014 necesita SDR/AE y tiempos de contacto) ni oferta (H-008). Falta cruzar la
      capa técnica con el dato mínimo de R-010 y R-014 antes de presentarla como respuesta a Q-016.'
  - target: D-007
    effect: changes_framing
    why: 'R-019 entrega justo lo que D-007 dejó fuera: tableros por foro, un modelo de datos con ID de cuenta y
      métricas gobernadas. Lo mismo pasa, en distinto grado, con R-011, R-016 y R-018. D-007 sigue activa, y D-015,
      que lleva al plan lo que el caso pide proponer, sigue propuesta. Si no se resuelve, el Story Package tendría
      que dejar fuera la propuesta del CRO y el modelo de datos del CFO. Y eso pese a que el brief los pide («operar
      de forma recurrente»; «mecanismo, modelo de datos y clasificación») y la pregunta ejecutiva del framing incluye
      «qué modelos se proponen». No toco D-007: la decisión es tuya.'
