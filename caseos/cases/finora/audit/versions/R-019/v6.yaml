task_why: Sin decisiones del CRO, la solución es un catálogo de dashboards; atada a decisiones y foros, es la acción
  con la que cierra Growth.
task:
  work: propuesta
  draft_answer: 'Dos capas y en ese orden, como lo planteaste. La técnica: que cada lead tenga fecha de entrada,
    puerta y canal, etapa con fecha y dueño, y que se pueda unir con el primer pago. Si el CRM ya lo registra, es
    cuestión de conectarlo; si no, de pulirlo. A eso se suma analítica digital para ver el recorrido de Self Service.
    La de decision making: dashboards automatizados por foro, análisis ad hoc para lo que salga y agentes de IA
    encima de las mismas definiciones. El hueco es que no sabemos qué decisiones quiere tomar el CRO ni qué foros
    tiene, así que la propuesta arranca de decisiones candidatas (dónde poner capacidad, qué canal escalar o cortar,
    qué leads priorizar) para que Finora las confirme.'
  hugo_said:
  - text: Dashboards automatizados con métricas de acuerdo a los foros / Análisis Adhoc / Agentes de inteligencia
      artificial como el mío jaja
    ref: N-009
  - text: Técnica… Pulir su CRM / Implementación de Analítica Digital
    ref: N-010
  steps:
  - kind: research
    what: Cómo organizan sus foros y cadencias los equipos comerciales SaaS con modelo híbrido (revisión semanal
      de pipeline, revisión mensual del negocio), qué métricas viven en cada foro y cómo se usan agentes de IA sobre
      una capa común de definiciones. El objetivo es proponer una forma de operar, no una lista de dashboards.
    where: []
  - kind: proposal
    what: 'Mapa de decisiones: decisión candidata del CRO → pregunta → métrica o vista → foro y cadencia → dueño.
      Todas marcadas como candidatas a confirmar con Finora.'
    where: []
  - kind: proposal
    what: 'Capa técnica: campos y eventos mínimos del CRM (del inventario de RT-001), eventos de analítica digital
      para Self Service y definiciones comunes antes de dashboards, ad hoc y agentes. Todo en papel: en esta etapa
      no se construyen dashboards.'
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: Define qué puede decidir el CRO cada semana, cada mes y cada trimestre, y qué datos faltan para
  distinguir sus explicaciones (Q-016). Sin unir motion y canal con el MRR contratado de cada cuenta, no hay forma
  de mostrar cómo la manera de conseguir clientes se convierte en ingreso recurrente (Q-003).
short_answer: 'Propongo dos capas. La técnica: CRM con motion e historial de etapas, analítica digital que registre
  el canal desde la primera visita, y facturación con MRR contratado y estado de suscripción, todo unido por un
  ID de cuenta en el modelo analítico que ya existe. La de decisión: un bowtie por motion (Self Service, Assisted,
  Executive/KAM), un tablero por foro (semanal, mensual y trimestral), análisis ad hoc por hipótesis y agentes de
  IA que trabajen solo sobre métricas gobernadas, es decir, con una sola definición aprobada. Con eso el CRO decidiría
  cada semana qué oportunidades intervenir, cada mes cómo mover la Inversión en Marketing y las reglas de enrutamiento
  entre motions, y cada trimestre el reparto entre Generación de Demanda, Team y Habilitación. Hoy los datos solo
  alimentan el lado Revenue, y con ruido (el 44% del churn observado vuelve a pagar al mes siguiente); el lado Growth
  no se puede medir. Confianza alta en ese diagnóstico de datos y media en el diseño, porque las fuentes son de
  práctica y de proveedores y no hay evidencia de impacto.'
