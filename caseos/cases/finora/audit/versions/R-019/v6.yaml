alternative_explanations:
- El ruido del churn observado (44% vuelve al mes siguiente con el mismo monto) puede ser cobro tardío, fallo de
  pago, pausa voluntaria o prepago. Sin el estado contractual no se sabe cuál domina.
- Las expansiones que se revierten al mes siguiente pueden ser pagos atrasados acumulados o prepagos, no upsell
  real.
- La cola de primeros pagos altos puede ser prepago de varios meses (12 de 42 casos) o clientes más grandes, y no
  necesariamente otro motion.
- El mayor peso de la capacidad comercial desde 2023 puede reflejar más Team o KAM, cambios de nómina o una reclasificación
  contable. Sin headcount por motion no se sabe.
- Que el funnel no esté en el modelo puede ser un problema de integración (Finora ya tendría un CRM con historial)
  y no de instrumentación. Eso cambia el costo y el plazo, no el diseño.
what_is_established:
- El modelo del caso no tiene eventos del funnel (leads, oportunidades, motion ni canal), así que hoy no se puede
  calcular ninguna conversión ni CAC por motion (DM-0).
- El puente mensual de MRR pagado cuadra en 33 de 33 meses (DM-10). El lado Revenue tiene una base consistente,
  pero de pagos, no de contrato.
- 'El churn observado mes a mes mezcla el momento del cobro: el 44% vuelve a pagar al mes siguiente con el mismo
  monto (DM-4) y el 17% de los clientes tiene al menos un pago de varios meses (DM-9).'
- HubSpot y Salesforce guardan de forma nativa las fechas de entrada y salida de cada etapa o el historial de la
  oportunidad (HS-1, SF-1). Un sistema de facturación como Stripe distingue el estado de la suscripción y normaliza
  el MRR (ST-1).
- Los marcos de práctica miden volumen, conversión y tiempo por etapa de punta a punta y separan los caminos self-serve
  y asistido (WBD-1, DT-1, AB-1).
what_is_contested:
- Si los agentes de IA mejoran la productividad comercial. Gartner anticipa que menos del 40% de los vendedores
  lo percibirá (GT-1), mientras otro comunicado asocia la IA con crecimiento (GT-2), probablemente como correlación.
- 'Qué tan causal es la atribución data-driven: Google la describe como contrafactual (GA-1), pero sigue siendo
  un modelo sobre datos observados.'
- Si el marco principal debe ser el Bowtie o el Revenue Waterfall. Depende del peso del motion Executive/KAM, que
  no conocemos.
- Las cifras de mejora por instalar una cadencia comercial que circulan en blogs de proveedores no tienen fuente
  verificable, así que no las uso.
what_remains_unknown:
- Qué CRM, qué sistema de facturación y qué analítica digital usa Finora, y desde cuándo guardan historial.
- Cómo se asigna hoy una cuenta a Self Service, Assisted o Executive, y si eso queda registrado.
- Qué evento del producto define la «activación» en Self Service.
- La unidad del gasto S&M y el margen bruto, que se necesitan para CAC y payback.
- Cuánto pesa cada motion en las altas y en el MRR.
- Si se puede reconstruir el motion y el canal de los clientes actuales, sobre todo de los 377 de la base previa.
case_implication: 'Para Finora, la respuesta al bloque Growth/CRO no es una tasa de conversión: es una Propuesta
  de Modelo de datos más un WoW (forma de trabajo) por foro. La instrumentación iría en este orden. Primero la facturación:
  arregla el lado Revenue que ya existe y permite hablar de MRR contratado en vez de pagado. Después, el motion
  y el historial de etapas en el CRM. Luego, el canal en la analítica digital. Encima van los tableros por foro,
  el análisis ad hoc y, al final, los agentes de IA. Esto responde Q-003: solo uniendo, para cada cuenta, motion,
  canal y MRR contratado se puede ver cómo la manera de conseguir clientes se convierte en ingreso recurrente. Y
  concreta Q-016: la evidencia mínima son cuatro campos por cuenta (motion, canal, fecha de cada hito y estado contractual
  con MRR). Sin ellos, ninguna explicación del CRO sobre el funnel se puede distinguir de otra con los datos actuales.
  Lo que sí se puede mostrar hoy es la mezcla de gasto (más peso de la capacidad comercial desde 2023 y menos Habilitación)
  y la salud del lado Revenue, con la salvedad del churn observado. Nada de esto afirma conversiones del funnel.'
changes_current_story:
  value: maybe
  why: No cambia el diagnóstico, pero agrega la sección de solución (Propuesta de Modelo de datos + WoW por foro)
    y obliga a presentar Growth como «qué hay que instrumentar y qué decisiones habilita», no como conversiones.
    También refuerza la salvedad del churn observado en Revenue. Hugo decide si entra a la historia.
affected_hypotheses:
- id: Q-016
  effect: changes_framing
  why: 'Es una pregunta, no una hipótesis. La evidencia mínima para distinguir las explicaciones del CRO queda definida
    como cuatro campos por cuenta: motion, canal, fecha de cada hito y estado contractual con MRR contratado. Sin
    ellos, ninguna explicación sobre el funnel se distingue de otra con los datos actuales.'
- id: Q-003
  effect: requires_research
  why: Es una pregunta, no una hipótesis. Solo se responde uniendo, para cada cuenta, motion y canal con MRR contratado
    (el nudo del bowtie). Con los datos actuales se puede mostrar el lado Revenue y la mezcla de gasto, pero no
    la conexión.
affected_claims: []
suggested_action: Propongo armar una lámina «Propuesta de Modelo de datos» con las dos capas y una matriz foro ×
  métricas × decisiones, y pedir a Data Engineering un borrador de algo equivalente a account_milestones (cuenta
  × hito × fecha × motion × canal) y subscription_month (MRR contratado), conectados al modelo actual. Antes, conviene
  verificar en el material del caso qué sistemas y reglas de motion existen; si no aparecen, se presentan como supuestos
  explícitos.
new_questions:
- ¿Qué CRM y qué sistema de facturación usa Finora, y desde qué fecha guardan historial de etapas y estado de suscripción?
- ¿Con qué regla se asigna hoy una cuenta a Self Service, Assisted o Executive, y en qué campo o sistema queda registrada?
- ¿Qué acción en el producto define que un cliente Self Service está «activado»?
handoff_to_cos:
  summary: 'R-019 propone una solución en dos capas. La técnica: CRM con motion e historial de etapas, analítica
    digital con canal y facturación con MRR contratado y estado de suscripción, unidos por un ID de cuenta en el
    modelo actual. La de decisión: bowtie por motion, un tablero por foro (semanal, mensual, trimestral), análisis
    ad hoc por hipótesis y agentes de IA sobre una capa semántica. Hoy solo el lado Revenue es medible, y con ruido
    (el 44% del churn observado vuelve al mes siguiente); el lado Growth no está en los datos. Afecta Q-003 y Q-016.'
  recommended_next: Llevar a Hugo la propuesta de lámina (dos capas + matriz foro × decisión) para que decida si
    entra al bloque Growth/CRO. En paralelo, pedir a Data Engineering el borrador de account_milestones y subscription_month,
    y verificar en el caso qué sistemas y reglas de motion existen.
confidence_buckets:
  high_confidence:
  - Hoy no se puede medir el lado Growth con el modelo del caso.
  - 'El churn observado mes a mes tiene ruido de cobro: el 44% vuelve al mes siguiente con el mismo monto.'
  - HubSpot, Salesforce y Stripe ya traen de forma nativa el historial de etapas y el estado de suscripción.
  plausible:
  - Un bowtie por motion, con alcance por cohorte y tiempo entre hitos, es la estructura adecuada para Finora.
  - Un tablero por foro (semanal, mensual, trimestral) como WoW del CRO.
  - Los agentes de IA sirven para vigilancia, pre-lecturas e higiene del CRM si trabajan sobre una capa semántica.
  contested:
  - El impacto de los agentes de IA en la productividad comercial.
  - El carácter causal de la atribución data-driven.
  - Bowtie o Revenue Waterfall, según el peso de Executive/KAM.
  unknown:
  - Qué sistemas usa Finora hoy y qué historial tienen.
  - Las reglas de asignación de motion y la definición de activación.
  - La unidad del gasto S&M y el margen bruto.
  - El peso de cada motion en altas y en MRR.
specialist:
  measurement:
    problem_interpretation: 'El CRO no tiene un funnel, tiene varios. Self Service, Assisted y Executive/KAM entran
      por hitos distintos, se saltan etapas y terminan en los mismos resultados económicos: MRR contratado, retención
      y expansión. Hoy Finora solo tiene pagos observados cliente × mes, la industria y el gasto S&M mensual por
      rubro. El lado Revenue se ve mes a mes, pero con ruido de cobro (el 44% del churn observado vuelve al mes
      siguiente), y el lado Growth no se ve. La solución tiene que hacer dos cosas: (a) registrar los hitos que
      faltan en el CRM, la analítica digital y la facturación, unidos por un ID de cuenta dentro del modelo analítico
      que ya existe; y (b) organizar el uso de los datos por foro y por decisión (tableros por foro, análisis ad
      hoc y agentes de IA) sobre definiciones únicas.'
    measurement_objective: Que el CRO pueda decidir cada semana qué oportunidades y cuentas intervenir; cada mes,
      cómo mover la Inversión en Marketing entre canales y entre ToFu y BoFu y cómo ajustar el enrutamiento entre
      Self Service, Assisted y Executive; y cada trimestre, cómo repartir el presupuesto entre Generación de Demanda,
      Team y Habilitación. Para eso necesita ver, por motion y por canal, cuántas cuentas entran (volumen), qué
      parte llega a cada hito y en cuánto tiempo (tasa y tiempo), y cuánto MRR contratado retiene y expande cada
      cohorte (valor).
    recommended_framework:
      name: Bowtie por motion con hitos + WoW por foro
      structure: 'Unidades: la cuenta como unidad principal, la oportunidad para Assisted y Executive, y la suscripción
        para Revenue. Lado izquierdo, uno por motion: Self Service = registro → activación → primer contrato; Assisted
        = lead o SQL directo (solicitud de demo) → oportunidad → contrato; Executive (con KAM en la post-venta)
        = cuenta objetivo → oportunidad → contrato. En cada hito se mide el volumen, el alcance de la cohorte a
        30, 60 y 90 días y el tiempo entre hitos. Nudo común: el primer contrato, con MRR contratado normalizado.
        Lado derecho, común a todos los motions: activación y onboarding, retención de logos y de MRR por cohorte
        (NRR y GRR), expansión (KAM vs. upgrade Self Service), churn contractual y payback por motion. Capa de decisión:
        foro semanal (pipeline, estancamiento, handoffs), foro mensual Growth & Revenue (motion × canal × cohorte),
        foro trimestral de planeación (inversión, capacidad, supuestos), análisis ad hoc por hipótesis y agentes
        de IA de vigilancia, pre-lectura e higiene del CRM sobre una capa semántica.'
      why: '(1) Evita una tasa mezclada que no describe a nadie: cada motion tiene su propio hito de entrada. (2)
        Conecta la adquisición con el ingreso recurrente (Q-003), porque el nudo une motion y canal con el MRR contratado
        de cada cuenta. (3) Usa la taxonomía volumen–conversión–tiempo del Bowtie (WBD-1, DT-1), que ya separa volumen,
        tasa y valor. (4) Reutiliza el modelo actual: el puente de MRR, que ya cuadra en 33 de 33 meses (DM-10),
        pasa de pagos a contrato. (5) El alcance por cohorte tolera que una cuenta se salte etapas; la conversión
        etapa a etapa no.'
    alternative_frameworks:
    - name: B2B Revenue Waterfall (Forrester), centrado en oportunidades y buying groups
      when_better: Si el motion Executive/KAM concentra el MRR nuevo y cada compra involucra a varios decisores.
      tradeoff: No cubre bien Self Service ni la post-venta (retención y expansión), y exige registrar en el CRM
        los contactos y roles del buying group.
    - name: Funnel lineal de leads (MQL → SQL → oportunidad → ganado) con atribución multi-touch
      when_better: Si casi todo el ingreso entra por Assisted y se necesita algo rápido con los reportes nativos
        del CRM.
      tradeoff: Fuerza un camino lineal, mezcla los motions en una sola tasa y deja fuera Self Service y la retención.
        La atribución reparte crédito; no prueba qué canal causa el alta.
    metric_definitions:
    - metric: '[Volumen] Entradas por motion'
      definition: Cuentas que entran a un motion en el periodo, contadas en el hito de entrada propio de ese motion.
      formula: COUNT(DISTINCT account_id) con fecha_entrada en el periodo, por motion y canal
      grain: cuenta × mes de entrada × motion × canal
      milestone: 'Self Service: registro. Assisted: lead calificado o SQL directo (solicitud de demo). Executive:
        oportunidad abierta sobre una cuenta objetivo. Hitos a validar con Finora.'
      notes: 'Se muestran lado a lado; nunca se suman como si fueran el mismo hito. Eventos: registro_self_service,
        lead_creado, etapa_ciclo_de_vida_cambiada, oportunidad_creada, motion_asignado.'
    - metric: '[Tasa] Alcance a hito a N días'
      definition: Parte de una cohorte de entrada que llega a un hito dado dentro de N días, aunque se salte etapas
        intermedias.
      formula: COUNT(cuentas de la cohorte con fecha_hito ≤ fecha_entrada + N) / COUNT(cuentas de la cohorte); N
        = 30, 60 o 90
      grain: cohorte (mes de entrada) × motion × canal
      milestone: Desde la entrada al motion hasta la activación, la oportunidad o el primer contrato
      notes: Reemplaza la conversión etapa a etapa y tolera los saltos. Solo se lee cuando la cohorte ya cumplió
        N días; las cohortes abiertas se marcan.
    - metric: '[Tiempo] Tiempo entre hitos (Δt)'
      definition: Días entre dos hitos, para las cuentas que alcanzaron ambos.
      formula: Mediana y p75 de (fecha_hito_B − fecha_hito_A)
      grain: cuenta; se reporta por cohorte × motion
      milestone: 'Pares por motion: registro → activación, SQL → oportunidad, oportunidad → contrato, contrato →
        primer pago'
      notes: Se lee siempre junto al alcance, porque solo mide a quien llegó (sesgo de supervivencia).
    - metric: '[Tiempo] Estancamiento'
      definition: Parte de las cuentas u oportunidades abiertas que llevan en su etapa actual más tiempo que el
        p75 histórico de su motion y etapa.
      formula: COUNT(abiertas con tiempo_en_etapa > p75_motion_etapa) / COUNT(abiertas)
      grain: oportunidad o cuenta × semana (foto semanal)
      milestone: Fecha de entrada a la etapa actual
      notes: Métrica del foro semanal y disparador para los agentes de vigilancia. El umbral se recalibra cada trimestre.
    - metric: '[Tasa] Win rate por motion'
      definition: Oportunidades ganadas sobre oportunidades cerradas, por cohorte de creación.
      formula: COUNT(ganadas) / COUNT(ganadas + perdidas), por motion y mes de creación
      grain: oportunidad; se reporta por cohorte de creación × motion
      milestone: Creación de la oportunidad
      notes: Solo aplica a Assisted y Executive (Self Service no tiene oportunidad). Se mide por cohorte de creación
        y no por mes de cierre, para no mezclar periodos.
    - metric: '[Volumen/valor] Pipeline creado y cobertura'
      definition: MRR esperado de las oportunidades creadas en el periodo, y qué parte del objetivo de nuevo MRR
        cubre el pipeline abierto.
      formula: pipeline_creado = SUM(mrr_esperado) de las oportunidades creadas; cobertura = SUM(mrr_esperado de
        las abiertas con cierre esperado en el periodo) / objetivo_nuevo_MRR
      grain: oportunidad × semana
      milestone: Creación de la oportunidad y fecha de cierre esperada
      notes: Solo Assisted y Executive. Los cambios de fecha de cierre alimentan el disparador de revisión fuera
        de ciclo.
    - metric: '[Valor] Nuevo MRR contratado por motion y canal'
      definition: MRR mensual normalizado de las suscripciones nuevas del periodo.
      formula: SUM(mrr_normalizado) de las suscripciones cuyo primer periodo facturable cae en el periodo (plan
        anual ÷ 12; neto de descuentos recurrentes)
      grain: suscripción × mes, con motion y canal heredados de la cuenta
      milestone: Inicio del primer periodo facturable
      notes: No es lo mismo que el monto pagado observado del modelo actual; se reconcilia mes a mes contra los
        pagos.
    - metric: '[Valor] Ticket inicial por motion'
      definition: MRR contratado mediano de las altas del periodo, por motion.
      formula: Mediana (y p25/p75) de mrr_normalizado en M0, por motion
      grain: alta × mes × motion
      milestone: Primer contrato
      notes: 'Separa el valor del volumen. Hoy el primer pago observado mezcla prepagos: 12 de las 42 altas con
        M0 de 200.000 COP o más (DM-11).'
    - metric: '[Tasa] Cruce entre motions'
      definition: Parte de las cuentas que cierran en un motion distinto al de entrada (por ejemplo, Self Service
        → Assisted).
      formula: COUNT(cuentas con motion_al_cierre ≠ motion_de_entrada) / COUNT(cuentas de la cohorte que cerraron)
      grain: cohorte de entrada × motion de entrada
      milestone: De la entrada al primer contrato
      notes: Alimenta la decisión sobre las reglas de enrutamiento. Requiere el historial del evento motion_asignado.
    - metric: '[Tasa] Retención de logos por cohorte'
      definition: Parte de las cuentas de una cohorte con suscripción activa (active o past_due) k meses después
        de su M0.
      formula: COUNT(cuentas de la cohorte activas en M_k) / COUNT(cuentas de la cohorte)
      grain: cohorte (mes del primer contrato) × motion × canal × k
      milestone: Primer periodo facturable (M0)
      notes: Churn = suscripción cancelada o unpaid según el estado contractual, no «no pagó este mes».
    - metric: '[Valor] NRR y GRR por cohorte y motion'
      definition: MRR contratado que conserva una cohorte frente a su MRR inicial, con expansión (NRR) y sin ella
        (GRR).
      formula: 'NRR_k = MRR_Mk / MRR_M0 de la cohorte; GRR_k = (MRR_M0 − contracción acumulada − churn acumulado)
        / MRR_M0. Versión anual: (inicio + expansión − contracción − churn) / inicio'
      grain: cohorte × motion × k
      milestone: M0 de la cohorte
      notes: La expansión se separa por origen (KAM vs. upgrade Self Service) cuando exista suscripcion_modificada
        con el campo iniciado_por.
    - metric: '[Calidad de dato] Churn observado vs. contractual'
      definition: Parte de los meses sin pago que corresponden a suscripciones todavía activas o past_due.
      formula: COUNT(churn observado con estado active o past_due) / COUNT(churn observado)
      grain: cliente × mes
      milestone: Mes del churn observado
      notes: Métrica de transición. Hoy 330 de 751 churn observados (44%) vuelven al mes siguiente con el mismo
        monto (DM-4); esta métrica dice cuánto del churn histórico era en realidad un tema de cobro.
    - metric: '[Eficiencia] Costo por hito y payback por motion'
      definition: Gasto S&M asignado a un motion o canal dividido por el volumen de un hito, y meses que tarda en
        recuperarse ese gasto con el nuevo MRR contratado.
      formula: costo_por_hito = gasto_asignado / COUNT(hito); payback_meses = gasto_asignado / (nuevo_MRR_contratado
        × margen_bruto)
      grain: motion × canal × trimestre
      milestone: Entrada (costo por entrada) y primer contrato (costo por alta)
      notes: Requiere confirmar la unidad del gasto, conocer el margen bruto y acordar reglas para asignar Team
        y Payroll a cada motion; nada de eso está en el modelo. Asignar crédito no prueba causa.
    required_events:
    - event: visita_con_campana
      trigger: Sesión web con parámetros UTM o un referido identificable
      properties:
      - anonymous_id
      - utm_source / utm_medium / utm_campaign
      - etapa objetivo de la campaña (ToFu o BoFu)
      - landing_page
      - referrer
      - timestamp
    - event: lead_creado
      trigger: Formulario, solicitud de demo, evento, referido o prospección outbound
      properties:
      - lead_id
      - account_id (cruce por dominio)
      - tipo de entrada (demo, contacto, contenido, outbound, referido)
      - canal de primer toque y de último toque
      - industria
      - tamaño declarado
      - timestamp
    - event: registro_self_service
      trigger: Creación de una cuenta o una prueba en el producto
      properties:
      - account_id
      - user_id
      - plan de prueba
      - canal (UTM heredado)
      - industria
      - timestamp
    - event: activacion_alcanzada
      trigger: Primera vez que la cuenta completa la acción de valor definida por Producto
      properties:
      - account_id
      - evento de activación
      - días desde el registro
      - timestamp
    - event: etapa_ciclo_de_vida_cambiada
      trigger: Cambio de lifecycle stage en el CRM (MQL, PQL, SQL, cliente)
      properties:
      - account_id
      - etapa_origen
      - etapa_destino
      - origen del cambio (regla o manual)
      - criterio de calificación
      - owner
      - timestamp
    - event: motion_asignado
      trigger: Regla de enrutamiento o decisión manual, incluida la reasignación
      properties:
      - account_id
      - motion (Self Service, Assisted, Executive)
      - motion previo
      - regla o motivo
      - owner
      - timestamp
    - event: oportunidad_creada
      trigger: Apertura de una oportunidad en el CRM
      properties:
      - opportunity_id
      - account_id
      - motion
      - owner
      - fuente
      - mrr_esperado
      - fecha_cierre_esperada
      - timestamp
    - event: oportunidad_etapa_cambiada
      trigger: Cambio de etapa, de monto o de fecha de cierre
      properties:
      - opportunity_id
      - etapa_origen
      - etapa_destino
      - mrr_esperado
      - fecha de cierre esperada anterior y nueva
      - probabilidad
      - timestamp
    - event: oportunidad_cerrada
      trigger: Cierre ganado o perdido
      properties:
      - opportunity_id
      - resultado (ganada o perdida)
      - motivo de pérdida
      - mrr_contratado
      - plan
      - descuento
      - timestamp
    - event: suscripcion_iniciada
      trigger: Inicio del primer periodo facturable
      properties:
      - subscription_id
      - account_id
      - plan
      - intervalo de facturación (mensual, trimestral, anual)
      - mrr_normalizado
      - descuento (recurrente o único)
      - motion al cierre
      - opportunity_id si aplica
      - fecha_inicio
    - event: suscripcion_modificada
      trigger: Upgrade, downgrade o cambio de cantidad
      properties:
      - subscription_id
      - mrr_anterior
      - mrr_nuevo
      - motivo
      - iniciado_por (cliente Self Service, KAM, Assisted)
      - fecha_efectiva
    - event: factura_pagada / pago_fallido
      trigger: Resultado de cada intento de cobro
      properties:
      - invoice_id
      - account_id
      - monto
      - periodo cubierto (desde–hasta)
      - estado
      - días de mora
    - event: suscripcion_cancelada
      trigger: Solicitud de cancelación o paso a unpaid
      properties:
      - subscription_id
      - fecha de solicitud
      - fecha efectiva
      - motivo
      - voluntaria o involuntaria (impago)
      - timestamp
    - event: gasto_mensual_asignado
      trigger: Cierre contable mensual (es un registro, no un evento de usuario)
      properties:
      - mes
      - rubro
      - canal
      - motion
      - etapa (ToFu o BoFu)
      - monto
      - unidad y moneda
    required_dimensions:
    - dimension: Motion (Self Service, Assisted, Executive)
      why: Es la unidad de comparación del lado izquierdo. Se guarda al entrar y al cerrar para medir los cruces
        y no mezclar tasas.
    - dimension: 'Canal de adquisición (Digital: paid media, orgánico, directo; no digital: PublicidadNoWeb, eventos,
        referidos, outbound)'
      why: Decide la Inversión en Marketing. Hay que guardar el primer toque y la fuente del lead, no solo el último
        clic.
    - dimension: Etapa objetivo de la inversión (ToFu o BoFu)
      why: Permite decidir cómo repartir la Generación de Demanda entre crear demanda y convertirla.
    - dimension: Cohorte de entrada y cohorte de cliente (mes de M0)
      why: Las tasas y la retención dependen de la antigüedad; sin cohorte se mezclan periodos.
    - dimension: Antigüedad k (meses desde M0)
      why: Es el eje de la retención de logos, del NRR y del GRR.
    - dimension: Industria
      why: Es la única dimensión de segmento que ya existe (6 valores) y sirve de puente con el histórico.
    - dimension: Tamaño o segmento de la cuenta
      why: Es criterio de enrutamiento y de comparación de ticket. No se puede deducir de los pagos, porque los
        prepagos contaminan el M0.
    - dimension: Estado contractual (active, past_due, canceled, unpaid)
      why: Separa el churn real del momento del cobro.
    - dimension: Plan e intervalo de facturación
      why: Normaliza el MRR y explica los pagos de varios meses.
    - dimension: Owner y rol (SDR, AE, KAM)
      why: Solo para el foro semanal (gestión de oportunidades y capacidad); no sirve para comparar motions.
    - dimension: Grupo de gasto (Generación de Demanda, Team, Habilitación)
      why: Conecta el gasto con las decisiones trimestrales; ya existe en mart.sm_monthly.
    decision_enabled: 'Semanal (CRO + líderes de Assisted y Executive + RevOps): qué oportunidades avanzar, deslizar
      o descalificar; dónde reasignar capacidad; qué handoffs de Self Service a Assisted se están cayendo; cómo
      ajustar el forecast del mes. Mensual (CRO + Marketing + CS/KAM + Finanzas): cómo mover la Inversión en Marketing
      entre canales (Digital vs. no digital) y entre ToFu y BoFu según el alcance y la retención por cohorte; cómo
      ajustar las reglas de enrutamiento entre Self Service, Assisted y Executive; qué cuentas KAM priorizar para
      expansión o rescate; qué análisis ad hoc lanzar. Trimestral (CEO + CFO + CRO): cómo repartir entre Generación
      de Demanda, Team y Habilitación según el payback por motion; contratación; metas por motion; supuestos del
      forecast; qué experimentos correr (holdouts de medios, pruebas de enrutamiento, política de descuentos). Ad
      hoc: responder hipótesis concretas con la pregunta, el dato y la decisión explícitos. Agentes de IA: vigilar
      los disparadores, preparar la pre-lectura de cada foro y mantener la higiene del CRM; no deciden ni afirman
      causas.'
    limitations:
    - 'Con los datos actuales no se puede calcular ninguna métrica del lado Growth: no hay leads, oportunidades,
      motion ni canal (DM-0).'
    - 'Probablemente no se puede reconstruir el histórico por motion ni por canal: 377 clientes ya pagaban en ene-22
      y 108 tienen sospecha de arrastre (DM-6). Salvo que el CRM tenga historial, las cohortes por motion empiezan
      el día que empiece la instrumentación.'
    - Las métricas de alcance por cohorte necesitan que la cohorte cumpla N días, así que las primeras lecturas
      mensuales serán parciales (inferencia).
    - La atribución reparte crédito, no prueba causa; para mover presupuesto hacen falta experimentos (holdouts).
      Un MMM con 34 meses de gasto mensual, sin geografía y con unidad no documentada sería frágil (inferencia a
      partir de GM-1 y DM-3).
    - El payback por motion depende de cómo se asignen Team y Payroll a cada motion y del margen bruto, que no están
      en el modelo. Una regla arbitraria distorsiona la comparación.
    - Los agentes de IA solo son confiables sobre definiciones gobernadas y, aun así, fallan en juicios como rechazar
      métricas no definidas (GR-1). Su efecto en la productividad es incierto (GT-1).
    - Las fuentes sobre cadencia y embudos híbridos son de práctica y de proveedores. El diseño se justifica porque
      encaja con el problema, no por evidencia de impacto.
    implementation_implications:
    - 'Orden propuesto: (1) facturación: MRR contratado y estado de suscripción, reconciliados contra los pagos;
      (2) CRM: campo motion obligatorio, historial de etapas y oportunidades con MRR esperado y motivo de pérdida;
      (3) analítica digital: UTM y canal capturados desde la primera visita y heredados al lead y a la cuenta; (4)
      tableros por foro; (5) agentes de IA.'
    - Data Engineering necesita una llave de cuenta que cruce CRM, facturación, producto y el «Cliente N» del modelo
      actual, y tablas equivalentes a account_milestones (cuenta × hito × fecha × motion × canal), opportunity_history
      y subscription_month (MRR contratado). customer_month (pagado) se conserva para reconciliar.
    - Una capa semántica con una sola definición de MRR contratado, churn contractual, motion, alcance y tiempo
      entre hitos, que usen por igual los tableros, el análisis ad hoc y los agentes.
    - 'Un tablero por foro, no por área: cada tablero responde solo las preguntas de su foro, con disparadores explícitos
      y enlaces al análisis ad hoc.'
    - 'Gobierno del CRM: campos obligatorios al cambiar de etapa (motion, fuente, MRR esperado, fecha de cierre,
      motivo de pérdida) y reglas de validación. RevOps es dueño de las definiciones; el CRO, de las decisiones.'
    - 'Gasto: registrar cada mes el gasto por rubro × canal × motion, con unidad y moneda explícitas; mapear PaidMedia
      a Digital y PublicidadNoWeb a no digital, y asignar Team y Payroll por motion con una regla acordada.'
    - 'Análisis ad hoc con una ficha por hipótesis: pregunta, decisión que cambiaría, dato, método (cohorte o experimento)
      y umbral de acción.'
    - 'Diseño experimental desde el primer día: holdouts de medios por periodo o región y pruebas de umbrales de
      enrutamiento, con una métrica primaria (alcance a contrato a 60 días o MRR contratado por cuenta) y métricas
      de resguardo (retención en M3).'
    - 'Agentes de IA en piloto, con grupo de control y alcance limitado: vigilancia de disparadores, pre-lectura
      de los foros, higiene del CRM y preguntas sobre la capa semántica. Nunca sobre tablas crudas.'
