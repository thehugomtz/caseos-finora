- id: DM-0
  title: Qué tablas y columnas existen en el modelo (¿hay datos de funnel, motion o canal?)
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta; datos hasta 2024-10)
  source_type: data_model
  quality: A
  note: 'catalogo_modelo(): llamada al catálogo, sin SQL. Tablas: raw.transactions, raw.industry, raw.sm_spend,
    staging.stg_customers, staging.stg_customer_month, staging.stg_sm_spend, mart.customer_month, mart.monthly_metrics,
    mart.monthly_metrics_phase1, mart.new_customers, mart.churn_events, mart.sm_monthly, mart.vintage_month. Ninguna
    tiene columnas de lead, oportunidad, motion, canal, owner, plan o estado contractual.'
  verified: true
- id: DM-1
  title: Ventana del modelo y totales de altas, churn observado y reactivaciones
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta; datos hasta 2024-10)
  source_type: data_model
  quality: A
  note: SELECT MIN(month) AS first_month, MAX(month) AS last_month, COUNT(*) AS months, SUM(new_customers) AS total_new,
    SUM(churned_customers) AS total_churn_events, SUM(reactivated_customers) AS total_reactivations FROM mart.monthly_metrics
  verified: true
- id: DM-2
  title: Clientes por industria
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT industry, COUNT(*) AS customers FROM staging.stg_customers GROUP BY industry ORDER BY customers DESC
  verified: true
- id: DM-3
  title: Rubros de gasto S&M y meses cubiertos
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT rubro, COUNT(*) AS months, MIN(month) AS first_month, MAX(month) AS last_month FROM staging.stg_sm_spend
    GROUP BY rubro ORDER BY rubro
  verified: true
- id: DM-4
  title: ¿Cuántos churn observados vuelven a pagar?
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT COUNT(*) AS churn_events, SUM(CASE WHEN returned_next_month = 1 THEN 1 ELSE 0 END) AS returned_next_month,
    SUM(CASE WHEN months_to_return IS NOT NULL THEN 1 ELSE 0 END) AS returned_any_time_before_oct24 FROM mart.churn_events
  verified: true
- id: DM-5
  title: ¿Cuántas expansiones y contracciones se revierten al mes siguiente o tienen firma de pago de varios meses?
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT movement_type, COUNT(*) AS events, SUM(CASE WHEN reverts_next_month = 1 THEN 1 ELSE 0 END) AS reverts_next_month,
    SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS multi_month_signature FROM mart.customer_month
    WHERE movement_type IN ('expansion','contraction') GROUP BY movement_type
  verified: true
- id: DM-6
  title: Clientes por bandera de cohorte (base previa, arrastre, limpia)
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT cohort_flag, COUNT(DISTINCT customer_id) AS customers FROM mart.customer_month WHERE cohort_flag
    IS NOT NULL GROUP BY cohort_flag
  verified: true
- id: DM-7
  title: Mezcla anual del gasto S&M por grupo (Generación de Demanda, capacidad comercial, Habilitación)
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT SUBSTR(month,1,4) AS year, ROUND(SUM(demand_gen_spend)/SUM(total_sm_spend),3) AS demand_gen_share,
    ROUND(SUM(sales_capacity_spend)/SUM(total_sm_spend),3) AS sales_capacity_share, ROUND(SUM(enablement_spend)/SUM(total_sm_spend),3)
    AS enablement_share, COUNT(*) AS months FROM mart.sm_monthly GROUP BY SUBSTR(month,1,4) ORDER BY year
  verified: true
- id: DM-8
  title: Distribución por tramos del primer pago observado (M0) de las altas limpias
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT bucket, COUNT(*) AS altas FROM (SELECT CASE WHEN m0_cop < 50000 THEN 'a_<50k' WHEN m0_cop < 100000
    THEN 'b_50k-100k' WHEN m0_cop < 200000 THEN 'c_100k-200k' WHEN m0_cop < 500000 THEN 'd_200k-500k' ELSE 'e_>=500k'
    END AS bucket FROM mart.new_customers WHERE clean = 1) t GROUP BY bucket ORDER BY bucket
  verified: true
- id: DM-9
  title: Clientes con al menos un mes de firma de pago de varios meses
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
  note: SELECT COUNT(*) AS rows_with_signature, COUNT(DISTINCT customer_id) AS customers_with_signature, (SELECT
    COUNT(DISTINCT customer_id) FROM mart.customer_month WHERE active_customer = 1) AS customers_ever_active FROM
    mart.customer_month WHERE multi_month_payment_signature > 0
  verified: true
- id: DM-10
  title: ¿Cuadran los puentes de MRR pagado y de clientes?
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: 2026-09-29 (consulta)
  source_type: data_model
  quality: A
