- SELECT MIN(month) AS first_month, MAX(month) AS last_month, COUNT(*) AS months, SUM(new_customers) AS total_new,
  SUM(churned_customers) AS total_churn_events, SUM(reactivated_customers) AS total_reactivations FROM mart.monthly_metrics
- SELECT industry, COUNT(*) AS customers FROM staging.stg_customers GROUP BY industry ORDER BY customers DESC
- SELECT movement_type, COUNT(*) AS rows_n FROM mart.customer_month GROUP BY movement_type ORDER BY rows_n DESC
- SELECT rubro, COUNT(*) AS months, MIN(month) AS first_month, MAX(month) AS last_month FROM staging.stg_sm_spend
  GROUP BY rubro ORDER BY rubro
- SELECT COUNT(*) AS churn_events, SUM(CASE WHEN returned_next_month = 1 THEN 1 ELSE 0 END) AS returned_next_month,
  SUM(CASE WHEN months_to_return IS NOT NULL THEN 1 ELSE 0 END) AS returned_any_time_before_oct24 FROM mart.churn_events
- SELECT movement_type, COUNT(*) AS events, SUM(CASE WHEN reverts_next_month = 1 THEN 1 ELSE 0 END) AS reverts_next_month,
  SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS multi_month_signature FROM mart.customer_month
  WHERE movement_type IN ('expansion','contraction') GROUP BY movement_type
- SELECT cohort_flag, COUNT(DISTINCT customer_id) AS customers FROM mart.customer_month WHERE cohort_flag IS NOT
  NULL GROUP BY cohort_flag
- SELECT month, active_customers, new_customers, churned_customers, reactivated_customers, total_paid_mrr_cop, new_mrr_cop,
  expansion_mrr_cop, contraction_mrr_cop, churned_mrr_cop, reactivation_mrr_cop FROM mart.monthly_metrics WHERE
  month IN ('2022-01','2022-12','2023-06','2023-12','2024-06','2024-10') ORDER BY month
- SELECT SUBSTR(month,1,4) AS year, ROUND(SUM(demand_gen_spend)/SUM(total_sm_spend),3) AS demand_gen_share, ROUND(SUM(sales_capacity_spend)/SUM(total_sm_spend),3)
  AS sales_capacity_share, ROUND(SUM(enablement_spend)/SUM(total_sm_spend),3) AS enablement_share, COUNT(*) AS months
  FROM mart.sm_monthly GROUP BY SUBSTR(month,1,4) ORDER BY year
- SELECT COUNT(*) AS altas_clean, MIN(m0_cop) AS min_m0, MAX(m0_cop) AS max_m0, ROUND(AVG(m0_cop),0) AS avg_m0 FROM
  mart.new_customers WHERE clean = 1
- SELECT bucket, COUNT(*) AS altas FROM (SELECT CASE WHEN m0_cop < 50000 THEN 'a_<50k' WHEN m0_cop < 100000 THEN
  'b_50k-100k' WHEN m0_cop < 200000 THEN 'c_100k-200k' WHEN m0_cop < 500000 THEN 'd_200k-500k' ELSE 'e_>=500k' END
  AS bucket FROM mart.new_customers WHERE clean = 1) t GROUP BY bucket ORDER BY bucket
- SELECT COUNT(*) AS rows_with_signature, COUNT(DISTINCT customer_id) AS customers_with_signature, (SELECT COUNT(DISTINCT
  customer_id) FROM mart.customer_month WHERE active_customer = 1) AS customers_ever_active FROM mart.customer_month
  WHERE multi_month_payment_signature > 0
- SELECT COUNT(*) AS months_negative_bridge_check, SUM(CASE WHEN ABS(mrr_bridge_diff_cop) < 0.01 THEN 1 ELSE 0 END)
  AS months_bridge_ok, SUM(CASE WHEN customer_bridge_diff = 0 THEN 1 ELSE 0 END) AS months_customer_bridge_ok FROM
  mart.monthly_metrics_phase1 WHERE month > '2022-01'
- SELECT CASE WHEN n.m0_cop >= 200000 THEN 'm0_>=200k' ELSE 'm0_<200k' END AS tramo, COUNT(*) AS altas, SUM(CASE
  WHEN c.multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS m0_con_firma_multimes FROM mart.new_customers n
  JOIN mart.customer_month c ON c.customer_id = n.customer_id AND c.month = n.cohort_month WHERE n.clean = 1 GROUP
  BY 1 ORDER BY 1
