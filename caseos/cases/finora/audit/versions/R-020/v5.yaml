new_questions:
- ¿Qué parte de los primeros pagos grandes corresponde a clientes que luego se estabilizan en un nivel menor y qué
  parte a clientes que mantienen ese nivel?
- ¿La grilla de montos observada se puede reconstruir como escalones recurrentes por industria, y cuántos clientes
  se ubican en cada escalón?
- ¿Los meses-cliente por encima del monto usual se concentran en los mismos clientes a lo largo del tiempo o se
  reparten de forma difusa?
- ¿Puede el equipo entregar la definición operativa de amount (facturado, cobrado o contratado) y un catálogo de
  precios de lista que permita separar cobro de precio?
