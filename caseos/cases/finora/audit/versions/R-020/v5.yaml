task_why: Si el monto muestra patrones que parecen precio de entrada, se vuelven preguntas concretas para Finora;
  si no, la lámina muestra el límite del monto y pasa directo al mecanismo de S3.2.
task:
  work: datos
  draft_answer: 'Del pago sale la forma, no el precio. Se puede ver cuánto pagan en su primer pago observado (M0),
    si en los meses siguientes el monto sube, baja o se queda, si los montos se repiten en valores que parezcan
    una lista de precios y qué tan seguido un cambio se revierte al mes siguiente. Lo investigado ya dice que el
    primer pago mediano bajó (R-003) y que hay subidas del monto que coinciden con ajustes sincronizados con firma
    de cobro retroactivo (R-002). El límite: un primer pago más bajo puede ser prorrateo del primer mes, un plan
    más chico o un precio de entrada, y con el monto solo no se distingue. Por eso se muestra como patrón y como
    pregunta para Finora, nunca como descuento.'
  hugo_said:
  - text: Revisar Data observable de pricing y comportamiento actual, observaciones generales
    ref: N-028
  steps:
  - kind: data
    what: 'Trayectoria de entrada por cosecha: primer pago (M0) contra M1 y run-rate temprano. Qué parte de los
      pagadores nuevos sube, baja o se queda después de M0, y si eso cambió entre cosechas.'
    where:
    - mart.new_customers
  - kind: data
    what: 'Forma del monto: si los montos se repiten en valores fijos que parezcan una lista de precios, qué tan
      seguido cambia el monto y qué parte de los cambios se revierte al mes siguiente. Partir de R-002 sin repetirlo.'
    where:
    - mart.customer_month
    - staging.stg_customer_month
  - kind: proposal
    what: Lista de patrones observables, cada uno con sus lecturas posibles (prorrateo, plan, precio de entrada,
      descuento) y el campo que las separaría (RT-002), planteados como preguntas para Finora.
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: ''
short_answer: 'El ticket de entrada es medible; el descuento no es verificable aquí. El primer pago observado de
  las altas tiene mediana de COP 63,0 mil en 2022 y COP 42,0 mil en 2024, y en las cohortes de ventana limpia la
  mediana del segundo pago queda por debajo de la del primero. No es posible separar precio de lista, descuento
  introductorio, crédito ni pausa: el dato disponible es el monto observado por cliente y mes'
headline: El ticket de entrada es medible; el descuento no es verificable aquí
what_is_established:
- 'El primer pago observado de las altas es una magnitud con nivel, dispersión y cambio medibles: la mediana pasa
  de COP 63,0 mil en 2022 a COP 42,0 mil en 2024, con caída de −33%, y el promedio cae −60%.'
- Como señal direccional, la mediana del segundo pago queda por debajo de la del primero en las cohortes de ventana
  limpia, y la parte cuyo primer pago supera con holgura al segundo es 23,2% en 2022 frente a 11,6% en 2024. En
  sentido contrario, el segundo pago coincide exactamente con el primero en 90,3% de las altas de 2023.
- El efecto dentro de cada industria explica 97% del cambio del ticket de entrada entre 2022 y 2024, con intervalo
  bootstrap de 91–102%; el ticket de entrada bajó en 6 industrias por promedio y en 6 por mediana.
- 'Como señal, el monto por cliente convive con movimientos que se revierten y con rasgos de cobro: el movimiento
  bruto sin altas vuelve exacto al nivel previo al mes siguiente en 25,3% del total, el MRR de expansión se revierte
  al mes siguiente en 29% y se observan 260 eventos de ajuste con cobro retroactivo exacto. A la vez, los meses-cliente
  fuera de la grilla de montos pasan de 19% en 2022 S2 a 42% en 2024 S2, mientras el monto coincide con el monto
  usual del propio cliente en 78,8% de 2024.'
- Entre dic-22 y oct-24 el MRR por cliente activo pasa de COP 89,5 mil a COP 57,8 mil, y la composición de cosechas
  explica −COP 26,6 mil del cambio frente a −COP 5,2 mil del efecto dentro de las cosechas; el MRR por cliente de
  la base previa pasa de COP 97,0 mil a COP 97,4 mil.
- 'Esta pregunta queda como No evaluable: el dato disponible es el monto observado por cliente y mes, sin catálogo
  de precios ni definición documentada de lo que ese monto representa.'
what_is_contested: []
what_remains_unknown:
- 'No se puede concluir nada sobre precio introductorio, descuento o crédito: no hay catálogo de precios ni definición
  documentada del monto observado.'
- El monto por cliente no se puede leer como precio contractual mientras convivan reversiones al mes siguiente,
  liquidaciones de meses pendientes y 260 eventos de ajuste con cobro retroactivo exacto.
- 'La lectura de estabilidad depende del criterio usado: los meses-cliente fuera de la grilla de montos llegan a
  42% en 2024 S2, mientras el monto coincide con el monto usual del propio cliente en 78,8% de 2024; estas mediciones
  quedan como señal direccional.'
alternative_explanations: []
case_implication: Si se quiere reportar el ticket de entrada, convendría hacerlo por mediana y rango intercuartílico
  y abierto por industria, dado que el efecto dentro de cada industria explica 97% del cambio entre 2022 y 2024.
  Si se usa el monto como base de expansión y contracción, podría convenir descontar los movimientos que vuelven
  exacto al nivel previo al mes siguiente, que son 25,3% del movimiento bruto sin altas.
