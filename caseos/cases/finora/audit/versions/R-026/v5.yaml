task:
  work: datos
  draft_answer: 'De arranque: T-004 y T-018 miden la entrada con el primer pago, y F-139 y F-143 dicen que ese pago
    no sirve como valor de entrada (T-053 a T-055 muestran que en ventana limpia el segundo pago suele quedar por
    debajo del primero). Si la caída 2022→2023 se mantiene con el monto estabilizado, C-003 y el «menor ticket»
    de C-007 se sostienen; si se achica, la historia de la entrada es de primer cobro, no de valor.'
  hugo_said: []
  steps:
  - kind: data
    what: 'Por alta de ventana limpia: primer pago, segundo pago y monto usual (mediana de los primeros tres meses
      con pago). Mediana y promedio por año de alta y por industria, con cuántas altas no tienen segundo pago.'
    where:
    - mart.new_customers
    - mart.customer_month
    - raw.industry
  - kind: data
    what: 'Comparar contra T-018 y T-004: cuánto cambia la caída 2022→2023 y el rebote de 2024 con el monto estabilizado,
      y qué pasa en las cosechas de menor ticket de C-007.'
    where:
    - mart.vintage_month
    - mart.customer_month
  - kind: proposal
    what: 'Tabla lista para lámina: ticket de entrada estabilizado por año e industria, con la regla de estabilización
      escrita y sus límites.'
