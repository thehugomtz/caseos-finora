task:
  work: datos
  draft_answer: 'Con solo el monto, cada caso se ve igual que su lectura alternativa (R-011, C-016). Con tres capas:
    si paga 80 con la lista en 100, es un descuento nuevo, no contracción; si la lista sube a 130 con descuento
    de 30, hay expansión de lista y un descuento nuevo, con el neto sin cambio; cuando el descuento termina, la
    subida del neto va a «descuento terminado», no a expansión. El caso mixto se parte en dos líneas. Es una simulación
    marcada como tal: muestra qué se puede distinguir, no qué pasó en Finora.'
  hugo_said: []
  steps:
  - kind: data
    what: 'Construir la simulación con SQL (VALUES) en el motor del modelo, sin tocar los datos del caso: por caso
      y mes, lista, descuento, neto y la línea del puente en cada lectura (monto pagado frente a tres capas). El
      título dice «Simulación».'
    where: []
  - kind: data
    what: 'Incluir el caso mixto (lista y descuento cambian el mismo mes) y los tres grupos de D-002: descuento
      al entrar, descuento de quien sale (va dentro del churn) y descuento de clientes que continúan.'
    where: []
  - kind: proposal
    what: 'Reglas en orden para Q7: ¿cambió la lista? → expansión, contracción o cambio de tarifa; ¿cambió el descuento?
      → descuento nuevo o aumentado, reducido o terminado; ¿solo cambió el cobro? → momento de cobro. Para Q8: negocio
      subyacente = MRR de lista; revenue que se deja de capturar = capa de descuento (vigente y por vencer), sin
      llamarle pérdida mientras no haya grupo comparable (H-049).'
    where: []
