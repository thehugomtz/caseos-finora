workspace_run_started: INV-20260929-143800-3f07
why_it_matters: ''
short_answer: 'El puente por capas no es construible; el actual mezcla orígenes distintos. La simulación del enunciado
  no se puede reproducir con datos propios: falta precio de lista, plan, descuento y crédito. Lo que sí se midió
  es qué mezcla el puente de monto pagado vigente: subidas que vuelven exacto al nivel previo se registran como
  expansión, y 44% de los churns observados vuelve a pagar al mes siguiente'
headline: El puente por capas no es construible; el actual mezcla orígenes distintos
what_is_established:
- 'La simulación del enunciado no se puede reproducir con cifras propias: el panel cliente-mes guarda un solo monto,
  sin precio de lista, plan, descuento ni crédito, y sin definición documentada de qué representa ese monto.'
- 'El puente vigente mueve mucho más bruto que neto: COP 404 millones de movimientos brutos frente a COP 62 millones
  de cambio neto. Los casos del enunciado caen en las mismas líneas sin quedar distinguidos.'
- 'Como señal direccional: 29% del MRR de expansión se revierte al mes siguiente y 25,3% del movimiento bruto sin
  altas vuelve exacto al nivel previo. Las bajadas, en cambio, tienden a sostenerse: COP 55,9 millones en 848 eventos
  se mantienen en el nivel nuevo.'
- 44% de los churns observados vuelve a pagar al mes siguiente y 32% de los retornos liquida exactamente los meses
  pendientes. En oct-24 la reactivación fue la mayor entrada del puente con COP 4,5 millones, por encima del MRR
  nuevo con COP 2,2 millones.
- 'La hipótesis no queda soportada: sin precios ni descuentos registrados, el caso de lista mayor con descuento
  vigente y el de precio neto menor coinciden en el mismo monto observado. Lo que sí se observa es composición:
  el MRR por cliente activo pasó de COP 92,8 mil a COP 57,8 mil, mientras la base previa cambió +5% y las cosechas
  2023–24 concentran 65% de los clientes activos en oct-24.'
what_is_contested: []
what_remains_unknown:
- 'No se puede construir el puente por capas ni reproducir la simulación del enunciado con cifras propias: faltan
  precio de lista, plan, descuento y crédito, y falta la definición documentada del monto registrado.'
- No se puede asignar la caída del MRR por cliente activo entre un precio de lista distinto y un descuento aplicado,
  porque ambos casos coinciden en el mismo monto observado.
- El puente vigente mezcla cambios sostenidos de nivel con movimientos que vuelven exacto al nivel previo, de modo
  que sus líneas no se leen como decisiones comerciales limpias.
alternative_explanations: []
case_implication: Si se decide avanzar hacia el puente por capas, el paso previo sería capturar precio de lista,
  descuento y crédito por cliente y mes, hoy ausentes del panel. Si se reclasificaran como ajuste de cobro las subidas
  que vuelven exacto al nivel previo, la línea de expansión podría reflejar mejor el cambio sostenido de nivel.
