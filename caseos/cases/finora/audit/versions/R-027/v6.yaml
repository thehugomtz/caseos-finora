new_questions:
- ¿Qué campos mínimos de precio de lista y de descuento por cliente y mes habría que capturar para reconciliar el
  monto cobrado con un MRR neto y hacer construible el puente por capas?
- ¿Cómo cambiaría el puente actual si las subidas de monto que vuelven exacto al nivel previo al mes siguiente se
  reclasificaran como ajuste de cobro en lugar de expansión?
- ¿Qué parte del churn y de la reactivación del puente actual quedaría fuera de las líneas de bajas y entradas si
  existiera el estado de la suscripción (activa, pausada, cancelada)?
- ¿Las bajadas de monto que se sostienen se concentran en cosechas, industrias o antigüedades concretas, o se reparten
  de forma parecida en toda la base?
