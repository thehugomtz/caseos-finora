alternative_explanations:
- 'Parte de lo que parecen recorridos distintos puede ser cómo se registra en el CRM (H-051): SQL directos sin origen,
  estancados que nadie cerró y clientes Self Service que solo aparecen cuando pagan.'
- 'Hybrid B puede inflarse con secuencias automáticas o intentos sin respuesta sobre leads que habrían comprado
  solos: touch no es influencia.'
- Las diferencias de conversión entre Self Service y Hybrid A pueden reflejar a quién eligen tocar los SDR/AE y
  no lo que aporta la persona (H-050).
- Parte de la vuelta de pagadores puede ser atraso o agrupación de cobros (pagar los meses saltados) y no churn
  seguido de recompra.
- Un lead que se ve estancado puede estar activo con trabajo que no se registra en el CRM.
what_is_established:
- 'Definiciones de Hugo: Executive = New → Working SDR → Engaged SDR → SQL SDR → Demo AE → Proposal AE → Won (N-033,
  N-034); Hybrid A/B (N-037); Reactivate = estancados que se reactivan y se asignan (N-038).'
- 'El modelo no tiene leads, etapas ni dueños, y los 1.961 clientes tienen al menos un pago: hoy no hay conversión
  de funnel medible.'
- 'Nudo medible: 1.476 primeros pagos observados limpios entre mar-22 y oct-24; 377 clientes ya pagaban en ene-22
  y 108 están marcados en feb-22.'
- 'Loop de Revenue medible: 751 churn observados (549 clientes), 468 vueltas (340 clientes), 330 de ellas en t+1
  y 126 pagando los meses saltados más el actual.'
- 'Referentes externos: cada tipo de oportunidad convierte y tarda distinto; los desvíos se reasignan por motivo;
  touch no es influencia; un holdout por cuenta mide incrementalidad.'
what_is_contested:
- 'Qué cuenta como intervención (Q-063): cualquier actividad registrada o solo la interacción de ida y vuelta.'
- Si un tramo self dentro de un proceso con AE (usar una prueba) vuelve Hybrid a un Executive. La propuesta dice
  que no, salvo que el cliente cierre solo.
- Reactivate como bandera transversal o como línea propia del mix.
- Si la puerta fija al entrar (R-023) debe definir la ruta. Esta investigación propone separarlas.
- 'Cómo leer la vuelta de pagadores: churn seguido de recompra, o atraso de cobro.'
what_remains_unknown:
- 'Qué registra el CRM de Finora: resultado de las actividades, quién movió cada etapa, origen de los SQL directos
  y motivos de cierre.'
- Qué hitos y canales tiene el Self Service de Finora.
- Si existe una llave entre la cuenta de CRM o producto y el customer_id de pagos.
- El umbral de estancamiento por etapa y la caducidad del episodio (Q-064).
- El mix real de rutas, las tasas por puerta y el tamaño del pool de estancados.
- Cuánto tiempo pasa entre el Won en CRM y el primer pago.
case_implication: 'Para Finora esto cambia la forma de las láminas S2.3 y S2.5 más que sus números. El bowtie por
  puertas con Assisted de C-005, y el Executive = KAM de R-023, se reemplazan por una matriz puerta × ruta. La puerta
  se fija al entrar (producto o CRM/ventas, con etapa de entrada y canal) y la ruta sale de quién movió cada tramo
  (Executive, Self Service, Hybrid A, Hybrid B). Todas convergen en el mismo nudo, el primer pago observado. Reactivate
  queda como loop transversal que no suma entradas ni primeros pagos. La hipótesis de arranque se valida con tres
  ajustes: puerta y ruta son campos distintos; A/B se decide por el primer tramo movido; y Reactivate necesita una
  regla de caducidad y recalcular la ruta después de reactivar. Con los datos de hoy no se puede poblar ninguna
  ruta ni tasa: solo el total del nudo y la vuelta de pagadores. Esa vuelta debe presentarse como loop de Revenue
  y con otro nombre, porque su tamaño (el monto del mes de vuelta es del mismo orden que el del primer mes de los
  clientes nuevos) y su naturaleza (27% de las vueltas paga los meses saltados) ensuciarían la lectura de Reactivate.
  Ante el CRO se puede defender el diseño y los huecos del WoW (qué debe registrar el CRM), no una conversión. Las
  métricas de R-022 hay que revisarlas contra esta lista: no tuve su detalle en el estado.'
changes_current_story:
  value: 'yes'
  why: Reemplaza el bowtie por puertas con Assisted (C-005) y las lecturas de R-023 (Executive = KAM; Reactivate
    = clientes que ya pagaron) por las definiciones de Hugo. Saca la vuelta de pagadores de Reactivate y lleva la
    comparación de tasas de las rutas a las puertas. El cambio de storyline lo aprueba Hugo.
affected_hypotheses:
- id: H-050
  effect: changes_framing
  why: 'La ruta Hybrid se define después, por la intervención, así que su tasa mezcla selección con efecto por construcción.
    H-050 deja de ser algo que se prueba con la tasa de Hybrid y pasa a ser una regla de lectura: no se comparan
    tasas por ruta. El efecto de la persona se mide registrando qué disparó la intervención (regla fija o criterio)
    o con un holdout por cuenta (SRC-09), que es justo lo que la propia H-050 pide para debilitarse.'
- id: H-051
  effect: requires_research
  why: 'El diseño agrega los campos que la separarían: origen de la entrada directa a SQL, motivo de cierre, actividad
    calificada para marcar estancado y evento de registro antes del pago. En pagos, todos los clientes aparecen
    solo cuando pagan (DM-04), pero eso es propio del archivo y no discrimina nada. Hace falta un extracto de CRM.'
affected_claims:
- id: C-005
  effect: changes_story
  why: 'Las puertas Self Service, Assisted y Executive pasan a ser dos campos: puerta ex ante (producto o CRM/ventas)
    y ruta por tramos (Executive, Self Service, Hybrid A, Hybrid B). Assisted queda absorbido en Hybrid. Se suma
    Reactivate como loop con bandera y se mantiene el nudo común (primer pago). Conviene reformular el claim antes
    de S2.3 y S2.5.'
suggested_action: 'Llevar a Hugo para aprobar o ajustar: (1) la regla de ruta por tramos, con la puerta aparte;
  (2) la tabla de bordes; (3) la opción para Q-063 (propuesta: interacción de ida y vuelta); (4) Reactivate como
  bandera; y (5) renombrar la «reactivación» del puente de MRR a «vuelta de pagadores». En paralelo, pedir a Finora
  un extracto de CRM a nivel lead/cuenta (etapa y fecha de cada cambio, dueño, actividades con su resultado y marca
  de automatizada, origen, motivo de cierre), el mapa de eventos del Self Service y la llave entre CRM y pagos.'
new_questions:
- ¿El CRM de Finora guarda el resultado de cada actividad de SDR/AE (intento, conectada, respondida), marca las
  automatizadas y registra quién movió cada cambio de etapa?
- ¿Qué hitos tiene hoy el Self Service de Finora (registro, prueba, checkout), qué canales usa y hay una llave que
  una la cuenta de producto/CRM con el ID de pagos?
- ¿Hugo quiere Reactivate como bandera transversal (el primer pago cuenta en su ruta) o como línea propia del mix
  que saca a los reactivados de las demás rutas?
handoff_to_cos:
  summary: 'R-029 propone el mix MECE: la ruta sale de quién movió cada tramo (Executive, Self Service, Hybrid A,
    Hybrid B), la puerta se fija al entrar para comparar tasas, Reactivate es un loop con bandera y el primer pago
    es el nudo común. Con los datos de hoy solo se mide el nudo (1.476 primeros pagos limpios) y la vuelta de pagadores
    (468 vueltas, 126 de ellas pagando meses saltados), que es un loop de Revenue y no Reactivate. C-005 y las láminas
    S2.3/S2.5 cambian; Q-063 y Q-064 quedan para decisión de Hugo, con propuesta.'
  recommended_next: Pasar a Hugo las decisiones de Q-063, el formato de Reactivate (bandera o línea) y el renombre
    de la «reactivación» del puente de MRR. Después, pedir a Finora el extracto de CRM, los eventos del Self Service
    y la llave de pagos, para que Analytics arme la matriz puerta × ruta y el pool de estancados.
