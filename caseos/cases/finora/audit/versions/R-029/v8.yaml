id: R-029
type: research
research_question: Con las definiciones textuales de Hugo, ¿cuál es el mix MECE de funnels —Executive (el funnel
  actual SDR→AE), Self Service con sus canales, Hybrid (casos A y B) y Reactivate (leads estancados que se reactivan
  y se asignan a un funnel)—, las etapas de cada uno, la regla que pone a cada lead en uno solo y las métricas de
  cada casuística?
case_question: 'Bloque Growth/CRO: ¿cómo definir y medir el funnel si no todos los clientes lo recorren igual? Sirve
  a Q-063, Q-064, C-005, H-050 y H-051, y a las láminas S2.3 y S2.5.'
