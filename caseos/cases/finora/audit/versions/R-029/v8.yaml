    - mart.new_customers
    - mart.customer_month
requested_via: vía Claude (delegado por Hugo en el chat, 29-sep 14:05, D-017)
failed_at: '2026-09-29T14:58:17-06:00'
why_it_matters: 'Define qué se puede comparar entre recorridos en S2.3 y S2.5. También evita dos errores que cambiarían
  lo que se le dice al CRO: leer la conversión de Hybrid como efecto de la persona y confundir Reactivate (leads
  estancados) con la vuelta de clientes que dejaron de pagar.'
short_answer: 'Es una propuesta con confianza media, porque no hay CRM para probarla. La ruta sale de quién movió
  cada tramo: Executive, todo con SDR/AE (incluida la entrada directa a SQL); Self Service, nada con persona; Hybrid
  A, empezó solo y luego intervino una persona; Hybrid B, empezó con persona y terminó solo. La puerta de entrada
  queda aparte, fija al entrar, para comparar tasas sin el sesgo de H-050. Reactivate no es una cuarta ruta: es
  un loop sobre episodios estancados (umbral por etapa, Q-064) que conserva fecha y puerta, recalcula la ruta según
  quién mueve después y cuenta el primer pago una sola vez, con bandera. Hoy solo se puede medir el nudo (1.476
  primeros pagos observados limpios, mar-22–oct-24) y la vuelta de pagadores (468 vueltas en 340 clientes; el 27%
  paga los meses saltados). Esa vuelta es un loop de Revenue, no Reactivate.'
