specialist:
  measurement:
    problem_interpretation: 'Hugo quiere pasar del funnel lineal SDR→AE a un mix MECE de recorridos sin forzar linealidad.
      Hay dos trampas. Hybrid se define por lo que pasó (quién movió cada tramo), no por dónde entró, así que no
      se conoce hasta que el lead avanza. Y Reactivate es un estado que le puede pasar a cualquier ruta, no un recorrido
      paralelo. Si se tratan como cuatro funnels independientes, los reactivados se cuentan dos veces y las tasas
      entre rutas comparan grupos armados por su propio resultado. Además, hoy el modelo solo tiene pagos: nada
      de leads.'
    measurement_objective: Que cada episodio (una cuenta, desde que entra al funnel hasta su primer pago o su cierre)
      caiga en una sola ruta y tenga una puerta fija. Que todas las rutas converjan en el mismo nudo (primer pago
      observado) para comparar resultados económicos. Que Reactivate se mida como loop sin doble conteo, y que la
      vuelta de pagadores quede del lado de Revenue.
    recommended_framework:
      name: Rutas por tramos con puerta fija, nudo común y loop de Reactivate (bowtie por rutas)
      structure: '(1) Unidad: episodio = una cuenta desde que entra al funnel hasta su primer pago o su cierre;
        varias personas de la misma empresa cuentan como un episodio. Grano de evento, con reporte mensual por cohorte
        de entrada. Nudo común: primer pago observado. (2) Puerta, fija al entrar: Producto (la cuenta se crea sola
        por registro o checkout) o CRM/Ventas (lead creado para SDR/AE: formulario, outbound, campaña, evento, partner
        o referido). Lleva etapa de entrada (New o SQL) y canal. (3) Tramo = paso a la siguiente etapa del recorrido.
        Es P si lo movió un SDR/AE con interacción de ida y vuelta (propuesta para Q-063). Es C si lo movió el cliente
        sin persona (registro, activación, checkout/pago). No mueven tramo: crear o asignar el lead, intentos sin
        respuesta, correos automáticos ni lo que pasa dentro de una etapa (por ejemplo, usar una prueba). (4) Ruta
        por tramos, MECE: Executive = todos los tramos P; Self Service = todos C; Hybrid A = primer tramo C y después
        al menos un P; Hybrid B = primer tramo P y después al menos un C (lo típico: cierra por checkout); Sin ruta
        aún = ningún tramo movido. Para lo abierto se usa la ruta a la fecha; al cierre (Won o Lost), la ruta final.
        (5) Tabla de bordes: entrada directa a SQL → Executive con etapa de entrada SQL, y New/Working/Engaged como
        «no aplica». Formulario de «hablar con ventas» → evento de entrada por la puerta CRM, no tramo C. Lead de
        campaña que nadie contactó (o solo con intentos) y compró solo → Self Service con bandera «asignado sin
        interacción», no Hybrid B. Prueba montada por un AE → tramo P: si cierra con propuesta es Executive, si
        cierra con checkout es Hybrid B y si antes se registró solo es Hybrid A. Secuencias automáticas → no cuentan
        como persona. Soporte u onboarding → bandera que no cambia la ruta (a decidir). Cliente que dejó de pagar
        y vuelve → loop de Revenue, ni Reactivate ni episodio nuevo. (6) Etapas y dueños. Executive tal cual N-033:
        New (lead asignado; dueño SDR) → Working SDR (primer intento registrado) → Engaged SDR (primera interacción
        de ida y vuelta) → SQL SDR (criterio de calificación de Finora y entrega al AE, o entrada directa con origen)
        → Demo AE (demo realizada, no solo agendada) → Proposal AE (propuesta enviada) → Won (firmado; su salida
        es el primer pago, con dueño Finanzas). Self Service, por confirmar con Finora: Registro (por canal; dueño
        Growth/Marketing) → Activación (hito de valor que defina producto) → Checkout → primer pago. Hybrid A: etapas
        de Self Service hasta la intervención → etapa de Executive donde entra la persona (registrar cuál y qué
        la disparó) → cierre por checkout o por propuesta. Hybrid B: etapas de Executive hasta el último tramo con
        persona → salida a self → checkout y primer pago. (7) Reactivate es un loop, no una ruta: Estancado (sin
        actividad calificada más allá del umbral de su etapa, Q-064) → Reactivado (respuesta, acción en producto
        o contacto conectado, con su método) → Reasignado (dueño y etapa de reingreso según el caso) → sigue su
        episodio, y la ruta se recalcula según quién mueve los tramos siguientes. Salidas posibles: avanza, primer
        pago, se vuelve a estancar, se cierra con motivo (reciclable o no) o caduca; pasado el máximo de inactividad,
        volver abre un episodio nuevo enlazado. No es entrada nueva, conserva fecha y puerta, y el primer pago cuenta
        una vez en su ruta con bandera «reactivado». (8) Loop de Revenue aparte: churn observado → vuelta de pagadores;
        hoy se mide con los pagos. (9) Qué se compara: tasas solo entre puertas y dentro de cada ruta; entre rutas,
        solo los resultados de quienes llegan al nudo (volumen, tiempo, valor, permanencia) y el costo cuando haya
        asignación.'
      why: 'Respeta las definiciones de Hugo: la ruta sale de quién movió cada tramo. Es MECE por construcción:
        A/B se decide por el primer tramo movido y lo que no tiene tramos queda como «sin ruta aún». Evita la tasa
        mezclada, porque cada tipo de oportunidad convierte y tarda distinto (SRC-01). Evita comparar rutas armadas
        por su propio resultado (H-050), porque deja las tasas en la puerta. Y trata Reactivate como el desvío con
        reasignación de Forrester (SRC-02) para no contar doble.'
    alternative_frameworks:
    - name: Puerta = ruta (versión R-023)
      when_better: 'Si el CRM de Finora no registra el resultado de las actividades ni quién movió cada etapa: se
        puede implementar ya con el origen del lead.'
      tradeoff: No ve Hybrid A/B (contradice N-037), y la tasa por puerta mezcla esfuerzo humano y autoservicio
        sin poder separarlos.
    - name: Waterfall único con tipos y desvíos (estilo Forrester)
      when_better: Si Finora quiere un solo pipeline para forecast y casi todas las rutas comparten las etapas del
        CRM.
      tradeoff: Fuerza linealidad sobre Self Service (sus hitos no son etapas de SDR) y empuja a una tasa mezclada;
        Hybrid queda solo como etiqueta.
    metric_definitions:
    - metric: Entradas por puerta y canal
      definition: Episodios que se abren en el mes (volumen).
      formula: COUNT(episodio_id) con fecha_entrada en el mes, por puerta, etapa_de_entrada y canal
      grain: episodio (cuenta) · reporte mensual por cohorte de entrada
      milestone: fecha de entrada del episodio
      notes: 'Una reactivación no es entrada; varias personas de la misma empresa son un solo episodio. Hoy no se
        puede medir: no hay leads en el modelo.'
    - metric: Primeros pagos (nudo) por ruta
      definition: Episodios que llegan al primer pago observado en el mes, según su ruta final (volumen).
      formula: 'COUNT(episodio_id) con mes(primer_pago) = m, por ruta final. Control: Σ rutas + «sin match CRM»
        = primeros pagos limpios de mart.new_customers del mes'
      grain: episodio · mensual por mes de primer pago
      milestone: primer pago observado
      notes: Hoy solo existe el total (1.476 limpios, mar-22–oct-24), no la ruta. Primer pago observado ≠ adquisición.
    - metric: Tasa entrada → primer pago a N días, por puerta
      definition: De los episodios que entran por una puerta en una cohorte, cuántos llegan al primer pago en N
        días (tasa ex ante).
      formula: episodios de la cohorte c y puerta d con primer_pago ≤ fecha_entrada + N / episodios de la cohorte
        c y puerta d
      grain: cohorte de entrada × puerta (× canal)
      milestone: fecha de entrada
      notes: Es la única tasa que se compara entre motions. N lo acuerda Hugo con Finora; las cohortes que aún no
        cumplen N días no se comparan.
    - metric: Mix de ruta dentro de cada puerta
      definition: 'Cómo terminan los primeros pagos de cada puerta: Self Service o Hybrid A en la puerta producto;
        Executive, Hybrid B o Self Service sin contacto en la puerta CRM.'
      formula: primeros pagos de la puerta d con ruta r / primeros pagos de la puerta d, por cohorte
      grain: cohorte × puerta × ruta
      milestone: primer pago observado
      notes: Muestra dónde entra la persona sin comparar tasas por ruta (H-050).
    - metric: Tiempo a primer pago
      definition: Días entre la entrada y el primer pago (velocidad).
      formula: mediana y P80 de (fecha_primer_pago − fecha_entrada), por ruta y por puerta
      grain: episodio con primer pago
      milestone: fecha de entrada → primer pago
      notes: 'Solo incluye a quienes llegaron: siempre va junto a la tasa entrada → primer pago. En los reactivados,
        reportar con y sin el tiempo estancado.'
    - metric: Valor del primer pago
      definition: Monto pagado observado en el arranque (valor), por ruta.
      formula: mediana del monto usual del cliente y de early_run_rate_cop, por ruta; el M0 bruto solo como referencia
      grain: episodio con primer pago
      milestone: primer pago (M0)
      notes: Es monto pagado observado, no MRR contratado. 117 de los 1.584 primeros pagos traen firma multi-mes,
        así que el M0 bruto no sirve solo.
    - metric: Permanencia temprana
      definition: Qué parte de cada cohorte de primer pago sigue pagando en M3 y en M6, por ruta.
      formula: clientes de la cohorte activos en tenure_month 3 (o 6) / clientes de la cohorte
      grain: cohorte de primer pago × ruta
      milestone: primer pago (M0)
      notes: Necesita una regla para meses saltados y pagos multi-mes; solo aplica a cohortes con M3 o M6 observable.
    - metric: Paso por etapa (dentro de cada ruta)
      definition: De quienes alcanzaron una etapa (entraran ahí o vinieran de antes), cuántos alcanzan la siguiente
        en N días.
      formula: episodios que alcanzan s+1 en ≤ N días / episodios que alcanzaron s, por ruta final
      grain: cohorte de entrada × ruta × etapa
      milestone: fecha de entrada a la etapa s
      notes: Executive con las etapas de N-033; Self Service por canal. Las entradas directas a SQL cuentan desde
        SQL, con «no aplica» antes. No se promedia entre rutas; en cohortes abiertas se usa la ruta a la fecha,
        marcada como provisional.
    - metric: Tiempo en etapa y tasa de estancamiento
      definition: Cuánto dura cada etapa y qué parte de los episodios pasa el umbral sin actividad calificada.
      formula: mediana y P80 de días en la etapa; estancados en s / episodios que alcanzaron s
      grain: episodio × etapa · por ruta a la fecha
      milestone: entrada a la etapa / última actividad calificada
      notes: 'El umbral por etapa es el parámetro de Q-064. Propuesta: calibrarlo con el tiempo en etapa de quienes
        sí avanzaron; decide Finora.'
    - metric: Tasa de reactivación (Reactivate)
      definition: De los episodios que se estancaron en un mes, cuántos se reactivan en N días.
      formula: reactivados en ≤ N días / estancados de la cohorte de estancamiento m, por etapa y método
      grain: cohorte de estancamiento × etapa × método de reactivación
      milestone: fecha de estancamiento
      notes: 'No hay entrada nueva: el episodio conserva fecha y puerta. Va acompañada del pool de estancados (stock
        a fin de mes) y de la tasa de re-estancamiento.'
    - metric: Primeros pagos con bandera de reactivado
      definition: Qué parte de los primeros pagos de cada ruta pasó por Reactivate, y cuánto tardó desde la reactivación.
      formula: primeros pagos con reactivado = 1 / primeros pagos, por ruta; mediana de días entre reactivación
        y primer pago
      grain: episodio con primer pago
      milestone: fecha de reactivación
      notes: Cada primer pago cuenta una sola vez, en su ruta. Reactivate es un corte, no suma al total.
    - metric: Etapa y disparador de la intervención (Hybrid)
      definition: En qué etapa entra la persona en Hybrid A, en cuál sale en Hybrid B, y si la intervención la disparó
        una regla fija o el criterio del SDR/AE.
      formula: distribución de episodios Hybrid por etapa del primer tramo P (A) o del último tramo P (B); % con
        disparador = regla
      grain: episodio Hybrid
      milestone: primer tramo con persona (A) / último tramo con persona (B)
      notes: 'Sin el disparador, la conversión de Hybrid no se puede leer como efecto (H-050). Para medir efecto:
        holdout por cuenta.'
    - metric: Vuelta de pagadores (loop de Revenue, no Reactivate)
      definition: 'Qué pasa después de un churn observado: vuelve en t+1, vuelve en 2 o más meses o no vuelve; y
        cuántas vueltas pagan los meses saltados.'
      formula: eventos de churn por tramo de months_to_return / eventos de churn; vueltas con multi_month_payment_signature
        = meses saltados + 1 / vueltas
      grain: evento de churn observado (cliente × mes)
      milestone: mes del churn observado
      notes: 'Se mide hoy en mart.customer_month: 751 churn, 468 vueltas, 330 en t+1 y 126 con pago de meses saltados.
        Hay que separar atraso de cobro de vuelta real.'
    required_events:
    - event: episodio_abierto
      trigger: Primer registro de la cuenta en CRM o en producto
      properties:
      - account_id
      - episodio_id
      - fecha
      - puerta (producto / CRM)
      - etapa_de_entrada
      - canal / origen
      - campaña
      - owner inicial
    - event: cambio_de_etapa
      trigger: Cualquier paso de etapa en CRM o hito de producto
      properties:
      - episodio_id
      - etapa_desde
      - etapa_hacia
      - fecha
      - movido_por (persona / cliente / sistema)
      - rol (SDR / AE)
      - actividad_id que lo respalda
    - event: actividad_comercial
      trigger: Un SDR o AE registra una actividad
      properties:
      - tipo (llamada, correo, reunión, demo, propuesta, prueba configurada)
      - resultado (intento sin respuesta, conectada, respondida, realizada)
      - automatizada (sí/no)
      - rol
      - fecha
    - event: registro_self
      trigger: El cliente crea su cuenta en producto o en checkout sin persona
      properties:
      - account_id
      - canal / UTM
      - plan
      - fecha
    - event: activacion
      trigger: El cliente alcanza el hito de valor que defina el producto de Finora
      properties:
      - hito
      - fecha
      - días desde el registro
    - event: checkout_completado
      trigger: Compra self-serve sin propuesta de un AE
      properties:
      - plan
      - monto
      - fecha
      - método de pago
    - event: propuesta_enviada / cierre_ganado
      trigger: El AE envía la propuesta o marca el Won en CRM
      properties:
      - monto propuesto o contratado
      - plan
      - fecha
      - AE
    - event: primer_pago (nudo)
      trigger: Primer pago > 0 de la cuenta en facturación
      properties:
      - customer_id de pagos
      - account_id de CRM
      - monto
      - mes
      - firma multi-mes
    - event: estancado (derivado)
      trigger: Días sin actividad calificada ≥ umbral de la etapa (tabla de parámetros de Q-064)
      properties:
      - etapa
      - días
      - ruta a la fecha
      - owner
    - event: reactivado
      trigger: Actividad calificada después de «estancado»
      properties:
      - método (SDR, nurture, producto, evento)
      - etapa de reingreso
      - owner asignado
      - días estancado
      - número de reactivación
    - event: cierre_perdido / descalificado / caducado
      trigger: Cierre sin primer pago, o caducidad por inactividad
      properties:
      - motivo (reciclable / no reciclable)
      - etapa
      - fecha
    - event: churn_observado / vuelta_a_pagar (Revenue)
      trigger: Pago en 0 después de un pago > 0 / pago > 0 después de al menos un mes en 0
      properties:
      - customer_id
      - meses en cero
      - monto de vuelta contra monto usual
      - firma multi-mes
    required_dimensions:
    - dimension: Ruta (Executive, Self Service, Hybrid A, Hybrid B, sin ruta aún; a la fecha y final)
      why: Es el mix MECE que pide Hugo; separa lo provisional de lo definitivo.
    - dimension: Puerta (producto / CRM-ventas) y etapa de entrada (New, SQL, otra)
      why: Es la base ex ante para comparar tasas sin el sesgo de H-050 y para tratar la entrada directa a SQL.
    - dimension: Canal de entrada
      why: Hugo pide Self Service con sus canales. Los valores se acuerdan con Finora; para costo, hoy solo existen
        los rubros PaidMedia y PublicidadNoWeb, en unidad no documentada (DM-01).
    - dimension: Cohorte de entrada y cohorte de primer pago (mes)
      why: Las tasas y la permanencia dependen de la edad del episodio; sin cohortes se comparan grupos incompletos.
    - dimension: Reactivado (bandera, número de reactivaciones, etapa donde se estancó, método)
      why: Permite reportar Reactivate como corte sin contar doble.
    - dimension: Modo de cierre (checkout / propuesta de AE)
      why: Separa Hybrid B del Executive y une el Won de CRM con el nudo.
    - dimension: Disparador y etapa de la intervención
      why: Sin esto, la conversión de Hybrid no se puede interpretar (H-050).
    - dimension: Rol y owner (SDR, AE)
      why: Sirve para capacidad y para ver si la selección depende de la persona.
    - dimension: Industria
      why: Ya existe en el modelo; permite ver si el mix de rutas cambia por segmento.
    decision_enabled: Dónde agrega valor la persona (en qué puerta y en qué etapa), para asignar capacidad de SDR/AE.
      Cuánto invertir por canal de Self Service. Si conviene montar un programa de Reactivate y con qué umbral.
      Y qué mix de primeros pagos por ruta mostrar al CRO y al CFO, sin leer la tasa de Hybrid como efecto ni confundir
      Reactivate con clientes que vuelven a pagar.
    limitations:
    - 'No hay leads ni CRM en el modelo: hoy no se puede medir ninguna conversión, ruta ni estancamiento.'
    - La ruta se define después de los hechos, así que sus tasas están sesgadas; solo las puertas admiten comparación
      de tasas.
    - Q-063 y Q-064 son parámetros, y los resultados son sensibles a cómo se fijen.
    - No se sabe si existe llave entre CRM o producto y el customer_id de pagos; sin ella, el nudo no se puede unir
      a la ruta.
    - 'Primer pago observado ≠ adquisición: hay censura a la izquierda (377 clientes) y arrastre en feb-22 (108).'
    - Monto pagado observado ≠ MRR contratado; hay firmas multi-mes en 117 primeros pagos y en 145 vueltas.
    - 'La atribución no prueba causa: para medir el efecto de la persona hace falta una regla fija o un holdout.'
    - Las etapas y los canales de Self Service no están confirmados con Finora.
    - 'El gasto S&M está en una unidad no documentada: el costo por ruta requiere un modelo de asignación.'
    implementation_implications:
    - 'CRM: agregar puerta, etapa de entrada y origen; resultado de cada actividad y marca de automatizada; quién
      movió cada cambio de etapa; motivo de cierre (reciclable o no); eventos de estancado y reactivado; y un id
      de episodio a nivel cuenta.'
    - 'Producto y checkout: eventos de registro, activación y checkout con un account_id que cruce con el CRM.'
    - 'Facturación: llave entre customer_id y account_id; sin ella no hay forma de unir el nudo con la ruta.'
    - 'Data Engineering: tabla de episodios (cuenta × episodio) con ruta a la fecha y ruta final derivadas por regla,
      y una tabla de parámetros versionada (umbral por etapa, caducidad, N días, definición de intervención).'
    - 'Chequeo de reconciliación: Σ primeros pagos por ruta + «sin match» = primeros pagos limpios de mart.new_customers
      del mes.'
    - 'Nombres: «Reactivate» solo para leads; la línea «reactivación» del puente de MRR pasa a llamarse «vuelta
      de pagadores» (lo decide Hugo).'
    - 'Láminas S2.3 y S2.5: matriz puerta × ruta con nudo común, Reactivate como loop con bandera y el loop de Revenue
      por separado.'
sql_runs:
- catalogo_modelo()
- SELECT vintage, clean, COUNT(*) AS altas, MIN(cohort_month) AS primer_mes, MAX(cohort_month) AS ultimo_mes FROM
  mart.new_customers GROUP BY vintage, clean ORDER BY primer_mes
- SELECT cohort_flag, COUNT(DISTINCT customer_id) AS clientes FROM mart.customer_month GROUP BY cohort_flag ORDER
  BY cohort_flag
- SELECT movement_type, COUNT(*) AS filas, COUNT(DISTINCT customer_id) AS clientes FROM mart.customer_month GROUP
  BY movement_type ORDER BY filas DESC
- SELECT CASE WHEN months_to_return IS NULL THEN 'no vuelve antes de oct-24' WHEN months_to_return = 1 THEN '1 mes'
  WHEN months_to_return BETWEEN 2 AND 3 THEN '2-3 meses' WHEN months_to_return BETWEEN 4 AND 6 THEN '4-6 meses'
  ELSE '7+ meses' END AS tramo, COUNT(*) AS eventos_churn, SUM(returned_next_month) AS vuelven_t1_mismo_monto FROM
  mart.churn_events GROUP BY 1 ORDER BY 1
- SELECT COUNT(DISTINCT customer_id) AS clientes_total, COUNT(DISTINCT CASE WHEN first_positive_month IS NULL THEN
  customer_id END) AS clientes_sin_ningun_pago, COUNT(DISTINCT CASE WHEN active_customer = 1 THEN customer_id END)
  AS clientes_con_algun_pago FROM mart.customer_month
- SELECT COUNT(*) AS reactivaciones, SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS con_firma_multimes,
  SUM(CASE WHEN amount_vs_usual_ratio = 1 THEN 1 ELSE 0 END) AS vuelve_con_monto_usual, SUM(CASE WHEN month < '2022-03'
  THEN 1 ELSE 0 END) AS antes_de_mar22 FROM mart.customer_month WHERE movement_type = 'reactivation'
- SELECT COUNT(*) AS churn_eventos, SUM(returned_next_month) AS vuelven_t1, SUM(returned_same_amount_next_month)
  AS vuelven_t1_mismo_monto FROM mart.customer_month WHERE movement_type = 'churn'
- SELECT n_reactivaciones, COUNT(*) AS clientes FROM (SELECT customer_id, SUM(CASE WHEN movement_type = 'reactivation'
  THEN 1 ELSE 0 END) AS n_reactivaciones FROM mart.customer_month GROUP BY customer_id) t WHERE n_reactivaciones
  > 0 GROUP BY n_reactivaciones ORDER BY n_reactivaciones
- SELECT SUM(new_customers) AS altas, SUM(reactivated_customers) AS reactivaciones, ROUND(SUM(new_mrr_cop)) AS new_mrr_cop,
  ROUND(SUM(reactivation_mrr_cop)) AS reactivation_mrr_cop, MIN(month) AS desde, MAX(month) AS hasta FROM mart.monthly_metrics
  WHERE month >= '2022-03'
- SELECT CASE WHEN c.months_to_return = 1 THEN 'vuelve en t+1' ELSE 'vuelve en t+2 o más' END AS tramo, COUNT(*)
  AS vueltas, SUM(CASE WHEN r.multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS con_firma_multimes, SUM(CASE
  WHEN r.multi_month_payment_signature = c.months_to_return + 1 THEN 1 ELSE 0 END) AS paga_meses_saltados_mas_actual,
  ROUND(SUM(r.reactivation_mrr_cop)) AS reactivation_mrr_cop, ROUND(SUM(CASE WHEN r.multi_month_payment_signature
  > 0 THEN r.reactivation_mrr_cop ELSE 0 END)) AS reactivation_mrr_cop_con_firma FROM mart.customer_month c JOIN
  mart.customer_month r ON r.customer_id = c.customer_id AND r.month_index = c.month_index + c.months_to_return
  WHERE c.movement_type = 'churn' AND c.months_to_return IS NOT NULL GROUP BY 1 ORDER BY 1
- SELECT SUBSTR(month,1,4) AS anio, SUM(new_customers) AS altas, SUM(reactivated_customers) AS reactivaciones, SUM(churned_customers)
  AS churn_observado FROM mart.monthly_metrics WHERE month >= '2022-03' GROUP BY 1 ORDER BY 1
- SELECT COUNT(*) AS primeros_pagos, SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS con_firma_multimes,
  SUM(CASE WHEN cohort_flag = 'clean' THEN 1 ELSE 0 END) AS limpios FROM mart.customer_month WHERE movement_type
  = 'new'
