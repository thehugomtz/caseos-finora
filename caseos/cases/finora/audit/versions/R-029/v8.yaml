- id: DM-08
  title: Vueltas a pagar con firma de pago multi-mes
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: corrida 2026-09-29
  source_type: data_model
  quality: A
  note: SELECT COUNT(*) AS reactivaciones, SUM(CASE WHEN multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS
    con_firma_multimes, SUM(CASE WHEN amount_vs_usual_ratio = 1 THEN 1 ELSE 0 END) AS vuelve_con_monto_usual, SUM(CASE
