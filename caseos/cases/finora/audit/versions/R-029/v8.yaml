  verified: true
- id: DM-09
  title: Vueltas que pagan los meses saltados más el actual, y su monto
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: corrida 2026-09-29
  source_type: data_model
  quality: A
  note: SELECT CASE WHEN c.months_to_return = 1 THEN 'vuelve en t+1' ELSE 'vuelve en t+2 o más' END AS tramo, COUNT(*)
    AS vueltas, SUM(CASE WHEN r.multi_month_payment_signature > 0 THEN 1 ELSE 0 END) AS con_firma_multimes, SUM(CASE
    WHEN r.multi_month_payment_signature = c.months_to_return + 1 THEN 1 ELSE 0 END) AS paga_meses_saltados_mas_actual,
    ROUND(SUM(r.reactivation_mrr_cop)) AS reactivation_mrr_cop, ROUND(SUM(CASE WHEN r.multi_month_payment_signature
    > 0 THEN r.reactivation_mrr_cop ELSE 0 END)) AS reactivation_mrr_cop_con_firma FROM mart.customer_month c JOIN
    mart.customer_month r ON r.customer_id = c.customer_id AND r.month_index = c.month_index + c.months_to_return
    WHERE c.movement_type = 'churn' AND c.months_to_return IS NOT NULL GROUP BY 1 ORDER BY 1
  verified: true
