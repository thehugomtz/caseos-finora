why_it_matters: ''
short_answer: Gasto de S&M y altas se mueven en direcciones opuestas. Entre 2023 ene-may y 2023 jun-dic el S&M por
  mes pasó de 3,01 a 1,44 en unidad reportada, mientras las altas por mes pasaron de 45,2 a 60,6. Por ventana, el
  S&M por alta va de 0,11 a 0,04. En niveles mensuales la asociación es negativa (−0,57 en el mismo mes). Es una
  señal direccional, no una atribución
headline: Gasto de S&M y altas se mueven en direcciones opuestas
what_is_established:
- 'En los tramos de 2023 las series apuntan en sentidos contrarios: el S&M por mes cae de 3,01 a 1,44 y las altas
  por mes suben de 45,2 a 60,6. Los meses extremos son consistentes con ese patrón: el mes de mayor gasto, oct-22,
  registra 32 altas, y el mes de más altas, jun-24, tiene un gasto de 2,00.'
- La generación de demanda va de 64% en 2022 S1 a 58% en 2024 jul-oct, la capacidad comercial de 26% a 38% y la
  habilitación de 10% a 4%. La participación de Team se observa en 12% hasta may-23 y luego en 38% en ago-23 y 23%
  en oct-24, consistente con un tramo de participación fija seguido de variación.
- 'En niveles mensuales el S&M total se asocia negativamente con las altas: −0,57 en el mismo mes sobre 32 meses
  y −0,55 con un mes de rezago sobre 31 meses. Con rezago, oct-22 (3,75) precede a 19 altas y ago-23 (1,10) precede
  a 56 altas.'
- Las altas por mes van de 27,2 en 2022 mar-dic a 55,4 en 2024 ene-oct, y el S&M por alta va de 0,11 a 0,04 en unidad
  reportada, con su valor menor en 2023 jun-dic (0,02). El indicador por ventana se mueve a la baja mientras el
  volumen de altas sube.
- Faltan las etapas del funnel con sus fechas, la fuente del lead y la unidad documentada del gasto. Con lo disponible,
  la relación entre S&M y primeros pagadores solo puede describirse como coincidencia temporal entre series.
what_is_contested: []
what_remains_unknown:
- 'No puede atribuirse el movimiento de las altas al gasto de S&M: faltan etapas del funnel con fechas, fuente del
  lead y unidad documentada del gasto.'
- Las participaciones por categoría y la serie de Team no permiten distinguir gasto observado de reparto porcentual,
  porque el archivo parece construido de arriba hacia abajo.
- Las correlaciones mensuales describen coincidencia en niveles y no miden efecto, al no haber funnel, atribución,
  precios ni descuentos.
alternative_explanations: []
case_implication: Si se documenta la unidad y el método de construcción del archivo de S&M, podría revisarse si
  las categorías son gasto ejecutado o un reparto del total. Si el S&M por alta se adopta como métrica de seguimiento,
  convendría reportarlo por ventana junto con las altas por mes para no leerlo aislado.
changes_current_story:
  value: maybe
  why: El COS evalúa el efecto sobre las hipótesis y claims enlazados.
affected_hypotheses: []
affected_claims: []
suggested_action: ''
new_questions:
- ¿Qué documento interno define la unidad y el método de construcción del archivo de S&M, para saber si las categorías
  son gasto observado o un reparto porcentual del total?
- ¿Cómo se comportan las altas por mes y el gasto por alta si se separan las altas por industria de entrada?
- ¿El escalón de altas de inicios de 2023 coincide con un cambio en el ticket de entrada de las mismas altas, medido
  por banda de precio?
- ¿Qué parte de las altas de cada ventana sigue pagando al M3 y al M6, comparando ventanas de gasto alto y de gasto
  bajo?
