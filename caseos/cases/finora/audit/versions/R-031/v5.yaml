id: R-031
type: research
research_question: ¿Qué etapas aplican a cada funnel —Executive, Self Service, Hybrid A y B, Reactivate— por canal
  de entrada, literalmente como el Executive (New → Working SDR → Engaged SDR → SQL SDR → Demo AE → Proposal AE
  → Won), y cómo se mide cada funnel con un catálogo MECE de métricas explícitas (volumen, conversión por etapa,
  velocidad como el tiempo de cierre, valor, calidad y estancamiento)?
case_question: 'Bloque Growth/CRO: cómo definir y medir el funnel si no todos los clientes lo recorren igual. Sirve
  a C-021 (etapas, criterios de salida, dueño y saltos), C-005 (rutas Executive, Self Service e Hybrid, más el loop
  de Reactivate), C-006 (cohorte por puerta de entrada con ventana fija) y C-009 (árbol con semáforo de qué se mide
  hoy). También informa las preguntas abiertas Q-063 y Q-064.'
