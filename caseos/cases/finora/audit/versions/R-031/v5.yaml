task:
  work: propuesta
  draft_answer: 'De arranque: el canal es la puerta de entrada y el funnel es la ruta. Canales candidatos, a confirmar
    con Finora: digital (pago, orgánico, contenido), referidos, partners, eventos y prospección saliente. Executive
    usa las etapas de Hugo tal cual. Self Service: visita → registro → activación → checkout → primer pago. Hybrid
    A: registro → uso → señal → contacto SDR/AE → Demo o Proposal → Won → primer pago. Hybrid B: New → Working SDR
    → Engaged → registro en producto → checkout → primer pago. Reactivate: estancado → reactivado → reasignado a
    una ruta. En cada funnel, métricas por familia: volumen (p. ej., leads digitales), conversión por etapa (p.
    ej., CR digital de lead a primer pago), velocidad (tiempo a primer contacto, tiempo en etapa, tiempo de cierre),
    valor (ticket estabilizado al nudo), calidad (permanencia temprana) y estancamiento; cada métrica en un solo
    lugar.'
  hugo_said:
  - text: queria ver una prouesta aterrizada por casuistica de canal literalmente de los funeles asi como te pase
      la de new, working, SDR, engaged, bla bla quiero ver cuales aplican para los otros
    ref: N-050
  - text: ¿cada funnel? ¿cómo lo mides? no me refiero a solo medir la connversión, ¿que metricas hay en todo eso?
      Ej. Digital podría tener digital leads y CR digital, algo asi, Executive ya sabes que tiens New, pero tambien
      puedes tener métricas de tiempo de cierre
    ref: N-050
  - text: C-009 ¿hay otras métricas que debean de proponerse? De todo eso hay que ser explicitos en como se miden
      y siempre siempre ser MECE
    ref: N-050
