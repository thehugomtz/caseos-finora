why_it_matters: Sin mapas de etapas por ruta ni un catálogo MECE, al CRO le llega una conversión mezclada que no
  describe ninguna ruta y Finora no sabe qué instrumentar. Con ellos, C-021 y C-005 se vuelven concretos y C-009
  tiene su semáforo métrica por métrica.
short_answer: 'Propongo cuatro rutas que se clasifican al final del recorrido, según los eventos: Executive (arranca
  con persona y nunca pasa por Checkout Self), Self Service (nunca interviene una persona), Hybrid A (arranca en
  el producto y después entra una persona) e Hybrid B (arranca con persona y pasa por Checkout Self). Reactivate
  queda como loop para leads estancados. Cada ruta tiene sus etapas literales por puerta y su dueño, y se mide con
  33 métricas MECE: 8 comunes por puerta con cohorte y ventana fija, 5 por ruta (volumen, conversión por alcance,
  tiempo en etapa, estancamiento y calidad del handoff) y 5 del loop. Confío medianamente en el diseño, que sale
  de práctica RevOps y no de datos de Finora, y mucho en el diagnóstico de datos: hoy todo lo anterior al primer
  pago queda en rojo, porque el modelo solo trae pagos, industria y gasto, y apenas 4 métricas comunes se pueden
  calcular, con cuidado.'
