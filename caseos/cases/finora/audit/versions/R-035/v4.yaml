  work: propuesta
  draft_answer: 'De arranque, sobre las etapas literales de R-031: en cada funnel, una métrica concreta por familia
    y etapa. Executive: New por canal (volumen), Working→Engaged y Proposal→Won (conversión), tiempo a primer contacto
    y tiempo de cierre (velocidad), MRR de entrada por Won (valor), SQL aceptados por el AE (calidad), leads sin
    actividad por etapa (estancamiento) y costo por SQL y Won por AE (eficiencia). Self Service: leads digitales
    y CR digital de registro a pago, tiempo de registro a activación, activación temprana y CAC digital. Hybrid
    A y B: la señal que dispara el contacto, tiempo de señal a contacto y costo de la intervención por Won. Reactivate:
    stock estancado, re-enganche y costo por re-enganche. Cada métrica dice qué decisión del CRO habilita y si hoy
    se calcula.'
