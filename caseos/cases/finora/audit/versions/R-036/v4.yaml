task:
  work: propuesta
  draft_answer: 'Reformula RT-034 (R-035). R-035 tomó Hybrid B como «SQL directo» y Reactivate como clientes que
    dejaron de pagar y vuelven; con las definiciones de Hugo (C-021, R-029): la entrada directa a SQL es Executive
    con etapa de entrada SQL; Hybrid B es New → Working SDR → Engaged SDR → SQL SDR → Demo AE → Checkout Self →
    Won; Reactivate es un loop de leads estancados (estancado → reactivado → reasignado a una ruta, sin contar como
    entrada nueva); la vuelta de pagadores es un loop de Revenue aparte. Se reutiliza de R-035 lo que no depende
    de esas definiciones: la capa común (valor, calidad, eficiencia con CAC y payback por ruta) y el porqué, dueño
    y foro de cada métrica.'
  hugo_said:
  - text: recordemos que el funnel actual es New / Working SDR / Engaged SDR / SQL SDR / Demo Account Executie /
      Proposal Account Executive / Won /// ese es el punto de partida
    ref: N-033
  - text: Hybrid que se refiere que en alguna parte del funnel fuepor Self Service y en algun otro fue intervenido
      por una persona (pudo haber empzado hasta arriba y ser intervenido abajo, o pudo ser contactado como new y
      el solito lo acabó, hay que bajar bien esa definición)
    ref: N-037
  - text: tal vez añadir un reactivate que son los que dicen que están estancados pero hay formas de reactivarlos
      y asignarlos a un funnel de acuerdo al caso
    ref: N-038
  - text: me gustaría saber como en cada tipo de funnel y que métricas especificas de cada una de esas categorias
      mediriamos por tipo de funnel, quiero otra propuesta de lámina ahi
    ref: N-058
  steps:
