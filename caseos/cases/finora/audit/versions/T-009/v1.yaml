message: 'La serie de Habilitación cambia de composición dentro del panel: Freelance registra su último valor distinto
  de cero en jun-23 y aporta 0,00 al total de 2024, de modo que desde ese corte Habilitación coincide con SoftwareTools,
  que tiene valor positivo en 34 meses.'
