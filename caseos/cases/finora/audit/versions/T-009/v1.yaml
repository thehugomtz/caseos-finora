query: "-- E-002\nWITH r AS (\n  SELECT 'paid_media' AS rubro, month, paid_media AS v FROM mart.sm_monthly\n  UNION
  ALL SELECT 'publicidad_no_web', month, publicidad_no_web FROM mart.sm_monthly\n  UNION ALL SELECT 'team', month,
  team FROM mart.sm_monthly\n  UNION ALL SELECT 'payroll_expenses', month, payroll_expenses FROM mart.sm_monthly\n
  \ UNION ALL SELECT 'travel', month, travel FROM mart.sm_monthly\n  UNION ALL SELECT 'software_tools', month, software_tools
  FROM mart.sm_monthly\n  UNION ALL SELECT 'freelance', month, freelance FROM mart.sm_monthly\n)\nSELECT rubro,\n
  \ COUNT(*) AS meses_en_archivo,\n  SUM(CASE WHEN v IS NULL THEN 1 ELSE 0 END) AS meses_nulos,\n  SUM(CASE WHEN
  v > 0 THEN 1 ELSE 0 END) AS meses_positivos,\n  SUM(CASE WHEN v = 0 THEN 1 ELSE 0 END) AS meses_en_cero,\n  SUM(CASE
  WHEN v < 0 THEN 1 ELSE 0 END) AS meses_negativos,\n  MIN(month) AS primer_mes,\n  MAX(month) AS ultimo_mes,\n
  \ MAX(CASE WHEN v <> 0 THEN month END) AS ultimo_mes_no_cero,\n  ROUND(MIN(v),3) AS minimo,\n  ROUND(MAX(v),3)
  AS maximo\nFROM r GROUP BY rubro ORDER BY rubro\n\n-- E-004\nWITH sm AS (\n  SELECT CAST(substr(month,1,4) AS
  INT) AS anio, month,\n         total_sm_spend, enablement_spend, software_tools, freelance\n  FROM mart.sm_monthly
  WHERE month >= '2022-03'\n), alt AS (\n  SELECT CAST(substr(month,1,4) AS INT) AS anio, SUM(new_customers) AS
  altas\n  FROM mart.monthly_metrics WHERE month >= '2022-03' GROUP BY 1\n)\nSELECT sm.anio,\n  ROUND(SUM(sm.total_sm_spend),3)
  AS sm_total,\n  ROUND(SUM(sm.enablement_spend),3) AS habilitacion,\n  ROUND(SUM(sm.software_tools),3) AS software_tools,\n
  \ ROUND(SUM(sm.freelance),3) AS freelance,\n  ROUND(SUM(sm.enablement_spend)/SUM(sm.total_sm_spend),4) AS share_habilitacion,\n
  \ alt.altas,\n  ROUND(SUM(sm.total_sm_spend)/alt.altas,4) AS sm_por_alta_con_habilitacion,\n  ROUND((SUM(sm.total_sm_spend)-SUM(sm.enablement_spend))/alt.altas,4)
  AS sm_por_alta_sin_habilitacion\nFROM sm JOIN alt ON alt.anio = sm.anio\nGROUP BY sm.anio, alt.altas ORDER BY
  sm.anio"
