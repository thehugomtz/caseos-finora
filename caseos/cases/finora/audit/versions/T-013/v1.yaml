message: En 2023 jun-dic las altas por mes son 60,6 frente a 45,2 en 2023 ene-may, mientras el gasto de generación
  de demanda por mes baja de 1,73 u a 0,82 u y el S&M total por mes de 3,01 u a 1,44 u.
