query: "-- E-006\nSELECT industry, year,\n  count(*) AS altas,\n  round(median(m0_cop),0) AS m0_mediana,\n  round(median(m1_cop)
  FILTER (WHERE m1_cop > 0),0) AS m1_mediana,\n  round(median(early_run_rate_cop),0) AS rr_mediana,\n  round(avg(early_run_rate_cop),0)
  AS rr_promedio\nFROM mart.new_customers\nWHERE clean AND year IN (2022,2023,2024)\nGROUP BY industry, year ORDER
  BY industry, year"
