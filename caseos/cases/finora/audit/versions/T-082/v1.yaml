query: "-- E-011\nWITH b AS (\n  SELECT customer_id, month, month_index, paid_mrr_cop, reactivated_customer, reactivation_mrr_cop,\n
  \   MAX(CASE WHEN active_customer=1 THEN month_index END) OVER (PARTITION BY customer_id ORDER BY month_index
  ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS last_idx,\n    LAST_VALUE(CASE WHEN active_customer=1 THEN
  paid_mrr_cop END IGNORE NULLS) OVER (PARTITION BY customer_id ORDER BY month_index ROWS BETWEEN UNBOUNDED PRECEDING
  AND 1 PRECEDING) AS prev_amt\n  FROM mart.customer_month\n), r AS (\n  SELECT reactivation_mrr_cop AS mrr, (month_index
  - last_idx) AS gap,\n    paid_mrr_cop / NULLIF(prev_amt,0) AS ratio\n  FROM b WHERE reactivated_customer=1 AND
  month >= '2022-03' AND month <= '2024-10' AND prev_amt > 0\n), z AS (\n  SELECT mrr, CASE\n    WHEN ratio BETWEEN
  0.9 AND 1.1 THEN 'A. Regresa al monto usual'\n    WHEN abs(ratio - gap) <= 0.1*gap THEN 'B. Monto cubre los meses
  del hueco mas el corriente'\n    ELSE 'C. Otro monto' END AS clase\n  FROM r\n)\nSELECT clase, COUNT(*) AS eventos,
  ROUND(SUM(mrr)) AS mrr_cop,\n  ROUND(100.0*SUM(mrr)/SUM(SUM(mrr)) OVER (),1) AS share_pct\nFROM z GROUP BY clase
  ORDER BY clase"
