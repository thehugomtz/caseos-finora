    no existe. En texto chico sobre blanco usa variantes oscuras del turquesa o del lima que pasen 4.5:1. Portada
    general al inicio: «Business case: Finora», «Victor Hugo Martinez Medina» y la fecha, 30 de septiembre de 2026.
    La misma portada se repite al final de la presentación. Después de esa portada final van los anexos: todo lo
    que el Story Package deja como apéndice (lo descartado de la presentación), precedidos por un separador «Anexos».
    Separadores de sección: una lámina de color sólido por sección, solo con su nombre: Overview, Growth y Revenue
    (sugerido: Overview en turquesa, Growth en menta y Revenue en lima). Se mantiene el formato techy minimalista
    sin perder el toque de consultoría.'
