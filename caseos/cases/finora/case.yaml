id: finora
name: Finora
title: 'Business Analytics: del dato a la decisión'
client: Alegra · reto técnico
objective: Entender qué explicaciones podríamos defender ante CRO y CFO, qué sigue siendo una posibilidad y qué
  información permitiría elegir entre ellas.
audience:
- CEO
- CRO
- CFO
created_at: '2026-09-28T22:22:23-06:00'
created_by: import
language:
  primary: es
  tone: direct, conversational
  technical_level: adaptive
  preserve_user_vocabulary: true
  avoid_unnecessary_jargon: true
  structured_language: es
  observed:
    register: Conversacional y directo; piensa en funnels, láminas y bloques; mezcla español con términos de ventas
      en inglés.
    technical_level: 'Analítico-negocio: maneja etapas del funnel, SDR/AE, ToFu/BoFu y métricas SaaS.'
    formality: Tú, informal, sin rodeos.
    preserved_terms:
    - Análisis Ad hoc
    - Mecanismo Propuesto
    - Implicaciones Multidisciplinarias
    - research
    - data
    - funnel
    - self-serve
    - estancamientos
    - churn
    - reactivación
    - negocio subyacente
    - revenue que dejamos de capturar
    - MRR
    - pricing
    - MECE
    - Hybrid
    - Reactivate
    - New
    - Working
    - Engaged
    - SQL
    - Demo
    - Proposal
    - Won
    - SDR
    - Account Executive
    - casuística
    - canales
    - estancados
    - bowtie
    - puertas
    - nudo
    - ToFu
    - BoFu
    - leads
    - Self Service
    - artefactos de medición
    - causas potenciales
    - rebotar
    - Decision Making
    notes:
    - Perfil inicial derivado del brief v0.3 (sección «Lo tuyo») y de las notas del proyecto.
    introduced_terms:
    - term: regla de fase
      plain: todavía no se construye, pero sí es parte del caso
      at: '2026-09-29T00:01:59-06:00'
    - term: proxy
      plain: dato indirecto que usamos en lugar del que no tenemos
      at: '2026-09-29T00:01:59-06:00'
    - term: storyline provisional
      plain: el orden de la historia con el que trabajamos mientras tanto; no fija hallazgos
      at: '2026-09-29T00:09:41-06:00'
    - term: M0
      plain: el primer mes pagado de cada cliente nuevo, como lo trae mart.new_customers
      at: '2026-09-29T00:09:41-06:00'
    - term: run-rate temprano
      plain: el ritmo de pago de los primeros meses de un cliente nuevo, como lo calcula mart.new_customers
      at: '2026-09-29T00:09:41-06:00'
    - term: ARPU observado
      plain: monto pagado promedio por cliente activo, calculado con los pagos; no es precio de lista ni MRR contratado
      at: '2026-09-29T00:26:18-06:00'
    - term: primeros pagadores observados
      plain: clientes cuyo primer pago aparece en los datos; no son leads ni necesariamente clientes recién ganados
      at: '2026-09-29T00:26:18-06:00'
    - term: puente en capas
      plain: el cambio del MRR de un mes separado en lo que hizo el cliente, los cambios de tarifa y los descuentos,
        y que suma exactamente a lo cobrado
      at: '2026-09-29T10:04:07-06:00'
    - term: MRR antes de descuento vs MRR cobrado
      plain: lo que vale la suscripción contratada vs lo que efectivamente se cobra ese mes
      at: '2026-09-29T10:04:07-06:00'
    - term: ruta
      plain: 'cómo llegó al nudo según quién lo movió: Self Service (nadie de ventas), Executive (siempre una persona)
        o Hybrid (a ratos solo, a ratos una persona)'
      at: '2026-09-29T14:14:10-06:00'
    - term: tramo
      plain: 'el paso de una etapa a la siguiente: es «con persona» si lo movió un contacto registrado de SDR/AE,
        y «sin persona» si el cliente avanzó por su cuenta en el producto'
      at: '2026-09-29T14:14:10-06:00'
    - term: MoFu
      plain: 'la parte del medio del funnel: cómo se trabaja el lead entre que entra (New) y llega a SQL'
      at: '2026-09-29T14:27:26-06:00'
    - term: win rate
      plain: de las propuestas que se hacen, cuántas se ganan
      at: '2026-09-29T14:27:26-06:00'
