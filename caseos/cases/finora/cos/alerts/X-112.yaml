  por un efecto operativo real. La prueba más barata es la bitácora con fecha (nueva pregunta). Un cambio cerca
  de jul-24 la vuelve candidata; si no hubo cambios en esa ventana, pierde peso. Las opciones van en el impacto
  sobre Q-065.'
