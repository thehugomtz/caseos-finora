status_note: 'R-026 confirma que la caída del ticket de entrada está en el monto que se repite: el 2.º pago pasa
  de 52,5 a 36,8 mil y luego a 38,9 mil. Es un escalón 2022→2023 dentro de las 6 industrias, no un efecto del primer
  cobro ni una tendencia, y los promedios del primer pago de 2022 están inflados y no sirven como tamaño de la caída.
