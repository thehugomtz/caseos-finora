id: F-125
type: finding
headline: 'La premisa «no más ventas» depende de la ventana: con los pagos se sostiene en jul–oct 2024, pero no
  en mar–oct.'
evidence_text: 'Altas pagadas (primer pago observado) de 2023 a 2024. En mar–oct: 433→465 (+7%), con MRR pagado
  del primer mes de 19,5→24,6 MM COP (+26%). En jul–oct: 251→203 (−19%) y 10,7→9,1 MM COP (−15%); el monto por alta
  se mantuvo (≈42,6k→≈44,8k COP). Por trimestre, 2024-Q2 fue el máximo (219) y 2024-Q3 bajó a 153 (2023-Q3 había
  sido 187). Por semestre: 63,0 altas/mes en 2023-S2, 58,5 en 2024-S1 y 50,8 en 2024-S2 (jul–oct).'
confidence: high
limitations:
- 'El primer pago observado no es necesariamente la adquisición confirmada. Sin entradas no hay tasa: esto describe
  solo el volumen y el valor de las altas, no la conversión.'
kind: measurement
claims:
- claim: 'Altas pagadas (primer pago observado) por mes: 54,2 de promedio en 2023 y 55,4 en ene–oct 2024 (meses
    limpios). Por semestre: 63,0 en 2023-S2, 58,5 en 2024-S1 y 50,8 en 2024-S2 (jul–oct).'
  source_id: DM-02
  source_type: data_model
  confidence: high
  freshness: Datos 2022-03 a 2024-10
  supports_or_contests: supports
  notes: Apoya la premisa de ventas planas o en baja desde 2023-S2. El promedio anual compara ventanas distintas
    (2023 incluye nov–dic). El detalle por semestre sale de DM-03.
- claim: 'Mismo tramo mar–oct: 433 altas en 2023 y 465 en 2024 (+7%). El MRR pagado del primer mes fue de 19,5 y
    24,6 MM COP (+26%).'
  source_id: DM-04
  source_type: data_model
  confidence: high
  freshness: Datos 2022-03 a 2024-10
  supports_or_contests: contests
  notes: En esta ventana la premisa «no más ventas» no se sostiene, ni en volumen ni en valor.
- claim: 'Jul–oct: 251 altas en 2023 y 203 en 2024 (−19%). El MRR pagado del primer mes fue de 10,7 y 9,1 MM COP
    (−15%); el monto por alta se mantuvo (≈42,6k y ≈44,8k COP).'
  source_id: DM-05
  source_type: data_model
  confidence: high
  freshness: Datos 2023-07 a 2024-10
  supports_or_contests: supports
  notes: En la ventana más reciente cae el volumen de altas, no el valor por alta. El monto por alta es aritmética
    sobre los totales redondeados.
- claim: 'Por trimestre de alta: 2023-Q3 tuvo 187 altas, 2024-Q2 219 (el máximo) y 2024-Q3 153. La mediana del primer
    pago fue 35,3k COP en 2023-Q3, 46,2k en 2024-Q2, 37,8k en 2024-Q3 y 34,1k en oct-24.'
  source_id: DM-11
  source_type: data_model
  confidence: high
  freshness: Datos 2023-01 a 2024-10
  supports_or_contests: supports
  notes: Hay una caída reciente del volumen. No se ve un escalón en el primer pago de los nuevos en 2024-S2 que
    sugiera un aumento de precio para ellos (es monto observado, no precio de lista).
