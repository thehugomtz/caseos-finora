  supports_or_contests: context
  notes: Con los clientes activos de DM-12 (4.191 vs 6.491 cliente-mes), la expansión sube de ≈3,3% a ≈5,6% por
    mes. Las compras de clientes existentes aparecen como expansión, no como alta.
- claim: En jul–sep 2024, 220 de 243 expansiones no son picos de un mes ni pagos de varios meses juntos. El aumento
    mediano sobre el mes previo fue ≈8–9% en jul–oct 2024, frente a ≈4–5% en ago–oct 2023.
  source_id: DM-10
