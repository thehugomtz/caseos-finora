id: F-130
type: finding
headline: 'El monto pagado no identifica los componentes: con los campos actuales no se puede separar suscripción,
  tarifa, descuento ni momento de cobro.'
evidence_text: 'El modelo solo tiene cliente × mes × monto, más industria y gasto S&M. No hay plan, cantidad, tarifa
  de lista, precio pactado, descuento, periodo de servicio, factura ni estado de pago. En los casos de Q-025 las
  alternativas producen la misma secuencia de montos (100→100, 100→80, 80→100). En datos reales, Cliente 10 pasa
  de 42.000 a 0, luego a 84.000 y vuelve a 42.000 COP (may–ago 2023): el panel lo registra como churn, reactivación
  y contracción, pero es igual de compatible con un pago atrasado sin ningún cambio. Cliente 378 acumula 5 expansiones
  y 5 contracciones en 33 meses, aunque sus niveles estables solo cambian dos veces (84.000 → 96.600 → 149.520 COP).'
confidence: low
limitations:
- Demuestra que no se puede distinguir, no qué pasó en cada caso. Los dos clientes son ejemplos, no una muestra
  representativa.
kind: data_engineering
