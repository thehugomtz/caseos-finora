id: F-190
type: finding
headline: El único nudo común que se puede medir hoy es el primer pago. Won solo existe en las puertas con vendedor,
  y cambiar el nudo a «sigue pagando en M1» mueve poco el conteo.
evidence_text: El bowtie conecta volumen, conversión y velocidad a ambos lados de un nudo común [15]. Lo único que
  hoy existe para todas las puertas son los pagos [0]. Entre las altas limpias, no pagan en M1 el 8,1% en 2022,
  el 3,1% en 2023 y el 3,6% en 2024 [6]. Exigir que sigan pagando en M1 cambiaría el conteo de nuevos entre 3% y
  8%, mucho menos que la definición de Reactivate.
confidence: medium
limitations:
- No sabemos si una compra Self Service crea un Won en el CRM. Usar «suscripción activa» como nudo exige un estado
  de facturación que el modelo no tiene.
kind: measurement
claims:
- claim: El modelo de datos del caso solo tiene pagos mensuales por cliente, industria y gasto S&M por rubro. No
    hay leads, contactos, oportunidades, etapas ni etiqueta de puerta.
  source_id: S-DM-01
  source_type: data_model
  confidence: high
  freshness: Catálogo leído en esta corrida (2026-09-29)
  supports_or_contests: context
  notes: Por eso ninguna etapa antes del primer pago es medible hoy y no se afirma nada sobre conversión del funnel.
- claim: 'Entre las altas limpias con M1 observado, no pagan en M1 el 8,1% (2022: 22 de 272), el 3,1% (2023: 20
    de 650) y el 3,6% (2024: 18 de 504).'
  source_id: S-DM-06
  source_type: data_model
  confidence: high
  freshness: Datos ene-22–oct-24; consulta del 2026-09-29
  supports_or_contests: context
  notes: Exigir «sigue pagando en M1» como nudo movería el conteo de nuevos entre 3% y 8%. 2024 excluye la cohorte
    de oct-24, que aún no tiene M1.
- claim: Winning by Design presenta el bowtie como un modelo de datos para ingresos recurrentes que reemplaza al
    funnel, une adquisición, retención y expansión, y conecta métricas de volumen, conversión y velocidad en cada
    etapa.
  source_id: S-EXT-01
  source_type: industry
  confidence: medium
  freshness: 2026 (PDF subido en ene-2026)
  supports_or_contests: supports
  notes: Solo se pudo leer la página de inicio; el PDF no fue legible, así que los nombres exactos de las etapas
    y del nudo no se verificaron.
