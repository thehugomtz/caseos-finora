id: F-209
type: finding
headline: 'Regla MECE que respeta las definiciones de Hugo: la ruta sale de quién movió cada tramo, y la puerta
  de entrada queda aparte, fija al entrar.'
evidence_text: 'Con N-033 y N-037: Executive = todos los tramos los mueve SDR/AE (incluye entrada directa a SQL);
  Self Service = ningún tramo con persona; Hybrid A = el primer tramo lo movió el cliente y después intervino una
  persona; Hybrid B = el primer tramo lo movió una persona y después el cliente siguió solo. Decidir A/B por el
  primer tramo movido hace que cualquier mezcla (incluido persona → solo → persona) caiga en un solo lugar. Lo que
  no tiene ningún tramo movido queda como «sin ruta aún». La puerta (producto o CRM/ventas, con etapa de entrada
  y canal) se fija al entrar, no cambia y es la que sirve para comparar tasas. Forrester documenta que cada tipo
  de oportunidad convierte y tarda distinto en cada etapa (SRC-01): por eso no conviene mezclar rutas en una sola
  tasa. Separar motions según si el cliente necesita hablar con alguien antes de comprar también aparece en la práctica
  (SRC-10, solo snippet). Valida la hipótesis de arranque con un ajuste: puerta y ruta son dos campos distintos,
  no uno.'
confidence: medium
limitations:
- Es diseño. No hay CRM en el modelo para ver cuántos episodios caen en cada ruta ni si Finora registra quién movió
  cada etapa. Depende de cómo se cierre Q-063.
kind: measurement
