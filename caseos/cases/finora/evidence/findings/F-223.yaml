id: F-223
type: finding
headline: 'Hoy no se puede medir ningún funnel antes del primer pago: el modelo no tiene leads, etapas, dueños,
  canal ni ruta.'
evidence_text: 'El catálogo del modelo solo trae pagos cliente × mes, industria por cliente y gasto S&M mensual
  por rubro (DM-1). Con cuidado, se puede describir el lado posterior a Won: 1.584 altas tomadas como primer pago
  observado (DM-2), su M0 y run-rate temprano, la retención por cosecha y el churn observado (DM-3).'
confidence: high
limitations:
- Esto describe el modelo que llegó al caso. Finora podría tener un CRM con historial que nunca se entregó.
kind: measurement
claims:
- claim: El modelo del caso no tiene leads, etapas, fechas por etapa, dueño, canal de entrada ni ruta. Solo trae
    pagos cliente × mes, industria por cliente y gasto S&M mensual por rubro (34 meses, unidad no documentada).
  source_id: DM-1
  source_type: data_model
  confidence: high
  freshness: Modelo vigente; consultado 2026-09-29
  supports_or_contests: supports
  notes: Sostiene el rojo de todo lo anterior a Won en el semáforo de C-009.
- claim: 'Hay 1.584 altas tomadas como primer pago observado: 108 de feb-22 (marcadas), 272 en la cosecha 2022 (mar–dic),
    650 en 2023 y 554 en 2024 (ene–oct).'
  source_id: DM-2
  source_type: data_model
  confidence: high
  freshness: Datos feb-22 a oct-24; consulta 2026-09-29
  supports_or_contests: context
  notes: El primer pago es la primera aparición del cliente, no una adquisición confirmada, y tampoco equivale a
    Won.
- claim: 'Hay 751 churns observados: 330 vuelven a pagar al mes siguiente, 468 vuelven en algún momento y 283 no
    vuelven antes de oct-24.'
  source_id: DM-3
  source_type: data_model
  confidence: high
  freshness: Datos feb-22 a oct-24; consulta 2026-09-29
  supports_or_contests: context
  notes: Churn observado quiere decir pago en cero, no cancelación confirmada.
