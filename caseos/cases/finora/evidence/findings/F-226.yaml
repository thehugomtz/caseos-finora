id: F-226
type: finding
headline: Reactivate (leads estancados) y la reactivación del puente de MRR (clientes que vuelven a pagar) son poblaciones
  distintas y hay que medirlas por separado.
evidence_text: En pagos hay 468 reactivaciones de 340 clientes (DM-4). De los 751 churns observados, 330 vuelven
  a pagar al mes siguiente, pero solo 87 con el mismo monto, y 283 no vuelven antes de oct-24 (DM-3, DM-5). De los
  468 regresos, 330 pasan al primer mes (DM-6). Eso encaja más con huecos de pago que con clientes recuperados (inferencia).
  Las fuentes sobre reciclaje de leads separan reciclado, rechazado y expirado, y piden medir qué resulta de la
  reactivación (EXT-6).
confidence: medium
limitations:
- 'Los números son firmes, pero la lectura de «huecos de pago» es hipótesis: no hay datos de cancelación.'
kind: measurement
claims:
- claim: 'Hay 751 churns observados: 330 vuelven a pagar al mes siguiente, 468 vuelven en algún momento y 283 no
    vuelven antes de oct-24.'
  source_id: DM-3
  source_type: data_model
  confidence: high
  freshness: Datos feb-22 a oct-24; consulta 2026-09-29
  supports_or_contests: context
  notes: Churn observado quiere decir pago en cero, no cancelación confirmada.
- claim: De los 330 churns que vuelven al mes siguiente, solo 87 vuelven con el mismo monto. El panel tiene 512
    filas con firma de pago multimes.
  source_id: DM-5
  source_type: data_model
  confidence: high
  freshness: Datos feb-22 a oct-24; consulta 2026-09-29
  supports_or_contests: context
  notes: El catálogo describe returned_next_month como «con el mismo monto», pero los valores no lo cumplen. Hay
    que corregir esa documentación.
- claim: De los 468 regresos después de un churn, 330 pasan al primer mes, 62 al segundo y 24 al tercero. El resto
    se reparte hasta los 30 meses.
  source_id: DM-6
  source_type: data_model
  confidence: high
  freshness: Datos feb-22 a oct-24; consulta 2026-09-29
  supports_or_contests: context
  notes: Los regresos se concentran en t+1.
- claim: El panel cliente × mes registra 468 reactivaciones de 340 clientes.
  source_id: DM-4
  source_type: data_model
  confidence: high
  freshness: Datos feb-22 a oct-24; consulta 2026-09-29
  supports_or_contests: context
  notes: Es la reactivación del puente de MRR, no el loop Reactivate de leads.
- claim: 'El reciclaje de leads se mide separando reciclado, rechazado (mal fit) y expirado (sin acción), y midiendo
    qué resulta de la reactivación en una ventana posterior (ejemplo: 90–180 días).'
  source_id: EXT-6
  source_type: industry
  confidence: medium
  freshness: Sin fecha visible; consultado 2026-09-29
  supports_or_contests: supports
  notes: Referencia para diseñar el loop Reactivate. La ventana es un ejemplo, no un estándar.
- claim: La reactivación de pagos (cliente que vuelve a pagar tras churn) y el loop Reactivate (lead estancado)
    son poblaciones distintas. Mezclarlas en una sola métrica rompe el MECE.
  source_id: INF-1
  source_type: internal
  confidence: medium
  freshness: Corrida 2026-09-29
  supports_or_contests: context
  notes: Inferencia de diseño, sin cifras. Precisa el alcance de C-005.
- claim: Que la mayoría de los regresos ocurra al mes siguiente encaja más con huecos o desfases de pago que con
    churn y clientes recuperados de verdad.
  source_id: INF-1
  source_type: internal
  confidence: low
  freshness: Corrida 2026-09-29
  supports_or_contests: context
  notes: Es una hipótesis, no un hecho. Con pagos solos no se puede distinguir.
