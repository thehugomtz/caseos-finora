id: F-243
type: finding
headline: 'Hoy solo existe el lado post-pago: las 17 métricas propias de Executive, Self Service, Hybrid A y Hybrid
  B no se pueden calcular y ninguna métrica común se puede cortar por ruta.'
evidence_text: 'El modelo tiene pagos cliente × mes, industria y S&M por rubro. No tiene leads, etapas, ruta, canal
  ni uso de producto (DM1). Los 1.961 clientes del archivo de industria tienen al menos un pago (DM9): no hay nadie
  que no haya comprado. El gasto S&M viene en 7 rubros y en una unidad no documentada (DM1, DM10). Semáforo del
  catálogo: 3 verdes, 11 ámbar y 21 rojas.'
confidence: high
limitations:
- 'Describe el dataset del caso, no a Finora: puede existir un CRM o un sistema de cobro fuera de lo que recibimos
  (ausencia de evidencia ≠ evidencia de ausencia).'
kind: measurement
