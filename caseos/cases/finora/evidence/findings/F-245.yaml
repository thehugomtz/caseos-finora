id: F-245
type: finding
headline: 'El loop de Reactivate pesa casi como las altas y hoy mezcla cobranza con win-back: hay que medirlo como
  dos sub-loops con dueños distintos.'
evidence_text: 'Desde mar-22: 86,5 MM COP de MRR pagado de reactivación frente a 94,3 de altas nuevas, ≈39% del
  MRR agregado (DM6). 330 de 751 churn observados vuelven a pagar al mes siguiente (DM4). 126 de 468 retornos (≈27%)
  pagan exactamente (meses en cero + 1) × su monto usual: son 21,2 de 86,5 MM COP (DM7). ChartMogul define Reactivation
  como un ex-cliente que vuelve a pagar y deja configurar cuándo se reconoce el churn (EXT4). El churn involuntario
  se mide con falla y recuperación de pagos, no como voluntario (EXT8).'
confidence: medium
limitations:
- 'La firma es un patrón de montos, no un evento de mora: también es compatible con un prepago al volver. Es monto
  pagado observado, no MRR contratado.'
kind: measurement
claims:
- claim: Desde mar-22, el MRR pagado de reactivación (86,5 MM COP) es casi igual al de altas nuevas (94,3 MM COP)
    y representa ≈39% del MRR agregado (nuevo 94,3 + expansión 39,8 + reactivación 86,5).
  source_id: DM6
  source_type: data_model
  confidence: high
  freshness: Consulta 2026-09-30
  supports_or_contests: supports
  notes: Es monto pagado observado. El 39% es aritmética sobre DM6. Respalda darle a Reactivate un loop propio.
- claim: 126 de 468 retornos (≈27%) pagan exactamente (meses en cero + 1) × su monto usual; suman 21,2 de 86,5 MM
    COP (≈25%) del MRR pagado de reactivación.
  source_id: DM7
  source_type: data_model
  confidence: medium
  freshness: Consulta 2026-09-30
  supports_or_contests: contests
  notes: 'Contesta leer toda reactivación como win-back. La firma es heurística: es compatible con pago atrasado
    o con prepago al volver.'
- claim: De 751 churn observados, 330 vuelven a pagar al mes siguiente, 468 vuelven antes de oct-24 y 283 no han
    vuelto; la cola llega hasta 30 meses.
  source_id: DM4
  source_type: data_model
  confidence: high
  freshness: Consulta 2026-09-30
  supports_or_contests: context
  notes: Los totales 468 y 283 vienen de DM3. Los churn recientes están censurados, así que la tasa de retorno tiene
    que ser cohortada.
- claim: ChartMogul define Reactivation como un cliente que pagaba, hizo churn y vuelve a un plan pago, y ofrece
    un ajuste de «Churn Recognition» para decidir en qué momento se registra el churn.
  source_id: EXT4
  source_type: company
  confidence: high
  freshness: Sin fecha visible; consultado 2026-09-30
  supports_or_contests: supports
  notes: La ventana de gracia es una decisión de definición, no un dato.
- claim: 'Metabase: tasa de pago fallido = cargos fallidos ÷ cargos intentados en renovaciones; recuperación = facturas
    fallidas finalmente pagadas ÷ facturas que fallaron. El churn involuntario no se trata como voluntario, y falla
    y recuperación se reportan juntas.'
  source_id: EXT8
  source_type: company
  confidence: medium
  freshness: Sin fecha visible; consultado 2026-09-30
  supports_or_contests: supports
  notes: Base del sub-loop de cobranza cuando existan eventos de cobro.
