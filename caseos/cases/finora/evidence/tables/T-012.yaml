query: "-- E-004\nWITH sm AS (\n  SELECT CAST(substr(month,1,4) AS INT) AS anio, month,\n         total_sm_spend,
  enablement_spend, software_tools, freelance\n  FROM mart.sm_monthly WHERE month >= '2022-03'\n), alt AS (\n  SELECT
  CAST(substr(month,1,4) AS INT) AS anio, SUM(new_customers) AS altas\n  FROM mart.monthly_metrics WHERE month >=
  '2022-03' GROUP BY 1\n)\nSELECT sm.anio,\n  ROUND(SUM(sm.total_sm_spend),3) AS sm_total,\n  ROUND(SUM(sm.enablement_spend),3)
  AS habilitacion,\n  ROUND(SUM(sm.software_tools),3) AS software_tools,\n  ROUND(SUM(sm.freelance),3) AS freelance,\n
  \ ROUND(SUM(sm.enablement_spend)/SUM(sm.total_sm_spend),4) AS share_habilitacion,\n  alt.altas,\n  ROUND(SUM(sm.total_sm_spend)/alt.altas,4)
  AS sm_por_alta_con_habilitacion,\n  ROUND((SUM(sm.total_sm_spend)-SUM(sm.enablement_spend))/alt.altas,4) AS sm_por_alta_sin_habilitacion\nFROM
  sm JOIN alt ON alt.anio = sm.anio\nGROUP BY sm.anio, alt.altas ORDER BY sm.anio"
