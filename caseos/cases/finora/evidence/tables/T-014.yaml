query: "-- E-007\nWITH m AS (SELECT substr(CAST(month AS VARCHAR),1,7) AS ym, new_customers, new_mrr_cop FROM mart.monthly_metrics),\ns
  AS (SELECT substr(CAST(month AS VARCHAR),1,7) AS ym, demand_gen_spend, sales_capacity_spend, enablement_spend,
  total_sm_spend, team FROM mart.sm_monthly),\nj AS (SELECT m.ym, m.new_customers, m.new_mrr_cop, s.demand_gen_spend,
  s.sales_capacity_spend, s.enablement_spend, s.total_sm_spend, s.team FROM m JOIN s ON m.ym = s.ym WHERE m.ym >=
  '2022-03')\nSELECT CASE WHEN ym <= '2022-12' THEN '1. 2022 mar-dic' WHEN ym <= '2023-05' THEN '2. 2023 ene-may'
  WHEN ym <= '2023-12' THEN '3. 2023 jun-dic' ELSE '4. 2024 ene-oct' END AS ventana,\n COUNT(*) AS meses,\n ROUND(AVG(new_customers),1)
  AS altas_por_mes,\n ROUND(AVG(demand_gen_spend),2) AS demanda_por_mes,\n ROUND(AVG(sales_capacity_spend),2) AS
  capacidad_por_mes,\n ROUND(AVG(enablement_spend),3) AS habilitacion_por_mes,\n ROUND(AVG(total_sm_spend),2) AS
  sm_total_por_mes,\n ROUND(AVG(total_sm_spend)/AVG(new_customers),4) AS sm_por_alta,\n ROUND(AVG(demand_gen_spend)/AVG(new_customers),4)
  AS demanda_por_alta,\n ROUND(AVG(team/total_sm_spend),3) AS part_team_en_sm\nFROM j GROUP BY 1 ORDER BY 1"
