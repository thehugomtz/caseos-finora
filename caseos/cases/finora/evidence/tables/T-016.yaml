title: Las altas mensuales pasan de 26 en dic-22 a 60 en ene-23 y el punto más alto del periodo se observa en jun-24…
question: ¿Qué muestran juntos los primeros pagadores observados por industria y el gasto de S&M por categoría (Generación
  de Demanda ToFu, Team, Habilitación) a lo largo del tiempo? ¿Hasta dónde se pueden relacionar cruzando fechas
  sin pasar de asociación a efecto?
