definitions:
  Clientes activos: Clientes con MRR pagado mayor que cero en el mes.
  MRR pagado: Suma del monto pagado en el mes, multiplicado por 10.000 para expresarlo en COP. Es monto observado;
    la lectura "cobrado" es hipótesis.
message: Medidos de punta a punta entre ene-22 y oct-24 sobre la ventana completa, los clientes activos pasan de
  377 a 1.678 (índice 445 en base ene-22) y el MRR pagado de COP 35,0 millones a COP 97,0 millones (índice 277),
  lo que coincide con los múltiplos 4,5× y 2,8× publicados en el Overview.
