message: Entre las altas de ventana limpia, la parte cuyo primer pago supera con holgura su segundo pago es 23,2%
  en 2022, 7,1% en 2023 y 11,6% en 2024, mientras la parte cuyo segundo pago supera con holgura al primero es 1,1%,
  1,5% y 0,9% en los mismos años.
