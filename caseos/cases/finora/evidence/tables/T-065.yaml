definitions:
  Ticket de entrada (M0): MRR pagado por un cliente nuevo en su primer mes. Se reporta como promedio (MRR nuevo
    ÷ altas), mediana y percentiles.
message: La mediana del monto usual temprano de las altas es menor en 2024 que en 2022 en Producción (COP 55,1 mil
  a COP 37,8 mil), Restaurantes (COP 62,0 mil a COP 48,3 mil), Retail (COP 35,7 mil a COP 25,2 mil), Salud (COP
  63,0 mil a COP 48,8 mil), Servicios profesionales (COP 63,0 mil a COP 31,5 mil) y Tecnología (COP 63,0 mil a COP
  44,1 mil).
