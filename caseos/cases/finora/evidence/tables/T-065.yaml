query: "-- E-006\nSELECT industry, year,\n  count(*) AS altas,\n  round(median(m0_cop),0) AS m0_mediana,\n  round(median(m1_cop)
  FILTER (WHERE m1_cop > 0),0) AS m1_mediana,\n  round(median(early_run_rate_cop),0) AS rr_mediana,\n  round(avg(early_run_rate_cop),0)
  AS rr_promedio\nFROM mart.new_customers\nWHERE clean AND year IN (2022,2023,2024)\nGROUP BY industry, year ORDER
  BY industry, year\n\n-- E-001\nSELECT substr(month, 1, 4) AS periodo, industry AS industry, COUNT(*) AS altas,
  AVG(m0) AS valor, MEDIAN(m0) AS mediana, quantile_cont(m0, 0.25) AS p25, quantile_cont(m0, 0.75) AS p75, quantile_cont(m0,
  0.9) AS p90 FROM (SELECT month, industry, vintage, paid_mrr_cop::DOUBLE AS m0 FROM mart.customer_month WHERE new_customer
  = 1) WHERE month BETWEEN '2022-03' AND '2024-10' GROUP BY ALL ORDER BY periodo, industry"
