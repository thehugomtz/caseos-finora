definitions:
  Expansión: Aumento del monto pagado de clientes que ya pagaban (curr > prev > 0).
  Contracción: Disminución del monto pagado de clientes que siguen pagando (0 < curr < prev). Negativo por convención.
  Cambio neto de MRR: Suma de los cinco movimientos. Es igual al cambio del MRR pagado (validado al centavo).
message: En 2024, el puente de monto pagado registra COP 13,6 millones de expansión y −COP 21,5 millones de contracción
  frente a un cambio neto de COP 19,1 millones.
