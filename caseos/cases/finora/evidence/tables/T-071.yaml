query: '-- E-001

  SELECT substr(month, 1, 4) AS periodo, COALESCE(SUM(expansion_mrr_cop), 0)::DOUBLE AS valor, COUNT(DISTINCT month)
  AS meses, (COALESCE(SUM(expansion_mrr_cop), 0)::DOUBLE) / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month
  WHERE month BETWEEN ''2022-03'' AND ''2024-10'' GROUP BY ALL ORDER BY periodo


  -- E-002

  SELECT substr(month, 1, 4) AS periodo, COALESCE(SUM(contraction_mrr_cop), 0)::DOUBLE AS valor, COUNT(DISTINCT
  month) AS meses, (COALESCE(SUM(contraction_mrr_cop), 0)::DOUBLE) / COUNT(DISTINCT month) AS promedio_mensual FROM
  mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10'' GROUP BY ALL ORDER BY periodo


  -- E-003

  SELECT substr(month, 1, 4) AS periodo, (COALESCE(SUM(new_mrr_cop), 0) + COALESCE(SUM(expansion_mrr_cop), 0) +
  COALESCE(SUM(reactivation_mrr_cop), 0) + COALESCE(SUM(contraction_mrr_cop), 0) + COALESCE(SUM(churned_mrr_cop),
  0))::DOUBLE AS valor, COUNT(DISTINCT month) AS meses, ((COALESCE(SUM(new_mrr_cop), 0) + COALESCE(SUM(expansion_mrr_cop),
  0) + COALESCE(SUM(reactivation_mrr_cop), 0) + COALESCE(SUM(contraction_mrr_cop), 0) + COALESCE(SUM(churned_mrr_cop),
  0))::DOUBLE) / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03''
  AND ''2024-10'' GROUP BY ALL ORDER BY periodo'
