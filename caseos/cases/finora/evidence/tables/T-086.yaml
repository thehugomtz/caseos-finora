query: "-- E-009\nWITH b AS (\n  SELECT customer_id, month, month_index, paid_mrr_cop, previous_month_mrr, contracted_customer,
  contraction_mrr_cop,\n    LEAD(paid_mrr_cop) OVER (PARTITION BY customer_id ORDER BY month_index) AS next_amt\n
  \ FROM mart.customer_month\n), c AS (\n  SELECT contraction_mrr_cop AS mrr,\n    CASE\n      WHEN next_amt >=
  0.95*previous_month_mrr THEN 'A. Al mes siguiente regresa al nivel previo a la baja'\n      WHEN next_amt > paid_mrr_cop
  THEN 'B. Al mes siguiente sube, sin llegar al nivel previo'\n      ELSE 'C. Al mes siguiente sigue igual o mas
  abajo' END AS clase\n  FROM b WHERE contracted_customer=1 AND month >= '2022-03' AND month <= '2024-09' AND previous_month_mrr
  > 0\n)\nSELECT clase, COUNT(*) AS eventos, ROUND(SUM(mrr)) AS mrr_cop,\n  ROUND(100.0*SUM(mrr)/SUM(SUM(mrr)) OVER
  (),1) AS share_pct\nFROM c GROUP BY clase ORDER BY clase\n\n-- E-007\nWITH c AS (\n  SELECT contraction_mrr_cop
  AS mrr,\n         CASE\n           WHEN reverts_next_month = 1 THEN 'A. Vuelve exacto al nivel previo al mes siguiente'\n
  \          ELSE 'B. La baja persiste al mes siguiente'\n         END AS clase\n  FROM mart.customer_month\n  WHERE
  contracted_customer = 1\n    AND month >= '2022-03' AND month <= '2024-10'\n)\nSELECT clase,\n       COUNT(*)
  AS eventos,\n       ROUND(SUM(mrr)) AS mrr_contraccion_cop,\n       ROUND(100.0 * SUM(mrr) / SUM(SUM(mrr)) OVER
  (), 1) AS share_pct\nFROM c GROUP BY clase ORDER BY clase"
