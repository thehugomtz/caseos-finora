message: 'La contracción observada no muestra la firma de momento de cobro: la parte que regresa al nivel previo
  a la baja al mes siguiente explica 4,0% del MRR de contracción, mientras la parte que al mes siguiente sigue igual
  o más abajo explica 88,9%.'
