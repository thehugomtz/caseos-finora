definitions:
  Reactivaciones: Clientes que vuelven a pagar después de al menos un mes en cero.
  Altas (clientes nuevos): Clientes con MRR pagado mayor que cero en el mes y que nunca antes habían pagado.
message: Las reactivaciones por mes son 17 en 2022 (mar–dic), 12 en 2023 y 16 en 2024 (ene–oct), frente a 27, 54
  y 55 altas por mes en los mismos periodos.
