query: '-- E-011

  SELECT substr(month, 1, 4) AS periodo, SUM(reactivated_customer) AS valor, COUNT(DISTINCT month) AS meses, (SUM(reactivated_customer))
  / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10''
  GROUP BY ALL ORDER BY periodo


  -- E-003

  SELECT substr(month, 1, 4) AS periodo, SUM(new_customer) AS valor, COUNT(DISTINCT month) AS meses, (SUM(new_customer))
  / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10''
  GROUP BY ALL ORDER BY periodo


  -- E-002

  SELECT month AS periodo, SUM(reactivated_customer) AS valor, COUNT(DISTINCT month) AS meses, (SUM(reactivated_customer))
  / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10''
  GROUP BY ALL ORDER BY periodo'
