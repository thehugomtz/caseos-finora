query: '-- E-009

  WITH ch AS (SELECT customer_id, industry, month_index AS mi, previous_month_mrr AS amt FROM mart.customer_month
  WHERE churned_customer = 1 AND previous_month_mrr > 0), al AS (SELECT customer_id, industry, month_index AS mi,
  paid_mrr_cop AS amt, year AS anio FROM mart.customer_month WHERE new_customer = 1 AND month_index >= 2 AND paid_mrr_cop
  > 0) SELECT anio, COUNT(*) AS altas, COUNT(*) FILTER (WHERE EXISTS (SELECT 1 FROM ch WHERE ch.industry = al.industry
  AND ch.customer_id <> al.customer_id AND ch.amt = al.amt AND ch.mi >= al.mi - 3 AND ch.mi <= al.mi)) AS altas_match_reciente,
  COUNT(*) FILTER (WHERE EXISTS (SELECT 1 FROM ch WHERE ch.industry = al.industry AND ch.customer_id <> al.customer_id
  AND ch.amt = al.amt AND ch.mi >= al.mi + 9 AND ch.mi <= al.mi + 12)) AS altas_match_placebo FROM al GROUP BY anio
  ORDER BY anio'
