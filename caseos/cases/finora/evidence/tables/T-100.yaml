message: En 2023, 175 de 650 altas coinciden en monto exacto e industria con el último pago de un churn reciente,
  frente a 196 altas bajo un emparejamiento placebo con churns muy posteriores; en 2022 (mar–dic) las cifras son
  76 de 272 contra 68.
