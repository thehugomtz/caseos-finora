query: "-- E-006\nWITH s AS (SELECT month,\n       CASE WHEN month <= '2022-06' THEN '2022 S1'\n            WHEN
  month <= '2022-12' THEN '2022 S2'\n            WHEN month <= '2023-05' THEN '2023 ene-may'\n            WHEN month
  <= '2023-12' THEN '2023 jun-dic'\n            WHEN month <= '2024-06' THEN '2024 S1'\n            ELSE '2024 jul-oct'
  END AS periodo,\n       demand_gen_spend, sales_capacity_spend, enablement_spend, team, total_sm_spend\nFROM mart.sm_monthly)\nSELECT
  periodo,\n       ROUND(SUM(demand_gen_spend),2) AS demanda_u,\n       ROUND(SUM(sales_capacity_spend),2) AS capacidad_u,\n
  \      ROUND(SUM(enablement_spend),2) AS habilitacion_u,\n       ROUND(SUM(demand_gen_spend)/SUM(total_sm_spend),4)
  AS part_demanda,\n       ROUND(SUM(sales_capacity_spend)/SUM(total_sm_spend),4) AS part_capacidad,\n       ROUND(SUM(enablement_spend)/SUM(total_sm_spend),4)
  AS part_habilitacion,\n       ROUND(SUM(team)/SUM(total_sm_spend),4) AS part_team\nFROM s GROUP BY periodo ORDER
  BY periodo\n\n-- E-002\nSELECT * FROM mart.sm_monthly ORDER BY 1"
