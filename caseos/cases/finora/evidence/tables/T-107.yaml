query: "-- E-007\nWITH s AS (SELECT month, total_sm_spend FROM mart.sm_monthly),\nn AS (SELECT month, new_customers
  FROM mart.monthly_metrics),\nj AS (SELECT s.month AS mes, s.total_sm_spend AS sm_total_u,\n             LEAD(n.new_customers)
  OVER (ORDER BY s.month) AS altas_mes_siguiente\n      FROM s LEFT JOIN n ON n.month = s.month)\nSELECT mes, ROUND(sm_total_u,3)
  AS sm_total_u, altas_mes_siguiente\nFROM j WHERE altas_mes_siguiente IS NOT NULL AND mes >= '2022-02' ORDER BY
  mes\n\n-- E-004\nWITH s AS (SELECT month, total_sm_spend FROM mart.sm_monthly WHERE month >= '2022-03'),\nn AS
  (SELECT month, new_customers FROM mart.monthly_metrics WHERE month >= '2022-03'),\nj AS (SELECT s.month, s.total_sm_spend
  AS sm, n.new_customers AS altas,\n             LEAD(n.new_customers) OVER (ORDER BY s.month) AS altas_lag1\n      FROM
  s JOIN n ON n.month = s.month)\nSELECT 'rezago_0' AS especificacion, COUNT(*) AS n_meses, ROUND(CORR(sm, altas),3)
  AS r_pearson\nFROM j WHERE altas IS NOT NULL\nUNION ALL\nSELECT 'rezago_1', COUNT(*), ROUND(CORR(sm, altas_lag1),3)
  FROM j WHERE altas_lag1 IS NOT NULL"
