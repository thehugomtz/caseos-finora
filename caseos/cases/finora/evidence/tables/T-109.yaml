message: 'No es posible atribuir las altas de primeros pagadores al gasto de S&M: faltan las etapas del funnel con
  sus fechas, la fuente del lead y la unidad documentada del gasto, de modo que la relación solo puede describirse
  como coincidencia temporal entre series.'
