version: 2
executive_question: ¿Qué explicaciones podemos defender ante el CRO y el CFO con los datos disponibles, qué sigue
  siendo solo una posibilidad y qué información permitiría elegir entre ellas?
executive_question_history: []
hugo_thinking: []
structured_interpretation: []
candidate_frames:
- name: CRO por cuánto entra, quién entra y cómo compra con el tiempo
  description: Incluye rutas distintas sin asumir que sabemos quién comprará en el futuro. C1, C2 y C3.
  when_it_wins: Es el corte elegido.
  chosen: true
- name: CFO por clientes que entran / salen / permanecen
  description: Evita contar la misma cuenta en dos grupos entre las mismas fechas; dentro de cada grupo distinguimos
    suscripción y descuento.
  when_it_wins: Es el corte elegido.
  chosen: true
- name: CRO por etapas comerciales
  description: Dónde se detiene el avance cuando sí hay historial de etapas.
  when_it_wins: No sirve igual para self-serve ni entradas directas; las etapas quedan como lugar donde investigar
    dentro de C3.
  chosen: false
- name: CFO por comportamiento / precio / descuentos
  description: Se parece a la pregunta del ejecutivo.
  when_it_wins: 'No separa causas limpiamente: un precio o descuento puede cambiar el comportamiento. Se investigan
    dentro de los grupos.'
  chosen: false
initial_storyline:
- 'Qué sabemos: el caso relata más volumen comercial sin aumento proporcional de clientes nuevos, y plantea distinguir
  cambios de ingreso al introducir descuentos.'
- 'Qué nos impide cerrar la explicación: las fuentes muestran pagos, industria y gasto, pero no toda la historia
  de quienes entraron ni los componentes del valor recurrente.'
- 'Cómo proponemos avanzar: usar los pagos para describir lo que sí vemos, revisar con los ejemplos qué distingue
  el modelo y dejar claras las preguntas que requieren más evidencia.'
- 'Qué tan seguros estamos: la separación de preguntas es defendible bajo las definiciones que explicamos; todavía
  tenemos poca evidencia para elegir una causa real del desempeño.'
- 'Qué cambiaría el plan: descubrir eventos completos de entradas y compras, o información separada de suscripciones,
  tarifas y descuentos.'
