decisions_needed:
- Qué unidad cuenta como entrada (contacto, usuario, oportunidad o cliente).
- 'Qué significa adquirir un cliente para el CRO: cerrar una venta, primer pago o suscripción activa.'
- 'Qué es «Executive» en la Lámina 3: la ruta de entrada directa a SQL o un segmento de cuentas con KAM. Define
  si las columnas separan cómo compra el cliente o quién es.'
- Qué decisiones del CRO asumimos explícitamente para la columna «Decision Making», dado que el caso no las define.
- 'Cómo se arma el funnel híbrido: una secuencia con varias puertas de entrada, un funnel por motion que converge
  en el pago, o cohortes de entrada con plazo fijo (ver alternativas de este turno).'
- 'Qué MRR es el titular cuando existan descuentos: el de antes de descuento (valor de la suscripción), el cobrado,
  o ambos con el descuento como línea del puente.'
- 'Qué entra en «revenue que dejamos de capturar por decisiones comerciales»: solo descuentos temporales o también
  otras concesiones, como una tarifa negociada.'
- Si el mecanismo de descuentos temporales se propone desde cero como supuesto declarado, dado que no sabemos qué
  tiene definido Finora.
should_not_claim:
- 'Que el monto sea MRR contratado: mientras la recurrencia no se confirme, se habla de monto pagado observado.'
- 'Que la primera transacción sea la adquisición del cliente: mientras la historia no se confirme, es la primera
  aparición observada.'
- 'Que una comparación sin cobertura completa describa al negocio: se detiene esa comparación.'
- 'Que hubo descuentos en el histórico: el caso habla de introducirlos.'
- 'Que una simulación de escenarios describe lo que ocurrió: prueba qué se puede distinguir, no qué pasó.'
- 'Nada sobre conversión de leads o del funnel: los pagos no incluyen a quien no compró.'
- Que la primera aparición sea el hito de adquisición del CRO (Won, primer pago o suscripción activa siguen por
  acordar).
- Etiquetas contractuales (alta, baja o expansión de suscripción) sin vigencia verificada.
- Descuentos a partir del tamaño de un salto del monto.
- Una lectura del puente si las contribuciones no concilian con el total.
- 'Una causa industrial, un canal o una fase del recorrido: la industria es una segmentación disponible, no un sustituto
  de canal o ruta.'
- Un segmento fabricado por clustering cuando no hay concentración clara.
- La calidad de los leads a partir de lo que pasa después del pago.
- Retención contractual a partir de la continuidad de pago.
- 'Que Finora «tiene un problema» de CRM o analítica digital: que los datos del caso no traigan canal ni etapas
  no prueba que Finora no los registre.'
- Valores de LTV o UCM (no hay margen ni costo por cliente) ni de CAC por canal (no hay canal). Un CAC combinado
  depende de documentar la unidad del gasto y de acordar qué es adquirir un cliente.
- Que una categoría de gasto (ToFu, Team, Habilitación) generó ventas porque las dos series se mueven en las mismas
  fechas.
- 'Que el ~−38% por cliente activo sea deterioro de la salud del negocio: todavía no separamos la mezcla de quienes
  entran, el precio y las salidas.'
- 'Una cifra histórica de revenue no capturado ni un puente histórico por tarifa y descuento: el histórico no trae
  tarifas ni descuentos; eso se propone hacia adelante.'
- 'Plazos o umbrales del funnel (días para «estancado», plazo para contar la compra) como si fueran estándar de
  mercado: son parámetros a acordar con Finora.'
- 'Que los tres casos de Q-025 muestran lo que pasa en Finora: son ejemplos construidos que prueban un límite del
  modelo, no observaciones.'
language_notes:
- Hugo usa «monto observado» y «primer pagador observado» en lugar de MRR y cliente nuevo mientras la semántica
  no esté confirmada.
- 'Términos en inglés que Hugo usa tal cual: leads, funnel, churn, self-serve, SQL, MRR.'
- 'Overview: «MRR pagado por cliente activo» (o «monto pagado por cliente activo») en lugar de «MRR» a secas; es
  el ARPU observado de Hugo.'
- «Entradas» en la Lámina 2 = primeros pagadores observados; «entradas» y «leads» del funnel quedan para L3–L4.
- «Executive» se puede confundir con Account Executive (el rol que entra después de SQL en el caso), y «KAM» no
  aparece en el caso, que habla de SDRs y AEs. Conservar los términos de Hugo y definirlos en la lámina.
- «Foros» = espacios recurrentes donde se toman decisiones (p. ej., la revisión comercial semanal); se conserva
  el término.
- Usar «cobrado» para lo que efectivamente se paga y «valor de la suscripción» o «antes de descuento» para lo contratado.
  Evitar «neto» para esto, porque en el caso «neto» ya se usa para el resultado del puente.
- «Estancado» es una bandera de tiempo en etapa, no una etapa del funnel.
- 'Hugo pega las preguntas literales del caso: pueden quedar tal cual como pregunta de cada lámina. «Negocio subyacente»
  y «revenue que dejamos de capturar» vienen del texto del caso; conservarlas.'
risks:
- El esqueleto (Overview + 4 láminas de Growth + Revenue) es material de soporte; si se usa como la presentación
  de ≤5 min, no cabe.
- La Lámina 4 carga tres preguntas del brief (concentración + métricas, hipótesis + datos, solución analítica) y
  puede quedar como una lista de frameworks sin respuesta.
- El agente propio dentro de «Seguimiento» puede leerse como demo de herramienta si no se ata a una decisión concreta
  del CRO.
- Que las tareas de data_model y measurement terminen construyendo el modelo o métricas definitivas, contra D-007.
  El producto es la propuesta (qué campos, qué reglas, qué métricas), no la implementación.
- 'Catálogo de métricas sin decisión: mientras N-027 siga vacío, S2.5 puede volverse una lista. Cada métrica tiene
  que colgar de una decisión supuesta y declarada.'
- 'Volumen: el plan queda en 14 tareas para un deck de ≤5 min. La mayoría alimenta el material de soporte; conviene
  priorizar por impacto × capacidad (D-005) y lanzar primero las que pueden ahorrar trabajo.'
