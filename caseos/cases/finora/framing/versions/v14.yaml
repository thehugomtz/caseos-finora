version: 14
executive_question: ¿Qué explicaciones podemos defender ante el CRO y el CFO con los datos disponibles, qué huecos
  en su WoW y qué modelos se proponen para poder llegar a tomar mejores decisiones?
executive_question_history:
- text: ¿Qué explicaciones podemos defender ante el CRO y el CFO con los datos disponibles, qué sigue siendo solo
    una posibilidad y qué información permitiría elegir entre ellas?
  by: hugo
hugo_thinking: []
structured_interpretation: []
candidate_frames:
- name: CRO por cuánto entra, quién entra y cómo compra con el tiempo
  description: Incluye rutas distintas sin asumir que sabemos quién comprará en el futuro. C1, C2 y C3.
  when_it_wins: Es el corte elegido.
  chosen: true
- name: CFO por clientes que entran / salen / permanecen
  description: Evita contar la misma cuenta en dos grupos entre las mismas fechas; dentro de cada grupo distinguimos
    suscripción y descuento.
  when_it_wins: Es el corte elegido.
  chosen: true
- name: CRO por etapas comerciales
  description: Dónde se detiene el avance cuando sí hay historial de etapas.
  when_it_wins: No sirve igual para self-serve ni entradas directas; las etapas quedan como lugar donde investigar
    dentro de C3.
  chosen: false
- name: CFO por comportamiento / precio / descuentos
  description: Se parece a la pregunta del ejecutivo.
  when_it_wins: 'No separa causas limpiamente: un precio o descuento puede cambiar el comportamiento. Se investigan
    dentro de los grupos.'
  chosen: false
initial_storyline:
- 'Situación (Overview): Finora suma clientes mucho más rápido que monto pagado (4,5× vs 2,8×; ~−38% por cliente
  activo, periodo por fijar). Esa brecha abre Growth y Revenue.'
- 'Growth, lo que sí vemos: los primeros pagadores observados y su actividad económica por industria, y el gasto
  de Marketing por categoría en el tiempo, descritos sin atribuir ventas al gasto.'
- 'Growth, lo que no vemos: no todos recorren el funnel igual (propuesta: Assisted, Self Service, Executive). Demanda,
  calidad, capacidad/atención y post-SQL quedan como explicaciones a contrastar, cada una con el dato que permitiría
  elegir.'
- 'Growth, cómo operarlo: primero definiciones y fuentes comunes; después, seguimiento recurrente por foros (dashboards,
  análisis ad hoc, agentes), atado a decisiones del CRO que aún no están definidas.'
- 'Revenue: con solo el monto pagado, cada ejemplo del CFO admite dos lecturas (cambio de suscripción o descuento).
  Proponemos cómo introducir descuentos temporales y un modelo de datos que separe el valor de la suscripción del
  precio pagado.'
- 'Qué tan seguros estamos y qué cambiaría: la separación de preguntas es defendible bajo las definiciones que explicamos.
  Para elegir causas faltan eventos de entradas y compras, y datos separados de suscripción, tarifa y descuento.'
