- id: RT-019
  question: ¿Qué solución analítica le permitiría al CRO operar el funnel de forma recurrente y qué decisiones le
    permitiría tomar? Capa técnica (CRM, analítica digital) y capa de decision making (dashboards por foro, análisis
    ad hoc, agentes de IA).
