executive_question_note: Formulada como pregunta desde brief v0.3 §01 · Qué estamos tratando de conseguir.
stress_test:
- n: 1
  point: No sabemos quién comprará algún día
  risk: Separar «nunca compra» de «compra más tarde» exigía observar un futuro que todavía no tenemos.
  resolution: Juntar ambas cosas en la evolución de compra a lo largo del tiempo; retraso y pérdida siguen como
    explicaciones posibles.
- n: 2
  point: Ordenar ramas no separa automáticamente las causas
  risk: Atención, demanda, precio y producto pueden afectarse entre sí.
  resolution: No sumar dos causas como si fueran independientes sólo porque tienen nombres distintos.
- n: 3
  point: «Peor calidad» puede ser una mezcla que no vemos
  risk: Dentro de un grupo amplio puede haber personas distintas que no identificamos.
  resolution: Comparar características conocidas al entrar y dejar la parte que no podemos explicar abierta; no
    culpar por descarte.
- n: 4
  point: El recorrido final no es un dato inicial
  risk: Que alguien termine hablando con ventas puede depender de lo que pasó durante el proceso.
  resolution: Separar cómo entró de lo que ocurrió después.
- n: 5
  point: Ser reciente no es lo mismo que tardar más
  risk: Muchas entradas nuevas pueden parecer lentas aunque el proceso siga igual.
  resolution: Comparar personas con el mismo tiempo desde que entraron.
- n: 6
  point: Más volumen no explica solo una peor proporción
  risk: La cantidad total aclara cuánto creció la demanda, pero no por qué menos de ella termina comprando.
  resolution: Usar C1 para verificar la escala de la entrada; C2 y C3 para investigar cómo se traduce en clientes.
- n: 7
  point: Entradas y ventas del mismo mes no necesariamente corresponden
  risk: Quien compra hoy pudo haber entrado semanas antes.
  resolution: No dividir sin más compradores del mes entre leads del mes. Seguir grupos desde su entrada.
- n: 8
  point: Entrar/salir/permanecer no explica el porqué del monto
  risk: Esos grupos separan clientes, pero no distinguen suscripción de tarifa o descuento.
  resolution: Dentro de cada grupo, preguntar por valor antes de descuento y descuento aplicado.
- n: 9
  point: No pagar no prueba haber cancelado
  risk: Puede haber atraso, descuento total o un dato faltante.
  resolution: Separar relación activa de pago observado. Cuando sólo vemos pagos, decirlo así.
- n: 10
  point: No asumir descuentos históricos
  risk: El caso habla de introducirlos; no confirma que expliquen cambios pasados.
  resolution: Separar lo que ocurrió en el histórico de si el modelo permitiría entender descuentos futuros.
- n: 11
  point: Un neto estable puede esconder cambios
  risk: Altas y bajas, o crecimiento y descuentos, pueden compensarse.
  resolution: Mirar las partes cuando existan.
- n: 12
  point: «Necesitamos CRM» es demasiado general
  risk: No dice qué dato distinguiría calidad de atención.
  resolution: Precisar qué comparación haríamos, qué esperaríamos ver y qué explicación alternativa seguiría abierta.
- n: 13
  point: Importancia no significa que podamos calcularlo
  risk: Las preguntas centrales del funnel requieren personas y eventos que no están en Transactions.
  resolution: Separar trabajo posible con la data actual de preguntas importantes que necesitan más evidencia.
- n: 14
  point: Descuento no equivale a dinero recuperable
  risk: Sin el descuento quizá el cliente no habría comprado o habría cancelado.
  resolution: Distinguir cuánto se redujo el precio de cuánto se habría ganado sin ofrecer esa reducción.
perspectives:
- who: CEO
  question: ¿Y si estamos comparando leads recientes con compras de personas que llegaron antes?
  changes: Antes de afirmar que algo empeoró, revisar si la comparación tiene sentido.
- who: Cliente
  question: ¿Y si no soy un lead malo, sino que el producto, precio o experiencia no me convence?
  changes: No aceptar como hecho la explicación de Sales.
- who: Competidor
  question: ¿Y si apareció una alternativa mejor, aunque nuestra atención no haya cambiado?
  changes: Dejar esa posibilidad abierta; investigar afuera sólo si aparece una señal que lo justifique.
- who: CFO
  question: ¿Y si cambió cuándo cobramos o cómo registramos, y no la suscripción?
  changes: Aclarar el significado del monto antes de explicar su cambio.
- who: Lectura del enunciado
  question: ¿Y si no había descuentos y el reto pide prepararnos para cuando existan?
  changes: Dar espacio a la prueba de si el modelo distingue escenarios, sin atribuir descuentos al pasado.
parked:
- Inferir canales mediante grupos de pagos; benchmarks generales; atribución multicanal; estimar LTV o CAC causal;
  modelar quién comprará «algún día»; adivinar descuentos históricos; diseñar o mostrar funciones de la herramienta.
  (brief v0.3 §08 · Lo que dejamos fuera por ahora)
