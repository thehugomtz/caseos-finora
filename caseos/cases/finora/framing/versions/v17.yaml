    con ventas. Assisted entra por campañas, referidos, partners o prospección, y lo trabajan SDR y luego AE (New
    → Working → Engaged → SQL → Demo → Proposal → Won). Executive está por definir: ¿son las entradas directas a
    SQL, las cuentas que atiende un KAM, o ambas? Además hace falta una regla para quien cambia de puerta, como
    un Self Service que pide demo. Todas las puertas se juntan en un mismo hito de compra (Won, primer pago o suscripción
    activa, por acordar), con una vista AAARRR común encima. La conversión se mide por grupo de entrada (de los
    que entraron en un mes, cuántos llegan al hito en cierto plazo) y el estancamiento como tiempo en etapa, con
    plazos que se acuerdan con Finora. Lo primero es poder decir por qué puerta y canal entró cada cliente, y eso
