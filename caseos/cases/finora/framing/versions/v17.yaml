research_plan:
- id: RT-001
  question: ¿Qué hipótesis ToFu y BoFu podrían explicar «más leads, pero no más ventas»? ¿Y qué información mínima
    validaría o descartaría cada una (entradas únicas con fecha, señales iniciales, recorrido, atención, vínculo
    con pago)?
  kind: measurement
  agent: measurement
  intensity: L2
  work: propuesta
  draft_answer: 'Las ordenaría por la parte del motor donde pegan. En ToFu: la entrada total no creció tanto como
    New (H-001), la mezcla cambió hacia gente que compra menos o más tarde (H-002), o bajó la calidad de la máquina
    de leads (H-005). En medio: la capacidad instalada no alcanza y la atención se demora (H-006). En BoFu: el deterioro
    aparece más abajo, por ejemplo después de SQL (H-007), o cambiaron precio, producto o alternativas (H-008).
    Y aparte está el tiempo: lo reciente todavía no tuvo oportunidad de comprar (H-003, H-004). Cada una se valida
    con un dato que no está en el caso: entradas únicas con fecha y canal, señales al entrar, etapa y fecha por
    lead, carga por SDR/AE y el vínculo lead → primer pago. Con los pagos solo se ve a quien ya compró, así que
    hoy no se puede elegir entre ellas (R-007). La lámina es la matriz hipótesis → dato → qué la valida o la descarta.'
  hugo_said:
  - text: La calidad de la máquina de leads bajó
    ref: H-005
  - text: La capacidad comercial instalada no alcanza la demanda generada
    ref: H-006
  - text: Mucho de eso se responde con propuestas por que no hay data
    ref: D-015
  steps:
  - kind: proposal
    what: Árbol de hipótesis sin huecos ni traslapes (ToFu, capacidad/atención, BoFu y tiempo), amarrado a H-001…H-008,
      con H-005 y H-006 como ramas en tus palabras.
    where: []
  - kind: proposal
    what: 'Para cada hipótesis: dato mínimo, comparación justa (mismo grupo de entrada, misma ventana de maduración),
      qué la valida, qué la descarta y si hace falta un experimento.'
    where: []
  - kind: proposal
    what: 'Inventario consolidado de información mínima (campos y grano: lead, evento de etapa con fecha, dueño,
      puerta/canal, vínculo con el primer pago), que después alimenta la capa técnica de S2.7.'
    where: []
  why: 'Convierte «más leads, pero no más ventas» en hipótesis con el dato que las decide, y la que no tenga dato
    posible sale de la historia (versión mejorada de RT-001: suma S2.6, respuesta de arranque y pasos, sin research
    en data, como pediste).'
  links:
  - Q-001
