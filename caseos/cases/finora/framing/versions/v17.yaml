  situation: 'La data actualmente no alcanza, debemos de responder en la medida de lo posible pero hay cosas que
    no y ahi es donde proponemos y lo dice textualmente el caso: Growth: ¿Cómo definirías y medirías el funnel si
    no todos los clientes lo recorren igual (self-serve, entrada directa a SQL, estancamientos de semanas)?

    ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento? (este si se podría investigar algo en la data)
    ¿Qué métricas propondrías que hoy no existen?

    ¿Qué hipótesis explicarían el fenómeno (demanda, calidad, velocidad de atención, conversión post-SQL) y qué
    datos usarías para validar o descartar cada una?

    Revenue

    Finora cobra suscripciones mensuales cuyo valor puede cambiar con el uso y características de cada cliente.
    Hoy existe un histórico con cliente + mes + monto pagado, y los cambios entre meses se usan para clasificar
    movimientos como crecimiento, contracción, churn o reactivación. Ahora Finora quiere introducir descuentos temporales.

    Si un cliente pagaba 100 y ahora paga 80, ¿contrajo 20 o recibió un descuento? ¿Qué pasa si su suscripción creció
    de 100 a 130, pero tiene un descuento de 30 y sigue pagando 100? ¿Y cuando desaparezca el descuento, eso cuenta
    como expansión?


    Quiero saber qué está pasando con el negocio subyacente y cuánto revenue estamos dejando de capturar por decisiones
    comerciales

    ¿Qué puede y qué no puede responder el modelo actual (cliente + mes + monto pagado)?

    ¿Cómo separarías el valor de la suscripción del precio efectivamente pagado? ¿Qué campos, tablas o definiciones
    agregarías?

    ¿Cómo clasificarías el inicio y el fin de un descuento para que no se confundan con contracción o expansión
    reales?

    Al final queremos poder responder consistentemente

    ¿Por qué cambió nuestro MRR? y ¿cuánto del cambio corresponde al comportamiento del cliente y cuánto a pricing
    o descuentos?


    Mucho de eso se responde con propuestas por que no hay data'
