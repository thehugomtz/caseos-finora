id: H-001
type: hypothesis
statement: New creció, pero otras entradas bajaron. Entonces el total de personas que podrían comprar no creció
  tanto como parecía.
question: ¿New creció más que el total real?
alternative: Sí creció igual el total, y el problema está en quién entra o en lo que ocurre después.
evidence_needed: Todas las entradas únicas de producto y ventas, cuándo llegaron y cómo se identifica a una misma
  cuenta en ambas fuentes. Antes se aclaran duplicados y la diferencia entre entradas nuevas y cuentas acumuladas.
falsifier: Si el total crece menos, corregimos la magnitud de la premisa. Si crece como esperaba el CRO, dejamos
  de usar falta de demanda total como explicación de la menor proporción que compra.
capacity: 'No directamente. Los pagos no muestran todas las entradas y el gasto no nos dice cuántos leads hubo.
  Capacidad actual: 0.'
