id: H-007
type: hypothesis
statement: Con entradas y avance previo comparables, el deterioro aparece después de un punto del recorrido.
question: ¿La fricción está después de SQL o dentro del producto?
alternative: Ese tramo no cambió; la diferencia viene de antes, de la mezcla o del tiempo disponible.
evidence_needed: Pasos reales, tiempos y pérdidas después de SQL para las rutas que pasan por ahí; hitos pertinentes
  de producto para self-serve.
falsifier: Si el tramo posterior está estable, esa ubicación pierde fuerza. Si cae, sabemos dónde mirar, no necesariamente
  por qué ocurre.
capacity: No disponible. No inventar etapas comerciales para personas que no las recorrieron.
