structured: '[BoFu · rebota «conversión post-SQL»] Los prospectos llegan a demo o propuesta, pero eligen otra opción
  o no compran: un cambio de precio o plan, un competidor, o funcionalidad que falta para los tipos de cliente que
  están entrando. Tendría que ser cierto: la caída se concentra en Proposal → Won (después de ver el precio) más
  que en SQL → Demo; baja el win rate (de las propuestas, cuántas se ganan) mientras el ciclo se alarga; suben los
  motivos de pérdida «precio», «competidor» o «falta funcionalidad»; y el momento coincide con un cambio de oferta
  o precio (Q-031, Q-057). Dato mínimo: motivos de pérdida y fechas por etapa en el CRM, e historial de precio y
  plan (Q-043); no está en el caso. Research externo solo si Finora nombra competidores.'
basis: Framer; sin evidencia en el caso
