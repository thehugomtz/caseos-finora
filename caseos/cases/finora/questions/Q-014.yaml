why_it_matters: Puede enfocar la historia y las preguntas de seguimiento. Se activa después de observar un cambio
  material en W2 o W3.
method: Desagregar solo el resultado o componente relevante; conservar la categoría sin industria; mostrar bases
  y contribuciones absolutas. No usar porcentajes de contribución engañosos si el cambio neto es cercano a cero.
deliverable: 'Tabla: industria · base · cambio observado · aporte · cobertura. Debe volver al total.'
close_criteria: Si la cobertura explica el patrón, se corrige. Si no hay concentración clara, se cierra sin clusterizar
  para fabricar un segmento.
front: CRO y CFO
do_not_conclude:
- 'Una causa industrial, un canal o una fase del recorrido: la industria es una segmentación disponible, no un sustituto
  de canal o ruta.'
- Un segmento fabricado por clustering cuando no hay concentración clara.
