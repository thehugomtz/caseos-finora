id: Q-015
type: question
text: ¿Cambió la economía posterior de los nuevos pagadores?
kind: workplan
status: open
alias: W5
priority: P2 · ampliación condicionada
impact: 2
capacity: 2
capacity_level: parcial
why_it_matters: Decide si hace falta matizar el argumento de adquisición con la economía de los pagadores.
method: Comparar cohortes desde la primera transacción a la misma edad y con seguimiento común; pagadores y monto
  observados. Analizar solo cohortes o segmentos que cambien la respuesta.
deliverable: 'Tabla: cohorte · seguimiento disponible · aporte y continuidad de pago por edad · base.'
close_criteria: Si no hay ventana comparable, se declara no respondible. Una diferencia posterior no se convierte
  en prueba de calidad de leads ni de retención contractual.
front: CRO y CFO
do_not_conclude:
- La calidad de los leads a partir de lo que pasa después del pago.
- Retención contractual a partir de la continuidad de pago.
