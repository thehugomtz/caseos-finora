id: Q-017
type: question
text: ¿Qué distinguiría los componentes del valor y la pertenencia recurrente?
kind: workplan
status: open
alias: W7
priority: Brecha crítica · después de W0 y W1
impact: 3
capacity: 0
capacity_level: bloqueada
why_it_matters: 'Enfoca la evolución del razonamiento del CFO sin diseñarla todavía: saber quién entra, sale o permanece
  no identifica qué cambió por suscripción, tarifa o descuento.'
method: Precisar la evidencia de vigencia, características de suscripción, tarifas y descuentos aplicables; identificar
  si el histórico realmente contiene descuentos. No definir un esquema físico ni reglas finales de MRR.
deliverable: 'Matriz: distinción requerida · ambigüedad actual · evidencia mínima · escenario que resolvería.'
close_criteria: Sin componentes explícitos, la prueba conceptual se mantiene separada de la cuantificación real.
  Si el histórico no tuvo descuentos, se retira toda hipótesis que los trate como causa histórica.
front: CFO
do_not_conclude:
- 'Salida real a partir de la ausencia de pago: no convertir ese proxy en churn.'
- 'Ausencia de descuentos a partir de la ausencia de campos: no probar ausencia por falta de dato.'
- Expansión real a partir de una diferencia de monto entre continuos.
- Inicio o fin de un descuento a partir del patrón de pagos solo.
