id: Q-048
type: question
text: ¿El gasto de S&M entra como cuarta fuente de la capa técnica, con unidad, clasificación funcional y, si se
  puede, desglose por motion y canal? Sin eso, los foros mensual (Inversión en Marketing) y trimestral (reparto
  entre Generación de Demanda, Team y Habilitación) de R-019 no tienen base. El archivo actual no documenta unidad
  (R-013, T-005) y en su primer tramo se comporta como una asignación de arriba hacia abajo (T-008, T-021). Además,
  según F-149, mover presupuesto pide experimentos, no solo tablero.
