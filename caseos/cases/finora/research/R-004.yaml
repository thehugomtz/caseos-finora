id: R-004
type: research
research_question: ¿Dónde se concentra el cambio del monto observado?
case_question: ¿Dónde se concentra el cambio del monto observado?
specialty: analytics
intensity: analytics
status: completed
alias: W3
why_it_matters: Da foco económico y distingue la entrada de la base observada. Permite localizar contribuciones,
  condicionado a la semántica y la cobertura; no asigna causas económicas.
short_answer: 'El cambio se concentra en la entrada de pagadores nuevos observados. El puente concilia con el total:
  MRR nuevo COP 94,3 millones, expansión COP 39,8 millones, reactivación COP 86,5 millones, contracción −COP 89,5
  millones y churn −COP 78,0 millones suman el cambio neto COP 53,2 millones. En oct-24 quienes empezaron a pagar
  después de ene-22 aportan COP 68,0 millones del monto pagado total COP 97,0 millones. Es una respuesta parcial,
  limitada a monto observado.'
headline: El cambio se concentra en la entrada de pagadores nuevos observados
answer_states:
- Hecho observado
findings:
- F-047
- F-031
- F-048
- F-049
- F-050
- F-051
what_is_established:
- 'El movimiento del monto observado se asocia con la incorporación de pagadores posteriores a ene-22: el MRR nuevo
  acumulado COP 94,3 millones es la mayor entrada bruta del puente y supera el cambio neto COP 53,2 millones, y
  los clientes activos pasaron de 377 en ene-22 a 1.678 en oct-24.'
- 'La caída del monto por cliente del total, de COP 92,8 mil a COP 57,8 mil, coincide con un recambio de composición:
  la composición de cosechas explica −COP 37,7 mil del cambio y el efecto dentro de las cosechas COP 2,7 mil, mientras
  la base previa a ene-22 pasó de COP 92,8 mil a COP 97,4 mil por cliente.'
- Las ausencias y los retornos mueven magnitudes comparables y se compensan en el neto, con churn −COP 78,0 millones
  frente a reactivación COP 86,5 millones; como señal, el saldo dentro de los pagadores que ya estaban resta, con
  contracción −COP 89,5 millones por encima de la expansión COP 39,8 millones.
what_is_contested: []
what_remains_unknown:
- 'No se puede leer el puente neto como un movimiento poblacional estable: el movimiento bruto COP 404 millones
  supera al cambio neto COP 62 millones en 6,5× y 25,3% del bruto sin altas vuelve exactamente al nivel previo al
  mes siguiente.'
- 'Las etiquetas de ausencia y retorno dependen del criterio de medición: el churn observado pasó de 3,52% en 2022
  a 2,04% en 2024 y el que no vuelve a pagar en el plazo de persistencia pasó de 0,98% a 0,96%, con 32% de los retornos
  liquidando los meses pendientes.'
- 'No se puede generalizar el perfil de quienes dejan de pagar: la razón de medias es 1,5× con intervalo entre 1,3×
  y 1,8× y la razón de medianas es 1,0×, con la brecha concentrada en pocas cuentas grandes.'
- Sin precios de lista, descuento con vigencia, créditos, estado de suscripción ni definición documentada de amount,
  no se atribuye el cambio a movimientos contractuales; tampoco se abrió el reparto del puente por industria ni
  por cosecha de entrada.
cannot_claim:
- Etiquetas contractuales (alta, baja o expansión de suscripción) sin vigencia verificada.
- Descuentos a partir del tamaño de un salto del monto.
- Una lectura del puente si las contribuciones no concilian con el total.
alternative_explanations: []
case_implication: 'El movimiento del monto observado se asocia con la incorporación de pagadores posteriores a ene-22:
  el MRR nuevo acumulado COP 94,3 millones es la mayor entrada bruta del puente y supera el cambio neto COP 53,2
  millones, y los clientes activos pasaron de 377 en ene-22 a 1.678 en oct-24.'
changes_current_story: maybe
affected_hypotheses:
- id: H-020
  alias: HO3
  question: ¿El cambio del monto observado agregado se concentra en la entrada de nuevos pagadores (clientes cuya
    primera aparición de pago ocurre después de ene-22) más que en el cambio dentro de los pagadores continuos?
  state: Soportada
  effect: fortalecida
  reading: En oct-24 los pagadores que empezaron después de ene-22 aportan COP 68,0 millones del total COP 97,0
    millones y el MRR nuevo acumulado COP 94,3 millones supera el cambio neto COP 53,2 millones.
- id: H-020
  alias: HO3
  question: ¿El flujo de MRR nuevo (primeros pagos) es la mayor entrada bruta del puente en el periodo limpio?
  state: Soportada
  effect: fortalecida
  reading: El MRR nuevo COP 94,3 millones es la mayor entrada bruta del puente, por encima de la reactivación COP
    86,5 millones y de la expansión COP 39,8 millones.
- id: H-020
  alias: HO3
  question: ¿Los pagadores continuos (base previa a ene-22 y cosecha 2022) mantienen su monto por cliente, de modo
    que el cambio dentro de continuos no concentra el movimiento?
  state: Direccional
  effect: señal direccional
  reading: La base previa sostiene su monto por cliente, de COP 92,8 mil a COP 97,4 mil, aunque como señal el saldo
    dentro de continuos resta, con contracción −COP 89,5 millones frente a expansión COP 39,8 millones.
- id: H-020
  alias: HO3
  question: ¿Las ausencias (churn observado) y los retornos (reactivación) generan movimiento bruto grande pero
    se compensan entre sí en el neto?
  state: Direccional
  effect: señal direccional
  reading: 'El churn −COP 78,0 millones y la reactivación COP 86,5 millones se compensan, con 44% de los churns
    pagando de nuevo al mes siguiente, aunque la señal depende de la medida: la razón de medias es 1,5× y el churn
    observado pasó de 3,52% a 2,04%.'
- id: null
  alias: rival
  question: ¿El cambio del monto observado está dominado por movimiento bruto que se revierte al nivel previo (timing
    de cobro), de modo que el puente neto no localiza un componente poblacional estable?
  state: Soportada
  effect: fortalecida
  reading: El movimiento bruto COP 404 millones supera al neto COP 62 millones en 6,5× y 25,3% del bruto sin altas
    regresa al nivel previo al mes siguiente, lo que es consistente con timing de cobro.
- id: null
  alias: ''
  question: ¿Se puede atribuir el cambio del monto observado a altas, bajas, expansiones o descuentos contractuales
    con vigencia verificada?
  state: No evaluable
  effect: no evaluable
  reading: Faltan precios de lista, vigencia, créditos y estado de suscripción, además de la definición de amount,
    por lo que la lectura se limita a monto observado.
affected_claims: []
suggested_action: El puente concilia y ubica el cambio en la entrada de pagadores nuevos, así que corresponde probar
  si alguna industria concentra ese recambio de composición.
next_question: W4
new_questions:
- ¿Cómo se reparte el puente del monto observado por industria y por cosecha de entrada, y alguna concentra la contracción
  neta?
- ¿Cuánto cambia el puente si se reclasifican como continuos los clientes que vuelven a pagar dentro del plazo de
  persistencia?
- ¿Qué parte de la contracción corresponde a caídas que se revierten al mes siguiente y qué parte persiste al menos
  un trimestre?
- ¿Qué campos de suscripción, precio de lista y vigencia de descuento permitirían convertir este puente en uno contractual
  auditable?
