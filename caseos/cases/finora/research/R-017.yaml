cos_assessment:
  summary: 'R-017 responde Q-014: la pérdida no es sectorial. Lo que paga en promedio cada cliente cae en las 6
    industrias, con más fuerza en Servicios profesionales, Restaurantes y Retail. El 97% del cambio del ticket de
    entrada ocurre dentro de cada industria. Lo que más pesa es la composición por cosechas (84%) y un ticket de
    entrada más bajo.


    Quedan cuatro cosas para que decidas:

    1) Cerrar H-019 como no soportada por industria y dejar lo de cosechas en H-021.

    2) Cómo reportar la composición: R-009 da 108% con base ene-22 y R-017 da 84% con base dic-22.

    3) Un chequeo corto para saber si «la cosecha 2022 también baja» es real o se debe a pagos iniciales grandes
    (H-021, Q-015).

    4) Antes de decir que «se van los que más pagan» (H-011), medirlo sobre churn persistente. Hoy solo se sostiene
    por promedio y lo explican pocas cuentas.


    La señal de Salud queda como hipótesis, no como hallazgo. Los dos chequeos son cortos y, si te parece, entran
    en lo que delegaste en D-016.'
  run_id: RUN-20260929-110925-cos-5c65
  at: '2026-09-29T11:52:09-06:00'
  impacts:
  - target: Q-014
    effect: supports
    why: 'R-017 responde Q-014 dentro del alcance que ya tenía (industria y pagadores observados). No es sectorial:
      el MRR por cliente cae en las 6 industrias (F-096), con más fuerza en Servicios profesionales, Restaurantes
      y Retail (F-094). El aporte al crecimiento se reparte (F-095) y el 97% del cambio del ticket de entrada ocurre
      dentro de cada industria (F-100). Lo que más pesa es la composición por cosechas (84%, F-097) y un ticket
      de entrada más bajo (F-098). El límite queda escrito: más allá de la industria no se puede evaluar (F-106).
      Dos ajustes menores: la nota de alcance de Q-014 puede sumar cosecha y banda de ticket de entrada, que salen
      de los pagos. Y en la story hay que decir «MRR pagado observado», como pide el framing. Versión ejecutiva
      posible: «No es un tema de un sector: lo que paga en promedio cada cliente cae en las seis industrias, y la
      mayor parte viene de que quienes entraron en 2023–2024 empiezan pagando menos».'
  - target: H-019
    effect: weakens
    why: 'Por industria no hay un subconjunto que explique el cambio. El MRR por cliente bajó en las 6 (F-096),
      aunque con intensidad desigual: de −46,6% en Servicios profesionales a −14,4% en Salud (F-094). El aporte
      al crecimiento se reparte (F-095) y el 97% del cambio del ticket de entrada ocurre dentro de cada industria
      (F-100). Esto refuerza el «No soportada» que ya venía de R-005. Pero si «grupos» incluye cosechas, la composición
      por cosechas explica 84% (F-097) y H-019 pasaría a soportada. La respuesta depende de qué entendemos por grupo,
      y hoy eso no está definido.'
  - target: framing
    effect: changes_framing
    why: 'La cifra de composición depende de desde cuándo se mide. R-009 asigna 108% a la composición de entrada.
      Su descomposición (F-075) va de ene-22 a oct-24 (−COP 35,0 mil), la misma ventana con la que R-012 reproduce
      las cifras del Overview (−38%, 4,5×, 2,8×). R-017 asigna 84% entre dic-22 y oct-24 (F-097: −COP 31,7 mil,
      −35%). Con la base cambia también el matiz: R-009 dice «no en la base previa» y R-017 dice «la cosecha 2022
      también baja». No se contradicen del todo porque hablan de grupos distintos, pero en láminas seguidas parecen
      mensajes opuestos y el CFO vería dos cifras para el mismo claim. La dirección, que la composición es lo que
      más pesa, se sostiene en las dos bases.'
  - target: H-021
    effect: requires_research
    why: 'H-021 (agente: No soportada) lee la diferencia entre cosechas como fijada en la entrada, en línea con
      R-006 («concentrado en la entrada»). R-017 lo respalda en lo grueso: composición 84% (F-097) y ticket de entrada
      más bajo (F-098). Pero también ve bajar a la cosecha 2022 dentro de la ventana (efecto dentro de −COP 5,2
      mil) y advierte que su ticket de entrada incluye pagos iniciales grandes. Si esa baja es real, hay diferencias
      después de la entrada y H-021 se acercaría a soportada. Si es el paso de un primer pago grande al pago recurrente
      (F-085, F-086), no. R-017 no compara las cosechas a igual edad, así que no permite decidirlo.'
  - target: Q-015
    effect: requires_research
    why: R-017 no mide a igual edad. Aporta la composición por cosechas (84%) y la señal de que la cosecha 2022
      también baja, que puede ser real o deberse al primer pago. Se resuelve con el mismo chequeo de H-021, así
      que no abro una segunda alerta.
  - target: H-011
    effect: requires_research
    why: 'H-011 es de la rama CFO (HF2a): habla de clientes que salen y de su valor antes de descuentos. R-017 solo
