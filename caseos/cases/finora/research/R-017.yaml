task:
  work: datos
  draft_answer: 'Lo investigado (R-005 y R-009, todavía sin aceptar) dice que la industria no parece ser el eje:
    el patrón aparece difundido, y la caída del MRR por cliente activo viene de quién entra, no de la base previa.
    Mi arranque: la pérdida se concentra más en el ticket de entrada (pagadores de ticket bajo en las cosechas 2023
    y 2024) que en una industria. La matriz de burbuja (churn observado × ticket × volumen por industria) va a servir
    más para ubicar dónde vale la pena crecer que para explicar la caída. Todo esto es sobre pagadores observados,
    no sobre leads ni canal, y si no hay concentración clara no inventamos grupos.'
  hugo_said:
  - text: ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento? (este si se podría investigar algo en
      la data)
    ref: D-015
  steps:
  - kind: data
    what: 'Cruzar bandas de ticket de entrada (primer pago por cuartiles) × cosecha × industria: cuántos pagadores
      nuevos y cuánto monto trae cada banda, y cómo cambió la mezcla. Extender R-005 y R-009 sin rehacerlos.'
    where:
    - mart.new_customers
    - mart.vintage_month
  - kind: data
    what: Churn observado y regresos por industria, cosecha y banda de ticket de entrada, con un tamaño mínimo por
      celda para no leer ruido.
    where:
    - mart.churn_events
    - mart.customer_month
    - mart.new_customers
  - kind: data
    what: 'Matriz de burbuja por industria sobre la ventana fijada en RT-003: tasa de churn observado, MRR por cliente
      activo y clientes activos.'
    where:
    - mart.customer_month
    - mart.churn_events
  - kind: proposal
    what: 'La vista de S2.4 (matriz o tabla de concentración) con su límite de lectura: pagadores observados, no
      leads ni canal, y sin inventar grupos si no hay concentración clara.'
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: ''
short_answer: 'La pérdida no es sectorial: se concentra en cosechas y ticket de entrada. El MRR por cliente activo
  cae en las industrias observadas, con caídas mayores en Servicios profesionales, Restaurantes y Retail. La descomposición
  ubica la concentración en la composición de cosechas, que explica 84% del cambio del MRR por cliente activo entre
  dic-22 y oct-24. Como señal, Salud aparece con menor churn persistente, mayor ticket mediano de 2024 y menor volumen'
headline: 'La pérdida no es sectorial: se concentra en cosechas y ticket de entrada'
what_is_established:
- 'No hay un sector único donde se concentre la pérdida: el MRR por cliente activo bajó en las 6 industrias, aunque
  con intensidad desigual, y el aporte al crecimiento también se reparte.'
- La señal apunta a las cosechas recientes y a un ticket de entrada más bajo, con caída de la mediana y de la cola
  alta; a la vez la cosecha 2022 también baja, así que no se limita a las altas nuevas.
- 'El cambio del ticket de entrada 2022 a 2024 no viene de vender a industrias distintas: el efecto dentro de las
  industrias explica 97% del cambio.'
- En promedio quienes hacen churn pagaban más, pero por mediana no, de modo que la diferencia se concentra en pocas
  cuentas grandes; el churn observado por industria tampoco marca un sector único.
- Como señal, Salud combina el menor churn persistente, el mayor ticket de entrada mediano de 2024 y el menor volumen,
  con 124 clientes activos en oct-24; Tecnología acompaña con menor caída del MRR por cliente.
- 'No es evaluable si la pérdida se concentra en un tipo de cliente más allá de la industria observada: faltan tamaño
  de cliente, segmentación adicional, precios, descuentos y motivos de churn.'
what_is_contested: []
what_remains_unknown:
- 'No es evaluable con estos datos si la pérdida se concentra en un tipo de cliente más allá de la industria observada:
  faltan tamaño de cliente, segmentación adicional, precios, descuentos y motivos de churn.'
- 'La lectura del churn caro depende de la medida: por mediana quienes hacen churn no pagaban más, de modo que la
  diferencia de promedios se concentra en pocas cuentas grandes.'
- Las comparaciones por industria se apoyan en `amount` como monto cobrado, no como MRR contractual, y el ticket
  de entrada de 2022 incluye pagos iniciales grandes.
alternative_explanations: []
case_implication: Si la caída del ticket de entrada ocurre dentro de cada industria y no por mix, convendría revisar
  la política de precio y el empaquetado de las altas de forma transversal. Si Salud sostiene el menor churn persistente,
  el mayor ticket mediano de 2024 y solo 124 clientes activos en oct-24, podría convenir una prueba de asignación
  comercial hacia ese segmento.
