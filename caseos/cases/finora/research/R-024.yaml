task_why: Es la única parte de C-011 que se puede hacer hoy con los datos del caso. Sin ella, el paso 2 se contrasta
  sobre una brecha que puede estar inflada o desinflada por cómo se cuenta. Se apoya en RT-003 para saber qué meses
  están completos; aquí el foco es el conteo de nuevos.
task:
  work: datos
  draft_answer: 'Con los pagos se acota solo la mitad del paso 1, la de pagadores; la de leads (conteo, registro
    CRM, no-prospectos) necesita el CRM. De arranque: el −19% de jul–oct 2024 (H-029) es la cifra más expuesta a
    borde o rezago. La meseta 2023→2024 (54,2 → 55,4 por mes, F-078) depende menos de octubre, pero sí de si las
    reactivaciones cuentan como nuevos (H-037) y de IDs que cambian (H-024). El resultado fija sobre qué brecha
    se contrastan las causas; no dice nada de leads ni de conversión.'
  hugo_said: []
  steps:
  - kind: data
    what: 'Octubre-24 frente a los meses previos: pagadores, filas y monto. Repetir jul–sep 2024 contra jul–sep
      2023, sin octubre (Q-036).'
    where:
    - raw.transactions
    - mart.monthly_metrics
  - kind: data
    what: 'Altas y reactivaciones por mes: contar «clientes nuevos» con y sin reactivaciones y ver si su peso se
      movió entre 2022 y 2024 (H-037).'
    where:
    - mart.customer_month
  - kind: data
    what: 'Reapariciones con otro ID: salidas observadas y primeras apariciones cercanas que coinciden en industria
      y monto, sobre todo alrededor de ene-23 (H-024).'
    where:
    - mart.customer_month
    - raw.industry
  - kind: proposal
    what: 'Brecha limpia: tabla con cuánto mueve cada artefacto el conteo de primeros pagadores observados y qué
      queda para el paso 2. Lo que no se puede acotar sin CRM va como pedido a Finora.'
    where: []
