workspace_run_started: INV-20260929-143800-2198
why_it_matters: ''
short_answer: 'Los artefactos quedan acotados: el estancamiento de altas sigue siendo señal contrastable. Al excluir
  el último mes observado, las altas por mes de 2024 son 56 frente a 54 en 2023, así que el cierre de la serie no
  arrastra la lectura hacia abajo. Las reactivaciones se registran en un flujo aparte, donde también aparecen los
  retornos del churn observado. Queda señal para contrastar contra causas de negocio'
headline: 'Los artefactos quedan acotados: el estancamiento de altas sigue siendo señal contrastable'
what_is_established:
- 'Las altas por mes pasan de 27 en 2022 (mar–dic) a 54 en 2023 y 55 en 2024 (ene–oct): hay un escalón y después
  un nivel plano. La pendiente posterior, +0,47 por mes con intervalo entre −0,40 y +1,33, es una señal sin dirección
  distinguible.'
- El último mes observado registra 50 altas frente a un promedio de 55 altas por mes en 2024 (ene–oct), con clientes
  activos en 1.678 contra 1.645 el mes anterior, y el panel mantiene 1.961 filas cliente-mes con MRR pagado de COP
  97,0 millones. Excluir ese mes deja las altas por mes de 2024 en 56 frente a 54 en 2023.
- Con el mes final excluido, las altas por mes de 2024 son 56 frente a 54 en 2023; incluyéndolo son 55. El nivel
  plano se sostiene bajo ambas lecturas y queda disponible para contrastar contra causas de negocio.
- Hay 0 meses-cliente marcados a la vez como alta y reactivación y 0 altas con un pago anterior registrado; las
  reactivaciones suman 468 eventos en un flujo aparte. De 751 eventos de churn observado, 44% vuelve a pagar al
  mes siguiente bajo el mismo identificador y se registra en ese flujo de reactivaciones.
- Las reactivaciones por mes son 17 en 2022 (mar–dic), 12 en 2023 y 16 en 2024 (ene–oct), frente a 27, 54 y 55 altas
  por mes. Sumarlas o separarlas deja 2023 y 2024 en el mismo orden, aunque el peso relativo es mayor en 2022.
- No es posible verificar si un cliente nuevo corresponde a un negocio que ya pagaba bajo otro identificador. El
  panel trae identificador de cliente, industria, mes y monto, y faltan estado de suscripción, fuente del lead y
  motivo de salida.
- En 2023, 175 de 650 altas coinciden en monto exacto e industria con el último pago de un churn reciente, frente
  a 196 altas bajo un emparejamiento placebo con churns muy posteriores. La coincidencia es consistente con azar
  de montos repetidos más que con reaparición; los retornos identificables ya viven en el flujo de reactivaciones.
what_is_contested: []
what_remains_unknown:
- 'No podemos afirmar ni descartar que un cliente nuevo sea un negocio que ya pagaba bajo otro identificador: el
  panel no trae estado de suscripción, fuente del lead ni motivo de salida.'
- 'El proxy de coincidencia por monto e industria no permite cuantificar reapariciones: su lectura es direccional
  y sensible a montos extremos y a la concentración en pocas cuentas.'
- El churn observado incluye pausas y atrasos, de modo que las salidas y los retornos registrados no equivalen a
  cancelaciones ni a clientes recuperados.
alternative_explanations: []
case_implication: Si se reporta la serie de altas hacia adelante, convendría publicarla con el mes final marcado
  como preliminar y con las reactivaciones en una línea aparte, dado que altas y reactivaciones ya son flujos separados.
  Si el nivel plano de altas va a contrastarse contra causas de negocio, convendría abrirlo por industria y por
  cohorte, ya que las altas por mes de 2024 son 56 frente a 54 en 2023 al excluir el mes final.
