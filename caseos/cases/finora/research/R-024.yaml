new_questions:
- ¿El nivel plano de altas aparece en todas las industrias o solo en las que más aportan MRR nuevo?
- ¿Las altas recientes se sostienen igual en los primeros meses de vida que las del periodo inicial, o el nivel
  plano esconde una caída de calidad?
- ¿Cómo se comporta el gasto comercial por cliente nuevo dentro del periodo plano frente al del escalón?
- ¿Qué parte del churn observado que vuelve a pagar corresponde a pausas de facturación y cómo cambiaría la lectura
  de altas netas si se tratara como continuidad?
