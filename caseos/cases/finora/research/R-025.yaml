task_why: Reformula RT-001 (ya investigada en R-010). El caso da cuatro explicaciones que mezclan causas con un
  lugar del funnel. Sin más causas que compitan o se encadenen, y sin saber qué dato las separa, S2.6 queda como
  una lista y la columna «Decision Making» de S2.7 sigue vacía (N-027).
task:
  work: propuesta
  draft_answer: 'Leo C-011 como orden de lectura. Paso 1, acotar artefactos antes de leer cualquier tasa: cambio
    en cómo se cuentan o reparten los leads (H-027), registro del CRM (H-051), entradas que no son prospectos (clientes
    actuales, duplicados, spam), rezago o borde de octubre-24 (H-029), reactivaciones contadas como nuevas (H-037)
    e IDs que cambian (H-024). Con los pagos solo se acotan los de pagadores; los de leads necesitan el CRM. Paso
    2, causas según dónde viven: ToFu —demanda, calidad definida al entrar (H-005) y ventas que cambiaron de puerta—;
    MoFu —velocidad de atención, capacidad comercial instalada (H-006), el SDR elige a quién trabajar (H-028), SQL
    inflados por metas del SDR y estancados sin seguimiento—; BoFu —la conversión post-SQL es el lugar; detrás pueden
    estar SQL inflados, capacidad del AE u oferta, precio o competencia—; después del cierre —Won que no llega a
    pagar—. Mi hipótesis de trabajo es una cadena, no una causa ganadora: la prueba se hace por cohorte de entrada
    con plazo fijo, buscando la primera etapa que pierde conversión, y cada causa se amarra a la palanca del CRO
    que movería. Todo es hipótesis: el caso no trae datos de funnel.'
  hugo_said:
  - text: hay que generar más causas potenciales, por lo menos 3-5 más y definir que datos tendrian que ser ciertos
      para validar o descartar cada una
    ref: N-044
  - text: tal vez añadir un reactivate que son los que dicen que están estancados pero hay formas de reactivarlos
      y asignarlos a…
    ref: N-038
  steps:
  - kind: proposal
    what: 'Tabla de causas: las cuatro del caso rebotadas, las seis nuevas de este turno y las que ya están en el
      ledger. Para cada una: familia (paso 1 · ToFu · MoFu · BoFu · después del cierre), qué tendría que ser cierto
      para validarla, qué la descarta, dato mínimo, si está en el caso o hay que pedirlo a Finora, y qué palanca
      del CRO movería.'
    where: []
  - kind: data
    what: 'Paso 1 del lado de pagadores, lo único que se puede hacer hoy: octubre-24, reactivaciones contadas como
      nuevas e IDs que cambian (lo corre la tarea de datos nueva de este turno). Los datos del caso no traen leads,
      etapas ni canal: ninguna causa del paso 2 se prueba con ellos.'
    where:
    - mart.customer_month
    - mart.monthly_metrics
    - raw.transactions
  - kind: proposal
    what: 'Extracto único para los dos pasos: por lead, fecha de creación y origen (incluida la entrada directa
      a SQL), dueño y fecha de cada etapa, motivo de descalificación y de pérdida, e ID de cuenta que se una con
      facturación y con el registro en producto; más el historial de metas o comisiones de SDR/AE y de precio o
      plan.'
    where: []
  - kind: proposal
    what: 'Prueba de cadena: por cohorte de entrada con plazo fijo, encontrar la primera etapa donde cambia la conversión
      y comparar cómo cambian en el tiempo (no su nivel) las entradas directas a SQL frente a los SQL del SDR. Salida:
      qué causas quedan en juego y qué palanca del CRO toca cada una, para la columna «Decision Making».'
    where: []
requested_via: vía Claude (delegado por Hugo en el chat, 29-sep 14:05, D-017)
why_it_matters: 'Define qué dato separa cada causa y, con eso, qué palanca se le propone al CRO y al CFO: corregir
  la medición, redirigir gasto, sumar capacidad o SLA, o corregir la oferta o el cobro. Sin ese orden se puede terminar
  pagando la palanca equivocada.'
short_answer: 'Con lo que hay no se puede validar ni descartar ninguna causa del funnel: el modelo no trae leads
  ni CRM, solo pagos y gasto. Lo que sí muestran los pagos: la caída de primeros pagadores es de jul–oct 2024 (−19%),
  después de un ene–jun que creció +29%. No la explican ni octubre incompleto, ni las reactivaciones, ni reapariciones
  con otro ID, y se concentra en Retail+Producción. Propongo 17 causas en el orden de C-011 (7 artefactos, 3 ToFu,
  4 MoFu y 3 BoFu/después del cierre), cada una con qué tendría que ser cierto y qué la descarta. Confianza alta
  en los hechos de pagos y media en el marco.'
