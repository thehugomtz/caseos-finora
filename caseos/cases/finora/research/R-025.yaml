  title: Serie mensual de primeros pagadores, reactivaciones, churn y gasto S&M
  url: ''
  publisher: CaseOS · modelo de datos Finora
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT month, window_flag, active_customers, new_customers, reactivated_customers, churned_customers, demand_gen_spend,
    sales_capacity_spend, enablement_spend, total_sm_spend, median_new_customer_mrr_cop FROM mart.monthly_metrics_phase1
    ORDER BY month
  verified: true
- id: DM-2
  title: Primeros pagadores y reactivaciones por año en mar–oct, jul–sep y jul–oct; gasto de mar–oct
  url: ''
  publisher: CaseOS · modelo de datos Finora
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT SUBSTR(month,1,4) AS anio, SUM(CASE WHEN SUBSTR(month,6,2) BETWEEN '03' AND '10' THEN new_customers
    ELSE 0 END) AS nuevos_mar_oct, SUM(CASE WHEN SUBSTR(month,6,2) BETWEEN '03' AND '10' THEN reactivated_customers
    ELSE 0 END) AS react_mar_oct, SUM(CASE WHEN SUBSTR(month,6,2) BETWEEN '07' AND '09' THEN new_customers ELSE
    0 END) AS nuevos_jul_sep, SUM(CASE WHEN SUBSTR(month,6,2) BETWEEN '07' AND '10' THEN new_customers ELSE 0 END)
    AS nuevos_jul_oct, SUM(CASE WHEN SUBSTR(month,6,2) BETWEEN '03' AND '10' THEN demand_gen_spend ELSE 0 END) AS
    demand_gen_mar_oct, SUM(CASE WHEN SUBSTR(month,6,2) BETWEEN '03' AND '10' THEN sales_capacity_spend ELSE 0 END)
    AS capacidad_mar_oct FROM mart.monthly_metrics_phase1 GROUP BY SUBSTR(month,1,4) ORDER BY anio
  verified: true
- id: DM-3
  title: 'Primeros pagadores por ventana 2023–2024: industria, M0 y pago en M1'
  url: ''
  publisher: CaseOS · modelo de datos Finora
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT CASE WHEN cohort_month BETWEEN '2023-07' AND '2023-10' THEN 'jul-oct 2023' WHEN cohort_month BETWEEN
    '2024-07' AND '2024-10' THEN 'jul-oct 2024' WHEN cohort_month BETWEEN '2023-01' AND '2023-06' THEN 'ene-jun
    2023' WHEN cohort_month BETWEEN '2024-01' AND '2024-06' THEN 'ene-jun 2024' END AS ventana, COUNT(*) AS altas,
    SUM(CASE WHEN industry IN ('Retail','Producción') THEN 1 ELSE 0 END) AS retail_produccion, SUM(CASE WHEN industry='Restaurantes'
    THEN 1 ELSE 0 END) AS restaurantes, SUM(CASE WHEN industry IN ('Tecnología','Servicios profesionales','Salud')
    THEN 1 ELSE 0 END) AS tec_serv_salud, ROUND(AVG(m0_cop)) AS m0_prom, SUM(CASE WHEN m1_cop IS NOT NULL AND m1_cop
    = 0 THEN 1 ELSE 0 END) AS sin_pago_m1, SUM(CASE WHEN m1_cop IS NULL THEN 1 ELSE 0 END) AS m1_no_observado FROM
    mart.new_customers WHERE cohort_month BETWEEN '2023-01' AND '2024-10' GROUP BY 1 ORDER BY 1
  verified: true
- id: DM-4
  title: Primeras apariciones de ene-23 que coinciden (industria y monto) con salidas sin retorno de nov–dic-22
  url: ''
  publisher: CaseOS · modelo de datos Finora
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT n.customer_id, n.industry, n.m0_cop, c.customer_id AS churn_id, c.month AS churn_month, c.prev_mrr_cop,
    c.months_to_return FROM mart.new_customers n JOIN mart.churn_events c ON c.industry = n.industry AND c.prev_mrr_cop
    = n.m0_cop AND c.month IN ('2022-11','2022-12') AND c.months_to_return IS NULL WHERE n.cohort_month = '2023-01'
    ORDER BY n.industry, n.m0_cop
  verified: true
- id: DM-5
  title: 'Jul–oct 2023 vs 2024: nuevos, reactivaciones, peso de reactivaciones y gasto'
  url: ''
  publisher: CaseOS · modelo de datos Finora
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT SUBSTR(month,1,4) AS anio, SUM(new_customers) AS nuevos_jul_oct, SUM(reactivated_customers) AS react_jul_oct,
    SUM(new_customers)+SUM(reactivated_customers) AS entradas_a_pago, ROUND(100.0*SUM(reactivated_customers)/(SUM(new_customers)+SUM(reactivated_customers)),1)
    AS pct_react, SUM(demand_gen_spend) AS demand_gen, SUM(sales_capacity_spend) AS capacidad, SUM(total_sm_spend)
