research_question: ¿Qué causas potenciales —las cuatro que trae el caso (demanda, calidad, velocidad de atención,
  conversión post-SQL) y al menos 3–5 más— podrían explicar «más leads, pero no más ventas», en el orden de C-011
  (primero artefactos de medición, después causas ToFu y BoFu)? ¿Qué tendría que ser cierto en los datos para validar
  o descartar cada una?
case_question: 'Q-016: la evidencia mínima para distinguir las explicaciones del CRO. Sirve a Q-001 y Q-021 y sigue
  el orden de C-011.'
