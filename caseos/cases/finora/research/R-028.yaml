new_questions:
- ¿Cómo queda el puente de MRR completo si los huecos cortos se tratan como continuidad de pago y los montos con
  firma de liquidación de atrasos se reparten entre los meses cubiertos?
- ¿Qué queda de la caída del MRR por cliente activo si la contracción persistente se separa de la que se reversa
  al mes siguiente?
- ¿Las interrupciones cortas se concentran en ciertas industrias, cosechas o meses del calendario, de modo que apunten
  a un ciclo de facturación y no a comportamiento de clientes?
- ¿Cuál es el churn y la reactivación si la baja se define solo cuando el cliente no vuelve a pagar en el trimestre
  siguiente, aplicado mes a mes a todo el periodo?
