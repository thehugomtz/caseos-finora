task:
  work: propuesta
  draft_answer: 'Reformula RT-023 (R-023). R-023 asignó Executive a cuentas nombradas o de KAM y leyó Reactivate
    como cuentas que ya pagaron; Hugo define Executive como el funnel actual SDR→AE y Reactivate como leads estancados
    que se reactivan y se asignan a un funnel. De arranque: la puerta se fija al entrar y quién mueve cada tramo
    decide la ruta. Executive = todos los tramos los mueve SDR/AE, incluida la entrada directa a SQL con etapa de
    entrada SQL. Self Service = ningún tramo con persona, con su canal de entrada. Hybrid = tramos con y sin persona
    (A: empezó solo y lo intervinieron abajo; B: lo contactaron como New y terminó solo). Reactivate es un loop
    sobre leads estancados: umbral de días sin actividad por etapa (Q-064), reactivación y reasignación a una de
    las tres rutas, sin contar como entrada nueva y conservando su fecha. La vuelta de clientes que dejaron de pagar
    es otro loop, del lado Revenue. De R-023 sirve: la cuenta como unidad, el episodio, la puerta fija al entrar
    y el primer pago como nudo.'
  hugo_said:
  - text: recordemos que el funnel actual es New / Working SDR / Engaged SDR / SQL SDR / Demo Account Executie /
      Proposal Account Executive / Won /// ese es el punto de partida
    ref: N-033
  - text: el de ejecutivos ya está bien definido y te lo acabo de pasar
    ref: N-034
  - text: Hybrid que se refiere que en alguna parte del funnel fuepor Self Service y en algun otro fue intervenido
      por una persona (pudo haber empzado hasta arriba y ser intervenido abajo, o pudo ser contactado como new y
      el solito lo acabó, hay que bajar bien esa definición)
    ref: N-037
  - text: tal vez añadir un reactivate que son los que dicen que están estancados pero hay formas de reactivarlos
      y asignarlos a un funnel de acuerdo al caso
    ref: N-038
