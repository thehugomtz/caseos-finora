  file: slides/15.html
  claim_id: C-012
  role_in_story: recommendation
  kicker: "Growth · hipótesis ToFu y BoFu · propuesta"
  headline: "Calidad y capacidad se separan con mezcla contra tasa, dentro de cada puerta"
  takeaway: "Cada hipótesis deja una firma distinta: calidad mueve la mezcla con la velocidad quieta; capacidad mueve carga y espera con la mezcla quieta."
  question: "¿Cómo se sabe si falta capacidad comercial o si bajó la calidad de la máquina de leads?"
  relationship: "two hypotheses leave DIFFERENT SIGNATURES across the same three indicators (base period → drop period)"
  evidence_type: comparison
  composition: signature_small_multiples (2 hipótesis × 3 indicadores, pendientes esquemáticas)
  family: comparison
  alternatives_considered:
    - id: tabla de firmas con flechas
      score: {fidelity: 2, focal: 1, evidence: 2, variety: 1, risk: 0}
      rejected_because: "flechas en celdas son una tabla; la pendiente dibujada se lee de un vistazo"
    - id: decision_tree
      score: {fidelity: 2, focal: 2, evidence: 2, variety: 1, risk: 0}
      rejected_because: "S14 y S23 ya son árboles; aquí el punto es comparar dos patrones"
