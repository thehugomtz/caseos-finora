  data: {source: "propuesta (C-012); esquema ilustrativo sin cifras", values: []}
  notes: "Hoy no se puede separar H-005 (calidad) de H-006 (capacidad): faltan entradas, reps y tiempos de contacto (F-120). No usamos Self Service como grupo de control (X-012). La capacidad también puede estar en el AE (X-153). Ambas a la vez = H-028. El gasto de Team no mide capacidad."
  sources: [F-121, F-122, F-124, F-120, F-159, F-231, F-232]
