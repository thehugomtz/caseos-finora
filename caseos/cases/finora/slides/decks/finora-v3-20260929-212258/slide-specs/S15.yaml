    2: las pendientes quietas (gris)
    3: si pasan ambas: interacción
    4: dato mínimo y límite de lo observado
  objects:
    - {id: signatures, kind: path, content: "2 columnas × 3 filas de pendientes base → caída"}
    - {id: both, kind: text, content: "si pasan ambas, apunta a las dos a la vez"}
    - {id: data_min, kind: text, content: "dato mínimo"}
  encodings:
    slope: "dirección del indicador entre el periodo base y el de la caída (esquema, sin datos)"
