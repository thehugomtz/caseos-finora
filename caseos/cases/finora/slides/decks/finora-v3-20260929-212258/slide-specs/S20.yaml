slide:
  id: S20
  file: slides/20.html
  claim_id: C-017
  role_in_story: recommendation
  kicker: "Revenue · cómo introducir descuentos · propuesta"
  headline: "El descuento se registra como objeto propio, con origen, source y fecha de fin"
  takeaway: "Cada peso de descuento se sigue desde su origen y canal hasta su línea «Descuento» del puente, separado de lo contratado."
  question: "¿Cómo se registra un descuento según su origen y cómo pega en el puente?"
  relationship: "every discount is TRACED from its origin and channel to its bridge line; digital and physical CONVERGE on the same object with a different source; the contract runs SEPARATE"
  evidence_type: process
  composition: lineage_flow (sankey-lite izquierda → derecha) + separate_contract_lane
  family: process
  alternatives_considered:
    - id: diagrama entidad-relación
      score: {fidelity: 2, focal: 1, evidence: 3, variety: 2, risk: -2}
      rejected_because: "las llaves esconden el recorrido del peso de descuento"
    - id: tabla de casuísticas
      score: {fidelity: 1, focal: 1, evidence: 2, variety: 0, risk: 0}
      rejected_because: "no muestra que todos los orígenes llegan al mismo objeto"
  chosen_score: {fidelity: 3, focal: 3, evidence: 2, variety: 3, risk: -1}
  focal_point: grant
  visual_hierarchy:
    1: discount_grant (lima) donde convergen los cinco orígenes
    2: orígenes y su atribución (source)
    3: aplicación → foto de cierre → línea del puente
    4: carril separado de lo contratado y casuísticas especiales
  objects:
    - {id: origins, kind: node, content: "Promoción digital · Promoción física · Negociado · Retención · Partner"}
    - {id: attribution, kind: node, content: "promotion → promo_code (UTM, landing, QR) → promo_redemption; acquisition_touch para todo cliente"}
    - {id: grant, kind: node, content: "discount_grant: tipo, valor, duración, vigencia pactada y real, alcance, apilamiento, motivo, aprobación, un origen"}
    - {id: application, kind: node, content: "discount_application por línea de factura"}
    - {id: snapshot, kind: node, content: "foto de cierre: lista · contratado · descuento · neto · facturado · cobrado"}
    - {id: bridge_line, kind: node, content: "«Descuento (inicio)» / «Descuento (fin)» con su origen"}
    - {id: contract_lane, kind: path, content: "subscription_item_version: solo cambia con subscription_change_event"}
  encodings:
    x_position: "etapa del recorrido del descuento"
    connectors: "trazabilidad del peso de descuento"
    dashed_outline: "objetos propuestos (no existen hoy)"
    mono: "nombres de tablas"
    accent: "el objeto propio del descuento"
  annotations:
    - {at: bridge_line, text: "Nunca Expansión ni Contracción"}
    - {at: bottom, text: "Retención con downgrade → Contracción real · Mes gratis → descuento total, no churn · Pausa → estado, no descuento · Apilados → una línea por grant"}
  layout_intent:
    grid: "orígenes cols 1–3; atribución cols 3–4; grant cols 5–7; aplicación/foto cols 8–10; puente cols 11–12"
    reading_path: "izquierda → derecha; carril de contrato abajo"
    whitespace: "entre orígenes"
  text_budget: 130
  must_show: [la relación de la intención visual]
  avoid: ["tabla", "cinco cards de origen", "ERD completo"]
  data: {source: "propuesta (R-034); ejemplos ilustrativos, no datos de Finora", values: []}
  notes: "No afirmamos que hubo descuentos en el histórico: diseño hacia adelante. No sabemos si Finora captura hoy el source en el alta de todos los clientes (H-073). Sin la regla «precio especial = lista + descuento», negociados, partner y retención quedarían como precio menor (H-074)."
  sources: [F-233, F-234, F-235, F-236, F-237, F-150, F-152, F-153, F-154, F-174]
