audience:
- 'CEO: contexto de salud general del modelo (Overview) antes de Growth y Revenue. Qué decide todavía no está definido.'
- 'CRO: cómo definir, medir y operar el funnel en un modelo híbrido, y qué podría explicar más leads sin más clientes
  nuevos.'
- 'CFO: cómo introducir descuentos temporales sin perder la respuesta a «¿por qué cambió nuestro MRR?»: mecanismo,
  modelo de datos y clasificación.'
objective: 'BORRADOR 4 para el deck de 5 minutos (N-055 a N-061, D-026). En Overview van C-001 y una lámina nueva
  que junta lo mejor de C-002, C-003 y C-004 y cierra conectando con Growth. En Growth van, en este orden: C-021
  con la nota clave de C-005; una lámina nueva sobre cómo se mide cada funnel (sale de R-036 y usa tus definiciones
  de Hybrid B y Reactivate, que R-035 había cambiado); C-007; una lámina nueva con las métricas que hoy no existen,
  que incluye eficiencia y dice por qué proponemos cada una; C-023; una lámina nueva con el dato que valida o descarta
  cada hoja del árbol, en el mismo orden; y C-014 con la línea sobre cuenta común e historial de etapas. En Revenue
  van C-015, C-024, C-017, C-019 (que ya integra la regla de C-020) y C-025. Todo lo que sale de la presentación
  pasa a anexos. C-016 queda fuera porque la rechazaste. funnel-medicion y metricas-nuevas dependen de findings
  propuestos (F-243 a F-252). Quedan pendientes de aceptación, tuya o bajo tu delegación D-027, y el paquete no
  puede marcarse Ready hasta entonces.'
