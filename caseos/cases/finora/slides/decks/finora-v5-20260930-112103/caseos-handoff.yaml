  key: modelo-escalera
  question: ¿Cómo separar el valor de la suscripción del precio efectivamente pagado, y cómo clasificar el inicio
    y el fin de un descuento para que no se confundan con contracción o expansión reales?
  headline: La Propuesta de Modelo de datos separa el valor en una escalera con vigencias
  answer: 'Proponemos una escalera de valor por suscripción y mes, cada peldaño con su fuente y su vigencia: tarifa
    de lista, precio pactado (plan, cantidad y add-ons), descuento con inicio, fin y motivo, MRR neto recurrente,
    facturado y cobrado. El MRR bruto y el neto se clasifican comparando cierres de mes sobre lo contratado y el
    descuento; lo facturado y lo cobrado son caja y nunca generan movimientos de MRR, solo un efecto de cobro, y
    el monto pagado de hoy queda como capa observada que se concilia contra lo cobrado. Regla de clasificación:
    si la suscripción no cambia, el inicio o el fin de un descuento va a una línea propia «Descuento» y no es contracción
    ni expansión; si cambian suscripción y descuento el mismo mes, primero se calcula el efecto de la suscripción
    con los términos de descuento del mes anterior y el resto va a «Descuento»; a quien sale con descuento se le
    registra churn, no fin de descuento. Las reglas que son decisiones de negocio (base lista o neto del puente,
    mes gratis, pausa, descuento único, tarifa en línea propia) se escriben antes de construir.'
