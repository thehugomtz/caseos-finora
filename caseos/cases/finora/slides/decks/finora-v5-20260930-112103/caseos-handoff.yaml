- claim_id: C-007
  key: perdida-cosechas
  question: ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento?
  headline: La pérdida está en el monto por cliente de cosechas de menor ticket
  answer: 'La pérdida no es sectorial: entre dic-22 y oct-24 el MRR pagado observado por cliente activo baja en
    las 6 industrias, con caídas de −46,6% en Servicios profesionales, −45,6% en Restaurantes y −43,1% en Retail,
    frente a −18,8% en Producción, −15,5% en Tecnología y −14,4% en Salud. Se concentra en las cosechas: la base
    previa sostiene su monto (COP 97,0 mil por cliente en dic-22 y COP 97,4 mil en oct-24), mientras las cosechas
    2023 y 2024 llegan a oct-24 con COP 46,3 mil y COP 43,0 mil por cliente y ya son 34,0% y 31,2% de los activos.
    La descomposición asigna el cambio sobre todo a esa composición de cosechas; el efecto dentro de las cosechas
    es menor y se concentra en la cosecha 2022 (de COP 81,0 mil a COP 65,4 mil por cliente) y en las altas de feb-22
    (de COP 85,8 mil a COP 69,9 mil). El menor ticket de entrada ocurre dentro de cada industria y no por el mix
    de industrias, y el churn persistente casi no se mueve (0,98% en 2022 y 0,96% en 2024) aunque el observado baje
    de 3,52% a 2,04%.'
