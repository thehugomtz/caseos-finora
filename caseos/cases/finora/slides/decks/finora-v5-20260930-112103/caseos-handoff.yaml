    la ventana. Después, en este orden: primero los artefactos (el aumento de New no es demanda nueva comprable:
    no-prospectos y duplicados, un cambio de definición o la misma demanda que llega por otra puerta); luego la
    mezcla (calidad al entrar, ToFu, medida solo con señales congeladas al crear el lead); luego la caída antes
    del SQL (capacidad y tiempo a primer toque, leads estancados en Working o Engaged); luego la caída después del
    SQL (incentivos del SDR, decisión en Proposal, oferta o precio, BoFu); y al final el cobro (Won que no llega
    al primer pago). Demanda, calidad, velocidad de atención y conversión post-SQL quedan como explicaciones a contrastar,
