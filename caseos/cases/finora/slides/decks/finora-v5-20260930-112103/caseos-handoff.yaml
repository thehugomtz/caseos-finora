- claim_id: C-021
  key: funnel-etapas
  question: ¿Qué etapas recorre cada ruta, por qué canal entra y quién es dueño de cada tramo?
  headline: Cada ruta usa las etapas del Executive que le aplican, por canal y con dueño
  answer: 'Proponemos una lista maestra, la del Executive (New → Working SDR → Engaged SDR → SQL SDR → Demo AE →
    Proposal AE → Won), y que cada ruta use solo las etapas que le aplican, con saltos permitidos y el canal como
    atributo de la entrada. El outbound del SDR recorre la lista completa, el inbound de «hablar con ventas» salta
    Working SDR y la entrada directa a SQL arranca en SQL. Self Service va New → Signup Self → Activated Self →
    Checkout Self → Won; Hybrid A arranca en producto y después suma etapas de SDR/AE, e Hybrid B arranca con SDR/AE
    y cierra por Checkout Self. Dueños propuestos: SDR hasta SQL, AE desde Demo, y Growth o Producto en los tramos
    sin persona. La ruta se clasifica al cierre según quién movió cada tramo: solo cuenta como intervención la interacción
    de ida y vuelta con SDR/AE, y el formulario de «hablar con ventas» es la entrada, no un tramo. Reactivate es
    un loop sobre estancados que conserva fecha y puerta, no una ruta más. Nota rescatada de la lámina de rutas:
    la puerta queda fija al entrar y es la única base para comparar tasas, porque la ruta se define por lo que pasó
    y eso sesga, por construcción, la conversión de Hybrid.'
