limitations:
- Churn y MRR observados necesitan una regla de normalización y una ventana de gracia antes de llamarse así (F-136).
- Cliente activo = pago mayor que cero en el mes. Un cliente sin pago puede estar cancelado, en pausa o atrasado
  (F-082).
- 'Comparar entradas directas a SQL contra SQL del SDR no es un experimento: solo sirve ver cómo cambia cada grupo
  en el tiempo, y sigue siendo asociación.'
- Comparar la conversión de Hybrid con la de Self Service o Executive es asociación, no el aporte de la intervención
  (H-050).
- Comparar tocados contra no tocados asigna crédito, no efecto; la palanca de capacidad pide experimento (F-159).
- 'Comparar tocados contra no tocados en los híbridos asigna crédito, no prueba efecto: hace falta holdout (F-251,
  H-050).'
- 'Composición no es causa: no separa tipo de cliente, plan, tarifa ni descuento (F-093).'
- Con la regla resumida, «¿quién cerró?» puede dejar sin ruta entradas que iniciaron con persona y no cierran en
  la ventana (H-078).
- Con los pagos solo se acotan los artefactos del lado de pagadores; los del lado de leads necesitan el CRM.
- Cómo se reparte el término cruzado entre mezcla y tasa es una regla a fijar antes de ver resultados.
- El 44% dice que vuelve a pagar, no con qué monto (X-102, X-145).
- 'El S&M por alta está en unidad reportada, sin escala a COP: no es CAC (F-137). Un CAC combinado depende de documentar
  la unidad del gasto y de acordar qué es adquirir un cliente.'
- El churn observado de 2024 no coincide entre T-034 y T-002; falta fijar el periodo (X-099, X-101).
- El detalle de C-002, C-003 y C-004 queda en anexo.
- El efecto dentro de la cosecha 2022 puede ser real o reflejar pagos iniciales grandes de 2022 (H-042, X-062).
- 'El escalón de inicios de 2023 puede ser en parte registro (H-024) u operación (H-025, H-068): sin confirmar.'
- El gasto está en unidad reportada, sin escala a COP (F-063), y Team queda fijo en 12% hasta may-23 (F-066). La
  asociación negativa en niveles no es efecto (F-119, F-219).
- El peso de la composición depende de la base (dic-22 o ene-22); la dirección no cambia y la base la decides tú
  (X-060).
- 'El peso de la composición depende de la base: 84% con dic-22 y 108% con ene-22. La dirección no cambia y la base
  la decides tú (X-060).'
- El puente por capas (lista, descuento y neto) no es construible con los datos del caso (F-168).
- 'El revenue que dejamos de capturar no tiene cifra histórica: el histórico no trae tarifas ni descuentos; se mide
  hacia adelante.'
- 'El revenue que dejamos de capturar no tiene cifra histórica: se mide hacia adelante.'
- El ticket estabilizado sigue siendo monto pagado y no sigue bajando en 2024 (F-161).
- 'El árbol reordena las ramas del CRO de D-001: la calidad pasa a leerse como mezcla al entrar (X-150). Pendiente
  de tu decisión.'
- 'El −38% no se presenta como deterioro de la salud: todavía no se separan la mezcla de entrada, el precio y las
  salidas.'
- 'El −38% no se presenta como deterioro de la salud: todavía no separa la mezcla de entrada, el precio y las salidas.'
- 'Es el tercer catálogo del caso (R-031, R-035, R-036): falta consolidarlo en uno (X-170).'
- Es monto pagado observado (campo amount con escala fija), no MRR contratado (F-082).
- Es monto pagado observado, no MRR contratado.
- 'Es monto pagado observado: no hay precio de lista, plan, descuento ni crédito (F-093).'
- 'Es monto pagado observado: sin estado de suscripción, periodo de servicio ni fecha de factura, el puente normalizado
  exacto no es medible, solo se acota (F-186).'
- 'Es propuesta, como pide el guion: hoy no se puede validar ni descartar ninguna hoja, y del cobro solo se ve el
  arranque (F-230).'
- 'Es propuesta: el histórico no trae tarifas ni descuentos y no se afirma que hubo descuentos; el caso habla de
  introducirlos.'
- 'Es propuesta: hoy el modelo es cliente × mes × monto pagado y no separa suscripción, tarifa, descuento ni momento
  de cobro (F-130).'
- 'Es propuesta: hoy no se puede calcular ninguna métrica propia de funnel (F-248, F-223).'
- 'Es propuesta: ninguna hoja tiene hoy su dato en el caso (F-230, F-126).'
- 'Es propuesta: ninguna métrica propia de ruta se calcula hoy y ninguna métrica común se puede cortar por ruta
  (F-146).'
- 'Es propuesta: qué decide el CRO en cada foro aún no está definido por Finora.'
- Es stock con ventana completa desde ene-22; los flujos arrancan en mar-22 (F-074).
- 'Es una propuesta: el caso no trae CRM ni etapas, y hoy no se puede medir ninguna etapa antes del primer pago
  ni la puerta (F-223, F-191).'
- 'La atribución reparte crédito, no prueba causa: para decidir presupuesto hacen falta experimentos (F-144, F-149).'
- La convención de cómo pega el descuento en el MRR la decide el CFO (F-151).
- La convención de cómo pega el descuento en el MRR la decide y declara el CFO; la propuesta se aparta del default
  del mercado (F-236).
- 'La descomposición va sin montos: sus totales no están como celda en ninguna tabla del claim; no agregarlos en
  la lámina (corrección D-026).'
- La huella de un descuento temporal limpio casi no aparece en el histórico; eso es consistente con que los descuentos
  sean algo por introducir, pero no prueba que no existieran (F-134).
- 'La industria es la única segmentación disponible: no sustituye al canal ni a la ruta.'
- 'La industria es la única segmentación disponible: no sustituye al canal ni a la ruta. La señal de Salud (C-008)
  va en anexo, a validar.'
- La premisa «no más ventas» depende de la ventana que se compare (F-125, F-229).
- 'La prueba de la contracción solo mira el mes siguiente: no descarta cobros de primer pago o de reactivación que
  caen en la contracción (X-100).'
- 'La regla de «Descuento» es convención, no hecho: se aparta del default del mercado y el CFO la declara (F-236,
  F-151).'
- La relación entre descuento y clientes de menor valor es evidencia externa, no dato de Finora; se mide con cohortes
  marcadas y un grupo comparable (F-154).
- La ventana fija, el nudo común (Q-050) y el umbral de estancamiento (Q-064) son parámetros a acordar con Finora,
  no estándar de mercado.
- La vuelta de pagadores es un loop de Revenue, no el Reactivate del CRO (F-213).
- La vuelta de pagadores que se ve en pagos es un loop de Revenue, no Reactivate (F-213).
- La «reactivación» del modelo actual es retorno de pago de clientes, no el Reactivate de leads (F-252).
- Las causas candidatas (metas o comisiones de SDR/AE, precio, competencia) no tienen evidencia en el caso.
- 'Las decisiones del CRO a las que se atan las métricas son propuesta: Finora aún no las define.'
- Las etapas del AE (Demo, Proposal) y la entrada por referido o partner están por confirmar contra el CRM de Finora.
- Las firmas de cobro son lecturas de patrón, no confirmación de atraso o prepago (F-136).
- Las medianas del segundo pago son de las altas con segundo pago (T-062); los porcentajes son sobre todas las altas
  (T-054, T-055).
- Las reglas que son decisiones de negocio quedan por escribir antes de construir (F-241).
- 'Lo que no se capture desde ya no se reconstruye: el to-be mide hacia adelante, salvo que Finora tenga historial
  (F-242).'
- Los agentes van encima de métricas gobernadas, no en la base, y entran con piloto controlado (F-149).
- 'Los casos son los ejemplos del enunciado del CFO: prueban qué distingue el modelo, no describen lo que pasó en
  Finora.'
- Los ejemplos de clasificación son ilustrativos, no datos del caso.
- No sabemos qué parte de la capa técnica ya existe en los sistemas de Finora; no se afirma que Finora tenga un
  problema de CRM o analítica digital (H-076).
- No sabemos si Self Service existe como compra sin humano, ni si hay prueba gratis, freemium o pago al registrarse
  (Q-046).
- No se infieren descuentos del tamaño de un salto del monto.
- 'No se puede repartir la caída por cliente entre un precio de lista distinto y un descuento: ambos coinciden en
  el mismo monto observado (F-177).'
- 'Pendiente de aceptación: F-244, F-248, F-249, F-250, F-251 y F-252 están propuestos (R-035, R-036), tuya o bajo
  D-027.'
- 'Pendiente de aceptación: F-246, F-247, F-249 y F-252 están propuestos (R-035, R-036).'
- 'Pendiente de tu aceptación: F-071, F-072, F-001, F-002 y F-074 están propuestos.'
- Primer pago observado no es adquisición ni precio de entrada.
- Primer pago observado no es adquisición. Won, primer pago o suscripción activa siguen por acordar (X-052).
- 'Que el caso no traiga canal ni etapas no prueba que Finora no los registre: parte puede estar en su CRM, aunque
  no siempre con historia (F-128, H-076).'
- 'Quienes hacen churn pagaban más en promedio, pero no en mediana: la diferencia se concentra en pocas cuentas
  grandes (F-101, F-102).'
- Qué cuenta como intervención (Q-063) y el umbral de estancamiento por etapa (Q-064) son parámetros a acordar con
  Finora, no estándares de mercado.
- 'Qué vista aplica (MRR neto, revenue o caja) depende de si los contratos son mensuales cancelables o a plazo fijo:
  falta confirmarlo (F-153).'
- R-035 usa otras definiciones de Hybrid B y Reactivate; esta lámina sigue las tuyas (R-036).
- Se sabe qué evidencia confirmaría cada componente; no se sabe si Finora la tiene (F-133).
- Si el source no se captura para todos los clientes, el código de descuento quedaría como la única atribución (H-073).
- 'Una caída después del SQL no es por sí sola un problema del AE: puede nacer antes del traspaso (SQL inflados)
  o en la oferta.'
- Una entrada que pide persona y que nadie atiende termina como Self Service con bandera (H-072).
- Usa tus definiciones de Hybrid B y Reactivate. R-035 las había cambiado y aquí no se usa esa versión.
- Ventana de deduplicación, SLA y umbral de estancamiento son parámetros a acordar con Finora, no estándar de mercado.
