guion:
- id: S1
  title: Overview
  purpose: 'Situación (Overview): Finora suma clientes mucho más rápido que monto pagado (4,5× vs 2,8×; ~−38% por
    cliente activo, periodo por fijar). Esa brecha abre Growth y Revenue.'
  slides:
  - id: S1.1
    title: Overview
    question: ''
    intent: observaciones generales y salud del negocio que introducen las secciones siguientes (p. ej. clientes
      4,5× vs ingreso 2,8×; MRR por cliente activo −38%)
    notes: Migrado de Entregables del brief.
    links: []
- id: S2
  title: Growth
  purpose: 'Growth, lo que sí vemos: los primeros pagadores observados y su actividad económica por industria, y
    el gasto de Marketing por categoría en el tiempo, descritos sin atribuir ventas al gasto.

    Growth, lo que no vemos: no todos recorren el funnel igual (propuesta: Assisted, Self Service, Executive). Demanda,
    calidad, capacidad/atención y post-SQL quedan como explicaciones a contrastar, cada una con el dato que permitiría
    elegir.

    Growth, cómo operarlo: primero definiciones y fuentes comunes; después, seguimiento recurrente por foros (dashboards,
    análisis ad hoc, agentes), atado a decisiones del CRO que aún no están definidas.'
  slides:
  - id: S2.1
    title: Las relaciones que comentó Hugo
    question: ''
    intent: las relaciones que comentó Hugo (por precisar)
    notes: Migrado de Entregables del brief (L1).
    links: []
  - id: S2.2
    title: Entradas y actividad económica de clientes y segmentos
    question: ''
    intent: 'Revisar entradas y actividad económica de clientes y segmentos; inversión de S&M por categoría (generación
      de demanda ToFu: Paid Media y publicidad no web · Team: Payroll Expenses y Travel · habilitación, ¿producto?:
      Software Tools y Freelance) y hasta dónde se puede relacionar con ventas cruzando fechas'
    notes: Migrado de Entregables del brief (L2).
    links: []
  - id: S2.3
    title: Cómo definir y medir el funnel si no todos lo recorren igual
    question: ¿Cómo definir y medir el funnel si no todos lo recorren igual?
    intent: 'cómo definir y medir el funnel si no todos lo recorren igual (self-serve, entrada directa a SQL, estancamientos
      de semanas): Assisted / Self Service / Executive, con canales (incl. digital, WoM, clientes que no requirieron
      KAM), funnel propuesto, AAARRR, conversion rate y métricas clave, aqui se tiene que hacer un research alrededor
      del modelo de negocio y estructurar la propuesta'
    notes: Migrado de Entregables del brief (L3).
    links: []
  - id: S2.4
    title: Dónde y en qué segmentos se concentra la pérdida de crecimiento
    question: ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento?
    intent: 'dónde y en qué segmentos se concentra la pérdida de crecimiento (industria, churn, low tickets, mix;
      quizá una matriz de burbuja: industrias de bajo churn, ticket alto y poco volumen)'
    notes: Migrado de Entregables del brief (L4).
    links: []
  - id: S2.5
    title: Qué métricas propondrías que hoy no existen
    question: ¿Qué métricas propondrías que hoy no existen?
    intent: qué métricas propondrías que hoy no existen (MRR, ARR, ARPU, CAC, LTV, Churn, UCM) y cómo medirlas,
      robustecerlo y bajar lo que tenga sentido
    notes: Migrado de Entregables del brief (L5).
    links: []
  - id: S2.6
    title: Hipótesis ToFu y BoFu
    question: ''
    intent: Definir que hipótesis ToFu y BoFu (demanda, calidad, velocidad de atención, conversión post-SQL; p.
      ej. la capacidad comercial instalada no alcanza la demanda generada, la calidad de la máquina de leads bajó)
      podrían estar afectando su motor de acuerdo a su problema definido y qué datos validarían o descartarían cada
      una, aqui no hay que hacer research en data es una propuesta
    notes: Migrado de Entregables del brief (L6).
    links: []
  - id: S2.7
    title: Solución analítica para que el CRO opere el funnel de forma recurrente y qué decisiones le permite tomar
    question: ''
    intent: 'solución analítica para que el CRO opere el funnel de forma recurrente y qué decisiones le permite
