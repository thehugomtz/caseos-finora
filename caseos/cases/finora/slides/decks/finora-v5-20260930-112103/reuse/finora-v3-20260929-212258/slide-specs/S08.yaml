  question: "¿Hay industrias de bajo churn, ticket alto y poco volumen que valga la pena mirar?"
  relationship: "industries are POSITIONED by persistent churn vs entry ticket, sized by base; Salud TRADES volume for retention and ticket"
  evidence_type: two_variable
  composition: bubble_matrix
  family: comparison
  alternatives_considered:
    - id: harvey por industria
      score: {fidelity: 2, focal: 2, evidence: 2, variety: 1, risk: 0}
      rejected_because: "tres columnas de bolitas no muestran el trade-off en un plano"
    - id: barras ordenadas por churn
      score: {fidelity: 1, focal: 2, evidence: 2, variety: 1, risk: 0}
      rejected_because: "una dimensión sola no aísla a Salud"
  chosen_score: {fidelity: 3, focal: 3, evidence: 3, variety: 3, risk: -1}
  focal_point: salud_bubble
  visual_hierarchy:
    1: burbuja de Salud en lima, arriba a la izquierda
    2: Restaurantes (mismo ticket, mucha más base)
    3: las otras cuatro industrias
    4: rango estrecho del churn observado
  objects:
    - {id: salud_bubble, kind: marker, content: "Salud · 0,56 · COP 52,5 mil · 124 clientes"}
    - {id: others, kind: marker, content: "Restaurantes, Servicios profesionales, Tecnología, Producción, Retail"}
  encodings:
    x_position: "churn persistente 2024 (pp mensuales, no vuelve a pagar en un trimestre)"
    y_position: "ticket de entrada mediano 2024 (COP mil)"
    area: "clientes activos oct-24 (r ∝ √n)"
    accent: "Salud"
  annotations:
    - {at: salud_bubble, text: "Salud: menor churn persistente (0,56), ticket mediano más alto (COP 52,5 mil, igual que Restaurantes) y 124 clientes frente a 459"}
