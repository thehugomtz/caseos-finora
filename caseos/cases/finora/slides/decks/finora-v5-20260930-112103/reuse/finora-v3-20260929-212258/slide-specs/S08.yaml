  notes: "Con pocos clientes por industria las medianas se mueven con pocas altas. Salud es la excepción del tramo 2022→2023: su ticket baja recién en 2024 (F-165). En 2024 el churn observado va de 1,46 a 2,57: rango estrecho."
  sources: [F-104, F-099, F-103, F-105, F-165]
