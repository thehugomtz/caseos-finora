- file: 13.html
  request: 'Hugo pidió reencuadrar esta lámina a su idea o ponerle un ribbon con ella. Pon un ribbon (banda destacada,
    el foco de la lámina) con su idea de volumen y tiempo. Sus palabras: «al detectar las variaciones por fecha
    y estas características se puede comenzar a inferir el problema por evolución y volumetría»; «lo que sí puedo
    ver es relaciones de volumetría y temporalidad de todas las etiquetas que se pongan»; «empezando por un reetiquetado
    del CRM del histórico se podría empezar a ver todo esto». Texto propuesto: «Con cada etiqueta fechada (fuente,
    dominio, puerta, etapa), el volumen y el tiempo de cada una muestran dónde y cuándo cambió la brecha · Primer
    paso: reetiquetar el histórico del CRM». Puede reemplazar la banda actual «Prueba más rápida: etiquetar desde
    el CRM, hacia atrás, a los pagadores ya observados», que dice lo mismo; conserva que es hacia atrás y sobre
    los pagadores ya observados.

    Además, Hugo no entendió las filas Mezcla, Antes del SQL, Después del SQL y Cobro («no entiendo»). Reescribe
    la columna «Firma y dato mínimo» en lenguaje simple, máximo dos líneas por fila:

    - Artefactos: leads con fecha, fuente y dominio, cruzados con clientes y leads previos: repetidos, no-prospectos
    y el volumen de cada etiqueta en el tiempo.

    - Mezcla (ToFu): cómo era cada lead al crearse (fuente, segmento, tamaño), no lo que Ventas opinó después: ¿entran
    más de los que siempre convierten poco?

    - Antes del SQL: cuánto tarda el primer contacto, cuántos leads carga cada SDR y cuántos llevan semanas sin
    avanzar.

    - Después del SQL (BoFu): cuántos SQL acepta el AE según quién los generó, y por qué se pierden, preguntado
    a los compradores.

    - Cobro: cada Won ligado a su primer pago: cuántos ganados nunca pagan.

    La columna «¿En el caso? no» se queda. Si no cabe todo, la línea «El gasto de S&M no sirve de proxy…» puede
    irse al pie.'
