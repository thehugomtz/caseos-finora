    compacta, su definición en una línea, sin quitar las firmas:

    - Churn observado: pagaba el mes anterior y este mes paga 0, sobre los activos; no es cancelación confirmada.
    Persistente: no vuelve a pagar en 3 meses (T-002).

    - Reactivación: había dejado de pagar y vuelve a pagar.

    - Expansión / contracción: pagó los dos meses y este paga más / menos; la diferencia suma o resta.

    Si cabe, el cuadre del puente: MRR inicial + altas + expansión − contracción − churn + reactivación = MRR final.'
