    1. Volumen y tasa. Hoy: «¿Volumen o tasa? Antes de pedir SDR/AE o gasto». Hugo: «No me queda claro lo que puso
    el agente». Quiere decir: saber si faltan leads (volumen) o si entran pero no avanzan (tasa) antes de pedir
    más SDR/AE o más gasto. Propuesta: «¿Faltan leads o no avanzan? Saberlo antes de pedir más SDR/AE o gasto».

    2. Capacidad. Hoy: «Separar capacidad de calidad». Hugo: «Separar capacidad de calidad sí, pero ¿para qué?».
    Falta el para qué: si un lead no avanza porque nadie lo atendió a tiempo (capacidad) se arregla con gente, SLA
    o priorización; si no iba a comprar (calidad), con a quién se le habla. Propuesta: «¿No avanzan por falta de
    atención o porque no iban a comprar? Se arreglan distinto».

    3. Estancamiento: queda como está («Qué tramo y qué dueño arreglar primero»).

    4. Valor y calidad. Hoy: «A qué puerta ponerle persona». Hugo: «No me queda claro lo que dice el agente». Quiere
    decir: la puerta es por dónde entró el lead (outbound del SDR, «hablar con ventas», SQL directo o registro en
    el producto); con el MRR inicial y la retención de cada puerta se decide dónde conviene que intervenga un SDR/AE
    y dónde dejarlo en Self Service. Propuesta: «En qué puertas de entrada conviene que intervenga un SDR/AE y cuáles
    dejar en Self Service».

    5. Eficiencia. Hoy: «Repartir el S&M entre rutas y canales». Hugo lo dice «asignación de presupuestos entre
    canales y funnels». Propuesta: «Repartir el presupuesto de S&M entre rutas y canales, según cuánto cuesta ganar
    un cliente y en cuánto se recupera».'
