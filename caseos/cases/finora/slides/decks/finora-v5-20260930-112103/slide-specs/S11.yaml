  question: "¿Qué dato valida o descarta cada hoja del árbol, y lo tenemos hoy?"
  relationship: "each branch of the tree (same order) is MATCHED with its signature and minimum data; none EXISTS in the case today"
  evidence_type: comparison
  composition: match_rows (rama ↔ dato mínimo ↔ ¿en el caso?) + fastest_test
  family: comparison
  alternatives_considered:
    - id: tree_repeated_with_data_leaves
      score: {fidelity: 2, focal: 1, evidence: 2, variety: 0, risk: -2}
      rejected_because: "repetir el árbol de la lámina anterior con más texto en cada hoja no cabe y no deja ver el «no» común"
    - id: harvey_matrix (hoja × fuente)
      score: {fidelity: 2, focal: 2, evidence: 2, variety: 2, risk: -1}
