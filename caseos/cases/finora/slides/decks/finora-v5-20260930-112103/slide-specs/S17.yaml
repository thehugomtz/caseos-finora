  question: "¿Cómo separar el valor de la suscripción del precio efectivamente pagado, y cómo clasificar el inicio y el fin de un descuento?"
  relationship: "value STEPS DOWN from list to collected; each monthly movement is LOCATED on the step where it is born; MRR vs cash are SEPARATED"
