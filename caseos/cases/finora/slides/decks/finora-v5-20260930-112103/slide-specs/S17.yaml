  composition: staircase (dónde nace cada movimiento) + rule_strip
  family: economics
  alternatives_considered:
    - id: entity_diagram (tablas y llaves)
      score: {fidelity: 2, focal: 1, evidence: 2, variety: 2, risk: -2}
      rejected_because: "para el CFO la escalera cuenta la idea; el diagrama de tablas es anexo técnico"
    - id: decision_tree_only (C-020)
      score: {fidelity: 2, focal: 2, evidence: 2, variety: 1, risk: 0}
      rejected_because: "la regla sola pierde dónde vive cada peldaño; va en la franja inferior y el árbol completo en anexo"
