id: H-008
type: hypothesis
statement: Cambios de producto, precio, condiciones o alternativas afectan la elección aunque intención inicial
  y atención sean parecidas.
question: ¿Cambió la oferta o una alternativa que el cliente compara?
alternative: El problema se explica mejor por mezcla, atención o recorrido, sin un cambio de oferta relevante.
evidence_needed: Cambios de condiciones con fecha y señales de clientes que expliquen su decisión; corroborar las
  razones declaradas.
falsifier: Si no hay señales que lo sostengan, no dedicar tiempo a investigar el mercado en general. Si aparecen,
  precisar una pregunta externa concreta.
capacity: Pendiente y aparcada por defecto. Sólo se activa si aparece evidencia interna que la haga importante.
priority: Aparcada por defecto
