id: H-012
type: hypothesis
statement: Los clientes que salen ya pagaban menos por descuentos; el ingreso que desaparece es distinto del valor
  sin descuento.
question: ¿Tenían descuentos antes de salir?
alternative: No tenían descuentos; la diferencia tiene otro origen o es un error de comparación.
evidence_needed: Descuentos vigentes antes de la baja y su relación con la suscripción que terminó.
falsifier: Si se confirma, ese descuento pertenece al cálculo de esa salida. No se cuenta como fin de descuento
  de un cliente que permanece.
capacity: 'No hay evidencia de descuentos en las fuentes descritas. Capacidad: 0.'
