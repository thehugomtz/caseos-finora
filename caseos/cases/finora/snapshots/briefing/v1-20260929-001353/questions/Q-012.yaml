id: Q-012
type: question
text: ¿Qué cambió en los primeros pagadores observados?
kind: workplan
status: open
alias: W2
priority: P1 · evidencia acotada
impact: 3
capacity: 2
capacity_level: parcial
why_it_matters: Da contenido empírico al resultado pagado que el CRO sí puede observar, sin resolver causas. La
  capacidad es parcial respecto de la adquisición real.
method: Reutilizar las series de primeras apariciones y aporte inicial; elegir la comparación que justifica la cobertura;
  separar nivel, cambio absoluto y relativo. Verificar otra comparación razonable solo si la conclusión depende
  de la ventana.
deliverable: 'Tabla: periodo · primeros pagadores observados · aporte inicial · cobertura · cambio.'
close_criteria: Si el resultado cambia por historia, IDs o meses parciales, se corrige o limita antes de interpretar.
  Aunque aumente o caiga, no se afirma conversión de leads.
front: CRO
do_not_conclude:
- 'Nada sobre conversión de leads o del funnel: los pagos no incluyen a quien no compró.'
- Que la primera aparición sea el hito de adquisición del CRO (Won, primer pago o suscripción activa siguen por
  acordar).
