suggested_action: El menor primer pago de las altas pide ubicar dónde se concentra el cambio del monto antes de
  ampliar a industria o economía posterior.
next_question: W3
new_questions:
- ¿Qué definición del hito de adquisición (primer pago, contrato ganado o suscripción activa) acuerda el equipo
  comercial?
- ¿Los nuevos pagadores de menor aporte inicial sostienen su monto en los meses siguientes al primero?
- ¿En qué industrias se concentra el tramo de menor aporte inicial de las nuevas altas?
- ¿El escalón de inicios de 2023 coincide con un cambio en la operación comercial o en la forma de registrar el
  primer cobro?
