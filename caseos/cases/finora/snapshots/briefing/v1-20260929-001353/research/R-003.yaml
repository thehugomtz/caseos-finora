id: R-003
type: research
research_question: ¿Qué cambió en los primeros pagadores observados?
case_question: ¿Qué cambió en los primeros pagadores observados?
specialty: analytics
intensity: analytics
status: completed
alias: W2
why_it_matters: Da contenido empírico al resultado pagado que el CRO sí puede observar, sin resolver causas. La
  capacidad es parcial respecto de la adquisición real.
short_answer: 'Más primeras apariciones de pago, con un primer pago menor. Entre los periodos comparables, las primeras
  apariciones de pago por mes subieron y la mediana de su primer pago bajó; el cambio se mantiene al igualar la
  ventana mar–oct. El volumen y el valor inicial incorporado no se mueven a la misma velocidad: el MRR nuevo por
  mes quedó por debajo del de 2022.'
headline: Más primeras apariciones de pago, con un primer pago menor
answer_states:
- Hecho observado
- Evidencia fuerte
findings:
- F-042
- F-043
- F-044
- F-030
- F-045
- F-046
what_is_established:
- 'El menor primer pago de las altas no se limita al promedio: coincide con un nivel más bajo a lo largo de la distribución
  del primer pago entre 2022 y 2024.'
- El aumento de primeras apariciones se concentra en el tramo de menor valor inicial, mientras el tramo de run-rate
  inicial igual o mayor al corte de 2022 se mantiene en un nivel parecido.
- Como señal, el cambio tiene forma de escalón desde inicios de 2023 y no de mes aislado; el tramo posterior no
  muestra una tendencia definida.
what_is_contested: []
what_remains_unknown:
- 'La magnitud del cambio depende de la medida elegida: promedio, mediana y pago del segundo mes se mueven en proporciones
  distintas, y el promedio de 2022 incluye pagos iniciales grandes.'
- Los montos extremos y la concentración en pocas cuentas pueden mover los niveles del primer pago, por lo que el
  nivel exacto observado es frágil.
- La forma de escalón se presenta como señal direccional; el tramo posterior no permite afirmar continuidad ni reversión
  del nivel alcanzado.
- Sin etapas con fechas, atribución, estado de la suscripción ni una definición documentada del monto, no se puede
  leer este cambio como conversión de leads ni ubicarlo en un funnel.
cannot_claim:
- 'Nada sobre conversión de leads o del funnel: los pagos no incluyen a quien no compró.'
- Que la primera aparición sea el hito de adquisición del CRO (Won, primer pago o suscripción activa siguen por
  acordar).
alternative_explanations: []
case_implication: 'El menor primer pago de las altas no se limita al promedio: coincide con un nivel más bajo a
  lo largo de la distribución del primer pago entre 2022 y 2024.'
