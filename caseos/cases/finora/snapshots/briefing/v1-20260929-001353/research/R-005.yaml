affected_claims: []
suggested_action: El descenso aparece tanto en la base activa como en el ticket de entrada dentro de las industrias,
  así que conviene mirar la economía posterior de las altas antes que abrir otro corte transversal.
next_question: W5
new_questions:
- ¿El pico del monto pagado de Restaurantes en dic-22 corresponde a cobros retroactivos o a pagos de varios meses,
  y cómo cambia la lectura al usar el monto usual por cliente-mes?
- ¿La caída del MRR por cliente activo dentro de cada industria aparece en las cosechas de alta recientes, en los
  clientes que ya estaban, o en ambos?
- ¿Alguna segmentación alternativa, como tamaño de cuenta o banda de ticket, agrupa mejor la caída que la industria?
- ¿Cómo se comporta la contribución por industria medida en trimestres consecutivos en lugar de fechas base puntuales?
