id: R-005
type: research
research_question: ¿La industria concentra el cambio observado?
case_question: ¿La industria concentra el cambio observado?
specialty: analytics
intensity: analytics
status: completed
alias: W4
why_it_matters: Puede enfocar la historia y las preguntas de seguimiento. Se activa después de observar un cambio
  material en W2 o W3.
short_answer: 'La industria no concentra el cambio: el patrón aparece difundido. Respuesta parcial: la industria
  no aparece como el eje que concentra el cambio. El MRR por cliente activo bajó en 6 industrias entre dic-22 y
  oct-24 y el ticket de entrada promedio bajó en 6 industrias entre 2022 y 2024, con el efecto dentro de las industrias
  explicando 97% del cambio del ticket. En 2024 el rango de churn observado entre extremos es estrecho.'
headline: 'La industria no concentra el cambio: el patrón aparece difundido'
answer_states:
- Hecho observado
- Evidencia fuerte
findings:
- F-020
- F-011
- F-052
what_is_established:
- El patrón coincide con la base activa y con las altas a la vez, lo que es consistente con un movimiento difundido
  entre industrias más que con un subconjunto que lo concentre.
- Como señal direccional, la lectura de concentración en una sola industria no se sostiene al cambiar la fecha base,
  y en escala de pesos el aporte se reparte entre las 6 industrias con el mismo signo.
- La retención observada no separa industrias en 2024, por lo que priorizar seguimiento por industria en salidas
  aporta poco frente a otras segmentaciones.
what_is_contested: []
what_remains_unknown:
- 'No podemos fijar la magnitud del aporte de Restaurantes: la participación de 52% depende de la base dic-22 y
  cambia al mover la base a jun-22, donde la mayor pasa a Producción con 31%.'
- Las cifras de monto se apoyan en un campo que se comporta como monto cobrado y no como MRR contractual, y el ticket
  de entrada de 2022 incluye pagos iniciales grandes.
- 'La cobertura del corte quedó sin verificación de estado suficiente: la ausencia de categoría sin industria y
  la amplitud de las bases por industria se mantienen como señal direccional.'
- El churn observado incluye pausas y atrasos, y no hay atribución por canal, etapas de funnel, precios, descuentos
  ni motivos de churn; la industria de quienes pagan tampoco informa el mix de la demanda ni sirve para leer leads
  o conversión.
cannot_claim:
- 'Una causa industrial, un canal o una fase del recorrido: la industria es una segmentación disponible, no un sustituto
  de canal o ruta.'
- Un segmento fabricado por clustering cuando no hay concentración clara.
alternative_explanations: []
case_implication: El patrón coincide con la base activa y con las altas a la vez, lo que es consistente con un movimiento
  difundido entre industrias más que con un subconjunto que lo concentre.
changes_current_story: maybe
