id: Q-013
type: question
text: ¿Dónde se concentra el cambio del monto observado?
kind: workplan
status: open
alias: W3
priority: P1 · evidencia acotada
impact: 3
capacity: 2
capacity_level: parcial
why_it_matters: Da foco económico y distingue la entrada de la base observada. Permite localizar contribuciones,
  condicionado a la semántica y la cobertura; no asigna causas económicas.
method: Comparar poblaciones observadas de pago; separar primera aparición de retorno si la historia lo permite;
  cambios de continuos y ausencias. Conciliar al total y no ocultar compensaciones entre contribuciones.
deliverable: 'Tabla: componente observado · aporte al cambio · soporte · supuesto · diferencia de conciliación.'
close_criteria: Si las contribuciones no concilian, no se interpreta. Si se mezclan recurrente y cobro, se limita
  a monto observado. No se clasifican descuentos por el tamaño del salto.
front: CFO
do_not_conclude:
- Etiquetas contractuales (alta, baja o expansión de suscripción) sin vigencia verificada.
- Descuentos a partir del tamaño de un salto del monto.
- Una lectura del puente si las contribuciones no concilian con el total.
