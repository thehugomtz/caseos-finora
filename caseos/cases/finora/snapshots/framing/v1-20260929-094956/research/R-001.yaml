id: R-001
type: research
research_question: ¿Qué podemos nombrar y comparar válidamente?
case_question: ¿Qué podemos nombrar y comparar válidamente?
specialty: analytics
intensity: analytics
status: completed
alias: W0
why_it_matters: 'Desbloquea o recorta W2–W5. Hay alta incertidumbre semántica sobre el monto: fijar qué se puede
  nombrar elimina trabajo mal definido antes de construir precisión sobre él.'
short_answer: 'Solo monto pagado observado y primera aparición observada son comparables. La puerta de interpretación
  no se sostiene: el comportamiento del monto y el del churn observado no permiten nombrarlos como nivel contractual
  ni como salida definitiva. Sí se sostiene una comparación de nivel, porque clientes activos y monto pagado cubren
  el panel sin interrupción. El vocabulario válido queda en monto pagado observado, primera aparición observada
  y churn persistente junto al observado.'
headline: Solo monto pagado observado y primera aparición observada son comparables
answer_states:
- Hecho observado
- Direccional
findings:
- F-032
- F-015
- F-028
- F-034
- F-009
- F-040
what_is_established:
- El vocabulario válido para seguir el caso es monto pagado observado y primera aparición observada; el comportamiento
  del monto es consistente con un dato de cobro y no con un nivel contractual estable.
- En retención conviene reportar el churn persistente junto al churn observado, porque el observado coincide con
  pausas y atrasos y el regreso de clientes aporta una entrada de monto comparable a la de la expansión.
- Se sostiene una comparación de nivel entre los extremos del panel para clientes activos y monto pagado por cliente
  activo, con cobertura sin interrupción; la lectura del ticket de entrada, en cambio, debe declarar la medida usada.
what_is_contested: []
what_remains_unknown:
- 'No se puede distinguir una pausa de una cancelación ni un descuento de un crédito puntual: el panel no trae estado
  de suscripción, precios, descuentos, créditos ni motivos de churn.'
- La serie de gasto comercial no admite comparación en pesos ni cruce con el monto del panel, por falta de escala
  documentada y por señales de construcción de arriba hacia abajo.
- 'No podemos fijar una magnitud única del cambio del ticket de entrada: el resultado depende de la medida elegida.'
- No podemos reconstruir la historia previa de los clientes ya activos al inicio del panel ni de la cohorte marcada
  del segundo mes, cuyo patrón de pago en el primer mes se aparta del de cohortes posteriores.
cannot_claim:
- 'Que el monto sea MRR contratado: mientras la recurrencia no se confirme, se habla de monto pagado observado.'
- 'Que la primera transacción sea la adquisición del cliente: mientras la historia no se confirme, es la primera
  aparición observada.'
- 'Que una comparación sin cobertura completa describa al negocio: se detiene esa comparación.'
alternative_explanations: []
case_implication: El vocabulario válido para seguir el caso es monto pagado observado y primera aparición observada;
  el comportamiento del monto es consistente con un dato de cobro y no con un nivel contractual estable.
changes_current_story: maybe
affected_hypotheses:
- id: H-017
  alias: HG
  question: ¿La interpretación y la cobertura permiten nombrar el monto como MRR y la primera transacción como adquisición,
    y comparar periodos sin distorsiones materiales?
  state: No soportada
  effect: debilitada
  reading: El retorno exacto al nivel previo al mes siguiente y el churn observado que vuelve a pagar coinciden
    con un vocabulario que no admite nombrar el monto como nivel contractual ni la primera transacción como adquisición,
    aun con una comparación de nivel que cubre el panel sin interrupción.
- id: null
  alias: rival
  question: ¿El comportamiento del monto contradice la lectura contractual, de modo que solo se puede nombrar monto
    pagado observado?
  state: Soportada
  effect: fortalecida
  reading: La reversión del movimiento bruto del monto y la firma de ajuste sincronizado con cobro retroactivo son
    consistentes con nombrar el dato como monto pagado observado.
- id: null
  alias: ''
  question: ¿La expansión y la contracción del monto son cambios de nivel duraderos o artefactos de cobro que se
    revierten?
  state: Soportada
  effect: fortalecida
  reading: El desplazamiento de la composición de la expansión hacia ajustes pequeños, el alejamiento respecto de
    la grilla de precios y el tramo de subida que se revierte son consistentes con artefactos de cobro antes que
    con cambios de nivel duraderos.
- id: null
  alias: ''
  question: ¿La primera transacción observada puede leerse como fecha de adquisición del cliente?
  state: No soportada
  effect: debilitada
  reading: La presencia de clientes ya activos al inicio del panel sin historia previa conocida y la sensibilidad
    del ticket de entrada a la medida elegida coinciden con una primera aparición observada que no equivale a adquisición.
- id: null
  alias: ''
  question: ¿El churn observado y la reactivación nombran salida y regreso reales, o pausas y atrasos de cobro?
  state: No soportada
  effect: debilitada
  reading: El retorno al pago tras el churn observado, la liquidación exacta de meses pendientes y el tamaño del
    monto de reactivación frente al de expansión coinciden con pausas y atrasos de cobro antes que con salida y
    regreso reales.
- id: null
  alias: ''
  question: ¿Qué parte de la pregunta de interpretación depende de datos que no existen en el panel?
  state: No evaluable
  effect: no evaluable
  reading: La semántica del campo de monto, el estado de la suscripción, los precios, los descuentos, los créditos
    y los motivos de churn no están en el panel, de modo que esta parte queda fuera de evaluación.
- id: null
  alias: ''
  question: ¿La serie de gasto comercial admite comparación en unidades monetarias y está libre de solapamiento
    entre Team y Payroll?
  state: Direccional
  effect: señal direccional
  reading: La agregación interna del gasto comercial reconstruye el total sin desvío, señal parcial que convive
    con indicios de proporciones fijas, bloques en cero, valores negativos y ausencia de escala documentada.
affected_claims: []
suggested_action: Es el siguiente paso del brief y pone a prueba, con el vocabulario ya acotado a monto pagado observado,
  si ese dato distingue los escenarios planteados.
next_question: W1
new_questions:
- ¿Qué define exactamente el campo de monto y qué estado de suscripción corresponde a cada mes sin pago?
- ¿Qué proporción del monto pagado se mantiene estable durante meses consecutivos como aproximación a un nivel recurrente?
- ¿Cómo cambian las lecturas de retención al adoptar el churn persistente como métrica de cabecera?
- ¿En qué unidad está expresado el gasto comercial y cómo se asignan sus bloques?
