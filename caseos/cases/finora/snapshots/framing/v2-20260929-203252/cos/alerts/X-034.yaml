source: R-018
target: H-020
title: R-018 requiere más investigación H-020
finding_text: 'Estas se pueden calcular hoy, siempre que se nombren tal como son: el MRR (como «MRR pagado observado»
  y su puente de movimientos), el ARPA por cliente (lo que se pide como ARPU; no hay datos por usuario), el churn
  (el observado y, como proxy, uno con ventana de gracia) y la retención e ingreso acu…'
why: 'Hallazgo: los atrasos y los pagos que cubren varios meses inflan el churn, la reactivación y la expansión
  observados (F-136). Por qué importa: H-020 (Direccional) se apoya en el puente de R-004 y T-003, donde el cambio
  se concentra en la entrada de nuevos pagadores. Pero en ese mismo puente la reactivación (COP 86,5 millones) y
  la contracción (−COP 89,5 millones) pesan casi lo mismo que la entrada de nuevos pagadores (COP 94,3 millones).
  El total cuadra; lo que no sabemos es cuánto de esos componentes es solo efecto de las fechas de cobro.'
options:
- key: A
  label: Recalcular el puente con la regla de H-017
  consequence: Recalcular T-003 con la ventana de gracia y el reparto de los pagos que cubren varios meses, al lado
    del puente observado. Dice si «el cambio se concentra en la entrada» se sostiene y cuánto bajan la reactivación
    y la contracción. Depende de que apruebes la regla en H-017.
- key: B
  label: Puente neto por grupo
  consequence: Mostrar solo el neto de entrantes, salientes y continuos (la estructura de D-002) hasta tener la
    regla. Quita las idas y vueltas de un mes sin agregar supuestos, pero pierde el detalle de expansión frente
    a contracción.
- key: C
  label: Dejar T-003 tal cual con una advertencia
  consequence: Rápido, pero el CFO puede leer la reactivación y la contracción como comportamiento real de clientes.
recommended: A
recommended_why: Es el chequeo más pequeño que dice si el hallazgo central de R-004 se sostiene, y reutiliza la
  regla que igual necesitas para el churn. Si en H-017 eliges quedarte en lo observado, aquí la opción es B.
