id: X-051
type: alert
kind: new_hypothesis
status: open
severity: medium
effect: opens_new_hypothesis
source: R-016
target: Q-003
title: R-016 abre una hipótesis nueva Q-003
finding_text: 'No midan un funnel único: midan un bowtie por puertas. Self Service, Assisted y Executive tienen
  cada una sus propios hitos a la izquierda, y todas comparten el mismo nudo (primer pago) y el mismo lado derecho
  (retención, expansión, NRR). Reactivación va aparte como otro tipo de entrada, y AAARRR s…'
why: 'El bowtie le da forma a Q-003. La adquisición (lado izquierdo, por puerta) se une en un solo punto, el primer
  pago, con lo que mueve el ingreso recurrente (lado derecho: retención, expansión, NRR). Hoy se ven el nudo y el
  lado derecho, pero no qué puerta trajo a cada cliente, y F-143 dice que el monto no reemplaza esa etiqueta. Eso
  abre una hipótesis puente que hoy no está en el caso: que la mezcla de entradas se movió hacia una puerta de menor
  valor. Explicaría a la vez R-003 (más primeros pagadores observados, con primer pago menor) y R-009 (la caída
  del monto por cliente activo se concentra en quién entra). Une H-002 (mezcla, lado Growth) con H-009 (entrantes,
  lado Revenue).'
options:
- key: A
  label: Registrarla como hipótesis nueva, ligada a H-002 y H-009, marcada «no evaluable hoy» y con su dato mínimo
    (puerta por cuenta, unida a los pagos) en la lista de Q-016.
  consequence: Q-003 gana para el CEO un hilo entre Growth y Revenue sin afirmar nada. A cambio, suma una hipótesis
    más.
- key: B
  label: 'No crear una hipótesis nueva: anotarla como consecuencia de H-002 en Revenue.'
  consequence: Menos hipótesis, pero la conexión que pide el CEO queda implícita.
- key: C
  label: Esperar a que Finora valide las puertas (y si existe Self Service real) antes de formularla.
  consequence: Evita formular sobre una puerta que quizá no existe, pero Q-003 sigue sin hilo mientras tanto.
recommended: A
recommended_why: 'Q-003 no tiene hoy ninguna hipótesis que cruce de Growth a Revenue, y esta explica dos hechos
  observados con una sola variable. Respeta D-004 y F-143: no se prueba usando el ticket como sustituto de la puerta.'
