id: F-204
type: finding
headline: 'En pagos, el problema aparece en jul–oct 2024, no en todo el año: hay que fijar el periodo antes de buscar
  causas'
evidence_text: 'Primeros pagadores observados: ene–jun 2024 fueron 351 vs 272 (+29%); jul–oct, 203 vs 251 (−19%);
  ene–oct, 554 vs 523 (+6%). Jun-24 es el mes limpio más alto (84) y jul-24 baja a 48. El gasto S&M por primer pagador
  baja en ene–oct (−16%) y sube en jul–oct (+71%). Q-001 dice «no crecen en la misma proporción»: según la ventana,
  eso significa crecer menos que los leads (ene–oct) o caer (jul–oct).'
confidence: high
limitations:
- Primer pago no equivale a venta ni a adquisición confirmada. El modelo no tiene leads, así que no sabemos en qué
  meses hubo «más leads». La unidad del gasto no está documentada.
kind: measurement
