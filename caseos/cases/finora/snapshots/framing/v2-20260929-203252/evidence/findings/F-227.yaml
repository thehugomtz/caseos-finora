id: F-227
type: finding
headline: Valor y calidad por ruta son lo que le importa al CFO, y hoy solo existen agregados.
evidence_text: La mediana de M0 es 63.000 COP en la cosecha 2022 (mar–dic), 36.750 en 2023 y 42.000 en 2024 (ene–oct)
  (DM-7). Sin puerta ni ruta no se puede saber si esa diferencia viene de la mezcla de rutas, del pricing o de la
  industria.
confidence: medium
limitations:
- Cada cosecha cubre meses distintos y el dato es monto pagado observado, no MRR contratado. Es una descripción,
  no una comparación de negocio.
kind: measurement
claims:
- claim: La mediana de M0 por alta es 63.000 COP en la cosecha 2022 (mar–dic), 36.750 en 2023 y 42.000 en 2024 (ene–oct).
    Los promedios salen más altos (128.695; 47.945; 50.842) por las colas.
