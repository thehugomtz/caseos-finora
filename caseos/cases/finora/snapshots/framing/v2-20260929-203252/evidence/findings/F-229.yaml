id: F-229
type: finding
headline: 'Antes del árbol hay que fijar qué es «venta» y qué ventana se compara: en los pagos, la respuesta cambia
  según la unidad y el trimestre.'
evidence_text: 'En mar–oct, las altas fueron 227 (2022), 433 (2023) y 465 (2024) (DM-02). El monto promedio del
  primer pago por alta fue 118.771, 45.002 y 52.828 COP (DM-02), y la mediana 63.000, 35.280 y 42.000 COP (DM-03).
  Por trimestre, entre 2023 y 2024, T2 pasa de 144 a 219 altas y T3 de 187 a 153, mientras el gasto de generación
  de demanda de T3 pasa de 2,215 a 3,327, en unidad no documentada (DM-04). Las reactivaciones fueron 104 en mar–oct
  2023 y 131 en mar–oct 2024 (DM-02): si se cuentan como venta o como New, contaminan la brecha. Entre 2022 y 2023,
  la mediana bajó dentro de 5 de 6 industrias y Retail subió de 18,9% a 27,7% de las altas (DM-05): el valor cambió
  por mezcla y por tasa.'
confidence: high
limitations:
- Son primeros pagos observados (primera aparición, no adquisición ni Won) y montos pagados, no MRR contratado.
  No dicen nada sobre leads ni conversión. El gasto S&M no tiene unidad documentada, y las medianas por industria
  tienen n chico.
kind: measurement
