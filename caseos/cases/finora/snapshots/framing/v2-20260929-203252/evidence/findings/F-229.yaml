  confidence: high
  freshness: Consulta 2026-09-29
  supports_or_contests: context
  notes: Es monto pagado observado (columna new_mrr_cop), no MRR contratado. El promedio es sensible a valores extremos.
- claim: La mediana del primer pago de las altas limpias de mar–oct fue 63.000 COP (2022), 35.280 (2023) y 42.000
