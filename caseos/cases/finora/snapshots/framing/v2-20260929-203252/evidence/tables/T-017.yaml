query: "-- E-010\nSELECT industry,\n SUM(CASE WHEN year = 2022 THEN 1 ELSE 0 END) AS altas_2022,\n SUM(CASE WHEN
  year = 2023 THEN 1 ELSE 0 END) AS altas_2023,\n SUM(CASE WHEN year = 2024 THEN 1 ELSE 0 END) AS altas_2024,\n
  ROUND(1.0*SUM(CASE WHEN year IN (2023,2024) THEN 1 ELSE 0 END)/(10.0*SUM(CASE WHEN year = 2022 THEN 1 ELSE 0 END)/22.0),2)
  AS razon_altas_mes_2324_vs_2022,\n ROUND(MEDIAN(CASE WHEN year = 2022 THEN m0_cop END)) AS mediana_m0_2022,\n
  ROUND(MEDIAN(CASE WHEN year = 2024 THEN m0_cop END)) AS mediana_m0_2024\nFROM mart.new_customers WHERE clean GROUP
  BY 1 ORDER BY 4 DESC\n\n-- E-004\nSELECT substr(month, 1, 4) || ' S' || CASE WHEN CAST(substr(month, 6, 2) AS
  INTEGER) <= 6 THEN '1' ELSE '2' END AS periodo, industry AS industry, SUM(new_customer) AS valor, COUNT(DISTINCT
  month) AS meses, (SUM(new_customer)) / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE
  month BETWEEN '2022-03' AND '2024-10' GROUP BY ALL ORDER BY periodo, industry"
