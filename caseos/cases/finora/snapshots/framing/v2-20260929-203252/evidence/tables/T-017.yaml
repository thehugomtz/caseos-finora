definitions:
  Altas (clientes nuevos): Clientes con MRR pagado mayor que cero en el mes y que nunca antes habían pagado.
message: Las altas anuales de primeros pagadores son mayores en 2023 que en 2022 mar-dic en Retail (de 49 a 169),
  Servicios profesionales (de 17 a 61), Restaurantes (de 78 a 164), Producción (de 70 a 155), Tecnología (de 37
  a 64) y Salud (de 21 a 37).
