query: '-- E-006

  WITH m AS (SELECT month, SUM(churned_customer) AS churn, SUM(active_customer) AS activos FROM mart.customer_month
  WHERE TRUE GROUP BY ALL), l AS (SELECT *, LAG(activos) OVER (PARTITION BY 1 ORDER BY month) AS activos_prev FROM
  m) SELECT substr(month, 1, 4) AS periodo, SUM(churn)::DOUBLE / NULLIF(SUM(activos_prev), 0) AS valor, SUM(churn)
  AS churn, SUM(activos_prev) AS activos_mes_anterior, COUNT(*) AS meses FROM l WHERE month BETWEEN ''2022-03''
  AND ''2024-10'' GROUP BY ALL ORDER BY periodo'
