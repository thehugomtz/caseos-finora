query: "-- E-005\nSELECT year,\n  count(*) AS altas,\n  round(median(m0_cop),0) AS m0_mediana,\n  round(avg(m0_cop),0)
  AS m0_promedio,\n  count(*) FILTER (WHERE m1_cop > 0) AS altas_con_m1,\n  round(median(m1_cop) FILTER (WHERE m1_cop
  > 0),0) AS m1_mediana,\n  round(avg(m1_cop) FILTER (WHERE m1_cop > 0),0) AS m1_promedio,\n  round(median(early_run_rate_cop),0)
  AS rr_mediana,\n  round(avg(early_run_rate_cop),0) AS rr_promedio,\n  round(median(m1_cop) FILTER (WHERE m1_cop
  > 0) / median(m0_cop),3) AS razon_m1_m0_mediana\nFROM mart.new_customers\nWHERE clean AND year IN (2022,2023,2024)\nGROUP
  BY year ORDER BY year"
