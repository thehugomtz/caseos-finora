message: En cohortes de ventana limpia, la mediana del segundo pago (M1) de las altas es COP 52,5 mil en 2022, COP
  36,8 mil en 2023 y COP 38,9 mil en 2024, y la mediana del monto usual temprano (M0–M2) pasa de COP 60,9 mil en
  2022 a COP 36,8 mil en 2023 y COP 37,8 mil en 2024.
