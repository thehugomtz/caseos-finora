message: 'En sentido contrario, las bajadas de monto sí tienden a sostenerse: entre mar-22 y sep-24 las bajadas
  que se mantienen en el nivel nuevo suman COP 55,9 millones en 848 eventos, frente a COP 463,0 mil en 17 eventos
  que vuelven exacto al nivel previo.'
