query: '-- E-005

  SELECT substr(month, 1, 4) AS periodo, COALESCE(SUM(reactivation_mrr_cop), 0)::DOUBLE AS valor, COUNT(DISTINCT
  month) AS meses, (COALESCE(SUM(reactivation_mrr_cop), 0)::DOUBLE) / COUNT(DISTINCT month) AS promedio_mensual
  FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10'' GROUP BY ALL ORDER BY periodo'
