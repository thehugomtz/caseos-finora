definitions:
  Reactivaciones: Clientes que vuelven a pagar después de al menos un mes en cero.
  Altas (clientes nuevos): Clientes con MRR pagado mayor que cero en el mes y que nunca antes habían pagado.
message: En 2023 y en 2024 (ene–oct) las reactivaciones por mes son 12 y 16 frente a 54 y 55 altas por mes, de modo
  que sumarlas o separarlas deja ambos periodos en el mismo orden.
