id: N-039
type: note
hugo_wording: ''
structured: 'Regla MECE propuesta, en dos preguntas. 1) Puerta, fija al entrar: el registro nace en el producto
  o en el proceso comercial. 2) Intervención antes del nudo, contando tramos (pasar de una etapa a la siguiente):
  si ninguno lo movió una persona, es Self Service; si todos, Executive; si algunos, Hybrid. Reactivate es un loop
  con marca, no una ruta ni una entrada nueva, y sus acciones cuentan como intervención solo si las hace un SDR/AE.
  El canal es un atributo que cruza las tres rutas. La conversión se mide por cohorte de puerta y la ruta describe
  cómo llegaron al nudo.'
