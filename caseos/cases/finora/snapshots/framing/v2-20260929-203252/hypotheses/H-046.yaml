id: H-046
type: hypothesis
statement: Parte de la caída del ticket de entrada medida con el primer pago viene de lo que incluye ese primer
  cobro (importes que no se repiten en el 2.º pago), no de un nivel recurrente más bajo. En 2022, el 23,2% de las
  altas de ventana limpia pagó el primer mes bastante más que el segundo, frente al 11,6% en 2024 (F-086) (Q-012).
falsifier: 'Se descarta si, en la misma población de ventana limpia, el ticket de entrada medido con el 2.º pago
  o con el monto usual de los meses 2–3 cae entre 2022 y 2024 en una magnitud parecida a la del 1.er pago: −33%
  en mediana y −60% en promedio (F-084).'
