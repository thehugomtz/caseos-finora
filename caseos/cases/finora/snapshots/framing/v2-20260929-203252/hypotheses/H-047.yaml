id: H-047
type: hypothesis
statement: El aumento de montos fuera de la grilla (de 19% a 42%) y de ajustes pequeños (de 9% a 75% de los eventos
  de expansión) refleja un cambio general en la forma de cobrar, que afecta a la vez a clientes nuevos y antiguos,
  y no un cambio en lo que contratan los clientes. Si es así, la expansión observada en 2024 no equivale a ampliar
  lo contratado (H-017).
falsifier: Se descarta si los montos fuera de la grilla y los ajustes pequeños se concentran en pocos clientes,
  o si su frecuencia sigue la antigüedad de cada cosecha y no el mes calendario.
