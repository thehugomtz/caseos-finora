id: H-065
type: hypothesis
statement: Si Finora etiqueta hacia atrás a los pagadores 2022–2024 solo con información previa al contacto (F-191,
  F-188), una parte relevante quedaría en «sin clasificar». La razón sería que el CRM no guarda con fecha de entrada
  el tamaño, la intención, el ajuste ni el canal. Si es así, el primer hueco del WoW del CRO es capturar esos campos
  al entrar, antes que medir puertas.
falsifier: Finora muestra esos campos, con fecha anterior al primer contacto, para la mayoría de las cuentas, y
  el etiquetado deja «sin clasificar» como un residuo menor.
