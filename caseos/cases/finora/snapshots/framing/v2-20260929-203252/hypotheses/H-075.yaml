statement: 'Parte de la caída de T3-24 (jul–sep: de 187 a 153 altas observadas) es compra adelantada a T2-24 (abr–jun:
  de 144 a 219). Sumando los dos trimestres, las altas suben de 331 a 372 (+12%, cálculo mío). Sería un cambio de
  momento y no solo de nivel, por ejemplo por una campaña o por un cambio de precio o plan anunciado para mitad
  de 2024.'
falsifier: Si el excedente de T2-24 y el faltante de T3-24 frente a 2023 están en industrias o bandas de ticket
  estabilizado distintas, no es adelanto. Oct-24 todavía abajo (50 vs 64, X-107) ya indica que no puede ser toda
  la caída. Si Finora comparte nov–dic-24 y el nivel no se recupera, el adelanto quedaría como una parte menor.
