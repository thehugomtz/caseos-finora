id: R-006
type: research
research_question: ¿Cambió la economía posterior de los nuevos pagadores?
case_question: ¿Cambió la economía posterior de los nuevos pagadores?
specialty: analytics
intensity: analytics
status: completed
alias: W5
why_it_matters: Decide si hace falta matizar el argumento de adquisición con la economía de los pagadores.
short_answer: 'Respuesta parcial: a igual edad el aporte posterior es menor, concentrado en la entrada. Respuesta
  parcial. A la misma edad desde el alta, el aporte por cliente de las cohortes 2023 se observa por debajo del de
  las cohortes 2022, y el primer pago mediano de las altas baja antes de cualquier trayectoria posterior. Medido
  contra su propio primer pago, el nivel a M6 se mantiene en un rango estrecho entre cohortes.'
headline: 'Respuesta parcial: a igual edad el aporte posterior es menor, concentrado en la entrada'
answer_states:
- Hecho observado
- Direccional
findings:
- F-018
- F-053
- F-054
- F-033
what_is_established:
- A la misma edad desde el alta, el aporte por cliente de las cohortes recientes se observa por debajo del de las
  cohortes anteriores, con seguimiento común.
- Como señal, medida contra su propio primer pago la trayectoria posterior a M6 se mantiene en un rango estrecho
  entre cohortes, lo que sitúa la diferencia en el punto de partida.
- La salida de cuentas con monto usual mayor se asocia con la baja del monto por pagador de una cohorte al avanzar
  la edad.
what_is_contested: []
what_remains_unknown:
- 'No se puede separar si el menor aporte posterior corresponde a precio de lista, descuentos, créditos o cancelaciones
  contractuales: el panel solo registra el monto pagado por cliente y mes.'
- La continuidad de pago observada no separa cancelación de pausa o atraso, por lo que no sostiene una lectura de
  retención contractual.
- El seguimiento común deja celdas ausentes en las cohortes más recientes, y a M12 la cohorte 2024 S1 no tiene celda.
- Parte del movimiento del monto pagado es consistente con reversiones y liquidación de meses pendientes, lo que
  impide leer el alza entre M6 y M12 como cambio económico.
cannot_claim:
- La calidad de los leads a partir de lo que pasa después del pago.
- Retención contractual a partir de la continuidad de pago.
alternative_explanations: []
case_implication: A la misma edad desde el alta, el aporte por cliente de las cohortes recientes se observa por
  debajo del de las cohortes anteriores, con seguimiento común.
changes_current_story: maybe
affected_hypotheses:
- id: H-021
  alias: HO4
  question: ¿Las cohortes de primeros pagadores más recientes aportan menos monto por pagador activo a la misma
    edad desde el primer pago que las cohortes anteriores, con seguimiento común?
  state: Soportada
  effect: fortalecida
  reading: A la misma edad desde el alta, el MRR por cliente original de las cohortes 2023 se observa por debajo
    del de las cohortes 2022, en línea con el monto por pagador activo a M6.
- id: H-021
  alias: HO4
  question: ¿La brecha entre cohortes a igual edad persiste al avanzar la edad, en lugar de cerrarse con la maduración?
  state: Direccional
  effect: señal direccional
  reading: Como señal, la diferencia de mediana del monto por pagador entre la cohorte 2022 mar-dic y la cohorte
    2023 S2 no se cierra al avanzar la edad, aunque el seguimiento común deja celdas ausentes.
- id: H-021
  alias: HO4
  question: ¿La continuidad de pago a la misma edad desde el primer pago difiere entre cohortes?
  state: No soportada
  effect: debilitada
  reading: A M12 la continuidad de pago se acerca entre las cohortes 2022 mar-dic y 2023 S1, y el churn observado
    no separa cancelación de pausa o atraso.
- id: null
  alias: rival
  question: ¿La diferencia entre cohortes se concentra en el nivel de entrada (M0), de modo que la trayectoria posterior
    relativa a su propio primer pago es equivalente entre cohortes?
  state: Direccional
  effect: señal direccional
  reading: El primer pago mediano de las altas baja en las cohortes recientes y, medida contra su propio primer
    pago, la mediana a M6 se mantiene en un rango estrecho, aunque con el promedio la señal difiere entre cohortes.
- id: null
  alias: rival
  question: ¿Las diferencias observadas de aporte posterior son atribuibles a artefactos de medición del monto pagado
    (reversiones, pagos dobles, liquidación de meses pendientes) más que a un cambio económico?
  state: Direccional
  effect: señal direccional
  reading: Como señal, el alza del monto promedio por pagador de la cohorte 2022 mar-dic entre M6 y M12 es consistente
    con movimientos que vuelven al nivel previo y con retornos que liquidan meses pendientes.
- id: null
  alias: ''
  question: ¿Qué parte de la economía posterior de los nuevos pagadores depende de datos que no existen en el panel?
  state: No evaluable
  effect: no evaluable
  reading: Sin precios, descuentos, créditos, estado de suscripción ni definición documentada del monto, la lectura
    económica del aporte posterior queda fuera de lo que permite el panel.
affected_claims: []
suggested_action: La lectura económica del aporte posterior quedó no evaluable con el panel actual, así que conviene
  definir la evidencia mínima antes de ampliar comparaciones.
next_question: W6
new_questions:
- ¿La brecha de monto por pagador a igual edad se mantiene al excluir los meses con firma de cobro acumulado o de
  reversión?
- ¿Cómo cambia la comparación a igual edad si el punto de partida de cada cohorte es el run-rate de los primeros
  meses en lugar del primer pago?
- ¿La diferencia de aporte posterior entre cohortes se concentra en alguna industria o es común a las observadas?
- ¿Qué registro (estado de suscripción, precio vigente, concesiones) permitiría distinguir una caída de precio de
  una pausa de pago, y separar continuidad de pago de retención contractual?
