type: research
research_question: ¿Cómo definir y medir el funnel si no todos lo recorren igual (self-service, entrada directa
  a SQL, leads estancados semanas)? Qué puertas (Assisted / Self Service / Executive) y canales, qué funnel por
  puerta, cómo encaja AAARRR y con qué conversion rate y métricas clave.
