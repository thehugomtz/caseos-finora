- SELECT vintage, clean, COUNT(*) AS n, MIN(cohort_month) AS first_cohort, MAX(cohort_month) AS last_cohort FROM
  mart.new_customers GROUP BY vintage, clean ORDER BY vintage, clean
- SELECT month, active_customers, new_customers, reactivated_customers, churned_customers, total_paid_mrr_cop, new_mrr_cop,
  median_new_customer_mrr_cop FROM mart.monthly_metrics ORDER BY month
- SELECT substr(month,1,4) AS yr, COUNT(*) AS months, SUM(demand_gen_spend) AS demand_gen, SUM(paid_media) AS paid_media,
  SUM(publicidad_no_web) AS publicidad_no_web, SUM(sales_capacity_spend) AS sales_capacity, SUM(team) AS team, SUM(payroll_expenses)
  AS payroll, SUM(travel) AS travel, SUM(enablement_spend) AS enablement, SUM(total_sm_spend) AS total_sm FROM mart.sm_monthly
  GROUP BY yr ORDER BY yr
- SELECT vintage, COUNT(*) AS n, quantile_cont(m0_cop, 0.10) AS p10, quantile_cont(m0_cop, 0.25) AS p25, quantile_cont(m0_cop,
  0.50) AS p50, quantile_cont(m0_cop, 0.75) AS p75, quantile_cont(m0_cop, 0.90) AS p90, quantile_cont(m0_cop, 0.99)
  AS p99, MAX(m0_cop) AS max_m0, SUM(m0_cop) AS sum_m0 FROM mart.new_customers WHERE clean GROUP BY vintage ORDER
  BY vintage
- SELECT CASE WHEN m0_cop < 30000 THEN 'a <30k' WHEN m0_cop < 60000 THEN 'b 30k-60k' WHEN m0_cop < 100000 THEN 'c
  60k-100k' WHEN m0_cop < 200000 THEN 'd 100k-200k' WHEN m0_cop < 500000 THEN 'e 200k-500k' ELSE 'f >=500k' END
  AS m0_band, COUNT(*) AS n_altas, SUM(m0_cop) AS sum_m0_cop, ROUND(100.0*COUNT(*)/SUM(COUNT(*)) OVER (),1) AS pct_altas,
  ROUND(100.0*SUM(m0_cop)/SUM(SUM(m0_cop)) OVER (),1) AS pct_m0 FROM mart.new_customers WHERE clean GROUP BY m0_band
  ORDER BY m0_band
- SELECT CASE WHEN n.m0_cop < 100000 THEN 'a <100k' WHEN n.m0_cop < 500000 THEN 'b 100k-500k' ELSE 'c >=500k' END
  AS m0_band, COUNT(*) AS n_altas, SUM(CASE WHEN cm.multi_month_payment_signature > 1 THEN 1 ELSE 0 END) AS m0_multi_month_signature,
  SUM(CASE WHEN cm.amount_vs_usual_ratio > 1.5 THEN 1 ELSE 0 END) AS m0_above_1_5x_usual, quantile_cont(cm.usual_amount_cop,
  0.5) AS median_usual_amount_cop FROM mart.new_customers n JOIN mart.customer_month cm ON cm.customer_id = n.customer_id
  AND cm.month = n.cohort_month WHERE n.clean GROUP BY m0_band ORDER BY m0_band
- SELECT n.vintage, COUNT(*) AS n_altas, ROUND(100.0*AVG(CASE WHEN cm1.active_customer = 1 THEN 1 ELSE 0 END),1)
  AS pct_active_m1, ROUND(100.0*AVG(CASE WHEN cm3.active_customer = 1 THEN 1 ELSE 0 END),1) AS pct_active_m3, COUNT(cm3.customer_id)
  AS n_with_m3_observed FROM mart.new_customers n LEFT JOIN mart.customer_month cm1 ON cm1.customer_id = n.customer_id
  AND cm1.tenure_month = 1 LEFT JOIN mart.customer_month cm3 ON cm3.customer_id = n.customer_id AND cm3.tenure_month
  = 3 WHERE n.clean AND n.cohort_month <= '2024-07' GROUP BY n.vintage ORDER BY n.vintage
- SELECT substr(month,1,4) AS yr, SUM(new_customers) AS altas_nuevas, SUM(reactivated_customers) AS reactivaciones,
  SUM(churned_customers) AS churn_observado, ROUND(100.0*SUM(reactivated_customers)/(SUM(new_customers)+SUM(reactivated_customers)),1)
  AS pct_reactivaciones_sobre_entradas FROM mart.monthly_metrics WHERE month >= '2022-03' GROUP BY yr ORDER BY yr
- WITH nc AS (SELECT n.customer_id, cm.usual_amount_cop FROM mart.new_customers n JOIN mart.customer_month cm ON
  cm.customer_id = n.customer_id AND cm.month = n.cohort_month WHERE n.clean) SELECT COUNT(*) AS altas, COUNT(DISTINCT
  usual_amount_cop) AS montos_usuales_distintos, SUM(CASE WHEN ROUND(usual_amount_cop) % 5250 = 0 THEN 1 ELSE 0
  END) AS usual_multiplo_5250, ROUND(100.0*SUM(CASE WHEN ROUND(usual_amount_cop) % 5250 = 0 THEN 1 ELSE 0 END)/COUNT(*),1)
  AS pct_multiplo_5250 FROM nc
- WITH nc AS (SELECT n.customer_id, cm.usual_amount_cop FROM mart.new_customers n JOIN mart.customer_month cm ON
  cm.customer_id = n.customer_id AND cm.month = n.cohort_month WHERE n.clean) SELECT usual_amount_cop, COUNT(*)
  AS altas FROM nc GROUP BY usual_amount_cop ORDER BY altas DESC LIMIT 15
- WITH nc AS (SELECT n.customer_id, n.vintage, cm.usual_amount_cop FROM mart.new_customers n JOIN mart.customer_month
  cm ON cm.customer_id = n.customer_id AND cm.month = n.cohort_month WHERE n.clean) SELECT vintage, COUNT(*) AS
  altas, SUM(CASE WHEN ROUND(usual_amount_cop) % 2100 = 0 THEN 1 ELSE 0 END) AS usual_en_multiplo_2100, ROUND(100.0*SUM(CASE
  WHEN ROUND(usual_amount_cop) % 2100 = 0 THEN 1 ELSE 0 END)/COUNT(*),1) AS pct_multiplo_2100, ROUND(100.0*SUM(CASE
  WHEN ROUND(usual_amount_cop) % 1050 = 0 THEN 1 ELSE 0 END)/COUNT(*),1) AS pct_multiplo_1050 FROM nc GROUP BY ROLLUP(vintage)
  ORDER BY vintage NULLS LAST
- WITH nc AS (SELECT n.customer_id, n.cohort_month, cm.usual_amount_cop, CASE WHEN ROUND(cm.usual_amount_cop) %
  1050 = 0 THEN 'en_grilla_1050' ELSE 'fuera_de_grilla' END AS grilla FROM mart.new_customers n JOIN mart.customer_month
  cm ON cm.customer_id = n.customer_id AND cm.month = n.cohort_month WHERE n.clean) SELECT nc.grilla, COUNT(*) AS
  altas, quantile_cont(nc.usual_amount_cop, 0.5) AS mediana_monto_usual, quantile_cont(nc.usual_amount_cop, 0.9)
  AS p90_monto_usual, SUM(CASE WHEN nc.cohort_month <= '2024-07' THEN 1 ELSE 0 END) AS altas_con_m3_observable,
  ROUND(100.0*AVG(CASE WHEN nc.cohort_month <= '2024-07' THEN (CASE WHEN cm3.active_customer = 1 THEN 1 ELSE 0 END)
  END),1) AS pct_activo_m3 FROM nc LEFT JOIN mart.customer_month cm3 ON cm3.customer_id = nc.customer_id AND cm3.tenure_month
  = 3 GROUP BY nc.grilla ORDER BY nc.grilla
