alternative_explanations:
- 'Madurez (H-003): las entradas recientes todavía no cumplieron la ventana para comprar. En una tasa de período
  eso se ve como caída de conversión.'
- 'Mix: llegan más entradas por puertas o canales que convierten menos o más lento (por ejemplo, más ToFu Digital),
  sin que ninguna puerta empeore.'
- 'Registro: aparecen más registros por cambios de captura (formularios nuevos, varios contactos de una misma cuenta
  sin deduplicar), sin que haya más cuentas reales.'
- Caída real de tasa en una puerta, por calidad del lead, capacidad del Team o precio.
- Reactivaciones contadas como entradas nuevas en algún reporte, lo que infla la sensación de que «llega más gente».
- La capacidad comercial no acompaña el volumen y eso genera estancamiento en Assisted (hipótesis; hoy el gasto
  no está por puerta).
what_is_established:
- El modelo actual no tiene leads, etapas, canales ni puertas, así que hoy no se puede calcular la conversión del
  funnel.
- Una tasa etapa a etapa se rompe cuando hay saltos de etapa; una tasa de período mezcla cohortes; e ignorar a los
  casos todavía abiertos subestima tiempos y conversiones recientes.
- Los métodos observacionales de atribución a menudo no recuperan el efecto causal.
- 'Con los pagos sí se mide el nudo y el lado derecho: ~54–55 altas por mes en 2023–2024, 90–96% de activos en M3
  por cosecha, y reactivaciones que equivalen al 18–38% de las entradas a pago.'
- 'El M0 exagera el valor de entrada en parte de las altas: 15 de las 20 con M0 ≥ 500.000 COP pagaron más de 1,5×
  su monto usual.'
what_is_contested:
- Si hay que abandonar el MQL (postura de Forrester) o mantenerlo como hito de Digital y Self Service.
- El orden de AARRR frente a RARRA (retención primero).
- Si Executive es una puerta (un motion) o un segmento por tamaño de cuenta.
- Cuánto del bowtie es estándar de la industria y cuánto es un marco que vende una consultora.
what_remains_unknown:
- Si Finora tiene un CRM con fechas por etapa, fuente y owner, y si se puede unir con el ID de cliente de los pagos.
- Cómo define Finora cada puerta y si existe Self Service real, es decir, compra sin intervención humana.
- La unidad y moneda del gasto S&M, y el margen bruto.
- Los tiempos a pago por puerta, necesarios para fijar la ventana W y el umbral de estancamiento N.
- Qué explica los M0 muy por encima del monto usual (prepago, setup u otra cosa).
case_implication: 'Para Finora, el bloque de Growth no puede traer «la tasa de conversión del funnel»: el modelo
  no tiene nada antes del primer pago. Lo que sí puede traer son cinco piezas. (1) Una lámina con el bowtie por
  puertas: Self Service, Assisted y Executive, con Reactivación como tipo de entrada aparte. (2) El mapa de AAARRR
  por puerta: ToFu medido por canal, una Activation distinta en cada puerta y el BoFu en el primer pago. (3) La
  definición de conversión por cohorte y ventana, más tiempo y estancamiento, con la descomposición Δ nuevos = volumen
  + tasa + mix + valor + madurez, que es justo lo que Q-001 y H-003 necesitan distinguir. (4) Lo que hoy sí se mide
  del lado derecho, con los números de Finora. (5) La Propuesta de Modelo de datos (eventos + dimensiones) para
  poder medir el lado izquierdo. Hay dos cuidados para el storyline: «llega más gente» hoy no es observable (las
  altas sí, y están planas en ~54–55 por mes), y el valor de entrada debe mostrarse con el run-rate temprano, no
  con el M0.'
changes_current_story:
  value: maybe
  why: No cambia hechos, pero puede cambiar el bloque de Growth. Si el storyline pensaba mostrar una conversión
    del funnel o una tasa única, tendría que pasar a «bowtie por puertas + Propuesta de Modelo de datos». Además,
    la premisa de Q-001 («llega más gente») queda como no verificable con los datos actuales. Si el bloque ya estaba
    planteado como propuesta, esto lo refuerza. Lo decide Hugo.
affected_hypotheses:
- id: H-003
  effect: requires_research
  why: 'El test queda definido: alcance a pago por cohorte de entrada con la misma ventana y el mismo perfil (puerta,
    canal, industria, tamaño), más una curva de supervivencia. Pero no se puede correr sin fechas de entrada, así
    que hoy no se apoya ni se debilita.'
- id: Q-001
  effect: changes_framing
  why: La premisa «llega más gente» no es observable en el modelo; lo observable es que las altas se mantienen en
    ~54–55 por mes en 2023–2024. La respuesta debe descomponerse por puerta en volumen, tasa, mix, valor y madurez.
- id: Q-003
  effect: changes_framing
  why: 'El vínculo entre adquisición e ingreso recurrente pasa a ser la ecuación del bowtie: New MRR = Σ por puerta
    (entradas × alcance a pago en W × valor inicial). A la derecha se agregan NRR y GRR por cohorte de puerta.'
- id: Q-016
  effect: supports
  why: 'Aterriza la evidencia mínima: registros de entrada por cuenta con fecha, puerta y canal; fechas por etapa;
    una llave que los una a los pagos; y gasto por canal.'
affected_claims: []
suggested_action: 'Propongo cuatro pasos, para que Hugo decida. (1) Llevar a Hugo una lámina de Growth con el bowtie
  por puertas y la definición de conversión por cohorte y ventana, presentada como propuesta y no como resultado.
  (2) Preparar el pedido de datos a Finora: export del CRM con fechas por etapa, fuente, owner y puerta; la llave
  con el ID de cliente de los pagos; y el gasto por canal con unidad documentada. (3) Mientras tanto, pedir a Analytics
  el lado derecho por cosecha: run-rate temprano en vez de M0, M3/M6, NRR y reactivaciones aparte. (4) Pedir a Data
  Engineering el esquema de la Propuesta de Modelo de datos.'
new_questions:
- ¿Tiene Finora un CRM con fecha de creación, fechas de cambio de etapa, fuente y owner por lead u oportunidad,
  y existe una llave que lo una al ID de cliente de los pagos?
- ¿Cómo asigna hoy Finora cada venta a Assisted, Self Service o Executive (quién cierra, con qué precio y con qué
  contrato), y existe un checkout sin intervención humana?
- ¿En qué unidad y moneda está el archivo de gasto S&M, y se puede desagregar por canal o campaña?
handoff_to_cos:
  summary: 'R-016 queda resuelto a nivel de método. Se propone un bowtie por puertas (Self Service, Assisted y Executive,
    con Reactivación aparte), AAARRR como vocabulario y conversión por cohorte con ventana fija, más tiempo y estancamiento.
    Con el modelo actual el lado izquierdo no se puede medir; el lado derecho sí: altas de ~54–55 por mes en 2023–24,
    90–96% de activos en M3 y reactivaciones que equivalen al 18–38% de las entradas. No hay que usar M0 como valor
    ni inferir puertas a partir de los pagos.'
  recommended_next: Pedirle a Hugo que apruebe el enfoque para el bloque de Growth y el pedido de datos a Finora
    (CRM + llave con pagos + gasto por canal). En paralelo, encargar el lado derecho por cosecha a Analytics y el
    esquema de tablas a Data Engineering.
confidence_buckets:
  high_confidence:
  - El modelo actual no tiene leads, etapas, canales ni puertas, así que hoy no se puede calcular la conversión
    del funnel.
  - Una tasa mezclada o de período no describe journeys con saltos de etapa ni cohortes de distinta madurez.
  - Ignorar los casos todavía abiertos subestima tiempos y conversiones de las cohortes recientes.
  - La atribución observacional no prueba causa.
  plausible:
  - El bowtie por puertas con hitos comunes es el marco adecuado para Finora.
  - Los montos usuales siguen una grilla de precios, es decir, planes estandarizados.
  - Las reactivaciones inflan las «entradas» si no se separan.
  - El M0 distorsiona el valor de entrada porque algunos primeros pagos superan el monto usual.
  contested:
  - Abandonar el MQL (postura de Forrester) o mantenerlo para Digital y Self Service.
  - El orden de AARRR frente a RARRA.
  - Si Executive es una puerta o un segmento por tamaño.
  unknown:
  - Si Finora tiene un CRM con fechas por etapa y una llave hacia los pagos.
  - La definición real de las puertas en Finora y si existe Self Service.
  - La unidad del gasto S&M y el margen bruto.
  - Los tiempos a pago por puerta, necesarios para fijar la ventana W y el umbral de estancamiento N.
specialist:
  measurement:
    problem_interpretation: Finora vende por al menos tres puertas (Self Service, Assisted y Executive) que no pasan
      por las mismas etapas. Unos pagan sin hablar con ventas, otros entran directo a SQL u oportunidad vía KAM
      o referido, y otros quedan semanas abiertos. Un funnel lineal con una sola tasa (Lead→MQL→SQL→Oportunidad→Cliente)
      falla en tres puntos. (1) Con etapas saltadas, las tasas etapa a etapa dejan de tener sentido. (2) Al mezclar
      puertas con tasas y velocidades distintas, un cambio de mix parece un cambio de desempeño. (3) La tasa de
      período (clientes del mes ÷ leads del mes) mezcla cohortes y castiga a las entradas recientes que todavía
      no tuvieron tiempo de comprar, que es el mecanismo de H-003. Además, hoy el modelo no tiene nada antes de
      la venta, así que la pregunta es primero de medición (qué capturar) y después de análisis.
    measurement_objective: 'Poder responder por puerta y canal cinco cosas: cuántas cuentas entran (volumen), qué
      % llega a cada hito dentro de una misma ventana (tasa), en cuánto tiempo y cuántas se estancan (velocidad),
      con qué valor inicial y retención (valor), y a qué costo (CAC y payback). Con eso se puede descomponer cualquier
      cambio en nuevos clientes o New MRR en volumen × tasa × valor × mix × madurez, y decidir dónde poner la Inversión
      en Marketing, el Team y la Habilitación.'
    recommended_framework:
      name: Bowtie por puertas con hitos comunes (AAARRR como vocabulario, conversión por cohorte y ventana)
      structure: 'Izquierda, por puerta y con hitos propios. Self Service: visita por canal → registro → activación
        (PQL/PQA) → primer pago. Assisted: entrada (pide ayuda, PQL derivado desde Self Service u outbound que responde)
        → SQL → oportunidad → primer pago. Executive: cuenta objetivo → oportunidad (entra directo, sin MQL) → sponsor
        o business case → primer pago. Nudo común (BoFu): primer pago. Derecha común: activos en M3/M6/M12, expansión,
        contracción, churn, y NRR/GRR por cohorte de puerta. Reactivación va como tipo de entrada aparte. AAARRR
        funciona como vocabulario: Awareness = alcance por canal (ToFu, no por cuenta); Acquisition = entrada; Activation
        = hito de calificación de cada puerta; Revenue = primer pago; Retention = retención por cohorte; Referral
        y expansión = expansión más referidos que vuelven como canal. En cada tramo se mide volumen, alcance en
        ventana W por cohorte de entrada (solo cohortes que ya cumplieron la ventana), tiempo (mediana y p90 más
        curva de supervivencia) y estancamiento. Cabecera para CEO y CFO, por puerta: entradas × alcance a pago
        × valor inicial = New MRR, más M3/NRR y CAC payback. El total se muestra como suma de puertas, con el mix
        explícito.'
      why: 'No obliga a nadie a pasar por etapas que no vive: los saltos cuentan como «alcanzó», no como cero. Compara
        todas las puertas contra el mismo resultado económico. Separa volumen, tasa, valor, mix y madurez, que es
        lo que Q-001 necesita distinguir. Y usa cuenta + cohorte + ventana, que corrige el sesgo que plantea H-003
        (cohortes recientes con menos tiempo para comprar). La mitad derecha ya se puede medir hoy con los pagos
        de Finora.'
    alternative_frameworks:
    - name: Forrester B2B Revenue Waterfall (centrado en oportunidades y grupos de compra)
      when_better: Cuando Assisted y Executive dominan el New MRR y las ventas involucran a varios decisores por
        cuenta. También sirve como detalle interno de la puerta Executive.
      tradeoff: No modela Self Service ni el uso del producto, su metodología detallada es gated y exige datos de
        contactos por cuenta que Finora probablemente no tiene.
    - name: Funnel lineal único con conversión etapa a etapa (demand waterfall clásico o AARRR lineal)
      when_better: Cuando en la práctica hay una sola puerta dominante, o para gestionar la operación dentro de
        una puerta donde las etapas sí son obligatorias.
      tradeoff: Da una tasa mezclada que no describe a nadie, se rompe con los saltos de etapa y confunde un cambio
        de mix con un cambio de desempeño.
    metric_definitions:
    - metric: Entradas (volumen)
      definition: Cuentas nuevas identificables que entran por una puerta en el período, sin duplicar a personas
        de una misma empresa. No incluye clientes activos, que cuentan como expansión, y separa a los ex-clientes
        como Reactivación.
      formula: COUNT(DISTINCT account_id) con entry_ts en el período, por puerta de origen × canal × tipo de entrada
      grain: Cuenta × mes de entrada (reporte trimestral por puerta si el n es chico)
      milestone: 'Entrada: primer registro identificable (registro en producto, formulario o demo, outbound que
        responde, oportunidad creada por KAM o referido)'
      notes: Es el denominador de todo lo demás. Sin él no se puede verificar Q-001. La unidad es la cuenta, no
        la persona.
    - metric: Alcance a primer pago en ventana W (la tasa principal por puerta)
      definition: '% de las entradas de una cohorte que hacen su primer pago dentro de los W días siguientes a la
        entrada.'
      formula: '# cuentas de la cohorte con (fecha de primer pago − entry_ts) ≤ W ÷ # cuentas de la cohorte; solo
        cohortes con entry_ts + W ≤ fecha de corte'
      grain: Puerta × canal × cohorte de entrada (mes o trimestre)
      milestone: Entrada → primer pago
      notes: Reemplaza tanto la tasa mezclada como la tasa de período. W se fija por puerta con el p90 del tiempo
        a pago de quienes sí compran. Conviene mostrar varias ventanas (por ejemplo, 30/90/180 días) como parámetro
        a calibrar, no como benchmark. Las cohortes que todavía no cumplieron la ventana se muestran aparte o con
        curva de supervivencia.
    - metric: Alcance al hito de calificación (Activation por puerta)
      definition: '% de las entradas que llegan al hito propio de su puerta dentro de la ventana W1. Self Service:
        activación en producto (PQL/PQA). Assisted: SQL aceptado por ventas. Executive: oportunidad calificada con
        sponsor y business case.'
      formula: '# cuentas de la cohorte que alcanzan o se saltan el hito dentro de W1 ÷ # cuentas de la cohorte'
      grain: Puerta × canal × cohorte de entrada
      milestone: Entrada → hito de calificación
      notes: 'La regla es «alcanzó o superó»: si una cuenta se salta el hito y paga, cuenta como alcanzado, con
        skipped=1. Así se evitan tasas etapa a etapa rotas.'
    - metric: Win rate calificado
      definition: '% de las cuentas que, después del hito de calificación de su puerta, llegan al primer pago dentro
        de la ventana W2.'
      formula: '# con primer pago dentro de W2 desde el hito ÷ # que alcanzaron el hito (cohorte por fecha de hito);
        las cerradas «sin decisión» quedan en el denominador'
      grain: Puerta × cohorte de hito × owner
      milestone: Hito de calificación → primer pago
      notes: Es la métrica de BoFu del Team. No se mezcla con la de Self Service.
    - metric: Tiempo a hito (velocidad)
      definition: Días entre un hito y el siguiente (entrada → calificación → pago).
      formula: Mediana, p75 y p90 de (fecha del hito − fecha del hito anterior) entre quienes llegan, más una curva
        Kaplan-Meier que trata como censurados a quienes todavía no llegan
      grain: Puerta × cohorte × tramo
      milestone: Cada par de hitos consecutivos
      notes: Promediar solo a los que convirtieron subestima el tiempo real. En Executive el reloj arranca con la
        primera huella en el CRM, así que los tiempos se comparan solo dentro de cada puerta.
    - metric: Tasa de estancamiento
      definition: '% de los registros abiertos en una etapa que llevan más de N semanas sin cambio de etapa ni actividad.'
      formula: '# abiertos en la etapa S con días desde el último cambio o actividad > 7·N ÷ # abiertos en S (foto
        semanal)'
      grain: Puerta × etapa × semana
      milestone: Etapa actual
      notes: N se fija por puerta y etapa con el p90 del tiempo en la etapa de quienes sí avanzaron. Pasado un umbral,
        el registro se cierra como «sin decisión» o se recicla a nurturing con un flag, para que el denominador
        no crezca sin fin.
    - metric: Valor inicial (run-rate temprano)
      definition: Monto mensual típico de los primeros meses de un cliente nuevo, no su primer pago.
      formula: Mediana del MRR pagado en M1–M3 (hoy se puede usar early_run_rate_cop o usual_amount_cop), agregada
        por puerta × cohorte como mediana, p75 y p90
      grain: Cliente nuevo, agregado por puerta × cohorte
      milestone: Primer pago → M3
      notes: 'En Finora el M0 distorsiona: 15 de las 20 altas con M0 ≥ 500.000 COP pagaron más de 1,5× su monto
        usual.'
    - metric: Retención temprana de logos (M3/M6/M12)
      definition: '% de los clientes nuevos de una cohorte que siguen pagando en el mes k de tenure.'
      formula: '# altas de la cohorte activas en tenure k ÷ # altas de la cohorte (solo cohortes con k observable),
        con k = 3, 6 y 12'
      grain: Puerta × cohorte de primer pago
      milestone: Primer pago
      notes: Ya se puede medir sin puerta. Con puerta, permite comparar la calidad de lo que trae cada una.
    - metric: NRR y GRR por cohorte de puerta
      definition: MRR pagado por una cohorte a los 12 meses frente a su base inicial, con expansión (NRR) y sin
        ella (GRR).
      formula: NRR = (MRR base + expansión − contracción − churn) ÷ MRR base; GRR = (MRR base − contracción − churn)
        ÷ MRR base; MRR base = valor inicial; reactivaciones aparte
      grain: Puerta × cohorte anual o semestral
      milestone: Primer pago → M12
      notes: Hoy el churn es observado (pago en cero). Con eventos de suscripción se podrá separar de una falla
        de pago.
    - metric: CAC y payback por puerta × canal
      definition: Gasto asignado a una puerta o canal dividido por los clientes nuevos que trae, y los meses necesarios
        para recuperarlo.
      formula: 'CAC = gasto asignado (Generación de Demanda por canal de origen; Team por puerta de cierre; Habilitación
        prorrateada) ÷ # nuevos de esa puerta o canal; payback (meses) = CAC ÷ (valor inicial × margen bruto)'
      grain: Puerta × canal × trimestre
      milestone: Entrada → primer pago
      notes: 'Reparte crédito, no prueba causa. Hoy no se puede calcular: el gasto viene por rubro, la unidad no
        está documentada y no hay margen.'
    - metric: Mix de puertas y descomposición
      definition: Peso de cada puerta en entradas, clientes nuevos y valor inicial, usado para descomponer los cambios.
      formula: Nuevos de la puerta ÷ nuevos totales (igual para entradas y valor). Δ nuevos ≈ efecto volumen (Δ
        entradas × tasa previa) + efecto mix (cambio de pesos × tasa previa por puerta) + efecto tasa (Δ tasa por
        puerta × pesos actuales). El efecto madurez se aísla usando solo cohortes que ya cumplieron la ventana.
      grain: Puerta × trimestre
      milestone: Entrada y primer pago
      notes: Es la métrica que contesta Q-001 sin mezclar las causas.
    - metric: Reactivaciones (win-back)
      definition: Ex-clientes que vuelven a pagar después de al menos un mes en cero. Es un tipo de entrada separado
        de «nuevo».
      formula: '# reactivados en el período; % sobre (altas + reactivaciones); meses hasta volver'
      grain: Cliente × mes
      milestone: Churn observado → pago
      notes: 'Ya se puede medir: equivalen al 17,7–37,9% de las entradas a pago según el año. Si el CRM las mezcla
        con clientes nuevos, inflan las entradas.'
    required_events:
    - event: entrada_creada (entry_created)
      trigger: 'Primera huella identificable de una cuenta: registro en producto, formulario o demo, lead outbound
        que responde, u oportunidad creada por KAM o referido.'
      properties:
      - account_id (deduplicado por dominio o NIT)
      - person_id
      - entry_ts
      - tipo_entrada (nuevo / ex-cliente / cliente activo)
      - puerta_origen
      - canal_primer_toque
      - canal_creacion (utm_source, medium, campaign)
      - industria
      - tamaño
    - event: registro_producto (Self Service)
      trigger: Se crea la cuenta en el producto.
      properties:
      - account_id
      - user_id
      - ts
      - plan
      - canal
    - event: activacion_alcanzada (PQL/PQA)
      trigger: La cuenta cumple el umbral de uso acordado como primer valor.
      properties:
      - account_id
      - ts
      - criterio_cumplido
      - metricas_de_uso
      - fit_ICP
    - event: pide_ayuda (hand_raise)
      trigger: Se pide una demo, una cotización o contacto comercial (incluye a usuarios de Self Service).
      properties:
      - account_id
      - ts
      - formulario_u_origen
      - canal
      - desde_self_service (sí/no)
    - event: cambio_etapa (lifecycle_stage_changed)
      trigger: Cambia la etapa en el CRM (Lead, MQL, SQL, Oportunidad, Cliente).
      properties:
      - account_id
      - etapa_desde
      - etapa_hasta
      - ts
      - owner_id y rol (SDR / AE / KAM / sales-assist)
      - puerta
      - etapas_saltadas[]
    - event: oportunidad_creada / oportunidad_cambio_etapa
      trigger: Se abre una oportunidad o avanza de etapa.
      properties:
      - opp_id
      - account_id
      - ts
      - etapa
      - puerta
      - owner
      - MRR_cotizado
      - tipo_precio (lista / negociado)
      - contactos_del_grupo_de_compra
    - event: oportunidad_cerrada
      trigger: La oportunidad se cierra como ganada, perdida o sin decisión.
      properties:
      - opp_id
      - resultado
      - motivo
      - ts
      - puerta_cierre
      - owner
    - event: primer_pago (subscription_started)
      trigger: Se cobra la primera factura de la cuenta.
      properties:
      - account_id
      - customer_id de pagos (llave con el modelo actual)
      - subscription_id
      - plan
      - MRR_contratado
      - frecuencia_cobro (mensual / multi-mes)
      - monto_cobrado
      - puerta_cierre
      - canal_origen
    - event: suscripcion_cambiada
      trigger: Upgrade, downgrade o add-on.
      properties:
      - subscription_id
      - MRR_anterior
      - MRR_nuevo
      - ts
      - iniciado_por (self-service / CSM / KAM)
      - motivo
    - event: suscripcion_cancelada / pago_fallido
      trigger: Cancelación voluntaria, fin de contrato o cobro fallido.
      properties:
      - subscription_id
      - ts
      - tipo
      - motivo
    - event: estancado_marcado / cerrado_sin_decision
      trigger: 'Regla automática: N semanas sin cambio de etapa ni actividad.'
      properties:
      - account_id u opp_id
      - etapa
      - dias_en_etapa
      - ultima_actividad_ts
      - puerta
      - destino (cerrado / reciclado a nurturing)
    - event: referido_registrado
      trigger: Un cliente refiere a otra cuenta.
      properties:
      - account_id_referente
      - account_id_referido
      - ts
    - event: gasto_registrado (Finanzas, mensual)
      trigger: Cierre contable del mes.
      properties:
      - mes
      - rubro
      - canal
      - campaña
      - puerta o regla_de_asignacion
      - monto
      - moneda o unidad
    required_dimensions:
    - dimension: Puerta de origen y puerta de cierre (Self Service / Assisted / Executive)
      why: Separa los journeys y registra los traspasos, como Self Service → Assisted. Generación de Demanda se
        evalúa por puerta de origen; el Team, por puerta de cierre.
    - dimension: Tipo de entrada (nuevo logo / ex-cliente / cliente activo)
      why: Evita inflar las entradas con reactivaciones y expansión.
    - dimension: Canal de adquisición, en primer toque y en creación (Digital pagado, Digital orgánico, No web,
        Referido, Partner, Outbound/KAM, Eventos; propuesta a validar)
      why: Permite asignar la Generación de Demanda y cruzar con los rubros de gasto (PaidMedia → Digital pagado;
        PublicidadNoWeb → No web).
    - dimension: Cohorte de entrada y cohorte de primer pago (mes o trimestre)
      why: Es la base de la conversión en ventana y de la retención por cohorte.
    - dimension: Madurez de la cohorte (ventana cumplida o abierta)
      why: Evita leer cohortes inmaduras como caídas; es el control de H-003.
    - dimension: Hito o etapa, con flag de salto
      why: Permite medir «alcanzó o superó» en vez de tasas etapa a etapa rotas.
    - dimension: Owner y rol (SDR, AE, KAM, sales-assist)
      why: Mide la capacidad y la productividad del Team.
    - dimension: 'Perfil: industria (ya existe) y tamaño'
      why: Permite comparar perfiles iguales en el test de H-003.
    - dimension: Tipo de precio y frecuencia de cobro (lista vs negociado; mensual vs multi-mes)
      why: Separa los prepagos de las cuentas realmente más grandes y limpia el valor inicial.
    decision_enabled: 'Dónde poner la próxima unidad de Inversión en Marketing (Generación de Demanda por canal),
      de Team (capacidad por puerta) y de Habilitación. Si conviene empujar Self Service, sumar sales-assist a las
      entradas estancadas o reforzar KAM y Executive. Y qué contestarle al CRO en Q-001: si «más entradas, no más
      clientes» se explica por volumen, tasa, mix, valor o madurez (H-003), y por lo tanto qué arreglar primero.'
    limitations:
    - 'Hoy no hay datos pre-venta: ninguna métrica del lado izquierdo se puede calcular con el modelo (regla del
      caso).'
    - La puerta no se puede inferir de los pagos, porque la firma de grilla no separa el tamaño. Hay que etiquetarla
      en origen.
    - El reloj arranca en la primera huella registrada. En Executive, parte del ciclo pasa fuera del CRM, así que
      los tiempos solo se comparan dentro de cada puerta.
    - El gasto viene por rubro, con unidad no documentada y sin margen bruto. El CAC y el payback por puerta dependerán
      de reglas de asignación, que son supuestos explícitos.
    - La atribución reparte crédito, no prueba causa. Para probar causalidad hacen falta experimentos o holdouts,
      que tendrían poco poder con ~55 altas por mes.
    - 'La ventana W equilibra rapidez frente a completitud: las cohortes más recientes siempre estarán incompletas.'
    - Con 30 a 84 altas por mes, abrir por puerta × canal deja celdas chicas. Hay que reportar por trimestre y exigir
      un n mínimo.
    - El churn y la reactivación hoy se observan en los pagos; no son eventos de contrato.
    implementation_implications:
    - 'CRM: campos obligatorios de puerta (origen y cierre), canal (primer toque y creación), owner y motivo de
      cierre, incluida la opción «sin decisión». También fechas de entrada y salida por etapa, que HubSpot calcula
      de forma nativa en los planes Professional y Enterprise.'
    - 'Una regla escrita para las etapas saltadas: la cuenta cuenta como «alcanzó» el hito saltado, con un flag,
      nunca como cero.'
    - 'Producto: definir con Growth el evento de activación o PQL a partir de uso real, y emitirlo.'
    - 'Facturación: subscription_id, MRR contratado, frecuencia de cobro y evento de cancelación. Sobre todo, la
      llave customer_id ↔ account_id, que hoy no existe y es la pieza crítica.'
    - 'Finanzas: gasto por canal y campaña, con unidad y moneda documentadas, y una regla para asignar Team y Payroll
      por puerta.'
    - 'Data Engineering (Propuesta de Modelo de datos): tablas de hechos para entradas, transiciones de etapa, oportunidades
      y eventos de suscripción; dimensiones de puerta y canal; puente cliente ↔ cuenta; y un mart de alcance por
      puerta × canal × cohorte × hito × ventana.'
    - 'Reporte: primero por puerta; el total, como suma de puertas con el mix explícito; las cohortes que no cumplieron
      la ventana, marcadas aparte.'
    - 'Mientras no llegue el CRM: construir el lado derecho con los datos actuales (altas, run-rate temprano en
      vez de M0, M3/M6, NRR por cosecha y reactivaciones aparte).'
