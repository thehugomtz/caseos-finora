cos_assessment:
  summary: 'R-016 le da al bloque CRO un método, no evidencia sobre causas. Propone un bowtie por puertas (Self
    Service, Assisted, Executive) con un nudo común, el primer pago. La conversión se mide por cohorte de entrada
    con ventana W, solo en cohortes que ya cumplieron esa ventana. También confirma que el lado izquierdo no se
    puede medir con los datos del caso: «llega más gente» (Q-001) no es verificable, mientras que el nudo y el lado
    derecho sí se ven. Ninguna hipótesis gana ni pierde soporte; H-003 queda con su test definido y sin datos.


    Lo que sí se mueve y te toca decidir:

    - el hito de adquisición del framing (R-016 propone el primer pago);

    - cómo responder Q-001 (en dos mitades);

    - una hipótesis puente para Q-003 (mezcla por puerta);

    - un posible choque entre F-143 («M0 no sirve como valor de entrada») y los «tickets de entrada» de T-004, T-018
    y T-019.


    Todo sigue siendo propuesta: F-140–F-144 no están aceptados.


    Siguientes pasos, en orden de desbloqueo:

    1. Decidir el nudo en el framing: primer pago, dejarlo abierto o suscripción activa.

    2. Revisar F-140–F-144. Aceptar F-140 implica la decisión del paso 1.

    3. Verificar qué mes usan T-004, T-018 y T-019. Si es M0, recalcular con el primer mes completo.

    4. Definir la respuesta de Q-001 en dos mitades: el nudo con datos y el lado izquierdo con la propuesta.

    5. Pasar R-016 como insumo a R-019 (en curso), para que la solución del CRO use el bowtie y no un funnel único.

    6. Consolidar la lista de Q-016 con R-007, R-010, R-014 y R-016, hipótesis por hipótesis.'
  run_id: RUN-20260929-110242-cos-2ab0
  at: '2026-09-29T11:38:42-06:00'
  impacts:
  - target: Q-001
    effect: changes_framing
    why: 'Según F-142, con el modelo actual «llega más gente» no se puede observar: es lo que dice el CRO, no un
      dato del caso (ni confirmado ni descartado). La otra mitad sí se ve en el nudo. Los primeros pagadores observados
      por mes subieron +104% entre 2022 y 2024 (T-019) y rondan 54–55 por mes en 2023–2024 (R-016). O sea, los nuevos
      sí crecieron; lo que no se puede ver es si crecieron menos que las entradas. Además, lo que cuenta como «cliente
      nuevo» mueve el conteo: las reactivaciones observadas equivalen al 18–38% de las entradas a pago, y el hito
      de adquisición sigue sin acordar (ver el impacto sobre el framing). Con los datos no se puede responder Q-001
      como «¿por qué?». Sí se puede responder qué pasó en el nudo y cómo medir el resto.'
  - target: H-003
    effect: requires_research
    why: 'R-016 no la sostiene ni la debilita: define su test y confirma que hoy no se puede correr. F-141 dice
      que la tasa de período castiga a las entradas recientes, y cuando el volumen crece ese es justo el mecanismo
      de H-003. El test es la conversión por cohorte de entrada con ventana W, solo en cohortes que ya la cumplieron.
      Para correrlo faltan las entradas con fecha (F-142) y el tiempo a pago por puerta, que es lo que fija W. Un
      límite útil: H-003 solo explica la brecha de las entradas más recientes que el tiempo típico a pago. Si la
      gente empezó a llegar hace más tiempo que eso y los nuevos siguen sin acompañar, H-003 no alcanza sola. No
      sabemos cómo calcula hoy el CRO su comparación.'
  - target: Q-003
    effect: opens_new_hypothesis
    why: 'El bowtie le da forma a Q-003. La adquisición (lado izquierdo, por puerta) se une en un solo punto, el
      primer pago, con lo que mueve el ingreso recurrente (lado derecho: retención, expansión, NRR). Hoy se ven
      el nudo y el lado derecho, pero no qué puerta trajo a cada cliente, y F-143 dice que el monto no reemplaza
      esa etiqueta. Eso abre una hipótesis puente que hoy no está en el caso: que la mezcla de entradas se movió
      hacia una puerta de menor valor. Explicaría a la vez R-003 (más primeros pagadores observados, con primer
      pago menor) y R-009 (la caída del monto por cliente activo se concentra en quién entra). Une H-002 (mezcla,
      lado Growth) con H-009 (entrantes, lado Revenue).'
  - target: Q-016
    effect: supports
    why: 'R-016 completa, para el lado izquierdo, la lista de evidencia mínima que dejó R-007 (bloqueada):

      - CRM con fecha por etapa, fuente y owner, que se pueda unir al ID de cliente de los pagos;

      - puerta y canal por cuenta, con la definición de Finora de cada puerta;

      - tiempo desde la entrada hasta el primer pago, por puerta (fija W y el umbral N);

      - gasto por canal, con unidad y moneda.

      También fija cómo medir: cohorte × ventana, tiempo a hito y estancamiento. Nada de tasas etapa a etapa, que
      se rompen con los saltos de etapa y por eso cambian el test de H-007. Tampoco tasas de período, que son las
      que afectan a H-003. Junto con R-010 y R-014, Q-016 ya se puede responder como una sola lista, hipótesis por
      hipótesis.'
  - target: framing
    effect: changes_framing
    why: 'El framing dejó abierto el hito de adquisición del CRO («Won, primer pago o suscripción activa siguen
      por acordar»). R-016 (F-140) propone el primer pago como nudo común. El razonamiento: si Self Service es compra
      sin intervención humana, no pasa por un Won comercial, y el primer pago es el único hito que comparten las
      tres puertas. Adoptar el bowtie tal cual es, en la práctica, cerrar ese punto, y eso te toca a ti. En los
      datos de hoy ese nudo sigue siendo «primera aparición observada», no una adquisición confirmada.'
  - target: T-004
    effect: requires_research
    why: F-143 dice que el primer pago (M0) no sirve como valor de entrada. R-003 trabaja explícitamente con el
      primer pago. T-004 y T-018 lo llaman «ticket de entrada» (mediana de COP 63,0 mil en 2022, 36,8 mil en 2023
