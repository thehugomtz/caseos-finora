  title: Altas, reactivaciones y churn observado por mes
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT month, active_customers, new_customers, reactivated_customers, churned_customers, total_paid_mrr_cop,
    new_mrr_cop, median_new_customer_mrr_cop FROM mart.monthly_metrics ORDER BY month
  verified: true
- id: DM-03
  title: Gasto S&M por año y grupo (Generación de Demanda, Team, Habilitación)
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT substr(month,1,4) AS yr, COUNT(*) AS months, SUM(demand_gen_spend) AS demand_gen, SUM(paid_media)
    AS paid_media, SUM(publicidad_no_web) AS publicidad_no_web, SUM(sales_capacity_spend) AS sales_capacity, SUM(team)
    AS team, SUM(payroll_expenses) AS payroll, SUM(travel) AS travel, SUM(enablement_spend) AS enablement, SUM(total_sm_spend)
    AS total_sm FROM mart.sm_monthly GROUP BY yr ORDER BY yr
  verified: true
- id: DM-04
  title: Distribución del primer pago (M0) de las altas limpias por tramo
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT CASE WHEN m0_cop < 30000 THEN 'a <30k' WHEN m0_cop < 60000 THEN 'b 30k-60k' WHEN m0_cop < 100000
    THEN 'c 60k-100k' WHEN m0_cop < 200000 THEN 'd 100k-200k' WHEN m0_cop < 500000 THEN 'e 200k-500k' ELSE 'f >=500k'
    END AS m0_band, COUNT(*) AS n_altas, SUM(m0_cop) AS sum_m0_cop, ROUND(100.0*COUNT(*)/SUM(COUNT(*)) OVER (),1)
    AS pct_altas, ROUND(100.0*SUM(m0_cop)/SUM(SUM(m0_cop)) OVER (),1) AS pct_m0 FROM mart.new_customers WHERE clean
    GROUP BY m0_band ORDER BY m0_band
  verified: true
- id: DM-05
  title: ¿El M0 alto es cuenta grande o pago mayor al usual?
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT CASE WHEN n.m0_cop < 100000 THEN 'a <100k' WHEN n.m0_cop < 500000 THEN 'b 100k-500k' ELSE 'c >=500k'
    END AS m0_band, COUNT(*) AS n_altas, SUM(CASE WHEN cm.multi_month_payment_signature > 1 THEN 1 ELSE 0 END) AS
    m0_multi_month_signature, SUM(CASE WHEN cm.amount_vs_usual_ratio > 1.5 THEN 1 ELSE 0 END) AS m0_above_1_5x_usual,
    quantile_cont(cm.usual_amount_cop, 0.5) AS median_usual_amount_cop FROM mart.new_customers n JOIN mart.customer_month
    cm ON cm.customer_id = n.customer_id AND cm.month = n.cohort_month WHERE n.clean GROUP BY m0_band ORDER BY m0_band
  verified: true
- id: DM-06
  title: Activos en M1 y M3 por cosecha (cohortes con M3 observable)
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT n.vintage, COUNT(*) AS n_altas, ROUND(100.0*AVG(CASE WHEN cm1.active_customer = 1 THEN 1 ELSE 0 END),1)
    AS pct_active_m1, ROUND(100.0*AVG(CASE WHEN cm3.active_customer = 1 THEN 1 ELSE 0 END),1) AS pct_active_m3,
    COUNT(cm3.customer_id) AS n_with_m3_observed FROM mart.new_customers n LEFT JOIN mart.customer_month cm1 ON
    cm1.customer_id = n.customer_id AND cm1.tenure_month = 1 LEFT JOIN mart.customer_month cm3 ON cm3.customer_id
    = n.customer_id AND cm3.tenure_month = 3 WHERE n.clean AND n.cohort_month <= '2024-07' GROUP BY n.vintage ORDER
    BY n.vintage
  verified: true
- id: DM-07
  title: Altas vs reactivaciones por año
  url: ''
  publisher: Modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT substr(month,1,4) AS yr, SUM(new_customers) AS altas_nuevas, SUM(reactivated_customers) AS reactivaciones,
    SUM(churned_customers) AS churn_observado, ROUND(100.0*SUM(reactivated_customers)/(SUM(new_customers)+SUM(reactivated_customers)),1)
    AS pct_reactivaciones_sobre_entradas FROM mart.monthly_metrics WHERE month >= '2022-03' GROUP BY yr ORDER BY
    yr
  verified: true
- id: DM-08
  title: Cantidad de montos usuales distintos entre las altas limpias
  url: ''
