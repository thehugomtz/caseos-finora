why_it_matters: ''
short_answer: La caída del ticket de entrada se sostiene con el ticket estabilizado. Con el segundo pago y el monto
  usual temprano, la mediana del ticket de entrada baja de COP 52,5 mil en 2022 a COP 36,8 mil en 2023, y el nivel
  de 2024 sigue por debajo de 2022. El «menor ticket» coincide con lo observado dentro de Producción, Restaurantes,
  Retail, Salud, Servicios profesionales y Tecnología. Señal direccional
headline: La caída del ticket de entrada se sostiene con el ticket estabilizado
what_is_established:
- 'Al excluir el primer pago, el nivel de entrada de las cohortes 2023 y 2024 se mantiene por debajo del de 2022:
  la mediana del segundo pago pasa de COP 52,5 mil a COP 36,8 mil y COP 38,9 mil. El movimiento no es monótono:
  2024 queda por encima de 2023.'
- 'El descenso no es un artefacto de medir el primer cobro: también aparece en el segundo pago y en el monto usual
  temprano, aunque desde un punto de partida más bajo que el primer pago de 2022 (COP 63,0 mil).'
- El efecto dentro de las industrias explica 91% del cambio 2022→2023 y 96% del cambio 2022→2024, frente a 9% y
  4% del mix. El nivel de 2024 es menor que el de 2022 en las industrias analizadas, con Salud como excepción en
  el tramo 2022→2023.
- En la cohorte 2022 el primer pago promedio (COP 128,7 mil) supera al pago promedio del segundo mes (COP 59,0 mil),
  y esa brecha desaparece en las cohortes siguientes, con razón 1,00 en 2023 y 0,93 en 2024. El patrón es consistente
  con pagos iniciales grandes y cobros retroactivos.
- No es posible separar cuánto del menor ticket corresponde a tarifas de lista, empaquetamiento, descuentos o créditos.
  Los datos no incluyen precios, planes, descuentos ni la definición contable del monto.
what_is_contested: []
what_remains_unknown:
- 'No se puede atribuir el menor ticket estabilizado a tarifas, planes, descuentos o créditos: faltan precios, planes,
  descuentos y la definición contable del monto, y no hay funnel ni atribución.'
- La brecha entre primer pago y ticket estabilizado en la cohorte 2022 coincide con pagos iniciales grandes y cobros
  retroactivos, por lo que no debe leerse como cambio de tarifa.
- 'El resultado no es homogéneo por industria: Salud se mantiene en COP 63,0 mil entre 2022 y 2023, con montos extremos
  y concentración en pocas cuentas.'
- 'No hay base para leer un descenso continuado: el ticket estabilizado de 2024 (COP 38,9 mil) queda por encima
  del de 2023 (COP 36,8 mil).'
alternative_explanations: []
case_implication: Si el ticket de entrada se usa como indicador de gestión, convendría definirlo como monto usual
  temprano por cohorte, dado que la caída 2022→2023 se sostiene con esa definición. Si se quiere actuar sobre el
  nivel de entrada, podría priorizarse la revisión dentro de cada industria, ya que el efecto dentro explica 91%
  del cambio 2022→2023 y 96% del cambio 2022→2024.
