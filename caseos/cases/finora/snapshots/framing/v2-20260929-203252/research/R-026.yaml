cos_assessment:
  summary: 'R-026 confirma que la caída del ticket de entrada no es un efecto del primer pago: también aparece en
    el monto que se repite. Es una señal direccional y sus findings siguen propuestos.


    **Cifras (medianas)**

    - **2.º pago:** baja de 52,5 mil en 2022 a 36,8 mil en 2023 y queda en 38,9 mil en 2024.

    - **Monto usual temprano:** 60,9 → 36,8 → 37,8 mil.

    - **Forma:** es un escalón 2022→2023, no una tendencia.

    - **Industrias:** 91–96% del cambio ocurre dentro de cada industria.


    **Qué pasa con el primer pago de 2022**

    - Sí está inflado: el promedio del primer pago es 128,7 mil y el del 2.º mes, 59,0 mil.

    - Por eso H-035, H-042 y H-046 se sostienen, pero solo como «parte»: la mayor parte de la caída de la mediana
    no viene del primer cobro.

    - El −60% en promedio (F-084) no sirve como tamaño de la caída.


    **Con alerta**

    - **C-003:** contar la caída con el ticket estabilizado.

    - **H-041:** hace falta un corte chico para saber si la base 2022 está limpia.

    - **H-032:** R-026 la contradice.


    **Sin alerta**

    - Ganan soporte H-030 (resuelve la tensión de X-018), H-045, C-007, C-008, C-015 y H-033.

    - En H-026 solo cambia con qué monto se prueba.

    - R-026 además responde lo que pedían X-035, X-041 y X-053, y les da contenido a X-075 y X-076.


    **Orden sugerido**

    1. Revisar F-160 a F-167. El caso tiene 0 findings aceptados, así que nada de esto entra a la story hasta esa
    revisión.

    2. Decidir C-003.

    3. Pedir el corte de H-041 junto con la serie mensual.

    4. Decidir H-032 y si fusionamos H-035, H-042 y H-046.'
  run_id: RUN-20260929-144317-cos-48de
  at: '2026-09-29T14:58:13-06:00'
  impacts:
  - target: C-003
    effect: changes_story
    why: 'R-026 muestra que la caída del ticket de entrada se sostiene con el ticket estabilizado (señal direccional;
      findings aún propuestos). La mediana del 2.º pago baja de 52,5 mil (2022) a 36,8 mil (2023) y 38,9 mil (2024),
      y la del monto usual temprano de 60,9 a 36,8 y 37,8 mil (F-160). El 91% y el 96% del cambio ocurren dentro
      de las industrias (F-164), y en 2024 el ticket está por debajo de 2022 en las 6 (F-163). La dirección de C-003
      aguanta, pero cambia cómo se cuenta: (1) Sus cifras de ticket (T-018, T-020, T-044) miden el primer pago,
      y la base 2022 del primer pago está inflada por pagos iniciales grandes: promedio de 128,7 mil contra 59,0
      mil del 2.º mes (F-166). (2) Es un escalón 2022→2023, no una tendencia: 2024 queda por encima de 2023 (F-161).
      (3) Salud no baja en 2022→2023 (F-165), así que «en las 6 industrias» vale para 2022→2024. (4) T-019 (+6%
      de valor inicial incorporado) no dice con qué monto se calcula; si usa el primer pago, hereda la base inflada
      de 2022. Esta evaluación le da contenido a X-075, que hoy solo marca linaje.'
  - target: H-041
    effect: requires_research
    why: R-026 muestra que el primer pago de 2022 está inflado por pagos iniciales grandes y cobros retroactivos
      (promedio de 128,7 mil contra 59,0 mil del 2.º mes; F-166), pero no separa por mes de alta. Eso encaja con
      el mecanismo de H-041 (un cliente previo al panel que vuelve pagando atrasos), aunque no lo prueba. Usar el
      2.º pago quita el efecto de esos atrasos, pero no quita a esos clientes de la cohorte. Si parte de los primeros
      pagadores de mar–may-22 son clientes previos al panel y pagan más que un cliente nuevo, la base 2022 del ticket
      estabilizado (52,5 mil) seguiría inflada y la caída a 36,8 mil estaría exagerada. Hoy no se sabe.
  - target: H-032
    effect: contradicts
    why: 'R-026 muestra que el primer pago queda igual o por encima del 2.º pago y del monto usual en las tres cohortes,
      y que esa brecha es mayor en 2022. H-032 predecía lo contrario: un primer pago por debajo del usual, con más
      brecha en 2023–2024. En medianas, el primer pago es de 63,0 / 36,8 / 42,0 mil y el monto usual temprano de
      60,9 / 36,8 / 37,8 mil (T-018, F-160). La razón entre medianas del 2.º y el 1.er pago es 0,83 en 2022, 1,00
      en 2023 y 0,93 en 2024 (F-166). Va en la línea de F-085. No descarta un subconjunto de primeros pagadores
      con primer mes parcial, pero sí la lectura general.'
  - target: H-035
    effect: supports
    why: 'R-026 confirma que hay una «parte» que viene del primer cobro. En 2022 el primer pago va por encima del
      2.º (razón entre medianas de 0,83) y en 2023 esa brecha desaparece (1,00) (F-166), así que la forma del primer
      cobro sí cambió entre cohortes. Pero esa parte es acotada. Con el 2.º pago, la caída de la mediana 2022→2023
      es de 52,5 a 36,8 mil (15,7 mil), no de 63,0 a 36,8 (26,2 mil) como en T-018. Con el monto usual temprano
      es de 60,9 a 36,8 (24,1 mil) (F-162). La mayor parte de la caída sigue en el monto que se repite. Un ajuste
      de redacción: «suscripciones más pequeñas» es una etiqueta contractual; lo que se observa es el monto pagado
      estabilizado.'
  - target: H-042
    effect: supports
    why: 'R-026 confirma la premisa: en 2022 el primer pago va por encima del recurrente, y esa brecha desaparece
      después (razón de 0,83 → 1,00 → 0,93; F-166). Pero en mediana 2022→2024 también bajó lo que se paga mes a
      mes. Con el 2.º pago la caída es de 52,5 a 38,9 mil (13,6 mil), frente a 63,0→42,0 (21,0 mil) con el primer
      pago. Con el monto usual es de 60,9 a 37,8 (23,1 mil), incluso mayor (F-160). Entonces «no a un cambio mes
      a mes» vale solo para la parte del primer cobro. En promedios, en cambio, el primer cobro pesa mucho: el primer
      pago promedio de 2022 (128,7 mil) más que duplica el del 2.º mes (59,0 mil). Por eso el −60% en promedio (F-084,
      el que cita X-068) mide sobre todo ese primer pago. R-026 no prueba la «baja de la cosecha 2022», que sigue
      abierta en X-062.'
  - target: H-046
    effect: supports
    why: 'Tiene el mismo mecanismo que H-035 y se apoya en F-086: el 23,2% de los primeros pagadores de 2022 hizo
      un primer pago muy por encima del 2.º. R-026 lo confirma para 2022 (primer pago promedio de 128,7 mil contra
      59,0 mil del 2.º mes; F-166). Pero «no de un nivel recurrente más bajo» no se sostiene para el resto de la
      caída: el monto que se repite también baja (2.º pago de 52,5 a 36,8 y 38,9 mil; F-160).'
  - target: C-007
    effect: supports
    why: 'R-026 le da a C-007 la pieza que le faltaba: «cosechas de menor ticket» no depende del primer pago. Las
      cohortes 2023 y 2024 también pagan menos en el 2.º pago (36,8 y 38,9 mil contra 52,5 mil en 2022; F-160),
      y el cambio ocurre dentro de las industrias (91% y 96%; F-164), en línea con X-059 sobre H-019. Lo mismo vale
      para C-002: los que entran pagan menos también en el 2.º pago. Hoy C-007 no tiene ninguna tabla de ticket
      entre las suyas (T-041, T-040, T-038, T-002). Ojo: que el cambio ocurra dentro de las industrias descarta
      la mezcla de industrias, no la de canal o motion; H-036 y H-038 siguen sin datos para probarse. Esta evaluación
      le da contenido a X-076.'
  - target: H-030
    effect: supports
    why: 'H-030 dice que el ticket de entrada bajó antes de 2024 y se mantuvo de 2023 a 2024; así hace compatibles
      R-003/R-009 con lo que dice R-010 («el monto por alta no cayó»). R-026 lo muestra con el ticket estabilizado.
      El escalón es 2022→2023: el 2.º pago va de 52,5 a 36,8 mil y el monto usual de 60,9 a 36,8. De 2023 a 2024
      no baja: queda en 38,9 y 37,8 mil (F-161, F-162). Es la pieza que resuelve la tensión de X-018.'
  - target: H-045
    effect: supports
    why: 'El patrón de R-026 encaja con un cambio general en la entrada entre las cohortes 2022 y 2023. Es un escalón
      y no una tendencia (F-161), ocurre dentro de las industrias (91%; F-164) y coincide con un cambio en la forma
      del primer cobro (la razón entre medianas del 2.º y el 1.er pago pasa de 0,83 a 1,00; F-166). Tiene tres límites.
      Primero, las cohortes son anuales, así que no permiten ubicar el cambio en «inicios de 2023». Segundo, Salud
      no baja hasta 2024 (F-165), lo que no encaja del todo con un cambio general, salvo que sea ruido de pocas
      cuentas. Tercero, R-026 no puede decir qué cambió: oferta, plan, Canal de adquisición o forma de cobro (F-167).'
  - target: C-008
    effect: supports
    why: Con el monto usual temprano, en 2024 Salud (48,8 mil) queda a la par de Restaurantes (48,3 mil) y por encima
      de Producción (37,8) y Retail (25,2) (F-163). En el texto que tengo no aparecen las cifras de Servicios profesionales
      ni de Tecnología. Aun así, el «ticket alto» de C-008 no depende del primer pago. R-026 agrega dos matices
      que caben en «señal a validar» y conviene escribir como limitación. Salud no bajó en 2022→2023 pero sí en
      2024 (63,0 → 48,8 mil; F-165). Y sus montos tienen extremos y se concentran en pocas cuentas.
  - target: C-015
    effect: supports
    why: 'C-015 dice que lo observable es el primer y el 2.º pago, y que el descuento no es verificable. R-026 es
      justo ese análisis (2.º pago y monto usual por cohorte e industria; F-160 a F-166) y confirma el límite: el
      menor ticket estabilizado no se puede atribuir a tarifas, planes, descuentos ni créditos (F-167).'
  - target: H-033
    effect: supports
    why: En 2022 el primer pago promedio (128,7 mil) más que duplica el del 2.º mes (59,0 mil), y en 2023 la brecha
      de medianas desaparece (F-166). En el puente (T-003), esa bajada del primer al 2.º mes cuenta como contracción.
      Así que R-026 apoya el mecanismo de H-033 (cargos iniciales o cobros que cubren varios meses) para los primeros
      pagadores de 2022, y sugiere que pesa menos desde 2023. No mide qué parte del COP de contracción viene de
      ahí; eso le toca a R-028.
  - target: H-026
    effect: requires_research
    why: 'R-026 no mide bandas de ticket, así que no sostiene ni debilita H-026. Pero cambia con qué monto hay que
      probarla. Si se usan bandas del primer pago (como la cola alta de T-042), 2022 aparece con más entradas de
      ticket alto de las que hay en el monto que se repite. La razón: el primer pago promedio de 2022 más que duplica
      el del 2.º mes (F-166), y el 23,2% de los primeros pagadores de 2022 hizo un primer pago muy por encima del
      2.º (F-086).'
