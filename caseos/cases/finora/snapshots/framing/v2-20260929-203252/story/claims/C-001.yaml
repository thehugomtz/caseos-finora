limitations:
- 'Pendiente de tu aceptación: F-071, F-072, F-001, F-002 y F-074 están propuestos.'
- Es monto pagado observado (campo amount con escala fija), no MRR contratado (F-082).
- Cliente activo = pago mayor que cero en el mes. Un cliente sin pago puede estar cancelado, en pausa o atrasado
  (F-082).
- Es stock con ventana completa desde ene-22; los flujos arrancan en mar-22 (F-074).
- 'El −38% no se presenta como deterioro de la salud: todavía no separa la mezcla de entrada, el precio y las salidas.'
visual_intent: 'Una línea: MRR pagado por cliente activo, en COP, de ene-22 a oct-24 (T-027): de COP 92,8 mil a
  57,8 mil (−38%). Si hace falta la comparación, en apoyo: clientes activos y MRR pagado en la misma gráfica, cada
  uno con ene-22 = 100 (T-001), las dos líneas juntas.'
hugo_wording: Finora suma clientes mucho más rápido que monto pagado (4,5× vs 2,8×; ~−38% por cliente activo). Esa
  brecha abre Growth y Revenue.
