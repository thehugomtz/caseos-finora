id: C-016
type: claim
key: monto-dos-lecturas
question: 'Paga 100 y luego 80; la suscripción pasa de 100 a 130 con un descuento de 30 y sigue pagando 100; desaparece
  el descuento: ¿se puede leer cada caso con el monto pagado?'
headline: Con solo el monto pagado, cada ejemplo del CFO admite lecturas distintas
answer: 'Con cliente, mes y monto, pasar de 100 a 80 puede ser una suscripción más chica, un descuento o un cobro
  que cambió de mes. Seguir en 100 con la suscripción en 130 no se distingue de «sin cambio», y el fin del descuento
  se vería como expansión. En los datos pasa algo parecido: 25,3% del movimiento bruto sin altas vuelve exacto al
  nivel previo al mes siguiente, 29% del MRR de expansión se revierte, 32% de los retornos tras meses sin pago liquida
  exactamente los meses pendientes y hay 260 eventos de ajuste con cobro retroactivo exacto. El monto no trae lista,
  descuento, crédito ni pausa.'
