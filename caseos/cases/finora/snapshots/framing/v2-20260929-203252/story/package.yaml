  key: metricas-semaforo
  question: ¿Qué otras métricas hay que proponer y cómo se mide cada una?
  headline: 'Proponemos métricas comunes MECE con semáforo: qué se mide hoy y qué falta'
  answer: 'A tu lista (MRR, ARR, ARPU, CAC, LTV, Churn, UCM) se suman el churn persistente, las capas de lista,
    descuento y neto, el quick ratio, NRR/GRR, el payback y LTV:CAC. Regla MECE: cada métrica vive en un solo lugar.
    Lo que pasa hasta Won y el primer pago está en el funnel (C-006); lo que pasa con la cuenta que ya paga está
    aquí, como común. Puerta, ruta, canal, industria y cohorte son cortes, no métricas nuevas. Semáforo: verde =
    se calcula hoy con nombre honesto; amarillo = proxy con una regla por aprobar; rojo = falta el dato. RESULTADO
    · MRR pagado observado = suma de lo pagado en el mes (verde) · MRR normalizado = cada pago repartido entre los
    meses que cubre (amarillo) · ARR run-rate = MRR normalizado anualizado (amarillo) · MRR de lista, descuento
    recurrente y MRR neto = lista − descuento; el descuento es el revenue que dejamos de capturar (rojo, se detalla
    en S3). MOVIMIENTO · puente: MRR nuevo + expansión + reactivación − contracción − churn = cambio del MRR (verde
    sobre monto pagado, se lee con cuidado); en el to-be suma la línea Descuento y deja el efecto de cobro fuera
    del MRR · quick ratio = entradas ÷ salidas del puente, trimestral (verde). CLIENTES · clientes activos = clientes
    con pago en el mes (verde) · churn de logos observado = los que dejan de pagar ÷ activos del mes previo (verde)
    · churn persistente = los que no vuelven a pagar en un trimestre ÷ activos del mes previo (amarillo): 3,52%
    contra 0,98% en 2022 y 2,04% contra 0,96% en 2024 · reactivaciones, como loop de Revenue (verde) · ARPA = MRR
    ÷ clientes activos, por cohorte; es lo que se pide como ARPU (verde; por usuario, rojo). RETENCIÓN POR COHORTE
    DE PRIMER PAGO · logos que siguen pagando en M3, M6 y M12 (verde) · NRR = MRR actual de la cohorte ÷ su MRR
    inicial · GRR = lo mismo sin expansión (verdes sobre monto pagado, no contractuales). EFICIENCIA · CAC = gasto
    de S&M ÷ nuevas cuentas; por canal y ruta = gasto del canal ÷ Won del canal (hoy solo el proxy de C-010) · payback
    = CAC ÷ (valor de entrada × margen bruto), en meses (rojo) · LTV empírico de ingreso = ingreso acumulado por
    alta a horizonte fijo, por cohorte (verde) · LTV con margen y LTV:CAC (rojos) · UCM = ARPA − costo variable
    de servir (rojo).'
