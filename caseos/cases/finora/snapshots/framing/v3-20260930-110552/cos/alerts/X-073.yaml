title: R-021 cambia el framing D-007
finding_text: 'Se puede, con una condición: el descuento tiene que existir en los datos como objeto propio (tipo,
  monto, inicio, fin, motivo, Canal y aprobador), separado de la cantidad contratada y del precio de lista. Además,
  el puente de MRR necesita líneas propias de «descuento nuevo/aumentado» y «descuento r…'
why: 'R-021 es, en la práctica, una Propuesta de Modelo de datos (objeto descuento, tres capas y líneas nuevas en
  el puente). Mientras tanto, D-007 sigue activa: «Solución fuera de esta etapa → sin dashboards, métricas definitivas,
  modelo de datos ni deck». El brief sí le pide al bloque CFO «mecanismo, modelo de datos y clasificación», y D-015,
  que metería en el plan lo que el caso pide proponer, sigue sin confirmar. Si R-021 (y también R-011, R-016, R-018
  y R-019) entran así a la historia, pasan por encima de D-007 sin que lo hayas decidido.'
options:
- key: A
  label: Confirmar D-015 y sustituir D-007 con una decisión nueva que la cite
  consequence: La nueva decisión dice a qué etapa aplicaba D-007 y qué sigue fuera. Las propuestas entran a la historia
    como propuestas y el registro de decisiones queda limpio, sin borrar D-007.
- key: B
  label: Mantener D-007 tal cual
  consequence: R-021 queda como insumo interno y el bloque CFO se queda sin la parte de mecanismo, modelo de datos
    y clasificación que pide el brief.
- key: C
  label: Resolverlo al abrir Story
  consequence: Hoy no cambia nada, pero el borrador de storytelling que delegaste en D-016 podría incluir el modelo
    con D-007 todavía activa.
recommended: A
recommended_why: 'Es una decisión corta que desbloquea de una vez cinco research de propuesta y cumple la regla
  de no sobreescribir en silencio: D-007 no se borra, se sustituye con referencia.'
