id: D-021
type: decision
title: 'R-013 cambia el framing Q-018: Sin impacto material'
date: '2026-09-29'
context: 'R-013 deja el gasto de S&M en unidades reportadas (u), sin moneda ni escala (F-063), y con un corte en
  jun-23. Hasta may-23 Team es un 12% fijo del total, lo que calza con una asignación y no con una medición propia;
  después se mueve entre 19% y 38% (F-066). Además, Habilitación pierde Freelance y desde entonces es solo SoftwareTools
  (F-067). El archivo solo trae el nombre del rubro y el monto mensual, así que no se puede asignar gasto a industrias
  ni a pagadores: solo se puede ver si se mueven juntos en el tiempo. Q-018 pide cruzar gasto por categoría con
  nuevos pagadores y monto pagado. Hoy ese cruce solo se sostiene en términos relativos (índices, participaciones,
  fechas). No se puede sacar gasto en COP por pagador ni dividir monto pagado entre gasto (serían COP sobre u).
  Y cualquier comparación por categoría que cruce jun-23 mezcla un cambio del archivo con un cambio de gasto. R-015,
  que está en curso, hace justo este cruce por industria.'
options:
  A: Acotar Q-018 a lo que el archivo sostiene y pasarle las mismas reglas a R-015 antes de que cierre
  B: Mantener Q-018 como está, con advertencias al pie
  C: Suspender Q-018 hasta que Finora dé moneda, escala y método de asignación
agent_recommendation: 'A — Es lo único defendible hoy sin inventar una escala. Lo que falta (moneda, escala, centro
  de costo, método) no se pierde: se nombra como hueco del WoW de Finora, que ya forma parte de la pregunta ejecutiva.'
user_choice: Sin impacto material
