headline: Entre los meses-cliente de clientes activos con al menos un mes de antigüedad, los pagos por debajo del
  monto usual del cliente pasan de 20,7% en 2022 a 8,8% en 2023 y 2,9% en 2024, los pagos por encima del monto usual
  pasan de 10,4% a 18,3% y la firma de pago de varios meses pasa de 6,8% a 1,8%.
