id: F-251
type: finding
headline: 'Los dos híbridos necesitan holdout: comparar tocados vs no tocados asigna crédito, pero no prueba que
  la persona causó el Won o el MRR.'
evidence_text: Product-led sales propone comparar la conversión de PQL tocados por ventas contra la tasa self-serve
  y el ACV de ambos caminos. La literatura de incrementalidad separa atribución (con qué interactuó el cliente)
  de causa (un grupo de control que no recibe el toque).
confidence: medium
limitations:
- 'Un holdout implica no contactar a una parte de las cuentas: tiene costo comercial, y no sabemos qué tamaño de
  muestra hace falta.'
kind: measurement
claims:
- claim: En product-led sales se propone comparar la conversión de PQL tocados por ventas con la tasa self-serve
    y el ACV de ambos caminos, y medir el tiempo a convertir como mediana desde el registro o el PQL hasta el primer
    pago.
  source_id: web4
