query: '-- E-003

  WITH m AS (SELECT month, month AS periodo, SUM(paid_mrr_cop)::DOUBLE / NULLIF(SUM(active_customer), 0) AS valor
  FROM mart.customer_month WHERE month BETWEEN ''2022-01'' AND ''2024-10'' GROUP BY ALL) SELECT periodo, arg_max(valor,
  month) AS valor, max(month) AS mes_cierre, COUNT(*) AS meses FROM m GROUP BY ALL ORDER BY periodo


  -- E-007

  run_analysis(''vintage_arpa'', {"desde": "2022-01", "hasta": "2024-10"})'
