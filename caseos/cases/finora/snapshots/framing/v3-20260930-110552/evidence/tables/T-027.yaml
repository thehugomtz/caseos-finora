message: El MRR por cliente activo, definido como MRR pagado dividido entre los clientes con pago mayor que cero
  en el mes y expresado en COP tras aplicar la escala fija del campo amount, pasa de COP 92,8 mil en ene-22 a COP
  57,8 mil en oct-24, una variación de −38%.
