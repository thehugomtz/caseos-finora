definitions:
  Ticket de entrada (M0): MRR pagado por un cliente nuevo en su primer mes. Se reporta como promedio (MRR nuevo
    ÷ altas), mediana y percentiles.
  Altas (clientes nuevos): Clientes con MRR pagado mayor que cero en el mes y que nunca antes habían pagado.
message: 'La señal de adquisición no continúa en el último tramo: entre 2023 y 2024 el ticket de entrada promedio
  pasa de COP 47,9 mil a COP 50,8 mil y la mediana de COP 36,8 mil a COP 42,0 mil, mientras las altas por mes se
  mantienen en 54,2 y 55,4.'
