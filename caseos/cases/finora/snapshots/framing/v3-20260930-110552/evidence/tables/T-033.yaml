query: '-- E-005

  SELECT substr(month, 1, 4) AS periodo, COUNT(*) AS altas, AVG(m0) AS valor, MEDIAN(m0) AS mediana, quantile_cont(m0,
  0.25) AS p25, quantile_cont(m0, 0.75) AS p75, quantile_cont(m0, 0.9) AS p90 FROM (SELECT month, industry, vintage,
  paid_mrr_cop::DOUBLE AS m0 FROM mart.customer_month WHERE new_customer = 1) WHERE month BETWEEN ''2022-03'' AND
  ''2024-10'' GROUP BY ALL ORDER BY periodo


  -- E-004

  SELECT substr(month, 1, 4) AS periodo, SUM(new_customer) AS valor, COUNT(DISTINCT month) AS meses, (SUM(new_customer))
  / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10''
  GROUP BY ALL ORDER BY periodo'
