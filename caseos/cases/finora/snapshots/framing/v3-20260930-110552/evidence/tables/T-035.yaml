definitions:
  Reactivaciones: Clientes que vuelven a pagar después de al menos un mes en cero.
  Churn mensual observado (logos): Churn observado del mes dividido entre clientes activos del mes anterior.
message: 'Las reactivaciones por mes se mantienen en un rango estrecho a lo largo del periodo: 16,6 en 2022 (mar–dic),
  11,7 en 2023 y 16,2 en 2024, frente a 198 y 279 eventos de churn observado en esos mismos años.'
