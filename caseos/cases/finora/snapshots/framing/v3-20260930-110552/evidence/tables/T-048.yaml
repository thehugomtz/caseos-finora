message: 'Salud combina el menor churn persistente (0,56 puntos porcentuales mensuales), el mayor ticket de entrada
  mediano de 2024 (COP 52,5 mil, igualado con Restaurantes) y el menor volumen: 124 clientes activos en oct-24 frente
  a 459 en Restaurantes.'
