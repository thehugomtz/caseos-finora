message: 'No es evaluable con estos datos si la pérdida de crecimiento se concentra en un tipo de cliente más allá
  de la industria observada: no hay tamaño de cliente ni segmentación adicional, ni precios, descuentos o motivos
  de churn, y el estado de la suscripción no se distingue de una pausa de pago.'
