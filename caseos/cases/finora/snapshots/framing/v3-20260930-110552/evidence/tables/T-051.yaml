message: El primer pago observado de las altas tiene una mediana de COP 63,0 mil en 2022, COP 36,8 mil en 2023 y
  COP 42,0 mil en 2024, con un rango intercuartílico en 2024 entre COP 25,2 mil y COP 60,9 mil.
