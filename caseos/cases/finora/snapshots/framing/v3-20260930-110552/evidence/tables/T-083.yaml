query: "-- E-010\nWITH b AS (\n  SELECT customer_id, month, month_index, paid_mrr_cop, reactivated_customer, reactivation_mrr_cop,
  active_customer,\n    MAX(CASE WHEN active_customer=1 THEN month_index END) OVER (PARTITION BY customer_id ORDER
  BY month_index ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS last_idx\n  FROM mart.customer_month\n), r
  AS (\n  SELECT CASE WHEN CAST(substr(month,6,2) AS INT) <= 6 THEN substr(month,1,4) || ' S1' ELSE substr(month,1,4)
  || ' S2' END AS semestre,\n    reactivation_mrr_cop AS mrr, (month_index - last_idx) AS gap\n  FROM b WHERE reactivated_customer=1
  AND month >= '2022-03' AND month <= '2024-10'\n)\nSELECT semestre,\n  ROUND(SUM(mrr)) AS mrr_reactivacion_cop,\n
  \ ROUND(100.0*SUM(CASE WHEN gap=2 THEN mrr ELSE 0 END)/NULLIF(SUM(mrr),0),1) AS share_hueco_un_mes_pct\nFROM r
  GROUP BY semestre ORDER BY semestre\n\n-- E-008\nWITH b AS (\n  SELECT customer_id, month, month_index, paid_mrr_cop,
  reactivated_customer, reactivation_mrr_cop,\n    MAX(CASE WHEN active_customer=1 THEN month_index END) OVER (PARTITION
  BY customer_id ORDER BY month_index ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS last_idx,\n    LAST_VALUE(CASE
  WHEN active_customer=1 THEN paid_mrr_cop END IGNORE NULLS) OVER (PARTITION BY customer_id ORDER BY month_index
  ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING) AS prev_amt\n  FROM mart.customer_month\n), r AS (\n  SELECT
  reactivation_mrr_cop AS mrr,\n    (month_index - last_idx) AS gap,\n    paid_mrr_cop / NULLIF(prev_amt,0) AS ratio\n
  \ FROM b WHERE reactivated_customer=1 AND month >= '2022-03' AND month <= '2024-10' AND prev_amt > 0\n), k AS
  (\n  SELECT mrr, CASE\n    WHEN gap = 2 AND ratio BETWEEN 0.95 AND 1.05 THEN 'A. Un mes sin pago, regresa al monto
  previo'\n    WHEN gap = 2 THEN 'B. Un mes sin pago, monto distinto del previo'\n    WHEN gap >= 3 AND abs(ratio
  - (gap-1)) <= 0.05*(gap-1) THEN 'C. Varios meses sin pago, monto cubre los meses pendientes'\n    ELSE 'D. Varios
  meses sin pago, otro monto' END AS clase\n  FROM r\n)\nSELECT clase, COUNT(*) AS eventos, ROUND(SUM(mrr)) AS mrr_cop,\n
  \ ROUND(100.0*SUM(mrr)/SUM(SUM(mrr)) OVER (),1) AS share_pct\nFROM k GROUP BY clase ORDER BY clase"
