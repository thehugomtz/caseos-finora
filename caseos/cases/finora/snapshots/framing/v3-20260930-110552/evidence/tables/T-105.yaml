query: "-- E-003\nWITH s AS (SELECT month, total_sm_spend, team FROM mart.sm_monthly),\nn AS (SELECT month, new_customers
  FROM mart.monthly_metrics)\nSELECT s.month AS mes,\n       ROUND(s.total_sm_spend,3) AS sm_total_u,\n       ROUND(s.team
  / NULLIF(s.total_sm_spend,0),4) AS team_participacion,\n       n.new_customers AS altas_mismo_mes,\n       LEAD(n.new_customers)
  OVER (ORDER BY s.month) AS altas_mes_siguiente\nFROM s LEFT JOIN n ON n.month = s.month\nORDER BY s.month"
