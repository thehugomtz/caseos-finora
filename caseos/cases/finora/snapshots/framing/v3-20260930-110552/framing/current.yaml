storyline_guide:
- id: S1
  title: Overview
  purpose: 'Situación (Overview): Finora suma clientes mucho más rápido que monto pagado (4,5× vs 2,8×; ~−38% por
    cliente activo, periodo por fijar). Esa brecha abre Growth y Revenue.'
  slides:
  - id: S1.1
    title: Overview
    question: ''
    intent: observaciones generales y salud del negocio que introducen las secciones siguientes (p. ej. clientes
      4,5× vs ingreso 2,8×; MRR por cliente activo −38%)
    notes: Migrado de Entregables del brief.
    links: []
- id: S2
  title: Growth
  purpose: 'Growth, lo que sí vemos: los primeros pagadores observados y su actividad económica por industria, y
    el gasto de Marketing por categoría en el tiempo, descritos sin atribuir ventas al gasto.

    Growth, lo que no vemos: no todos recorren el funnel igual (propuesta: Assisted, Self Service, Executive). Demanda,
    calidad, capacidad/atención y post-SQL quedan como explicaciones a contrastar, cada una con el dato que permitiría
    elegir.

    Growth, cómo operarlo: primero definiciones y fuentes comunes; después, seguimiento recurrente por foros (dashboards,
    análisis ad hoc, agentes), atado a decisiones del CRO que aún no están definidas.'
  slides:
  - id: S2.1
    title: Las relaciones que comentó Hugo
    question: ''
    intent: las relaciones que comentó Hugo (por precisar)
    notes: Migrado de Entregables del brief (L1).
    links: []
  - id: S2.2
    title: Entradas y actividad económica de clientes y segmentos
    question: ''
    intent: 'Revisar entradas y actividad económica de clientes y segmentos; inversión de S&M por categoría (generación
      de demanda ToFu: Paid Media y publicidad no web · Team: Payroll Expenses y Travel · habilitación, ¿producto?:
      Software Tools y Freelance) y hasta dónde se puede relacionar con ventas cruzando fechas'
