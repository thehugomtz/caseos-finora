- id: RT-029
  question: Con las definiciones textuales de Hugo, ¿cuál es el mix MECE de funnels —Executive (el funnel actual
    SDR→AE), Self Service con sus canales, Hybrid (casos A y B) y Reactivate (leads estancados que se reactivan
    y se asignan a un funnel)—, las etapas de cada uno, la regla que pone a cada lead en uno solo y las métricas
    de cada casuística?
  kind: measurement
