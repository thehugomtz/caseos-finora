research_plan:
- id: RT-001
  question: ¿Qué hipótesis ToFu y BoFu podrían explicar «más leads, pero no más ventas»? ¿Y qué información mínima
    validaría o descartaría cada una (entradas únicas con fecha, señales iniciales, recorrido, atención, vínculo
    con pago)?
  kind: measurement
  agent: measurement
  intensity: L2
  work: propuesta
  draft_answer: 'Las ordenaría por la parte del motor donde pegan. En ToFu: la entrada total no creció tanto como
    New (H-001), la mezcla cambió hacia gente que compra menos o más tarde (H-002), o bajó la calidad de la máquina
    de leads (H-005). En medio: la capacidad instalada no alcanza y la atención se demora (H-006). En BoFu: el deterioro
    aparece más abajo, por ejemplo después de SQL (H-007), o cambiaron precio, producto o alternativas (H-008).
    Y aparte está el tiempo: lo reciente todavía no tuvo oportunidad de comprar (H-003, H-004). Cada una se valida
    con un dato que no está en el caso: entradas únicas con fecha y canal, señales al entrar, etapa y fecha por
    lead, carga por SDR/AE y el vínculo lead → primer pago. Con los pagos solo se ve a quien ya compró, así que
    hoy no se puede elegir entre ellas (R-007). La lámina es la matriz hipótesis → dato → qué la valida o la descarta.'
  hugo_said:
  - text: La calidad de la máquina de leads bajó
    ref: H-005
  - text: La capacidad comercial instalada no alcanza la demanda generada
    ref: H-006
  - text: Mucho de eso se responde con propuestas por que no hay data
    ref: D-015
  steps:
  - kind: proposal
    what: Árbol de hipótesis sin huecos ni traslapes (ToFu, capacidad/atención, BoFu y tiempo), amarrado a H-001…H-008,
      con H-005 y H-006 como ramas en tus palabras.
    where: []
  - kind: proposal
    what: 'Para cada hipótesis: dato mínimo, comparación justa (mismo grupo de entrada, misma ventana de maduración),
      qué la valida, qué la descarta y si hace falta un experimento.'
    where: []
  - kind: proposal
    what: 'Inventario consolidado de información mínima (campos y grano: lead, evento de etapa con fecha, dueño,
      puerta/canal, vínculo con el primer pago), que después alimenta la capa técnica de S2.7.'
    where: []
  why: 'Convierte «más leads, pero no más ventas» en hipótesis con el dato que las decide, y la que no tenga dato
    posible sale de la historia (versión mejorada de RT-001: suma S2.6, respuesta de arranque y pasos, sin research
    en data, como pediste).'
  links:
  - Q-001
  - Q-004
  - Q-005
  - Q-006
  - Q-016
  - Q-021
  - Q-023
  - H-001
  - H-002
  - H-003
  - H-004
  - H-005
  - H-006
  - H-007
  - H-008
  slides:
  - S2.6
  flags: []
  status: sent
  research_id: R-010
  approved_at: '2026-09-29T10:31:37-06:00'
  sent_at: '2026-09-29T10:32:02-06:00'
- id: RT-002
  question: ¿Cómo separar el valor de la suscripción del precio efectivamente pagado y clasificar el inicio y el
    fin de un descuento sin confundirlos con contracción o expansión reales? Propuesta de modelo de datos (campos,
    tablas, definiciones) y qué evidencia confirmaría vigencia, características contratadas, tarifa y descuento
    aplicado.
  kind: data_model
  agent: data_engineering
  intensity: L2
  work: propuesta
  draft_answer: 'Pasar de un número a una cadena: valor de la suscripción (plan y características a tarifa de lista,
    con vigencia) → descuento (monto o %, inicio, fin, motivo) → monto facturado → monto pagado. Con esa cadena,
    cada cambio del mes se parte en componentes: expansión o contracción real, cambio de tarifa, inicio/cambio/fin
    de descuento, churn o reactivación, y diferencias de cobro. Así el fin de un descuento sale como «fin de descuento»
    y no como expansión, y en el 100→130 con −30 la expansión queda registrada aunque el pago siga en 100. En tablas:
    suscripción con vigencia, lista de precios con vigencia, descuento con fechas y un corte mensual por cliente
    con el puente ya clasificado. Lo que no sabemos es qué sistema de Finora (billing, contratos, CRM) tiene hoy
    vigencia, tarifa y descuento.'
  hugo_said:
  - text: ¿Cómo separarías el valor de la suscripción del precio efectivamente pagado? ¿Qué campos, tablas o definiciones
      agregarías? → Propuesta de Modelo de datos / ¿Cómo clasificarías el inicio y el fin de un descuento…? También
      entra dentro de Propuesta de Modelo de datos
    ref: N-029
  - text: Hoy existe un histórico con cliente + mes + monto pagado, y los cambios entre meses se usan para clasificar
      movimientos como crecimiento, contracción, churn o reactivación.
    ref: N-030
  - text: ¿Qué pasa si su suscripción creció de 100 a 130, pero tiene un descuento de 30 y sigue pagando 100? /
      Si un cliente pagaba 100 y ahora paga 80, ¿contrajo 20 o recibió un descuento? / ¿Y cuando desaparezca el
      descuento, eso cuenta como expansión?
    ref: Q-025
  steps:
  - kind: data
    what: Mapear el grano y las banderas actuales (movement_type, expanded_customer, contracted_customer, churned_customer,
      reactivated_customer) y el puente mensual, y marcar cuáles cambian de significado cuando existan descuentos.
      Partir de R-002 y R-008 sin repetirlos.
    where:
    - mart.customer_month
    - mart.monthly_metrics
  - kind: research
    what: Cómo modelan suscripción, lista de precios, descuento y factura los sistemas de cobro por suscripción
      (objetos, vigencias, prorrateo), para apoyar el diseño en prácticas comunes y no inventarlo.
    where: []
  - kind: proposal
    what: 'Modelo en papel: entidades, grano, campos y definiciones (suscripción con vigencia y características,
      lista de precios con vigencia, descuento con inicio/fin/motivo, factura y pago, corte mensual por cliente),
      y qué fuente de Finora confirmaría cada campo.'
    where: []
  - kind: proposal
    what: 'Reglas de clasificación: los movimientos del valor de la suscripción (nuevo, expansión, contracción,
      churn, reactivación) van separados de los comerciales (cambio de tarifa, inicio/cambio/fin de descuento) y
      de las diferencias de cobro. El descuento de quien se va se cierra con la salida, no como fin de descuento.
      Probarlas con los tres ejemplos de Q-025 (construidos, no observados) y con la métrica de revenue no capturado
      hacia adelante.'
    where: []
  why: 'Es lo que le da una sola lectura a cada ejemplo del CFO; sin esto, el MRR con descuentos sigue siendo ambiguo
    (versión mejorada de RT-002: la amplío a S3.3 y S3.4 porque la evidencia que pedía son justo los campos del
    modelo, y S3.4 va dentro, como dijiste).'
  links:
  - N-029
  - N-030
  - Q-002
  - Q-009
  - Q-011
  - Q-017
  - Q-025
  - Q-026
  - H-012
  - H-013
  - H-014
  - H-015
  - H-016
  slides:
  - S3.3
  - S3.4
  flags: []
  status: sent
  research_id: R-011
  approved_at: '2026-09-29T10:31:37-06:00'
  sent_at: '2026-09-29T10:32:02-06:00'
- id: RT-003
  question: ¿Qué periodo, meses completos, escala a COP y definición de cliente activo están detrás del 4,5×, el
    2,8× y el −38% del Overview? ¿Y qué señales de salud del modelo abren Growth y Revenue sin llamarlas deterioro?
  kind: data
  agent: analytics
  intensity: analytics
  work: datos
  draft_answer: 'Mi arranque es contar el Overview como una observación, no como un diagnóstico. Finora suma clientes
    (pagadores observados) mucho más rápido que monto pagado, y lo investigado (R-003 y R-009, todavía sin aceptar)
    apunta a que la brecha viene de quién entra, con un primer pago más bajo, más que de la base previa. Antes de
    ponerlo en lámina hay que fijar una sola ventana: R-005 compara dic-22 contra oct-24 y R-003 usa periodos comparables
    con un chequeo mar–oct. Después hay que confirmar que el 4,5× y el 2,8× salen de esa ventana. En la lámina se
    habla de monto pagado observado, no de MRR contratado, y no se usa la palabra «deterioro» hasta separar mezcla,
    precio y salidas.'
  hugo_said:
  - text: 'Finora crece mucho más en clientes (4,5×) que en ingreso (2,8×): el MRR por cliente activo cayó 38%,
      de COP 92,8 mil a COP 57,8 mil.'
    ref: N-020
  - text: 'el storytelling lo visualizo más o menos así: Sección 1 Overview… Sección 2 Growth… Revenue…'
    ref: N-021
  steps:
  - kind: data
    what: 'Fijar la ventana del Overview: primer y último mes completos, meses con cobertura parcial (window_flag),
      escala ×10.000 a COP y definición de cliente activo. Con esa ventana, recalcular el 4,5×, el 2,8×, el −38%
      y el paso de COP 92,8 mil a COP 57,8 mil.'
    where:
    - mart.monthly_metrics_phase1
    - mart.monthly_metrics
    - staging.stg_customer_month
    - mart.customer_month
  - kind: data
    what: 'Sobre la misma ventana, juntar las señales de salud que ya están calculadas, sin rehacerlas: puente del
      monto (R-004), peso de las cosechas recientes (R-009) y churn observado con regresos.'
    where:
    - mart.monthly_metrics
    - mart.vintage_month
    - mart.churn_events
  - kind: proposal
    what: Entregar 3–4 señales para el Overview. Cada una lleva periodo, fuente y advertencia de nombre (monto pagado
      observado, primera aparición), más el puente explícito hacia Growth (quién entra) y hacia Revenue (qué explica
      el monto).
    where: []
  why: 'Si al fijar la ventana las cifras cambian de tamaño, cambia el arranque de toda la historia; si se sostienen,
    el Overview abre Growth y Revenue con números defendibles (versión mejorada de RT-003: suma S1.1, respuesta
    de arranque, pasos y la selección de señales).'
  links:
  - N-020
  - N-021
  - H-017
  - H-018
  - Q-010
  - Q-020
  slides:
  - S1.1
  flags: []
