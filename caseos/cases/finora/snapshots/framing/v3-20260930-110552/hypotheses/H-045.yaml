id: H-045
type: hypothesis
statement: Hacia inicios de 2023 hubo un cambio general en la entrada, de oferta, de plan de entrada, de Canal de
  adquisición (por ejemplo, más Self Service) o de forma del primer cobro. Ese cambio movió a la vez el número de
  altas observadas y el ticket de entrada, en todas las industrias (Q-003).
falsifier: Se descarta si, mes a mes en la ventana limpia, la mediana del primer pago no baja de nivel en los mismos
  meses en que saltan las altas (de 26 en dic-22 a 60 en ene-23, T-016). También se descarta si la baja es gradual
  a lo largo de 2022–2024. Con información de Finora, se descarta si en ese momento no hubo cambio de oferta, plan,
  canal ni forma de cobro.
