structured: '[MoFu · rebota «velocidad de atención»] El primer contacto puede seguir siendo rápido, pero los leads
  que no compran en ese momento no tienen seguimiento: se quedan estancados en Working o Engaged y se pierden. Con
  más volumen, esa bolsa crece y nadie la retoma. Tendría que ser cierto: en cada cohorte de entrada crece la proporción
  sin actividad por más de los días que se acuerden (Q-064), el tiempo al primer contacto no empeoró, y los estancados
  que alguien retoma (Reactivate) compran a una tasa que no es despreciable. Dato mínimo: fechas de etapa y actividades
  por lead; no está en el caso.'
