id: H-070
type: hypothesis
statement: Además del valle de ago-23 (H-023), la caída del S&M en el corte de jun-23 es en parte un cambio en cómo
  se arma el archivo, no solo menos gasto. Hasta may-23 Team es un 12% fijo del total (F-218, F-115), señal de reparto
  de arriba hacia abajo. Si es así, el «menos gasto, más primeros pagadores» de F-214 y el «mismo cambio» de H-025
  se apoyan en un corte de registro.
falsifier: Cae si Finora documenta que el total de S&M se registra con el mismo criterio antes y después de jun-23.
  También cae si el desglose por rubro muestra que la caída de may-23 a ago-23 viene de rubros registrados igual
  en ambos tramos, y no de Team ni de PayrollExpenses.
