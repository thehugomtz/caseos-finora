id: H-077
type: hypothesis
statement: Si un «Cliente N» es una sede o entidad de facturación y no una empresa, parte de las altas de ticket
  bajo de 2023–2024 (C-003) serían sedes o entidades nuevas de empresas que ya pagaban, es decir, expansión registrada
  como alta. Eso haría crecer los clientes activos más que las empresas (C-001) y bajaría el ticket de entrada sin
  que cambie quién compra.
falsifier: Con una tabla de Cliente N a empresa, las altas 2023–2024 que pertenecen a una empresa que ya pagaba
  con otro Cliente N son pocas, o su ticket estabilizado no es menor que el de las altas de empresas nuevas.
