statement: Con la regla de F-250 tal como está resumida, «¿quién cerró?» no asigna ruta a las entradas que iniciaron
  con persona y no cierran dentro de la ventana. Si es así, Executive e Hybrid B no tienen un denominador propio
  para su conversión y el mix de 5 funnels no cubre todas las entradas.
falsifier: El texto completo de R-036 asigna ruta a quien no cierra con una regla que no depende del cierre (por
  ejemplo, si pasó o no por Checkout Self, como en R-031, o el dueño al cerrar la ventana), y con esa regla cada
  entrada cae en exactamente un funnel.
