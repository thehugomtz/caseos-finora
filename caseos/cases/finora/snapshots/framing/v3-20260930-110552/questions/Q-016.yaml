id: Q-016
type: question
text: ¿Qué evidencia mínima permitiría distinguir las explicaciones del CRO?
kind: workplan
status: open
alias: W6
priority: Brecha crítica · preparar después de W0
impact: 3
capacity: 0
capacity_level: bloqueada
why_it_matters: 'Mantiene la respuesta al CRO honesta y comprobable: las ramas centrales del CRO no se observan
  en pagos, y un análisis fácil de pagos no reemplaza la pregunta central.'
method: 'Especificar una solicitud acotada: universo único y momento de entrada, señales al ingreso, hitos, resultado
  y estado, fechas de atención y ruta efectiva cuando aplique. Vincular cada evidencia a la comparación de HC1,
  HC2 o HC3. No diseñar un sistema de captura.'
deliverable: 'Matriz: hipótesis · comparación A/B · evidencia mínima · fuente potencial · qué conclusión queda bloqueada.'
close_criteria: Si no se obtiene la evidencia, no se ejecuta un cálculo sustituto. Si se obtiene, se reevalúa la
  capacidad y se prioriza mix y maduración antes de atribuir calidad o proceso.
front: CRO
do_not_conclude:
- 'Conversión del funnel o conversión final a partir de pagos: solo se observa a quienes pagaron.'
- 'Cantidad de entradas a partir del gasto de S&M: el gasto no mide entradas ni permite estimarlas.'
- Mix de la demanda a partir de la industria de quienes pagan.
- Fecha de entrada o maduración a partir de cohortes desde el primer pago.
