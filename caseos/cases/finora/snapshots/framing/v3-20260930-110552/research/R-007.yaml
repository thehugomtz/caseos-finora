id: R-007
type: research
research_question: ¿Qué evidencia mínima permitiría distinguir las explicaciones del CRO?
specialty: analytics
intensity: analytics
status: blocked
alias: W6
why_it_matters: 'Mantiene la respuesta al CRO honesta y comprobable: las ramas centrales del CRO no se observan
  en pagos, y un análisis fácil de pagos no reemplaza la pregunta central.'
short_answer: 'Bloqueada: no hay sustituto válido con los datos actuales. La respuesta es la lista de evidencia
  que falta.'
blocked_reason: 'Falta evidencia indispensable: no hay universo de entradas, fechas de entrada, no convertidos ni
  recorridos. Ningún gráfico de pagos es prueba de conversión del funnel.'
missing_evidence:
- dato: Universo de entradas con identidad, fecha y vía de ingreso
  fuente: CRM y producto
  catalogo:
  - funnel
  - atribucion
- dato: Señales al ingreso, hitos, resultado y estado, fechas de atención y ruta efectiva
  fuente: CRM y producto, con vínculo al pago
  catalogo:
  - funnel
cannot_claim:
- 'Conversión del funnel o conversión final a partir de pagos: solo se observa a quienes pagaron.'
- 'Cantidad de entradas a partir del gasto de S&M: el gasto no mide entradas ni permite estimarlas.'
- Mix de la demanda a partir de la industria de quienes pagan.
- Fecha de entrada o maduración a partir de cohortes desde el primer pago.
