id: R-009
type: research
research_question: ¿Por qué disminuyó el MRR por cliente?
specialty: analytics
intensity: analytics
status: completed
alias: Q2
short_answer: La caída se concentra en quién entra, no en la base previa. La descomposición por cosecha asigna a
  la composición de entrada 108% del cambio del MRR por cliente activo. En oct-24 las cosechas 2023 y 2024 concentran
  65% de los clientes activos con un MRR por cliente por debajo del de la base previa (COP 97,4 mil), que se ubica
  por encima de su nivel de ene-22
headline: La caída se concentra en quién entra, no en la base previa
findings:
