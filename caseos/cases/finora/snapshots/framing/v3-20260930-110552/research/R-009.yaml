- F-061
- F-062
what_is_established:
- 'El descenso sostenido del MRR por cliente activo coincide con altas que entran a un ticket menor: el promedio
  de entrada pasó de COP 128,7 mil en 2022 a COP 50,8 mil en 2024. Esas cosechas recientes ya representan 65% de
  los activos en oct-24.'
- El efecto dentro de cada industria explica 97% del cambio del ticket de entrada 2022→2024, y el ticket bajó en
  6 industrias. El movimiento es transversal, no un reacomodo entre sectores.
- Con base ene-22, el MRR por cliente de la base previa se ubica por encima de su nivel inicial (+5%) y el efecto
  dentro de las cosechas aporta COP 2,7 mil. Con base dic-22, ese mismo efecto aporta −COP 5,2 mil, concentrado
  en la cosecha 2022.
- La razón de medias entre el monto usual de quienes hacen churn y el de los activos del mes previo es 1,5×, mientras
  la razón de medianas es 1,0× con un intervalo que contiene la paridad. La brecha de medias coincide con la salida
  de pocas cuentas grandes.
- 'No es posible determinar si el menor ticket de entrada se asocia con precios de lista, planes, empaquetamiento
  o descuentos: el panel no contiene esas tablas.'
what_remains_unknown:
- No se puede separar un menor nivel contractual de un menor monto cobrado, porque el panel no contiene precios
  de lista, planes, empaquetamiento ni descuentos.
- 'No se puede concluir que el cliente típico que se va pague más que el activo típico: la razón de medianas es
  1,0× con un intervalo que contiene la paridad.'
- 'El signo del efecto dentro de las cosechas depende del periodo base: con base dic-22 aporta −COP 5,2 mil, de
  modo que no se puede fijar una dirección única.'
case_implication: Si la composición de entrada concentra 108% del cambio, convendría anclar el diagnóstico y las
  metas en el ticket de entrada antes que en la base previa. Si el ticket de entrada bajó en 6 industrias y el efecto
  dentro de industria explica 97% del cambio, podría convenir revisar la política de entrada de forma transversal.
new_questions:
- ¿El escalón del ticket de entrada a comienzos de 2023 coincide con un cambio en la mezcla de tamaño de cliente,
  dato que hoy no existe en el panel?
- ¿Qué parte de la caída del ticket dentro de cada industria corresponde a montos fuera de la grilla de cobro y
  no a un menor nivel contractual?
- ¿Las cosechas recientes recuperan MRR por cliente con la madurez, comparando su trayectoria mensual contra la
  cosecha 2022?
- ¿La salida de cuentas grandes se concentra en alguna industria o cosecha específica?
- ¿Puede documentarse la semántica de `amount` para distinguir monto cobrado de MRR contractual?
changes_current_story: maybe
