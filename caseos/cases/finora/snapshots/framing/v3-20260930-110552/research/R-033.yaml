      type: string
      definition: Pago o intento de pago.
      example: PAY-88
    - entity: payment
      field: paid_at, amount, status
      type: timestamp, decimal, enum
      definition: 'Lo cobrado: cuándo, cuánto y con qué resultado (succeeded / failed / refunded).'
      example: 2025-05-10 · 600 · succeeded
    - entity: funnel_entry
      field: entry_id, account_id, entry_seq
      type: string, integer
      definition: La entrada; entry_seq > 1 indica re-entrada.
      example: E-1003 · ACC-EJ-03 · 2
    - entity: funnel_entry
      field: entry_at, entry_cohort_month
      type: timestamp, string
      definition: Primer hito calificado y su mes (cohorte de entrada de C-006).
      example: 2025-03-15 · 2025-03
    - entity: funnel_entry
      field: door
      type: enum
      definition: self_serve / sql_directo / outbound / reactivate / referido / unknown. Se fija al entrar.
      example: reactivate
    - entity: funnel_entry
      field: route
      type: enum
      definition: self_serve_puro / hybrid / sales_assisted. Es descriptiva; no se compara entre puertas.
      example: hybrid
    - entity: funnel_entry
      field: first_channel_id, first_campaign_id
      type: string
      definition: Canal y campaña del primer toque de la entrada.
      example: paid_search
    - entity: funnel_entry
      field: signup_at, activation_at, engaged_at, sql_at, opportunity_created_at, first_sales_touch_at, won_at,
        first_paid_at
      type: timestamp
      definition: Fecha de cada hito (vacía si no ocurrió).
      example: 2025-03-04 · … · 2025-03-20
    - entity: funnel_entry
      field: days_entry_to_sql, days_entry_to_paid, reached_paid_within_w
      type: integer, boolean
      definition: Lags entre hitos y alcance dentro de la ventana fija W.
      example: 16 · 1
    - entity: funnel_entry
      field: last_progress_at, stalled_flag, outcome, initial_list_mrr
      type: timestamp, boolean, enum, decimal
      definition: Último avance, estancamiento a N días, resultado (won / lost / open / expired) y MRR inicial.
      example: 2025-03-18 · 1 · open
    - entity: account_month
      field: account_id, month
      type: string
      definition: 'PK compuesta. Tabla densa: una fila por cuenta y mes desde first_seen.'
      example: ACC-EJ-01 · 2025-07
    - entity: account_month
      field: subscription_status_eom
      type: enum
      definition: Estado de la suscripción el último día del mes.
      example: past_due
    - entity: account_month
      field: list_mrr, discount_mrr, net_mrr
      type: decimal
      definition: MRR contratado a precio de lista, descuentos vigentes (en negativo) y MRR neto.
      example: 100 · 0 · 100
    - entity: account_month
      field: invoiced_amount, collected_amount
      type: decimal
      definition: Facturado y cobrado en el mes.
      example: 100 · 0
    - entity: account_month
      field: legacy_paid_amount_cop
      type: decimal
      definition: raw.transactions × 10.000 durante la transición, para reconciliar con el as-is.
      example: (solo meses legados)
    - entity: account_month
      field: mrr_movement, discount_movement, past_due_flag
      type: enum, decimal, boolean
      definition: Movimiento sobre la base de MRR elegida, efecto del inicio o fin de un descuento, y marca de mora.
      example: flat · +20 · true
    - entity: account_month
      field: revenue_cohort_month, door_current_episode, industry_asof, owner_asof
      type: string, enum
      definition: Cortes de C-009 y cruce con C-006.
      example: 2025-04 · self_serve
    temporal_behavior: 'Hay cuatro tipos de tiempo y cada uno responde una pregunta distinta. (1) Eventos inmutables
      con timestamp (touch, product_event, activity, stage_history, payment). Responden «¿qué pasó y cuándo?» y
      permiten reconstruir cualquier estado pasado. (2) Registros con vigencia (valid_from/valid_to, SCD2): account_xref,
      historial de account, channel, sales_user, assignment, subscription_item_version, discount. Responden «¿qué
      era cierto en la fecha d?»: qué plan y precio tenía la cuenta, quién era el dueño, qué canal significaba un
      utm. (3) Snapshot periódico de cierre de mes: account_month. Responde «¿cuánto MRR tenía cada cuenta y en
      qué estado estaba al cierre?» y alimenta el puente de C-009; es denso (con ceros), como hoy mart.customer_month.
      (4) Accumulating snapshot: funnel_entry. Responde «¿qué % de la cohorte de entrada de marzo llegó a pago en
      W días y cuánto tardó?» (C-006). Se actualiza cuando se cumplen los hitos, así que conviene recalcularlo desde
      los eventos para poder auditarlo. Reglas de corte: una cohorte de entrada solo se lee cuando entry_at + W
      ≤ fecha de corte (censura por la derecha); el estado del mes usa la vigencia al último día del mes. Hoy el
      caso solo tiene el tipo (3), a grano cliente × mes sobre monto pagado, y ningún evento con fecha dentro del
      mes.'
    business_definitions:
    - term: Cuenta
      definition: Empresa cliente o prospecto. Es la unidad de análisis común del funnel y del ingreso; puede tener
        varias personas, leads, oportunidades y suscripciones.
    - term: Persona
      definition: Contacto o usuario individual. Entra, responde y usa el producto, pero el ingreso se atribuye
        a la cuenta.
    - term: Lead
      definition: Registro de interés de una persona (o cuenta) en un momento dado, con fuente y estado. No es una
        cuenta ni una oportunidad.
    - term: Entrada
      definition: Episodio en que una cuenta entra al funnel (su primer hito calificado). Una cuenta puede tener
        varias entradas a lo largo del tiempo.
    - term: Puerta
      definition: 'Por dónde entró la cuenta en esa entrada: self-serve, SQL directo, outbound, Reactivate o referido.
        Se fija al entrar y no cambia; es el eje de comparación de C-006.'
    - term: Ruta
      definition: 'Cómo avanzó después de entrar: self-serve puro, Hybrid o sales-assisted. Describe, pero no se
        compara entre puertas.'
    - term: Hybrid
      definition: Ruta de una entrada self-serve que recibió al menos un toque comercial completado antes del primer
        pago.
    - term: Reactivate (puerta)
      definition: Entrada de una cuenta que ya fue cliente y cuya suscripción terminó.
    - term: Cohorte de entrada
      definition: Cuentas cuya entrada ocurrió en el mismo mes (C-006). Es distinta de la cohorte de ingreso (primer
        mes con MRR > 0, C-009) y de la cohorte legada del as-is (primer mes con pago).
    - term: Ventana fija (W)
      definition: Días desde entry_at dentro de los cuales se cuenta si un hito ocurrió. Es igual para todas las
        cohortes y puertas.
    - term: Hito
      definition: 'Evento con fecha que marca un avance: registro, activación, Engaged, SQL, oportunidad, ganada,
        primer pago.'
    - term: Tiempo de cierre
      definition: Días entre entry_at y won_at (o first_paid_at en self-serve puro).
    - term: Estancamiento
      definition: Entrada abierta sin cambio de etapa, sin actividad comercial y sin uso de producto durante N días.
    - term: Intervención comercial
      definition: Actividad de SDR/AE completada sobre la entrada (con quién, sobre qué, cuándo). Se mide; no se
        asume que cause el resultado.
    - term: Canal / fuente / campaña
      definition: Canal = categoría normalizada (paid search, outbound…). Fuente = utm_source o lead_source tal
        cual vienen. Campaña = iniciativa con ID (utm_id).
    - term: MRR de lista (contratado)
      definition: Suma de precio de lista × cantidad ÷ meses del intervalo, para los ítems vigentes al cierre de
        mes de las suscripciones active o past_due.
    - term: Descuento
      definition: Reducción pactada sobre el precio de lista, con tipo, valor y vigencia. Se guarda aparte y nunca
        se mezcla en el precio.
    - term: MRR neto
      definition: MRR de lista + descuentos vigentes (en negativo).
    - term: Facturado
      definition: Monto de las facturas emitidas en el mes, con su periodo de servicio.
    - term: Cobrado
      definition: Pagos exitosos recibidos en el mes. Es lo que hoy más se parece a raw.transactions (hipótesis
        «cobrado»).
    - term: Monto pagado observado (as-is)
      definition: amount × 10.000 por cliente y mes. No es MRR contratado mientras no se confirme la recurrencia.
    - term: Churn (to-be)
      definition: La cuenta pasa de MRR > 0 a 0 porque sus suscripciones quedaron canceladas, impagas o terminaron.
    - term: Churn observado (as-is)
      definition: La cuenta pagaba el mes anterior y este mes paga cero. No es cancelación confirmada.
    - term: Mora
      definition: Suscripción active o past_due con una factura vencida sin pagar. Mantiene su MRR y se marca aparte.
    - term: New / Working / Engaged
      definition: Estados de lead en el vocabulario de Hugo. Las definiciones propuestas están en la lógica de clasificación
        y hay que validarlas con Finora.
    classification_logic:
    - case: Puerta de una entrada (propuesta; el orden es decisión de Hugo/Finora)
      rule: 'Se evalúa en entry_at con el primer hito calificado del episodio, en este orden: (1) reactivate, si
        la cuenta tuvo una suscripción terminada (ended_at < entry_at); (2) outbound, si el primer hito es una actividad
        outbound de SDR/AE sin toque inbound previo en R días; (3) sql_directo, si el primer hito es un formulario
        de demo o contacto (lead_source = demo_request); (4) self_serve, si el primer hito es un product_event Signed
        Up o Account Created; (5) referido, si existe; (6) unknown. Una sola puerta por entrada, que no cambia después.'
    - case: Ruta dentro de la puerta (descriptiva)
      rule: Se fija al primer pago o al cerrar la ventana. self_serve_puro = puerta self_serve sin ninguna actividad
        comercial completada antes del primer pago. hybrid = puerta self_serve con ≥1 actividad comercial completada
        (o asignación a SDR/AE) antes del primer pago. sales_assisted = puertas sql_directo u outbound con oportunidad.
    - case: Nueva entrada vs misma entrada
      rule: 'Se abre una entrada nueva si la cuenta no tiene ninguna entrada abierta y la última se cerró (ganada,
        perdida o expirada) hace más de R días; si no, el toque se suma a la entrada abierta. Las expansiones de
        clientes activos no abren entrada: van como opportunity_type = expansion.'
    - case: Estados de lead New / Working / Engaged (a validar con Finora)
      rule: 'New = creado, sin actividad outbound completada. Working = ≥1 actividad outbound completada y todavía
        sin respuesta. Engaged = ≥1 respuesta del prospecto (contesta, llamada conectada o reunión agendada). Después:
        Qualified (SQL) / Disqualified / Nurture. Cada cambio se escribe en stage_history.'
    - case: Alcance en ventana fija
      rule: reached_X_W = 1 si X_at − entry_at ≤ W días. Una cohorte de entrada solo se reporta cuando entry_at
        + W ≤ fecha de corte.
    - case: Estancamiento
      rule: Una entrada abierta está estancada en la fecha d si en los últimos N días no tuvo cambio de etapa, ni
        actividad comercial completada, ni evento de producto. N se define por etapa (decisión).
    - case: Movimientos de MRR (sobre account_month; usar list_mrr o net_mrr como base es decisión)
      rule: 'new: MRR_t > 0 y nunca > 0 antes. expansion: MRR_t > MRR_t-1 > 0. contraction: 0 < MRR_t < MRR_t-1.
        churn: MRR_t-1 > 0 y MRR_t = 0 porque al cierre la suscripción quedó canceled o unpaid, o terminó. reactivation:
        MRR_t > 0, MRR_t-1 = 0 y > 0 en algún mes previo. flat: igual al mes anterior.'
    - case: Descuento temporal (decisión, no hecho)
      rule: 'Propuesta por defecto: no mueve list_mrr; se registra en discount_mrr y mueve net_mrr como «movimiento
        de descuento», separado de la expansión y la contracción. Si Hugo/Finora deciden reportar MRR neto, el inicio
        y el fin del descuento aparecerán como contracción y expansión, y eso tiene que quedar escrito.'
    - case: Mora (past_due)
      rule: 'Si la suscripción está active o past_due al cierre y collected = 0, el MRR se mantiene y se marca mora:
        no es churn. Pasa a churn en el mes en que queda unpaid o canceled.'
    - case: Pago multimes o atrasado
      rule: 'El MRR sale de subscription_item_version normalizado por intervalo (anual ÷ 12), no del cobro. Un cobro
        doble por atraso o un prepago no es expansión: se ve en collected y en invoice.period.'
    - case: Cohortes
      rule: Cohorte de entrada (C-006) = mes de entry_at. Cohorte de ingreso (C-009) = primer mes con MRR > 0. Cohorte
        legada (as-is) = primer mes con pago > 0, con cohort_flag left_censored o suspected_spillover. No se mezclan
        en la misma tabla.
    - case: Base previa del as-is
      rule: Los 377 clientes activos en ene-22 quedan con door = unknown y entry_at vacío, fuera de las comparaciones
        por puerta, salvo que se pueda hacer backfill desde el CRM.
