alternative_explanations:
- Finora podría tener ya CRM, facturación y analítica de producto con historial, y el caso solo compartió un extracto
  de pagos. Si es así, la brecha es de integración y llave común, no de captura.
- Los ceros que vuelven a pagar en t+1 pueden ser un desfase en la fecha de cobro (se registró el mes siguiente),
  mora, o cancelación con regreso. Con cliente × mes × monto no se distinguen; hacen falta el periodo de factura,
  el estado de suscripción y la fecha de pago.
- Las firmas de pago multimes pueden ser prepagos (anuales o trimestrales) o pagos de atrasos acumulados. Se separan
  con invoice.period_start/period_end.
- 'Diseño alternativo para etapas: en vez de stage_history como tabla de eventos, propiedades «fecha de entrada
  a etapa» en la cuenta o el lead (estilo HubSpot). Es más simple, pero si no se guarda el historial se pierden
  las re-entradas, el autor y los retrocesos.'
- Definir la puerta por el canal del primer toque (atribución first-touch) en vez de por el primer hito. Cambia
  la puerta de las cuentas que vieron un anuncio y después se registraron solas.
- Tratar Hybrid como puerta y no como ruta. Chocaría con C-006 («comparar entre puertas, no rutas»), porque Hybrid
  se define por lo que pasa después de entrar.
what_is_established:
- raw.transactions es un panel balanceado cliente × mes (1.961 × 34, ene-22 a oct-24) con ceros explícitos, y solo
  contiene clientes que pagaron al menos una vez.
- 'El mes es una fecha de fin de mes: no hay día de pago, factura, plan, cantidad, precio ni descuento.'
- Los dos archivos de cliente usan formatos de ID distintos («1» vs «Cliente 1»); el cruce funciona al 100% después
  de parsear, y hay 1 fila vacía en industria.
- El gasto S&M es mes × 7 rubros, con unidad no documentada y sin canal, campaña ni cliente.
- Ninguna tabla del modelo tiene lead, canal, campaña, oportunidad, etapa, actividad, asignación, evento de producto
  ni suscripción.
- Hoy, 330 de 751 churn observados vuelven a pagar en t+1, y 512 cliente-mes tienen firma de pago multimes.
- Existen patrones estándar y documentados para cada entidad del to-be (CRM, UTM, spec B2B, suscripción, snapshots).
what_is_contested:
- Si un mes en cero es churn, mora o desfase de cobro (330 de 751 vuelven en t+1).
- Si los descuentos temporales restan del MRR oficial (es una decisión; Stripe lo deja configurable).
- Si una cuenta es activa desde el contrato o desde el primer pago, y si el «alta» se cuenta desde el contrato o
  desde el primer pago.
- Si Hybrid es puerta o ruta (propongo ruta, para respetar C-006).
- Si la puerta se define por el primer hito o por el canal del primer toque.
what_remains_unknown:
- Qué sistemas tiene Finora hoy (CRM, facturación/suscripciones, analítica de producto) y desde cuándo guardan historial.
- La unidad y la moneda del gasto S&M.
- 'Qué representa «Cliente N»: empresa, entidad de facturación o sede.'
- Por qué hay 1.627 montos distintos (lista de precios, prorrateos, FX, pagos parciales).
- Las definiciones operativas de New, Working, Engaged, Hybrid y Reactivate en el WoW de Finora.
- Si el monto del archivo es cobrado, facturado o contratado (hoy «cobrado» es hipótesis).
case_implication: 'Para S2.7 y C-013, la lámina puede mostrar con datos consultados que el as-is es un modelo de
  «después del pago» a grano cliente × mes. Por eso C-006 hoy está entero en rojo, y las ramas post-pago de C-009
  van en amarillo: miden monto pagado, no MRR contratado, y churn observado, no cancelación. El to-be no es una
  lista de tablas sino una espina (account_id + crosswalk) con tres capas de captura (demanda, comercial, producto-facturación)
  y dos marts. funnel_entry hace medible la comparación por puerta con ventana fija (C-006). account_month construye
  el árbol sobre MRR contratado con el cobrado al lado (C-009) y convive con mart.customer_month, que ya existe.
  La implicación práctica es de secuencia: primero definiciones y llave, sin sistemas nuevos. Después, capturar
  lo que no se puede reconstruir: UTMs, historial de etapas y dueños, actividades, estado de suscripción y periodo
  de factura. Solo entonces se pueden prometer métricas por puerta, y las primeras cohortes se podrán leer W días
  después de empezar la captura.'
changes_current_story:
  value: maybe
  why: 'No cambia la tesis de C-013 (definiciones y fuentes comunes unidas por un ID de cuenta): la concreta. Sí
    puede cambiar el semáforo de C-009: como el as-is no separa cancelación de mora ni prepago de expansión, las
    ramas post-pago irían en amarillo, no en verde. Y precisa C-006: Hybrid va como ruta dentro de la puerta, no
    como puerta.'
affected_hypotheses: []
affected_claims:
- id: C-013
  effect: supports
  why: 'Concreta el modelo: la espina es account_id con un crosswalk de IDs con vigencia. Hoy los dos archivos de
    cliente ya usan formatos distintos («1» vs «Cliente 1») y el cruce depende de parsear texto.'
- id: C-006
  effect: supports
  why: 'Hoy no se puede medir nada de C-006 (no hay datos antes del pago). funnel_entry, un accumulating snapshot
    con puerta, ruta y una fecha por hito, lo hace medible: cohorte de entrada, alcance en ventana W, tiempo a hito,
    estancamiento. Hybrid queda como ruta, no como puerta.'
- id: C-009
  effect: changes_framing
  why: 'Propongo que el semáforo distinga tres colores. Verde: se mide con la definición correcta (monto pagado,
    cortes por industria). Amarillo: se mide como proxy de pago (MRR, churn, expansión, altas, eficiencia S&M agregada).
    Rojo: no se puede medir (entradas, conversión, canal, puerta, pipeline, descuentos, CAC por canal). Y que el
    árbol se construya sobre MRR contratado, con una línea paralela de cobrado.'
- id: C-014
  effect: supports
  why: 'Cada foro sale de tablas concretas. Semanal: stage_history, activity y assignment (estancamiento, speed-to-lead).
    Mensual: account_month (puente de MRR). Trimestral: funnel_entry por puerta y campaign_spend (CAC por canal).'
suggested_action: 'Propongo armar S2.7 en tres bloques. (1) As-is: las 3 fuentes y sus marts, con grano, qué responden
  y qué no, y los números del modelo (1.961 × 34; 0 no-compradores; 330 de 751 churn que vuelven en t+1). (2) To-be:
  la espina account + crosswalk, las tres capas con sus relaciones 1—n y los dos marts. (3) Tabla de brecha por
  necesidad: qué hay hoy → qué se agrega → qué métrica de C-006/C-009 habilita. Junto con la lámina, llevarle a
  Hugo la lista de decisiones de definición para que elija: descuento en MRR, activo desde contrato o pago, churn
  vs mora, regla de puertas, ventana W y N de estancamiento. En paralelo, pedirle a Finora el inventario de sistemas.'
new_questions:
- ¿Qué sistemas tiene Finora hoy (CRM, facturación/suscripciones, analítica de producto) y desde qué fecha guardan
  historial de etapas, dueños y estados de suscripción?
- ¿Qué reglas de puerta y qué ventana W aprueba Hugo para C-006? ¿La entrada se cuenta desde el primer hito (registro,
  formulario, outbound) o desde el primer toque?
- ¿El MRR oficial de C-009 se reporta antes o después de los descuentos temporales, y una cuenta es activa desde
  el contrato o desde el primer pago?
handoff_to_cos:
  summary: 'R-033 listo. El as-is está confirmado en el modelo: 3 fuentes post-pago con grano cliente × mes, cliente
    y mes; nada antes del pago; ni siquiera separa churn de mora (330 de 751 churn observados pagan en t+1). El
    to-be tiene una espina account + crosswalk, tres capas (demanda / comercial / producto-facturación) y dos marts:
    funnel_entry para C-006 y account_month para C-009. Incluye la brecha por necesidad y la métrica que habilita
    cada tabla.'
  recommended_next: Presentarle a Hugo la estructura de S2.7 (as-is | to-be | brecha) para que la apruebe, y las
    6 decisiones de definición abiertas para que elija. En paralelo, pedirle a Finora el inventario de sistemas
    para saber si la brecha es de integración o de captura.
confidence_buckets:
  high_confidence:
  - El as-is es post-pago, con granos cliente × mes, cliente y mes, y sin ninguna entidad de antes del pago.
  - La llave de cliente viene en dos formatos y cruza al 100% después de parsear.
  - Los datos no distinguen cancelación de mora ni prepago de expansión (330/751; 512 cliente-mes con firma multimes).
  - Existen patrones estándar y documentados para cada entidad del to-be.
  plausible:
  - funnel_entry (accumulating snapshot) es el grano correcto para cohortes de entrada con ventana fija.
  - account_month sobre MRR contratado, conviviendo con el monto pagado, es la base correcta del árbol de C-009.
  - Hybrid funciona mejor como ruta que como puerta.
  - La secuencia definiciones → captura → marts → tableros minimiza el retrabajo.
  contested:
  - Si los descuentos temporales restan del MRR.
  - Si una cuenta es activa desde el contrato o desde el primer pago.
  - Si un mes en cero es churn, mora o desfase de cobro.
  - Si la puerta se define por el primer hito o por el canal del primer toque.
  unknown:
  - Qué sistemas tiene Finora y si guardan historial.
  - La unidad y la moneda del gasto S&M.
  - Qué representa «Cliente N» (empresa, entidad de facturación, sede).
  - Las definiciones operativas de New, Working, Engaged, Hybrid y Reactivate en Finora.
specialist:
  data_model:
    conceptual_model: 'La espina es account_id (cuenta = empresa cliente o prospecto), con un crosswalk con vigencia
      hacia los IDs de cada sistema: CRM, producto, facturación y los legados «1» / «Cliente 1». Sobre la espina
      van tres capas de captura, cada una con su grano. (1) Demanda: channel 1—n campaign; campaign 1—n touch; person
      1—n touch; campaign 1—n campaign_member n—1 person/lead; campaign 1—n campaign_spend. (2) Comercial: account
      1—n person; person 1—n lead; account 1—n lead; lead 1—0..1 opportunity; account 1—n opportunity; lead 1—n
      stage_history; opportunity 1—n stage_history; sales_user 1—n activity; lead/opportunity/account 1—n activity;
      sales_user 1—n assignment; lead/opportunity/account 1—n assignment. (3) Producto y facturación: account 1—n
      product_event n—1 person; account 1—n subscription; opportunity 1—0..1 subscription; subscription 1—n subscription_item_version
      (lo contratado y tarifado); subscription 1—n discount (lo descontado); subscription 1—n invoice (lo facturado);
      invoice 1—n payment (lo cobrado). Encima, dos marts analíticos: funnel_entry (accumulating snapshot; account
      1—n funnel_entry 1—0..1 subscription) para C-006, y account_month (periodic snapshot, cuenta × mes) para C-009.
      account_month convive con mart.customer_month (monto pagado observado) y se reconcilia con él cada mes.'
    as_is:
    - table: raw.transactions (→ staging.stg_customer_month)
      grain: Cliente × mes. Panel balanceado 1.961 × 34 (ene-22 a oct-24), 66.674 filas, ceros explícitos.
      fields: 'ID (texto, «1»), month (texto M/D/AAAA, fin de mes), amount (texto sin escala). En staging: customer_id,
        month AAAA-MM, amount y amount_cop (× 10.000).'
      answers: Monto pagado observado por cliente y mes; quién paga cada mes; base del puente de monto pagado y
        de las cohortes por primer pago.
      cannot: 'Nada de quien no pagó. Tampoco: fecha exacta de pago o factura; plan, cantidad, precio o descuento
        detrás del monto; si un cero es cancelación, mora o desfase; si un pico es prepago multimes o expansión.'
    - table: raw.industry (→ staging.stg_customers)
      grain: Cliente. 1.962 filas (1 vacía) → 1.961.
      fields: ID (texto «Cliente N»), Industria (6 valores).
      answers: Corte por industria de cualquier métrica de pago.
      cannot: Cambios de industria en el tiempo, tamaño o segmento, y una llave en el mismo formato que pagos (hay
        que parsear).
    - table: raw.sm_spend (→ staging.stg_sm_spend, mart.sm_monthly)
      grain: Mes. 34 filas × 7 rubros en columnas (238 filas en formato largo).
      fields: Month, PaidMedia, Travel, PublicidadNoWeb, Freelance, SoftwareTools, Team, PayrollExpenses (texto
        con «$», unidad no documentada). El mart los agrupa en demand_gen, sales_capacity y enablement.
      answers: Gasto S&M total y por rubro o grupo por mes; eficiencia agregada contra altas (en mart.monthly_metrics_phase1).
      cannot: Gasto por canal, campaña o puerta; moneda y unidad; asignación a cuentas; CAC por canal o por puerta.
    - table: mart.customer_month
      grain: Cliente × mes (denso).
      fields: observed_amount, paid_mrr_cop, active_customer, movement_type (new/expansion/contraction/flat/churn/reactivation…),
        cohort_month, cohort_flag, tenure_month, usual_amount_cop, multi_month_payment_signature, returned_next_month,
        reverts_next_month, vintage, industry.
      answers: Puente de monto pagado por cliente; cohortes y cosechas por primer pago; señales de pago multimes
        y de ceros que vuelven.
      cannot: MRR contratado; churn confirmado; entrada al funnel, puerta, canal o dueño; por qué cambia el monto.
    - table: mart.monthly_metrics (+ mart.monthly_metrics_phase1)
      grain: Mes (34).
      fields: Clientes activos, nuevos, con churn, reactivados, con expansión y con contracción; total_paid_mrr_cop
        y los 5 movimientos; tasas (logo churn, NRR de existentes, quick ratio); gasto por rubro y eficiencia (S&M
        por alta, S&M por MRR nuevo).
      answers: Salud agregada y puente mensual de monto pagado (cuadra al centavo); eficiencia S&M agregada.
      cannot: Conversión, volumen de entrada, eficiencia por canal o por puerta; nada por etapa.
    - table: mart.new_customers
      grain: Alta (1.584).
      fields: customer_id, cohort_month, m0_cop, m1_cop, early_run_rate_cop, early_months_observed, industry, vintage,
        clean.
      answers: Valor de entrada (primer pago) por cohorte e industria.
      cannot: Puerta, canal, tiempo de cierre, quién vendió, si hubo descuento de entrada; tampoco si el primer
        pago es la adquisición (es la primera aparición).
    - table: mart.churn_events
      grain: Evento de churn observado (751).
      fields: customer_id, month, prev_mrr_cop, months_to_return, returned_next_month, industry, vintage.
      answers: Tamaño de los ceros y cuánto tardan en volver a pagar.
      cannot: Motivo, fecha de cancelación, si fue voluntario o por impago.
    - table: mart.vintage_month
      grain: Cosecha × mes (170).
      fields: vintage, month, active_customers, mrr_cop, arpa_cop.
      answers: Retención de clientes y de monto por cosecha anual.
      cannot: Retención por puerta o canal; cohortes de entrada.
    gap:
    - need: Llave común (C-013)
      as_is: customer_id numérico parseado de dos formatos («1» en pagos, «Cliente 1» en industria); cruza 1.961/1.961.
        No hay IDs de CRM, producto ni facturación.
      to_be: account (account_id estable) + account_xref con vigencia (crm, product, billing, legacy_*) + person.
      enables: 'Todos los cruces. C-006: asignar cada entrada, toque y pago a la misma cuenta. C-009: un MRR por
        cuenta aunque tenga varias suscripciones. C-013: definiciones y fuentes unidas por un ID.'
    - need: Canal y fuente
      as_is: No existe en pagos ni en clientes. El gasto solo viene por rubro (paid_media, publicidad_no_web…) y
        sin unidad.
      to_be: touch (utm_source/medium/campaign/id/content/term), channel (regla source/medium → canal, con vigencia),
        campaign, campaign_member, campaign_spend con moneda.
      enables: 'C-006: entradas por canal dentro de cada puerta. C-009, rama de eficiencia: costo por entrada, por
        nueva cuenta y por MRR nuevo, por canal y campaña.'
    - need: Puerta de entrada (separada de la ruta)
      as_is: Solo existe «new» = primer mes con pago (primera aparición). 377 clientes no tienen inicio observable.
      to_be: funnel_entry.door y route, entry_at y entry_seq, derivadas de lead.lead_source, product_event (Signed
        Up), activity outbound y suscripciones previas (Reactivate).
      enables: 'El núcleo de C-006: tamaño de cohorte por puerta y comparación entre puertas; % Hybrid dentro de
        self-serve como descripción de la ruta.'
    - need: Etapa
      as_is: 'Solo dos estados por mes: pagó / no pagó.'
      to_be: lead.status + opportunity.stage + stage_history (from/to, changed_at, changed_by, change_source).
      enables: 'C-006: alcance de Engaged, SQL, oportunidad y pago en ventana fija por puerta. C-009: pipeline abierto
        y conversión que alimentan la rama de nuevas cuentas.'
    - need: Tiempo de cierre
      as_is: 'Imposible: no hay nada antes del pago y el mes es fin de mes (sin día).'
      to_be: Timestamps de hitos en funnel_entry (entry_at, sql_at, opportunity_created_at, won_at, first_paid_at)
        y lags calculados.
      enables: 'C-006: mediana y percentiles de días entrada → pago y entrada → SQL, por puerta y cohorte; lectura
        justa de la ventana W.'
    - need: Intervención de SDR/AE
      as_is: Solo costo agregado por mes (team, payroll_expenses, travel); nada por cuenta.
      to_be: activity (quién, sobre qué, dueño, occurred_at, outcome), sales_user (rol, equipo, fecha de inicio),
        assignment (dueño por periodo).
      enables: 'C-006: ruta Hybrid (self-serve con toque antes del pago), speed-to-lead, toques por entrada, resultados
        con vs sin toque (observacional, no causal). C-009: capacidad comercial por puerta.'
    - need: Estancamientos
      as_is: Nada antes del pago; después del pago, solo churn observado y meses en cero.
      to_be: stage_history + activity + product_event → last_progress_at y stalled_flag en funnel_entry (N días
        sin cambio de etapa, actividad ni uso).
      enables: 'C-006: tasa de estancamiento a N semanas por puerta y etapa. C-014: lista semanal de entradas estancadas.'
    - need: MRR contratado vs pagado (lista, descuento, facturado, cobrado)
      as_is: Un solo monto por cliente-mes (1.627 valores distintos), sin plan, cantidad, precio ni descuento. 512
        cliente-mes con firma multimes; 211 de 2.541 expansiones/contracciones se revierten en t+1.
      to_be: subscription + subscription_item_version (plan, precio de lista, cantidad, intervalo, vigencia) + discount
        (tipo, valor, vigencia, motivo) + invoice (periodo de servicio) + payment. account_month con list_mrr, discount_mrr,
        net_mrr, invoiced y collected.
      enables: 'C-009: puente de MRR contratado (new/expansion/contraction/churn/reactivation) separado del efecto
        descuento y del cobro; NRR/GRR por cohorte; ARPA real; efecto de pricing y descuentos cuando se introduzcan.'
    - need: Churn vs mora
      as_is: Churn observado = pago en cero. 330 de 751 vuelven a pagar en t+1 (87 con el mismo monto); 33 caen
        en oct-24 sin t+1.
      to_be: subscription.status (active/past_due/unpaid/canceled/paused), canceled_at, ended_at, cancellation_reason;
        invoice.status.
      enables: 'C-009: churn voluntario vs involuntario vs mora; reactivación real (win-back) vs pago atrasado;
        revenue que dejamos de capturar por impago.'
    - need: Costo por puerta y por canal
      as_is: 'sm_spend: mes × 7 rubros, unidad no documentada. Solo eficiencia agregada (S&M por alta).'
      to_be: campaign_spend (campaña/canal × día o mes, con moneda) que cuadra contra sm_spend, más una regla para
        asignar el costo de equipo a puertas vía assignment/activity.
      enables: 'C-009, rama de eficiencia: CAC y payback por puerta y canal. C-006: costo por entrada y por cuenta
        ganada en la ventana.'
    - need: Segmento e industria con vigencia
      as_is: Industria fija por cliente, sin fecha; 6 valores.
      to_be: 'Historial de account (SCD2: industry, segment, valid_from/valid_to).'
      enables: Cortes «as of» en C-006 y C-009 sin reescribir la historia.
    entities:
    - name: account
      description: Empresa cliente o prospecto; es la espina del modelo. 1—n account_xref, person, lead, opportunity,
        subscription, product_event, funnel_entry, account_month. Habilita todos los cruces (C-013).
      grain: 1 fila = 1 cuenta (estado actual; industria y segmento con historial SCD2)
      primary_key: account_id
    - name: account_xref
      description: Crosswalk de IDs por sistema, con vigencia. Resuelve «1» vs «Cliente 1» y las fusiones o separaciones
        de cuentas. n—1 account.
      grain: 1 fila = 1 ID de un sistema origen × periodo de validez
      primary_key: (source_system, source_id, valid_from)
    - name: person
      description: 'Contacto o usuario: quien se registra, llena un formulario o atiende una llamada. n—1 account
        una vez empatada; 1—n lead, touch, product_event, activity (quién).'
      grain: 1 fila = 1 persona
      primary_key: person_id
    - name: channel
      description: Canal normalizado y su regla de mapeo desde source/medium, con vigencia; se enlaza con el rubro
        de sm_spend. 1—n campaign, touch. Habilita entradas por canal (C-006) y eficiencia por canal (C-009).
      grain: 1 fila = 1 canal × versión de regla
      primary_key: (channel_id, valid_from)
    - name: campaign
      description: Campaña (utm_id). n—1 channel; 1—n touch, campaign_member, campaign_spend y discount (si es promo).
      grain: 1 fila = 1 campaña
      primary_key: campaign_id
    - name: campaign_member
      description: Relación persona o lead ↔ campaña, con estado de respuesta (patrón CampaignMember).
      grain: 1 fila = 1 persona × campaña
      primary_key: (campaign_id, person_id)
    - name: touch
      description: Toque de marketing con UTMs (visita, formulario, evento). n—1 person y campaign. Habilita el
        primer toque de cada entrada.
      grain: 1 fila = 1 toque (evento inmutable)
      primary_key: touch_id
    - name: campaign_spend
      description: Gasto por campaña o canal con moneda y unidad explícitas; cuadra contra sm_spend por rubro. Habilita
        el CAC por canal y por puerta (C-009).
      grain: 1 fila = 1 campaña × día (o mes)
      primary_key: (campaign_id, spend_date)
    - name: lead
      description: Registro de interés con fuente, estado (New/Working/Engaged/…), creador y conversión. n—1 person
        y account; 1—n stage_history, activity, assignment; 1—0..1 opportunity. Habilita puerta y alcance de Engaged/SQL
        (C-006).
      grain: 1 fila = 1 lead (estado actual)
      primary_key: lead_id
    - name: opportunity
      description: Intento de venta con tipo (new/expansion/reactivation/renewal), dueño, monto esperado, cierre
        y resultado. n—1 account; 1—n stage_history y activity; 1—0..1 subscription. Habilita alcance de oportunidad
        y de ganada, tiempo de cierre (C-006) y pipeline (C-009).
      grain: 1 fila = 1 oportunidad (estado actual)
      primary_key: opportunity_id
    - name: stage_history
      description: Cada cambio de estado de un lead o una oportunidad, con fecha, autor y origen del cambio (patrón
        OpportunityHistory / property history). Habilita tiempo en etapa, estancamiento y alcance por ventana (C-006).
      grain: 1 fila = 1 cambio de etapa (evento inmutable)
      primary_key: stage_event_id
    - name: activity
      description: Toque comercial de SDR/AE (llamada, email, reunión, demo, mensaje) con quién, sobre qué, cuándo
        y resultado (patrón Task). Habilita la ruta Hybrid, speed-to-lead e intervención (C-006).
      grain: 1 fila = 1 actividad (evento)
      primary_key: activity_id
    - name: sales_user
      description: SDR, AE o CSM con rol, equipo y fecha de inicio (rampa), con vigencia del rol. 1—n activity y
        assignment.
      grain: 1 fila = 1 usuario × periodo de rol
      primary_key: (user_id, valid_from)
    - name: assignment
      description: Quién era dueño de qué y cuándo (lead, oportunidad, cuenta), y cómo se asignó. Habilita dar el
        crédito de cada hito a quien era dueño en ese momento, y la capacidad por puerta.
      grain: 1 fila = 1 objeto × rol × periodo de asignación
      primary_key: assignment_id
    - name: product_event
      description: 'Eventos de producto por cuenta (groupId) y usuario: registro, creación de cuenta, trial, activación
        (definición de Finora pendiente), checkout. Habilita la puerta self-serve y los hitos de activación y checkout
        (C-006).'
      grain: 1 fila = 1 evento (inmutable)
      primary_key: event_id
    - name: subscription
      description: Contrato recurrente con estado (trialing/active/past_due/canceled/unpaid/paused), fechas de inicio,
        cancelación y fin, y motivo. n—1 account; 1—n subscription_item_version, discount, invoice. Habilita separar
        churn real de mora (C-009).
      grain: 1 fila = 1 suscripción (estado actual; los cambios de estado quedan como eventos)
      primary_key: subscription_id
    - name: subscription_item_version
      description: 'Lo contratado y tarifado: plan, precio de lista, cantidad e intervalo, con vigencia. Habilita
        el MRR de lista y la expansión/contracción por plan, cantidad o precio (C-009).'
      grain: 1 fila = 1 ítem de suscripción × periodo de vigencia
      primary_key: item_version_id
    - name: discount
      description: 'Lo descontado: tipo, valor, duración, vigencia, motivo y quién lo aprobó. Habilita separar el
        efecto descuento del MRR contratado (C-009) cuando se introduzcan descuentos.'
      grain: 1 fila = 1 descuento aplicado × vigencia
      primary_key: discount_id
    - name: invoice
      description: 'Lo facturado: periodo de servicio que cubre, subtotal de lista, descuento, total, vencimiento
        y estado. Habilita distinguir un pago multimes de una expansión, y detectar mora.'
      grain: 1 fila = 1 factura
      primary_key: invoice_id
    - name: payment
      description: 'Lo cobrado: fecha y monto de cada pago o intento. Agregado por cuenta × mes reproduce el raw.transactions
        de hoy.'
      grain: 1 fila = 1 pago o intento (evento)
      primary_key: payment_id
    - name: funnel_entry
      description: 'Mart accumulating snapshot: cada entrada de una cuenta al funnel, con puerta, ruta, primer canal
        y fecha de cada hito; se actualiza a medida que avanza. account 1—n funnel_entry 1—0..1 subscription. Habilita
        C-006 completo: cohorte de entrada, ventana fija, alcance, tiempo a hito, estancamiento y ruta.'
      grain: 1 fila = 1 entrada (episodio) de una cuenta
      primary_key: entry_id
    - name: account_month
      description: 'Mart periodic snapshot: estado de cierre de mes por cuenta con MRR de lista, descuento, MRR
        neto, facturado, cobrado, estado de suscripción y movimiento. Convive con mart.customer_month y se reconcilia
        con él. Habilita el árbol y el puente de MRR contratado de C-009, y NRR/GRR por cohorte.'
      grain: 1 fila = 1 cuenta × mes (denso, con ceros)
      primary_key: (account_id, month)
    grain: 'Regla: una tabla = un grano, sin mezclar. Eventos (1 fila = 1 cosa que pasó, inmutable): touch, product_event,
      activity, stage_history, payment. Entidades con estado actual (1 fila = 1 objeto): account, person, lead,
      opportunity, campaign, subscription, invoice. Registros con vigencia (1 fila = 1 objeto × periodo de validez):
      account_xref, channel, sales_user, assignment, subscription_item_version, discount, historial de account.
      Snapshots: account_month (cuenta × mes de cierre) y funnel_entry (1 entrada con sus fechas de hitos). Las
      métricas de C-006 salen de funnel_entry y las de C-009 de account_month. Hoy el caso solo tiene cliente ×
      mes (pagos), cliente (industria) y mes (gasto).'
    fields:
    - entity: account
      field: account_id
      type: string (surrogate)
      definition: Llave estable de la cuenta. Es la que sobrevive a las fusiones y la que usan todas las tablas.
      example: ACC-000001
    - entity: account
      field: legal_id
      type: string
      definition: Identificador fiscal o equivalente, para empatar CRM, producto y facturación.
      example: NIT-ILUSTRATIVO
    - entity: account
      field: industry, segment (+ valid_from, valid_to en el historial)
      type: enum
      definition: Industria y segmento con vigencia (SCD2).
      example: Restaurantes · pyme
    - entity: account
      field: first_seen_at
      type: timestamp
      definition: Primera aparición de la cuenta en cualquier sistema.
      example: 2025-03-04 09:58
    - entity: account
      field: lifecycle_status
      type: enum (derivado)
      definition: prospect / customer / former_customer, derivado de las suscripciones.
      example: customer
    - entity: account_xref
      field: source_system, source_id
      type: enum, string
      definition: Sistema origen y el ID tal cual viene de él.
      example: legacy_industry · Cliente 1
    - entity: account_xref
      field: valid_from, valid_to
      type: date
      definition: Vigencia del mapeo; permite fusiones y separaciones sin perder historia.
      example: 2022-01-01 · (vacío)
    - entity: account_xref
      field: match_method
      type: enum
      definition: parse / legal_id / email_domain / manual.
      example: parse
    - entity: person
      field: person_id
      type: string
      definition: Persona (contacto o usuario).
      example: P-7781
    - entity: person
      field: account_id
      type: string (nullable)
      definition: Cuenta a la que pertenece, una vez empatada.
      example: ACC-EJ-01
    - entity: person
      field: email_hash
      type: string
      definition: Email normalizado y hasheado, para deduplicar sin exponer el dato personal.
      example: sha256:…
    - entity: channel
      field: channel_id, channel_group
      type: enum
      definition: Canal normalizado y su grupo (paid / owned / earned / sales / partner / unknown).
      example: paid_search · paid
    - entity: channel
      field: mapping_rule, valid_from, valid_to
      type: string, date
      definition: Regla utm_source + utm_medium → canal, con vigencia.
      example: google + cpc → paid_search
    - entity: channel
      field: sm_rubro
      type: enum
      definition: Rubro de sm_spend al que se imputa el gasto del canal.
      example: paid_media
    - entity: campaign
      field: campaign_id
      type: string
      definition: ID de la campaña; igual a utm_id cuando exista.
      example: cmp-2025-03-ejemplo
    - entity: campaign
      field: channel_id, start_date, end_date, offer
      type: string, date, string
      definition: Canal, vigencia y oferta (p. ej. un descuento de entrada, si Finora los introduce).
      example: paid_social · 2025-03-01 · 2025-03-31
    - entity: campaign_member
      field: campaign_id, person_id, lead_id
      type: string
      definition: Quién fue impactado por qué campaña.
      example: cmp-2025-03-ejemplo · P-7781
    - entity: campaign_member
      field: status, first_responded_at
      type: enum, timestamp
      definition: Enviado / respondió / asistió, y fecha de la primera respuesta.
      example: respondió · 2025-03-05
    - entity: touch
      field: touch_id, occurred_at
      type: string, timestamp
      definition: Un toque de marketing y cuándo ocurrió.
      example: T-99120 · 2025-03-04 09:58
    - entity: touch
      field: person_id, anonymous_id
      type: string
      definition: Quién hizo el toque, o su ID anónimo antes de identificarse.
      example: anon_ejemplo
    - entity: touch
      field: utm_source, utm_medium, utm_campaign, utm_id, utm_content, utm_term
      type: string
      definition: Parámetros UTM normalizados en minúsculas; si faltan, van a «desconocido».
      example: google · cpc · campana-ejemplo
    - entity: touch
      field: touch_type, landing_page, referrer
      type: enum, string
      definition: Visita / formulario / evento / respuesta a campaña.
      example: formulario
    - entity: campaign_spend
      field: campaign_id, channel_id, spend_date
      type: string, date
      definition: Grano del gasto.
      example: cmp-2025-03-ejemplo · 2025-03-01
    - entity: campaign_spend
      field: amount, currency, unit
      type: decimal, string
      definition: Gasto con moneda y unidad explícitas (lo que hoy falta en sm_spend).
      example: 1.250.000 · COP · pesos
    - entity: campaign_spend
      field: sm_rubro
      type: enum
      definition: Rubro para cuadrar contra sm_spend.
      example: paid_media
    - entity: lead
      field: lead_id, person_id, account_id
      type: string
      definition: El lead y a quién pertenece.
      example: L-501 · P-7781 · ACC-EJ-02
    - entity: lead
      field: created_at, created_by_user_id
      type: timestamp, string
      definition: Cuándo se creó y quién lo creó (sistema o SDR; distingue inbound de outbound).
      example: 2025-03-10 09:12 · U-SDR-07
    - entity: lead
      field: lead_source
      type: enum
      definition: 'Fuente al crearse: demo_request, signup, outbound, referral, ex_customer, import.'
      example: outbound
    - entity: lead
      field: first_touch_id, channel_id, campaign_id
      type: string
      definition: Primer toque, con su canal y su campaña.
      example: T-99120 · paid_search
    - entity: lead
      field: status
      type: enum
      definition: New / Working / Engaged / Qualified / Disqualified / Nurture (valores a validar con Finora).
      example: Engaged
    - entity: lead
      field: converted_at, converted_opportunity_id, disqualified_reason
      type: timestamp, string, enum
      definition: Conversión a oportunidad, o motivo del descarte.
      example: 2025-03-24 · O-88
    - entity: opportunity
      field: opportunity_id, account_id, source_lead_id
      type: string
      definition: La oportunidad, su cuenta y el lead de origen.
      example: O-88 · ACC-EJ-02 · L-501
    - entity: opportunity
      field: opportunity_type
      type: enum
      definition: new / expansion / reactivation / renewal.
      example: new
    - entity: opportunity
      field: owner_user_id
      type: string
      definition: AE dueño actual (la historia vive en assignment).
      example: U-AE-02
    - entity: opportunity
      field: created_at, stage, expected_mrr, expected_close_date
      type: timestamp, enum, decimal, date
      definition: Estado actual de la oportunidad.
      example: 2025-03-24 · Discovery · 120
    - entity: opportunity
      field: closed_at, is_won, loss_reason, subscription_id
      type: timestamp, boolean, enum, string
      definition: Resultado y suscripción resultante.
      example: 2025-04-15 · true · SUB-310
    - entity: stage_history
      field: stage_event_id, object_type, object_id, account_id
      type: string, enum
      definition: Qué objeto cambió (lead u oportunidad).
      example: SH-3 · lead · L-501
    - entity: stage_history
      field: from_stage, to_stage
      type: enum
      definition: Etapa anterior y nueva; admite retrocesos y saltos.
      example: Working → Engaged
    - entity: stage_history
      field: changed_at, changed_by_user_id, change_source
      type: timestamp, string, enum
      definition: Cuándo, quién y por qué vía (manual / workflow / integración / import).
      example: 2025-03-18 16:05 · U-SDR-07 · manual
    - entity: stage_history
      field: expected_mrr_at_change, expected_close_date_at_change
      type: decimal, date
      definition: Monto y cierre esperados en el momento del cambio.
      example: 120 · 2025-04-30
    - entity: activity
      field: activity_id, activity_type, direction
      type: string, enum
      definition: Llamada / email / reunión / demo / mensaje; inbound u outbound.
      example: A-7001 · llamada · outbound
    - entity: activity
      field: owner_user_id
      type: string
      definition: SDR o AE que la ejecutó.
      example: U-SDR-07
    - entity: activity
      field: person_id (quién), related_type + related_id (sobre qué), account_id
      type: string
      definition: Con quién y sobre qué objeto.
      example: P-7781 · lead · L-501
    - entity: activity
      field: occurred_at, logged_at
      type: timestamp
      definition: Cuándo ocurrió y cuándo se registró (detecta registro tardío).
      example: 2025-03-10 11:35 · 2025-03-10 11:40
    - entity: activity
      field: outcome, duration_seconds
      type: enum, integer
      definition: Conectó / sin respuesta / reunión agendada; duración.
      example: reunión agendada · 540
    - entity: sales_user
      field: user_id, role, team, manager_id
      type: string, enum
      definition: SDR / AE / CSM y su equipo.
      example: U-AE-02 · AE
    - entity: sales_user
      field: start_date, valid_from, valid_to
      type: date
      definition: Fecha de inicio (rampa) y vigencia del rol.
      example: '2024-11-01'
    - entity: assignment
      field: assignment_id, object_type, object_id, account_id
      type: string, enum
      definition: Qué objeto se asignó.
      example: AS-55 · lead · L-501
    - entity: assignment
      field: user_id, role
      type: string, enum
      definition: A quién se asignó y en qué rol.
      example: U-SDR-07 · SDR
    - entity: assignment
      field: valid_from, valid_to, assignment_method
      type: timestamp, enum
      definition: Periodo como dueño y cómo se asignó (round robin / territorio / manual / reasignación).
      example: 2025-03-10 · 2025-03-24 · round_robin
    - entity: product_event
      field: event_id, event_name
      type: string, enum
      definition: Signed Up, Account Created, Trial Started/Ended, Activation (definición de Finora), Checkout Started/Completed,
        Invite Sent.
      example: Signed Up
    - entity: product_event
      field: account_id (groupId), person_id, anonymous_id
      type: string
      definition: Cuenta y usuario del evento; account_id es obligatorio salvo antes del registro.
      example: ACC-EJ-01
    - entity: product_event
      field: occurred_at, received_at
      type: timestamp
      definition: Hora del evento y hora de recepción (controla la carga tardía).
      example: 2025-03-04 10:02
    - entity: product_event
      field: properties
      type: json
      definition: signup_type (organic / invited), plan, contexto UTM.
      example: '{signup_type: organic}'
    - entity: subscription
      field: subscription_id, account_id, billing_customer_id
      type: string
      definition: La suscripción, su cuenta y el cliente en facturación.
      example: SUB-310 · ACC-EJ-01 · cus_ILUSTRATIVO
    - entity: subscription
      field: source_opportunity_id
      type: string (nullable)
      definition: Oportunidad de origen; queda vacía en self-serve puro.
      example: O-88
    - entity: subscription
      field: status
      type: enum
      definition: trialing / active / past_due / canceled / unpaid / paused.
      example: past_due
    - entity: subscription
      field: start_date, trial_start, trial_end
      type: date
      definition: Inicio y periodo de trial.
      example: '2025-04-01'
    - entity: subscription
      field: cancel_requested_at, canceled_at, ended_at, cancellation_reason
      type: timestamp, enum
      definition: Cuándo se pidió la cancelación, cuándo fue efectiva, fin y motivo.
      example: 2025-09-30 · precio
    - entity: subscription
      field: collection_method
      type: enum
      definition: Cobro automático o por factura.
      example: factura
    - entity: subscription_item_version
      field: item_version_id, subscription_id, plan_id
      type: string
      definition: Ítem contratado y plan de catálogo.
      example: IV-1 · SUB-310 · plan_ejemplo
    - entity: subscription_item_version
      field: list_unit_price, quantity, billing_interval_months
      type: decimal, integer
      definition: 'Lo tarifado: precio de lista por unidad y periodo, cantidad e intervalo (1 = mensual, 12 = anual).'
      example: 50 · 2 · 1
    - entity: subscription_item_version
      field: valid_from, valid_to, change_reason
      type: date, enum
      definition: Vigencia y motivo del cambio (upgrade / downgrade / cantidad / precio).
      example: 2025-04-01 · (vacío) · alta
    - entity: subscription_item_version
      field: list_mrr (derivado)
      type: decimal
      definition: list_unit_price × quantity ÷ billing_interval_months.
      example: '100'
    - entity: discount
      field: discount_id, subscription_id
      type: string
      definition: El descuento y la suscripción (o el ítem) a la que aplica.
      example: D-9 · SUB-310
    - entity: discount
      field: discount_type, value, duration
      type: enum, decimal, enum
      definition: Porcentaje o monto; once / repeating / forever.
      example: porcentaje · 20 · repeating
    - entity: discount
      field: valid_from, valid_to
      type: date
      definition: Vigencia; es la clave para los descuentos temporales.
      example: 2025-04-01 · 2025-06-30
    - entity: discount
      field: reason, approved_by_user_id, campaign_id
      type: enum, string
      definition: Promo de entrada / retención / negociación; quién lo aprobó; campaña, si aplica.
      example: promo de entrada · U-AE-02
    - entity: invoice
      field: invoice_id, subscription_id, account_id
      type: string
      definition: La factura.
      example: INV-1201
    - entity: invoice
      field: period_start, period_end
      type: date
      definition: Periodo de servicio que cubre (distingue un prepago multimes de una expansión).
      example: 2025-05-01 · 2026-04-30
    - entity: invoice
      field: subtotal_list, discount_amount, amount_due
      type: decimal
      definition: Lo facturado antes y después del descuento.
      example: 600 · 0 · 600
    - entity: invoice
      field: due_at, status
      type: date, enum
      definition: Vencimiento; open / paid / void / uncollectible.
      example: 2025-05-15 · paid
    - entity: payment
