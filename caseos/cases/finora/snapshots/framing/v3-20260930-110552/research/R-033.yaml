  AND returned_same_amount_next_month = 1 THEN 1 ELSE 0 END) AS churn_vuelve_t1_mismo_monto, SUM(CASE WHEN movement_type
  IN ('expansion','contraction') THEN 1 ELSE 0 END) AS eventos_exp_contr, SUM(CASE WHEN movement_type IN ('expansion','contraction')
  AND reverts_next_month = 1 THEN 1 ELSE 0 END) AS exp_contr_revierte_t1, SUM(CASE WHEN multi_month_payment_signature
  > 0 THEN 1 ELSE 0 END) AS filas_firma_pago_multimes, COUNT(DISTINCT CASE WHEN multi_month_payment_signature >
