  AS clientes_con_algun_pago, COUNT(*) AS clientes FROM (SELECT customer_id, MAX(amount) AS mx FROM staging.stg_customer_month
  GROUP BY customer_id) t
- SELECT (SELECT COUNT(DISTINCT customer_id) FROM staging.stg_customer_month) AS clientes_en_pagos, (SELECT COUNT(DISTINCT
