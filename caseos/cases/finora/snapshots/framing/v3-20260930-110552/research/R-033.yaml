why_it_matters: De este modelo depende qué métricas de C-006 y C-009 se le pueden prometer al CRO y al CFO, qué
  color lleva cada rama del semáforo de C-009 y en qué orden se instrumenta. Si el as-is ni siquiera separa churn
  de mora después del pago, las ramas post-pago del árbol no pueden ir en verde.
short_answer: 'Hoy hay tres fuentes y todas son de después del pago: pagos por cliente × mes (1.961 clientes × 34
  meses, todos con al menos un pago), industria por cliente y gasto S&M por rubro × mes. Responden el stock y el
  puente de monto pagado, los cortes por industria y por cohorte de primer pago y la eficiencia S&M agregada. No
  responden nada de antes del pago (canal, etapa, tiempo de cierre, intervención, estancamiento) y tampoco separan
  cancelación de mora: 330 de 751 churn observados vuelven a pagar al mes siguiente. El to-be de la hipótesis de
  trabajo se sostiene con patrones estándar (objetos de CRM, UTM, eventos B2B, suscripciones tipo Stripe, snapshots
  de Kimball), con tres ajustes: una espina account_id con crosswalk de IDs, una tabla de entradas (funnel_entry)
  que separa la puerta de la ruta para C-006, y la suscripción dividida en ítems con vigencia, descuentos, facturas
  y pagos, para que C-009 se calcule sobre MRR contratado y muestre el cobrado al lado. Confianza alta en el as-is
  (lo consulté en el modelo) y media en el to-be (son patrones externos; no conocemos el stack ni las definiciones
  de Finora).'
