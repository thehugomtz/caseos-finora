  verified: true
- id: DM-11
  title: Churn que vuelve en t+1, reversiones de expansión/contracción y firmas de pago multimes
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT SUM(CASE WHEN movement_type = 'churn' THEN 1 ELSE 0 END) AS eventos_churn, SUM(CASE WHEN movement_type
    = 'churn' AND returned_next_month = 1 THEN 1 ELSE 0 END) AS churn_vuelve_t1, SUM(CASE WHEN movement_type = 'churn'
    AND returned_same_amount_next_month = 1 THEN 1 ELSE 0 END) AS churn_vuelve_t1_mismo_monto, SUM(CASE WHEN movement_type
    IN ('expansion','contraction') THEN 1 ELSE 0 END) AS eventos_exp_contr, SUM(CASE WHEN movement_type IN ('expansion','contraction')
    AND reverts_next_month = 1 THEN 1 ELSE 0 END) AS exp_contr_revierte_t1, SUM(CASE WHEN multi_month_payment_signature
    > 0 THEN 1 ELSE 0 END) AS filas_firma_pago_multimes, COUNT(DISTINCT CASE WHEN multi_month_payment_signature
    > 0 THEN customer_id END) AS clientes_firma_pago_multimes FROM mart.customer_month
  verified: true
