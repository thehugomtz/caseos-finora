    edge_cases:
    - 'Base previa: 377 clientes ya activos en ene-22 (left_censored), sin fecha de entrada ni puerta. Quedan fuera
      de las cohortes por puerta, salvo que el CRM tenga historia.'
    - '108 altas de feb-22 marcadas como suspected_spillover: posible arrastre de la base previa.'
    - 'Churn en el último mes: 33 eventos en oct-24 sin t+1 observable (censura por la derecha).'
    - 'Una cuenta con varias suscripciones o varias entidades de facturación, y fusiones o separaciones de cuentas:
      se resuelven con account_xref con vigencia y una llave que sobrevive.'
    - 'Varias personas de la misma empresa que entran por puertas distintas el mismo mes: una sola entrada por cuenta,
      gana la primera puerta y lo demás son toques.'
    - 'Re-entradas: un ex-cliente que vuelve (Reactivate) vs un lead que se enfría y reaparece (si pasaron menos
      de R días, es la misma entrada).'
    - 'Una cuenta self-serve que paga sin tener lead en el CRM: su funnel_entry nace del product_event.'
    - 'Oportunidades de expansión: no son entradas nuevas; alimentan expansion MRR, no C-006.'
    - 'Etapas que retroceden o se saltan: HubSpot, por defecto, solo avanza automáticamente, así que hay que registrar
      los retrocesos de forma explícita.'
    - 'Reasignación a mitad del ciclo: el crédito de cada hito va a quien era dueño en ese momento, según assignment.'
    - 'Actividades registradas tarde o en lote: se usa occurred_at, no logged_at, y se mide el retraso de registro.'
    - Pago anual o multimes, pago atrasado (cobro doble) y pago parcial.
    - 'Descuento del 100% (¿churn o activo?) y trial gratuito (fuera del MRR hasta que pague): son decisiones de
      definición.'
    - 'Toques sin UTM: van a canal «desconocido» y se reporta qué porcentaje representan.'
    - 'Moneda y escala: los montos del caso son × 10.000 COP (escala documentada); la unidad del gasto S&M no está
      documentada.'
    - 'Una industria que cambia en el tiempo: se maneja con el historial SCD2 de account.'
    data_quality_rules:
    - 'Unicidad: account_id único; cada (source_system, source_id) apunta a una sola cuenta en cualquier fecha,
      sin solapes de vigencia.'
    - 'Integridad: 100% de subscription, opportunity e invoice con account_id. El % de leads y product_events sin
      cuenta se reporta cada semana (el umbral es decisión).'
    - 'Dominios cerrados: door, route, lead.status, stage, subscription.status, activity_type y channel_group solo
      toman valores de su lista.'
    - 'Orden temporal: entry_at ≤ sql_at ≤ won_at (si no, se marca); changed_at creciente por objeto en stage_history;
      valid_from < valid_to.'
    - 'Sin solapes: assignment por objeto × rol; subscription_item_version por ítem; discount por suscripción (salvo
      apilado explícito).'
    - 'Reconciliación de cobro: la suma de payment por cuenta × mes = collected en account_month. Durante la transición,
      = raw.transactions × 10.000, con el mismo patrón que los 7 checks actuales.'
    - 'Reconciliación de gasto: la suma de campaign_spend por rubro × mes = sm_spend, con la unidad documentada.'
    - 'Cobertura de canal: % de entradas con canal distinto de «desconocido»; UTMs normalizados en minúsculas.'
    - 'MRR: list_mrr ≥ 0; net_mrr ≤ list_mrr; normalización por intervalo verificada.'
    - 'Puente: MRR inicial + movimientos = MRR final de cada mes, al centavo, como hoy.'
    - 'Frescura: eventos cargados en menos de 24 h; el snapshot mensual cierra el día N del mes siguiente (N es
      decisión).'
    - 'Dueño por campo: cada campo tiene dueño, tipo, valores permitidos y un test.'
    implementation_considerations:
    - 'Secuencia propuesta (Hugo decide): (a) definiciones + account_id + crosswalk, sin sistemas nuevos (C-013);
      (b) capturar desde ya lo que no se puede reconstruir: UTMs en formularios y registro, lead_source, historial
      de etapas y de dueños, actividades, estado de suscripción y periodo de factura; (c) construir funnel_entry
      y account_month; (d) tableros por foro (C-014).'
    - Lo que no se captura no se reconstruye. Sin historial en los sistemas de Finora, las cohortes por puerta arrancan
      el día que empieza la captura y la primera lectura llega W días después. Si el CRM guarda historial, se puede
      reconstruir hacia atrás (patrón de historial diario).
    - 'No reescribir mart.customer_month: queda como capa «monto pagado observado» y account_month agrega la capa
      «MRR contratado»; las dos se reconcilian cada mes. Usar nombres distintos para no cambiar una métrica en silencio.'
    - 'Los objetos de Salesforce/HubSpot, la spec de Segment y Stripe son patrones de referencia, no recomendación
      de herramienta: el stack de Finora no está en el caso.'
    - 'funnel_entry se actualiza en el lugar (accumulating snapshot): conviene recalcularlo desde los eventos para
      auditarlo, y versionar las reglas de puerta y ruta.'
    - 'Dueños por capa: Marketing (UTMs, campañas, gasto), RevOps (lead, oportunidad, etapas, actividades, asignación),
      Producto (taxonomía de eventos y definición de activación), Finanzas (suscripción, descuentos, facturas, pagos,
      unidad del gasto).'
    - Asignar el costo del equipo (team, payroll) a las puertas requiere una regla (por actividades o por asignación).
      Esa regla es una decisión, no un dato; paid media se asigna por campaña.
    - 'Datos personales (email, teléfono) en person y touch: minimizar y hashear; revisar la regulación local de
      datos personales (no la verifiqué en esta corrida).'
    - 'Grano único por tabla: no mezclar cuenta × mes con entrada ni con evento. Las métricas de C-006 salen de
      funnel_entry y las de C-009 de account_month.'
