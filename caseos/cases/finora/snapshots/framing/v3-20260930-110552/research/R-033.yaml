  FROM mart.customer_month
- SELECT COUNT(*) AS eventos_churn, SUM(CASE WHEN n.observed_amount > 0 THEN 1 ELSE 0 END) AS paga_en_t1, SUM(CASE
  WHEN n.observed_amount > 0 AND ABS(n.paid_mrr_cop - c.previous_month_mrr) < 1 THEN 1 ELSE 0 END) AS paga_en_t1_mismo_monto_previo,
  SUM(CASE WHEN n.customer_id IS NULL THEN 1 ELSE 0 END) AS churn_en_ultimo_mes_sin_t1 FROM mart.customer_month
  c LEFT JOIN mart.customer_month n ON n.customer_id = c.customer_id AND n.month_index = c.month_index + 1 WHERE
  c.movement_type = 'churn'
- SELECT (SELECT MIN(month) FROM staging.stg_sm_spend) AS sm_primer_mes, (SELECT MAX(month) FROM staging.stg_sm_spend)
