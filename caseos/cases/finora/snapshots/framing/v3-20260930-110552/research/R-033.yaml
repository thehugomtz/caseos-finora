  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT COUNT(*) AS filas, COUNT(DISTINCT customer_id) AS clientes, COUNT(DISTINCT month) AS meses, MIN(month)
    AS primer_mes, MAX(month) AS ultimo_mes, SUM(CASE WHEN amount = 0 THEN 1 ELSE 0 END) AS filas_en_cero, SUM(CASE
    WHEN amount > 0 THEN 1 ELSE 0 END) AS filas_positivas, SUM(CASE WHEN amount < 0 THEN 1 ELSE 0 END) AS filas_negativas,
    SUM(CASE WHEN amount IS NULL THEN 1 ELSE 0 END) AS filas_nulas FROM staging.stg_customer_month
  verified: true
- id: DM-06
  title: Clientes que nunca pagan vs clientes con algún pago
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT SUM(CASE WHEN mx = 0 THEN 1 ELSE 0 END) AS clientes_nunca_pagan, SUM(CASE WHEN mx > 0 THEN 1 ELSE
    0 END) AS clientes_con_algun_pago, COUNT(*) AS clientes FROM (SELECT customer_id, MAX(amount) AS mx FROM staging.stg_customer_month
    GROUP BY customer_id) t
  verified: true
- id: DM-07
  title: Cobertura de la llave entre pagos e industria; filas vacías
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT (SELECT COUNT(DISTINCT customer_id) FROM staging.stg_customer_month) AS clientes_en_pagos, (SELECT
    COUNT(DISTINCT customer_id) FROM staging.stg_customers) AS clientes_en_industria, (SELECT COUNT(DISTINCT m.customer_id)
    FROM staging.stg_customer_month m LEFT JOIN staging.stg_customers c ON m.customer_id = c.customer_id WHERE c.customer_id
    IS NULL) AS pagos_sin_industria, (SELECT COUNT(*) FROM staging.stg_customers c WHERE c.customer_id NOT IN (SELECT
    DISTINCT customer_id FROM staging.stg_customer_month)) AS industria_sin_pagos, (SELECT COUNT(*) FROM raw.industry
    WHERE "ID" IS NULL OR TRIM("ID") = '') AS filas_industria_vacias
  verified: true
- id: DM-08
  title: Distribución de clientes por industria
  url: ''
  publisher: Modelo de datos del caso (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT industry, COUNT(*) AS clientes FROM staging.stg_customers GROUP BY industry ORDER BY clientes DESC
