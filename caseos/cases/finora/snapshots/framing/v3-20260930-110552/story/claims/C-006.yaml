limitations:
- 'Pendiente de tu aceptación: F-223 a F-227 y los demás findings citados están propuestos.'
- 'Hoy no se calcula ninguna métrica antes del pago (F-223): es diseño.'
- W, el umbral de estancamiento por etapa y el plazo Won → pago son parámetros a acordar con Finora, no estándares
  de mercado (Q-064).
- Won o primer pago como hito de adquisición sigue por acordar con el CRO.
- La conversión de Hybrid refleja a quién eligen tocar SDR/AE, no lo que aporta la persona (H-050). Las tasas de
  etapas intermedias no se comparan entre rutas (SQL contra activación).
visual_intent: 'Converge: cada funnel lleva sus métricas por familia en su propio tramo, y todos desembocan en el
  mismo nudo (Won y primer pago), el único lugar donde se comparan por puerta.'
hugo_wording: «¿cada funnel? ¿cómo lo mides? no me refiero a solo medir la connversión, ¿que metricas hay en todo
  eso? Ej. Digital podría tener digital leads y CR digital, algo asi, Executive ya sabes que tiens New, pero tambien
  puedes tener métricas de tiempo de cierre»
