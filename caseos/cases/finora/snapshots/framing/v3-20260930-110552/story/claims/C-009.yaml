limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- 'El monto pagado mezcla fecha de cobro y mes de servicio: el churn, la reactivación y la expansión observados
  salen inflados (F-136). La retención aquí es «sigue pagando», no retención contractual.'
- 'El churn observado de 2024 no coincide entre tablas: 2,04% en T-002 y T-085 (ventana ene–jul) y 1,9% en T-034.
  Hay que fijar una sola cifra (X-101).'
- 'CAC en COP, payback, LTV con margen, LTV:CAC y UCM no tienen valor: faltan unidad del gasto, canal, margen y
  costo de servir (F-137, F-138).'
- El as-is no separa cancelación de mora, prepago de expansión ni plan de precio y descuento (F-239).
visual_intent: 'Árbol de ingreso recurrente: el resultado se abre en movimiento, clientes, retención y eficiencia;
  cada hoja está en un solo lugar, con su color de semáforo.'
hugo_wording: «C-009 ¿hay otras métricas que debean de proponerse? De todo eso hay que ser explicitos en como se
  miden y siempre siempre ser MECE» · MRR, ARR, ARPU, CAC, LTV, Churn, UCM y cómo medirlas.
