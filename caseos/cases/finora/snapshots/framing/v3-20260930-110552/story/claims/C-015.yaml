id: C-015
type: claim
key: pricing-entrada
question: ¿Qué data observable de pricing introductorio podemos sacar de los pagos?
headline: Lo observable es el primer y segundo pago; el descuento no es verificable
answer: 'Del histórico se saca el ticket de entrada: la mediana del primer pago observado de las altas es COP 63,0
  mil en 2022, COP 36,8 mil en 2023 y COP 42,0 mil en 2024, y la del segundo pago, COP 52,5 mil, COP 36,8 mil y
  COP 38,9 mil. El segundo pago coincide exactamente con el primero en 73,5%, 90,3% y 77,3% de las altas. El primero
  supera con holgura al segundo en 23,2% de las altas de 2022, frente a 7,1% en 2023 y 11,6% en 2024, un patrón
  que no dice si el primer pago incluye un cargo inicial, un cobro atrasado o un precio distinto. Con cliente, mes
  y monto no se pueden separar lista, descuento, crédito ni pausa, y la huella de un descuento temporal limpio casi
  no aparece: eso es consistente con que los descuentos sean algo por introducir, pero no prueba que no existieran.'
