limitations:
- Primer pago observado no es adquisición. El primer pago de 2022 incluye pagos iniciales grandes (F-166).
- 'Es monto pagado, no MRR contratado: no hay catálogo de precios ni definición del campo (F-093).'
- Que la huella limpia de descuento sea escasa no prueba ausencia (F-134).
- No se afirman descuentos a partir del tamaño de un salto del monto.
visual_intent: 'Converge: el primer y el segundo pago se juntan después de 2022. Lista, descuento, crédito y pausa
  quedan fuera del dato.'
hugo_wording: Qué data observable de pricing introductorio podemos sacar.
