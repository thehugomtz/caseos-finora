limitations:
- 'Pendiente de tu aceptación: F-246, F-247, F-249 y F-252 están propuestos.'
- El CAC en COP y el payback piden documentar la unidad y moneda del gasto (F-063) y acordar qué es adquirir un
  cliente.
- Sin ruta ni canal por cuenta no hay CAC por ruta ni por Digital/KAM (F-137, F-146). El magic number no tiene umbrales
  comparables (F-247).
- Habilitación puede ser gasto comercial o de producto, y el nivel del S&M por alta cambia según cómo se cuente
  (F-068, F-069).
- 'Lo que se pide como ARPU es ARPA: se mide por cliente, no por usuario (F-139). El ARR solo existe como run-rate,
  y solo si apruebas el MRR normalizado.'
- Reemplaza a C-009. C-009 y el proxy de CAC (C-010) quedan en anexo.
visual_intent: 'Split: cada métrica nueva conectada con la decisión del CRO o la hoja del árbol a la que sirve,
  con su semáforo de hoy frente al dato que falta.'
hugo_wording: «por lo que veo falta lo de eficiencia pero por que proponemos esas métricas? tambien hay que dejarlo
  claro» (N-059).
