client: Alegra · reto técnico
company: Finora — SaaS ficticio para PyMEs; montos en COP
audience_note: 'CRO: cómo conseguimos clientes. CFO: qué mueve el ingreso recurrente. CEO: cómo se conectan ambas
  cosas. Marketing, Sales, Producto y Finanzas pueden aportar contexto; no elegimos un culpable. (brief v0.3 §01)'
data_available:
- 'Modelo de datos: Finora · modelo analítico (finora-eda · Business Exploration Workspace) — Raw 3 · Staging 3
  · Mart · procesado 7; 7/7 checks de reconciliación OK.'
- 'raw.transactions — Pagos mensuales por cliente tal cual llegaron: ID, month (M/D/AAAA) y amount sin escala (66.674
  filas; grano fila del archivo · cliente × mes)'
- raw.industry — Industria de cada cliente («Cliente N» → industria), tal cual llegó (1.962 filas; grano fila del
  archivo · cliente)
- raw.sm_spend — Gasto mensual de Sales & Marketing por rubro, en texto con «$» (unidad no documentada) (34 filas;
  grano fila del archivo · mes)
- 'mart.customer_month — Panel analítico: monto observado, MRR pagado, banderas (alta, churn observado, reactivación,
  expansión, contracción), movimientos, tenure, cohorte y cosecha (66.674 filas; grano cliente × mes)'
- mart.monthly_metrics — Las métricas mensuales recalculadas en SQL desde customer_month; cuadran al centavo con
  la Fase 1 (34 filas; grano mes)
- mart.new_customers — Cada alta con su primer pago (M0), run-rate temprano, cohorte e industria (1.584 filas; grano
  alta)
success_criteria:
- Preguntas separadas sin contar lo mismo dos veces; hipótesis con una explicación alternativa; evidencia que ayude
  a distinguirlas; tareas que sepamos cuándo cerrar. (brief v0.3 §01)
- 'Los casos del CFO se contestan con el modelo propuesto, sin ambigüedad: (a) la suscripción sube de 100 a 130
  con un descuento de 30 y el cliente sigue pagando 100; (b) un cliente pasa de pagar 100 a 80: ¿contrajo 20 o recibió
  un descuento?; (c) cuando el descuento desaparece, ¿cuenta como expansión?'
- La solución para el CRO (Growth L7) dice qué decisiones le permite tomar cada pieza, no sólo qué muestra.
