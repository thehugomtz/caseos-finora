finding_text: El ticket de entrada es medible; el descuento no es verificable aquí
why: 'R-020 cumple la parte observable de H-009: el primer pago es más bajo (mediana −33%, promedio −60%, F-084)
  y el 97% del cambio ocurre dentro de cada industria (F-088). Pero no permite distinguir «suscripciones o tarifas
  distintas» de descuento, crédito o pausa (F-093), y la misma evidencia encaja igual de bien con H-010. Por D-004
  no conviene darla por soportada. Para probarla harían falta el plan y la tarifa de entrada de cada cliente, y
  esos datos no están en el caso (R-008, R-011). Además, la magnitud depende del pago que se use (ver Q-012).'
