id: F-231
type: finding
headline: 'Capacidad (H-006), estancamiento (H-055) e incentivos del SDR (H-054) no compiten por la misma brecha
  si se miden por su firma: tiempo a primer toque y carga; bolsa de estancados y compra de los retomados; aceptación
  del AE según el origen del SQL.'
evidence_text: HBR (2011) sostiene que la mayoría de las empresas no responde a los leads online lo bastante rápido
  (W-04). Según lo que se reporta de ese estudio, responder en la primera hora se asoció con casi 7 veces más probabilidad
  de calificar el lead que responder una hora después, y más de 60 veces frente a 24 horas o más (W-05). TTEC cuenta
  que pagar al SDR por reunión llevó a pasar leads menos filtrados y que, al pagar el triple cuando la reunión se
  vuelve SAL u oportunidad, lo que pasa tiene más probabilidad de ganarse (W-06).
confidence: medium
limitations:
- 'Son benchmarks observacionales (2011) y un caso de una sola empresa: sirven para diseñar el test, no describen
  a Finora ni prueban causa.'
kind: measurement
