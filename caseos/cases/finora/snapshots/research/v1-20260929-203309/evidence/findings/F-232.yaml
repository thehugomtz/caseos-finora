id: F-232
type: finding
headline: 'Calidad al entrar (H-005), decisión en Proposal (H-056) y misma demanda por otra puerta (H-053) solo
  se prueban con datos que no dependan de lo que Sales opine después: señales congeladas al crear el lead, motivos
  validados con compradores y cruce de identidad con el producto.'
evidence_text: 'En 1.000 oportunidades perdidas, los motivos del CRM coincidieron con los del comprador solo 15%
  de las veces y el competidor registrado fue incorrecto en casi 7 de cada 10 (W-07). Para saber si el toque comercial
  agrega ventas o solo cambia la puerta, la atribución no alcanza: hace falta un holdout, es decir, un grupo similar
  no expuesto (W-08).'
confidence: medium
limitations:
- Clozd vende win/loss (sesgo de proveedor). Un holdout de ruteo necesita volumen y aprobación comercial.
kind: measurement
claims:
- claim: 'Clozd comparó 1.000 oportunidades perdidas: los motivos del CRM coincidieron con lo que reportó el comprador
    solo 15% de las veces y el competidor registrado fue incorrecto en casi 7 de cada 10.'
  source_id: W-07
  source_type: industry
  confidence: medium
  freshness: 2023-04-21 (modificado 2025-10-24)
  supports_or_contests: supports
  notes: Proveedor de win/loss (sesgo posible). Respalda que la opinión posterior de Sales no basta (H-005, H-056).
- claim: Un holdout compara un grupo expuesto con uno similar no expuesto para estimar el efecto incremental; se
    usa cuando la atribución sobre- o subcuenta.
  source_id: W-08
