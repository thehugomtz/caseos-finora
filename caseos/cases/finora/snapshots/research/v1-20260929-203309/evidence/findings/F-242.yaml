id: F-242
type: finding
headline: 'Lo que no se capture desde ya no se reconstruye después: el to-be mide hacia adelante, salvo que Finora
  tenga historial en sus sistemas.'
evidence_text: Los 377 clientes que ya estaban activos en ene-22 (left_censored) no tienen fecha de entrada ni puerta.
  Hay 108 altas de feb-22 que parecen arrastre. No existe registro de quien no compró, y el catálogo no guarda historia
  de etapas, dueños ni estados.
confidence: medium
limitations:
- Si el CRM o la facturación de Finora guardan historial, se puede reconstruir hacia atrás. No sabemos si lo guardan.
