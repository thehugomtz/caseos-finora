query: "-- E-003\nWITH r AS (\n  SELECT month, total_sm_spend AS tot, 'team' AS rubro, team AS v FROM mart.sm_monthly\n
  \ UNION ALL SELECT month, total_sm_spend, 'paid_media', paid_media FROM mart.sm_monthly\n  UNION ALL SELECT month,
  total_sm_spend, 'travel', travel FROM mart.sm_monthly\n  UNION ALL SELECT month, total_sm_spend, 'software_tools',
  software_tools FROM mart.sm_monthly\n  UNION ALL SELECT month, total_sm_spend, 'freelance', freelance FROM mart.sm_monthly\n),
  s AS (\n  SELECT rubro, month, v/NULLIF(tot,0) AS share,\n         CASE WHEN month <= '2023-05' THEN 'hasta_may23'
  ELSE 'desde_jun23' END AS tramo\n  FROM r\n)\nSELECT rubro, tramo, COUNT(*) AS meses,\n  ROUND(MIN(share),4) AS
  share_min,\n  ROUND(MAX(share),4) AS share_max,\n  COUNT(DISTINCT ROUND(share,4)) AS valores_distintos_de_share,\n
  \ SUM(CASE WHEN ABS(share*200 - ROUND(share*200)) < 0.0005 THEN 1 ELSE 0 END) AS meses_share_multiplo_de_medio_punto\nFROM
  s GROUP BY rubro, tramo ORDER BY rubro, tramo DESC"
