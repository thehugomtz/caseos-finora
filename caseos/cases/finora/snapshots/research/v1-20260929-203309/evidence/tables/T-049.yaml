message: Salud y Tecnología son también las industrias con menor caída del MRR por cliente entre dic-22 y oct-24
  (−14,4% y −15,5%) y aportan 11,7% y 17,0% del crecimiento del MRR, con 124 y 206 clientes activos en oct-24.
