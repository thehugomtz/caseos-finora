query: "-- E-012\nWITH b AS (\n  SELECT industry,\n         SUM(CASE WHEN month = '2022-12' THEN active_customer
  ELSE 0 END) AS activos_dic22,\n         SUM(CASE WHEN month = '2022-12' THEN paid_mrr_cop ELSE 0 END) AS mrr_dic22,\n
  \        SUM(CASE WHEN month = '2024-10' THEN active_customer ELSE 0 END) AS activos_oct24,\n         SUM(CASE
  WHEN month = '2024-10' THEN paid_mrr_cop ELSE 0 END) AS mrr_oct24\n  FROM mart.customer_month\n  WHERE active_customer
  = 1 AND month IN ('2022-12', '2024-10')\n  GROUP BY 1\n)\nSELECT industry,\n       ROUND(mrr_dic22 / activos_dic22,
  0) AS arpa_dic22,\n       ROUND(mrr_oct24 / activos_oct24, 0) AS arpa_oct24,\n       ROUND(100.0 * ((mrr_oct24
  / activos_oct24) / (mrr_dic22 / activos_dic22) - 1), 1) AS arpa_var_pct,\n       activos_dic22,\n       activos_oct24,\n
  \      ROUND(mrr_dic22 / 1000000.0, 2) AS mrr_dic22_millones,\n       ROUND(mrr_oct24 / 1000000.0, 2) AS mrr_oct24_millones,\n
  \      ROUND(100.0 * (mrr_oct24 - mrr_dic22) / (SELECT SUM(mrr_oct24) - SUM(mrr_dic22) FROM b), 1) AS aporte_crecimiento_mrr_pct\nFROM
  b\nORDER BY arpa_var_pct"
