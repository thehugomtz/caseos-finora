query: "-- E-007\nSELECT year AS anio,\n       COUNT(*) AS meses_cliente,\n       ROUND(100.0 * SUM(CASE WHEN amount_vs_usual_ratio
  BETWEEN 0.99 AND 1.01 THEN 1 ELSE 0 END) / COUNT(*), 1) AS pct_en_monto_usual,\n       ROUND(100.0 * SUM(CASE
  WHEN amount_vs_usual_ratio > 1.01 THEN 1 ELSE 0 END) / COUNT(*), 1) AS pct_sobre_usual,\n       ROUND(100.0 *
  SUM(CASE WHEN amount_vs_usual_ratio < 0.99 THEN 1 ELSE 0 END) / COUNT(*), 1) AS pct_bajo_usual,\n       ROUND(100.0
  * SUM(CASE WHEN amount_vs_usual_ratio >= 1.5 THEN 1 ELSE 0 END) / COUNT(*), 1) AS pct_1_5x_o_mas_del_usual,\n
  \      ROUND(100.0 * SUM(multi_month_payment_signature) / COUNT(*), 1) AS pct_firma_pago_multimes\nFROM mart.customer_month\nWHERE
  active_customer = 1 AND tenure_month >= 1 AND CAST(month AS VARCHAR) >= '2022-03'\nGROUP BY 1 ORDER BY 1"
