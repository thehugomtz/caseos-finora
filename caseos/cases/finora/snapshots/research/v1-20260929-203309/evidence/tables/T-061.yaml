title: No es posible separar en los pagos un precio de lista, un descuento introductorio, un crédito o una pausa
  de…
question: ¿Qué data observable de pricing introductorio y de comportamiento del monto se puede sacar de los pagos,
  sin leerla como descuento?
columns:
- Dato
- Qué mide
- Valor
rows:
- - rt_gross
  - Movimiento bruto total del monto pagado sin altas, mar-22 a sep-24 (no es lo revertido)
  - COP 282,8 millones
- - rt_share
  - Parte de ese movimiento bruto que vuelve exacto al nivel previo al mes siguiente
  - 25,3%
units: {}
definitions: {}
message: 'No es posible separar en los pagos un precio de lista, un descuento introductorio, un crédito o una pausa
  de suscripción: el dato disponible es el monto observado por cliente y mes, sin catálogo de precios ni definición
  documentada de lo que ese monto representa.'
