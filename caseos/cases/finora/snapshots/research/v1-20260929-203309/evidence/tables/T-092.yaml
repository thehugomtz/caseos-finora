query: '-- E-008

  SELECT CAST(month AS VARCHAR) AS mes, COUNT(*) AS filas, SUM(active_customer) AS activos, ROUND(SUM(paid_mrr_cop))
  AS mrr_cop, SUM(new_customer) AS altas, SUM(churned_customer) AS churns FROM mart.customer_month WHERE CAST(month
  AS VARCHAR) >= ''2024-01'' GROUP BY 1 ORDER BY 1'
