query: '-- E-002

  SELECT month AS periodo, SUM(reactivated_customer) AS valor, COUNT(DISTINCT month) AS meses, (SUM(reactivated_customer))
  / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10''
  GROUP BY ALL ORDER BY periodo


  -- E-007

  SELECT SUM(new_customer) AS altas_total, SUM(reactivated_customer) AS reactivaciones_total, SUM(CASE WHEN new_customer
  = 1 AND reactivated_customer = 1 THEN 1 ELSE 0 END) AS solapamiento_banderas, SUM(CASE WHEN new_customer = 1 AND
  CAST(month AS VARCHAR) > CAST(first_positive_month AS VARCHAR) THEN 1 ELSE 0 END) AS altas_con_pago_previo, COUNT(DISTINCT
  CASE WHEN new_customer = 1 THEN customer_id END) AS clientes_distintos_con_alta FROM mart.customer_month WHERE
  month_index >= 2'
