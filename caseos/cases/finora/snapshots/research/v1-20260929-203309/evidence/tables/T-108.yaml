query: "-- E-005\nWITH s AS (SELECT month, total_sm_spend FROM mart.sm_monthly WHERE month >= '2022-03'),\nn AS
  (SELECT month, new_customers FROM mart.monthly_metrics WHERE month >= '2022-03'),\nj AS (SELECT s.month AS month,
  s.total_sm_spend AS sm, n.new_customers AS altas\n      FROM s JOIN n ON n.month = s.month),\nv AS (SELECT CASE\n
  \       WHEN month BETWEEN '2022-03' AND '2022-12' THEN '2022 mar-dic'\n        WHEN month BETWEEN '2023-01' AND
  '2023-05' THEN '2023 ene-may'\n        WHEN month BETWEEN '2023-06' AND '2023-12' THEN '2023 jun-dic'\n        ELSE
  '2024 ene-oct' END AS ventana, sm, altas FROM j)\nSELECT ventana,\n       COUNT(*) AS meses,\n       ROUND(AVG(altas),1)
  AS altas_por_mes,\n       ROUND(AVG(sm),3) AS sm_por_mes_u,\n       ROUND(SUM(sm)/NULLIF(SUM(altas),0),4) AS sm_por_alta_u\nFROM
  v GROUP BY ventana ORDER BY ventana"
