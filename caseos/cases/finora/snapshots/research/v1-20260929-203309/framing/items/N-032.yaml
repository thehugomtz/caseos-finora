hugo_wording: ''
structured: 'Hipótesis de diseño para S3.4: el inicio, el cambio y el fin de un descuento son movimientos propios
  del puente, no contracción ni expansión. Así, 100→80 es contracción solo si baja el valor de la suscripción; si
  el valor sigue en 100 y hay un descuento de 20, es «inicio de descuento». 100→130 con −30 es expansión +30 y descuento
  −30, y lo cobrado no cambia. Cuando el descuento termina, el +30 es «fin de descuento», no expansión.'
basis: Propuesta del Framer; sale de los ejemplos de Q-025, que son construidos, no observados.
