structured: 'Métricas MECE por ruta. En cada cohorte de entrada, a una fecha dada cada lead está en un solo estado:
  llegó al nudo, activo en una etapa, estancado, en Reactivate, perdido o descalificado. La suma da 100%. Encima,
  cuatro familias de métricas iguales para todas las rutas: volumen, conversión con plazo fijo, velocidad y valor
  al nudo. Entre rutas solo se comparan entrada, nudo y valor; las etapas intermedias se comparan dentro de cada
  ruta a lo largo del tiempo.'
