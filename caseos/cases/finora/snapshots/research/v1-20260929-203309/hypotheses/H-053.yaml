id: H-053
type: hypothesis
hugo_wording: ''
structured: '[ToFu · rebota «demanda»] Parte de los leads nuevos son compradores que antes compraban solos por Self
  Service y ahora pasan por el funnel comercial (por ejemplo, un formulario o un contacto en el registro); o al
  revés, leads trabajados que terminan comprando solos y no quedan como Won (el caso B de Hybrid sin registrar).
  En los dos casos el funnel comercial ve más leads sin que crezca la demanda total. Tendría que ser cierto: sube
  la proporción de New que ya tenía registro en el producto (misma cuenta) antes de entrar como lead, y bajan los
  primeros pagadores sin intervención cuando suben los leads comerciales. Dato mínimo: CRM y producto unidos por
  cuenta (N-041). Los pagos del caso dan el total de primeros pagadores de todas las puertas, pero no por cuál entraron.
  Cercana a H-051, pero aquí cambia por dónde compran, no solo cómo se registra.'
basis: Framer; sin evidencia en el caso
confidence: low
