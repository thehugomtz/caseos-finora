id: H-054
type: hypothesis
hugo_wording: ''
structured: '[MoFu · rebota «calidad» y «post-SQL»] Si la meta del SDR se mide en SQL o reuniones (y quizá subió
  junto con los leads), el SDR pasa SQL menos maduros aunque el criterio escrito no cambie. La caída se nota después
  de SQL, pero nace antes del traspaso. Tendría que ser cierto: la proporción de leads que llega a SQL sube o se
  mantiene mientras SQL → Demo y Demo → Won bajan; sube la proporción de SQL que el AE regresa o descalifica; hubo
  un cambio de metas o comisiones del SDR cerca del inicio de la caída; y las entradas directas a SQL, si de verdad
  no pasan por el SDR, no muestran la misma caída post-SQL (comparando cómo cambia cada grupo en el tiempo, no su
  nivel). Dato mínimo: historial de etapas con dueño, origen del SQL y rechazo del AE, más el historial de metas;
  no está en el caso.'
basis: Framer; sin evidencia en el caso
