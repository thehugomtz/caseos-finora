id: H-060
type: hypothesis
statement: 'El escalón 2022→2023 del ticket estabilizado se explica porque más primeros pagadores entran pagando
  un monto bajo que ya existía (36,8 mil), no porque bajaran los montos que ya se cobraban. Indicio: en la cohorte
  2023 la mediana es exactamente 36,8 mil con el primer pago, con el 2.º pago y con el monto usual temprano, lo
  que sugiere un monto muy repetido. La hipótesis describe montos observados; no distingue plan, tarifa ni descuento
  (R-002, F-167).'
falsifier: Queda descartada si 36,8 mil casi no aparece como 2.º pago en la cohorte 2022 y en 2023 aparece de golpe,
  o si los montos más frecuentes de 2022 reaparecen en 2023 con valores más bajos. En ese caso cambió el monto cobrado,
  no la elección entre montos que ya existían.
