id: H-062
type: hypothesis
statement: La baja del churn observado entre 2022 y 2024 es casi toda baja de interrupciones temporales. En F-175
  el persistente se queda cerca de 1%, y la parte que vuelve a pagar pasa de unos 2,5 a unos 1,1 puntos (resta propia
  sobre F-175). La hipótesis es que esa baja viene del cambio general en la forma de cobrar que plantea H-047 y
  ocurre dentro de todos los clientes, no solo por la mezcla de cosechas.
falsifier: 'Cae si la cohorte 2022 mantiene su tasa de interrupciones temporales y la baja total se explica solo
  por la entrada de cosechas nuevas; eso apunta a mezcla o a un cambio en la entrada como H-045. También cae si
  la baja empieza antes del aumento de montos fuera de la grilla (T-059). O si desaparece al igualar el plazo de
  seguimiento entre años: los últimos meses de 2024 tienen menos seguimiento y eso subestima los retornos.'
