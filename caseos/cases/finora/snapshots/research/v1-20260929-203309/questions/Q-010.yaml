id: Q-010
type: question
text: ¿Qué podemos nombrar y comparar válidamente?
kind: workplan
status: open
alias: W0
priority: P0 · puerta · primero
impact: 3
capacity: 3
capacity_level: respondible
why_it_matters: 'Desbloquea o recorta W2–W5. Hay alta incertidumbre semántica sobre el monto: fijar qué se puede
  nombrar elimina trabajo mal definido antes de construir precisión sobre él.'
method: Recuperar el diccionario y los controles existentes; auditar solo contradicciones materiales de grano, fechas,
  cobertura, IDs, ceros y negativos, join, moneda y escala. Revisar si Team y Payroll se solapan solo si se activa
  S&M.
deliverable: 'Ficha: afirmación · definición · fuente · confirmado o pendiente · etiqueta permitida.'
close_criteria: Si no se confirma la recurrencia, se usa monto observado; si no se confirma la historia, primera
  aparición observada. Si falta cobertura material, se detiene esa comparación.
front: CRO y CFO
do_not_conclude:
- 'Que el monto sea MRR contratado: mientras la recurrencia no se confirme, se habla de monto pagado observado.'
- 'Que la primera transacción sea la adquisición del cliente: mientras la historia no se confirme, es la primera
  aparición observada.'
- 'Que una comparación sin cobertura completa describa al negocio: se detiene esa comparación.'
