id: Q-011
type: question
text: ¿El monto identifica los escenarios del CFO?
kind: workplan
status: open
alias: W1
priority: P1 · investigación conceptual
impact: 3
capacity: 3
capacity_level: respondible
why_it_matters: Responde un punto explícito del CFO con material existente y puede cerrar la discusión sobre qué
  se puede inferir del monto solo. No requiere encontrar descuentos históricos.
method: 'Plantear historias económicas alternativas compatibles con la misma observación, con los supuestos del
  caso: contracción frente a descuento, suscripción que crece con un descuento que la compensa, fin de un descuento
  frente a expansión y cambios compensados. No diseñar tablas nuevas.'
deliverable: 'Tabla: observación · historia A · historia B · diferencia que importa · evidencia que faltaría para
  distinguirlas.'
close_criteria: Si hay al menos un contraejemplo relevante, la observación no identifica esa distinción. Si campos
  adicionales existentes resuelven el caso, se actualiza el framing. No se extrapola a descuentos históricos.
front: CFO
do_not_conclude:
- 'Que hubo descuentos en el histórico: el caso habla de introducirlos.'
- 'Que una simulación de escenarios describe lo que ocurrió: prueba qué se puede distinguir, no qué pasó.'
