cos_assessment:
  summary: 'R-013 revisó el archivo de gasto de S&M y deja tres límites. Primero, los montos están en unidades reportadas
    (u), sin moneda ni escala. Segundo, hay un corte en jun-23: hasta may-23 Team es un 12% fijo del total, y desde
    ahí Habilitación es solo SoftwareTools. Tercero, con esta data no se puede clasificar Habilitación. R-013 no
    prueba ni tumba ninguna hipótesis de negocio, pero tiene cuatro efectos: 1) acota el cruce entre gasto y pagadores
    (Q-018 y R-015, que lo está corriendo); 2) convierte U07 (Q-022) en una sensibilidad con y sin Habilitación;
    3) pide un chequeo antes de leer H-022 a través del corte; 4) deja ver que el framing no tiene límites del lado
    del gasto. Es urgente porque R-015 y R-018 (que incluye CAC) siguen en curso. Todo se apoya en F-063–F-070,
    que siguen propuestos.'
  run_id: RUN-20260929-103618-cos-07f6
  at: '2026-09-29T11:11:30-06:00'
  impacts:
  - target: Q-018
    effect: changes_framing
    why: 'R-013 deja el gasto de S&M en unidades reportadas (u), sin moneda ni escala (F-063), y con un corte en
      jun-23. Hasta may-23 Team es un 12% fijo del total, lo que calza con una asignación y no con una medición
      propia; después se mueve entre 19% y 38% (F-066). Además, Habilitación pierde Freelance y desde entonces es
      solo SoftwareTools (F-067). El archivo solo trae el nombre del rubro y el monto mensual, así que no se puede
      asignar gasto a industrias ni a pagadores: solo se puede ver si se mueven juntos en el tiempo. Q-018 pide
      cruzar gasto por categoría con nuevos pagadores y monto pagado. Hoy ese cruce solo se sostiene en términos
      relativos (índices, participaciones, fechas). No se puede sacar gasto en COP por pagador ni dividir monto
      pagado entre gasto (serían COP sobre u). Y cualquier comparación por categoría que cruce jun-23 mezcla un
      cambio del archivo con un cambio de gasto. R-015, que está en curso, hace justo este cruce por industria.'
  - target: Q-022
    effect: changes_framing
    why: 'En lo central, R-013 responde U07 con un no. La data actual no da pistas sobre moneda ni escala, ni sobre
      si SoftwareTools y Freelance son Habilitación comercial o gasto de producto: solo trae el nombre del rubro
      y el monto, y la agrupación es una convención del catálogo (F-068). Sí da pistas sobre la estructura: Freelance
      se apaga en jun-23, y Habilitación pesa 12% del S&M en 2022, 7% en 2023 y 4% en 2024 (F-069). Según F-070,
      la clasificación cambia el nivel, no la dirección: entre 2022 y 2024 el gasto por primer pagador observado
      baja tanto con Habilitación (0,11→0,04 u) como sin ella (0,09→0,03 u). F-070 lo llama «gasto por alta». Por
      eso la pregunta útil ya no es «¿dónde va Habilitación?», que esta data no puede decidir, sino «¿cuánto cambia
      la lectura según dónde vaya?».'
  - target: H-022
    effect: requires_research
    why: 'H-022 compara el gasto agregado con los resultados pagados. R-013 no la evalúa, pero le pone condiciones.
      Primero, solo se pueden comparar forma y fechas (índices en u), nunca niveles contra montos en COP. Segundo,
      la mayor variación del S&M total cae justo sobre el corte: el pico es 3,45 u en may-23 y el valle 1,10 u en
      ago-23 (F-063). Haciendo la cuenta con F-063 y F-066, Team explica poco de esa caída: pasa de ≈0,41 u en may-23
      (12% de 3,45) a entre ≈0,21 y ≈0,42 u en ago-23 (19–38% de 1,10), frente a una caída total de 2,35 u. La caída
      está en otros rubros. Falta saber si es menos gasto o un movimiento contable: Freelance queda en cero después
      de jun-23, y PayrollExpenses es negativo en 5 meses que aquí no tienen fecha. Además, la comparación 2022
      vs 2024 de F-070 cruza ese mismo corte.'
  - target: framing
    effect: changes_framing
    why: 'La lista «No afirmar todavía» cuida el lado de los pagos (MRR, adquisición, alta), pero no dice nada del
      gasto. R-015 y R-018 (que incluye CAC) están en curso y van a leer ese gasto. R-013 fija límites que hoy no
      están escritos. Además, F-069 y F-070 ya hablan de «gasto por alta», que choca con dos límites existentes:
      «alta» como etiqueta contractual y «primera aparición ≠ adquisición». Propongo tres líneas en el formato del
      framing: (1) Que el gasto de S&M esté en COP o se compare con el estado de resultados: el archivo no trae
      moneda ni escala, así que se habla de unidades reportadas (u). (2) Que el gasto sobre primeras apariciones
      sea CAC: falta la moneda y el hito de adquisición sigue por acordar, así que se habla de gasto por primer
      pagador observado. (3) Que Team o Habilitación midan lo mismo antes y después de jun-23: Team es un 12% fijo
      del total hasta may-23 y Freelance se apaga en jun-23. La línea (3) además evita que Team se use como proxy
      de la capacidad comercial de H-006 (R-014 está en curso).'
