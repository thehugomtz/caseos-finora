cos_assessment:
  summary: 'R-028 confirma lo esperado en la reactivación. En la contracción, su titular va más lejos que su prueba.


    **Reactivación.** El 54,1% de su MRR tiene firma de momento de cobro: 11,5% vuelve al monto usual y 42,6% liquida
    el hueco. Esto sostiene H-031 en esa mitad y también H-034.


    **Churn.** La baja del churn observado (3,52% → 2,04%) está casi toda en interrupciones temporales, porque el
    churn que no vuelve casi no se movió (0,98% → 0,96%). Ojo con presentarla como mejor retención en el Overview.


    **Contracción.** El «no es momento de cobro» sale de mirar solo si el monto se repone al mes siguiente. Con
    esa prueba no se ve la bajada al monto usual después de un pago inflado o de una liquidación, que es justo el
    mecanismo de H-033. R-011 ya había visto que 57,6% del COP de contracción cae el mes siguiente a un primer pago
    o a una reactivación. Recomiendo hacer un corte chico con los mismos pagos antes de aceptar F-184 con esa redacción.


    **Otros dos puntos:**

    - El 44% de H-039 puede estar mal etiquetado.

    - Hay dos cifras de churn observado 2024: 1,9% en T-034 y 2,04% en T-085 y T-077. Hay que conciliarlas antes
    de la story.'
  run_id: RUN-20260929-144540-cos-37bd
  at: '2026-09-29T15:08:18-06:00'
  impacts:
  - target: H-033
    effect: requires_research
    why: 'R-028 titula que la contracción no es momento de cobro. Pero su prueba solo mira si al mes siguiente el
      monto vuelve al nivel previo (4,0%) o se queda igual o más abajo (88,9%, F-184). Con eso no se ve el mecanismo
      central de H-033: si el mes previo fue un primer pago inflado o una reactivación que liquidó el hueco, el
      cliente baja a su monto usual y ahí se queda, así que cae dentro del 88,9%.


      En un puente mes contra mes como T-003, pasa esto: una reactivación que liquida el hueco (42,6% del MRR de
      reactivación, F-180) y después sigue con su monto usual deja al mes siguiente una contracción que no se revierte.


      Por eso R-028 y R-011 chocan en el titular pero miden cosas distintas. R-011 vio que 57,6% del COP de contracción
      cae el mes siguiente a un primer pago o a una reactivación (X-037). Ninguna de las dos resuelve H-033. Lo
      único que R-028 debilita es la parte de pagos parciales que se reponen al mes siguiente. Si F-184 se acepta
      con su redacción actual, choca con lo que asumen X-043 y X-046.'
  - target: T-034
    effect: contradicts
    why: 'Hay dos cifras para el mismo churn observado de 2024: 1,9% en T-034 (F-079) y 2,04% en T-085 (F-183, R-028)
      y en T-077 (F-175, R-027). Para 2022 coinciden (3,5% y 3,52%).


      La diferencia puede venir de la ventana: el churn que no vuelve necesita un trimestre de seguimiento, y eso
      recorta los meses de 2024. También puede venir de la forma de promediar. Desde el estado no lo puedo ver.


      T-034 está en C-009 y F-079 está en C-007: si no se fija una sola cifra, el CFO ve dos números para lo mismo.
      Dejo la contradicción registrada sin resolverla.'
  - target: C-009
    effect: changes_story
    why: 'R-028 le pone cifras de Finora al semáforo de C-009 en los movimientos del MRR:

      - Reactivación (COP 86,5 millones) y contracción (−COP 89,5 millones) pesan cada una más que el cambio neto
      del periodo (COP 62 millones, F-179).

      - En la reactivación, 54,1% del MRR tiene firma de momento de cobro (F-180).

      - El churn observado 2024 (2,04%) es más del doble del que no vuelve (0,96%, F-183).

      - La contracción casi no se revierte (F-184), pero sin separar achicamiento de vuelta al monto usual tras
      un pago inflado (ver H-033).

      - El puente normalizado no se mide hoy: falta saber qué es el campo de monto, el estado de suscripción y el
      periodo que cubre cada pago (F-186).


      Además, T-034, que C-009 cita, choca con T-085 en el churn 2024 (ver T-034). Esto completa X-088, que solo
      marcaba linaje.'
  - target: H-039
    effect: requires_research
    why: 'R-028 repite el 44% (F-182) como «vuelve a pagar al mes siguiente», sin decir con qué monto. H-039 lo
      usa como «vuelve con el mismo monto» (DM-4), y la definición de DM-4 no está en el estado.


      En MRR, volver al monto usual pesa 11,5% de la reactivación y liquidar el hueco pesa 42,6% (F-180). Es decir,
      al volver domina la liquidación (H-034), no el mismo monto. Parte de esa diferencia es mecánica, porque el
      pago que liquida es más grande; falta verlo en conteo. Si el 44% mezcla ambos casos, la premisa de H-039 exagera
      el tamaño de su fenómeno.


      Sobre el mecanismo, R-028 no separa un desfase con la suscripción vigente de una pausa o de una baja con regreso
      al mismo precio. F-183 dice «consistente con pausas y atrasos» y F-186 confirma que no hay estado de suscripción.'
  - target: H-031
    effect: supports
    why: 'La mitad de reactivación queda sostenida:

      - 54,1% del MRR de reactivación tiene firma de momento de cobro (F-180).

      - Los huecos de un mes pesan entre 36,5% y 92,9% según el semestre (F-181).

      - 44% de los churns observados vuelve a pagar al mes siguiente y 32% de los regresos liquida exacto lo pendiente
      (F-182).


      La mitad de contracción no queda establecida: la prueba de F-184 solo mira si el monto se repone al mes siguiente,
      y eso no mide lo que quitaría repartir los pagos que cubren varios meses (ver H-033).


      Y «desaparece» no se puede medir exacto: para repartir los pagos hace falta la definición del monto, el estado
      de suscripción y el periodo de cada pago (F-186). Solo se puede poner un rango.'
  - target: H-034
    effect: supports
    why: 'Aparece la firma que H-034 predice:

      - 42,6% del MRR de reactivación llega con un monto que cubre los meses del hueco más el corriente (F-180).

      - 32% de los regresos después de meses sin pago liquida exacto lo pendiente (F-182).

      - El churn observado queda muy por encima del que no vuelve (F-183).


      Es una firma, no una verificación: sin estado de suscripción ni periodo por pago (F-186), «atraso» es la lectura
      compatible, no una etiqueta contractual (lo cubre «No afirmar todavía»). Y H-034 se queda corta: el mes siguiente
      a la liquidación, el puente también registra una contracción (ver H-033).'
  - target: H-040
    effect: supports
    why: 'R-028 encuentra reversión de calendario donde H-040 la pone:

      - 25,3% del movimiento bruto sin altas vuelve exacto al nivel previo al mes siguiente, y 29% del MRR de expansión
      se revierte (F-185).

      - Entre los meses sin pago seguidos de regreso, 32% liquida exacto lo pendiente (F-182).


      Dos límites. Primero, el 25,3% es la misma medición que F-090, no una confirmación independiente. Segundo,
      R-028 no muestra que las subidas de un mes sean pagos dobles o parciales, ni puede descartar pausas (F-183).
      Así que el «no pausas» de H-040 sigue sin poder probarse con estos datos.'
  - target: C-016
    effect: supports
    why: 'R-028 suma otro caso de «misma observación, lecturas distintas»: un mes en cero seguido de un regreso
      es compatible con atraso, pausa o baja y regreso (F-182, F-183). Y el reparto exacto no se puede hacer sin
      la definición del monto, el estado de suscripción y el periodo por pago (F-186).


      Para casi toda la contracción, F-184 descarta solo una lectura del «paga 100 y luego 80»: la baja temporal
      que se repone. Siguen abiertas las que le importan al CFO (suscripción, tarifa y descuento) y la vuelta al
      monto usual después de un pago inflado, porque todas se sostienen en el tiempo. Esto completa X-089, que solo
      marcaba linaje.'
  - target: H-059
    effect: supports
    why: 'F-181 va en la línea de la parte observable de H-059 (regresos después de un solo mes en cero). Pero medido
      en MRR y por semestre, ese peso va de 36,5% a 92,9%: en al menos un semestre no es mayoría. El 70,5% de F-157
      va en la misma línea, así que «la mayoría» depende de la base (conteo o MRR) y del periodo.


      La parte de «sin intervención comercial» no se ve en los pagos: que no haya rastro de un toque no prueba que
      no lo hubo. La implicación para el framing ya está en X-080.'
