why_it_matters: ''
short_answer: La reactivación concentra firmas de momento de cobro; la contracción no. En la reactivación, la parte
  que regresa al monto usual explica 11,5% y la que cubre los meses del hueco más el corriente explica 42,6%; por
  semestre, la parte que viene de un hueco de un mes va de 36,5% a 92,9%. En la contracción, la parte que regresa
  al nivel previo al mes siguiente explica 4,0% y la que sigue igual o más abajo explica 88,9%
headline: La reactivación concentra firmas de momento de cobro; la contracción no
what_is_established:
- En la ventana limpia la reactivación aporta COP 86,5 millones de entradas y la contracción −COP 89,5 millones
  de salidas, frente a un cambio neto de COP 62 millones. Reprocesar estos componentes cambia la lectura del puente.
- La señal indica que el regreso al monto usual explica 11,5% del MRR de reactivación y el pago que cubre los meses
  del hueco más el corriente explica 42,6%; 45,9% no encaja en esas firmas. Coincide con que 44% de los churns observados
  vuelve a pagar al mes siguiente y 32% de los retornos liquida exactamente los meses pendientes.
- El churn observado pasó de 3,52% a 2,04% mientras el que no vuelve a pagar en el trimestre siguiente pasó de 0,98%
  a 0,96%. La diferencia entre ambas definiciones es consistente con pausas y atrasos contados como baja.
- 'La señal apunta a que la parte de la contracción que regresa al nivel previo al mes siguiente explica 4,0%, mientras
  la que sigue igual o más abajo explica 88,9%. La reversión de calendario aparece en otras partes del puente: 25,3%
  del movimiento bruto del monto pagado sin altas vuelve exacto al nivel previo y 29% del MRR de expansión se revierte
  al mes siguiente.'
- Faltan la definición del campo de monto, el estado de la suscripción y el periodo devengado por pago. Sin esos
  campos, repartir un pago multimes es una convención contable y no una medición.
what_is_contested: []
what_remains_unknown:
- 'El puente normalizado exacto que pide repartir un pago entre los meses que cubre no es medible: faltan definición
  del campo de monto, estado de suscripción y periodo devengado por pago.'
- La reversión de calendario existe en el puente pero fuera de la contracción, con 25,3% del movimiento bruto del
  monto pagado sin altas y 29% del MRR de expansión; no puede extrapolarse a la contracción.
alternative_explanations: []
case_implication: Si el comité acepta las firmas de momento de cobro, convendría reportar la reactivación separando
  el regreso al monto usual y el pago que cubre los meses del hueco más el corriente del 45,9% que no encaja en
  esas firmas. Si la contracción se lee como deterioro persistente, podría priorizarse su análisis por cuenta antes
  que el ajuste de calendario, dado que la parte que regresa al nivel previo explica 4,0%.
