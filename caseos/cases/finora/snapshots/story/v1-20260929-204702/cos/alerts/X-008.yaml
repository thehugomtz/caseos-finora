finding_text: Altas y gasto de S&M no se mueven en el mismo sentido
why: 'R-015 deja el único cociente de gasto por pagador que se puede calcular hoy (F-108: 0,105 u → 0,036 u entre
  2022 y 2024), pero no es CAC. La unidad y la moneda no están documentadas (T-005), el gasto no se liga a clientes
  ni a Canal de adquisición (F-119), la primera aparición no es el hito de adquisición y las categorías antes de
  jun-23 son un reparto (F-115). R-018 debería marcar el CAC como «no calculable hoy» y listar lo mínimo para calcularlo:
  unidad y moneda del archivo, canal o fuente de cada cliente y el hito de adquisición acordado.'
