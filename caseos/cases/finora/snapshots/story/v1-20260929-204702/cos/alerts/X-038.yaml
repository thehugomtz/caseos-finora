id: X-038
type: alert
kind: framing_change
status: open
severity: high
effect: changes_framing
source: R-011
target: Q-026
title: R-011 cambia el framing Q-026
finding_text: 'Con el modelo actual no se puede. Solo hay cliente × mes × monto pagado, y en los tres casos de Q-025
  las alternativas dan exactamente el mismo monto (confianza alta). Propuesta: una escalera de valor con vigencias
  (tarifa de lista → precio pactado → descuento con inicio, fin y motivo → MRR neto →…'
why: 'Q-026 pregunta por el negocio subyacente (valor antes de descuentos) y por cuánto revenue se deja de capturar
  por decisiones comerciales. Según R-011, el modelo no tiene tarifa de lista, precio pactado ni descuento, y no
  se puede concluir si hubo descuentos o cambios de tarifa en 2022–2024. Con los datos actuales no hay respuesta
  histórica. Sí hay una forma de medirlo: la distancia entre tarifa de lista, precio pactado y MRR neto en la escalera.'
options:
- key: A
  label: Reformular Q-026 como pregunta de medición
  consequence: 'Versión Hugo: «¿Cómo vamos a ver el negocio subyacente y el revenue que dejamos de capturar cuando
    metamos descuentos?». Versión ejecutiva: «Qué tiene que registrar Finora para medir su valor antes de descuentos
    y el costo de sus decisiones comerciales». Se responde con la escalera de R-011 y no promete una cifra.'
- key: B
  label: Mantenerla como está y condicionarla a los datos de facturación/CRM de Finora
  consequence: Si el dato existe, habría una cifra. Si no, Q-026 queda abierta sin fecha de cierre.
- key: C
  label: Aproximar el negocio subyacente con el monto pagado, con una advertencia
  consequence: Da un número, pero trata el monto como MRR contratado (choca con «No afirmar todavía») y convierte
    la falta de evidencia (F-134) en una respuesta.
recommended: A
recommended_why: Conserva tu pregunta y lo que le aporta al CFO, encaja con el brief (los descuentos están por introducirse)
  y no pone cifras sin soporte. El pedido de datos de B puede ir a Finora sin bloquear.
