finding_text: 'Con el modelo actual no se puede. Solo hay cliente × mes × monto pagado, y en los tres casos de Q-025
  las alternativas dan exactamente el mismo monto (confianza alta). Propuesta: una escalera de valor con vigencias
  (tarifa de lista → precio pactado → descuento con inicio, fin y motivo → MRR neto →…'
why: 'No se puede evaluar en el histórico: no hay descuento ni valor antes de descuento por cliente. R-011 propone
  contar el descuento de quien sale dentro del churn. Si ese churn se reporta por lo que el cliente pagaba (neto)
  o por lo que valía su suscripción (bruto) es justo la distinción de H-012, y sigue sin decidirse (F-132).'
options: []
recommended: Va con la opción A de Q-002 y con la convención pendiente de F-132
recommended_why: H-012 se responde con una convención de reporte más el dato de descuento por suscripción, y hoy
  no existe ninguno de los dos.
