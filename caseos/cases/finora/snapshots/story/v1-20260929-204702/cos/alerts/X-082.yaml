status: open
severity: medium
effect: weakens
source: R-022
target: C-012
title: R-022 debilita C-012
finding_text: 'Cada funnel tiene su propio lado izquierdo. Executive se mide por cuenta-oportunidad: win rate con
  ventana fija, ciclo de venta, estancamientos y tiempo de Won a pago. Hybrid se mide por entrada de la máquina
  de leads: cobertura y tiempo a primer contacto, carga por SDR/AE y conversión por banda de…'
why: 'Hallazgo: según R-022, probar las palancas de H-006 y H-028 requiere un experimento (F-159). C-012 dice que
  capacidad y calidad se separan comparando la mezcla contra la tasa por grupo de entrada. Esa comparación muestra
  el patrón, pero si los SDR/AE eligen a quién atender (H-028), la tasa de cada grupo mezcla su calidad con la atención
  que recibió. Mirar a los atendidos no dice si los no atendidos comprarían (H-050). Como está redactado, el claim
  promete más de lo que da la comparación. De paso, esto responde la mitad de U12 (Q-023) que X-020 dejó abierta.'
options:
- key: A
  label: Reformular C-012 y responder U12 con él
  consequence: 'El claim diría: «Comparar la mezcla contra la tasa por grupo, con cobertura por grupo, muestra el
    patrón; la palanca (más capacidad o mejor filtro) se prueba con un experimento». U12 queda respondida en dos
    partes: método observacional para los artefactos (R-010) y experimento para las palancas (R-022). El experimento
    queda como propuesta, sin diseño.'
- key: B
  label: A, más un research corto con el experimento mínimo
  consequence: El research definiría qué se asigna al azar, a qué unidad, con qué métrica y ventana fija, y cuánto
    dura. U12 llevaría una propuesta concreta, a cambio de un ciclo más.
- key: C
  label: Mantener C-012 con la limitación en nota
  consequence: No tocas el claim, pero el titular sigue prometiendo más de lo que da la comparación.
recommended: A
recommended_why: Deja el claim en lo que la evidencia sostiene y responde U12 hoy. B vale si quieres que U12 cierre
  con un experimento concreto.
