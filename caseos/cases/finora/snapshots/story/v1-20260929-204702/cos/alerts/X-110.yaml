source: R-025
target: Q-065
title: R-025 requiere más investigación Q-065
finding_text: 'Con lo que hay no se puede validar ni descartar ninguna causa del funnel: el modelo no trae leads
  ni CRM, solo pagos y gasto. Lo que sí muestran los pagos: la caída de primeros pagadores es de jul–oct 2024 (−19%),
  después de un ene–jun que creció +29%. No la explican ni octubre incompleto, ni las r…'
why: R-025 muestra que Q-065 cubre los campos del CRM por lead, pero le faltan tres cosas que piden varias causas.
  (a) Una bitácora con fecha de los cambios en definición de lead, formulario, calificación, reparto, cuota del
  SDR, precios y planes (H-027, H-054, H-056). (b) El número de SDR/AE por mes y la hora del primer contacto humano
  (H-006, H-028, H-055). (c) Marcas de duplicado, cliente actual, soporte o spam (H-052). Sin (a), aunque llegue
  el CRM completo, no se puede poner ningún cambio de reglas contra jul-24.
options:
- key: A
  label: Ampliar Q-065 con (a), (b) y (c)
  consequence: Es un solo pedido a Finora, pero largo. Lo más fácil de contestar (la bitácora) queda enterrado entre
    extracciones pesadas.
- key: B
  label: Dejar Q-065 para el CRM y abrir una pregunta hermana con la bitácora y el número de SDR/AE por mes
  consequence: Finora puede contestar eso primero, y ya pone a H-027, H-054, H-056 y H-006 contra ene-23, jun-23
    y jul-24 sin esperar el CRM. (c) y la hora de primer contacto se suman a Q-065.
- key: C
  label: Dejar Q-065 como está y tratar lo demás como limitación
  consequence: Aunque llegue el CRM, no se podría fechar un cambio de reglas, y tres hipótesis seguirían sin prueba.
recommended: B
recommended_why: La bitácora probablemente es lo más barato de pedir y lo que más separa causas en el tiempo. La
  dejo propuesta en new_questions.
