  más en Retail+Producción. F-206 dice que el ticket no baja y que casi nadie deja de pagar en M1, pero eso no la
  separa de las otras causas: una peor calidad puede bajar la conversión sin cambiar a quien sí paga. Sin alerta
  nueva.'
