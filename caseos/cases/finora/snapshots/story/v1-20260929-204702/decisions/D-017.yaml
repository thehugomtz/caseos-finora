user_choice: «Voy a comer pero ahí checa con el chief y las herramientas ahí que todo esto esté respondido de alguna
  forma y bien propuesto, no solo lo que ya habíamos dicho pero que sí haya propuestas sólidas y profesionales […]
  cuando regrese si hay cambios espero poder verlo todo en la plataforma principalmente en la parte de story»
user_rationale: 'Preguntas: funnel no lineal; dónde se concentra la pérdida y métricas nuevas; hipótesis y datos
  para validarlas; solución analítica para el CRO; qué puede y no puede responder el modelo actual; separar valor
  de suscripción y precio pagado; clasificar inicio y fin de descuentos; y rematar con los tres casos del CFO (100→80,
  100→130 con −30, fin del descuento), el negocio subyacente y el revenue que se deja de capturar.'
