id: F-206
type: finding
headline: La caída de primeros pagadores se concentra en Retail+Producción; el ticket de entrada no baja y casi
  nadie deja de pagar en M1
evidence_text: 'Jul–oct 2023→2024: Retail+Producción 129→92 (−29%), Restaurantes 62→50, Tecnología+Servicios profesionales+Salud
  60→61. M0 promedio: 42.794→44.601 COP. Sin pago en M1: 5 de 251 vs 5 de 153 observables. Esto encaja mal con un
  choque de demanda parejo o con fricción de cobro después del primer pago, y pide cortar el CRM por industria.'
confidence: medium
limitations:
- 'Son pagadores, no leads: no sabemos si esas industrias trajeron más leads que no compraron o simplemente menos
  leads. La baja de Restaurantes (62→50) puede ser ruido con estos conteos (inferencia sin prueba formal).'
