definitions:
  Altas (clientes nuevos): Clientes con MRR pagado mayor que cero en el mes y que nunca antes habían pagado.
  Ticket de entrada (M0): MRR pagado por un cliente nuevo en su primer mes. Se reporta como promedio (MRR nuevo
    ÷ altas), mediana y percentiles.
message: Las altas por mes pasan de 27,2 en 2022 (mar–dic) a 55,4 en 2024, mientras el ticket de entrada promedio
  de esas altas pasa de COP 128,7 mil a COP 50,8 mil y su mediana de COP 63,0 mil a COP 42,0 mil.
