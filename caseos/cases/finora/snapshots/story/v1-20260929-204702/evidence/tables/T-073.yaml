message: Entre mar-22 y sep-24, las subidas de monto de clientes activos que al mes siguiente vuelven exacto al
  nivel previo suman COP 10,6 millones en 182 eventos, mientras las que se mantienen en el nivel nuevo suman COP
  5,1 millones en 460 eventos.
