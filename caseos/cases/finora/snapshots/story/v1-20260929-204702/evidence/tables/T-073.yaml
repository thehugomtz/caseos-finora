query: "-- E-007\nWITH b AS (\n  SELECT customer_id, month, paid_mrr_cop, previous_month_mrr, active_customer,\n
  \        LEAD(paid_mrr_cop) OVER (PARTITION BY customer_id ORDER BY month) AS next_mrr\n  FROM mart.customer_month\n),
  e AS (\n  SELECT CASE WHEN paid_mrr_cop > previous_month_mrr THEN 'Subida del monto' ELSE 'Bajada del monto' END
  AS direccion,\n         CASE WHEN next_mrr = previous_month_mrr THEN 'Vuelve al nivel previo'\n              WHEN
  next_mrr = paid_mrr_cop THEN 'Persiste en el nivel nuevo'\n              ELSE 'Otro nivel' END AS destino,\n         abs(paid_mrr_cop
  - previous_month_mrr) AS delta\n  FROM b\n  WHERE active_customer = 1 AND previous_month_mrr > 0 AND paid_mrr_cop
  <> previous_month_mrr\n    AND month >= '2022-03' AND month <= '2024-09' AND next_mrr IS NOT NULL\n)\nSELECT direccion,
  destino,\n       count(*) AS eventos,\n       round(100.0 * count(*) / sum(count(*)) OVER (PARTITION BY direccion),
  1) AS pct_eventos,\n       round(sum(delta)) AS monto_cop,\n       round(100.0 * sum(delta) / sum(sum(delta))
  OVER (PARTITION BY direccion), 1) AS pct_monto\nFROM e GROUP BY 1,2 ORDER BY 1, 6 DESC"
