statement: El aumento de primeras apariciones en jun–dic-23 frente a ene–may-23 y la caída del S&M registrado desde
  may-23 vienen de un mismo cambio en la operación comercial a mitad de 2023 (por ejemplo, un giro hacia Self Service
  o una reorganización de Team), y no de que menos gasto traiga más pagadores.
