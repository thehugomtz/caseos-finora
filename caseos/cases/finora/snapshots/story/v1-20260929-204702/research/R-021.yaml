cos_assessment:
  summary: 'R-021 le da mecanismo a la parte de propuesta del bloque CFO. El descuento tiene que existir como objeto
    propio con vigencias, separado de la cantidad y del precio de lista, y el puente necesita dos líneas propias
    de descuento. La razón: ChartMogul, Chargebee y Stripe, usadas tal cual, lo mezclan con expansión o contracción,
    o lo dejan fuera. Con eso, Q-025, Q-026 y Q-002 se contestan de aquí en adelante. El histórico sigue sin poder
    descomponerse, así que no cambia nada de lo que podemos afirmar del pasado. Lo que importa: 1) las ramas de
    descuento del árbol CFO (H-010, H-012 y H-015) no se pueden evaluar dentro del caso; 2) Q-002 queda en dos tiempos
    y depende de que Finora tenga plan, cantidad y precio de lista; 3) Q-026 mezcla el descuento otorgado con el
    revenue perdido, y esto último es un contrafactual; 4) R-021 es una Propuesta de Modelo de datos y D-007 sigue
    activa. Todo se apoya en F-150 a F-154, que siguen propuestos.'
