alternative_explanations:
- Un cambio en el monto pagado puede venir de mora, cobranza atrasada, créditos, reembolsos, prorrateos o impuestos,
  y no de un descuento ni de un cambio de suscripción. Por ejemplo, Stripe cuenta las suscripciones con pago pendiente
  en el MRR y excluye los impuestos.
- Una baja del pago puede ser contracción real (menos cantidad o un plan menor) y no un descuento; una subida puede
  ser el fin de un descuento y no una expansión.
- Un mes sin pago puede ser un mes con descuento del 100%, con el cliente activo, y no un churn seguido de reactivación.
- Si un descuento temporal se monta como plan o precio «promo» más barato, se leerá como cambio de tarifa o contracción
  y no como descuento.
- Que los clientes captados con descuento retengan peor puede reflejar qué tipo de cliente responde a los descuentos
  (selección) y no un efecto del descuento en sí; Lewis lo atribuye a la incertidumbre del cliente.
- El churn al vencer un descuento puede coincidir con el fin del proyecto o de la necesidad que motivó la compra,
  y no deberse solo al salto de precio.
what_is_established:
- 'Las herramientas revisadas (ChartMogul, Chargebee, Stripe) no tienen un movimiento de MRR propio para descuentos:
  lo mezclan con expansión o contracción, o lo excluyen según cómo se configuren.'
- 'Cómo se tratan los descuentos temporales en el MRR no está estandarizado entre proveedores: Stripe permite elegir,
  mientras que ChartMogul y Baremetrics reportan neto.'
- Los sistemas de facturación pueden registrar el descuento como objeto con tipo, valor, alcance y duración, así
  que es factible capturar su inicio, fin y motivo.
- Con el MRR neto, un descuento del 100% genera churn y reactivación artificiales; Stripe lo documenta.
- Con los datos actuales (solo monto pagado observado), Finora no puede separar contratación, tarifa y descuento
  en su histórico, y H-015 no se puede evaluar hacia atrás.
- Según la guía de PwC, el plazo del contrato (mes a mes o plazo fijo) y la naturaleza de los cambios de precio
  programados determinan si el ingreso se reconoce de forma lineal, lo que puede separar el revenue reconocido del
  MRR.
what_is_contested:
- 'Si el MRR «oficial» debe ser neto o de lista cuando hay descuentos temporales: Stripe lo deja configurable; ChartMogul
  y Baremetrics reportan neto.'
- 'Cuánto valor le quita el descuento a un cliente SaaS y si es causa o selección: el estudio de Paddle (sin controles)
  frente a estudios académicos B2C que sí controlan la selección.'
- Si el churn al vencer un descuento se debe al precio o a otros eventos del cliente.
- Si un descuento temporal en un contrato a plazo fijo se reconoce de forma lineal (analogía con los aumentos programados,
  pendiente de validar).
what_remains_unknown:
- 'Tipo y plazo de los contratos de Finora: mensuales o anuales, cancelables o no.'
- Si el monto de raw.transactions es lo facturado o lo cobrado, y si un mes con monto 0 genera fila.
- Si Finora tiene plan, cantidad y precio de lista en algún sistema. Sin eso, ni siquiera sin descuentos se puede
  separar cantidad de tarifa (Q-002).
- 'Qué descuentos quiere introducir Finora: motivo, profundidad, duración, Canal (Digital/Self Service o Assisted/KAM)
  y quién los aprueba.'
- El efecto real de los descuentos en la retención y el valor de los clientes de Finora.
case_implication: 'Para ESTE caso: hoy Finora solo tiene el monto pagado observado por cliente × mes, sin plan,
  cantidad, precio de lista ni descuento. Por eso no puede separar contratación, tarifa y descuento (ni siquiera
  cantidad de tarifa), H-015 no se puede evaluar en el histórico y ninguna herramienta estándar lo resolvería por
  defecto. Propuesta, para que Hugo decida si entra al bloque Revenue:

  (1) Reglas de juego comerciales. Todo descuento temporal es un objeto propio con fecha de fin, nunca un plan o
  precio «promo» (se leería como cambio de tarifa o como contracción). Un descuento sin fecha de fin es una decisión
  de precio y se trata como tarifa. Los meses al 100% se marcan como «activo con descuento total» para no fabricar
  churn más reactivación. Si la cantidad y el descuento cambian a la vez, se registran como dos eventos. Cada descuento
  lleva motivo (adquisición, retención, incentivo de expansión, prepago), Canal (Digital/Self Service o Assisted/KAM),
  campaña o código, y aprobador.

  (2) Propuesta de Modelo de datos. Extender mart.customer_month con cantidad o plan, precio de lista, MRR de lista,
  descuento del mes y MRR neto, sin perder el monto pagado observado. Crear una tabla de descuentos (cliente, línea,
  tipo, valor, inicio, fin, motivo, Canal, código, aprobador). Crear una tabla de movimientos con Nuevo, Expansión,
  Contracción, Churn, Reactivación, Cambio de tarifa, Descuento nuevo o aumentado, Descuento reducido o terminado,
  y Diferencia entre facturado y pagado. Usar la convención precio-volumen por cliente × línea: tarifa = cambio
  del precio de lista × cantidad anterior; contratación = cambio de cantidad × precio de lista nuevo; descuento
  = cambio del descuento, con signo contrario. Así cuadra sin residuo. Sumar checks nuevos (lista − descuento =
  neto; la suma de movimientos = cambio del neto; neto conciliado con lo pagado) y marcar un corte de serie explícito:
  el histórico sigue siendo pago observado sin descomponer.

  (3) Tres vistas para el CFO: MRR neto (gestión), revenue reconocido (puede ser lineal si el contrato es a plazo
  fijo) y caja.

  Preguntas del CFO que contesta el modelo:

  - «¿Por qué cambió el MRR?» → un puente con las líneas de descuento separadas.

  - «¿Cuánto por contratación, cuánto por tarifa y cuánto por descuento?» (Q-002) → las mismas líneas, agrupadas
  en esos tres bloques.

  - Q-025, caso 100→130 con −30 → Expansión +30 y Descuento nuevo −30 (el pago observado diría «sin cambio»).

  - Q-025, caso 100→80 → Contracción −20 si baja la lista, o Descuento −20 si la lista se mantiene (y vuelve al
  vencer si el cliente sigue).

  - Q-025, caso 80→100 → Expansión +20 si sube la lista, o Fin de descuento +20 (recuperación de precio, no demanda
  nueva).

  - Q-026 → el MRR de lista y la retención de ingreso medida en lista muestran el negocio subyacente; el descuento
  vigente (lista − neto), por motivo, Canal y aprobador, muestra el revenue que no se captura.

  - «¿Cuánto MRR vuelve y cuándo?» → un calendario de vencimientos de descuentos, sin asumir que todo vuelve.

  - «¿Los descuentos compran clientes que se quedan?» → cohortes marcadas y grupo de control.

  Implicaciones por área:

  - Finanzas elige la definición de MRR (neto, lista o ambas) y valida lo contable con el auditor.

  - Growth/Marketing marca las cohortes y el Canal de adquisición con descuento, y calcula el CAC payback y el LTV
  con precio neto y con el churn posterior al vencimiento.

  - Ventas/KAM (Assisted) necesita una política de aprobación con motivo; Self Service/Digital, códigos con límite
  de canjes y vencimiento.

  - Customer Success gestiona los vencimientos.

  - Data/BI implementa las tablas y los checks.

  - En el Overview para el CEO conviene mostrar lista y neto, para no sobreestimar ni subestimar la salud del negocio.'
