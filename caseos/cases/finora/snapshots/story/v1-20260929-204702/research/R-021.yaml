task_why: 'Es la decisión de Revenue: el mecanismo define si el CFO puede seguir respondiendo por qué cambió el
  MRR cuando existan descuentos, y cuánto revenue deja de capturar.'
task:
  work: propuesta
  draft_answer: 'Mi arranque: el descuento entra como un objeto propio (monto o %, inicio, fin, motivo como adquisición,
    retención o campaña, y quién lo aprobó), aplicado sobre una suscripción que conserva su valor. Así cada ejemplo
    del CFO tiene una sola lectura: 100→80 es contracción si bajó la suscripción y descuento si la suscripción sigue
    en 100; en 100→130 con −30 se ve la expansión aunque el pago siga en 100, y cuando termina el descuento el salto
    es «fin de descuento», no expansión. Hacia adelante, el revenue que se deja de capturar por decisiones comerciales
    se vuelve medible como la suma de descuentos vigentes. El mecanismo toca a Finanzas (cómo reporta el MRR), Ventas
    (quién puede dar cuánto y por cuánto tiempo), Producto/Billing (que se pueda cobrar así) y Datos (el modelo
    de S3.3). No sabemos qué tiene ya definido Finora sobre descuentos, así que asumo que se diseña desde cero.'
  hugo_said:
  - text: Finora quiere introducir descuentos temporales, ¿cómo debería de hacerlo? Mecanismo Propuesto / Implicaciones
      Multidisciplinarias
    ref: N-028
  - text: ¿Qué pasa si su suscripción creció de 100 a 130, pero tiene un descuento de 30 y sigue pagando 100? /
      Si un cliente pagaba 100 y ahora paga 80, ¿contrajo 20 o recibió un descuento? / ¿Y cuando desaparezca el
      descuento, eso cuenta como expansión?
    ref: Q-025
  - text: Quiero saber qué está pasando con el negocio subyacente y cuánto revenue estamos dejando de capturar por
      decisiones comerciales
    ref: Q-026
  steps:
  - kind: research
    what: 'Prácticas de descuentos temporales en SaaS de suscripción mensual: tipos (entrada, retención, campaña),
      profundidad y duración, elegibilidad, aprobación, qué pasa al terminar y el riesgo de churn en ese momento.
      También cómo se reporta el MRR con descuentos (valor antes y después de descuento). Lo contable queda como
      pregunta para Finanzas de Finora.'
    where: []
  - kind: proposal
    what: 'Mecanismo: el descuento como objeto propio y sus reglas (quién puede darlo, cuánto, por cuánto tiempo,
      quién aprueba, cómo se comunica y cómo termina), con parámetros por acordar con Finora, no presentados como
      estándar de mercado.'
    where: []
  - kind: proposal
    what: Implicaciones por área (Finanzas, Ventas/CRO, Producto/Billing, CS, Datos), y las tres preguntas del CFO
      más el revenue no capturado, contestadas con el mecanismo y la clasificación de RT-002.
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: Define si el bloque Revenue puede prometerle al CFO un puente de MRR que separe el negocio subyacente
  de las decisiones comerciales una vez que empiecen los descuentos, y qué Propuesta de Modelo de datos llevamos
  al deck. Sin este diseño, el fin de un descuento se va a leer como expansión y un descuento nuevo como contracción,
  y Q-002 y Q-026 se quedan sin respuesta.
short_answer: 'Se puede, con una condición: el descuento tiene que existir en los datos como objeto propio (tipo,
  monto, inicio, fin, motivo, Canal y aprobador), separado de la cantidad contratada y del precio de lista. Además,
  el puente de MRR necesita líneas propias de «descuento nuevo/aumentado» y «descuento reducido/terminado», porque
  las herramientas revisadas (ChartMogul, Chargebee, Stripe) lo mezclan con expansión/contracción o lo excluyen
  según cómo se configuren. Con tres capas (MRR de lista, descuento y MRR neto) más el monto pagado observado que
  Finora ya tiene, el modelo contesta Q-002, los tres casos de Q-025 y Q-026 de aquí en adelante; el histórico sigue
  sin poder descomponerse. Confianza: alta en el mecanismo de medición (documentación primaria de las herramientas),
  media en lo contable (depende del tipo de contrato de Finora, que no conocemos) y media-baja en los efectos comerciales
  (evidencia B2C y un estudio de proveedor).'
claims:
- claim: ChartMogul clasifica la aplicación de un descuento como Contracción y su vencimiento como Expansión, en
    las mismas categorías que un downgrade o un upgrade. No tiene un tipo de movimiento propio para descuentos.
  source_id: SRC-02
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: Confirma que el fin de un descuento se reporta como expansión (caso 3 de Q-025).
- claim: En ChartMogul, un cambio de suscripción que no mueve el MRR (por ejemplo, sube la cantidad sin impacto
    en el MRR) se clasifica como Neutral. Por definición, el caso 100→130 con −30 no aparecería como expansión.
  source_id: SRC-02
  source_type: company
  confidence: medium
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: La definición es textual; aplicarla al caso 1 de Q-025 es inferencia nuestra.
- claim: ChartMogul reporta el MRR solo neto de descuentos (un cliente con 20% de descuento de por vida cuenta 400
    y no 500). Cuando una suscripción con descuento renueva a precio completo, lo registra como expansión.
  source_id: SRC-01
  source_type: company
  confidence: high
  freshness: '2025-01-20'
  supports_or_contests: context
  notes: Postura de un proveedor que defiende el neto como medida honesta; no ofrece vista en lista.
- claim: 'Stripe siempre resta del MRR los descuentos recurrentes permanentes. Restar los descuentos recurrentes
    temporales y los de una sola vez es configurable: uno, otro o ambos.'
  source_id: SRC-03
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: context
  notes: Muestra que tratar los descuentos temporales en el MRR es una elección de definición.
- claim: Stripe describe restar los descuentos del MRR como el enfoque más conservador, porque refleja mejor el
    valor presente de esos clientes.
  source_id: SRC-04
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: context
  notes: Argumento a favor del neto como vista principal; no descarta tener también la vista en lista.
- claim: El puente de crecimiento de MRR de Stripe tiene líneas de nuevo, reactivación, expansión, contracción,
    churn y ajuste por tipo de cambio (FX), pero ninguna de descuento.
  source_id: SRC-04
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: Stripe sí aísla FX como efecto que no es comportamiento del cliente. Que el descuento se pueda aislar igual
    es inferencia nuestra.
- claim: Si el MRR se calcula neto de descuentos, Stripe considera en churn a un suscriptor con un cupón del 100%
    y lo vuelve a contar como activo cuando se quita el cupón.
  source_id: SRC-04
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: Riesgo directo para las banderas de churn observado y reactivación de mart.customer_month si Finora da
    meses gratis.
- claim: En Stripe, el MRR excluye impuestos, planes gratis y productos que se cobran por uso, e incluye suscripciones
    con pago pendiente (past_due). Las canceladas o marcadas como impagas (unpaid) cuentan como churn.
  source_id: SRC-04
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: 'El MRR no es lo cobrado: la mora mueve el pago sin mover la suscripción. Por eso conviene conservar el
    monto pagado observado como capa aparte.'
- claim: Baremetrics resta del MRR todos los cupones y descuentos sin importar su duración, y lo contrasta con el
    criterio de Stripe de no contar los descuentos temporales.
  source_id: SRC-06
  source_type: company
  confidence: medium
  freshness: 2024-05-31 (actualizado el 2026-04-23)
  supports_or_contests: context
  notes: Su descripción de Stripe corresponde al comportamiento por defecto; la documentación actual de Stripe lo
    hace configurable (SRC-03).
- claim: Chargebee calcula su Downgrade MRR como la caída de MRR por cambios de suscripción y considera ahí los
    descuentos recurrentes, sin categoría propia. Su Expansion MRR junta upgrades, paso de gratis a pago y reactivaciones.
  source_id: SRC-07
  source_type: company
  confidence: medium
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: 'Otra taxonomía distinta: aquí la reactivación va dentro de la expansión. La mención a descuentos en la
    documentación es breve.'
- claim: 'En Stripe, un descuento tiene tipo (porcentaje o monto fijo), alcance (a qué productos aplica) y duración:
    una vez (por defecto, solo la primera factura), varios meses (repeating, con duration_in_months) o para siempre
    (forever). Un cupón de una sola vez desaparece de la suscripción cuando se emite la factura, aunque la factura
    conserva el descuento.'
  source_id: SRC-05
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: Implica leer los descuentos desde las líneas de factura, guardando el historial, y no desde el estado actual
    de la suscripción.
- claim: Stripe ofrece alternativas al cupón (saldo negativo del cliente, partidas negativas en la factura o un
    segundo precio más barato) y señala que las partidas negativas dan más detalle de qué descuento se creó, cuándo
    y por qué.
  source_id: SRC-05
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: 'Inferencia nuestra: con un segundo precio más barato se pierde la distinción entre tarifa y descuento.'
- claim: En Stripe, cambiar solo el descuento no genera prorrateo y se aplica en la siguiente factura. Si se combina
    con un cambio de cantidad en la misma actualización, el prorrateo refleja las dos cosas a la vez.
  source_id: SRC-05
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: supports
  notes: Por eso el caso 1 de Q-025 llegaría como un solo monto; hay que registrarlo como dos eventos.
- claim: Stripe distingue los cupones que decide la empresa (por ejemplo, un descuento negociado por ventas) de
    los códigos promocionales que ingresa el cliente (campañas, solo para primeras compras, con límite de canjes
    y fecha de vencimiento).
  source_id: SRC-05
  source_type: company
  confidence: high
  freshness: Documentación vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: context
  notes: Se corresponde con Assisted/KAM frente a Self Service/Digital.
- claim: Según la guía de PwC para SaaS bajo IFRS 15, si el cliente puede terminar con preaviso, el contrato se
    trata como mes a mes. Solo el plazo no cancelable entra en la asignación del precio, y si el precio baja durante
    el plazo declarado hay que evaluar si esos descuentos futuros le dan al cliente un derecho material.
  source_id: SRC-08
  source_type: expert
  confidence: high
  freshness: Guía vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: context
  notes: No es una opinión sobre Finora; depende de cómo sean sus contratos.
- claim: La misma guía (Q4.9) indica que si un aumento programado de la tarifa es solo un mecanismo de pago diferido,
    el ingreso se reconoce de forma lineal durante el contrato; si el aumento sigue a la inflación o al mercado,
    no.
  source_id: SRC-09
  source_type: expert
  confidence: medium
  freshness: Guía vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: context
  notes: Aplicarlo a descuentos temporales en contratos a plazo fijo es una analogía que hay que validar con el
    auditor.
- claim: 'Lewis (2006), con datos de un periódico y de un supermercado online, encontró que cuanto más profundo
    es el descuento de adquisición, menores son la recompra y el valor del cliente: con un descuento de 35%, los
    clientes valían cerca de la mitad a largo plazo.'
  source_id: SRC-11
  source_type: academic
  confidence: medium
  freshness: '2006'
  supports_or_contests: context
  notes: Contexto B2C. El resumen salió de los resultados de búsqueda porque la página del editor devolvió error
    403. Es un benchmark, no evidencia sobre Finora.
- claim: Foubert, Datta y van Heerde (2015), con datos de un proveedor europeo de TV digital, estimaron que el valor
    de vida de los clientes captados con prueba gratis es 59% menor que el de los clientes regulares, aunque responden
    más a la comunicación de marketing y al uso.
  source_id: SRC-10
  source_type: academic
  confidence: high
  freshness: '2015'
  supports_or_contests: context
  notes: Contexto B2C; el estudio controla la selección de clientes. Es el análogo más cercano a dar meses al 100%.
    No es una cifra esperada para Finora.
- claim: Un estudio de Paddle/ProfitWell comparó 33 empresas que descuentan de forma agresiva con 55 que casi no
    descuentan, y reportó un LTV hasta 32,41% menor en el primer grupo.
  source_id: SRC-12
  source_type: marketing
  confidence: low
  freshness: '2022-07-20'
  supports_or_contests: context
  notes: Estudio observacional de un proveedor, sin controles ni pruebas de significancia documentadas; no permite
    atribuir causa.
- claim: La cascada de precio de bolsillo (pocket price waterfall) de McKinsey muestra cuánto ingreso conserva realmente
    una empresa en cada transacción después de descuentos y concesiones.
  source_id: SRC-13
  source_type: expert
  confidence: medium
  freshness: '2003-04-11'
  supports_or_contests: context
  notes: Marco conceptual para Q-026 (lista → neto → cobrado); no aporta una cifra aplicable a Finora.
- claim: En el análisis precio-volumen-mix de FTI, el efecto precio es el cambio de precio por el volumen del periodo
    anterior y el efecto volumen es el cambio de volumen por el precio actual (menos el mix). Recomienda calcularlo
    al nivel más detallado posible (SKU).
  source_id: SRC-14
  source_type: industry
  confidence: high
  freshness: '2024-05-03'
  supports_or_contests: context
  notes: Aplicado a Finora por cliente × línea, la descomposición cuadra sin residuo (es aritmética).
- claim: Gieng (2026) plantea que el churn al vencer una tarifa introductoria suele coincidir con el fin del proyecto
    que motivó la compra, y propone diferencias en diferencias, regresión con interacción y Shapley para separar
    ambos efectos. Lo ilustra con una simulación.
  source_id: SRC-15
  source_type: community
  confidence: low
  freshness: '2026-05-08'
  supports_or_contests: context
  notes: 'Es una simulación: muestra qué se puede distinguir, no qué pasó. Vale como advertencia de método.'
