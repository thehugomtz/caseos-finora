id: R-021
type: research
research_question: ¿Cómo debería Finora introducir descuentos temporales sin perder la respuesta a «¿por qué cambió
  nuestro MRR?»? Mecanismo propuesto, implicaciones multidisciplinarias y las preguntas del CFO contestadas con
  el modelo.
case_question: 'Q-002 (CFO: por qué cambió el ingreso recurrente y cuánto se explica por contratación, tarifa o
  descuento) · Q-025 (los tres casos donde el pago observado no alcanza) · Q-026 (negocio subyacente y revenue que
  no se captura por descuentos) · H-015 (HF3c: el descuento cambió el pago o compensó un cambio de suscripción).'
