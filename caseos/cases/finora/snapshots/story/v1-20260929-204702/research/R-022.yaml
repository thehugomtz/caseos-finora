    (SELECT c.months_to_return, r.multi_month_payment_signature AS k FROM c JOIN mart.customer_month r ON r.customer_id
    = c.customer_id AND r.month_index = c.month_index + c.months_to_return) SELECT CASE WHEN months_to_return =
