id: R-022
type: research
research_question: ¿Qué métricas MECE le corresponden a cada casuística de funnel (Executive, Self Service, Hybrid
  y el loop de Reactivate), cómo se calcula cada una y cuáles se pueden comparar entre funnels?
case_question: Esta investigación sirve a Q-050 (cuál es el nudo del bowtie) y a Q-023 (¿validar implica experimentos?).
  También define cómo se ponen a prueba H-004, H-005, H-006, H-007, H-028 y H-037 dentro del Funnel Propuesto. En
  la pregunta ejecutiva es la parte de «qué modelos se proponen» para medir el funnel cuando no todos los clientes
  lo recorren igual.
