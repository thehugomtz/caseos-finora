    SUM(CASE WHEN months_to_return = 1 THEN 1 ELSE 0 END) AS gap_1_month, SUM(CASE WHEN months_to_return >= 2 THEN
    1 ELSE 0 END) AS gap_2plus_months, ROUND(1.0*SUM(CASE WHEN months_to_return = 1 THEN 1 ELSE 0 END)/COUNT(*),3)
    AS share_gap_1 FROM r2 GROUP BY return_year ORDER BY return_year
  verified: true
- id: DM-06
