    required_dimensions:
    - dimension: motion_de_origen
      why: Executive, Hybrid, Self Service o Sin clasificar; se asigna al entrar y no cambia. Es lo que hace MECE
        el conteo.
    - dimension: ruta_al_nudo / tratamiento recibido
      why: Si fue tocada por un humano antes del pago y el tiempo a primer contacto. Separa lo asignado de lo que
        pasó y alimenta la matriz origen × ruta.
    - dimension: tipo_de_entrada
      why: Nueva, Reactivación o entrada de ex-cliente. Evita que las reactivaciones inflen «clientes nuevos» (H-037)
        y la conversión de Hybrid.
    - dimension: cohortes
      why: Mes de entrada para el lado izquierdo, mes de primer pago para el lado derecho y mes de churn para el
        loop, cada una marcada como completa o incompleta según su ventana.
    - dimension: banda_de_ajuste_al_entrar (con versión)
      why: Es la única forma de testear H-005 y H-028 con el mismo criterio a lo largo del tiempo.
    - dimension: fuente de la máquina de leads
      why: Para ubicar cambios de mezcla por canal (H-005).
    - dimension: responsable y capacidad semanal
      why: SDR, AE o KAM y su carga, para H-006 y para detectar experimentos naturales.
    - dimension: tipo_de_churn y ruta_de_regreso
      why: Brecha de cobro, cancelación o sin clasificar, y regreso por cobranza, self-serve o win-back. Separa
        equipos y palancas.
    - dimension: industria (existe) y tamaño/segmento
      why: Para comparar motions dentro de cada segmento y no confundir mezcla con desempeño.
    - dimension: bandera de ventana (existe)
      why: 'left_censored, suspected_spillover o clean: ene-22 y feb-22 quedan fuera de las comparaciones.'
    decision_enabled: Reasignar la capacidad comercial instalada y el gasto S&M entre Executive, Hybrid y Self Service
      según los resultados comunes desde el nudo. Decidir si el problema de Hybrid es de atención (capacidad) o
      de mezcla (calidad de la máquina de leads) y, con un experimento, si más capacidad recupera compras. Decidir
      si Reactivate se gestiona como cobranza o como win-back, y cómo se reporta «clientes nuevos» al CRO.
    limitations:
    - 'Hoy no se puede calcular ninguna métrica por motion: el modelo no tiene etiqueta de motion ni eventos anteriores
      al pago (DM-01).'
    - La motion de origen depende de la regla de ruteo; si la regla cambia, hay que versionarla o las series se
      rompen.
    - Las comparaciones atendida vs no atendida y tocada vs auto-servida son observacionales. Medir el efecto de
      la atención requiere un holdout aleatorio o un experimento natural (Q-023).
    - 'El CAC por motion es atribución: asigna crédito, no prueba causa. Además, la unidad de sm_spend no está documentada
      y no hay margen bruto.'
    - Una ventana fija corta las conversiones tardías; si la historia es un retraso (HC3a), hay que mirar varias
      ventanas.
    - 'Sin eventos de cobro, separar brecha de cobro de cancelación es un proxy: el pago 2× podría ser un upgrade
      o un prepago.'
    - Monto observado no es MRR contratado, y primer pago no es adquisición confirmada.
    implementation_implications:
    - 'Data Engineering: una tabla de asignación cuenta × episodio de entrada (motion de origen y versión de la
      regla); el cruce de IDs de CRM, producto y billing con «Cliente N»; y un chequeo mensual de que Σ Nuevas por
      motion + Reactivaciones = entradas a pago del modelo, con los puentes cerrando.'
    - 'Analytics: cohortes con ventana fija y marca de incompletas; láminas con las motions lado a lado y la matriz
      origen × ruta; nunca una tasa de conversión combinada.'
    - 'Con los datos de hoy ya se puede hacer: entradas a pago con y sin reactivaciones (H-037), el loop de Reactivate
      por brecha (1 vs 2 o más meses) con la señal de puesta al día, y el lado derecho común en agregado.'
    - 'Pedido a Finora: export de CRM (entradas, contactos, etapas, owners), eventos de producto (registro, activación),
      eventos de cobro (factura, fallo, dunning, cancelación) y roster comercial semanal.'
    - 'Decisiones de Hugo antes de construir: el nudo (Q-050), las definiciones de las cuatro casuísticas, las ventanas
      W por motion y el umbral de meses en cero para llamar churn.'
