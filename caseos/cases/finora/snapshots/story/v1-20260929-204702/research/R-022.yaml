task_why: Es lo que Hugo pidió explícitamente y lo que convierte el mix en algo que el CRO puede operar. Sin la
  identidad de estados, las métricas por ruta no cuadran con el total y no responden a «más leads, pero no más ventas».
task:
  work: propuesta
  draft_answer: 'Propuesta de arranque: todas las rutas se miden con la misma lógica y solo cambian las etapas.
    Base MECE: en cada cohorte de entrada (mes y puerta), a una fecha dada cada lead está en un solo estado: llegó
    al nudo, activo en una etapa, estancado, en Reactivate, perdido o descalificado. La suma da 100% y cuadra con
    el total. Encima van cuatro familias: volumen (entradas por periodo, puerta y canal), conversión (por etapa
    y al nudo, con plazo fijo), velocidad (tiempo a primer contacto, tiempo en etapa, tiempo al nudo) y valor al
    nudo (ticket de entrada, el puente con Revenue). Lo propio de cada ruta: Executive = tiempo a primer contacto,
    % de New contactado, conversión post-SQL y Won → primer pago; Self Service = activación y paso de registro a
    pago; Hybrid = qué señal dispara el contacto, tiempo de la señal al contacto y cuántos pasan de Self Service
    a Hybrid; Reactivate = estancados por etapa y antigüedad, % reactivado y % que llega al nudo, conservando la
    fecha de entrada original. Entre rutas solo se comparan entrada, nudo y valor; las etapas intermedias se comparan
    dentro de cada ruta a lo largo del tiempo. La conversión de Hybrid no dice cuánto aporta la persona; para eso
    haría falta un grupo sin contacto elegido al azar (Q-023). Plazos y umbrales se acuerdan con Finora.'
  hugo_said:
  - text: No es posible determinar las métricas actuales
    ref: N-025
  steps:
  - kind: data
    what: 'Con los datos del caso no se puede calcular ninguna métrica de conversión, velocidad ni estancamiento,
      porque no hay etapas ni toques. Lo único calculable es lo del nudo, si se define como primer pago: altas por
      mes y ticket de entrada. Ojo: la reactivación de mart.customer_month es de pagadores, no el Reactivate de
      leads.'
    where:
    - mart.customer_month
    - mart.monthly_metrics
  - kind: research
    what: Buscar cómo se mide en la práctica el aporte del contacto humano en rutas mixtas (grupos sin contacto,
      señal de uso que dispara el contacto) y cómo se reportan los leads reciclados sin contarlos dos veces. Solo
      como opciones.
    where: []
  - kind: proposal
    what: 'Entregable: una tabla por ruta con etapas × métricas (definición, cálculo en palabras, grano, dónde se
      registra); la identidad de estados que suma 100% por cohorte; qué se compara entre rutas y qué no; qué hipótesis
      del CRO alimenta cada métrica (H-004, H-005, H-006, H-007); y qué parámetros hay que acordar con Finora. Debe
      quedar consistente con las métricas de negocio de RT-018.'
    where: []
requested_via: delegado a Claude en el chat (29-sep 14:05, D-017)
why_it_matters: Si el Funnel Propuesto se mide con una sola tasa, o si mezcla reactivaciones con nuevos, el CRO
  puede leer un cambio de mezcla como un deterioro (o al revés) y mover capacidad comercial o gasto al lugar equivocado.
  Además, esto separa lo que hoy se le puede defender al CRO/CFO de lo que necesita instrumentación.
short_answer: 'Cada funnel tiene su propio lado izquierdo. Executive se mide por cuenta-oportunidad: win rate con
  ventana fija, ciclo de venta, estancamientos y tiempo de Won a pago. Hybrid se mide por entrada de la máquina
  de leads: cobertura y tiempo a primer contacto, carga por SDR/AE y conversión por banda de ajuste. Self Service
  se mide por registro: activación y registro→pago. Entre funnels solo se compara desde un nudo común, que propongo
  sea el primer pago: entradas a pago, M0/run-rate, retención y GRR/NRR por cohorte, y CAC solo si hay una regla
  de costo común. El conjunto es MECE si cada entrada a pago se clasifica primero como Reactivación o Nueva, y cada
  Nueva recibe una sola motion de origen asignada al entrar, reconciliando contra los puentes de clientes y MRR,
  que ya cierran con diferencia 0 en el modelo. Mi confianza en el diseño es media-alta, pero hoy solo se puede
  calcular el lado derecho en agregado y el loop de Reactivate. Ese loop, en los pagos, es sobre todo vueltas tras
  un solo mes en cero (70,5%), así que hay que partirlo en brecha de cobro y win-back.'
claims:
- claim: El bowtie de Winning by Design organiza la medición en métricas de volumen (cuántos llegan a cada etapa),
    conversión (dónde avanzan) y tiempo (qué tan rápido). Mide adquisición, retención y expansión como un solo sistema,
    y su diseño contempla una línea de negocio con hasta tres motions de GTM.
  source_id: SRC-WBD
  source_type: industry
  confidence: high
  freshness: Sin fecha visible; consultada el 2026-09-29.
  supports_or_contests: context
  notes: La página no detalla cómo se tratan self-serve y sales-led dentro del modelo.
- claim: En la versión de Drivetrain del bowtie, la conversión entre etapas es un cociente de volúmenes (CR1 = VM2/VM1)
    y el tiempo es la duración entre etapas. El lado derecho termina en churn y no contempla reactivación.
  source_id: SRC-DRV
  source_type: company
  confidence: medium
  freshness: Sin fecha visible; consultada el 2026-09-29.
  supports_or_contests: context
  notes: El hueco de reactivación es justo lo que el Funnel Propuesto agrega como loop.
- claim: 'Cada tipo de oportunidad (logo nuevo, cross-sell, upsell, retención) convierte a tasas distintas y pasa
    tiempos distintos en cada etapa. Contar leads-persona en vez de oportunidades del grupo de compra baja la conversión
    de forma artificial: en el ejemplo ilustrativo de Forrester, de 25% a 8%.'
  source_id: SRC-FOR
  source_type: industry
  confidence: high
  freshness: Blog de 2021; consultado el 2026-09-29.
  supports_or_contests: supports
  notes: Es un ejemplo ilustrativo, no un benchmark. Respalda no mezclar tasas y usar la cuenta-oportunidad como
    unidad en Executive.
- claim: La contabilidad de crecimiento separa Nuevos (primera actividad en el mes), Resucitados (tuvieron churn
    y vuelven) y Churned (activos el mes anterior, sin actividad en el actual).
  source_id: SRC-AMP
  source_type: company
  confidence: high
  freshness: Sin fecha visible; consultada el 2026-09-29.
  supports_or_contests: supports
  notes: Respalda clasificar Reactivación antes que motion (H-037).
- claim: Limitar a cada cohorte a una ventana fija de conversión es lo que permite comparar periodos. Las cohortes
    jóvenes se marcan como incompletas mientras su ventana no cierra.
  source_id: SRC-RC
  source_type: company
  confidence: high
  freshness: Documentación vigente; consultada el 2026-09-29.
  supports_or_contests: context
  notes: Es la regla de método para las tasas del lado izquierdo y las retenciones del lado derecho.
- claim: Una tendencia que se observa dentro de cada grupo puede desaparecer o invertirse al agregar los grupos
    (paradoja de Simpson). La recomendación es analizar por subgrupos relevantes.
  source_id: SRC-OPT
  source_type: marketing
