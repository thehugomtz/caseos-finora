    - event: activation_reached
      trigger: La cuenta completa el evento de valor definido por Producto.
      properties:
      - account_id
      - event_name
      - ts
      - definition_version
    - event: motion_switch
      trigger: La cuenta cambia de camino antes del pago (por ejemplo, Self Service que pide ayuda o PQA enrutado
        a Ventas).
      properties:
      - account_id
      - motion_desde
      - motion_hasta
      - trigger
      - ts
    - event: invoice_and_payment_attempt
      trigger: Cada factura emitida y cada intento de cobro.
      properties:
