      - origen (digital/ventas)
      - fuente/campaña
      - es_ex_cliente
      - fit_score_al_entrar
      - fit_model_version
      - routed_motion
      - routing_rule_version
    - event: human_touch_logged
      trigger: Cada contacto 1:1 de SDR, AE o KAM.
      properties:
      - account_id
      - entry_id u opportunity_id
      - rep_id
      - rol
      - canal
      - ts
      - resultado (conectó/no)
    - event: opportunity_stage_changed
      trigger: Creación de la oportunidad y cada cambio de etapa.
      properties:
