alternative_explanations:
- Las vueltas tras un mes en cero pueden ser pausas reales del cliente (por estacionalidad de su negocio) y no brechas
  de cobro.
- Pagar 2× el monto usual al volver puede ser un upgrade o un cambio a pago bimestral, no ponerse al día.
- Algunos meses en cero pueden venir de prepagos (pagos k× el monto usual que cubren meses siguientes) o de filas
  faltantes en el archivo, no de churn.
- 'La caída del peso de las reactivaciones entre 2022 y 2023 puede ser un efecto de borde de la ventana: el spillover
  de feb-22 y las vueltas cortas forzadas al inicio. No necesariamente es un cambio de comportamiento.'
- Las diferencias de resultados entre motions pueden reflejar la mezcla de segmentos (tamaño, industria, ajuste)
  y no el efecto de la motion.
- Que las entradas Hybrid atendidas conviertan mejor puede deberse a que el SDR atiende las que percibe mejores
  (H-028), no al efecto de la atención.
what_is_established:
- Los marcos de práctica del bowtie miden volumen, conversión y tiempo como familias separadas y conectan adquisición
  con retención y expansión (SRC-WBD, SRC-DRV).
- Cada tipo de oportunidad convierte a tasas distintas y tarda distinto en cada etapa, y mezclarlas distorsiona
  el agregado (SRC-FOR, SRC-OPT).
- Separar Nuevos de Resucitados es estándar en la contabilidad de crecimiento (SRC-AMP).
- 'En Finora, las reactivaciones son una parte material y variable de las entradas a pago: 30,4% en 2022 feb–dic
  (37,9% sin feb-22), 17,7% en 2023 y 22,6% en 2024 ene–oct (DM-02, DM-03).'
- El 70,5% de las reactivaciones llega tras exactamente un mes en cero, y 100 de esas 330 pagan 2× su monto usual
  al volver (DM-05, DM-06).
- Los puentes de clientes y de MRR cierran con diferencia 0 en 33 meses (DM-09).
- El modelo no tiene etiqueta de motion ni eventos anteriores al pago (DM-01).
what_is_contested:
- Si las vueltas tras un mes en cero son brechas de cobro o pausas y cancelaciones reales.
- 'Qué hito es el nudo: Won, primer pago o suscripción activa (Q-050).'
- 'Si comparar cuentas tocadas vs auto-servidas mide el aporte de ventas: la práctica PLS lo usa, pero el sesgo
  de selección lo pone en duda.'
- Qué ventana W le corresponde a cada motion.
what_remains_unknown:
- Cómo define y enruta Finora hoy Executive, Hybrid y Self Service, o si esas categorías existen en sus sistemas.
- Si existen CRM, eventos de producto y eventos de cobro con historia de 2022 a 2024, y si sus IDs cruzan con «Cliente
  N».
- La unidad de sm_spend y el margen bruto, necesarios para calcular CAC y payback por motion.
- Qué parte de las 283 bajas sin regreso son cancelaciones y qué parte son fallos de cobro no recuperados.
case_implication: 'Para Finora, «cómo medir el funnel si no todos lo recorren igual» se responde con un bowtie de
  tres entradas. Hay tres lados izquierdos que se leen solo dentro de su motion, un nudo común (propongo el primer
  pago; se decide en Q-050), un lado derecho donde sí se compara y un loop de Reactivate aparte. Con los datos del
  caso ya cambian dos cosas. Primero, cualquier lámina de «clientes nuevos» tiene que separar las reactivaciones,
  porque su peso se movió entre 2022 y 2024. Eso sostiene H-037 como explicación a descartar antes de hablar de
  deterioro de New. Segundo, el loop de Reactivate del Funnel Propuesto debería abrirse en «recuperación de cobro»
  y «win-back»: 7 de cada 10 vueltas son de un solo mes, y 3 de cada 10 de esas pagan el doble, lo que es consistente
  con pagar el mes atrasado. Para H-005, H-006, H-007 y H-028 no hay nada que calcular hoy. Lo defendible ante el
  CRO/CFO es el diccionario de métricas con sus eventos, más el pedido de datos a Finora.'
changes_current_story:
  value: maybe
  why: No aporta evidencia nueva sobre por qué New se desaceleró, pero cambia el encuadre de dos piezas. Reactivate
    deja de ser un loop solo comercial y pasa a mezclar cobro con win-back, y «clientes nuevos» hay que leerlo sin
    reactivaciones. Si la storyline actual trata Reactivate como una palanca comercial pura, sí cambia.
affected_hypotheses:
- id: H-037
  effect: supports
  why: 'El peso de las reactivaciones en las entradas a pago no es estable: 30,4% en 2022 feb–dic (37,9% sin feb-22),
    17,7% en 2023 y 22,6% en 2024 ene–oct (DM-02, DM-03). No se cumple la condición que la debilitaría, aunque 2022
    tiene efecto de borde de ventana.'
- id: H-006
  effect: requires_research
  why: 'Quedan definidas las métricas que la ponen a prueba: cobertura, tiempo a primer contacto, carga por SDR/AE
    y conversión dentro de cada banda de ajuste. Ninguna se puede calcular con pagos (DM-01).'
- id: H-005
  effect: requires_research
  why: Necesita una banda de ajuste medida al entrar, con un modelo de ajuste versionado para que el criterio sea
    el mismo en el tiempo. Esa banda no existe en el modelo.
- id: H-028
  effect: changes_framing
  why: El diseño cruza banda de ajuste × atendida/no atendida × conversión. La comparación entre atendidas y no
    atendidas está sesgada por la selección del SDR, así que la palanca solo se prueba con un holdout aleatorio
    dentro de cada banda.
- id: H-007
  effect: changes_framing
  why: Para ubicar «después de qué punto» se deteriora hay que medir alcance y tiempo por etapa dentro de cada motion,
    por cohorte y con ventana fija. Mezclar motions puede mover el punto de quiebre aparente.
- id: H-004
  effect: changes_framing
  why: Las métricas comunes a M3/M6/M12 por cohorte de primer pago y motion permiten separar el retraso (HC3a) de
    la brecha persistente (HC3b). Un cambio de mezcla entre motions podría parecer HC3b sin serlo.
affected_claims:
- id: Q-050
  effect: changes_framing
  why: El primer pago es el único hito común a los tres funnels y observable hoy; Won solo existe en Executive e
    Hybrid. Propongo nudo = primer pago, con Won como hito propio de esas dos motions, y pasar a «suscripción activa»
    cuando existan estados de suscripción. Es una pregunta, no un claim de la historia, y la decide Hugo.
- id: Q-023
  effect: changes_framing
  why: Para ubicar dónde se rompe el recorrido (H-007) basta con medir por cohorte. Para probar palancas (capacidad
    en H-006, triage en H-028, win-back) hace falta un experimento o un experimento natural. Comparar tocadas vs
    no tocadas no es causal.
suggested_action: 'Llevarle a Hugo tres decisiones para cerrar el diseño. (1) Confirmar las definiciones de Executive,
  Hybrid, Self Service y Reactivate, y la regla «Nueva vs Reactivación → motion de origen asignada al entrar». (2)
  Elegir el nudo en Q-050; la propuesta es el primer pago. (3) Aprobar que el loop de Reactivate se abra en brecha
  de cobro y win-back. En paralelo, pedirle a Analytics las dos láminas que sí se pueden hacer hoy: entradas a pago
  con y sin reactivaciones, y el loop de Reactivate por brecha con la señal de puesta al día. Y preparar el pedido
  de datos a Finora: CRM, eventos de producto, eventos de cobro y roster comercial.'
new_questions:
- ¿Finora registra hoy, en el CRM o en cobro, cómo entró cada cliente (Ventas/KAM, lead atendido por SDR o registro
  propio), con un ID que cruce con «Cliente N»?
- ¿Existen eventos de cobro (factura, pago fallido, reintento, cancelación solicitada) que permitan separar brecha
  de cobro y cancelación en las 330 vueltas tras un mes en cero?
- ¿Qué ventana de días cubre el 80% de los cierres en Executive y en Hybrid, tanto de oportunidad a Won como de
  Won a primer pago?
handoff_to_cos:
  summary: 'R-022 entrega el diccionario MECE: tres lados izquierdos propios (Executive, Hybrid, Self Service),
    un nudo común propuesto (primer pago), un lado derecho comparable por cohorte y el loop de Reactivate aparte.
    Con los datos del caso, las reactivaciones son 30,4%, 17,7% y 22,6% de las entradas a pago según el año, lo
    que apoya H-037. El 70,5% de ellas vuelve tras un solo mes en cero y 3 de cada 10 de esas pagan el doble, así
    que Reactivate parece mezclar cobro con win-back. Nada por motion se puede calcular hoy.'
  recommended_next: Pasarle a Hugo la decisión del nudo (Q-050) y de las definiciones de las casuísticas. Encargar
    a Analytics las dos láminas calculables hoy y a Data Engineering la especificación de eventos y del cruce de
    IDs. Preparar el pedido de datos a Finora.
confidence_buckets:
  high_confidence:
  - Entre funnels solo se compara desde un hito común con la misma unidad.
  - En toda métrica de entradas, las reactivaciones van separadas de las Nuevas.
  - Las tasas se miden por cohorte con ventana fija, no por periodo.
  - El modelo actual no permite métricas por motion.
  - 'Los puentes de clientes y de MRR ya cierran: son la base MECE del lado derecho.'
  plausible:
  - La mayoría de las vueltas tras un mes en cero son brechas de cobro.
  - El primer pago como nudo común.
  - La cobertura y el tiempo a primer contacto como métricas clave de Hybrid para H-006.
  contested:
  - Si la comparación entre tocadas y auto-servidas mide el aporte de ventas.
  - Qué ventana W corresponde a cada motion.
  - Si el cambio del peso de las reactivaciones de 2022 a 2023 es comportamiento o efecto de borde de la ventana.
  unknown:
  - Las definiciones y el ruteo actuales de Finora.
  - Si hay CRM, eventos de producto y eventos de cobro con historia y con IDs que crucen.
  - La unidad de sm_spend y el margen bruto.
  - 'La composición de las 283 bajas sin regreso: cancelación vs fallo de cobro.'
specialist:
  measurement:
    problem_interpretation: 'Hugo quiere que el Funnel Propuesto tenga, para cada casuística, un set de métricas
      que no se pisen entre sí ni dejen huecos, cada una con su fórmula, y saber cuáles se pueden poner lado a lado
      ante el CRO/CFO. El problema de fondo es que los tres funnels de adquisición no comparten unidad ni etapas:
      Executive trabaja con cuenta-oportunidad, Hybrid con entradas de la máquina de leads y Self Service con registros.
      El loop de Reactivate no es adquisición, sino un regreso sobre la base. Un funnel lineal con una sola tasa
      mezclada no describiría a nadie. Además, hoy solo observamos pagos: nada antes del nudo y ninguna etiqueta
      de motion. Interpreto las casuísticas así, y Hugo las confirma: Executive es la venta liderada por KAM/AE
      desde la cuenta. Hybrid es una entrada digital que recibe atención de SDR/AE antes de pagar. Self Service
      es registro y pago sin intervención comercial. Reactivate es una cuenta que ya pagó, dejó de pagar y vuelve.'
    measurement_objective: Habilitar tres decisiones. (1) Dónde poner la capacidad comercial instalada y el gasto
      S&M entre motions, comparando resultados económicos comunes desde el nudo. (2) Dónde y por qué se estanca
      cada motion, con las métricas propias de su lado izquierdo. (3) Si Reactivate se gestiona como cobranza o
      como win-back comercial, y cómo cuenta en «clientes nuevos».
    recommended_framework:
      name: Bowtie multi-motion con nudo común y loop de Reactivate separado
      structure: 'Capa 0, clasificación MECE: cada entrada a pago es Reactivación (la cuenta pagó antes) o Nueva.
        Cada Nueva recibe una sola motion de origen (Executive, Hybrid, Self Service o Sin clasificar), asignada
        al entrar por la regla de ruteo y sin cambiarla después. Regla de desempate: manda el primer episodio de
        entrada; si hay empate, gana la oportunidad originada por Ventas. El tratamiento recibido (tocada o no,
        tiempo a primer contacto) es una dimensión aparte, y los cruces se ven en una matriz origen × ruta. Capa
        1, lado izquierdo por motion: volumen, tasa por cohorte con ventana fija, tiempo entre hitos, estancamientos
        y capacidad; se leen solo dentro de cada motion. Capa 2, nudo común: el primer pago (propuesta para Q-050),
        con Won como hito propio de Executive e Hybrid. Capa 3, lado derecho común por cohorte de primer pago ×
        motion de origen: M0, run-rate temprano, retención logo a M3/M6/M12, GRR/NRR y churn; aquí sí se compara.
        Capa 4, loop de Reactivate por cohorte de churn: tipo (brecha de cobro, cancelación o sin clasificar), vuelta
        a k meses, valor y durabilidad. Control: la suma de Nuevas por motion más las Reactivaciones debe igualar
        las entradas a pago del modelo, y los puentes de clientes y de MRR deben seguir cerrando cada mes.'
      why: Es el único arreglo que respeta que cada motion convierte a ritmos y tiempos distintos (SRC-FOR), mantiene
        volumen, conversión y tiempo como familias separadas (SRC-WBD, SRC-DRV), separa nuevos de resucitados (SRC-AMP)
        y solo compara donde el hito y la unidad son los mismos (SRC-OPT). Además, el lado derecho y el loop ya
        se pueden calcular en agregado con los pagos, así que la estructura empieza a servir antes de tener el CRM.
    alternative_frameworks:
    - name: Máquina de estados del ciclo de vida (prospecto → registrado → pagando → dormido → churn → reactivado)
        con matriz de transiciones
      when_better: Cuando muchas cuentas cruzan entre motions (por ejemplo, Self Service que pide ayuda) o cuando
        el uso manda más que las etapas comerciales.
      tradeoff: Describe mejor los cruces y los regresos, pero es más difícil de contar en una lámina y no da tasas
        por etapa que el CRO reconozca.
    - name: 'Waterfall por oportunidad al estilo Forrester: un solo funnel con el tipo de oportunidad como dimensión
        (logo nuevo, upsell, renovación, win-back)'
      when_better: Cuando casi todo el revenue pasa por oportunidades en el CRM (Executive pesa mucho) y Self Service
        es marginal.
      tradeoff: Self Service no tiene oportunidad, así que habría que inventarle etapas que no recorre.
    metric_definitions:
    - metric: Entradas a pago (control MECE)
      definition: Cuentas que empiezan a pagar en el mes, separadas en Reactivaciones y Nuevas. Las Nuevas se abren
        por motion de origen.
      formula: Entradas_pago(m) = Nuevas_Executive + Nuevas_Hybrid + Nuevas_SelfService + Nuevas_SinClasificar +
        Reactivaciones; % sin clasificar = Nuevas_SinClasificar ÷ Nuevas
      grain: cuenta × mes de pago
      milestone: primer pago (Nuevas) / vuelta a pago tras ≥1 mes en cero (Reactivación)
      notes: Comparable y aditiva entre funnels. Hoy se pueden calcular el total de Nuevas y de Reactivaciones (mart.monthly_metrics),
        pero no el split por motion. Debe cuadrar con new_customers + reactivated_customers. Ene-22 y feb-22 quedan
        fuera de las comparaciones.
    - metric: Oportunidades Executive creadas
      definition: Cuentas con una oportunidad originada por Ventas/KAM (no por una entrada digital) que llegan a
        calificación en el periodo.
      formula: COUNT(DISTINCT cuenta-oportunidad) con hito E2 en el mes y sourced_by = ventas
      grain: cuenta-oportunidad × mes de calificación
      milestone: oportunidad calificada (E2)
      notes: 'La unidad es la cuenta, no la persona: varios contactos del mismo grupo de compra cuentan como una
        oportunidad. Propia de Executive.'
    - metric: Win rate Executive a W_E (cohorte)
      definition: Proporción de oportunidades calificadas en el mes que llegan a Won dentro de W_E días.
      formula: Won con fecha ≤ E2 + W_E ÷ oportunidades E2 de la cohorte; las cohortes con menos de W_E días de
        edad se marcan como incompletas
      grain: cohorte mensual de E2
      milestone: E2 → Won
      notes: W_E se calibra como los días que cubren cerca del 80% de los cierres observados. Solo se compara con
        Hybrid si la definición de oportunidad/SQL es la misma. No usar el win rate de periodo.
    - metric: Ciclo de venta Executive
      definition: Mediana y p75 de los días de E2 a Won, reportadas junto con el % de la cohorte que sigue abierta
        a W_E.
      formula: MEDIAN(fecha_Won − fecha_E2) sobre las Won de la cohorte; % abiertas = abiertas a W_E ÷ cohorte
      grain: oportunidad, reportada por cohorte mensual
      milestone: E2 → Won
      notes: Sin el % de abiertas, la mediana premia a las que cierran rápido (sesgo de supervivencia). Propia de
        Executive.
    - metric: Estancamientos por etapa (Executive e Hybrid)
      definition: Oportunidades abiertas que llevan más de N_etapa días sin cambiar de etapa.
      formula: abiertas con (hoy − última fecha de cambio de etapa) > N_etapa ÷ abiertas en esa etapa; N_etapa =
        p75 de la duración histórica de la etapa
      grain: oportunidad × semana (foto semanal)
      milestone: entrada a cada etapa
      notes: Es la métrica que ubica dónde se rompe el recorrido (H-007). Se lee dentro de cada motion, no entre
        motions.
    - metric: Won → primer pago
      definition: Días desde la firma hasta el primer pago observado, y proporción de Won sin pago dentro de W_P
        días.
      formula: MEDIAN(fecha_primer_pago − fecha_Won); % Won sin pago a W_P = Won sin pago ≤ W_P ÷ Won
      grain: cuenta
      milestone: Won → primer pago
      notes: Solo para Executive e Hybrid. Cuantifica cuánto cambia elegir Won o primer pago como nudo (Q-050).
    - metric: Entradas Hybrid
      definition: Cuentas con una primera entrada digital calificable (formulario, demo o registro enrutado a Ventas)
        en el periodo, deduplicadas por cuenta.
      formula: COUNT(DISTINCT cuenta) con entry_created y routed_motion = Hybrid; una misma cuenta no vuelve a contar
        como entrada nueva dentro de la ventana de deduplicación
      grain: cuenta × episodio de entrada × semana
      milestone: entrada (H0)
      notes: Se corta por fuente de la máquina de leads y por banda de ajuste al entrar (H-005). Las entradas de
        ex-clientes se marcan y no inflan la conversión de logos nuevos. Propia de Hybrid.
    - metric: Cobertura de atención Hybrid
      definition: Proporción de entradas con primer contacto humano dentro del SLA y dentro de la ventana de trabajo.
        Su complemento son las entradas no atendidas.
      formula: entradas con primer contacto ≤ SLA ÷ entradas; no atendidas = entradas sin contacto a W_contacto
        ÷ entradas
      grain: cohorte semanal de entradas
      milestone: H0 → primer contacto humano (H1)
      notes: Una entrada Hybrid no atendida sigue siendo Hybrid (no pasa a Self Service); así se ve el problema
        de capacidad (H-006). Finora define el SLA y W_contacto.
    - metric: Tiempo a primer contacto humano
      definition: Mediana y p75 de las horas hábiles entre la entrada y el primer contacto 1:1 registrado.
      formula: MEDIAN(ts_primer_contacto − ts_entrada) en horas hábiles, sobre las entradas contactadas; se reporta
        junto al % de no atendidas
      grain: entrada
      milestone: H0 → H1
      notes: La literatura sugiere que la velocidad importa (SRC-HBR); en Finora es hipótesis (H-006) hasta medirla.
        Propia de Hybrid.
    - metric: Carga por SDR / AE
      definition: Entradas asignadas por SDR activo por semana y oportunidades abiertas por AE.
      formula: entradas asignadas ÷ SDR activos en la semana; oportunidades abiertas ÷ AE activos
      grain: persona × semana
      milestone: asignación
      notes: Necesita el roster (ingresos, salidas y ausencias). Es la base para ver si la carga subió cuando creció
        New (H-006) y para buscar experimentos naturales.
    - metric: Conversión Hybrid por cohorte y banda de ajuste
      definition: Proporción de entradas que llega a SQL y a primer pago dentro de ventanas fijas, cortada por banda
        de ajuste al entrar y por atendida/no atendida.
      formula: entrada→SQL = SQL ≤ H0 + W_SQL ÷ entradas; entrada→pago = primer pago ≤ H0 + W_H ÷ entradas; ambas
        por banda y por contacto
      grain: cohorte mensual de entradas × banda de ajuste
      milestone: H0 → SQL → Won → primer pago
      notes: Separa H-005 (cambia la mezcla de bandas) de H-006 (cae la conversión dentro de cada banda). Atendida
        vs no atendida es una comparación observacional, porque el SDR elige (H-028).
    - metric: Registros Self Service
      definition: Cuentas creadas por el camino digital que la regla de ruteo no envía a Ventas.
      formula: COUNT(DISTINCT cuenta) con signup_created y routed_motion = Self Service
      grain: cuenta × mes de registro
      milestone: registro (S0)
      notes: La unidad es la cuenta (tipo PQA), no el usuario individual. Propia de Self Service.
    - metric: Activación a W_A y time to value
      definition: Proporción de registros que completan el evento de valor dentro de W_A días, y mediana de días
        hasta ese evento.
      formula: activados ≤ S0 + W_A ÷ registros de la cohorte; MEDIAN(ts_activación − ts_registro)
      grain: cohorte mensual de registros
      milestone: S0 → activación (S1)
      notes: El evento de valor lo define Producto; sin él, esta métrica no existe. Propia de Self Service (y de
        Hybrid si hay trial).
    - metric: Registro → primer pago Self Service a W_S
      definition: Proporción de registros que pagan dentro de W_S días, y mediana de días entre registro y pago.
      formula: cuentas con primer pago ≤ S0 + W_S ÷ registros de la cohorte; MEDIAN(fecha_primer_pago − fecha_registro)
      grain: cohorte mensual de registros
      milestone: S0 → primer pago
      notes: 'No se compara con el win rate ni con la conversión entrada→pago de Hybrid: los denominadores son distintos.'
    - metric: 'Valor de entrada: M0 y run-rate temprano'
      definition: Monto pagado en el primer mes y promedio de los primeros meses de cada cuenta Nueva.
      formula: p25, p50 y p75 de m0_cop y de early_run_rate_cop por cohorte de primer pago × motion
      grain: alta (cuenta nueva)
      milestone: primer pago (M0)
      notes: Comparable entre funnels. Ya existe en mart.new_customers, sin motion. Es monto observado, no MRR contratado.
        El run-rate suaviza los pagos multi-mes (DM-08).
    - metric: Retención logo por cohorte (M3/M6/M12)
      definition: Proporción de la cohorte de primer pago que paga en el mes k. Tiene una versión estricta (sin
        meses en cero hasta k) y una versión «activa en k».
      formula: activa_k = cuentas que pagan en Mk ÷ cohorte; estricta_k = cuentas sin churn observado entre M0 y
        Mk ÷ cohorte
      grain: cohorte mensual de primer pago × motion × k
      milestone: primer pago
      notes: Comparable entre funnels. Las dos versiones difieren por las vueltas tras un mes; hay que mostrar ambas
        hasta separar cobro de cancelación.
    - metric: GRR y NRR de cohorte a Mk
      definition: Monto pagado por la cohorte en Mk respecto de su monto en M0. En la versión bruta, cada cuenta
        se topa en su monto de M0.
      formula: NRR_k = Σ monto_i,k ÷ Σ monto_i,0; GRR_k = Σ min(monto_i,k, monto_i,0) ÷ Σ monto_i,0 (con promedios
        de 3 meses alrededor de Mk)
      grain: cohorte de primer pago × motion
      milestone: M0
      notes: Comparable entre funnels. Se calcula por cohorte y no por mes calendario, para no mezclar edades. Se
        basa en monto pagado observado.
    - metric: CAC por motion (condicionado)
      definition: Costo S&M asignado a una motion por cada cuenta Nueva de esa motion.
      formula: costo S&M asignado a la motion en el periodo ÷ Nuevas de la motion en el periodo (con el desfase
        acordado)
      grain: motion × trimestre
      milestone: primer pago
      notes: Solo es comparable con una regla de asignación común y documentada. Hoy la unidad de sm_spend no está
        documentada y no hay margen bruto para el payback. La atribución asigna crédito, no prueba causa.
    - metric: Episodios de churn por tipo (entrada al loop de Reactivate)
      definition: Cuentas que pagaban en m−1 y pagan 0 en m, clasificadas por tipo.
      formula: churn observado(m) = pagaba en m−1 y paga 0 en m; tipo = brecha de cobro (evento de pago fallido
        o dunning) / cancelación (solicitud de baja) / sin clasificar
      grain: episodio de churn (cuenta × mes)
      milestone: primer mes en cero
      notes: 'Hoy todo cae en «sin clasificar» y solo hay proxies: la vuelta al mes siguiente y el pago de puesta
        al día.'
    - metric: Tasa de reactivación a k meses por cohorte de churn
      definition: Proporción de episodios de churn de un mes que vuelven a pagar dentro de k meses.
      formula: 'episodios que vuelven ≤ k meses ÷ episodios del mes de churn (k = 1, 3, 6); estados MECE: volvió
        en 1 mes, volvió en 2–k meses, no ha vuelto (censurado)'
      grain: cohorte mensual de churn
      milestone: primer mes en cero → vuelta a pago
      notes: Hoy se puede calcular (months_to_return). La vuelta a 1 mes se reporta aparte, porque es la más probable
        de ser cobro. Es la métrica propia del loop.
    - metric: Señal de puesta al día (proxy de brecha de cobro)
      definition: Proporción de reactivaciones cuyo pago de vuelta equivale a los meses en cero más el mes actual.
      formula: reactivaciones con pago de vuelta = (meses en cero + 1) × monto usual (±0,5%) ÷ reactivaciones
      grain: reactivación
      milestone: vuelta a pago
      notes: Hoy se puede calcular con multi_month_payment_signature. Es un proxy, no una prueba; se reemplaza por
        eventos de cobro cuando existan.
    - metric: Monto recuperado y durabilidad post-reactivación
      definition: Qué tanto del monto previo recupera la reactivación y si la cuenta sigue pagando después.
      formula: monto de vuelta ÷ monto previo al churn; % de reactivados que siguen pagando a +3 meses
      grain: reactivación
      milestone: vuelta a pago
      notes: Permite comparar el valor del loop con el de una Nueva. Se compara entre motions de origen como resultado
        del cliente.
    - metric: Win-back rate (cancelaciones contactadas)
      definition: Proporción de cancelaciones voluntarias contactadas que vuelven a pagar dentro de k meses.
      formula: cancelaciones voluntarias que vuelven ≤ k meses tras el contacto de win-back ÷ cancelaciones contactadas;
        con un grupo no contactado asignado al azar para medir el lift
      grain: episodio de cancelación
      milestone: contacto de win-back
      notes: Sin grupo de control mide asociación, no efecto. Necesita el evento de contacto.
    required_events:
    - event: account_crosswalk
      trigger: Al crear la cuenta en CRM o producto y en su primer cobro.
      properties:
      - account_id
      - billing_customer_id (↔ «Cliente N»)
      - crm_account_id
      - product_account_id
      - created_at
    - event: entry_created
      trigger: 'Primera interacción calificable de la cuenta: formulario, demo, registro o creación de oportunidad
        por Ventas.'
      properties:
