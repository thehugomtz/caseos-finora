cos_assessment:
  summary: 'R-022 es diseño de métricas, no evidencia de causas. No mueve ninguna explicación del CRO (H-004 a H-007,
    H-028), porque hoy no se puede calcular nada por motion ni nada anterior al pago (F-159). Lo que sí trae de
    data cambia cómo se cuenta:

    - En los pagos, el loop de Reactivate es sobre todo vueltas tras un solo mes en cero (70,5%).

    - El peso de las reactivaciones en las entradas a pago se movió: 30,4% en 2022 feb–dic, 17,7% en 2023 y 22,6%
    en 2024 ene–oct.


    Hay cinco alertas nuevas:

    - **framing** (severidad alta): una reactivación observada no es win-back, y una baja sin regreso no es cancelación.

    - **H-037**: la premisa se cumple, pero la dirección depende de la ventana.

    - **C-005**: pasar a Hybrid y a la regla de dos pasos.

    - **C-012**: según R-022, probar la palanca de H-006/H-028 requiere un experimento. Esto completa U12 (Q-023).

    - **H-007**: en la respuesta corta, Hybrid no mide post-SQL, estancamientos ni Won→pago.


    Q-050 suma un segundo research a favor del primer pago; la decisión sigue en X-052. Igual que R-019 y R-021,
    R-022 es una propuesta de métricas: la tensión con D-007 sigue en X-055 y X-073, así que no abro otra alerta.


    Siguientes pasos, en orden de desbloqueo:

    1. Decidir el nudo en X-052 junto con una regla de gracia (Q-050). De eso dependen F-156, el peso de Reactivate
    y H-037.

    2. Decidir el límite de Reactivate en el framing.

    3. Revisar el cuerpo de R-022 por el tramo post-SQL de Hybrid y decidir qué hace R-023 (en curso), que pregunta
    casi lo mismo que R-016 y R-022.

    4. Revisar F-155 a F-159. Con eso, ajustar C-005 y C-012 y responder U12.

    5. En paralelo, contar con los pagos las reactivaciones por mes (hipótesis nueva). Así se sabe si el peso que
    usa H-037 se mueve por las reactivaciones o por las Nuevas.'
  run_id: RUN-20260929-143020-cos-4d70
  at: '2026-09-29T14:44:07-06:00'
  impacts:
  - target: framing
    effect: changes_framing
    why: 'Hallazgo: en los pagos, el loop de Reactivate es sobre todo vueltas tras un solo mes en cero (70,5%, F-157),
      y una parte vuelve pagando el doble. Además, R-022 no puede decir cuántas de las 283 bajas sin regreso son
      cancelaciones y cuántas son fallos de cobro. Por qué toca el framing: el «No afirmar todavía» cuida alta,
      baja y expansión, pero no dice nada de Reactivate. Fuera del lado derecho en agregado, el loop es lo único
      del funnel que se calcula hoy (R-022), así que va a salir en la story. Es fácil leerlo como el Reactivate
      del CRO (si en su CRM es un tipo de entrada, como New en H-001) o como win-back; con 70,5% de vueltas tras
      un mes, esa lectura mediría sobre todo brechas de cobro. Del otro lado pasa lo mismo: el churn persistente
      (T-002) no es lo mismo que una cancelación. Complementa X-034 y X-058; no los repite.'
  - target: H-037
    effect: supports
    why: 'Hallazgo: el peso de las reactivaciones en las entradas a pago se movió: 30,4% en 2022 feb–dic (37,9%
      sin feb-22), 17,7% en 2023 y 22,6% en 2024 ene–oct. Eso cumple la premisa de H-037, pero la dirección cambia
      según la ventana. Cuando el peso baja (2022→2023), meter las reactivaciones dentro de «clientes nuevos» hace
      que ese conteo crezca menos que las primeras apariciones solas: va en la dirección de la queja del CRO. Cuando
      sube (2023→2024), hace que crezca más: va en contra. Hay tres condiciones: (1) no sabemos si el CRO las cuenta
      ni de qué sistema sale su conteo; (2) con una regla de gracia, la mayoría de las reactivaciones (70,5% son
      tras un mes) saldría del nudo; (3) 2022 es frágil por el inicio del panel (30,4% contra 37,9%, H-041). Sobre
      la ventana, ver X-016.'
  - target: C-005
    effect: changes_story
    why: 'R-022 confirma el bowtie de C-005: cada funnel tiene su lado izquierdo y entre funnels solo se compara
      desde el nudo (F-155). Además le agrega la regla que hace MECE el conteo: primero Reactivación o Nueva, después
      una sola motion de origen asignada al entrar (F-156). Cambian dos cosas del claim: R-022 dice Hybrid (tu término)
      donde C-005 dice Assisted, y Reactivate entra como clasificación previa. El texto necesita dos límites. Uno:
      que el conteo cierre con diferencia 0 contra los puentes muestra que está completo, no que la clasificación
      sea correcta (X-031). Dos: en el histórico, «¿pagó antes?» solo se contesta desde ene-22, así que «Nueva»
      significa primera aparición observada (H-041).'
  - target: C-012
    effect: weakens
    why: 'Hallazgo: según R-022, probar las palancas de H-006 y H-028 requiere un experimento (F-159). C-012 dice
      que capacidad y calidad se separan comparando la mezcla contra la tasa por grupo de entrada. Esa comparación
