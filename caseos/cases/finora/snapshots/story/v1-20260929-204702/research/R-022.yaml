  '4-6' WHEN months_to_return BETWEEN 7 AND 12 THEN '7-12' ELSE '>12' END AS bucket, COUNT(*) AS churn_events, ROUND(1.0*COUNT(*)/(SELECT
  COUNT(*) FROM mart.churn_events),3) AS share FROM mart.churn_events GROUP BY 1 ORDER BY MIN(COALESCE(months_to_return,
  999))
- WITH r AS (SELECT customer_id, month AS churn_month, months_to_return, CAST(substr(month,1,4) AS INTEGER) AS y,
