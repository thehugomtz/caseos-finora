id: C-008
type: claim
key: perdida-burbuja
question: ¿Hay industrias de bajo churn, ticket alto y poco volumen que valga la pena mirar?
headline: 'Salud combina menor churn persistente, ticket alto y poco volumen: señal a validar'
answer: 'Salud combina el menor churn persistente (0,56 puntos porcentuales mensuales), el ticket de entrada mediano
  más alto de 2024 (COP 52,5 mil, empatado con Restaurantes) y poco volumen: 124 clientes activos en oct-24 frente
  a 459 en Restaurantes. Es además de las industrias con menor caída del MRR por cliente entre dic-22 y oct-24 (−14,4%)
  y aporta 11,7% del crecimiento del MRR. En 2024 el churn observado por industria va de 1,46 a 2,57 puntos mensuales:
  un rango estrecho. Es una señal para validar con tamaño, canal y motivos de salida, no un segmento.'
