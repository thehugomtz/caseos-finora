title: R-020 requiere más investigación H-010
finding_text: El ticket de entrada es medible; el descuento no es verificable aquí
why: En los datos no hay descuentos documentados (F-093) y el caso habla de introducirlos, así que H-010 no se puede
  evaluar con pagos. La señal de R-020 no sirve ni para afirmar ni para negar descuentos. Un descuento introductorio
  de un solo mes haría que el segundo pago fuera mayor que el primero, y eso solo aparece en el 0,9–1,5% de las
  altas (F-086). Pero un descuento pequeño o de varios meses daría pagos iguales, que es lo que se ve en el 73,5–90,3%
  (F-087). Y un 2.º pago más bajo que el 1.º tampoco se puede leer como descuento (F-093). Lo natural es que sirva
  como caso de prueba del modelo de R-021, que incluiría el descuento con su vigencia.
