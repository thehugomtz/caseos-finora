id: X-083
type: alert
kind: research_needed
status: open
severity: medium
effect: requires_research
source: R-022
target: H-007
title: R-022 requiere más investigación H-007
finding_text: 'Cada funnel tiene su propio lado izquierdo. Executive se mide por cuenta-oportunidad: win rate con
  ventana fija, ciclo de venta, estancamientos y tiempo de Won a pago. Hybrid se mide por entrada de la máquina
  de leads: cobertura y tiempo a primer contacto, carga por SDR/AE y conversión por banda de…'
why: 'Hallazgo: en la respuesta corta de R-022, Hybrid se mide solo a la entrada (cobertura, tiempo a primer contacto,
  carga por SDR/AE y conversión por banda de ajuste). Ciclo, estancamientos y Won→pago aparecen solo en Executive.
  Por qué importa: H-007 (el deterioro aparece después de un punto del recorrido) vive justo en ese tramo de la
  máquina de leads, que es donde está la pregunta del CRO. Lo mismo vale para H-055, porque midiendo solo el tiempo
  a primer contacto los leads sin seguimiento se verían bien, y para H-057 (Won que no llega al pago). D-003 deja
  post-SQL para contrastar. X-025 cubre que quizá no haya historia de etapas en el CRM; esto es distinto: aunque
  la hubiera, el diseño no la pediría.'
options:
- key: A
  label: Revisar el cuerpo de R-022 y, si falta, pasarle el tramo a R-023
  consequence: Si el cuerpo no lo trae, pedir que R-023 (en curso) añada a Hybrid conversión por etapa con ventana
    fija, estancamientos y Won→pago. Cierra el hueco sin research nuevo y le da a R-023 algo que R-016 y R-022 no
    cubren.
- key: B
  label: Aceptarlo como límite
  consequence: H-007, H-055 y H-057 solo se contrastarían en Executive. El diseño es más simple, pero el tramo del
    funnel donde más se estancan los leads queda sin medir.
- key: C
  label: Abrir un research nuevo solo para post-SQL en Hybrid
  consequence: Es más limpio, pero suma otra corrida y se cruza con R-023.
recommended: A
recommended_why: Es el chequeo más chico y aprovecha una corrida que ya está en marcha y que hoy pregunta casi lo
  mismo que R-016 y R-022.
