title: R-028 requiere más investigación H-039
finding_text: La reactivación concentra firmas de momento de cobro; la contracción no
why: 'R-028 repite el 44% (F-182) como «vuelve a pagar al mes siguiente», sin decir con qué monto. H-039 lo usa
  como «vuelve con el mismo monto» (DM-4), y la definición de DM-4 no está en el estado.


  En MRR, volver al monto usual pesa 11,5% de la reactivación y liquidar el hueco pesa 42,6% (F-180). Es decir,
  al volver domina la liquidación (H-034), no el mismo monto. Parte de esa diferencia es mecánica, porque el pago
  que liquida es más grande; falta verlo en conteo. Si el 44% mezcla ambos casos, la premisa de H-039 exagera el
  tamaño de su fenómeno.


  Sobre el mecanismo, R-028 no separa un desfase con la suscripción vigente de una pausa o de una baja con regreso
  al mismo precio. F-183 dice «consistente con pausas y atrasos» y F-186 confirma que no hay estado de suscripción.'
options:
- key: A
  label: Separar el 44% por firma
  consequence: Con los pagos actuales se separa el 44% en mismo monto, liquidación del hueco y otro monto, en conteo
    y en MRR. Dice cuánto pesa de verdad H-039 y si su premisa está bien etiquetada. Es un corte chico.
- key: B
  label: Reformular H-039 sin el 44%
  consequence: Quedaría como «los regresos al mes siguiente con el mismo monto son desfase del cobro», con su peso
    como pregunta abierta. Evita arrastrar una cifra quizá mal etiquetada, pero H-039 se queda sin tamaño.
- key: C
  label: Fusionar H-039 con H-034
  consequence: 'Una sola hipótesis de «volver al mes siguiente = cobro, no baja», con dos firmas: mismo monto y
    liquidación. Hay menos hipótesis solapadas, pero desfase vs pausa sigue sin datos (F-186).'
recommended: A
recommended_why: 'Es barato y decide con datos entre B y C: si el mismo monto pesa poco, conviene C; si pesa mucho,
  H-039 se sostiene sola con la cifra bien etiquetada.'
