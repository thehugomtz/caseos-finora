title: R-024 debilita H-029
finding_text: 'Los artefactos quedan acotados: el estancamiento de altas sigue siendo señal contrastable'
why: 'La parte de «octubre-24 incompleto» pierde apoyo. Frente a sep-24, en oct-24 suben los clientes activos (1.678
  contra 1.645, F-194) y el MRR pagado (COP 97,0 contra 92,7 millones, F-195). Si faltaran pagos se vería lo contrario:
  activos y MRR abajo y un pico de salidas.


  Cuenta directa mía, no medida en R-024: las 33 salidas de oct-24 (F-198) son ≈2,0% de los activos de sep-24, en
  línea con el churn observado de 2024 (F-175; ver X-101).


  Ojo con F-195: las 1.961 filas no prueban que el mes esté completo, porque el panel tiene esas filas en todos
  los meses (X-031).


  Lo que no cubre:

  - R-024 compara promedios anuales (2024 sin octubre, 56, contra 2023 completo, 54; F-196), no el tramo del −19%
  de jul–oct 2024 (R-025).

  - La otra explicación, más tiempo entre Won y primer pago, no se puede evaluar: no hay fechas de Won (F-202).'
options:
- key: A
  label: Acotar H-029 a la explicación del rezago Won → primer pago
  consequence: Octubre incompleto queda debilitado. El −19% se lee como señal del último tramo, con la salvedad
    de un rezago que solo el CRM resuelve.
- key: B
  label: Correr antes el corte que le falta a Q-036
  consequence: 'Con el panel actual: jul–sep 2024 contra jul–sep 2023, y salidas de oct-24 contra el promedio de
    2024. Dice si el −19% sobrevive sin octubre y con qué cifra se escribe A.'
- key: C
  label: Dejar H-029 igual hasta tener fechas de Won
  consequence: 'El último tramo queda en el limbo: Growth no puede decir si la baja reciente es una señal o un efecto
    del cierre de la serie.'
recommended: B
recommended_why: R-024 contesta la mitad de Q-036. La otra mitad es un corte barato y define cómo se redacta A.
