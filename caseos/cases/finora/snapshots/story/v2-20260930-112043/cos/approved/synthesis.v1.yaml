phase: synthesis
version: 1
approved_at: '2026-09-29T20:45:34-06:00'
research: []
findings:
- id: F-114
  headline: Entre 2022 y 2024 la mediana del ticket de entrada baja en 6 industrias y el promedio baja en 6 industrias.
- id: F-102
  headline: 'Medido por la mediana, quienes hacen churn no pagaban más: la razón de medianas es 1,00 en 2022, 0,97
    en 2023 y 1,11 en 2024, con intervalos que van de 0,97 a 1,15 en el total, de modo que la diferencia de promedios
    se concentra en pocas cuentas grandes.'
- id: F-155
  headline: Entre Executive, Self Service y Hybrid solo se compara del nudo hacia la derecha. Antes del nudo, cada
    funnel tiene su propia unidad, sus etapas y sus tiempos, y sus tasas no se comparan ni se promedian.
- id: F-207
  headline: 'El gasto y los primeros pagadores se mueven en sentido contrario en los dos semestres: el gasto no
    sirve como proxy de capacidad ni de leads'
- id: F-196
  headline: Excluyendo oct-24, las altas por mes de 2024 son 56 frente a 54 en 2023; incluyendo oct-24 son 55.
- id: F-180
  headline: Del MRR de reactivación de la ventana limpia, la parte que regresa al monto usual explica 11,5% y la
    parte que llega con un monto que cubre los meses del hueco más el corriente explica 42,6%; el resto, 45,9%,
    no encaja en esas firmas de momento de cobro.
- id: F-092
  headline: Entre dic-22 y oct-24 el MRR por cliente activo pasa de COP 89,5 mil a COP 57,8 mil, y la composición
    de cosechas explica −COP 26,6 mil del cambio frente a −COP 5,2 mil del efecto dentro de las cosechas; el MRR
    por cliente de la base previa pasa de COP 97,0 mil a COP 97,4 mil.
- id: F-138
  headline: El LTV con margen y el UCM están en rojo (necesitan margen bruto o costo de servir). Lo que se puede
    defender hoy es un «LTV empírico de ingreso» a horizonte fijo por cohorte.
- id: F-211
  headline: 'Reactivate funciona como loop sobre episodios estancados, no como cuarta ruta: conserva fecha y puerta,
    y el primer pago cuenta una sola vez en su ruta, con bandera.'
- id: F-231
  headline: 'Capacidad (H-006), estancamiento (H-055) e incentivos del SDR (H-054) no compiten por la misma brecha
    si se miden por su firma: tiempo a primer toque y carga; bolsa de estancados y compra de los retomados; aceptación
    del AE según el origen del SQL.'
- id: F-118
  headline: La correlación en niveles entre el S&M total y las altas del mismo mes es −0,57; en cambios mes a mes
    el mayor valor absoluto observado es 0,27 con un valor p mínimo de 0,14, y de 48 pruebas de correlación 9 resultan
    significativas, todas ellas negativas en niveles con las altas.
- id: F-227
  headline: Valor y calidad por ruta son lo que le importa al CFO, y hoy solo existen agregados.
- id: F-159
  headline: Hoy no se puede calcular ninguna métrica por motion ni nada anterior al pago. Además, probar las palancas
    de H-006 y H-028 requiere un experimento.
- id: F-122
  headline: 'La comparación que separa es mezcla vs. tasa por grupo de entrada: la mezcla de ajuste habla de H-005;
    la tasa dentro de cada banda, si cae sobre todo en entradas lentas y en semanas de alta carga, habla de H-006.'
- id: F-030
  headline: El aumento de altas por mes entre 2022 y 2024 corresponde a clientes con run-rate inicial menor que
    la mediana de 2022; por encima de esa mediana, las altas por mes no aumentaron.
- id: F-175
  headline: El churn observado pasó de 3,52% en 2022 a 2,04% en 2024, mientras el churn que no vuelve a pagar en
    el plazo de seguimiento pasó de 0,98% a 0,96%.
- id: F-163
  headline: La mediana del monto usual temprano de las altas es menor en 2024 que en 2022 en Producción (COP 55,1
    mil a COP 37,8 mil), Restaurantes (COP 62,0 mil a COP 48,3 mil), Retail (COP 35,7 mil a COP 25,2 mil), Salud
    (COP 63,0 mil a COP 48,8 mil), Servicios profesionales (COP 63,0 mil a COP 31,5 mil) y Tecnología (COP 63,0
    mil a COP 44,1 mil).
- id: F-071
  headline: Medidos de punta a punta entre ene-22 y oct-24 sobre la ventana completa, los clientes activos pasan
    de 377 a 1.678 (índice 445 en base ene-22) y el MRR pagado de COP 35,0 millones a COP 97,0 millones (índice
    277), lo que coincide con los múltiplos 4,5× y 2,8× publicados en el Overview.
- id: F-134
  headline: La huella de un descuento temporal limpio casi no aparece en el histórico (34 de 1.247 contracciones).
    Eso es consistente con que los descuentos sean algo por introducir, pero no prueba que no existieran.
- id: F-070
  headline: Habilitación pesa 12% del S&M total en 2022 y 4% en 2024, y el gasto por alta baja de 0,11 a 0,04 incluyéndola
    y de 0,09 a 0,03 excluyéndola.
- id: F-135
  headline: 'En verde (se puede calcular hoy, con nombre honesto): MRR pagado observado y su puente, clientes activos,
    ARPA por cliente, churn observado, NRR/GRR de la base y métricas de cohorte.'
- id: F-162
  headline: 'La caída del ticket de entrada entre las cohortes 2022 y 2023 se observa también con el ticket estabilizado:
    la mediana del segundo pago pasa de COP 52,5 mil a COP 36,8 mil y la del monto usual temprano de COP 60,9 mil
    a COP 36,8 mil, mientras la mediana del primer pago pasa de COP 63,0 mil a COP 36,8 mil.'
- id: F-174
  headline: 'El puente actual no separa una baja definitiva de una interrupción temporal: 44% de los churns observados
    vuelve a pagar al mes siguiente y 32% de los retornos después de meses sin pago liquidan exactamente los meses
    pendientes.'
- id: F-066
  headline: 'El archivo se comporta como una asignación de arriba hacia abajo en su primer tramo: Team equivale
    a 12% del S&M total en 17 meses hasta may-23, y desde jun-23 su participación se mueve entre 19% y 38% con 17
    valores distintos en 17 meses.'
- id: F-158
  headline: Las tasas se miden por cohorte con una ventana fija por motion, y los resultados comunes por cohorte
    de primer pago a M3/M6/M12. Así se separa un retraso (HC3a) de una brecha persistente (HC3b), y un cambio de
    mezcla no parece un cambio de desempeño.
- id: F-226
  headline: Reactivate (leads estancados) y la reactivación del puente de MRR (clientes que vuelven a pagar) son
    poblaciones distintas y hay que medirlas por separado.
- id: F-119
  headline: 'El paso de asociación a efecto entre el gasto de S&M por categoría y los primeros pagos observados
    no es evaluable con estos datos: no hay etapas del funnel con fechas ni fuente del lead que liguen el gasto
    de un mes con clientes concretos, y la unidad del gasto no está documentada.'
- id: F-230
  headline: Con el modelo actual no se puede validar ni descartar ninguna hoja de las ramas 1 a 4, y de H-057 solo
    se ve el arranque.
- id: F-210
  headline: 'Q-063: propongo que solo cuente como intervención la interacción de ida y vuelta con SDR/AE. El formulario
    de «hablar con ventas» es la entrada, no un tramo sin persona.'
- id: F-093
  headline: 'No es posible separar en los pagos un precio de lista, un descuento introductorio, un crédito o una
    pausa de suscripción: el dato disponible es el monto observado por cliente y mes, sin catálogo de precios ni
    definición documentada de lo que ese monto representa.'
- id: F-139
  headline: 'El «ARPU» de hoy es en realidad ARPA (por cliente, no por usuario), y su caída total mezcla cohortes:
    hay que reportarlo por cohorte y medir el ARPA de entrada con un monto estabilizado (M1 o monto usual), no con
    el primer pago.'
- id: F-197
  headline: Entre mar-22 y oct-24 las altas corresponden a 1.476 clientes distintos, con 0 meses-cliente marcados
    a la vez como alta y reactivación y 0 altas con un pago anterior registrado; las reactivaciones suman 468 eventos
    en un flujo aparte.
- id: F-178
  headline: 'Lo que sí se observa es composición, no beneficio comercial: el MRR por cliente activo pasó de COP
    92,8 mil en ene-22 a COP 57,8 mil en oct-24 (−38%), mientras el de la base previa cambió +5% y las cosechas
    2023–24 ya concentran 65% de los clientes activos en oct-24.'
- id: F-154
  headline: El descuento cambia la composición de las cohortes. La evidencia externa asocia la adquisición con descuento
    a clientes de menor valor, y el churn al vencer el descuento tiene otras causas posibles; Finora tendría que
    marcar esas cohortes y medir contra un grupo de control.
- id: F-103
  headline: En 2024 el churn observado por industria va de 1,46 en Restaurantes a 2,57 en Tecnología, y medido solo
    por churns que no vuelven a pagar en un trimestre va de 0,56 en Salud a 1,33 en Retail (puntos porcentuales
    mensuales).
- id: F-115
  headline: Team equivale a una participación exactamente constante del S&M total en 17 meses consecutivos hasta
    may-23.
- id: F-149
  headline: Los agentes de IA y la atribución van encima, no en la base. Los agentes deben trabajar solo sobre métricas
    gobernadas y entrar con un piloto controlado. La atribución reparte crédito; para decidir presupuesto hacen
    falta experimentos.
- id: F-237
  headline: 'Negociación, retención y partner necesitan registro propio, y hay dos trampas: el precio especial que
    esconde un descuento y el downgrade de retención.'
- id: F-221
  headline: Por ventana, las altas por mes van de 27,2 en 2022 mar-dic a 55,4 en 2024 ene-oct, y el S&M por alta
    va de 0,11 a 0,04 en unidad reportada, con su valor menor en 2023 jun-dic (0,02).
- id: F-108
  headline: El S&M total por alta es 0,105 u en 2022 y 0,036 u en 2024, un cambio de −66%, y el S&M total pasa de
    3,45 u en may-23 a 1,10 u en ago-23.
- id: F-124
  headline: Lo que el modelo sí dice sobre los compradores no permite elegir entre H-005 y H-006.
- id: F-020
  headline: El MRR por cliente activo bajó en las seis industrias entre dic-22 y oct-24.
- id: F-165
  headline: 'Salud es la excepción en el tramo 2022→2023: su mediana del monto usual temprano es COP 63,0 mil en
    2022 y COP 63,0 mil en 2023, mientras su promedio pasa de COP 62,5 mil a COP 67,0 mil; el descenso de esa industria
    aparece solo en 2024 (COP 48,8 mil).'
- id: F-132
  headline: No hay una convención única de mercado para el descuento en el MRR, y la convención «solo neto» borra
    justo las distinciones que pide el CFO. El modelo debe guardar bruto, descuento y neto por separado; la convención
    oficial queda como decisión.
- id: F-145
  headline: El lado Revenue ya se puede operar mes a mes, pero con pagos observados el CRO confundiría el momento
    del cobro con churn y expansión. La facturación es la primera pieza técnica.
- id: F-104
  headline: 'Salud combina el menor churn persistente (0,56 puntos porcentuales mensuales), el mayor ticket de entrada
    mediano de 2024 (COP 52,5 mil, igualado con Restaurantes) y el menor volumen: 124 clientes activos en oct-24
    frente a 459 en Restaurantes.'
- id: F-153
  headline: Con descuentos temporales, el MRR neto, el revenue reconocido y la caja pueden separarse. Cuál vista
    aplica depende de si los contratos de Finora son mensuales cancelables o a plazo fijo.
- id: F-128
  headline: H-005, H-006 y H-007 necesitan datos que suelen estar en un CRM, pero no siempre con su historia. La
    evidencia externa hace plausible H-006, pero no la prueba para Finora.
- id: F-201
  headline: En 2023 y en 2024 (ene–oct) las reactivaciones por mes son 12 y 16 frente a 54 y 55 altas por mes, de
    modo que sumarlas o separarlas deja ambos periodos en el mismo orden.
- id: F-190
  headline: El único nudo común que se puede medir hoy es el primer pago. Won solo existe en las puertas con vendedor,
    y cambiar el nudo a «sigue pagando en M1» mueve poco el conteo.
- id: F-186
  headline: 'El puente normalizado exacto que pide repartir un pago entre los meses que cubre no es medible con
    los datos disponibles: no hay definición del campo de monto ni estado de la suscripción ni periodo devengado
    por pago, de modo que el reparto solo puede acotarse con firmas de reversión y de liquidación de atrasos.'
- id: F-240
  headline: 'El to-be de la hipótesis de trabajo se sostiene con patrones estándar, con tres ajustes: espina de
    identidad, puerta separada de ruta, y suscripción dividida en contratado, descontado, facturado y cobrado.'
- id: F-094
  headline: Entre dic-22 y oct-24 el MRR por cliente activo cae −46,6% en Servicios profesionales, −45,6% en Restaurantes
    y −43,1% en Retail, frente a −18,8% en Producción, −15,5% en Tecnología y −14,4% en Salud.
- id: F-217
  headline: En la composición del S&M, la generación de demanda va de 64% en 2022 S1 a 58% en 2024 jul-oct, la capacidad
    comercial de 26% a 38% y la habilitación de 10% a 4%.
- id: F-241
  headline: Seis reglas del modelo son decisiones de negocio, no hechos, y tienen que quedar escritas antes de construir.
- id: F-168
  headline: 'El puente por capas del enunciado —MRR de lista, descuento y MRR neto— no es construible con los datos
    disponibles: el panel cliente-mes registra un solo monto por cliente y mes, sin precio de lista, plan, descuento
    ni crédito, y sin definición documentada de qué representa ese monto.'
- id: F-191
  headline: Hoy no se puede medir ninguna etapa antes del primer pago, ni la puerta. La prueba más rápida es que
    Finora etiquete hacia atrás, desde el CRM, a los pagadores 2022–2024.
- id: F-129
  headline: Para H-008 no alcanzan las razones de pérdida del CRM. Además hay una señal lateral que amerita una
    pregunta concreta sobre precio o condiciones en 2024.
- id: F-083
  headline: El primer pago observado de las altas tiene una mediana de COP 63,0 mil en 2022, COP 36,8 mil en 2023
    y COP 42,0 mil en 2024, con un rango intercuartílico en 2024 entre COP 25,2 mil y COP 60,9 mil.
- id: F-152
  headline: Para no perder el porqué del MRR, cada descuento tiene que registrarse como objeto propio con fecha
    de fin, separado de la cantidad y del precio de lista, y leerse desde la factura. Hay cinco trampas concretas
    que evitar.
- id: F-105
  headline: Salud y Tecnología son también las industrias con menor caída del MRR por cliente entre dic-22 y oct-24
    (−14,4% y −15,5%) y aportan 11,7% y 17,0% del crecimiento del MRR, con 124 y 206 clientes activos en oct-24.
- id: F-113
  headline: Entre 2022 y 2024 las altas por mes cambian +104% mientras el valor inicial incorporado por mes cambia
    +6% medido por run-rate temprano y +17% medido por monto habitual.
- id: F-056
  headline: Entre ene-22 y oct-24 el MRR por cliente activo pasó de COP 92,8 mil a COP 57,8 mil, y la descomposición
    por cosecha asigna a la composición de entrada 108% del cambio y al efecto dentro de las cosechas −8%.
- id: F-144
  headline: 'Para medir el lado izquierdo hay que instrumentar en origen: fechas por etapa en el CRM, puerta y canal
    por cuenta, y gasto por canal. Aun así, la atribución reparte crédito, no prueba causa.'
- id: F-001
  headline: Los clientes activos crecieron más rápido que el MRR pagado entre ene-22 y oct-24.
- id: F-076
  headline: En oct-24 las cosechas 2023 y 2024 reúnen 65% de los clientes activos y 50% del MRR, con MRR por cliente
    de COP 46,3 mil y COP 43,0 mil, frente a COP 97,4 mil de los clientes activos en ene-22, que conservan 17,8%
    de los clientes activos.
- id: F-133
  headline: Se sabe qué forma tiene la evidencia que confirmaría cada componente; lo que no se sabe es si Finora
    la tiene.
- id: F-099
  headline: 'El ticket de entrada mediano de 2024 en Retail (COP 26,2 mil) y en Servicios profesionales (COP 31,5
    mil) queda por debajo del de Salud (COP 52,5 mil) y Restaurantes (COP 52,5 mil), mientras Retail suma 360 clientes
    activos en oct-24 frente a 124 en Salud: el volumen incorporado se asocia con el menor ticket mediano.'
- id: F-164
  headline: Medido con el monto usual temprano, el efecto dentro de las industrias explica 91% del cambio del ticket
    de entrada 2022→2023 y 96% del cambio 2022→2024, frente a 9% y 4% del mix de industrias; el límite inferior
    del intervalo bootstrap del efecto dentro es 84% y 90%.
- id: F-037
  headline: El valor inicial incorporado por mes creció menos que las altas entre 2022 y 2024 en las tres normalizaciones
    probadas, y entre 2023 y 2024 cambió menos de 10% en todas.
- id: F-172
  headline: 'Parte del movimiento del puente no corresponde a un cambio sostenido de nivel: 29% del MRR de expansión
    se revierte al mes siguiente y 25,3% del movimiento bruto del monto pagado sin altas vuelve exacto al nivel
    previo.'
- id: F-125
  headline: 'La premisa «no más ventas» depende de la ventana: con los pagos se sostiene en jul–oct 2024, pero no
    en mar–oct.'
- id: F-220
  headline: Con un mes de rezago, el mes de mayor S&M (oct-22, 3,75) precede a 19 altas, mientras el mes de menor
    S&M (ago-23, 1,10) precede a 56 altas.
- id: F-236
  headline: 'Cómo pega un descuento en el MRR es una convención, no un hecho: C-020 se sostiene, pero se aparta
    del default del mercado y hay que declararla.'
- id: F-148
  headline: 'La operación recurrente se sostiene con el historial de etapas del CRM (viene de forma nativa) y un
    tablero por foro: el semanal decide oportunidades, el mensual la mezcla de motion y canal, el trimestral la
    inversión y la capacidad.'
- id: F-130
  headline: 'El monto pagado no identifica los componentes: con los campos actuales no se puede separar suscripción,
    tarifa, descuento ni momento de cobro.'
- id: F-075
  headline: Entre ene-22 y oct-24 el cambio del MRR por cliente activo de −COP 35,0 mil se reparte entre composición
    de la base, que explica 108% del cambio, y el efecto dentro de las cosechas, que explica −8%; el MRR por cliente
    de los clientes activos en ene-22 pasa de COP 92,8 mil a COP 97,4 mil.
- id: F-219
  headline: 'En niveles mensuales, el S&M total se asocia negativamente con las altas: −0,57 en el mismo mes sobre
    32 meses y −0,55 con un mes de rezago sobre 31 meses.'
- id: F-188
  headline: La puerta se asigna al abrir el episodio, con información previa al contacto, y no se cambia. Lo que
    pasa después (contacto humano, escalamiento) se registra aparte.
- id: F-022
  headline: El S&M total por cliente nuevo es más de 50% menor en 2024 que en 2022.
- id: F-126
  headline: Con el modelo actual no se puede validar ni descartar ninguna de H-001 a H-008. El gasto sube mientras
    las altas bajan, pero eso no dice nada de los leads.
- id: F-063
  headline: 'El archivo de gasto de S&M reporta cada rubro en unidades reportadas (u) sin factor de escala: el S&M
    total va de 1,10 u en su valle de ago-23 a 3,45 u en su pico de may-23, magnitudes que no se pueden leer como
    COP.'
- id: F-223
  headline: 'Hoy no se puede medir ningún funnel antes del primer pago: el modelo no tiene leads, etapas, dueños,
    canal ni ruta.'
- id: F-059
  headline: Con base dic-22, el efecto dentro de las cosechas aporta −COP 5,2 mil del cambio del MRR por cliente
    activo (16% del total), concentrado en la cosecha 2022 (−COP 3,7 mil) y en las altas de feb-22 (−COP 1,6 mil).
- id: F-235
  headline: 'El source no puede vivir solo en el descuento: hay que capturarlo en la adquisición de todos los clientes
    y guardar aparte el canal asignado al código.'
- id: F-096
  headline: 'La caída del MRR por cliente activo no se concentra en una industria: bajó en las 6 industrias entre
    dic-22 y oct-24, y el ticket de entrada promedio y mediano bajó también en las 6 industrias entre 2022 y 2024.'
- id: F-079
  headline: El churn mensual observado de logos baja de 3,5% en 2022 a 1,9% en 2024, mientras el churn que no vuelve
    a pagar en un plazo de un trimestre pasa de 0,98% a 0,96%, y 44% de los churns observados vuelve a pagar al
    mes siguiente.
- id: F-242
  headline: 'Lo que no se capture desde ya no se reconstruye después: el to-be mide hacia adelante, salvo que Finora
    tenga historial en sus sistemas.'
- id: F-184
  headline: 'La contracción observada no muestra la firma de momento de cobro: la parte que regresa al nivel previo
    a la baja al mes siguiente explica 4,0% del MRR de contracción, mientras la parte que al mes siguiente sigue
    igual o más abajo explica 88,9%.'
- id: F-192
  headline: Las altas por mes pasan de 27 en 2022 (mar–dic) a 54 en 2023 y 55 en 2024 (ene–oct).
- id: F-203
  headline: En 2023, 175 de 650 altas coinciden en monto exacto e industria con el último pago de un churn reciente,
    frente a 196 altas bajo un emparejamiento placebo con churns muy posteriores; en 2022 (mar–dic) las cifras son
    76 de 272 contra 68.
- id: F-151
  headline: 'No hay un estándar para tratar los descuentos temporales en el MRR: es una decisión de definición que
    el CFO tiene que tomar y declarar. Para Finora, lo más útil es mostrar las dos capas (lista y neto).'
- id: F-239
  headline: 'Incluso después del pago, el as-is no separa estados que C-009 necesita: cancelación vs mora, prepago
    vs expansión, y plan vs precio vs descuento.'
- id: F-110
  headline: Las altas mensuales pasan de 26 en dic-22 a 60 en ene-23 y el punto más alto del periodo se observa
    en jun-24 con 84.
- id: F-002
  headline: El MRR por cliente activo de oct-24 es más de 30% menor que el de ene-22.
- id: F-147
  headline: 'Los marcos coinciden: medir volumen, alcance y tiempo por hito en cada motion y unirlos en resultados
    económicos comunes. Un bowtie por motion (Self Service, Assisted, Executive/KAM) evita la tasa mezclada.'
- id: F-146
  headline: El lado Growth no existe en los datos. Sin motion, canal ni fechas de hitos no se puede calcular ninguna
    conversión ni CAC por motion; hoy solo se ve la mezcla de gasto.
- id: F-238
  headline: 'El as-is es un modelo de «después del pago»: tres fuentes con tres granos (cliente × mes, cliente,
    mes) y ninguna mira antes del primer pago.'
- id: F-107
  headline: En 2023 jun-dic las altas por mes son 60,6 frente a 45,2 en 2023 ene-may, mientras el gasto de generación
    de demanda por mes baja de 1,73 u a 0,82 u y el S&M total por mes de 3,01 u a 1,44 u.
- id: F-150
  headline: Ninguna de las herramientas revisadas separa el efecto de un descuento del de un cambio de suscripción.
    Usadas tal cual, el fin de un descuento aparecería como expansión y el caso 100→130 con −30 aparecería como
    «sin cambio».
- id: F-081
  headline: El gasto comercial por alta es menor en 2024 que en 2022 (0,105 u frente a 0,036 u en la unidad reportada,
    un cambio de −66%), y la correlación en niveles entre el gasto total y las altas del mismo mes es −0,57.
- id: F-202
  headline: 'No es posible verificar si un cliente nuevo corresponde a un negocio que ya pagaba bajo otro identificador:
    el panel solo trae identificador de cliente, industria, mes y monto, sin estado de suscripción, fuente del lead
    ni motivo de salida.'
- id: F-193
  headline: Desde ene-23 la pendiente de las altas por mes es +0,47 por mes, con un intervalo de confianza entre
    −0,40 y +1,33 que contiene cero.
- id: F-039
  headline: Las altas por mes se duplicaron con un escalón a inicios de 2023 y desde ene-23 no muestran una tendencia
    distinguible de cero.
- id: F-185
  headline: 'Hay reversión de calendario en el puente, pero fuera de la contracción: 25,3% del movimiento bruto
    del monto pagado sin altas vuelve exacto al nivel previo al mes siguiente y 29% del MRR de expansión se revierte
    al mes siguiente.'
- id: F-097
  headline: Entre dic-22 y oct-24 el MRR por cliente activo cambia −COP 31,7 mil (−35%), de lo cual la composición
    de cosechas explica −COP 26,6 mil (84%) y el efecto dentro de las cosechas −COP 5,2 mil; las cosechas 2023 y
    2024 son 65% de los clientes activos y 50% del MRR en oct-24.
- id: F-214
  headline: Entre 2023 ene-may y 2023 jun-dic el S&M por mes pasó de 3,01 a 1,44 en unidad reportada, mientras las
    altas por mes pasaron de 45,2 a 60,6.
- id: F-234
  headline: 'Los sistemas de billing separan tres cosas que el to-be también debe separar: la oferta, el código
    que la distribuye y el descuento aplicado con vigencia.'
- id: F-058
  headline: El MRR por cliente de la base previa en oct-24 (COP 97,4 mil) se ubica por encima del de ene-22 (COP
    92,8 mil), una variación de +5%, y el efecto dentro de las cosechas aporta COP 2,7 mil del cambio del MRR por
    cliente activo.
- id: F-019
  headline: Los clientes existentes no pagan menos y las cosechas 2023–24, de menor ticket, ya son la mayoría de
    los clientes activos.
- id: F-127
  headline: 'Dos tipos de dato bastan para distinguir 4 de las 8 hipótesis (H-001, H-002, H-003, H-004): las entradas
    únicas con fecha (con canal, motion y segmento) y el vínculo con pago. Son justamente las que convertirían «más
    leads» en un artefacto.'
- id: F-166
  headline: En la cohorte 2022 el primer pago promedio (COP 128,7 mil) supera al pago promedio del segundo mes (COP
    59,0 mil) y la razón entre la mediana de M1 y la mediana de M0 es 0,83; esa brecha desaparece en las cohortes
    siguientes, con razón 1,00 en 2023 y 0,93 en 2024, patrón consistente con pagos iniciales grandes y cobros retroactivos
    más que con un cambio de tarifa.
- id: F-023
  headline: Las correlaciones en niveles entre gasto y altas (rezagos 0–1) son todas negativas, y ninguna correlación
    de cambios mes a mes alcanza |r| ≥ 0,3 ni p < 0,05.
- id: F-074
  headline: 'Las cifras de titular del Overview se apoyan en métricas de stock de ventana completa: ene-22 existe
    como mes base con 377 clientes activos, COP 35,0 millones de MRR pagado y COP 92,8 mil por cliente activo; en
    cambio las métricas de flujo se miden desde mar-22, con 272 altas registradas en 2022 (mar–dic).'
- id: F-213
  headline: Con los datos de hoy solo se miden el nudo y la vuelta de pagadores. Esa vuelta es un loop de Revenue,
    en parte es timing de pago, y no debe llamarse Reactivate.
- id: F-182
  headline: 'Los retornos de pago coinciden con interrupciones cortas y con liquidación de atrasos: 44% de los churns
    observados vuelve a pagar al mes siguiente y 32% de los retornos tras meses sin pago liquida exactamente los
    meses pendientes.'
- id: F-205
  headline: Tres artefactos del lado de pagos no alcanzan para explicar la caída de jul–oct 2024
- id: F-086
  headline: Entre las altas de ventana limpia, la parte cuyo primer pago supera con holgura su segundo pago es 23,2%
    en 2022, 7,1% en 2023 y 11,6% en 2024, mientras la parte cuyo segundo pago supera con holgura al primero es
    1,1%, 1,5% y 0,9% en los mismos años.
- id: F-069
  headline: 'El peso de Habilitación en el S&M total no es estable: pasa de 12% en 2022 a 7% en 2023 y 4% en 2024,
    por lo que el nivel del gasto por alta depende de si el rubro se cuenta como comercial.'
- id: F-229
  headline: 'Antes del árbol hay que fijar qué es «venta» y qué ventana se compara: en los pagos, la respuesta cambia
    según la unidad y el trimestre.'
- id: F-045
  headline: 'El volumen de primeras apariciones y el valor inicial que incorporan no se mueven a la misma velocidad:
    entre 2022 y 2024 las altas por mes cambiaron +104% frente a +6%, +17% y +60% del valor inicial incorporado
    por mes según la normalización usada, y el MRR nuevo por mes pasó de COP 3,5 millones a COP 2,8 millones.'
- id: F-141
  headline: La conversión que sirve es por cohorte de entrada, con ventana fija y solo en cohortes que ya la cumplieron.
    La tasa de período y el promedio de solo los que convirtieron castigan a las entradas recientes, y ese es justo
    el test de H-003.
- id: F-136
  headline: 'El monto pagado mezcla fecha de cobro con mes de servicio: los atrasos y los pagos multimes inflan
    el churn, la reactivación y la expansión observados. Antes de llamarlos churn o MRR hace falta una regla de
    normalización y una ventana de gracia.'
- id: F-161
  headline: 'El ticket estabilizado no continúa bajando después de 2023: la mediana del segundo pago de las altas
    de 2024 (COP 38,9 mil) es mayor que la de 2023 (COP 36,8 mil) y la mediana del monto usual temprano pasa de
    COP 36,8 mil a COP 37,8 mil.'
- id: F-024
  headline: Toda correlación con p < 0,05 es una correlación negativa en niveles con las altas.
- id: F-177
  headline: 'No se puede asignar la caída del MRR por cliente activo entre un precio de lista distinto y un descuento
    aplicado: sin precios ni descuentos registrados, el caso de lista mayor con descuento vigente y el caso de precio
    neto menor coinciden en el mismo monto observado.'
- id: F-120
  headline: 'Con el modelo actual no se puede separar H-005 de H-006: faltan las entradas, los reps y los tiempos
    de contacto.'
- id: F-065
  headline: Todos los rubros del archivo de S&M cubren los mismos 34 meses de ene-22 a oct-24 sin valores ausentes,
    pero Freelance queda en cero en 17 de esos meses y PayrollExpenses toma valor negativo en 5.
- id: F-209
  headline: 'Regla MECE que respeta las definiciones de Hugo: la ruta sale de quién movió cada tramo, y la puerta
    de entrada queda aparte, fija al entrar.'
- id: F-225
  headline: Para medir velocidad y estancamiento hacen falta fechas de entrada y salida por etapa y la fecha de
    última actividad. El umbral de estancamiento se calibra por etapa y se acuerda con Finora (Q-064).
- id: F-233
  headline: 'Hoy el modelo no puede separar un descuento de una contracción, un pago multi-mes o un mes sin cobro:
    solo hay cliente × mes × monto.'
- id: F-232
  headline: 'Calidad al entrar (H-005), decisión en Proposal (H-056) y misma demanda por otra puerta (H-053) solo
    se prueban con datos que no dependan de lo que Sales opine después: señales congeladas al crear el lead, motivos
    validados con compradores y cruce de identidad con el producto.'
- id: F-224
  headline: La única comparación válida entre rutas es por puerta, con cohorte y ventana fija. La ruta se clasifica
    al final con una regla por eventos, y las métricas de etapa se leen dentro de cada ruta.
- id: F-121
  headline: 'El dato mínimo son dos tablas: entradas con el ajuste congelado al entrar y el primer contacto humano,
    y un roster semanal de SDR/AE con su ramp.'
- id: F-033
  headline: El churn observado bajó más de un punto entre 2022 y 2024, mientras el churn que no vuelve a pagar en
    tres meses cambió menos de 0,3 puntos.
- id: F-199
  headline: De los 751 eventos de churn observado entre mar-22 y oct-24, 44% vuelve a pagar al mes siguiente bajo
    el mismo identificador de cliente, y esos retornos se registran en el flujo de reactivaciones.
- id: F-160
  headline: En cohortes de ventana limpia, la mediana del segundo pago (M1) de las altas es COP 52,5 mil en 2022,
    COP 36,8 mil en 2023 y COP 38,9 mil en 2024, y la mediana del monto usual temprano (M0–M2) pasa de COP 60,9
    mil en 2022 a COP 36,8 mil en 2023 y COP 37,8 mil en 2024.
- id: F-137
  headline: 'El CAC solo existe como «S&M por alta en unidades reportadas»: sin la unidad del gasto no hay CAC en
    COP, ni payback, ni LTV:CAC, y sin motion o canal no hay CAC por Self Service/Assisted/Executive ni por Digital/KAM.'
- id: F-072
  headline: El MRR por cliente activo, definido como MRR pagado dividido entre los clientes con pago mayor que cero
    en el mes y expresado en COP tras aplicar la escala fija del campo amount, pasa de COP 92,8 mil en ene-22 a
    COP 57,8 mil en oct-24, una variación de −38%.
- id: F-140
  headline: 'No es un funnel: son tres puertas con hitos propios que llegan a un nudo común (primer pago) y a un
    lado derecho común. AAARRR sirve como vocabulario, no como secuencia.'
- id: F-101
  headline: 'Quienes hacen churn pagaban en promedio más que el cliente activo del mes previo: la razón de medias
    es 1,70 en 2022, 1,58 en 2023 y 1,37 en 2024, con límites inferiores del intervalo bootstrap de 1,26, 1,18 e
    1,10.'
- id: F-228
  headline: El árbol queda MECE si la brecha se reparte en orden por identidad —validez del lead → puerta (motion)
    → mezcla vs tasa → etapa → cobro—, así cada pedazo de caída cae en una sola hoja.
- id: F-087
  headline: Entre las altas de ventana limpia, el segundo pago coincide exactamente con el primero en 73,5% de las
    altas de 2022, 90,3% de 2023 y 77,3% de 2024.
- id: F-068
  headline: 'No es posible decidir con los datos si SoftwareTools y Freelance corresponden a habilitación comercial
    o a gasto de producto: el archivo solo trae el nombre del rubro y su monto mensual, sin centro de costo, proveedor
    ni atribución funcional; agruparlos en Habilitación es una convención del catálogo de métricas.'
- id: F-204
  headline: 'En pagos, el problema aparece en jul–oct 2024, no en todo el año: hay que fijar el periodo antes de
    buscar causas'
- id: F-183
  headline: 'El churn observado bajó entre 2022 y 2024 mientras el churn que no vuelve a pagar en el trimestre siguiente
    se mantuvo: pasó de 3,52% a 2,04% el observado y de 0,98% a 0,96% el que no vuelve.'
- id: F-212
  headline: 'Las tasas se comparan entre puertas, que son fijas al entrar, no entre rutas: la ruta se define por
    lo que pasó, y eso sesga por construcción la conversión de Hybrid (H-050).'
