id: F-140
type: finding
headline: 'No es un funnel: son tres puertas con hitos propios que llegan a un nudo común (primer pago) y a un lado
  derecho común. AAARRR sirve como vocabulario, no como secuencia.'
evidence_text: Winning by Design mide cada tramo con volumen, conversión y tiempo, y trata adquisición, retención
  y expansión como un solo sistema, con hasta tres motions por línea de negocio. Forrester reporta que en procesos
  centrados en MQL menos del 1% de las consultas termina en venta ganada, y que más del 80% de las decisiones las
  toman grupos de más de 3 personas. Por eso, en Assisted y Executive la unidad de medida es la cuenta u oportunidad,
  no la persona. a16z pide métricas de uso separadas para el motion bottom-up. AARRR nació para web de consumo (McClure),
  y sus propios divulgadores advierten que los journeys reales vuelven atrás y se saltan etapas. RARRA recuerda
  que la retención pesa tanto como la adquisición.
confidence: medium
limitations:
- Son marcos de consultoras, VCs y un analista, no evidencia experimental, y ninguno está validado con datos de
  Finora. Finora debe confirmar la taxonomía de puertas, incluido si Executive es una puerta o un segmento de tamaño.
kind: measurement
claims:
- claim: 'El Bowtie Standard de Winning by Design trata la revenue como un sistema de adquisición, onboarding, retención
    y expansión, medido con volumen, conversión y velocidad por etapa: «Growth comes from acquisition and retention
    and expansion—not leads alone».'
  source_id: EXT-01
  source_type: industry
  confidence: medium
  freshness: '2026-01-22'
  supports_or_contests: supports
  notes: Lo publica una consultora que vende el método. Sirve como estructura, no como evidencia sobre Finora.
- claim: 'Winning by Design define tres tipos de métrica. Volumen: cantidad en un paso. Conversión: «the volume
    of the output of a process divided by the volume at input». Tiempo: «the delta in the time it takes to convert
    one volume metric into another».'
  source_id: EXT-02
  source_type: industry
  confidence: high
  freshness: Sin fecha visible; consultado el 2026-09-29
  supports_or_contests: supports
  notes: Base de las familias de métricas por tramo (volumen, tasa, tiempo).
- claim: Winning by Design presenta el bowtie como reemplazo del «funnel thinking» por una vista de ciclo de vida,
    aplicable a «a single line of business and up to three GTM motions within it».
  source_id: EXT-03
  source_type: marketing
  confidence: medium
  freshness: Sin fecha visible; consultado el 2026-09-29
  supports_or_contests: supports
  notes: Página comercial. Respalda que varios motions pueden convivir en un mismo modelo de medición.
- claim: 'AARRR (McClure, 2007) nació para web de consumo: Acquisition «users come to the site from various channels»,
    Activation «users enjoy 1st visit» y Revenue «users conduct some monetization behavior».'
  source_id: EXT-04
  source_type: expert
  confidence: high
  freshness: 2007–2008
  supports_or_contests: context
  notes: Para usarlo en B2B, Activation y Revenue deben adaptarse a cada puerta.
- claim: 'En la versión AAARRR para B2B asistido, Activation es «first value (POC setup, first dashboard)» y Revenue
    es «opportunity→closed‑won». La propia fuente advierte: «Real journeys loop and skip stages; treat AAARRR as
    a planning lens, not a perfect map». También señala que la parte alta del funnel se mide mal sin pruebas de
    incrementalidad.'
  source_id: EXT-05
  source_type: industry
  confidence: medium
  freshness: Sin fecha; consultado el 2026-09-29
  supports_or_contests: supports
  notes: Fuente secundaria sin autor ni fecha.
- claim: RARRA (Papp, 2017) reordena AARRR para poner la retención primero, con el argumento de que cuando hay competencia
    «acquisition gets more expensive».
  source_id: EXT-06
  source_type: journalism
  confidence: medium
  freshness: '2020-10-08'
  supports_or_contests: contests
  notes: Es un contraargumento al orden de AARRR. En la práctica, refuerza medir el lado derecho por puerta y no
    solo la adquisición.
- claim: 'Forrester: en procesos centrados en leads/MQL, la conversión de consulta a venta ganada es «less than
    1%», y «over 80% of buying decisions are made by a buying group of more than three people».'
  source_id: EXT-07
  source_type: industry
  confidence: medium
  freshness: '2022-04-14'
  supports_or_contests: supports
  notes: Es un benchmark de contexto, no un dato de Finora. Sirve como argumento para usar la cuenta u oportunidad
    como unidad en Assisted y Executive.
- claim: 'El B2B Revenue Waterfall de Forrester cambia la unidad de medida: pasa de leads individuales a «opportunities
    with connected buying groups».'
  source_id: EXT-08
  source_type: marketing
  confidence: medium
  freshness: Sin fecha visible; consultado el 2026-09-29
  supports_or_contests: supports
  notes: La guía detallada es gated. Solo se usa la unidad de medida.
- claim: 'a16z describe el modelo «growth+sales»: un motion bottom-up al que luego se suma venta top-down. Pide
    métricas de uso separadas porque la revenue puede ocultar que «only a fraction of the paid seats are actively
    using the product».'
  source_id: EXT-09
  source_type: expert
  confidence: medium
  freshness: '2020-07-29'
  supports_or_contests: supports
  notes: Respalda medir cada motion con sus propias métricas y no mezclarlas.
- claim: Poyar señala que las empresas dudan entre seguir PQLs, PQAs o ambos. Cita una encuesta (Pocus 2022, más
    de 200 empresas) según la cual la venta asistida sobre producto aporta casi tanta revenue como el self-serve
    en el negocio PLG promedio.
  source_id: EXT-10
  source_type: expert
  confidence: low
  freshness: '2023-02-22'
  supports_or_contests: context
  notes: Parcialmente con paywall; es un benchmark de contexto. Relevante porque el paso de Self Service a Assisted
    es un camino real, así que hay que registrar puerta de origen y puerta de cierre.
