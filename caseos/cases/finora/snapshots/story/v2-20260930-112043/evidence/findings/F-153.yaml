id: F-153
type: finding
headline: Con descuentos temporales, el MRR neto, el revenue reconocido y la caja pueden separarse. Cuál vista aplica
  depende de si los contratos de Finora son mensuales cancelables o a plazo fijo.
evidence_text: 'Guía de PwC para SaaS bajo IFRS 15: si el cliente puede terminar con preaviso, el contrato se trata
  como mes a mes, y si el precio baja durante el plazo hay que evaluar si eso le da al cliente un derecho material
  (SRC-08). Si un aumento programado de la tarifa es solo una forma de pago diferido, el ingreso se reconoce de
  forma lineal (SRC-09). Un descuento temporal en un contrato a plazo fijo se parece a un aumento programado (inferencia
  nuestra).'
confidence: medium
limitations:
- Es una guía general de una firma, no una opinión sobre Finora. La analogía entre descuento temporal y aumento
  programado hay que validarla con el auditor. No revisé la guía equivalente bajo US GAAP.
kind: external
claims:
- claim: Según la guía de PwC para SaaS bajo IFRS 15, si el cliente puede terminar con preaviso, el contrato se
    trata como mes a mes. Solo el plazo no cancelable entra en la asignación del precio, y si el precio baja durante
    el plazo declarado hay que evaluar si esos descuentos futuros le dan al cliente un derecho material.
  source_id: SRC-08
  source_type: expert
  confidence: high
  freshness: Guía vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: context
  notes: No es una opinión sobre Finora; depende de cómo sean sus contratos.
- claim: La misma guía (Q4.9) indica que si un aumento programado de la tarifa es solo un mecanismo de pago diferido,
    el ingreso se reconoce de forma lineal durante el contrato; si el aumento sigue a la inflación o al mercado,
    no.
  source_id: SRC-09
  source_type: expert
  confidence: medium
  freshness: Guía vigente, consultada el 2026-09-29 (sin fecha)
  supports_or_contests: context
  notes: Aplicarlo a descuentos temporales en contratos a plazo fijo es una analogía que hay que validar con el
    auditor.
