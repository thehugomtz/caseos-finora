id: F-238
type: finding
headline: 'El as-is es un modelo de «después del pago»: tres fuentes con tres granos (cliente × mes, cliente, mes)
  y ninguna mira antes del primer pago.'
evidence_text: 'El panel está balanceado: 66.674 filas = 1.961 clientes × 34 meses (ene-22 a oct-24), con 33.703
  filas en cero y 32.971 positivas. Los 1.961 clientes pagaron al menos una vez. El mes es una fecha de fin de mes,
  sin día. La llave llega como «1» en pagos y como «Cliente 1» en industria (cruza al 100% después de parsear; hay
  1 fila vacía). El gasto S&M viene en 7 rubros × mes, sin unidad y sin canal. El catálogo no tiene lead, canal,
  campaña, oportunidad, etapa, actividad, asignación, eventos de producto ni suscripción. Lo que sí responde: stock
  y puente de monto pagado, cortes por industria y por cohorte de primer pago, y eficiencia S&M agregada.'
confidence: high
limitations:
- Describe el extracto que tiene el caso. No prueba que Finora no tenga esos datos en otros sistemas.
kind: data_engineering
