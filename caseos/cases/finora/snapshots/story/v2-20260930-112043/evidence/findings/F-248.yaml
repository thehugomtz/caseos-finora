id: F-248
type: finding
headline: 'Hoy no se puede calcular ninguna de las 30 métricas propias de funnel: el modelo empieza en el primer
  pago.'
evidence_text: El catálogo solo tiene pagos cliente×mes, industria y gasto S&M, más sus derivados. No hay ninguna
  tabla ni columna de lead, etapa, toque, dueño o canal. El gasto llega en 7 rubros × 34 meses sin corte por motion.
  Los «movimientos» del panel son de pago, no etapas.
confidence: high
limitations:
- 'Que algo no esté en el modelo no prueba que Finora no lo tenga: puede existir un CRM que no se entregó al caso.'
kind: measurement
claims:
- claim: El modelo del caso no tiene tablas ni columnas de leads, etapas, toques humanos, dueño, canal de entrada
    ni motion. Solo tiene pagos cliente×mes, industria, gasto S&M por rubro y sus derivados.
  source_id: mod1
  source_type: data_model
  confidence: high
  freshness: Corrida 2026-09-30; datos hasta oct-24
  supports_or_contests: supports
  notes: Sostiene el semáforo rojo de C-009 para todo lo previo al pago. Que no esté en el modelo no prueba que
    Finora no lo tenga (puede haber un CRM no entregado).
- claim: Los movimientos del panel (new, expansion, contraction, flat, churn, reactivation, etc.) son movimientos
    de pago por cliente-mes, no etapas de funnel. «reactivation» tiene 468 filas.
  source_id: mod3
  source_type: data_model
  confidence: high
  freshness: Corrida 2026-09-30; datos hasta oct-24
  supports_or_contests: context
  notes: Sirven para el MRR bridge (bloque Revenue), no para medir funnels.
- claim: El gasto S&M llega en 7 rubros (PaidMedia, Team, PublicidadNoWeb, PayrollExpenses, Travel, SoftwareTools,
    Freelance), con 34 meses cada uno y sin corte por funnel ni motion.
  source_id: mod4
  source_type: data_model
  confidence: high
  freshness: Corrida 2026-09-30; datos hasta oct-24
  supports_or_contests: supports
  notes: La unidad del gasto no está documentada. Con esto no se puede calcular CAC por funnel ni productividad
    por rol.
