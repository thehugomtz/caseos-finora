id: F-250
type: finding
headline: 'Los 5 funnels solo son MECE con reglas explícitas, evaluadas al cierre de una ventana fija: ¿nace de
  un estancado?, ¿quién inició?, ¿hubo toque humano?, ¿quién cerró?'
evidence_text: 'Inferencia a partir de las definiciones de Hugo. Self Service y Hybrid A entran igual (por producto)
  y se separan por el toque humano. Executive y Hybrid B entran igual (por persona) y se separan por quién cierra.
  Reactivate se asigna a otro funnel: si se suma ahí, se cuenta dos veces. Por eso propongo medir Reactivate como
  recorrido propio, cortado por funnel asignado, y contar las entradas al pool en el estancamiento del funnel de
  origen.'
confidence: medium
limitations:
- 'Es una inferencia de diseño sin fuente externa. Depende de dos definiciones que decide Hugo (Hybrid B y dónde
  va Reactivate) y de casos borde sin resolver: SQL directo que termina en self-serve y win-back.'
