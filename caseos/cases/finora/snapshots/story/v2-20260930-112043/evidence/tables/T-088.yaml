message: 'El puente normalizado exacto que pide repartir un pago entre los meses que cubre no es medible con los
  datos disponibles: no hay definición del campo de monto ni estado de la suscripción ni periodo devengado por pago,
  de modo que el reparto solo puede acotarse con firmas de reversión y de liquidación de atrasos.'
