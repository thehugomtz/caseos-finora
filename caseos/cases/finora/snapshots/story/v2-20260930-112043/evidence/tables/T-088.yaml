title: El puente normalizado exacto que pide repartir un pago entre los meses que cubre no es medible con los datos…
question: '¿Qué parte de la reactivación y de la contracción del puente observado (T-003) es solo momento de cobro?
  Puente normalizado: un mes sin pago con regreso al monto usual no cuenta como baja ni reactivación, y un pago
  que cubre varios meses se reparte.'
