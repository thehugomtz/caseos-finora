id: H-038
type: hypothesis
statement: La caída del ticket de entrada de los nuevos pagadores observados (T-004, T-018) viene sobre todo de
  un cambio de mezcla hacia motions o canales de adquisición de menor ticket, no de una baja dentro de cada motion.
  Self Service o Digital serían candidatos, si pagan menos. Es el tipo de conexión Growth–Revenue que pide Q-003,
  y el ID de cuenta de R-019 permitiría probarla.
falsifier: Con motion y canal por cuenta unidos a la facturación, el ticket de entrada baja en proporción parecida
  dentro de cada motion y canal. O bien la participación de las entradas de menor ticket no sube entre 2022 y 2024.
