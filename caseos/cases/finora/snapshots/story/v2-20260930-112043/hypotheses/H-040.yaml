id: H-040
type: hypothesis
statement: 'Una parte importante de los movimientos que se deshacen al mes siguiente (meses sin pago seguidos de
  un regreso, subidas que duran un mes) son efectos del calendario de cobro: atrasos que se ponen al día y pagos
  dobles o parciales, no bajas, pausas ni cambios de suscripción.'
falsifier: 'En el panel, el pago de regreso tras un mes sin pago no se parece a la suma de lo que se dejó de pagar
  (por ejemplo, cerca del doble del monto previo), y las subidas que se revierten no aparecen junto a un mes sin
  pago o con pago parcial. Aun si la hipótesis se sostiene, sería un patrón y no una verificación: el estado real
  del cliente solo lo confirma Finora.'
