statement: 'El escalón 2022→2023 que resume R-024 (27 → 54 altas por mes) son dos movimientos distintos: (1) un
  pico de un mes en ene-23 (60 altas, por encima del promedio de 45,2 de ene–may-23, que lo incluye; T-016 y T-013);
  (2) un cambio de nivel hacia mitad de 2023 (60,6 por mes en jun–dic-23). Si es así, H-024 (registro) solo podría
  explicar el pico y H-025 (cambio en la operación comercial a mitad de 2023), el cambio de nivel: no compiten entre
  sí.'
falsifier: 'Se cae si la serie mensual de 2023 sube de forma gradual de febrero a diciembre, sin un salto hacia
  jun-23. Y el pico deja de apuntar a registro si ene-24 también se separa de feb–may-24: en ese caso sería calendario.'
