id: H-069
type: hypothesis
statement: 'Es un caso particular de H-027: parte del crecimiento de New (H-001) sería reclasificación y no más
  gente. Serían leads estancados que regresan y que el CRM registra como New y no como Reactivate, porque no hay
  regla de caducidad del episodio (Q-064) o porque esa regla cambió. A diferencia de H-052, aquí sí son prospectos
  que pueden comprar, pero no son nuevos. Si las «otras entradas» de H-001 incluyen Reactivate, New subiría y Reactivate
  bajaría sin que llegue más gente.'
falsifier: Con el CRM, cruzar los New de cada mes con registros anteriores de la misma cuenta (empresa, dominio
  o email). Se descarta si la proporción de New con historia previa no sube en el periodo en que creció New, o si
  Reactivate no bajó en ese mismo periodo.
