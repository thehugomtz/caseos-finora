id: H-072
type: hypothesis
statement: Con la regla de R-031 tal como está resumida, una entrada que pide persona (por ejemplo, el formulario
  de «hablar con ventas») y que nadie atiende termina como Self Service sin compra. Si con más volumen la capacidad
  no alcanzó (H-006), la conversión de Self Service bajaría y la de Executive subiría sin que cambie cómo compra
  nadie.
falsifier: Con datos del CRM, las entradas que terminan en Self Service sin compra casi nunca vienen de una puerta
  que pide persona, o su peso no sube con el volumen de entradas, o la regla completa de R-031 ya las separa como
  «sin atender».
