id: Q-078
type: question
text: '¿Con qué definición entra Reactivate a la regla de prioridad: cualquier mes en cero, 2 o más meses, o meses
  en cero sin contar a quien paga exactamente los meses faltantes? La firma de atraso aparece en al menos 30% de
  los regresos tras 1 mes y en 29% tras 2 (R-023), así que exigir 2 o más meses no la limpia del todo. Es decisión
  tuya y de Finora; conviene resolverla junto con X-080.'
