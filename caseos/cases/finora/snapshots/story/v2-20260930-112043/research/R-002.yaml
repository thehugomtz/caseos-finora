  reading: Como señal, una misma baja del monto coincide con continuaciones distintas —seguir en el nivel nuevo,
    anteceder un mes sin pago o volver exacto al nivel previo—, mientras la persistencia del nivel nuevo es compatible
    con ambas historias.
- id: null
  alias: ''
