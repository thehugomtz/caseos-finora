  state: No soportada
  effect: debilitada
  reading: 'La etiqueta del puente de MRR no coincide con una decisión contractual del cliente: parte del movimiento
    bruto sin altas vuelve exacto al nivel previo al mes siguiente y hay subidas con firma de cobro retroactivo
    exacto.'
- id: null
  alias: ''
  question: ¿Qué parte de la pregunta del CFO depende de datos que no existen en el modelo actual?
  state: No evaluable
  effect: no evaluable
  reading: Resolver los escenarios del CFO requiere datos que el modelo actual no contiene y ningún campo existente
    del panel los sustituye, por lo que esta rama no es evaluable con lo disponible.
