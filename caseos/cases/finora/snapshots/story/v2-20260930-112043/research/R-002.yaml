id: R-002
type: research
research_question: ¿El monto identifica los escenarios del CFO?
case_question: ¿El monto identifica los escenarios del CFO?
specialty: analytics
intensity: analytics
status: completed
alias: W1
why_it_matters: Responde un punto explícito del CFO con material existente y puede cerrar la discusión sobre qué
  se puede inferir del monto solo. No requiere encontrar descuentos históricos.
short_answer: 'El monto no identifica los escenarios del CFO: observaciones idénticas admiten lecturas distintas.
  La observación cliente + mes + monto no distingue los escenarios planteados: una subida del monto coincide con
  ajustes sincronizados con firma de cobro retroactivo exacto y con reversiones al mes siguiente, no solo con expansión
  de la suscripción. El volumen anual de movimientos con lectura indeterminada es material. Es una prueba de observabilidad,
  no una lectura del histórico.'
headline: 'El monto no identifica los escenarios del CFO: observaciones idénticas admiten lecturas distintas'
answer_states:
- Hecho observado
findings:
- F-034
- F-032
- F-041
what_is_established:
- 'El monto observado admite lecturas alternativas para un mismo movimiento: la etiqueta del puente de MRR no se
  puede leer como una decisión contractual del cliente, porque parte del movimiento bruto vuelve exacto al nivel
  previo al mes siguiente y la proporción de meses-cliente fuera de la grilla de precios crece entre 2022 S2 y 2024
  S2.'
- Como señal, transiciones con el mismo nivel previo y el mismo nivel nuevo terminan en desenlaces posteriores distintos,
  tanto en bajas como en subidas, lo que es consistente con que el nivel del monto por sí solo no fija la historia
  detrás del cambio.
- 'Como señal, en la ventana limpia buena parte de las transiciones no registra cambio del monto: en ese conjunto
  un aumento de la suscripción acompañado de una rebaja de igual magnitud se observa igual que la ausencia de cambio.'
what_is_contested: []
what_remains_unknown:
- 'No podemos fijar qué mide amount: su definición operativa (facturado, cobrado o contratado) no está declarada
  en el modelo, y se comporta como monto cobrado y no como MRR contractual.'
- No podemos separar una contracción de la suscripción de una concesión de precio aplicada sobre la misma suscripción,
  porque el panel no contiene campos de precio, descuento, crédito ni estado de suscripción.
- 'La persistencia del nivel nuevo tras una baja no resuelve la ambigüedad: una contracción contractual y una rebaja
  recurrente comparten esa firma.'
- 'Nada de esto permite afirmar que existieran descuentos históricos ni cuantificarlos: eso queda fuera de lo que
  el modelo actual puede sostener.'
cannot_claim:
- 'Que hubo descuentos en el histórico: el caso habla de introducirlos.'
- 'Que una simulación de escenarios describe lo que ocurrió: prueba qué se puede distinguir, no qué pasó.'
alternative_explanations: []
case_implication: 'El monto observado admite lecturas alternativas para un mismo movimiento: la etiqueta del puente
  de MRR no se puede leer como una decisión contractual del cliente, porque parte del movimiento bruto vuelve exacto
  al nivel previo al mes siguiente y la proporción de meses-cliente fuera de la grilla de precios crece entre 2022
  S2 y 2024 S2.'
changes_current_story: maybe
