suggested_action: Es la siguiente según el brief y, cerrada la prueba de observabilidad, conviene volver a la evidencia
  acotada sobre lo que sí se puede nombrar.
next_question: W2
new_questions:
- ¿Qué definición operativa de amount declara el sistema de origen y quién puede confirmarla?
- ¿Qué campos mínimos de suscripción contratada y de concesión con fecha de vencimiento harían identificable cada
  escenario del CFO sin rehacer el panel?
- ¿Qué parte de los movimientos hoy etiquetados como expansión y contracción quedaría reclasificada si se separara
  el cobro del periodo de servicio al que corresponde?
- ¿Qué reglas de reconocimiento debería fijar Finanzas para que el fin de una concesión y una ampliación de suscripción
  no compartan etiqueta en el puente?
