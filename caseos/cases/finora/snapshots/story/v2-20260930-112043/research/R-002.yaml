  state: Direccional
  effect: señal direccional
  reading: Como señal, en el conjunto de transiciones sin cambio del monto un aumento de la suscripción acompañado
    de una rebaja de igual magnitud se observa igual que la ausencia de cambio.
- id: null
  alias: ''
  question: ¿Una subida del monto distingue el fin de un descuento temporal de una expansión de la suscripción?
