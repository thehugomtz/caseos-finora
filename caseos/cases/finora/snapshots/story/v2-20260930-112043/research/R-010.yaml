- SELECT substr(month,1,4) AS year, COUNT(*) AS months, SUM(new_customers) AS new_customers, ROUND(SUM(new_mrr_cop)/1e6,1)
  AS new_mrr_mm_cop, ROUND(SUM(new_mrr_cop)/SUM(new_customers)/1e3,0) AS new_mrr_per_new_k_cop, ROUND(AVG(median_new_customer_mrr_cop)/1e3,0)
  AS avg_monthly_median_new_mrr_k_cop, ROUND(SUM(demand_gen_spend),3) AS demand_gen, ROUND(SUM(sales_capacity_spend),3)
