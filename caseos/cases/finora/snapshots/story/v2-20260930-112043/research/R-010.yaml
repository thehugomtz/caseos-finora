- SELECT substr(month,1,4) AS year, COUNT(*) AS months, SUM(new_customers) AS new_customers, ROUND(AVG(new_customers),1)
  AS avg_new_per_month, ROUND(SUM(demand_gen_spend),0) AS demand_gen_spend, ROUND(SUM(sales_capacity_spend),0) AS
  sales_capacity_spend, ROUND(SUM(enablement_spend),0) AS enablement_spend, ROUND(SUM(total_sm_spend),0) AS total_sm_spend
  FROM mart.monthly_metrics_phase1 WHERE window_flag = 'clean' GROUP BY substr(month,1,4) ORDER BY year
- SELECT month, new_customers, active_customers, ROUND(demand_gen_spend,0) AS demand_gen, ROUND(paid_media,0) AS
  paid_media, ROUND(publicidad_no_web,0) AS publicidad_no_web, ROUND(sales_capacity_spend,0) AS sales_capacity,
  ROUND(team,0) AS team, ROUND(payroll_expenses,0) AS payroll, ROUND(enablement_spend,0) AS enablement, ROUND(total_sm_spend,0)
  AS total_sm, window_flag FROM mart.monthly_metrics_phase1 ORDER BY month
- SELECT substr(month,1,4) || CASE WHEN CAST(substr(month,6,2) AS INTEGER) <= 6 THEN '-S1' ELSE '-S2' END AS half,
  COUNT(*) AS months, SUM(new_customers) AS new_customers, ROUND(AVG(new_customers),1) AS avg_new_per_month, ROUND(AVG(demand_gen_spend),4)
  AS avg_demand_gen, ROUND(AVG(paid_media),4) AS avg_paid_media, ROUND(AVG(publicidad_no_web),4) AS avg_pub_no_web,
  ROUND(AVG(sales_capacity_spend),4) AS avg_sales_capacity, ROUND(AVG(team),4) AS avg_team, ROUND(AVG(payroll_expenses),4)
  AS avg_payroll, ROUND(AVG(travel),4) AS avg_travel, ROUND(AVG(enablement_spend),4) AS avg_enablement, ROUND(AVG(total_sm_spend),4)
  AS avg_total_sm FROM mart.monthly_metrics_phase1 WHERE window_flag = 'clean' GROUP BY 1 ORDER BY 1
- SELECT Month, PaidMedia, Travel, PublicidadNoWeb, Freelance, SoftwareTools, Team, PayrollExpenses FROM raw.sm_spend
