alternative_explanations:
- 'Rezago entre ganar y el primer pago: si la facturación o el onboarding empezaron a arrancar más tarde, las ventas
  cerradas aparecen después como altas pagadas, y el primer pago cae aunque los cierres no caigan. No tiene ID en
  el caso; propongo registrarla como hipótesis nueva.'
- '«Más leads» inflado por duplicados, reingresos o clientes activos que entran como leads: habría más registros,
  no más compradores posibles. Es un sub-mecanismo de H-001.'
- Parte de la demanda nueva viene de clientes existentes o de ex-clientes, y su compra aparece como expansión o
  reactivación, no como alta. Es compatible con que en jul–oct 2024 las expansiones subieran (138→363) mientras
  las altas bajaban, pero no está probado.
- Cambió la definición de lead/MQL, el formulario o las reglas de scoring entre periodos, y entonces la tendencia
  de «leads» no es comparable.
- 'Creció más el Self Service o un canal Digital que compra a menor tasa: sería mezcla por motion (H-002), no deterioro.'
- 'Efecto de la ventana o la estacionalidad: la comparación de altas cambia de signo entre mar–oct (+7%) y jul–oct
  (−19%).'
what_is_established:
- El modelo actual no tiene entradas/leads, etapas, atención, roster ni vínculo lead→pago, así que hoy no se puede
  validar ni descartar ninguna de H-001 a H-008 (DM-01).
- 'Altas pagadas (primer pago observado) de 2023 a 2024: +7% en mar–oct (433→465) y −19% en jul–oct (251→203). El
  monto por alta no cayó (DM-04, DM-05).'
- En jul–oct 2024 frente a 2023 subió el gasto en Generación de Demanda (+46%) y en capacidad comercial (+27%),
  en una unidad no documentada (DM-05).
- 'Método: medir la conversión por cohorte de fecha de entrada con ventana fija, tratar como censuradas a las entradas
  que aún no compran y separar la mezcla con pesos constantes (EXT-03, EXT-05, EXT-04).'
what_is_contested:
- 'Si «no más ventas» es cierto: depende de la ventana y de la unidad (altas frente a MRR pagado del primer mes).'
- 'Si la velocidad de respuesta causa la conversión o si las mejores entradas simplemente se atienden antes: la
  evidencia externa es observacional y en parte de proveedores (EXT-01, EXT-02).'
- Si las razones de pérdida del CRM describen la causa real (EXT-09, sin metodología).
- 'Cuál es la unidad de conteo correcta en Executive/KAM: lead individual u oportunidad/cuenta (EXT-07).'
what_remains_unknown:
- Cuántas entradas únicas hubo por mes y tipo (New y otras), y si el CRO cuenta entradas únicas o registros.
- Qué periodos compara el CRO cuando dice «más leads, no más ventas».
- Si existe un ID que una el CRM con el customer_id de los pagos, y cuánto tarda el primer pago después de ganar.
- Si el CRM guarda el historial de etapas y la hora del primer contacto, o solo el estado actual.
- Cuántos SDR/AE hubo por mes (FTE y ramp).
- Si hubo en 2024 cambios de precio, plan o condiciones, y en qué fecha.
case_implication: 'Para Finora, la respuesta a Q-001 y Q-016 todavía no puede ser una explicación; tiene que ser
  un plan de descarte con un pedido de datos mínimo. Las ocho hipótesis se ordenan en dos capas. Primero van los
  artefactos: conteo (H-001), tiempo (H-003/H-004) y mezcla (H-002). Se resuelven solo con entradas únicas con fecha
  (con canal, motion y segmento) más el vínculo con pago. Después, solo si queda una brecha dentro de los segmentos,
  van las causas en ToFu (H-005) y en BoFu (H-006, H-007, H-008), que piden señales al entrar, atención y recorrido.
  Antes de explicar nada conviene fijar con el CRO la ventana y la unidad de «ventas»: con los pagos, la premisa
  se sostiene en jul–oct 2024 pero no en mar–oct. Sobre Q-023: descartar artefactos no requiere experimentos. Hablar
  de causa en H-006 o H-008 sí requiere un experimento o un experimento natural. En el deck, la lámina de Growth
  pasaría a ser una tabla de hipótesis × dato mínimo × qué la valida o descarta. La Propuesta de Modelo de datos
  sumaría una tabla de entradas, una de hitos, el roster y un puente CRM↔pagos.'
changes_current_story:
  value: maybe
  why: 'No cambia que con los pagos no se puede hablar de conversión. Sí cambia el encuadre en dos puntos: la premisa
    de ventas depende de la ventana (+7% frente a −19%), y la respuesta a Q-001/Q-016 pasa a ser un árbol de descarte
    con un pedido de datos en dos entregas, no una explicación. Hugo decide si la lámina de Growth adopta ese encuadre.'
affected_hypotheses:
- id: H-001
  effect: requires_research
  why: 'ToFu/premisa. Dato mínimo: todas las entradas únicas con fecha y tipo (no solo New), deduplicadas y separando
    a los clientes activos. Se valida si el total crece menos que New; se descarta si crece igual. El modelo no
    tiene entradas, y del lado ventas la premisa ya depende de la ventana.'
- id: H-002
  effect: requires_research
  why: 'ToFu/mezcla. Dato mínimo: canal, motion y segmento al entrar, más el vínculo con pago. Se valida si las
    compras esperadas (pesos actuales × tasas históricas por segmento a N días) explican la caída; se descarta si
    queda una brecha dentro de los segmentos. El modelo solo ve la mezcla de quienes compran, que casi no cambió.'
- id: H-003
  effect: requires_research
  why: 'Tiempo. Dato mínimo: fecha de entrada y fecha de primer pago. Se valida si, comparando a igual edad (90/180
    días, curvas Kaplan-Meier), la diferencia desaparece; se descarta si persiste. Hoy es imposible porque no hay
    fecha de entrada.'
- id: H-004
  effect: requires_research
  why: 'Tiempo largo. Mismo dato que H-003, con un seguimiento de al menos 180 días: gana HC3a si las curvas convergen
    y HC3b si la brecha persiste. Si Finora entrega datos hasta hoy, las cohortes de 2024 ya se pueden evaluar.
    Hay que medir la conversión inmediata y la diferida, porque pueden ir en direcciones distintas (EXT-08).'
- id: H-005
  effect: requires_research
  why: 'ToFu/calidad. Dato mínimo: señales al entrar (fit e intención) con reglas congeladas, más el vínculo con
    pago. Se valida si cae la proporción de grado alto mientras la tasa por grado se mantiene; se descarta si las
    señales no empeoraron. La calificación posterior de Sales no sirve como medida.'
- id: H-006
  effect: requires_research
  why: 'Atención y capacidad. Dato mínimo: asignación y primer contacto con timestamps, más el roster de SDR/AE
    por semana. Se valida si subió la carga por rep, empeoró el tiempo al primer contacto y la caída se concentra
    en las entradas atendidas tarde, a igual calidad. Afuera, la respuesta lenta es común y se asocia a menos contacto
    (observacional). Adentro, el gasto de capacidad comercial subió 27%, pero gasto no es FTE.'
- id: H-007
  effect: requires_research
  why: 'BoFu. Dato mínimo: historial de etapas con fechas, no solo la etapa actual. Se valida si las tasas a igual
    edad están estables hasta SQL y caen después; se descarta si el tramo posterior está estable. Indica dónde mirar,
    no por qué pasa.'
- id: H-008
  effect: requires_research
  why: 'BoFu/oferta. Dato mínimo: un registro fechado de cambios de precio, plan o condiciones, la etapa de pérdida
    y el win/loss contado por el comprador (no solo la razón del CRM). Hay una señal que precisar: en jul–oct 2024
    las expansiones pasaron de 138 a 363, con un aumento mediano de ≈8–9%, sin escalón en el primer pago de los
    nuevos. Pregunta concreta: ¿hubo un ajuste de precio o condiciones en 2024?'
