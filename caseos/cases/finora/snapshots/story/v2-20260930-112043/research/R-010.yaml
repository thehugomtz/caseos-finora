specialist:
  measurement:
    problem_interpretation: '«Más leads, pero no más ventas» junta dos series que hoy no se pueden unir: las entradas,
      que no existen en el modelo, y las altas pagadas, que sí existen como primer pago observado. Por eso la pregunta
      útil no es «¿cuál es la tasa de conversión?» sino «¿qué dato mínimo descarta cada explicación, y en qué orden?».
      Tres explicaciones son artefactos de medición: conteo (H-001), mezcla (H-002) y tiempo (H-003/H-004). Cuatro
      serían causas reales: calidad al entrar (H-005, ToFu), atención y capacidad (H-006, entre ToFu y BoFu), el
      tramo post-SQL (H-007, BoFu) y la oferta (H-008, BoFu). Además, Self Service, Assisted y Executive/KAM no
      recorren el mismo camino, así que una tasa lead→venta mezclada no describe a ninguno.'
    measurement_objective: 'Que el CRO y el CFO puedan decidir dónde poner el siguiente peso, con el mínimo dato
      posible: Inversión en Marketing y Generación de Demanda por canal, Team (SDR/AE), proceso post-SQL y Habilitación,
      u oferta. O decidir que toca esperar porque es rezago. El dato mínimo son cohortes de entradas únicas con
      fecha, enlazadas al pago y separadas por motion.'
    recommended_framework:
      name: Cohortes de entrada por motion + árbol de descarte (primero artefactos, después causas)
      structure: 'UNIDAD: entrada única (empresa; la persona queda como detalle), deduplicada y con su relación
        previa: prospecto nuevo, ex-cliente o cliente activo.

        HITO DE INICIO: fecha de entrada.

        GRANO: entrada × hito. Se agrega por mes o trimestre de entrada × motion (Self Service, Assisted, Executive/KAM)
        × Canal de adquisición × segmento.

        HITOS: entrada → primer contacto → calificada (SQL o equivalente) → oportunidad → ganada → primer pago →
        pago del mes 2. Cada motion usa los suyos; no se fuerza la secuencia.

        QUÉ SE MIDE: el alcance de cada hito a edad fija (90/180 días) y el tiempo entre hitos (mediana y curva
        Kaplan-Meier). Los resultados comunes a todos los motions son el pago a N días y el MRR temprano.


        ÁRBOL DE DESCARTE:

        1) Premisa (Q-004) · H-001, ToFu/conteo. Dato: todas las entradas únicas con fecha y tipo, no solo New.
        Se valida si el total crece menos que New; se descarta si crece igual. En este paso también se fijan la
        ventana y la unidad de «ventas».

        2) Tiempo (Q-005/Q-006) · H-003 y H-004. Dato: fecha de entrada y fecha de primer pago. H-003 se valida
        si la brecha desaparece al comparar a igual edad. En H-004 gana HC3a si las curvas convergen a 180 días,
        y HC3b si no.

        3) Mezcla (Q-005) · H-002, ToFu. Dato: segmento, canal y motion al entrar, más el vínculo con pago. Se valida
        si las compras esperadas con tasas históricas por segmento explican la caída; se descarta si queda brecha
        dentro de los segmentos.

        4) Causas (Q-006/Q-021), solo si queda brecha:

        - H-005, calidad al entrar: señales con reglas congeladas.

        - H-006, atención: carga por SDR/AE y tiempo al primer contacto, comparando a igual calidad.

        - H-007, recorrido: tasas condicionales post-SQL con historial de etapas.

        - H-008, oferta: registro fechado de cambios y win/loss contado por el comprador.


        Los pasos 1 a 3 usan solo dos tipos de dato (entradas únicas con fecha + vínculo con pago) y distinguen
        4 de las 8 hipótesis.'
      why: Descarta primero lo más barato y lo que más engaña (conteo, tiempo, mezcla) con solo dos tipos de dato.
        Recién después pide atención, recorrido y win/loss, que cuestan más y muchas veces no tienen historia. Las
        cohortes por fecha de entrada con ventana fija evitan que las cohortes recientes parezcan peores solo por
        haber tenido menos tiempo (EXT-03, EXT-05). La mezcla con pesos constantes separa la composición del desempeño
        (EXT-04). Y medir por motion evita una tasa mezclada entre Self Service, Assisted y Executive/KAM.
    alternative_frameworks:
    - name: Forrester B2B Revenue Waterfall (oportunidades y buying groups)
      when_better: Cuando en Executive/KAM compra un grupo de varias personas por empresa y hoy cada contacto cuenta
        como lead. Ahí la unidad correcta es la oportunidad o la cuenta, y contar leads infla la entrada.
      tradeoff: Pierde la señal individual al entrar que necesita H-005. Exige conocer los roles del buying group
        y tener datos por cuenta, así que es más pesado de implementar.
    - name: 'Bowtie (Winning by Design): volumen, conversión y tiempo por etapa, de adquisición a expansión'
      when_better: Cuando Hugo quiere un solo estándar que conecte Growth con Revenue (retención y expansión) en
        el mismo deck.
      tradeoff: Tiene más etapas de las que esta pregunta necesita, y obliga a renombrar etapas y acordar definiciones
        antes de medir.
    metric_definitions:
    - metric: Entradas únicas
      definition: Empresas (o cuentas en Self Service) distintas cuya primera entrada en la ventana cae en el mes.
        Los reingresos dentro de la ventana de deduplicación no suman. Se separan prospectos nuevos, ex-clientes
        y clientes activos.
      formula: COUNT(DISTINCT entity_id) con first_entry_date en el mes, por entry_type y relación previa
      grain: Entrada; se reporta por mes × tipo de entrada (New/otras) × motion × canal
      milestone: Fecha de entrada
      notes: H-001. La ventana de deduplicación (por ejemplo, 90 días) es una propuesta a acordar con Finora. Sin
        deduplicar, «más leads» puede significar más registros, no más compradores posibles.
    - metric: Mezcla de entradas
      definition: Participación de cada segmento en las entradas únicas del periodo.
      formula: entradas_segmento / entradas_total
      grain: Mes o trimestre de entrada × segmento (canal, motion, industria, tamaño, grado)
      milestone: Fecha de entrada
      notes: H-002 y H-005. Hoy la industria solo existe para quienes pagan.
    - metric: Pago a N días por cohorte
      definition: Proporción de las entradas de una cohorte que hacen su primer pago dentro de N días desde la entrada.
        Solo se calcula para cohortes con al menos N días observados.
      formula: '# entradas de la cohorte c con (first_payment_date − entry_date) ≤ N / # entradas de c; N = 90 y
        180'
      grain: Cohorte (mes o trimestre de entrada) × motion × segmento
      milestone: Entrada → primer pago
      notes: 'Reemplaza a «altas del mes ÷ leads del mes», que mezcla poblaciones distintas. El pago de un ex-cliente
        es reactivación y el de un cliente activo es expansión: se reportan aparte.'
    - metric: Tiempo a primer pago (Kaplan-Meier)
      definition: Días desde la entrada hasta el primer pago. Las entradas que aún no compran se tratan como censuradas,
        no como perdidas.
      formula: Curva 1 − S(t) de Kaplan-Meier por cohorte; mediana de días y % que compró a 30/90/180 días
      grain: Entrada; una curva por cohorte × motion
      milestone: Entrada
      notes: 'H-003 y H-004: se comparan cohortes a igual edad. Gana HC3a si las curvas convergen y HC3b si no.'
    - metric: Brecha dentro de segmentos (ajuste por mezcla)
      definition: Diferencia entre las compras observadas y las que habría si cada segmento convirtiera a su tasa
        del periodo base, con las entradas del periodo actual.
      formula: observadas_t − Σ_s (entradas_t,s × tasa_N_base,s)
      grain: Periodo × segmento
      milestone: Entrada
      notes: 'H-002: si la brecha es cercana a cero, la mezcla explica la caída; si no, se pasa a H-005 a H-008.
        Si las celdas quedan chicas, usar trimestres.'
    - metric: Calidad al entrar
      definition: Proporción de entradas con grado alto según reglas de fit (industria, tamaño, rol) e intención
        (tipo de solicitud), congeladas y aplicadas igual a todos los periodos. También el pago a N días por grado.
      formula: entradas_grado_alto / entradas; pago a N días por grado
      grain: Entrada; mes de entrada × grado × canal
      milestone: Fecha de entrada (foto del día de entrada)
      notes: H-005. No usar la calificación posterior de Sales ni reglas que hayan cambiado en el tiempo.
    - metric: Carga por SDR/AE
      definition: Entradas asignadas por FTE activo del rol en la semana, más la cola abierta sin primer contacto.
      formula: entradas_asignadas_semana / FTE_activos_rol_semana
      grain: Semana × rol (× rep)
      milestone: Asignación
      notes: H-006. Requiere el roster con fechas de alta, baja y ramp. El gasto en Team no equivale a FTE.
    - metric: Tiempo a primer contacto
      definition: Horas hábiles entre la asignación (o la entrada) y el primer contacto real. Incluye % contactado
        en ≤1 h y en ≤24 h, % sin contacto a 7 días, y pago a N días por banda de tiempo dentro del mismo grado
        de calidad.
      formula: first_touch_at − assigned_at; distribución por banda
      grain: Entrada; semana × rol × banda
      milestone: Entrada / asignación
      notes: 'H-006. Es observacional: las mejores entradas suelen atenderse antes. Para hablar de causa hace falta
        un test de routing/SLA o un experimento natural.'
    - metric: Alcance y tiempo por hito, por motion
      definition: Proporción de la cohorte que alcanza cada hito dentro de N días, mediana de días entre hitos y
        estancamiento (sin avance en 4 u 8 semanas).
      formula: '# de la cohorte con hito_k en ≤ N días / # de la cohorte; mediana(t_k − t_k−1); # sin cambio de
        etapa en 4/8 semanas / # en la etapa'
      grain: Cohorte × motion × hito
      milestone: Entrada
      notes: 'No se fuerza la secuencia: en Self Service se puede ir de la entrada al pago, y en Executive/KAM se
        puede entrar directo a SQL.'
    - metric: Cierre post-SQL a N días
      definition: Proporción de SQL (por fecha de SQL) que se ganan dentro de N días, más las pérdidas por etapa.
      formula: '# ganadas en ≤ N días desde SQL / # SQL de la cohorte'
      grain: Cohorte de SQL × motion
      milestone: SQL
      notes: H-007. Comparar solo entradas con un avance previo comparable. Dice dónde mirar, no por qué.
    - metric: Rezago ganado → primer pago y tasa de vínculo
      definition: Días entre ganar y el primer pago, % de ganadas con pago en ≤60 días y % de primeros pagos que
        enlazan con una entrada.
      formula: 'first_payment_month − won_date; # ganadas con pago en ≤60 días / # ganadas; # altas con entry_id
        / # altas'
      grain: Ganada / cliente; mes
      milestone: Ganada
      notes: Si el rezago creció, las ventas medidas por primer pago caen aunque no caigan los cierres. El caso
        aún no confirma que el primer pago sea la adquisición.
    - metric: Valor temprano por alta
      definition: Mediana del primer pago (M0) y run-rate temprano, por cohorte y motion.
      formula: MEDIAN(m0_cop); MEDIAN(early_run_rate_cop)
      grain: Alta; cohorte × motion
      milestone: Primer pago
      notes: 'Ya existe por mes de primer pago en mart.new_customers. Separa valor de volumen: en jul–oct 2024 cayó
        el volumen de altas, no el valor por alta.'
    required_events:
    - event: entry_created
      trigger: Se crea un lead, un registro o una solicitud (formulario, KAM, evento, Self Service)
      properties:
      - entry_id
      - person_id
      - company_id
      - created_at
      - entry_type (New/otras, según Finora)
      - canal_adquisicion (Digital, KAM…)
      - campaign
      - motion (Self Service/Assisted/Executive)
      - form_type / intención
      - industria
      - tamaño
      - es_cliente_activo
      - es_ex_cliente
      - dedup_key
      - es_reingreso
    - event: entry_scored
      trigger: Se asigna un puntaje o grado a la entrada
      properties:
      - entry_id
      - score_version
      - atributos_fit
      - atributos_intencion
      - grade
      - scored_at
    - event: entry_assigned
      trigger: El routing asigna la entrada a un SDR o AE
      properties:
      - entry_id
      - owner_id
      - owner_role
      - assigned_at
      - routing_rule
    - event: sales_activity_logged
      trigger: Se registra una llamada, un email o una reunión
      properties:
      - entry_id / opportunity_id
      - owner_id
      - activity_type
      - timestamp
      - connected (sí/no)
    - event: stage_changed
      trigger: Cambia la etapa de una entrada u oportunidad
      properties:
      - entry_id / opportunity_id
      - from_stage
      - to_stage
      - changed_at
      - owner_id
      - motion
    - event: opportunity_closed
      trigger: La oportunidad se gana o se pierde
      properties:
      - opportunity_id
      - outcome
      - closed_at
      - lost_stage
      - lost_reason (vendedor)
      - competitor
      - plan
      - MRR contratado / precio ofrecido
    - event: self_service_signup / checkout_completed
      trigger: Registro y pago en autoservicio
      properties:
      - account_id
      - signup_at
      - plan
      - checkout_at
    - event: customer_id_linked
      trigger: Se crea el cliente de facturación
      properties:
      - crm_account_id
      - customer_id (ID de transactions)
      - linked_at
      - contract_start
      - billing_start
    - event: payment_recorded
      trigger: Ya existe (transactions)
      properties:
      - customer_id
      - month
      - amount
    - event: rep_roster_changed
      trigger: Alta, baja o cambio de rol de un SDR/AE
      properties:
      - rep_id
      - role
      - start_date
      - end_date
      - fte
      - ramp_end_date
    - event: offer_change_logged
      trigger: Cambio de precio, plan, condiciones o producto
      properties:
      - change_date
      - type
      - planes / segmentos afectados
      - descripcion
    - event: win_loss_interview
      trigger: Entrevista al comprador después de la decisión
      properties:
      - opportunity_id
      - interview_date
      - razon_principal (comprador)
      - alternativa_elegida
    required_dimensions:
    - dimension: Mes o trimestre de entrada (cohorte)
      why: Es la base de toda comparación a igual edad.
    - dimension: Edad desde la entrada (días)
      why: Permite comparar cohortes con la misma oportunidad de comprar (H-003/H-004).
    - dimension: Motion (Self Service, Assisted, Executive/KAM)
      why: Son recorridos distintos; separarlos evita una tasa mezclada que no describe a nadie.
    - dimension: Canal de adquisición y tipo de entrada (New/otras; Digital, KAM…)
      why: Necesario para H-001 y H-002.
    - dimension: Segmento al entrar (industria, tamaño)
      why: Necesario para H-002; hoy la industria solo existe para quienes pagan.
    - dimension: Grado de calidad al entrar (reglas congeladas)
      why: Necesario para H-005.
    - dimension: Relación previa (prospecto nuevo / ex-cliente / cliente activo)
      why: 'Permite enlazar con el movimiento correcto del pago: alta, reactivación o expansión.'
    - dimension: Owner, rol (SDR/AE) y antigüedad del rep
      why: 'Necesario para H-006: medir carga y ramp.'
    - dimension: Banda de tiempo al primer contacto
      why: Necesario para H-006.
    - dimension: Etapa alcanzada y etapa de pérdida
      why: Necesario para H-007 y H-008.
    decision_enabled: 'Dónde poner el siguiente peso, según lo que resulte:

      (a) Corregir la premisa y dejar de hablar de falta de demanda, si las entradas únicas no crecieron (H-001).

      (b) Esperar y volver a medir, si es rezago (H-003/H-004).

      (c) Reasignar la Inversión en Marketing entre canales o segmentos, si es mezcla (H-002).

      (d) Cambiar los criterios de entrada o el targeting de Generación de Demanda, si es calidad (H-005).

      (e) Sumar capacidad en Team o cambiar routing y SLA, si es atención (H-006).

      (f) Intervenir el proceso post-SQL y la Habilitación, si cae el tramo posterior (H-007).

      (g) Abrir una pregunta concreta de precio o producto, si aparece (H-008).'
    limitations:
    - 'Hoy no se puede validar ni descartar ninguna de H-001 a H-008: faltan las entradas, sus fechas, las señales,
      el recorrido, la atención y el vínculo lead→pago.'
    - Del lado ventas, el modelo solo ve el primer pago observado. El caso aún no confirma que sea la adquisición
      ni que el monto sea MRR contratado.
    - 'La industria solo existe para quienes pagan: cualquier análisis de mezcla con el modelo describe a los compradores,
      no a las entradas.'
    - 'El gasto S&M tiene una unidad no documentada: solo sirven comparaciones relativas, y gasto no es volumen
      de leads ni capacidad.'
    - 'La evidencia externa sobre velocidad de respuesta es observacional y en parte de proveedores: da plausibilidad,
      no causa para Finora.'
    - 'Con unas 50 altas al mes, cruzar motion × segmento × mes deja celdas chicas: conviene trabajar por trimestre.'
    - Si cambió la definición de lead/MQL o el scoring entre periodos, las tendencias solo son comparables si se
      recalculan con reglas congeladas.
    - 'La atribución asigna crédito, no prueba causa: H-006 y H-008 necesitan un experimento o un experimento natural.'
    implementation_implications:
    - 'Entrega 1 (barata, descarta artefactos): un extracto del CRM y de la herramienta de Self Service con todas
      las entradas desde 2023-01 hasta la fecha más reciente disponible. Debe traer ID único, fecha, tipo de entrada,
      Canal de adquisición, motion, industria y tamaño, marca de cliente activo o ex-cliente, fecha de ganado y
      el customer_id de pagos cuando compró.'
    - Si el extracto y los pagos llegan hasta hoy, las cohortes de 2024 ya tienen seguimiento largo y la censura
      (H-003/H-004) deja de ser un problema para ellas. Hay que pedir también los pagos posteriores a oct-24.
    - 'Entrega 2 (solo si queda brecha dentro de los segmentos): historial de etapas con fechas (no solo la etapa
      actual), asignación y primera actividad con timestamps, roster de SDR/AE por semana y registro fechado de
      cambios de precio, plan o condiciones.'
    - 'Para Data Engineering (Propuesta de Modelo de datos): una tabla de entradas (grano entrada), una de hitos
      (entrada × hito), una de actividades, el roster y un puente crm_account_id ↔ customer_id. El pago enlazado
      se clasifica como alta, reactivación o expansión con las banderas que ya existen en mart.customer_month.'
    - Congelar una versión de las reglas de calidad y recalcularla hacia atrás; no usar la calificación posterior
      de Sales.
    - 'Si H-006 sigue en pie: diseñar un test de routing o SLA (unidad: la entrada; aleatorizar la prioridad o el
      SLA en una fracción; métrica: pago a 90 días; guardarraíl: tiempo al primer contacto del resto) o aprovechar
      un experimento natural, como las entradas fuera de horario o las ausencias.'
    - 'Para H-008: una ronda corta de entrevistas win/loss con compradores, hecha por alguien sin interés en el
      deal, más el registro fechado de cambios de oferta.'
