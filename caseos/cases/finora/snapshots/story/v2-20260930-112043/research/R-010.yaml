cos_assessment:
  summary: "R-010 no cambia el estado de ninguna hipótesis entre H-001 y H-008. Todas siguen abiertas, sin evidencia
    a favor ni en contra. Lo que sí cambia es cómo empieza el bloque Growth (CRO) y qué se le entrega.\n\nEfectos
    materiales:\n1. **La premisa «no más ventas» depende de la ventana.** Los primeros pagadores observados suben
    7% en mar–oct y caen 19% en jul–oct. Hay que verificar la premisa antes de explicarla (Q-001).\n2. **R-010 responde
    Q-016 con un pedido mínimo en dos entregas.** Va en orden de descarte: primero se revisa si es un tema de medición
    y después las explicaciones de fondo.\n3. **Cuatro precisiones antes de aceptar F-125–F-129:**\n   - H-004 no
    es un artefacto de medición en su totalidad: la parte HC3b es la puerta a H-005–H-008.\n   - El gasto de Team
    no mide capacidad (H-006), como ya dijo R-014.\n   - «El monto por alta no cayó» puede chocar con R-003.\n   -
    Para H-005–H-008, los datos observados acotan pero no prueban causa (Q-023).\n\nOrden sugerido:\n1. Comparar
    jul–sep sin octubre y armar una tabla para las cifras de F-125.\n2. Cruzar R-010 con R-003 y T-004 por el ticket
    de entrada.\n3. Decidir Q-001 y H-004 dentro de la revisión del Framing.\n4. Decidir el pedido (Q-016) usando
    la definición de «entrada» que salga de R-016."
  run_id: RUN-20260929-104715-cos-fbed
  at: '2026-09-29T11:27:18-06:00'
  impacts:
  - target: Q-001
    effect: changes_framing
    why: 'F-125: la premisa no es un dato dado.


      - **Depende de la ventana.** Con pagos, los primeros pagadores observados de 2024 frente a 2023 suben 7% en
      mar–oct (433→465) y caen 19% en jul–oct (251→203).

      - **La caída está en los últimos cuatro meses.** Restando, mar–jun pasaría de 182 a 262 (+44%). Es cálculo
      mío, sin tabla, y solo vale si ambas cifras salen de la misma serie. Si se confirma, dentro de mar–oct la
      caída estaría solo en jul–oct, los últimos cuatro meses del panel.

      - **Proporción vs nivel.** Q-001 habla de proporción; el caso habla de nivel («no más ventas»). Con pagos
      solo se puede mirar el nivel. La proporción necesita contar leads, que hoy no están en el modelo.

      - **Hito de venta.** Medir «venta» como primer pago no es necesariamente el hito del CRO (Won, primer pago
      o suscripción activa siguen por acordar).


      R-012, que está corriendo, dirá qué ventana usa el CRO. Las cifras de F-125 todavía no tienen tabla. Además,
      «altas» está entre las etiquetas que no se deben afirmar: mejor decir «primeros pagadores observados».'
  - target: Q-016
    effect: supports
    why: 'R-010 responde Q-016. Entrega lo que R-007 (W6) anticipaba como respuesta, la lista de evidencia que falta,
      ahora en orden de descarte:


      - **Entrega 1:** entradas únicas con fecha, con canal de adquisición (Digital, KAM), motion (Assisted, Self
      Service, Executive) y segmento, más el vínculo lead→pago. Con eso se ponen a prueba H-001 a H-004.

      - **Entrega 2**, solo si queda una brecha dentro de los segmentos: señales al entrar, atención (roster de
      SDR/AE, hora del primer contacto) e historia de etapas.


      Para H-005 vs H-006 coincide con R-014. R-010 declara confianza media en este diseño.'
  - target: H-004
    effect: changes_framing
    why: 'R-010 y F-127 cuentan toda H-004 como artefacto de tiempo («se descartan los artefactos, 4 de 8»). Solo
