why_it_matters: ''
short_answer: Las cifras del Overview se reproducen con ventana completa; el resto es composición. Los múltiplos
  4,5× y 2,8× coinciden con medir clientes activos y MRR pagado de punta a punta entre ene-22 y oct-24 sobre la
  ventana completa. El −38% corresponde al MRR por cliente activo, con pago mayor que cero en el mes y la escala
  fija del campo amount. La descomposición atribuye 108% del cambio a la composición de la base
headline: Las cifras del Overview se reproducen con ventana completa; el resto es composición
what_is_established:
- 'Medir de punta a punta entre ene-22 y oct-24, con la escala fija del campo amount y ''activo'' como cliente con
  pago mayor que cero en el mes, reproduce los múltiplos 4,5× y 2,8× y la variación de −38%. La lectura queda como
  señal: parte del movimiento del monto pagado se revierte al mes siguiente.'
- Las cifras de titular se construyen sobre métricas de stock con ene-22 como mes base, mientras las métricas de
  flujo se miden desde mar-22. Son ventanas distintas dentro del mismo panel.
- La descomposición atribuye 108% del cambio a la composición de la base y −8% al efecto dentro de las cosechas.
  El MRR por cliente de los activos en ene-22 pasa de COP 92,8 mil a COP 97,4 mil, es decir que la caída agregada
  no coincide con un menor pago de ese grupo.
- 'Entre 2022 y 2024 las altas por mes pasan de 27,2 a 55,4 y el ticket de entrada promedio de COP 128,7 mil a COP
  50,8 mil. Entre 2023 y 2024 ese patrón no continúa: el ticket promedio pasa de COP 47,9 mil a COP 50,8 mil y las
  altas por mes se mantienen en 54,2 y 55,4.'
- El churn mensual observado baja de 3,5% a 1,9%, mientras el churn que no vuelve a pagar en un plazo de un trimestre
  pasa de 0,98% a 0,96%. El churn observado y la salida definitiva no describen lo mismo.
- El gasto comercial por alta es menor en 2024 que en 2022, con un cambio de −66% en la unidad reportada, y la correlación
  en niveles entre gasto total y altas del mismo mes es −0,57. Es una señal direccional, no una medida de eficiencia
  comparable.
- El panel no permite verificar la equivalencia entre amount y un importe contractual en COP, ni si un cliente sin
  pago está cancelado, pausado o en atraso. Las señales de Growth y Revenue se pueden describir, no calificar.
what_is_contested: []
what_remains_unknown:
- No se puede verificar con el panel la equivalencia entre el campo amount y un importe contractual en COP, ni si
  un cliente sin pago en el mes está cancelado, pausado o en atraso; por eso las señales se describen pero no se
  califican como deterioro comercial ni como artefacto de cobro.
- Parte del movimiento del monto pagado se deshace al mes siguiente, lo que limita leer los movimientos mensuales
  como cambios de contrato.
- La lectura de eficiencia comercial queda como señal direccional porque la unidad del gasto de S&M no está documentada
  y el archivo parece construido de arriba hacia abajo.
- La señal de adquisición no se sostiene en el tramo reciente, de modo que no puede extenderse como tendencia única
  del periodo.
alternative_explanations: []
case_implication: Si el Overview mantiene estos múltiplos, convendría publicar junto a ellos el mes base, la escala
  aplicada al campo amount y la definición de cliente activo usada. Si Revenue se sigue leyendo en agregado, podría
  convenir reportar el MRR por cliente abierto por cosecha, dado que la composición de la base concentra el cambio.
