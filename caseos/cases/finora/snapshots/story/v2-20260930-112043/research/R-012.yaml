task_why: 'Si al fijar la ventana las cifras cambian de tamaño, cambia el arranque de toda la historia; si se sostienen,
  el Overview abre Growth y Revenue con números defendibles (versión mejorada de RT-003: suma S1.1, respuesta de
  arranque, pasos y la selección de señales).'
task:
  work: datos
  draft_answer: 'Mi arranque es contar el Overview como una observación, no como un diagnóstico. Finora suma clientes
    (pagadores observados) mucho más rápido que monto pagado, y lo investigado (R-003 y R-009, todavía sin aceptar)
    apunta a que la brecha viene de quién entra, con un primer pago más bajo, más que de la base previa. Antes de
    ponerlo en lámina hay que fijar una sola ventana: R-005 compara dic-22 contra oct-24 y R-003 usa periodos comparables
    con un chequeo mar–oct. Después hay que confirmar que el 4,5× y el 2,8× salen de esa ventana. En la lámina se
    habla de monto pagado observado, no de MRR contratado, y no se usa la palabra «deterioro» hasta separar mezcla,
    precio y salidas.'
  hugo_said:
  - text: 'Finora crece mucho más en clientes (4,5×) que en ingreso (2,8×): el MRR por cliente activo cayó 38%,
      de COP 92,8 mil a COP 57,8 mil.'
    ref: N-020
  - text: 'el storytelling lo visualizo más o menos así: Sección 1 Overview… Sección 2 Growth… Revenue…'
    ref: N-021
  steps:
  - kind: data
    what: 'Fijar la ventana del Overview: primer y último mes completos, meses con cobertura parcial (window_flag),
      escala ×10.000 a COP y definición de cliente activo. Con esa ventana, recalcular el 4,5×, el 2,8×, el −38%
      y el paso de COP 92,8 mil a COP 57,8 mil.'
    where:
    - mart.monthly_metrics_phase1
    - mart.monthly_metrics
