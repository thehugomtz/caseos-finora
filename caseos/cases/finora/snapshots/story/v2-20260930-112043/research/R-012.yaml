cos_assessment:
  summary: "R-012 resuelve la duda de método del Overview. Las cifras del caso (4,5× clientes activos, 2,8× MRR
    pagado, −38% MRR por cliente activo) salen exactas con tres definiciones: se mide de punta a punta de ene-22
    a oct-24, el campo amount tiene escala fija y «activo» es un cliente con pago > 0 en el mes.\n\nLo que dice
    para la historia: el −38% no significa que los clientes paguen menos. La descomposición atribuye 108% del cambio
    a la composición de la base. Tampoco es una tendencia: es un salto entre 2022 y 2023, seguido de una meseta
    entre 2023 y 2024. Una versión ejecutiva posible: «Entraron muchos más clientes, con ticket menor; dentro de
    cada cosecha el pago promedio no bajó. El cambio fue un salto al pasar de 2022 a 2023, no una tendencia.»\n\nEfectos:\n-
    Debilita H-017 tal como está redactada: las distorsiones ya tienen número.\n- Apoya H-018, Q-010, Q-003 y H-016.
    H-022 también, pero solo como señal.\n- Cambia cómo se cuenta Q-020 en el Overview.\n- Permite resolver en el
    framing cómo nombrar MRR, altas y expansión sin afirmar nada contractual.\n\nOrden sugerido:\n1. Decidir la
    forma del Overview (Q-020) y el glosario del framing, porque destraban la revisión de F-071 a F-082.\n2. Decidir
    el cierre de H-017.\n3. Hacer dos chequeos rápidos con el propio panel:\n   - Los mismos clientes en ene-22
    y oct-24: el 97,4 mil mezcla pago y supervivencia (pueden haberse ido los que pagaban menos).\n   - El ticket
    de entrada de 2022 sin mar–may-22: puede traer clientes que ya existían antes del panel."
  run_id: RUN-20260929-110925-cos-d4c8
  at: '2026-09-29T11:46:03-06:00'
  impacts:
  - target: H-017
    effect: weakens
    why: 'R-012 muestra que sí se puede comparar, pero no «sin distorsiones importantes». Lo que se sostiene: el
      stock de punta a punta (ene-22 → oct-24) sale exacto con la escala fija de amount y «activo» = pago > 0 en
      el mes (F-071, F-072). Lo que no se sostiene: (1) stock y flujo usan ventanas distintas, con ene-22 como base
      del stock y mar-22 como inicio del flujo (F-074). (2) 25,3% del movimiento bruto sin altas vuelve exacto al
      nivel previo al mes siguiente, y 29% de la expansión se revierte (F-073). (3) El churn observado baja de 3,5%
      a 1,9%, pero el que no vuelve en un trimestre casi no se mueve (0,98% → 0,96%), y 44% vuelve a pagar al mes
      siguiente (F-079). (4) No se puede verificar que amount sea un importe contractual en COP, ni qué significa
      un mes sin pago (F-082). Además quedan dos riesgos sin medir: que las primeras apariciones de 2022 incluyan
      clientes anteriores al panel, y que el 97,4 mil de la base de ene-22 mezcle pago y supervivencia. La evaluación
      «No soportada» del agente se mantiene, ahora con números.'
  - target: H-018
    effect: supports
    why: 'Hay un cambio claro entre periodos comparables: entre ene-22 y oct-24 los clientes activos pasan de 377
      a 1.678 y el MRR pagado de COP 35,0 a 97,0 millones (F-071); las primeras apariciones pasan de 27,2 a 55,4
      por mes entre 2022 (mar–dic) y 2024 (F-077). Matiz para no sobreleer: el cambio de adquisición se concentra
      entre 2022 y 2023 y no continúa entre 2023 y 2024 (F-078), y las cifras de titular comparan dos meses sueltos.'
  - target: Q-010
    effect: supports
    why: 'Confirma y precisa lo que respondió R-001: lo comparable es el monto pagado observado y los clientes con
      pago > 0, no un MRR contratado. Ahora está claro qué hay detrás de las cifras del Overview: medición de punta
      a punta ene-22 → oct-24, escala fija de amount, «activo» = pago > 0 en el mes, stock con base ene-22 y flujo
      desde mar-22 (F-071, F-072, F-074). El límite no cambia: amount no se puede verificar como importe contractual
      en COP, y un mes sin pago puede ser baja, pausa o atraso (F-082).'
  - target: Q-020
    effect: changes_story
    why: 'R-012 responde buena parte de «¿qué cambió y desde cuándo?», y esa respuesta cambia la forma del Overview.


      Qué cambió: la composición de la base, no el pago dentro de las cosechas. La descomposición atribuye 108%
      del −38% a composición y −8% al efecto dentro de las cosechas (F-075). Pasa de 100% porque, dentro de las
      cosechas, el promedio de los clientes que siguen activos subió un poco. En oct-24 las cosechas 2023 y 2024
      son 65% de los activos y 50% del MRR, con COP 46,3 mil y 43,0 mil por cliente (F-076).


      Desde cuándo: hay un salto entre 2022 y 2023 (primeras apariciones de 27,2 a 54,2 por mes; ticket de entrada
      promedio de COP 128,7 a 47,9 mil) y una meseta entre 2023 y 2024 (54,2 → 55,4; 47,9 → 50,8 mil) (F-077, F-078).
      F-110/T-016 ubica el escalón entre dic-22 y ene-23 (de 26 a 60).


      Contar el −38% o la duplicación de primeras apariciones como tendencia continua sería falso para 2024. Además,
      si el CRO mide «cliente nuevo» como primer pago, chocaría con su premisa.


      Dos cuidados de redacción: el 97,4 mil compara a los activos de ene-22 que siguen en oct-24 con los 92,8 mil
      de toda la base de ene-22, así que mezcla pago y supervivencia y no permite decir «la base antigua paga más».
      Y el «desde cuándo» no puede ir antes de ene-22 para stock ni antes de mar-22 para flujo.'
  - target: Q-003
    effect: supports
    why: 'R-012 da el hilo entre el Overview y Growth/Revenue a nivel observado: el MRR pagado crece menos que los
      clientes activos (2,8× contra 4,5×) porque entran más clientes con ticket de entrada menor (composición: 108%),
      no por un menor pago dentro de las cosechas (F-071, F-075, F-077). Lo que no conecta es el «cómo conseguimos
      clientes»: el canal y el motion (Self Service, Assisted, Executive; Digital, KAM) no están en el panel. Eso
      sigue dependiendo del modelo de datos que proponen R-016 y R-019.'
  - target: H-016
    effect: supports
    why: 'R-012 añade un caso concreto: un mes sin pago puede ser baja, pausa o atraso, y el panel no los distingue
      (F-082). 44% del churn observado vuelve a pagar al mes siguiente (F-079), y 25,3% del movimiento bruto sin
      altas vuelve exacto al nivel previo (F-073). La misma observación admite situaciones distintas para el CFO.
      También abre una prueba rápida con el propio panel: ver la nueva hipótesis de calendario de cobro.'
  - target: H-022
    effect: supports
    why: 'F-081 repite dentro de R-012 lo que ya mostraba R-015: entre 2022 y 2024 el gasto comercial por primera
      aparición pasa de 0,105 u a 0,036 u (−66%), y la correlación en niveles entre gasto total y primeras apariciones
      del mismo mes es de −0,57. Gasto y resultados pagados no se mueven juntos. Queda como señal direccional: la
      unidad del gasto no está documentada (T-005) y el archivo parece asignado de arriba hacia abajo (T-008, T-021).
      Una correlación en niveles entre dos series con tendencia no demuestra relación entre el gasto y las primeras
      apariciones, en ningún sentido (T-025).'
  - target: framing
    effect: changes_framing
    why: 'R-012 deja definido qué significan en este panel las palabras con que el caso presenta el Overview: «MRR»
      es la suma de pagos > 0 del mes con la escala fija de amount; «cliente activo» es un cliente con pago > 0
      en el mes; el «−38%» es el MRR pagado por cliente activo. Hoy el framing prohíbe en bloque «MRR contratado»
      y etiquetas como alta, baja o expansión sin vigencia verificada. Pero los propios findings de R-012 ya dicen
      «MRR pagado», «altas» y «MRR de expansión» (F-073, F-077, F-078, F-081), igual que R-004 y R-015. Si se aceptan
      así, el deck carga etiquetas que el framing no permite; si se reescriben todos, se pierde el lenguaje del
      CEO/CFO, y «expansión» es palabra tuya. El framing está en needs_review, así que es buen momento para resolverlo
      de una vez.'
