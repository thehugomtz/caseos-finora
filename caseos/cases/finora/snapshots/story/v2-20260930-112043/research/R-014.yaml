alternative_explanations:
- 'Caída post-SQL: los AEs cierran menos por precio, competencia o producto, sin cambios en el ajuste ni en la velocidad
  (rama de Q-021).'
- 'Cambio de mezcla entre grupos de entrada (más Self Service o más Digital frente a KAM): la tasa mezclada cae
  aunque ningún recorrido empeore.'
- 'Error de medición: cambió la definición de lead, el formulario, la regla de calificación o el reparto de leads,
  o se cuentan correos automáticos como contacto.'
- 'Los reps priorizan bajo carga: atienden primero lo que parece mejor y marcan como ''mal fit'' lo que no alcanzan,
  así que la opinión de Sales mezcla H-005 y H-006.'
- 'Interacción: más volumen de bajo ajuste consume capacidad y demora también a las buenas entradas (H-005 alimenta
  a H-006).'
- 'Capacidad en el papel sin capacidad real: el gasto de Team crece, pero con reps en ramp o rotación la capacidad
  efectiva no sube (variante de H-006).'
- Cambio de mercado o estacionalidad que baja la intención en todos los grupos a la vez.
what_is_established:
- 'El modelo del caso no tiene entradas, grupo de entrada, reps ni tiempos de contacto: con él no se puede probar
  ni descartar H-005 ni H-006.'
- 'El gasto de Team/Payroll/Travel no mide capacidad: su unidad no está documentada y PayrollExpenses es negativo
  en 5 meses.'
- En B2B, buena parte de los leads de marketing no se persigue, y que un rep los siga depende a la vez de la calidad
  percibida y del volumen (Sabnis et al., 2013).
- Separar mezcla de tasa es un método publicado y verificable (Kitagawa / Oaxaca-Blinder).
what_is_contested:
- 'Cuánto causa la velocidad de respuesta: las cifras grandes (8 veces más en cinco minutos) vienen de vendors y
  son correlaciones que pueden inflarse porque los reps atienden primero los mejores leads. En esta corrida no encontramos
  evidencia experimental que controle la calidad del lead.'
- 'Qué significa la caída del primer pago observado dentro de cada industria: cuentas más chicas (compatible con
  H-005), otros planes o la entrada vía Self Service. El modelo no lo resuelve.'
what_remains_unknown:
- Si Finora tiene CRM y roster con fecha de creación, primer contacto, campos de ajuste y fechas de alta y baja
  de reps, y desde cuándo.
- Si en el periodo cambió la definición de lead, el formulario, la regla de calificación o el reparto de leads.
- Qué significa 'New' en H-006 (entradas o clientes nuevos) y qué meses son 'la caída'.
- Si Self Service existía como recorrido sin SDR/AE en ambos periodos.
case_implication: 'Para Growth, lo que se puede defender hoy ante el CRO y el CFO no es H-005 ni H-006, sino la
  prueba que las separa y el dato que falta. Es un hueco del WoW: no se mide la carga por persona productiva ni
  el tiempo a primer contacto por grupo de entrada, y el ajuste no se congela al entrar, así que la discusión calidad
  vs. capacidad queda en opinión. La pieza natural es una lámina con una matriz 2×2 (mezcla de ajuste × carga y
  espera) y un bloque en la Propuesta de Modelo de datos con dos tablas nuevas, entradas y roster. Esas tablas se
  enlazan por customer_id con el mart actual para medir resultados comunes a todos los grupos: altas, primer pago
  observado y M3. También ordena Q-021 en cuatro ramas medibles: demanda (volumen), calidad (mezcla), atención (carga
  y espera) y post-SQL. Y responde Q-023: validar no exige un experimento como primer paso.'
changes_current_story:
  value: maybe
  why: 'No cambia los hechos: con los datos del caso ninguna de las dos hipótesis gana ni pierde. Sí puede cambiar
    cómo se presentan en Growth: pasan de ''explicaciones del CRO'' a ''hipótesis con una prueba definida y datos
    pedidos'', y se suma una pieza a la Propuesta de Modelo de datos. Hugo decide si entra como lámina.'
affected_hypotheses:
- id: H-005
  effect: requires_research
  why: 'No se puede evaluar con el modelo: no hay entradas ni señales de ajuste al entrar, y la única señal disponible
    (industria de los compradores) no ve a quien no compró. La investigación vuelve medible su condición de debilitamiento:
    mezcla de bandas de ajuste congeladas al entrar, con la misma regla y por grupo de entrada. Si el efecto mezcla
    de la descomposición es cercano a cero, H-005 se debilita.'
- id: H-006
  effect: requires_research
  why: 'No se puede evaluar con el modelo: no hay headcount, carga ni tiempos de contacto, y el gasto de Team/Payroll
    no cuenta personas (unidad no documentada, 5 meses negativos). Queda medible con la carga por persona productiva,
    el P90 del tiempo a primer contacto y el % de entradas sin trabajar por grupo de entrada. Se debilita si, dentro
    de la misma banda, la conversión de las entradas atendidas dentro del SLA también cae, o si Self Service cae
    igual que Assisted.'
affected_claims: []
suggested_action: 'Proponer a Hugo una lámina de Growth, ''Capacidad vs. calidad: qué dato las separa'', con la
  matriz 2×2 y la solicitud mínima de datos (tabla de entradas más roster). Pasar a Data Engineering el esbozo de
  mart.entry_cohort (grano: entrada) y mart.capacity_week (grano: semana × rol × grupo) para la Propuesta de Modelo
  de datos. No proponer un experimento hasta ver la lectura con los datos observados.'
new_questions:
- ¿Finora registra en su CRM la fecha de creación y el primer contacto humano de cada entrada, con su grupo de entrada,
  desde antes del periodo de caída?
- ¿Cuántos SDR, AE y KAM activos tuvo Finora por mes entre 2022 y 2024, con fechas de alta y baja y el grupo de
  entrada que atendía cada uno?
- ¿Qué campos de ajuste se capturan al entrar (formulario o enriquecimiento) y cambió en el periodo la regla de
  calificación, el formulario o el reparto de leads?
handoff_to_cos:
  summary: 'R-014 queda respondida como diseño. El modelo no permite separar H-005 de H-006: faltan entradas, reps
    y tiempos de contacto, y el gasto de Team no mide capacidad. Dato mínimo: tabla de entradas con el ajuste congelado
    al entrar y el primer contacto humano, más un roster semanal de SDR/AE con su ramp. Comparación: mezcla vs.
    tasa por grupo de entrada, con Self Service como control y experimentos naturales antes que uno aleatorio (Q-023).'
  recommended_next: 'Llevar a Hugo tres propuestas: (1) una lámina de Growth con la matriz 2×2 y la solicitud de
    datos; (2) enviar a Finora las tres preguntas nuevas; (3) pasar a Data Engineering el esbozo de mart.entry_cohort
    y mart.capacity_week. Hugo decide si entra al storyline y si Q-023 se cierra con ''experimentos naturales primero''.'
confidence_buckets:
  high_confidence:
  - El modelo del caso no contiene entradas, grupo de entrada, SDR/AE ni tiempos de contacto (catálogo).
  - El gasto de Team, PayrollExpenses y Travel no mide capacidad (unidad no documentada; 5 meses con PayrollExpenses
    negativo).
  - Muchas empresas responden tarde o no persiguen los leads de marketing (Sabnis et al., 2013; Oldroyd et al.,
    2011).
  - La descomposición mezcla vs. tasa es una identidad publicada (Kitagawa; Oaxaca-Blinder).
  plausible:
  - La opinión posterior de Sales no separa H-005 de H-006, porque el seguimiento depende a la vez de la calidad
    y del volumen (Sabnis, 2013, más inferencia).
  - 'La huella de H-006 es un codo: la espera crece poco hasta cierta carga y luego se dispara (Kingman; Gans et
    al.).'
  - Self Service sirve como control de capacidad si existió como recorrido sin SDR/AE en ambos periodos (inferencia).
  - Las señales observables al entrar sirven para medir el ajuste, con una regla propia de Finora validada en el
    periodo base (Monat, 2011).
  contested:
  - 'Cuánto causa la velocidad de respuesta en la conversión: el 8 veces de un vendor es correlacional y puede estar
    inflado porque los reps atienden primero los mejores leads.'
  - 'Qué significa la caída del primer pago observado dentro de cada industria: cuentas más chicas, otros planes
    o Self Service.'
  unknown:
  - Si Finora tiene CRM y roster con los campos necesarios, y desde cuándo.
  - Si cambiaron la definición de lead, el formulario, la regla de calificación o el reparto de leads.
  - Qué significa 'New' en H-006 y qué meses son la caída.
  - Evidencia experimental publicada sobre velocidad de respuesta que controle la calidad del lead (no encontrada
    en esta corrida).
specialist:
  measurement:
    problem_interpretation: 'H-005 y H-006 predicen el mismo síntoma agregado, menos compras por entrada, pero dejan
      huellas distintas. H-005 cambia la mezcla de lo que entra: peor ajuste al entrar, medido antes de que Sales
      toque la entrada. H-006 cambia lo que pasa después de entrar: más carga por persona, más espera y más entradas
      sin trabajar, y la caída se concentra en las entradas que esperaron. Hay dos trampas. (1) Una tasa de conversión
      mezclada entre Self Service, Assisted y Executive no describe a ningún grupo y puede caer solo porque cambió
      el peso de cada uno. (2) El juicio posterior de Sales (descartes, ''mal fit'') no sirve para separar, porque
      el seguimiento de los reps depende a la vez de la calidad percibida y del volumen. Unidad: la entrada, no
      el cliente (sign-up en Self Service, lead o solicitud en Assisted, cuenta u oportunidad registrada en Executive/KAM).
      Grano: un evento por entrada, agregado a mes de entrada × grupo de entrada × banda de ajuste; la capacidad,
      a semana × rol. Hito de inicio: entrada creada. Nada de esto existe hoy en el modelo del caso.'
    measurement_objective: 'Atribuir el cambio de conversión de entrada a compra (periodo base vs. periodo de caída),
      por grupo de entrada, a tres fuentes separables: la composición del ajuste al entrar (H-005); una caída de
      la tasa dentro de cada banda concentrada en entradas lentas o sin trabajar y en semanas de alta carga (H-006);
      o una caída post-SQL u otra causa (ni H-005 ni H-006). Todo con el mínimo de datos nuevos.'
    recommended_framework:
      name: Mezcla vs. tasa por grupo de entrada, con capa de capacidad (ajuste al entrar × velocidad × carga)
      structure: '1) Cohortes de entradas por mes y grupo de entrada (Self Service / Assisted / Executive), cada
        grupo con su unidad. 2) Banda de ajuste A/B/C calculada al crear la entrada con una regla fija y versionada;
        antes de usarla, validar que las bandas separan la conversión en el periodo base. 3) Capa de capacidad semanal:
        personas productivas (FTE ramped), carga por persona, P90 del tiempo a primer contacto humano y % de entradas
        sin trabajar. 4) Volumen, tasa y valor por separado: entradas; conversión a compra en ventana fija (compra
        = primer pago enlazado a customer_id) y cierre post-SQL; primer pago observado y M3. 5) Descomposición de
        Kitagawa por grupo: Δconversión = efecto mezcla (Σ r̄_b·Δp_b) + efecto tasa (Σ p̄_b·Δr_b). 6) Abrir el efecto
        tasa por tramo de velocidad (dentro del SLA / fuera / sin contacto) y por tercil de carga al llegar. 7)
        Control: Self Service no pasa por SDR/AE; comparar su cambio dentro de cada banda con el de Assisted (diferencia
        en diferencias). 8) Si la priorización de los reps deja dudas: experimentos naturales (llegadas fuera de
        horario, reparto de leads por turnos, ausencias de reps) antes que un experimento aleatorio. Matriz 2×2:
        si la mezcla empeora y la velocidad está estable → H-005; si la mezcla está estable, suben la carga y la
        espera y la caída se concentra en entradas lentas → H-006; si pasan ambas cosas → ambas, probablemente interactuando;
        si no pasa ninguna → post-SQL, mezcla entre grupos o cambios de definición.'
      why: 'Responde la pregunta con solo dos tablas nuevas (entradas y roster) y es legible para el CRO y el CFO.
        No fuerza un funnel lineal: cada grupo tiene su recorrido y todos terminan en compra y primer pago. Además
        separa por construcción lo que cambia al entrar (mezcla) de lo que cambia después (tasa), que es justo la
        línea entre H-005 y H-006. Da a Q-021 sus cuatro ramas medibles: demanda, calidad, atención y post-SQL.
        La descomposición es una identidad publicada (Kitagawa, equivalente a Oaxaca-Blinder).'
    alternative_frameworks:
    - name: Modelo a nivel entrada (regresión logística u Oaxaca-Blinder con covariables continuas)
      when_better: Cuando hay volumen suficiente, varias señales de ajuste continuas y la carga de cada rep medida
        al momento de llegar la entrada; permite controlar varias cosas a la vez.
      tradeoff: Es menos transparente para el CRO y el CFO. La velocidad depende de la priorización de los reps,
        y con pocos casos por combinación (30 a 84 altas al mes observadas en 2023–2024) el modelo puede dar una
        falsa precisión.
    - name: Prueba aleatoria de capacidad (atención rápida garantizada o capacidad extra)
      when_better: Cuando la lectura con datos observados queda ambigua por la priorización de los reps y la decisión
        es cara (contratar SDR/AE). Da el efecto causal del mecanismo de H-006.
      tradeoff: 'Cuesta capacidad extra, tarda semanas más la ventana de compra, genera fricción operativa y solo
        prueba capacidad: no mide si cambió la mezcla de ajuste.'
    metric_definitions:
    - metric: Entradas por grupo y banda (volumen)
      definition: 'Entradas nuevas creadas en el periodo, por grupo de entrada y banda de ajuste al entrar. La unidad
        cambia por grupo: sign-up en Self Service, lead o solicitud en Assisted, cuenta u oportunidad registrada
        en Executive/KAM.'
      formula: COUNT(DISTINCT entry_id) con created_at dentro del periodo
      grain: mes de entrada × grupo de entrada × banda de ajuste (semana para la capa de capacidad)
      milestone: entrada creada (created_at)
      notes: No sumar grupos sin decir qué se cuenta. Es la rama 'Demanda' de Q-021.
    - metric: Capacidad instalada en FTE ramped
      definition: 'Personas equivalentes ya productivas: SDRs, AEs y KAMs activos en la semana, descontando ramp
        y ausencias, por rol y grupo de entrada que atienden.'
      formula: Σ_rep (días hábiles disponibles ÷ días hábiles de la semana) × factor_ramp(antigüedad); factor_ramp
        va de 0 a 1 según la curva que defina Finora
      grain: semana × rol × grupo de entrada
      milestone: fecha de ingreso del rep
      notes: 'No usar el gasto de Team/Payroll: unidad no documentada y meses negativos. El ramp de 3,0 meses del
        benchmark de Bridge Group es contexto, no un parámetro de Finora.'
    - metric: Carga por FTE ramped
      definition: Entradas asignadas en la semana por cada persona productiva del equipo que las atiende, y cola
        abierta al cierre de la semana (asignadas sin primer contacto) por persona productiva.
      formula: entradas_asignadas_semana ÷ FTE_ramped; cola_abierta_al_cierre ÷ FTE_ramped
      grain: semana × rol × grupo de entrada (y rep × semana para el experimento natural)
      milestone: entrada asignada (assigned_at)
      notes: 'Es la condición de H-006: ¿subió cuando crecieron las entradas? No aplica a Self Service.'
    - metric: Tiempo a primer contacto humano
      definition: Horas hábiles entre la creación de la entrada y el primer intento humano registrado (llamada,
        correo o mensaje manual), sin contar automatizaciones.
      formula: first_touch_at − created_at en horas hábiles; reportar mediana, P90 y % dentro del SLA de Finora
        (o de la mediana del periodo base si no hay SLA)
      grain: entrada; se agrega a semana × grupo × banda
      milestone: entrada creada
      notes: El P90 muestra lo que más esperó; con H-006 se espera un codo frente a la carga (Kingman). En Executive/KAM,
        usar el tiempo a la primera reunión.
    - metric: '% de entradas sin trabajar'
      definition: Entradas sin ningún intento humano al cerrar la ventana de atención.
      formula: entradas sin first_touch_at a los N días ÷ entradas de la cohorte (N es un parámetro, p. ej. 7)
      grain: semana de entrada × grupo × banda
      milestone: entrada creada
      notes: Mide los leads que nadie persigue (Sabnis et al., 2013). Si sube con la carga y también en las bandas
        altas, apoya H-006.
    - metric: Mezcla de ajuste al entrar
      definition: Participación de cada banda de ajuste (A/B/C) en las entradas, según una regla fija y versionada
        que solo usa datos disponibles al crear la entrada y que se congela en ese momento.
      formula: entradas_banda_b ÷ entradas_totales, por grupo de entrada
      grain: mes de entrada × grupo de entrada
      milestone: entrada creada
      notes: Antes, validar que las bandas separan la conversión en el periodo base. Nunca usar el descarte ni la
        razón de pérdida de Sales como señal de ajuste. Es la rama 'Calidad' de Q-021.
    - metric: Conversión a compra en ventana fija, por combinación
      definition: Entradas de la cohorte que llegan a su primer pago dentro de W días desde la creación, por grupo
        × banda × tramo de velocidad.
      formula: entradas con primer pago (customer_id enlazado) ≤ W días ÷ entradas de la cohorte; W, p. ej., el
        P80 del tiempo de entrada a compra en el periodo base
      grain: mes de entrada × grupo × banda × tramo de velocidad (dentro del SLA / fuera / sin contacto)
      milestone: entrada creada
      notes: 'La ventana fija evita castigar a las cohortes recientes. Lectura clave: la conversión de las entradas
        atendidas dentro del SLA, dentro de cada banda; si cae, H-006 se debilita.'
    - metric: Descomposición mezcla vs. tasa (Kitagawa)
      definition: Parte del cambio de conversión entre el periodo base y el de caída que explica la mezcla de bandas,
        y parte que explica la tasa dentro de cada banda.
      formula: Δc = Σ_b r̄_b·(p_b,2 − p_b,1) [mezcla] + Σ_b p̄_b·(r_b,2 − r_b,1) [tasa]; p = participación de la
        banda, r = conversión en la banda, barra = promedio de los dos periodos
      grain: grupo de entrada × par de periodos
      milestone: entrada creada
      notes: Mezcla grande → H-005. Tasa grande concentrada en entradas lentas o de alta carga → H-006. Tasa grande
        pareja en todas las velocidades → calidad que no se ve en las bandas, o problema post-SQL.
    - metric: Brecha Assisted vs. Self Service (diferencia en diferencias)
      definition: Cuánto más cayó la conversión en Assisted que en Self Service, dentro de la misma banda de ajuste.
      formula: '[c(Assisted, caída) − c(Assisted, base)] − [c(Self Service, caída) − c(Self Service, base)], por
        banda'
      grain: banda × par de periodos
      milestone: entrada creada
      notes: 'Self Service no pasa por SDR/AE: si la brecha es cercana a 0, la capacidad no explica la caída. Supuesto:
        la calidad no cambió distinto por canal.'
    - metric: Cierre post-SQL
      definition: SQLs de la cohorte que llegan a su primer pago dentro de una ventana fija, por grupo de entrada
        y banda.
      formula: SQLs con primer pago ≤ W días desde sql_at ÷ SQLs de la cohorte
      grain: mes de SQL × grupo × banda
      milestone: SQL creado
      notes: 'Es la tercera rama (Q-021): si la caída vive aquí y no antes, ni H-005 ni H-006 son la explicación
        principal.'
    - metric: Resultados económicos comunes por grupo de entrada
      definition: Altas, primer pago observado (M0) y % con pago en M3, por grupo de entrada, enlazando las entradas
        con el customer_id del mart actual.
      formula: COUNT(altas); MEDIAN(m0_cop); altas con pago en M3 ÷ altas con M3 observable
      grain: mes de cohorte × grupo de entrada
      milestone: primer pago observado
      notes: 'Es el resultado común a todos los recorridos: volumen, valor y permanencia. Hoy existe sin grupo de
        entrada; con el grupo se vuelve comparable.'
    required_events:
    - event: entrada_creada
      trigger: Envío de formulario, sign-up en Self Service o registro de cuenta u oportunidad por un KAM
      properties:
      - entry_id
      - account_id
      - created_at (timestamp con zona horaria)
      - grupo_de_entrada (Self Service / Assisted / Executive)
      - canal_de_adquisición (Digital / KAM / otro) y fuente o campaña
      - tipo_de_solicitud (demo, contacto, contenido, sign-up)
    - event: ajuste_al_entrar_calculado
      trigger: Al crear la entrada, antes de cualquier contacto
      properties:
      - entry_id
      - campos usados (industria, tamaño, rol, caso de uso declarado)
      - banda_de_ajuste (A/B/C)
      - versión_de_regla
      - scored_at
    - event: entrada_asignada
      trigger: El sistema de reparto asigna un responsable
      properties:
      - entry_id
      - owner_id
      - rol (SDR / AE / KAM)
      - assigned_at
      - regla_de_ruteo (turnos, territorio, cuenta)
    - event: primer_intento_humano
      trigger: Primera llamada, correo o mensaje manual registrado
      properties:
      - entry_id
      - rep_id
      - canal (llamada / correo / WhatsApp)
      - touched_at
      - es_automatizado (se excluye si es sí)
    - event: entrada_descartada
      trigger: El rep descalifica o cierra la entrada
      properties:
      - entry_id
      - rep_id
      - razón
      - disqualified_at
      - carga del rep ese día (derivada)
    - event: sql_creado
      trigger: La entrada pasa a oportunidad calificada
      properties:
      - entry_id
      - opportunity_id
      - sql_at
      - owner_id (AE)
    - event: compra_cerrada_y_primer_pago
      trigger: Cierre ganado y primer pago observado
      properties:
      - entry_id
      - opportunity_id
      - customer_id (enlace al mart)
      - won_at
      - mes del primer pago
    - event: snapshot_capacidad_rep
      trigger: Semanal
      properties:
      - rep_id
      - rol
      - semana
      - activo
      - fecha_de_ingreso
      - fecha_de_salida
      - días disponibles (vacaciones y ausencias)
      - grupo de entrada que atiende
    - event: cambio_de_definición
      trigger: Cambia el formulario, la regla de calificación, el SLA o el reparto de leads
      properties:
      - tipo de cambio
      - fecha efectiva
      - descripción
      - versión anterior y nueva
    required_dimensions:
    - dimension: Grupo de entrada (Self Service / Assisted / Executive)
      why: 'Son recorridos distintos: evita la tasa mezclada y permite usar Self Service como control de capacidad.'
    - dimension: Canal de adquisición (Digital / KAM / otros) y fuente o campaña
      why: Un cambio de calidad puede darse en un canal (p. ej., por cambios en Inversión en Marketing o Generación
        de Demanda) y no en otro.
    - dimension: Banda de ajuste al entrar (A/B/C, con versión de regla)
      why: Separa la mezcla (H-005) de la tasa (H-006).
    - dimension: Tramo de velocidad (dentro del SLA / fuera del SLA / sin contacto)
      why: Dice si la caída de la tasa se concentra en lo que esperó.
    - dimension: Tercil de carga al llegar
      why: Si H-006 es cierta, a más carga, peor conversión dentro de la misma banda.
    - dimension: Momento de llegada (horario hábil / fuera de horario / fin de semana)
      why: 'Genera espera que no depende de la calidad: sirve como experimento natural frente a la priorización
        de los reps.'
    - dimension: Rol y estado de ramp del rep (SDR / AE / KAM; en ramp / productivo)
      why: Mide la capacidad efectiva, no solo la que figura en el papel.
    - dimension: Periodo (base / caída) y cohorte de entrada (mes)
      why: Es la comparación que pide la pregunta, con ventanas fijas.
    - dimension: Industria
      why: Es el único atributo de ajuste disponible hoy y enlaza con el mart actual.
    decision_enabled: 'Si Finora debe invertir en capacidad comercial (contratar o reasignar SDR/AE, cambiar el
      reparto de leads o el SLA, desviar entradas a Self Service), corregir la máquina de leads (Inversión en Marketing,
      Generación de Demanda, criterios ToFu) o ambas cosas, y en qué grupo de entrada. Y qué se le puede decir hoy
      al CRO y al CFO: que ninguna de las dos hipótesis se puede defender aún con los datos del caso.'
    limitations:
    - Requiere datos que no están en el modelo; hasta tenerlos, H-005 y H-006 siguen abiertas.
    - La banda de ajuste solo sirve si sus campos se capturaron igual en todo el periodo y si separa la conversión
      en el periodo base. Si cambió el formulario, hay que volver a puntuar con la misma regla o limitarse a los
      campos estables.
    - 'Priorización de los reps: atienden primero lo que parece mejor. Las bandas reducen este sesgo, pero no lo
      eliminan, porque el rep ve más que los campos.'
    - La calidad que no se ve dentro de una banda aparece como 'efecto tasa'; por eso se abre por tramo de velocidad.
    - 'Pocos casos por combinación: con 30 a 84 altas mensuales en 2023–2024, conviene agregar por trimestre y reportar
      intervalos.'
    - 'Censura: las cohortes recientes necesitan una ventana fija. El primer pago observado no confirma una adquisición.'
    - El enlace entre entrada y customer_id puede ser imperfecto.
    - 'Observado no es causal: los experimentos naturales ayudan, pero solo una prueba aleatoria demuestra causa.'
    implementation_implications:
    - 'Data Engineering: nuevas fuentes raw (CRM de entradas y oportunidades, registro de actividades, roster de
      RR. HH., historial de reparto de leads y de formularios) y dos marts propuestos: mart.entry_cohort (grano:
      entrada) y mart.capacity_week (grano: semana × rol × grupo).'
    - Congelar la banda de ajuste al crear la entrada y versionar la regla; no recalcular el pasado con datos posteriores
      al contacto.
    - Excluir las automatizaciones del primer contacto y medir en horas hábiles.
    - Definir con Finora un SLA por grupo de entrada, o usar la mediana del periodo base como umbral.
    - Enlazar las entradas con customer_id para usar el mart actual en los resultados comunes (altas, primer pago
      observado, M3).
    - Mantener el gasto de Team como costo (eficiencia), no como medida de capacidad.
    - Registrar los cambios de definición (formulario, regla, reparto de leads, SLA) como eventos, para detectar
      errores de medición.
    - 'Petición mínima si Finora no tiene todo: entradas mensuales por grupo y banda, roster mensual con altas y
      bajas, y una muestra de entradas por periodo con fecha de creación y primer contacto.'
sql_runs:
- SELECT month, window_flag, new_customers, new_mrr_cop, median_new_customer_mrr_cop, demand_gen_spend, sales_capacity_spend,
  team, payroll_expenses, travel, enablement_spend, total_sm_spend, team_share_of_total_sm, new_customers_per_demand_gen_unit
  FROM mart.monthly_metrics_phase1 ORDER BY month
- SELECT year, COUNT(*) AS altas, SUM(CASE WHEN clean THEN 1 ELSE 0 END) AS altas_clean, COUNT(DISTINCT industry)
  AS industrias, ROUND(AVG(m0_cop),0) AS m0_promedio, MEDIAN(m0_cop) AS m0_mediana, ROUND(AVG(early_run_rate_cop),0)
  AS run_rate_temprano_prom FROM mart.new_customers GROUP BY year ORDER BY year
- SELECT year, industry, COUNT(*) AS altas, ROUND(100.0*COUNT(*)/SUM(COUNT(*)) OVER (PARTITION BY year),1) AS pct_del_anio,
  MEDIAN(m0_cop) AS m0_mediana FROM mart.new_customers WHERE clean GROUP BY year, industry ORDER BY year, altas
  DESC
- WITH nc AS (SELECT customer_id, year, cohort_month, m0_cop FROM mart.new_customers WHERE clean AND cohort_month
