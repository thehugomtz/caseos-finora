cos_assessment:
  summary: 'R-014 no inclina H-005 ni H-006. Con el modelo del caso no se puede probar ni descartar ninguna de las
    dos, porque faltan las entradas, los grupos de entrada, los reps y los tiempos de contacto.


    Lo que sí aporta:

    - **Dato mínimo y prueba para separarlas.** Es la primera pieza concreta de Q-016.

    - **Cierra dos atajos.** El gasto de Team/Payroll no mide capacidad. Y lo que sabemos de los compradores no
    permite elegir entre calidad y capacidad (F-124).


    Para tu revisión de F-120 a F-124:

    - F-120 y F-124 se sostienen como están.

    - F-121 deja fuera la ''compra en ventana fija'' que R-014 sí pide.

    - F-122 debería medir la capacidad comparando semanas de más y menos carga, no entradas lentas contra rápidas,
    porque los reps eligen a quién atender.

    - F-123 llama ''grupo de control'' a Self Service, cuando R-014 deja esa comparación sujeta a una condición
    que no verificó.


    Chequeo aparte: PayrollExpenses es negativo en 5 meses. Eso puede mover las cifras de S&M por alta de R-015
    y T-012, que sostienen H-022.


    Versión ejecutiva para el bloque CRO: ''Con los datos de hoy no se puede distinguir entre dos explicaciones:
    calidad de los leads o capacidad del equipo. Con dos tablas (entradas y equipo por semana) sí se podría.'''
  run_id: RUN-20260929-104559-cos-afa0
  at: '2026-09-29T11:22:25-06:00'
  impacts:
  - target: H-005
    effect: requires_research
    why: 'R-014 confirma (confianza alta) que el modelo no tiene entradas ni señales de ajuste al entrar, así que
      H-005 no se puede probar ni descartar. La prueba sería comparar la mezcla de ajuste por grupo de entrada entre
      el periodo base y el de caída. F-124 cierra el atajo de usar a los compradores: ni el primer pago menor (R-003)
      ni el menor aporte posterior (R-006) permiten elegir entre H-005 y H-006. Hay dos cosas que pueden ensuciar
      esa prueba. Primero, F-121 deja fuera la compra en ventana fija que R-014 sí pide; sin ella se cuela H-003
      (las entradas recientes tienen menos tiempo para comprar). Segundo, R-014 no sabe si cambió la definición
      de lead, el formulario, la calificación o el reparto; si cambió, la mezcla empeora por cómo se cuenta y no
      porque la máquina de leads genere peor.'
  - target: H-006
    effect: requires_research
    why: 'Sin reps, roster ni tiempos de contacto, H-006 no se puede probar ni descartar. R-014 también cierra el
      atajo del gasto: Team/Payroll no mide capacidad (la unidad no está documentada y PayrollExpenses es negativo
      en 5 meses). La prueba de F-122 tiene un punto flojo que el propio R-014 señala: que un rep siga una entrada
      depende de la calidad que percibe y del volumen (Sabnis et al., 2013). O sea, una ''entrada lenta'' puede
      ser simplemente una entrada que el rep vio peor. Lo más limpio es comparar, dentro de la misma banda de ajuste,
      semanas con más y menos carga, y mejor si la carga cambia por el lado del equipo (ramp, bajas) que por picos
      de volumen, que pueden traer peor intención. Además, la tasa dentro de una banda también cae por H-007 u H-008.
      El diseño es de confianza media: un método publicado, no un resultado. Falta definir ''New'' y los meses de
      la caída.'
  - target: F-123
    effect: weakens
    why: 'F-123 afirma sin condición que Self Service ''funciona como grupo de control''. Pero el propio R-014 no
      sabe si Self Service existía sin SDR/AE en ambos periodos, ni si cambió el reparto de entradas. Además, quien
      entra por Self Service lo elige él mismo: sirve para comparar, pero no es un control como el de un experimento.'
  - target: Q-016
    effect: supports
    why: 'R-007 (W6) quedó bloqueada con ''la respuesta es la lista de evidencia que falta'', y R-014 es la primera
      pieza concreta de esa lista: para el par H-005/H-006 ya hay dato mínimo, comparación y qué resultado apunta
      a cuál. Faltan H-007 (post-SQL) y H-008 (oferta). R-010 (en curso) pide la misma ''información mínima'' para
      las hipótesis de ToFu y BoFu; si no reutiliza este diseño, el CRO podría recibir dos pedidos de datos distintos.'
  - target: Q-021
    effect: requires_research
    why: De U06, R-014 cubre calidad (H-005) y atención (H-006), pero como diseño, no como resultado. Demanda y
      post-SQL (H-007) siguen sin dato mínimo; lo natural es que salgan de R-010 (ver Q-016).
  - target: Q-023
    effect: supports
    why: 'R-014 da una primera respuesta a U12: validar no empieza por un experimento aleatorio. Primero van las
      comparaciones naturales (Self Service, semanas de más y menos carga) y después el aleatorio, si hace falta.
      La condición sobre Self Service está en el impacto sobre F-123.'
  - target: framing
    effect: changes_framing
    why: 'R-014 cierra dos atajos que hoy no están en ''No afirmar todavía''. Uno: leer el gasto de Team/Payroll
      como capacidad de SDR/AE. Dos: leer lo que sabemos de los compradores (primer pago menor, menor aporte posterior)
      como peor calidad de leads o falta de capacidad (F-124). Los dos son tentadores en una lámina de Inversión
      en Marketing o en el bloque CRO. Framing sigue en needs_review, así que esto entraría en esa revisión.'
  - target: H-022
    effect: requires_research
    why: R-014 establece que PayrollExpenses es negativo en 5 meses. Si el S&M total que usan R-015 (S&M total por
      alta −66%) y T-012 (gasto por alta de 0,11 a 0,04) incluye Team/Payroll, y esos meses caen en las ventanas
      comparadas, las cifras que hoy sostienen H-022 pueden moverse. En el estado no veo si R-015 o T-007 ya lo
      tratan.
