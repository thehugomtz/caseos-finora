task_why: 'Capacidad y calidad llevan a decisiones opuestas (poner más gente o arreglar la máquina de leads), así
  que el dato que las separa es el más valioso para el CRO (versión mejorada de RT-005: suma S2.6, respuesta de
  arranque y pasos).'
task:
  work: propuesta
  draft_answer: Desde afuera se ven igual (más New, no más ventas), pero dejan huellas distintas. Si es capacidad,
    sube la carga por SDR/AE, se alarga el tiempo a primer contacto y los leads que sí se atienden a tiempo compran
    como antes. Si es calidad, las señales al entrar (necesidad, intención, ajuste) empeoran aunque la atención
    sea igual de rápida. La comparación que las separa es la compra por grupo de entrada, cruzando atención rápida
    vs lenta con señales buenas vs malas, medidas con el mismo criterio en el tiempo; la opinión posterior de Sales
    no basta. Nada de eso está en los datos del caso, y pueden pasar las dos a la vez. Si el CRO puede, una prueba
    con tiempo de atención garantizado para un grupo podría cerrar la duda más rápido que el histórico.
  hugo_said:
  - text: La calidad de la máquina de leads bajó
    ref: H-005
  - text: La capacidad comercial instalada no alcanza la demanda generada
    ref: H-006
  steps:
  - kind: proposal
    what: Definir las medidas de capacidad (carga por SDR/AE activo, tiempo a primer contacto, % contactado dentro
      de un plazo por acordar) y de calidad (señales de necesidad, intención y ajuste al entrar, con el mismo criterio
      en el tiempo).
    where: []
  - kind: proposal
    what: 'Comparación 2×2 por grupo de entrada: atención rápida vs lenta × señales buenas vs malas. Para cada hipótesis,
      el patrón que la apoya y lo que la debilita según H-005 y H-006, incluido el caso en que pasan las dos.'
    where: []
  - kind: proposal
    what: Diseño opcional de una prueba (un grupo con tiempo de atención garantizado) si el CRO puede correrla,
      y qué parte de esto se vuelve métrica recurrente.
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: 'Decide si la respuesta al CRO es invertir en capacidad comercial (Team, reparto de leads, SLA)
  o corregir la máquina de leads (Inversión en Marketing, Generación de Demanda, criterios ToFu). También define
  qué se puede defender hoy ante el CRO y el CFO: con los datos actuales, ninguna de las dos.'
short_answer: 'No se puede responder con los datos del caso. El modelo no tiene entradas, grupo de entrada, SDR/AE
  ni tiempos de contacto, y el gasto de Team/Payroll no sirve para medir capacidad (confianza alta). El dato mínimo
  son dos tablas: entradas (creación, grupo de entrada, señales de ajuste congeladas al entrar, primer contacto
  humano y compra en ventana fija) y un roster semanal de SDR/AE que distinga ramp; la comparación, por grupo de
  entrada entre periodo base y periodo de caída, es: si empeora la mezcla de ajuste apunta a H-005, y si suben la
  carga y la espera y la caída se concentra en entradas lentas o sin trabajar, con Self Service estable, apunta
  a H-006 (confianza media: es un diseño apoyado en un método publicado, no un resultado).'
