  note: WITH r AS (SELECT c.customer_id, c.month_index, c.multi_month_payment_signature AS sig, (SELECT MAX(p.month_index)
    FROM mart.customer_month p WHERE p.customer_id = c.customer_id AND p.month_index < c.month_index AND p.active_customer
    = 1) AS last_active_idx FROM mart.customer_month c WHERE c.reactivated_customer = 1), g AS (SELECT month_index
    - last_active_idx - 1 AS gap, sig FROM r) SELECT CASE WHEN gap = 1 THEN '1' WHEN gap = 2 THEN '2' WHEN gap =
    3 THEN '3' ELSE '4+' END AS gap_meses, COUNT(*) AS reactivaciones, SUM(CASE WHEN sig = gap + 1 THEN 1 ELSE 0
    END) AS paga_meses_faltantes_mas_actual, ROUND(1.0*SUM(CASE WHEN sig = gap + 1 THEN 1 ELSE 0 END)/COUNT(*),3)
    AS share_catch_up FROM g GROUP BY 1 ORDER BY 1
  verified: true
