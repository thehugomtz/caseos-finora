- catalogo_modelo()
- SELECT substr(month,1,4) AS year, SUM(new_customers) AS new_customers, SUM(reactivated_customers) AS reactivated_customers,
  ROUND(1.0*SUM(reactivated_customers)/(SUM(new_customers)+SUM(reactivated_customers)),3) AS reactivation_share_of_paid_entries,
  SUM(churned_customers) AS churned_customers, COUNT(*) AS months FROM mart.monthly_metrics WHERE month >= '2022-02'
  GROUP BY 1 ORDER BY 1
- SELECT CASE WHEN months_to_return IS NULL THEN 'no vuelve antes de oct-24' WHEN months_to_return = 1 THEN '1'
  WHEN months_to_return = 2 THEN '2' WHEN months_to_return = 3 THEN '3' WHEN months_to_return BETWEEN 4 AND 6 THEN
  '4-6' WHEN months_to_return BETWEEN 7 AND 12 THEN '7-12' ELSE '>12' END AS bucket, COUNT(*) AS churn_events, ROUND(1.0*COUNT(*)/SUM(COUNT(*))
  OVER (),3) AS share FROM mart.churn_events GROUP BY 1 ORDER BY MIN(COALESCE(months_to_return, 999))
- SELECT m0_cop, COUNT(*) AS altas, ROUND(1.0*COUNT(*)/SUM(COUNT(*)) OVER (),3) AS share FROM mart.new_customers
  WHERE clean = 1 GROUP BY m0_cop ORDER BY altas DESC LIMIT 25
- WITH r AS (SELECT c.customer_id, c.month, c.month_index, c.multi_month_payment_signature AS sig, c.amount_vs_usual_ratio,
  (SELECT MAX(p.month_index) FROM mart.customer_month p WHERE p.customer_id = c.customer_id AND p.month_index <
  c.month_index AND p.active_customer = 1) AS last_active_idx FROM mart.customer_month c WHERE c.reactivated_customer
  = 1) SELECT CASE WHEN month_index - last_active_idx - 1 = 1 THEN 'gap 1 mes' WHEN month_index - last_active_idx
  - 1 BETWEEN 2 AND 3 THEN 'gap 2-3 meses' ELSE 'gap 4+ meses' END AS gap_bucket, COUNT(*) AS reactivations, SUM(CASE
  WHEN sig = 2 THEN 1 ELSE 0 END) AS pays_2x_usual, SUM(CASE WHEN sig >= 2 THEN 1 ELSE 0 END) AS pays_kx_usual,
  SUM(CASE WHEN ABS(amount_vs_usual_ratio - 1) < 0.005 THEN 1 ELSE 0 END) AS pays_usual_amount FROM r GROUP BY 1
  ORDER BY 1
- SELECT COUNT(*) AS altas_clean, SUM(CASE WHEN CAST(ROUND(m0_cop) AS INTEGER) % 2100 = 0 THEN 1 ELSE 0 END) AS
  multiplo_2100, SUM(CASE WHEN CAST(ROUND(m0_cop) AS INTEGER) % 1050 = 0 THEN 1 ELSE 0 END) AS multiplo_1050, COUNT(DISTINCT
  m0_cop) AS montos_distintos, MIN(m0_cop) AS min_m0, MAX(m0_cop) AS max_m0 FROM mart.new_customers WHERE clean
  = 1
- SELECT vintage, cohort_flag_hint, COUNT(*) FROM (SELECT vintage, CASE WHEN clean = 1 THEN 'clean' ELSE 'not_clean'
  END AS cohort_flag_hint FROM mart.new_customers) GROUP BY 1,2 ORDER BY 1,2
- WITH r AS (SELECT c.customer_id, c.month, c.year, c.month_index, (SELECT MAX(p.month_index) FROM mart.customer_month
  p WHERE p.customer_id = c.customer_id AND p.month_index < c.month_index AND p.active_customer = 1) AS last_active_idx
  FROM mart.customer_month c WHERE c.reactivated_customer = 1), rr AS (SELECT year, SUM(CASE WHEN month_index -
  last_active_idx - 1 = 1 THEN 1 ELSE 0 END) AS react_gap1, SUM(CASE WHEN month_index - last_active_idx - 1 BETWEEN
  2 AND 3 THEN 1 ELSE 0 END) AS react_gap2_3, SUM(CASE WHEN month_index - last_active_idx - 1 >= 4 THEN 1 ELSE 0
  END) AS react_gap4p FROM r GROUP BY year), n AS (SELECT CAST(substr(month,1,4) AS INTEGER) AS year, SUM(new_customers)
  AS new_customers FROM mart.monthly_metrics WHERE month >= '2022-02' GROUP BY 1) SELECT n.year, n.new_customers,
  rr.react_gap1, rr.react_gap2_3, rr.react_gap4p, ROUND(1.0*(rr.react_gap1+rr.react_gap2_3+rr.react_gap4p)/(n.new_customers+rr.react_gap1+rr.react_gap2_3+rr.react_gap4p),3)
  AS share_react_any_gap, ROUND(1.0*(rr.react_gap2_3+rr.react_gap4p)/(n.new_customers+rr.react_gap2_3+rr.react_gap4p),3)
  AS share_react_gap2plus, ROUND(1.0*rr.react_gap4p/(n.new_customers+rr.react_gap4p),3) AS share_react_gap4plus
  FROM n JOIN rr ON rr.year = n.year ORDER BY n.year
- SELECT year, COUNT(*) AS altas_clean_con_m1_observado, SUM(CASE WHEN m1_cop = 0 THEN 1 ELSE 0 END) AS sin_pago_en_m1,
  ROUND(1.0*SUM(CASE WHEN m1_cop = 0 THEN 1 ELSE 0 END)/COUNT(*),3) AS share_sin_pago_m1 FROM mart.new_customers
  WHERE clean = 1 AND m1_cop IS NOT NULL GROUP BY year ORDER BY year
- SELECT n.year, COUNT(*) AS altas_clean_sin_pago_m1, SUM(CASE WHEN EXISTS (SELECT 1 FROM mart.customer_month c
  WHERE c.customer_id = n.customer_id AND c.tenure_month = 2 AND c.active_customer = 1) THEN 1 ELSE 0 END) AS vuelven_en_m2
  FROM mart.new_customers n WHERE n.clean = 1 AND n.m1_cop = 0 GROUP BY n.year ORDER BY n.year
- WITH r AS (SELECT c.customer_id, c.month_index, c.multi_month_payment_signature AS sig, (SELECT MAX(p.month_index)
  FROM mart.customer_month p WHERE p.customer_id = c.customer_id AND p.month_index < c.month_index AND p.active_customer
  = 1) AS last_active_idx FROM mart.customer_month c WHERE c.reactivated_customer = 1), g AS (SELECT month_index
  - last_active_idx - 1 AS gap, sig FROM r) SELECT CASE WHEN gap = 1 THEN '1' WHEN gap = 2 THEN '2' WHEN gap = 3
  THEN '3' ELSE '4+' END AS gap_meses, COUNT(*) AS reactivaciones, SUM(CASE WHEN sig = gap + 1 THEN 1 ELSE 0 END)
  AS paga_meses_faltantes_mas_actual, ROUND(1.0*SUM(CASE WHEN sig = gap + 1 THEN 1 ELSE 0 END)/COUNT(*),3) AS share_catch_up
  FROM g GROUP BY 1 ORDER BY 1
