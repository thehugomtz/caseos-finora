- id: S-DM-04
  title: Reactivaciones según los meses en cero y el monto pagado al volver
  url: ''
  publisher: Finora · modelo analítico (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: WITH r AS (SELECT c.customer_id, c.month, c.month_index, c.multi_month_payment_signature AS sig, c.amount_vs_usual_ratio,
    (SELECT MAX(p.month_index) FROM mart.customer_month p WHERE p.customer_id = c.customer_id AND p.month_index
    < c.month_index AND p.active_customer = 1) AS last_active_idx FROM mart.customer_month c WHERE c.reactivated_customer
    = 1) SELECT CASE WHEN month_index - last_active_idx - 1 = 1 THEN 'gap 1 mes' WHEN month_index - last_active_idx
    - 1 BETWEEN 2 AND 3 THEN 'gap 2-3 meses' ELSE 'gap 4+ meses' END AS gap_bucket, COUNT(*) AS reactivations, SUM(CASE
    WHEN sig = 2 THEN 1 ELSE 0 END) AS pays_2x_usual, SUM(CASE WHEN sig >= 2 THEN 1 ELSE 0 END) AS pays_kx_usual,
    SUM(CASE WHEN ABS(amount_vs_usual_ratio - 1) < 0.005 THEN 1 ELSE 0 END) AS pays_usual_amount FROM r GROUP BY
    1 ORDER BY 1
  verified: true
- id: S-DM-05
  title: Peso de Reactivate por año según el mínimo de meses sin pagar
  url: ''
  publisher: Finora · modelo analítico (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: WITH r AS (SELECT c.customer_id, c.month, c.year, c.month_index, (SELECT MAX(p.month_index) FROM mart.customer_month
    p WHERE p.customer_id = c.customer_id AND p.month_index < c.month_index AND p.active_customer = 1) AS last_active_idx
    FROM mart.customer_month c WHERE c.reactivated_customer = 1), rr AS (SELECT year, SUM(CASE WHEN month_index
    - last_active_idx - 1 = 1 THEN 1 ELSE 0 END) AS react_gap1, SUM(CASE WHEN month_index - last_active_idx - 1
    BETWEEN 2 AND 3 THEN 1 ELSE 0 END) AS react_gap2_3, SUM(CASE WHEN month_index - last_active_idx - 1 >= 4 THEN
    1 ELSE 0 END) AS react_gap4p FROM r GROUP BY year), n AS (SELECT CAST(substr(month,1,4) AS INTEGER) AS year,
    SUM(new_customers) AS new_customers FROM mart.monthly_metrics WHERE month >= '2022-02' GROUP BY 1) SELECT n.year,
    n.new_customers, rr.react_gap1, rr.react_gap2_3, rr.react_gap4p, ROUND(1.0*(rr.react_gap1+rr.react_gap2_3+rr.react_gap4p)/(n.new_customers+rr.react_gap1+rr.react_gap2_3+rr.react_gap4p),3)
    AS share_react_any_gap, ROUND(1.0*(rr.react_gap2_3+rr.react_gap4p)/(n.new_customers+rr.react_gap2_3+rr.react_gap4p),3)
    AS share_react_gap2plus, ROUND(1.0*rr.react_gap4p/(n.new_customers+rr.react_gap4p),3) AS share_react_gap4plus
    FROM n JOIN rr ON rr.year = n.year ORDER BY n.year
  verified: true
