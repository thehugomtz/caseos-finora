task_why: Reformula RT-016 (ya investigada en R-016). Es la pregunta que el caso hace literalmente y la base de
  las métricas (S2.5), de las hipótesis ToFu/BoFu (S2.6) y de la solución (S2.7). Si la regla no es MECE, la suma
  por ruta no cuadra con el total del nudo y la comparación de «más leads, pero no más ventas» se rompe.
task:
  work: propuesta
  draft_answer: 'Propuesta de arranque: el mix funciona si se corta con dos preguntas, no como lista. 1) Puerta,
    fija al entrar: ¿el registro nació en el producto (se registró solo) o en el proceso comercial (campaña, referido,
    partner, prospección)? 2) Intervención antes del nudo, contando tramos (pasar de una etapa a la siguiente):
    si ninguno lo movió una persona, es Self Service; si todos, Executive; si algunos, Hybrid. Hybrid tiene los
    dos casos de Hugo: A) empezó solo arriba y lo intervinieron abajo; B) lo contactaron como New y él solito lo
    acabó. Reactivate va como loop, no como cuarta ruta: el lead estancado entra, se trabaja y se reasigna según
    el caso, sin contar como entrada nueva. Si lo reactiva un SDR, eso cuenta como intervención. Etapas: Executive
    = New → Working → Engaged → SQL → Demo → Proposal → Won, más estados de salida (Lost, Descalificado, a Reactivate);
    la entrada directa a SQL es Executive con etapa de entrada SQL. Self Service = llega → se registra → activación
    → señal de compra → paga. El brief dice «llegan directo al producto, se registran, lo usan y pagan»; activación
    y señal de compra son propuesta. Hybrid A = registro → uso → señal que dispara el contacto de SDR/AE → demo
    o propuesta si hace falta → nudo. Hybrid B = New → Working/Engaged → registro en el producto → paga sin AE.
    El canal es un atributo que cruza las tres rutas. Borde por decidir: el lead de campaña que nadie contactó y
    compró solo (Self Service con puerta comercial; habla directo de H-006). No sabemos si Self Service tiene prueba
    gratis, freemium o pago al registrarse, qué cuenta como intervención, ni si CRM y producto comparten ID.'
  hugo_said:
  - text: Assisted / Self Service / Executive
    ref: N-024
  steps:
  - kind: data
    what: Confirmar qué hay para asignar rutas. En el modelo no hay etapa, canal, toques de SDR/AE ni eventos de
      producto, así que con los datos del caso no se puede asignar ninguna ruta. Solo el nudo es observable, si
      se define como primer pago (bandera de alta). No inferir la ruta por monto ni por industria.
    where:
    - mart.customer_month
    - raw.transactions
  - kind: research
    what: Buscar cómo se definen en la práctica el bowtie con varias puertas, las rutas mixtas (contacto de ventas
      disparado por el uso del producto) y el reciclaje de leads estancados. Sirve como opciones para la propuesta,
      no como estándar ni para fijar umbrales.
    where: []
  - kind: proposal
    what: 'Regla de asignación en dos preguntas, con la tabla de casos: qué ruta toca en cada combinación de puerta
      e intervención, incluidos los bordes (entrada directa a SQL que vino del producto o de un partner, lead de
      campaña no contactado que compró solo, formulario de «hablar con ventas», prueba montada por un AE, lead que
      pasó por Reactivate).'
    where: []
  - kind: proposal
    what: 'Etapas de cada ruta, con criterio de entrada y salida por etapa y su dueño (SDR, AE o el cliente solo);
      estados de salida; el loop de Reactivate (umbral de estancado como parámetro a acordar con Finora, y reasignación);
      y los campos mínimos para que la regla funcione: ID común CRM–producto, puerta, canal, etapa de entrada, toques
      con fecha y tipo, eventos de producto y motivo de salida. Alimenta S2.7.'
    where: []
requested_via: delegado a Claude en el chat (29-sep 14:05, D-017)
why_it_matters: La regla decide qué cuenta como «nuevo» y a qué puerta va cada entrada. De eso depende si el CRO
  ve un problema de capacidad (H-006), un cambio de mezcla (H-036) o un efecto de cómo se cuentan las reactivaciones
  (H-037). Si la regla no se congela al entrar, un cambio de capacidad mueve entradas de una puerta a otra y ya
  no se pueden comparar los años.
short_answer: 'Sí se puede tener un mix MECE de cuatro funnels, con cuatro condiciones: 1) la unidad es la cuenta,
  no la persona; 2) la puerta se asigna al entrar, con información previa al contacto, y queda fija; 3) una regla
  de prioridad decide en este orden: Reactivate, Executive, Hybrid, Self Service y «sin clasificar»; 4) cada puerta
  se mide por alcance y tiempo entre hitos, con el primer pago como nudo común y los mismos resultados después.
  Hoy los datos no miden ninguna etapa antes del primer pago, pero sí muestran que lo que más cambia los números
  es cómo se define Reactivate: si basta un mes sin pago, las reactivaciones son 18–30% de las entradas a pago;
  si se exigen 2 o más meses, son 7–9%. Confianza alta en las cifras y en la lógica de la regla, media en el orden
  de prioridad (lo deciden Hugo y Finora); sigue abierto si existe Self Service real (Q-046).'
claims:
- claim: El modelo de datos del caso solo tiene pagos mensuales por cliente, industria y gasto S&M por rubro. No
    hay leads, contactos, oportunidades, etapas ni etiqueta de puerta.
  source_id: S-DM-01
  source_type: data_model
  confidence: high
  freshness: Catálogo leído en esta corrida (2026-09-29)
  supports_or_contests: context
  notes: Por eso ninguna etapa antes del primer pago es medible hoy y no se afirma nada sobre conversión del funnel.
- claim: 'Si basta cualquier mes en cero, las reactivaciones observadas son el 30,4% (2022: 166 de 546), el 17,7%
    (2023: 140 de 790) y el 22,6% (2024: 162 de 716) de las entradas a pago (primeras apariciones + reactivaciones).'
  source_id: S-DM-02
  source_type: data_model
  confidence: high
  freshness: Datos ene-22–oct-24; 2022 = feb–dic, 2024 = ene–oct; consulta del 2026-09-29
  supports_or_contests: supports
  notes: 'Consistente con la parte baja del rango de R-016, que usa otro corte. Son proporciones dentro de cada
    año. Los conteos no se comparan entre años: la cobertura es distinta y 2022 incluye las altas marcadas de feb-22.'
- claim: 330 de los 751 churns observados (43,9%) vuelven a pagar al mes siguiente; 283 (37,7%) no vuelven antes
    de oct-24.
  source_id: S-DM-03
  source_type: data_model
  confidence: high
  freshness: Datos ene-22–oct-24; consulta del 2026-09-29
  supports_or_contests: context
  notes: Es churn observado, no cancelación confirmada. Los churns recientes tienen menos tiempo para volver, porque
    la ventana se corta en oct-24.
- claim: 330 de las 468 reactivaciones observadas (70,5%) llegan tras un solo mes en cero; 100 de esas 330 pagan
    al volver exactamente el doble de su monto usual.
  source_id: S-DM-04
  source_type: data_model
  confidence: high
  freshness: Datos ene-22–oct-24; consulta del 2026-09-29
  supports_or_contests: contests
  notes: Contradice leer esos regresos como clientes recuperados. Pagar el doble cuadra con un pago atrasado (el
    mes faltante más el actual), aunque también podría ser un cambio de plan exacto. La detección exige que el monto
    usual aparezca al menos 3 veces, así que 100 es un mínimo.
- claim: Pagar al volver exactamente los meses en cero más el actual (señal de pago atrasado) aparece en el 30,3%
    de los regresos tras 1 mes, el 29,0% tras 2, el 16,7% tras 3 y el 7,7% tras 4 o más. Con la regla «2 o más meses
    en cero y sin esa señal» quedan 112 de las 468 reactivaciones.
  source_id: S-DM-08
  source_type: data_model
  confidence: high
  freshness: Datos ene-22–oct-24; consulta del 2026-09-29
  supports_or_contests: contests
  notes: '112 = (62−18) + (24−4) + (52−4), calculado sobre las filas de la consulta. Un umbral solo de tiempo (2
    meses) no basta: la señal de pago atrasado sigue apareciendo a los 2 meses.'
- claim: Si se exigen 2 o más meses sin pagar, las reactivaciones son el 7,1%, 8,1% y 8,6% de las entradas a pago
    (2022, 2023, 2024). Si se exigen 4 o más, son el 2,8%, 3,7% y 2,8%.
  source_id: S-DM-05
  source_type: data_model
  confidence: high
  freshness: Datos ene-22–oct-24; consulta del 2026-09-29
  supports_or_contests: contests
  notes: Con 2 o más meses, el peso es chico y estable. La variación entre años de la cifra con 1 mes viene de los
    regresos tras un solo mes en cero (137, 83 y 110).
- claim: 'Entre las altas limpias con M1 observado, no pagan en M1 el 8,1% (2022: 22 de 272), el 3,1% (2023: 20
    de 650) y el 3,6% (2024: 18 de 504).'
  source_id: S-DM-06
  source_type: data_model
  confidence: high
  freshness: Datos ene-22–oct-24; consulta del 2026-09-29
  supports_or_contests: context
  notes: Exigir «sigue pagando en M1» como nudo movería el conteo de nuevos entre 3% y 8%. 2024 excluye la cohorte
