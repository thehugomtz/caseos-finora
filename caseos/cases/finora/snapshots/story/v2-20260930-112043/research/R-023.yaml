alternative_explanations:
- Los regresos tras un solo mes sin pago pueden ser pagos atrasados o cobros fallidos (al volver pagan el doble),
  pausas que permite el producto o pagos registrados en el mes equivocado, más que churn real.
- 'Parte de los regresos tras un mes en los que se paga el monto usual pueden ser cancelaciones cortas reales (por
  ejemplo, negocios de temporada): no todo es ruido de cobro.'
- El vaivén del peso de las reactivaciones entre años (30%, 18%, 23%) puede venir de cambios en la cobranza y no
  del comportamiento de los clientes.
- Pagar el doble al volver también podría ser un cambio de plan a exactamente el doble de cantidad, no un pago atrasado.
- Parte de los «nuevos» de 2022 pueden ser exclientes con historia anterior a ene-22, que no vemos. Si es así, Reactivate
  está subestimado al comienzo de la ventana.
- Self Service puede existir como puerta de entrada pero no como compra sin humano (onboarding digital con contrato
  firmado por ventas). En ese caso el mix se reduce a Executive, Hybrid y Reactivate.
- Si la mayoría de los exclientes vuelve por KAM, una matriz de forma de venta × nuevo/regreso describe mejor que
  cuatro funnels excluyentes.
what_is_established:
- 'El modelo del caso no trae leads, contactos, oportunidades ni puerta: hoy no se puede medir el lado izquierdo
  del bowtie (S-DM-01).'
- Las reactivaciones observadas son el 30,4%, 17,7% y 22,6% de las entradas a pago por año si basta cualquier mes
  en cero, y el 7,1%, 8,1% y 8,6% si se exigen 2 o más meses (S-DM-02, S-DM-05).
- El 70,5% de los regresos llega tras un solo mes en cero. Al menos el 30% de esos, y el 29% de los que faltaron
  2 meses, pagan exactamente los meses faltantes más el actual (S-DM-04, S-DM-08).
- El 44% de los churns observados vuelve a pagar al mes siguiente (S-DM-03).
- 'ChartMogul y Chargebee definen la reactivación por la historia de pago y ninguno fija un plazo de inactividad.
  Además no coinciden en dónde ponerla: Chargebee la mete en expansión (S-EXT-03, S-EXT-04).'
- Una regla de prioridad donde gana la primera que coincide, con cola de respaldo, pone cada registro en una sola
  categoría (S-EXT-05).
- Clasificar por lo asignado y no por el tratamiento recibido evita sesgos de selección (S-EXT-06).
what_is_contested:
- ¿Separar funnels por puerta o un solo sistema híbrido? Hay quien advierte que separar crea silos (S-EXT-11). La
  respuesta es separar la medición, no los equipos, y registrar los pasos entre puertas.
- 'El orden de prioridad: ¿Reactivate antes que Executive? Si el CRO quiere que todo excliente grande vaya al KAM,
  Executive iría primero y Reactivate quedaría como atributo.'
- ¿Asignar la puerta al entrar o según cómo cerró la venta? La segunda opción sirve para el CAC y la compensación,
  pero se mueve con la capacidad.
- ¿Los regresos tras un solo mes son cobro o churn real? La señal de pago atrasado explica al menos el 30%; el resto
  es ambiguo.
- 'El nudo: Won, primer pago o suscripción activa (Q-050).'
what_remains_unknown:
- Si Finora tiene Self Service real, es decir, compra sin intervención humana (Q-046).
- Qué datos registra Finora al momento de la entrada (tamaño, intención, ajuste, canal) para aplicar la regla sin
  mirar el resultado.
- Si el ID de cuenta del CRM cruza con el «Cliente N» de pagos, y cómo se tratan las filiales.
- Si facturación guarda el estado de la suscripción, el período que cubre cada pago y la fecha de cancelación.
- Qué cuenta hoy el CRO como «nuevo» (¿incluye exclientes que vuelven?) y qué cantidad hay detrás de los montos
  múltiplos de 1.050 COP.
case_implication: 'Para Finora, el bowtie por puertas de C-005 se sostiene como marco. R-023 le suma tres cosas.
  Primero, Reactivate entra como cuarta puerta y con prioridad, porque describe la historia de la cuenta, no cómo
  compra; cómo vuelve cada excliente se guarda como atributo. Segundo, la puerta se asigna al abrir el episodio
  y no se cambia, para que un cambio en la capacidad comercial instalada no pase entradas de Hybrid a Self Service
  y arruine la comparación que necesitan H-006, H-028 y H-036. Tercero, el nudo común que se puede medir hoy es
  el primer pago, y lo que más cambia los números no es el nudo sino cuántos meses sin pago definen a un excliente:
  con 1 mes, las reactivaciones son 18–30% de las entradas a pago y cambian de un año a otro; con 2 o más, son 7–9%
  y estables. Frente al CRO y el CFO: todavía no podemos hablar de conversión por puerta porque no hay datos antes
  del primer pago. Sí podemos proponer la regla, los eventos que hay que registrar y una prueba rápida: que Finora
  etiquete desde el CRM a los pagadores 2022–2024. Esa prueba cierra Q-046 y pone a prueba H-036 y H-037.'
changes_current_story:
  value: maybe
  why: El bowtie por puertas (C-005) se mantiene, pero cambia en dos cosas si Hugo lo aprueba. Suma Reactivate como
    carril con prioridad y una regla fija desde la entrada. Y lo que más mueve los números pasa a ser cuántos meses
    sin pago definen a un excliente, no el nudo. Con 2 o más meses, la reactivación es un carril chico y estable
    (7–9%) y la versión fuerte de H-037 pierde fuerza. Con 1 mes, su peso cambia de un año a otro y parece ruido
    de cobro.
affected_hypotheses:
- id: H-006
  effect: requires_research
  why: 'El diseño dice cómo probarla: qué parte de las entradas Hybrid/Executive recibe primer contacto dentro del
    plazo acordado, cuánta carga tiene cada vendedor y si compran más las entradas atendidas que las no atendidas.
    Si la puerta no se fija al entrar, la propia capacidad contamina la prueba. Hoy no hay datos para medirla.'
- id: H-028
  effect: requires_research
  why: Para probarla hace falta, por cada episodio, cuánto encaja la cuenta al entrar, cuándo fue el primer contacto
    y cómo terminó. Sabnis et al. hacen plausible el mecanismo, pero es contexto, no evidencia de Finora.
- id: H-036
  effect: requires_research
  why: 'Para debilitarla o sostenerla hace falta la puerta etiquetada por cuenta y unida a los pagos; la regla y
    la etiqueta hacia atrás son el camino. La paradoja de Simpson respalda el mecanismo: un cambio de mezcla puede
    bajar el primer pago promedio aunque no cambie ninguna puerta.'
- id: H-037
  effect: changes_framing
  why: El peso de las reactivaciones solo cambia entre años (30%, 18%, 23%) si se cuentan los regresos tras un solo
    mes sin pago. Con 2 o más meses queda estable en 7–9%. La pregunta deja de ser «¿cambió el peso?» y pasa a ser
    «¿un mes sin pago es cobro atrasado o churn?».
affected_claims:
- id: C-005
  effect: changes_framing
  why: El bowtie por puertas se sostiene, pero pasa de tres puertas (Self Service, Assisted, Executive) a cuatro,
    con Reactivate como carril con prioridad. Hay que unificar «Assisted» con el «Hybrid» de Hugo y fijar el primer
    pago como nudo común (propuesta).
- id: Q-050
  effect: changes_framing
  why: 'Propuesta: el primer pago como nudo común, como en R-016, y Won como hito solo de Executive y Hybrid. Cambiar
    el nudo mueve el conteo de nuevos un 3–8%; el umbral de Reactivate lo mueve mucho más.'
- id: Q-046
  effect: requires_research
  why: La regla usa Self Service como categoría por defecto solo si existe compra sin humano. Si no existe, la categoría
    por defecto es Hybrid y el bowtie queda en Executive, Hybrid y Reactivate. Se decide con la etiqueta hacia atrás.
suggested_action: 'Proponer a Hugo que valide la regla (universo, unidad, momento y orden de prioridad) y que fije
  cuántos meses sin pago definen a un excliente, con una tabla que muestre cómo cambian los números según esa elección
  en la lámina. Antes de registrar eventos nuevos, pedir a Finora la etiqueta hacia atrás para los pagadores 2022–2024:
  si tuvieron oportunidad en el CRM, si tenían dueño KAM y la fecha del primer contacto, unidas a «Cliente N».'
new_questions:
- ¿Puede Finora exportar, para los pagadores de 2022–2024, si tuvieron oportunidad en el CRM y dueño KAM antes de
  su primer pago, y la fecha del primer contacto humano, con un ID que cruce con «Cliente N»?
- ¿Qué criterio usa hoy Finora (o su sistema de facturación) para dar a un cliente por cancelado, y registra el
  período que cubre cada pago?
- ¿Qué datos registra Finora al momento de la entrada (tamaño, industria, si pidió contacto, canal) que permitan
  asignar la puerta sin mirar el resultado?
handoff_to_cos:
  summary: 'R-023 propone el mix MECE como un bowtie por puertas con la puerta asignada al entrar: la unidad es
    cuenta × episodio, gana la primera regla que coincide en el orden Reactivate, Executive, Hybrid, Self Service
    y «sin clasificar», el nudo común es el primer pago, y cada puerta se lee por volumen, alcance, tiempo y estancamientos,
    con los mismos resultados después del nudo. En los datos, lo que más cambia los números es la definición de
    Reactivate (18–30% frente a 7–9% de las entradas a pago); el nudo cambia poco (3–8%).'
  recommended_next: 'Llevar a Hugo tres decisiones: el orden de prioridad y cuántos meses sin pago definen a un
    excliente (con tabla de cómo cambian los números), el primer pago como nudo, y si pedir a Finora la etiqueta
    hacia atrás de los pagadores 2022–2024 (cierra Q-046 y pone a prueba H-036 y H-037). Si aprueba, actualizar
    C-005 a cuatro puertas y pasar a Data Engineering la lista de eventos.'
confidence_buckets:
  high_confidence:
  - Con los datos actuales (pagos, industria, gasto S&M) no se mide ninguna etapa antes del primer pago, ni la puerta.
  - Según cuántos meses sin pago definan a un excliente, Reactivate pesa 18–30% (1 mes) o 7–9% (2 o más) de las
    entradas a pago por año.
  - El 70,5% de las reactivaciones observadas llega tras un solo mes en cero, y el 30% de esas paga al volver exactamente
    el doble de lo usual.
  - Una regla donde gana la primera que coincide, con cola de respaldo, pone cada registro en una sola categoría.
  - Una tasa de conversión mezclada entre puertas puede moverse solo porque cambia la mezcla.
  plausible:
  - Buena parte de los regresos tras un mes sin pago son pagos atrasados, no churn seguido de reactivación.
  - El primer pago es el único nudo común que se puede medir hoy para todas las puertas.
  - Asignar la puerta al entrar y no cambiarla evita que la capacidad contamine la mezcla.
  - 'El primer pago parece un precio por cantidad: sirve para revisar la regla, no para asignar la puerta.'
  contested:
  - 'Orden de prioridad: Reactivate antes que Executive.'
  - Separar funnels o mantener un solo sistema híbrido (riesgo de silos).
  - Asignar la puerta al entrar o según cómo cerró la venta, para el CAC y la compensación.
  - 'Nudo: Won, primer pago o suscripción activa.'
  unknown:
  - Si existe Self Service real (Q-046).
  - Qué datos registra Finora al momento de la entrada.
  - Si el ID del CRM cruza con «Cliente N».
  - Si facturación guarda el estado de la suscripción y el período que cubre cada pago.
  - Qué cuenta hoy el CRO como «nuevo».
specialist:
  measurement:
    problem_interpretation: 'Hugo pide un mix MECE de cuatro funnels. Las cuatro etiquetas mezclan dos cosas: cómo
      compra la cuenta (Executive, Hybrid, Self Service) y su historia (Reactivate = ya pagó antes). Para que cada
      lead caiga en un solo funnel hay que definir cuatro cosas antes de cualquier métrica: 1) el universo: qué
      entra al mix y qué no (los clientes que ya pagan van a expansión); 2) la unidad: cuenta × episodio, no la
      persona; 3) el momento: al entrar, con información previa al contacto; 4) un orden de prioridad con una categoría
      de respaldo. Con los datos del caso solo se ve del primer pago hacia adelante; el lado izquierdo del bowtie
      hay que registrarlo.'
    measurement_objective: Que el CRO y el CFO puedan decidir dónde poner capacidad comercial (SDR, AE, KAM) y presupuesto
      de demanda en cada puerta, y separar adquisición de reactivación. Para eso se mide, dentro de cada puerta,
      el alcance y el tiempo entre hitos, y después del primer pago los mismos resultados económicos para todas,
      sin una tasa de conversión mezclada.
    recommended_framework:
      name: 'Bowtie por puertas con asignación al entrar (regla de prioridad: gana la primera que coincide)'
      structure: '1) Universo: cada episodio de entrada de una cuenta que hoy no paga. Los clientes activos no entran
        al mix: van al lado derecho del bowtie (expansión). 2) Unidad: cuenta × episodio; los leads (personas) se
        agrupan en su cuenta. El episodio se cierra con el primer pago, con la pérdida o tras X días sin actividad;
        un intento nuevo abre otro episodio. 3) Momento: la puerta se asigna al abrir el episodio, solo con información
        previa al contacto, y no se cambia. 4) Regla (propuesta: se evalúa de arriba abajo, gana la primera que
        coincide, con versión): a) Reactivate: la cuenta pagó antes y tiene cancelación confirmada o N meses o más
        sin pagar (cómo vuelve se guarda como atributo); b) Executive: cuenta nombrada o de KAM, o cumple el criterio
        de tamaño al entrar; c) Hybrid (C-005 la llama Assisted): pidió contacto humano o cumple el criterio para
        pasar a SDR/AE; d) Self Service: entra por producto o checkout sin cumplir ninguno de los criterios anteriores
        (solo si Q-046 confirma compra sin humano; si no, la categoría por defecto es Hybrid); e) Sin clasificar:
        respaldo, meta cercana a 0. 5) Etapas como hitos, que se pueden saltar. Self Service: entrada → activación
        (si hay prueba) → checkout → primer pago. Hybrid: entrada → primer contacto humano → calificada (SQL) →
        propuesta/demo → Won → primer pago. Executive: cuenta objetivo → primera reunión → oportunidad calificada
        → propuesta/negociación → Won → primer pago. Reactivate: excliente elegible → contacto o regreso por su
        cuenta → primer pago de regreso. 6) Nudo común: el primer pago; Won es hito solo de Executive y Hybrid.
        7) Lado derecho, igual para todas: M0, pago mensual temprano (M1–M3), retención de clientes y de monto pagado
        en M3, M6 y M12, y expansión. 8) Lectura: por puerta se ven volumen, alcance a W días, tiempo entre hitos
        y estancamientos, y después del nudo los resultados comunes; nunca una tasa mezclada. Si un humano ayuda
        a una entrada Self Service, se registra como escalamiento y la puerta no cambia.'
      why: 'Es MECE por construcción: universo, unidad, momento y orden con respaldo, como funcionan las reglas
        de asignación de los CRM. Fija la puerta antes de que alguien atienda, así la capacidad no contamina la
        mezcla (lógica de intención de tratar). Separa reactivación de adquisición, como hacen las herramientas
        de facturación. Compara las puertas por resultados económicos comunes después del nudo (bowtie) y mide hitos
        en vez de forzar un embudo lineal. Evita la tasa mezclada, que puede moverse solo por la mezcla (Simpson).
        Y deja H-006, H-028, H-036 y H-037 comprobables con eventos concretos.'
    alternative_frameworks:
    - name: Matriz de forma de venta × historia (3 formas de venta × nuevo/regreso)
      when_better: Cuando los exclientes que vuelven son muchos y regresan por distintas formas de venta (por ejemplo,
        buena parte por KAM), o cuando el CRO quiere ver Reactivate dentro de cada equipo.
      tradeoff: No pierde información, pero da 6 celdas, varias con poco volumen, y es más difícil de leer en una
        lámina. La propuesta recomendada guarda cómo vuelve cada excliente como atributo, así que la matriz se puede
        armar después.
    - name: Clasificación según cómo cerró la venta (¿hubo un humano antes de pagar?)
      when_better: Para repartir costos (CAC por forma de venta), la compensación y medir cuánta capacidad se usó.
        Además es lo único que se puede reconstruir hacia atrás desde el CRM.
      tradeoff: La etiqueta depende de la capacidad y del resultado. Si los SDR se saturan, entradas pasan de Hybrid
        a «Self Service» y las tasas por puerta cambian aunque la demanda no cambie. Confunde justo H-006, H-028
        y H-036.
    metric_definitions:
    - metric: Entradas por puerta (volumen)
      definition: Episodios de entrada abiertos en el período, por puerta asignada.
      formula: COUNT(DISTINCT episodio_id) con entry_ts en el período, agrupado por puerta_asignada
      grain: Cuenta × episodio; se reporta por semana o mes de entrada
      milestone: Apertura del episodio (entry_created)
      notes: 'Hoy no existe: el modelo solo trae pagos. «Sin clasificar» se reporta aparte.'
    - metric: Alcance de hito a W días (tasa)
      definition: Proporción de una cohorte de entrada que llega a un hito dentro de W días desde la entrada.
      formula: COUNT(episodios de la cohorte con hito_k_ts ≤ entry_ts + W) ÷ COUNT(episodios de la cohorte)
      grain: Cohorte de entrada (mes) × puerta × hito; W = 30, 60 y 90 días
      milestone: Entrada
      notes: Mide alcance, no conversión paso a paso, así que admite etapas saltadas (Self Service no pasa por SQL).
        La ventana fija evita castigar a las cohortes recientes. Nunca se suma entre puertas en una sola tasa.
    - metric: Tiempo entre hitos (velocidad)
      definition: Días entre dos hitos del mismo episodio, contando solo a quienes llegaron al segundo.
      formula: Mediana y percentil 75 de (hito_k_ts − hito_j_ts). Para episodios abiertos, curva de supervivencia
        (episodios aún sin cerrar).
      grain: Episodio; se reporta por cohorte de entrada × puerta
      milestone: Hito de origen (entrada o Won)
      notes: 'Pares clave: entrada → primer contacto humano (Hybrid, Executive), entrada → primer pago (todas),
        Won → primer pago (Executive, Hybrid).'
    - metric: Estancamientos a N semanas
      definition: Episodios abiertos que llevan más de N semanas sin avanzar de etapa.
      formula: COUNT(episodios abiertos en la etapa k con hoy − último_hito_ts > N semanas) ÷ COUNT(episodios abiertos
        en la etapa k)
      grain: Foto semanal × puerta × etapa
      milestone: Último hito alcanzado
      notes: 'N distinto por puerta: Executive tiene ciclos más largos. Se calibra con datos de Finora.'
    - metric: Cobertura de primer contacto dentro del plazo acordado (capacidad)
      definition: Entradas Hybrid y Executive con primer contacto humano dentro de X horas, y entradas que siguen
        sin contacto a los 30 días.
      formula: COUNT(primer_contacto_ts − entry_ts ≤ X h) ÷ COUNT(entradas); COUNT(sin contacto a 30 días) ÷ COUNT(entradas)
      grain: Cohorte semanal de entrada × puerta × nivel de ajuste
      milestone: Entrada
      notes: Es la métrica que sostiene o debilita H-006 y H-028. Se lee junto con la carga por vendedor.
    - metric: Carga por vendedor
      definition: Episodios abiertos asignados a cada vendedor activo, por rol.
      formula: COUNT(episodios abiertos con dueño del rol r) ÷ COUNT(vendedores activos del rol r)
      grain: Semana × rol (SDR, AE, KAM)
      milestone: Asignación de dueño
      notes: Cuenta todos los episodios del vendedor, sea cual sea la puerta (un KAM también atiende Reactivate).
        raw.sm_spend no trae número de personas por rol.
    - metric: Tasa de escalamiento (hibridación)
      definition: Entradas Self Service que reciben ayuda humana antes del primer pago.
      formula: COUNT(episodios Self Service con human_touch_ts antes de first_payment_ts o sin pago) ÷ COUNT(episodios
        Self Service)
      grain: Cohorte de entrada × puerta Self Service
      milestone: Entrada
      notes: 'No cambia la puerta: registra la ayuda recibida. Si es alta, Self Service existe como puerta de entrada
        pero no como compra sin humano (Q-046).'
    - metric: Llegada al nudo y monto del primer pago por puerta (valor)
      definition: Episodios que llegan al primer pago en W días, y monto del primer pago observado (M0).
      formula: COUNT(first_payment_ts ≤ entry_ts + W) ÷ COUNT(episodios); mediana, p25 y p75 de M0 por puerta
      grain: Cohorte de entrada × puerta; M0 en COP
      milestone: Primer pago (nudo)
      notes: Hoy solo existe el total, sin puerta (mart.new_customers). Es monto pagado observado, no MRR contratado.
    - metric: Retención de clientes y de monto pagado por cohorte de puerta
      definition: Proporción de la cohorte que sigue pagando en M3, M6 y M12, y monto pagado en ese mes frente al
        monto de M0.
      formula: activos_en_Mk ÷ tamaño_cohorte; Σ monto_Mk ÷ Σ monto_M0 (misma cohorte)
      grain: Cohorte de primer pago (mes) × puerta
      milestone: Primer pago
      notes: Resultado económico común a todas las puertas. El churn se confirma con el mismo umbral N que Reactivate.
    - metric: Peso de Reactivate en las entradas a pago
      definition: Exclientes que vuelven ÷ (primeras apariciones + exclientes que vuelven), con un mínimo de N meses
        sin pagar.
      formula: reactivaciones con N o más meses en cero ÷ (nuevos + reactivaciones con N o más meses en cero)
      grain: Mes o año
      milestone: Primer pago de regreso
      notes: 'Muy sensible a N: 18–30% con 1 mes y 7–9% con 2 o más (S-DM-02, S-DM-05). Si además se excluye a quienes
        pagan los meses atrasados, quedan 112 de 468 regresos (S-DM-08). Reportar siempre con su N.'
    - metric: Costo por entrada a pago por puerta
      definition: Gasto S&M asignado a la puerta ÷ primeros pagos de esa puerta.
      formula: (gasto de demanda asignado por canal y puerta + gasto de capacidad asignado por rol o tiempo) ÷ primeros
        pagos de la puerta
      grain: Trimestre × puerta
      milestone: Primer pago
      notes: Es un reparto de costos, no una relación causal. raw.sm_spend no tiene puerta y su unidad no está documentada.
    - metric: Revisión de la regla
      definition: 'Calidad de la partición: entradas sin clasificar, reasignaciones manuales y diferencia de monto
        entre puertas.'
      formula: sin_clasificar ÷ entradas; episodios con cambio manual de puerta ÷ entradas; mediana de M0 por puerta
      grain: Mes × versión de la regla
      milestone: Entrada (sin clasificar, reasignación) y primer pago (M0)
      notes: Si Executive no entra con montos mayores que Self Service, la regla no está separando por valor. M0
        sirve para revisar la regla, no para asignar la puerta.
    required_events:
    - event: entry_created (apertura del episodio + puerta asignada)
      trigger: 'Primera señal de entrada de una cuenta que hoy no paga: registro, formulario, pedido de contacto,
        cuenta objetivo creada por un KAM, o pago o contacto de un excliente.'
      properties:
      - account_id (que cruce con «Cliente N»)
      - episode_id
      - person_ids del grupo comprador
      - entry_ts
      - canal o fuente de entrada
      - pidió contacto humano (sí/no)
      - tamaño al entrar
      - industria
      - nivel de ajuste (precalificación)
      - 'historia previa: pagó antes, último mes pagado, meses sin pagar'
      - puerta_asignada
      - criterio que coincidió
      - versión de la regla
      - dueño o cola asignada
    - event: human_touch
      trigger: Cada contacto de ida y vuelta de un SDR, AE o KAM con el episodio (llamada que conecta, reunión realizada,
        respuesta a un correo).
      properties:
      - episode_id
      - rep_id
      - rol (SDR, AE, KAM)
      - tipo de contacto
      - ts
      - entrante o saliente
      - es el primer contacto (sí/no)
    - event: stage_changed
      trigger: Cambio de etapa en el CRM o hito del producto.
      properties:
      - episode_id
      - etapa_origen
      - etapa_destino
      - ts
      - quién lo hizo (sistema o vendedor)
    - event: self_serve_milestone
      trigger: Primera acción de valor en el producto, o inicio del checkout (Self Service).
      properties:
      - account_id
      - episode_id
      - tipo (activación o checkout)
      - ts
      - plan o cantidad elegida
    - event: escalated
      trigger: Una entrada Self Service pide ayuda o muestra una señal que la manda a un humano.
      properties:
      - episode_id
      - motivo o señal
      - ts
      - cola o vendedor que la recibe
      - 'nota: la puerta no cambia'
    - event: opportunity_won
      trigger: Firma o aceptación de la propuesta (Executive, Hybrid).
      properties:
      - episode_id
      - monto contratado
      - plazo
      - frecuencia de facturación
      - plan o cantidad
      - ts
    - event: first_payment (nudo)
      trigger: Primer cobro exitoso del episodio.
      properties:
      - account_id
      - episode_id
      - monto
      - meses que cubre el pago
      - plan o cantidad
      - ts
      - primer pago de la cuenta o pago de regreso
    - event: subscription_status_changed
      trigger: Cambio de estado en facturación.
      properties:
      - account_id
      - estado (activa, vencida, pausada, cancelada)
      - motivo
      - fecha efectiva
      - quién la inició (el cliente o la falta de pago)
    - event: episode_closed_lost
      trigger: El vendedor o la regla cierra el episodio sin pago, o se cumple la ventana de X días sin actividad.
      properties:
      - episode_id
      - motivo (no encaja, sin respuesta, precio, competencia, momento)
      - etapa al cierre
      - ts
      - hubo contacto humano (sí/no)
    required_dimensions:
    - dimension: Puerta asignada (Executive, Hybrid, Self Service, Reactivate, Sin clasificar)
      why: 'Es la partición MECE: todo se reporta por puerta.'
    - dimension: 'Forma de venta real (hubo contacto humano antes del nudo: sí/no; rol)'
      why: Separa la ayuda recibida de la puerta asignada. Es la base de H-006, H-028 y del CAC por forma de venta.
    - dimension: Cohorte de entrada (mes) y cohorte de primer pago (mes)
      why: Permite comparar por antigüedad sin castigar a las cohortes recientes.
    - dimension: Nivel de ajuste al entrar
      why: 'H-028: ver si se dejan sin trabajar primero las entradas que parecen peores.'
    - dimension: Tamaño al entrar
      why: Es el criterio de Executive; se revisa contra M0.
    - dimension: Canal o fuente de entrada
      why: Sirve para repartir el gasto de demanda por puerta; el canal no es una puerta.
    - dimension: Historia previa (nuevo o excliente, meses sin pagar)
      why: Define Reactivate y muestra cómo cambian los números según N.
    - dimension: Rol y vendedor (SDR, AE, KAM)
      why: Carga por vendedor y cobertura del plazo acordado (capacidad comercial instalada).
    - dimension: Industria
      why: Ya existe en el modelo; permite controlar la mezcla entre puertas.
    - dimension: Versión de la regla
      why: Si la regla cambia, las series solo se pueden comparar sabiendo qué versión se aplicó.
    decision_enabled: '1) Capacidad o demanda. Si en Hybrid y Executive sube la carga por vendedor, cae la cobertura
      de primer contacto dentro del plazo y las entradas atendidas siguen comprando igual, el problema es de capacidad
      comercial instalada (H-006): contratar o reasignar. Si la cobertura se mantiene y la compra cae dentro del
      mismo nivel de ajuste, el problema es de calidad o de mezcla (H-005 y H-028). 2) Si Reactivate merece una
      forma de venta propia (campañas de reactivación, KAM) o es un tema de cobranza. 3) Si la baja del primer pago
      promedio viene de una mezcla que se inclina hacia una puerta de menor valor (H-036) o de una baja dentro de
      cada puerta: pricing o packaging frente a adquisición. 4) Qué nudo reportar al CFO (Q-050).'
    limitations:
    - 'Los datos del caso (pagos, industria, gasto S&M) no traen leads, contactos, oportunidades ni puerta: hoy
      no se puede calcular ninguna métrica del lado izquierdo ni afirmar nada sobre la conversión del funnel.'
    - La primera transacción observada es la primera aparición, no la adquisición. La historia anterior a ene-22
      no se ve, así que Reactivate está subestimado al comienzo de la ventana.
    - 'El monto es monto pagado observado, no MRR contratado. Los meses en cero pueden ser de cobro y no churn:
      el 44% de los churns observados vuelve al mes siguiente.'
    - Asignar la puerta al entrar responde «qué pasa con las entradas asignadas a la puerta X», no «cuánto cambia
      el resultado por un contacto humano». Para eso hace falta un experimento.
    - 'El orden de prioridad es una decisión de negocio: si cambia, cambian los conteos. Hay que guardar la versión.'
    - Repartir el gasto S&M entre puertas es una convención, no una relación causal. raw.sm_spend no tiene puerta
      y su unidad no está documentada.
    - 'Los benchmarks externos (Gartner, Sabnis et al., Oldroyd et al.) son contexto: no dicen nada de Finora.'
    - Si Finora no registra datos al momento de la entrada, la regla no se puede aplicar hacia atrás. La etiqueta
      hacia atrás solo dirá quién atendió de hecho a cada cliente, y eso tiene sesgo.
    implementation_implications:
    - 'Data Engineering: una tabla de episodios (cuenta × episodio) con la puerta asignada, la versión de la regla,
      el criterio que coincidió y la fecha de cada hito, más una tabla que una la cuenta del CRM con «Cliente N».
      Hay que decidir si una filial nueva cuenta como cuenta nueva o como expansión.'
    - 'Facturación: registrar el período que cubre cada pago y el estado de la suscripción (activa, vencida, pausada,
      cancelada), para dejar de deducir churn y reactivación a partir de los meses en cero.'
    - 'Un solo umbral N define tanto el churn confirmado como la entrada a Reactivate. Mientras no haya estado de
      facturación, regla provisional para el histórico: 2 o más meses en cero, y que el pago de regreso no sea exactamente
      los meses faltantes más el actual. Con esa regla quedan 112 de 468 reactivaciones observadas.'
    - 'RevOps/CRM: programar la regla con versiones (gana la primera que coincide) y una cola de «sin clasificar».
      Reporte semanal de sin clasificar y de reasignaciones manuales, y revisión posterior con M0 por puerta.'
    - 'Prueba rápida antes de registrar eventos nuevos: etiquetar hacia atrás a los pagadores 2022–2024 con lo que
      pasó de hecho (¿oportunidad en el CRM antes del primer pago?, ¿dueño KAM?, fecha del primer contacto), dejando
      claro su sesgo. Decide Q-046 y es la primera prueba de H-036 y H-037.'
    - 'Analytics: láminas por puerta con volumen, alcance a W días, tiempo y estancamientos, más los resultados
      comunes después del nudo. Ninguna tasa mezclada, y cada cifra de Reactivate con su N.'
    - 'Para saber si el contacto humano causa la compra (H-006): experimento dentro de Hybrid. Unidad: el episodio.
      Tratamiento asignado al azar: plazo corto de contacto frente a la cola normal. Métrica: primer pago a 60 días.
      Controles: retención en M3 y M0. La diferencia mínima detectable se calcula con los volúmenes de Finora, que
      hoy no conocemos.'
