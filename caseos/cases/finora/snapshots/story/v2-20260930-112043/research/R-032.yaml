task:
  work: propuesta
  draft_answer: 'De arranque, en tres cortes: 1) ¿la brecha es real o de medición? (medición: cómo se cuentan los
    leads, cómo se registra el CRM, tiempo o rezago); 2) si es real, ¿en qué tramo se pierde? (entrada, contacto,
    calificación, cierre o pago); 3) en ese tramo, ¿por qué? (demanda, calidad, capacidad y velocidad, oferta y
    precio). Cada hoja con una prueba y un dato; las causas de R-025 y H-052 a H-057 se acomodan en el árbol sin
    repetirse.'
  hugo_said:
  - text: lo mismo en C-023mucho artefacto pero no hay nada MECE, me confunde
    ref: N-051
  steps:
  - kind: proposal
    what: Árbol MECE en 2–3 niveles, con la regla de corte de cada nivel y la prueba de que las ramas no se traslapan
      ni dejan huecos.
    where: []
  - kind: proposal
    what: 'Por hoja: qué tendría que ser cierto, qué la descarta, dato mínimo, si existe hoy o hay que pedirlo y
      qué palanca del CRO mueve; cada causa de R-025 y H-052 a H-057 en una sola hoja.'
    where: []
  - kind: proposal
    what: 'Una versión para lámina que se lea sin la palabra «artefacto»: medición vs negocio, con nombres claros.'
    where: []
requested_via: vía Claude (Hugo lo pidió en el chat, 29-sep, revisión del Story v2)
why_it_matters: Si la misma caída se cuenta en dos ramas o cae en la rama equivocada, el CRO mueve la palanca equivocada;
  por ejemplo, contrata SDR cuando el problema es que New cuenta clientes actuales. Además, el árbol define el pedido
  mínimo de datos a Finora, porque hoy ninguna hoja se puede probar con el modelo.
short_answer: 'Propongo ordenarlo por la identidad del cociente ventas/leads y no por áreas: Paso 0 fija qué es
  «venta» y la ventana por cohortes. Luego vienen, en orden: (1) el aumento de New no es demanda nueva comprable
  (H-052 no-prospectos, desfase o cambio de definición, H-053 misma demanda por otra puerta); (2) entra peor mezcla
  (H-005, solo con señales congeladas al crear el lead); (3) con entradas comparables, la caída está antes del SQL
  (H-006 primer toque, H-055 estancados); (4) está después del SQL (H-054 como exceso del SQL del SDR; la parte
  común va al avance del AE y a H-056); o (5) no llega al cobro (H-057). H-007 es la regla que ubica la caída, no
  una causa. La confianza es alta en la estructura, porque cada pedazo de brecha cae en un solo término, y baja
  sobre qué hoja explica a Finora, porque el modelo no tiene leads. Lo único que ya muestran los pagos es que la
  brecha depende de la unidad y de la ventana: en mar–oct las altas pasan de 433 (2023) a 465 (2024), pero en T3
  pasan de 187 a 153; y el arranque (paga M0 y no M1) es bajo y estable.'
