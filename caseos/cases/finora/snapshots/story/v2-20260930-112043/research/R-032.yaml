alternative_explanations:
- El «más leads» es un cambio de conteo (formulario nuevo, fuente integrada, deduplicación que dejó de correr) y
  no más demanda.
- 'Las ventas sí crecieron en logos pero no en valor, o al revés: en los pagos, el valor por alta está por debajo
  de 2022 aunque las altas de mar–oct crecieron.'
- 'El ciclo se alargó y las cohortes del aumento todavía no maduran: comparar leads del mes con ventas del mes fabrica
  la brecha.'
- 'Cayó el entorno de demanda (presupuestos, no-decisión): la caída sería común a todos los motions, incluido el
  self-serve sin toque, y no es palanca del CRO.'
- 'Estacionalidad o elección de ventana: T2-2024 tuvo más altas que T2-2023 y T3-2024 menos que T3-2023.'
- 'Atribución: ventas influidas por el SDR que se registran como self-serve (o al revés) mueven la conversión del
  funnel sin cambiar el total.'
what_is_established:
- El modelo no tiene leads, estados del CRM, oportunidades ni registros de producto (DM-01).
- 'Altas de mar–oct: 227 (2022), 433 (2023) y 465 (2024); entre 2023 y 2024, T2 pasa de 144 a 219 y T3 de 187 a
  153 (DM-02, DM-04).'
- 'Monto del primer pago por alta en mar–oct: promedio de 118.771 → 45.002 → 52.828 COP y mediana de 63.000 → 35.280
  → 42.000 COP (DM-02, DM-03).'
- 'Las altas que no pagan en M1 son pocas y no crecen: 7,5% → 2,8% → 3,1% (DM-03).'
- 'Método: un árbol MECE de hipótesis exige hojas falsables y prueba de doble conteo, y mezcla y tasa se leen por
  separado (W-01, W-02).'
what_is_contested:
- 'Que haya habido «más leads», en qué meses y en qué motion: es la lectura del CRO, sin dato en el modelo.'
- 'Qué cuenta el CRO como «venta»: Won, primer pago o monto del primer pago.'
- Si los benchmarks de velocidad de respuesta (HBR 2011) y de comisiones del SDR (TTEC) aplican a Finora.
- Si una caída en la aceptación del AE refleja SQL inmaduros o un cambio de criterio del propio AE.
what_remains_unknown:
- Volumen de leads por mes y motion, y cuántos son duplicados, clientes actuales, ex-clientes o spam.
- Historial de estados con fecha y si el CRM lo guarda para el periodo base.
- Headcount SDR/AE por semana y fechas de cambios en comisiones, criterio de SQL, precios, planes y formularios.
- Registros de producto y marca de toque comercial por venta (Self-serve vs Hybrid).
- Llave Won ↔ customer_id, pagos fallidos y plazo entre Won y primer pago.
case_implication: 'Para Finora, C-023 ya se puede presentar como estructura: un Paso 0 y cinco ramas con diez hojas,
  cada una con su firma observable, qué la valida, qué la descarta, el dato mínimo y la palanca del CRO; H-007 queda
  como regla para ubicar, no como causa. Lo que todavía no podemos defender ante el CRO y el CFO es qué hoja explica
  la brecha, porque el modelo no tiene un solo lead. Lo que sí podemos decir con datos es que «más leads, no más
  ventas» depende de cómo se mida la venta: en mar–oct las altas crecieron (433 → 465) y el monto del primer pago
  por alta subió frente a 2023 pero sigue debajo de 2022; en cambio, T3-2024 tuvo menos altas que T3-2023 (153 vs
  187) con más gasto de generación de demanda. Por eso la primera conversación con el CRO no es sobre una causa,
  sino sobre una definición (unidad de venta, ventana, New separado de Reactivate). El hueco central del WoW es
  no tener leads con historial de estados unidos a customer_id; el pedido mínimo de datos sale directo de la columna
  «dato mínimo» del árbol.'
changes_current_story:
  value: maybe
  why: Confirma el orden de C-011 y da forma a C-023, pero agrega un Paso 0 que puede cambiar el titular. Si el
    CRO mide la venta como altas de mar–oct, las ventas sí crecieron; si mide T3 o el valor frente a 2022, no. Hasta
    fijar la unidad y la ventana, la historia no puede afirmar que exista la brecha, solo cómo se repartiría.
affected_hypotheses:
- id: H-052
  effect: changes_framing
  why: 'Queda como hoja 1.1, la primera en revisarse. Se amplía: los ex-clientes que entran como New pertenecen
    a Reactivate. Se prueba cruzando leads con customer_id; hoy no hay leads.'
- id: H-053
  effect: requires_research
  why: Hoja 1.3. Su prueba decisiva es el cruce de identidad (¿los New del aumento ya tenían registro en el producto?)
    junto con la caída de las compras self-serve sin toque; para causalidad hace falta un holdout de ruteo. El modelo
    no distingue motions.
- id: H-005
  effect: changes_framing
  why: Solo cuenta como hoja ToFu (2.1) la parte de mezcla medida con señales congeladas al crear el lead. La calidad
    no observada cae en las ramas de tasa, así que H-005 no puede usarse como residuo de todo lo demás.
- id: H-006
  effect: changes_framing
  why: 'Se parte en dos hojas con firmas distintas: primer toque del SDR (3.1) y avance del AE (4.2). Es la misma
    causa en dos etapas, no la misma caída contada dos veces.'
- id: H-055
  effect: requires_research
  why: Hoja 3.2. Frente a calidad, la discrimina la compra de los estancados que se retoman; si el estancamiento
    sigue a la carga, la palanca es capacidad y no cadencia.
- id: H-054
  effect: changes_framing
  why: Hoja 4.1, medida como el exceso de caída post-SQL del SQL del SDR sobre el SQL directo, más la aceptación
    del AE según el origen. La parte común de la caída va a 4.2 o 4.3.
- id: H-056
  effect: requires_research
  why: 'Hoja 4.3. Los motivos del CRM no bastan (15% de coincidencia con compradores en W-07): hacen falta una muestra
    de entrevistas y las fechas de los cambios de oferta.'
- id: H-057
  effect: weakens
  why: 'El arranque visible (altas que pagan M0 y no M1) es bajo y no crece: 7,5% → 2,8% → 3,1%. El tramo Won →
    primer pago sigue sin datos, así que la hoja 5.1 no se descarta.'
- id: H-007
  effect: changes_framing
  why: 'Pasa a ser la regla que asigna la caída a una etapa en las Ramas 3 a 5: ubica, no explica.'
affected_claims:
- id: C-023
  effect: supports
  why: La matriz queda con diez hojas, cada una con qué la valida, qué la descarta, el dato mínimo y la palanca
    del CRO; se puede presentar ya como estructura, con la columna «hoy se puede / no se puede».
- id: C-011
  effect: changes_framing
  why: El orden se mantiene (artefactos primero, luego ToFu, MoFu y BoFu), pero se agregan un Paso 0 (qué es venta,
    ventana por cohortes, New separado de Reactivate) y una rama posterior al Won.
suggested_action: 'Propongo dos pasos en paralelo para que Hugo decida. Primero, llevar al CRO las tres definiciones
  del Paso 0 (unidad de venta, ventana W, New separado de Reactivate) y preguntarle en qué meses y en qué motion
  vio «más leads». Segundo, pedir a Finora el paquete mínimo del árbol: export de leads con historial de estados;
  oportunidades con origen del SQL, decisión del AE y motivo de pérdida; registros de producto; equipo SDR/AE por
  semana; y bitácora de cambios (formularios, criterio de SQL, comisiones, precios), todo con llave a customer_id.
  Mientras llega, se puede armar la lámina de C-023 con las cifras de pagos como contexto, no como evidencia de
  conversión.'
new_questions:
- ¿Qué cuenta el CRO como «venta» (Won, primer pago o monto del primer pago) y en qué meses y en qué motion vio
  «más leads»?
- ¿El CRM de Finora guarda el historial de estados con fecha (New, Working SDR, Engaged, SQL) y el origen del SQL,
  y desde qué mes?
- '¿Qué cambió, y en qué fecha, durante el aumento: formularios o fuentes, criterio de SQL, comisiones del SDR,
  headcount, precios o planes?'
handoff_to_cos:
  summary: 'R-032 entrega el árbol MECE de «más leads, no más ventas»: un Paso 0 y cinco ramas con diez hojas, cada
    una con firma observable, test, dato mínimo y palanca del CRO. Ordena H-052 a H-057, H-005 y H-006; H-007 queda
    como regla de ubicación. Ninguna hoja de las Ramas 1 a 4 se puede probar con el modelo (no hay leads); los pagos
    solo muestran que la brecha depende de la unidad y la ventana, y que el arranque (M0 sin M1) es bajo y estable.'
  recommended_next: 'Que Hugo decida si lleva el Paso 0 al CRO y si aprueba el pedido mínimo de datos a Finora.
    En paralelo: armar la lámina de C-023 con la columna «hoy se puede / no se puede», y que Data Engineering diseñe
    leads, historial de estados, oportunidades y registros de producto con llave a customer_id.'
confidence_buckets:
  high_confidence:
  - Aplicada en orden, la estructura Paso 0 + cinco ramas reparte la brecha sin doble conteo.
  - Hoy no se puede validar ni descartar ninguna hoja de las Ramas 1 a 4 con el modelo.
  - Las cifras de altas, monto del primer pago, reactivaciones y arranque del lado de pagos.
  plausible:
  - Que la baja de valor por alta desde 2022 sea en parte mezcla (más Retail) y en parte tasa (baja dentro de 5
    de 6 industrias).
  - Que capacidad, estancamiento e incentivos del SDR se distingan por sus firmas (tiempo y carga; retomados; origen
    del SQL).
  - Que el arranque (paga M0 y no M1) no explique una brecha creciente.
  contested:
  - 'Que la brecha exista tal como la describe el CRO: ventana, motion y unidad de venta sin definir.'
  - Que los benchmarks externos (HBR 2011, TTEC, Clozd) describan a Finora.
  unknown:
  - Qué hoja explica la brecha en Finora.
  - Si el CRM conserva el historial del periodo base.
  - Qué cambió (comisiones, precios, formularios, headcount) y cuándo.
specialist:
  measurement:
    problem_interpretation: Hugo pide un árbol de causas de «más leads, pero no más ventas» donde cada brecha observada
      caiga en una sola rama, con test (qué valida, qué descarta), dato mínimo y palanca del CRO por hoja. En clave
      de medición, la brecha es un cociente (ventas / leads) que cambia entre dos periodos y mezcla motions (Sales-assisted,
      SQL directo, Self-serve, Hybrid, Reactivate). Para asignarla sin doble conteo hay que nombrar primero unidad,
      grano e hito, y después descomponer la brecha en orden según la identidad, no según opiniones. El modelo actual
      solo ve el lado de las ventas (primeros pagos), no el de los leads.
    measurement_objective: Asignar el cambio en la conversión de cohorte (entrada válida → venta dentro de W días)
      entre el periodo base (P0) y el del aumento (P1) a exactamente una hoja del árbol, por motion, para que el
      CRO elija una palanca y sepa si seguir comprando volumen de leads o invertir en conversión.
    recommended_framework:
      name: Árbol MECE de la brecha por identidad, con cohortes y motions separados
      structure: 'Unidad, grano e hito: Sales-assisted cuenta leads válidos desde su creación; SQL directo, SQL
        desde su creación; Self-serve/Hybrid, registros de producto; Reactivate, ex-clientes. Grano: cohorte semanal
        o mensual de creación. Resultado: «venta» (a acordar: Won o primer pago) dentro de una ventana W igual para
        el periodo base (P0) y el del aumento (P1).

        Identidad: ventas = Σ por motion [entradas válidas × Π conversión por etapa a W]. La brecha es conv(P1)
        − conv(P0) por motion y se reparte en este orden, de modo que cada pedazo cae en un solo término: validez
        → puerta → mezcla vs tasa (Σ Δmezcla × tasa P0 + Σ mezcla P1 × Δtasa, con regla fija para el término cruzado)
        → etapa (Δln conv = Σ Δln de cada paso) → cobro.


        PASO 0 · Definir la brecha (es una puerta, no una rama): unidad de venta, W, cohortes por fecha de creación
        y New separado de Reactivate. Hoy solo existe el lado de pagos.


        RAMA 1 · El aumento de New no es demanda nueva comprable (artefactos; van primero)

        1.1 No-prospectos (H-052). Firma: sube la proporción de duplicados, clientes actuales, ex-clientes o spam
        en New. Valida: al quitarlos, la brecha se cierra en esa magnitud. Descarta: proporción baja y estable,
        o la brecha sigue igual sin ellos. Dato mínimo: export de leads (id, fecha, email/dominio, fuente) cruzado
        con customer_id y con leads previos. Palanca CRO: definición de lead válido, deduplicación, ruteo de clientes
        a CS y de ex-clientes a Reactivate.

        1.2 Lectura: desfase o cambio de definición (hoja nueva, sin ID). Firma: las cohortes recientes aún no maduran,
        o cambió qué se cuenta como lead o como venta. Valida: con cohortes a W iguales la conversión no cae, o
        el aumento empieza con un formulario, fuente o definición nueva. Descarta: la caída sigue en cohortes maduras
        y no hubo cambios. Dato mínimo: fechas de creación, Won y primer pago por lead, más la bitácora de cambios.
        Palanca CRO: reporte por cohortes a W y diccionario de etapas congelado.

        1.3 Misma demanda por otra puerta (H-053). Firma: los New del aumento ya tenían registro en el producto
        y las compras self-serve sin toque bajan cuando suben los leads. Descarta: sin registro previo y self-serve
        estable. Dato mínimo: registros de producto cruzables con leads y marca de toque comercial por venta. Palanca
        CRO: reglas de ruteo y de crédito por motion; para causalidad, holdout de ruteo.


        RAMA 2 · Entra demanda nueva con menor probabilidad de compra (ToFu)

        2.1 Mezcla al entrar (H-005). Firma: el término de mezcla, es decir, más peso de bandas que siempre convirtieron
        poco, con tasas por banda estables. Valida: con bandas fijadas al crear el lead (fuente, segmento, fit/intención),
        la mezcla se movió a bandas bajas y explica la caída. Descarta: mezcla estable o término chico. Dato mínimo:
        señales de entrada congeladas al crear y resultado por cohorte. Palanca CRO (con CMO): scoring/ICP, qué
        pasa al SDR y presupuesto por fuente.


        RAMA 3 · Con entradas comparables, la caída está antes del SQL (MoFu · SDR); H-007 es la regla que la ubica

        3.1 Primer toque tarde o nunca (H-006, lado SDR). Firma: cae New → Working SDR a tiempo. Valida: sube el
        tiempo a primer toque y la caída sigue a la carga por SDR. Descarta: carga y tiempos estables, o la caída
        es igual en leads atendidos rápido. Dato mínimo: timestamp del primer toque, dueño y SDR activos por semana.
        Palanca CRO: SLA de primer contacto, priorización por score y capacidad.

        3.2 Contactados que se estancan (H-055). Firma: cae Working SDR/Engaged → SQL y crece la bolsa de estancados
        por más de N días. Valida: sube la proporción de estancados por cohorte y los retomados sí compran. Descarta:
        estancados estables, o retomados que casi no compran (entonces es Rama 2). Dato mínimo: historial de estados
        con fecha y actividades. Palanca CRO: cadencias y regla de reasignar o reciclar a los N días; si el estancamiento
        sigue a la carga, capacidad.


        RAMA 4 · Con entradas comparables, la caída está después del SQL (BoFu)

        4.1 Exceso en el SQL del SDR (H-054). Firma: la parte de la caída post-SQL que tiene el SQL del SDR y no
        el SQL directo. Valida: baja la aceptación del AE en el SQL del SDR y la conversión cae más que en el SQL
        directo, sobre todo si cambió la meta del SDR. Descarta: caída igual en ambos orígenes o aceptación estable.
        Dato mínimo: origen del SQL, decisión y motivo del AE, versión del plan de comisiones. Palanca CRO: comisión
        por SQL aceptado u oportunidad (no por reunión) y criterio de SQL con SLA de aceptación.

        4.2 Avance del AE, SQL → Demo → Proposal (H-006, lado AE). Firma: la parte común de la caída antes de Proposal.
        Valida: sube la carga por AE o el tiempo SQL → Demo. Descarta: carga estable, o la caída está solo en Proposal
        → Won. Dato mínimo: historial de etapas de la oportunidad y AE activos por semana. Palanca CRO: capacidad
        y priorización de AE.

        4.3 Decisión en Proposal → Won (H-056). Firma: cae Proposal → Won en todos los orígenes. Valida: cambia
        la mezcla de motivos (precio/plan, competidor, funcionalidad, no-decisión) validada con compradores, o la
        caída coincide con un cambio de oferta. Descarta: win rate estable, motivos estables, o la caída es igual
        donde la oferta no cambió. Dato mínimo: fechas de cambios de precio/plan, motivo de pérdida y muestra de
        entrevistas. Palanca CRO: pricing/packaging (con CFO y CPO) y enablement competitivo.


        RAMA 5 · El funnel cierra pero la venta no llega al cobro (solo si venta = cliente pagando)

        5.1 Won sin primer pago (H-057). Firma: sube la proporción de Won sin pago a X días. Descarta: casi todos
        pagan y la proporción es estable, o el CRO mide la venta como Won. Dato mínimo: llave Won ↔ customer_id,
        fecha de primer pago y pagos fallidos. Palanca CRO: comisión al primer pago, handoff a onboarding y cobro,
        medios de pago.


        Prueba de doble conteo: 1.1 vs 1.3 (no puede comprar vs compraría igual por otra puerta); 2.1 vs Ramas 3–4
        (mezcla vs tasa dentro de la banda); 3.1 vs 3.2 (antes vs después del primer toque); 4.1 vs 4.2/4.3 (exceso
        del SDR vs parte común); 4.2 vs 4.3 (antes de Proposal vs en Proposal). Una causa puede tener dos hojas
        (H-006 en 3.1 y 4.2) porque deja firmas en etapas distintas; la misma caída observada nunca va en dos. ¿Qué
        falta? El entorno de demanda: se ve como caída común en 4.3 y en el self-serve sin cruce de identidad, y
        no es palanca del CRO. Orden de revisión: Paso 0 → 1.2 → 1.1 → 1.3 → 2.1 → Rama 3 → Rama 4 → 5.1.'
      why: Reparte la brecha por construcción, de modo que cada pedazo de caída cae en un solo término. Respeta
        los motions híbridos sin una tasa mezclada, separa volumen, tasa y valor, y cada hoja trae su evento, su
        métrica y su palanca. H-007 queda como regla para ubicar la caída, no como causa.
    alternative_frameworks:
    - name: Revenue Waterfall centrado en oportunidades (Forrester)
      when_better: Si Finora ya gestiona oportunidades y grupos de compra, y quiere planear en el mismo marco logo
        nuevo, renovación, cross-sell y upsell.
      tradeoff: 'Empieza en la oportunidad: deja fuera la etapa SDR, donde viven H-006 y H-055, y los artefactos
        a nivel lead (H-052).'
    - name: Modelo de estados con transiciones y tiempo en estado
      when_better: Si los recorridos dan vueltas (Working → Nurture → Working, Reactivate, self-serve ↔ SDR) y un
        funnel lineal clasifica mal.
      tradeoff: 'Pide el historial completo con fechas, que el CRM puede no guardar más de 18–24 meses, y es difícil
        de mostrar en una lámina. Por sí solo no reparte la brecha: necesita el árbol encima.'
    metric_definitions:
    - metric: Altas (primer pago observado)
      funnel: Común
      family: volumen
      definition: 'Clientes que pagan por primera vez en el mes: primera aparición en pagos, no necesariamente adquisición.'
      formula: COUNT(customer_id) con new_customer = 1 en el mes (mart.monthly_metrics.new_customers)
      grain: cliente; mes calendario
      milestone: primer pago observado
      today: Con cuidado — primera aparición ≠ adquisición; feb-22 con spillover y ene-22 no identificable
      notes: Es la «venta» visible hoy. No incluye Won sin pago ni sirve para medir conversión de leads.
    - metric: Monto del primer pago por alta (mediana y p75)
      funnel: Común
      family: valor
      definition: Monto pagado observado en el mes de alta (M0), no MRR contratado.
      formula: median(m0_cop) y quantile_cont(m0_cop, 0.75) por cohorte (mart.new_customers)
      grain: alta; cohorte mensual
      milestone: primer pago observado
      today: Con cuidado — monto pagado observado; medianas por industria con n chico
      notes: Separa «más ventas» en logos de «más ventas» en valor. Cortarlo por industria muestra mezcla vs tasa.
    - metric: Altas sin pago en M1 (arranque)
      funnel: Común (después de la venta)
      family: calidad
      definition: Altas que pagan en M0 y no pagan en M1.
      formula: COUNT(altas con m1_cop = 0) / COUNT(altas con M1 observable)
      grain: alta; cohorte mensual
      milestone: primer pago observado
      today: Con cuidado — un pago de varios meses por adelantado también deja M1 en cero
      notes: Cubre solo la parte de arranque de H-057.
    - metric: Conversión de cohorte a venta
      funnel: Común (se calcula por motion, nunca mezclada)
      family: conversión
      definition: Entradas válidas de una cohorte que llegan a venta dentro de W días.
      formula: ventas_m(c, ≤W) / entradas válidas_m(c), para cada motion m y cohorte c; brecha = conv(P1) − conv(P0)
      grain: entrada (lead válido, SQL directo o registro); cohorte de creación
      milestone: creación de la entrada
      today: No se puede — el modelo no tiene entradas
      notes: Es la métrica que el árbol reparte. W sale del ciclo.
    - metric: Ciclo creación → venta (p50 y p90)
      funnel: Común (por motion)
      family: velocidad
      definition: Días entre la creación de la entrada y la venta, para quienes compran.
      formula: percentil 50 y 90 de (fecha_venta − fecha_creación) por motion y cohorte
      grain: venta
      milestone: creación de la entrada
      today: No se puede — no hay fecha de creación
      notes: 'Fija W: si W es menor que el p90, las cohortes recientes parecen peores (hoja 1.2).'
    - metric: Leads New brutos
      funnel: Sales-assisted
      family: volumen
      definition: Registros que entran en New en el periodo, tal como los cuenta el CRM.
      formula: COUNT(lead_id) con created_at en el periodo
      grain: lead; cohorte semanal o mensual
      milestone: creación del lead
      today: No se puede — no hay leads en el modelo
      notes: Es el «más leads» del CRO. No es denominador de ninguna tasa.
    - metric: Proporción de no-prospectos en New
      funnel: Sales-assisted
      family: calidad
      definition: Duplicados, clientes actuales, ex-clientes (van a Reactivate) y spam dentro de New.
      formula: (duplicados + clientes actuales + ex-clientes + spam) / Leads New brutos
      grain: lead; cohorte
      milestone: creación del lead
      today: No se puede — el cruce con customer_id será posible cuando llegue el export
      notes: Test de la hoja 1.1 (H-052).
    - metric: Leads válidos
      funnel: Sales-assisted
      family: volumen
      definition: Leads New brutos sin los no-prospectos.
      formula: Leads New brutos − (duplicados + clientes actuales + ex-clientes + spam)
      grain: lead; cohorte
      milestone: creación del lead
      today: No se puede
      notes: Denominador de las tasas del Sales-assisted.
    - metric: Mezcla por banda de entrada
      funnel: Sales-assisted (el mismo corte se aplica como dimensión al SQL directo)
      family: calidad
      definition: 'Peso de cada banda definida con datos fijados al crear el lead: fuente × segmento × banda de
        fit/intención.'
      formula: leads válidos de la banda b / leads válidos; término de mezcla = Σ_b (s_b,P1 − s_b,P0) × tasa_b,P0
      grain: banda; cohorte
      milestone: creación del lead
      today: No se puede
      notes: Test de la hoja 2.1 (H-005). Nunca usar resultados posteriores para definir la banda.
    - metric: Carga por SDR
      funnel: Sales-assisted
      family: volumen
      definition: Leads válidos asignados por SDR activo.
      formula: leads válidos asignados en la semana / SDR activos (FTE) en la semana
      grain: SDR × semana
      milestone: asignación del lead
      today: No se puede — sales_capacity_spend es gasto en unidad no documentada, no headcount
      notes: Discrimina capacidad en 3.1, y en 3.2 si el estancamiento sigue a la carga.
    - metric: Tiempo a primer toque
      funnel: Sales-assisted
      family: velocidad
      definition: Horas entre la creación del lead válido y el primer intento de contacto.
      formula: p50 y p90 de (primer_toque_at − created_at)
      grain: lead; cohorte semanal
      milestone: creación del lead
      today: No se puede
      notes: Firma de la hoja 3.1.
    - metric: Contacto a tiempo (New → Working SDR)
      funnel: Sales-assisted
      family: conversión
      definition: Leads válidos que pasan a Working SDR dentro del SLA que fije Finora.
      formula: leads válidos con Working SDR ≤ SLA / leads válidos de la cohorte
      grain: lead; cohorte
      milestone: creación del lead
      today: No se puede
      notes: Mide la etapa New.
    - metric: Avance SDR (Working SDR → Engaged → SQL)
      funnel: Sales-assisted
      family: conversión
      definition: Proporción que avanza a la etapa siguiente dentro de W_k días.
      formula: leads que llegan a k+1 en ≤ W_k / leads que llegaron a k, para k ∈ {Working SDR, Engaged}
      grain: lead; cohorte de entrada a la etapa
      milestone: entrada a Working SDR
      today: No se puede
      notes: Mide las etapas Working SDR y Engaged.
    - metric: Estancados en Working SDR / Engaged
      funnel: Sales-assisted
      family: estancamiento
      definition: Leads en Working SDR o Engaged sin actividad ni cambio de estado por más de N días.
      formula: leads en Working SDR/Engaged sin actividad ni cambio en N días / leads que llegaron a Working SDR,
        por cohorte
      grain: lead; cohorte
      milestone: entrada a Working SDR
      today: No se puede
      notes: Firma de la hoja 3.2 (H-055). N se fija con el ciclo.
    - metric: Compra de estancados retomados
      funnel: Sales-assisted
      family: conversión
      definition: De los estancados que se retoman, cuántos llegan a venta dentro de W.
      formula: estancados retomados con venta ≤ W / estancados retomados
      grain: lead retomado; cohorte de retoma
      milestone: retoma (primera actividad tras N días)
      today: No se puede
      notes: Separa seguimiento (3.2) de calidad (2.1).
    - metric: SQL entregados por origen
      funnel: SQL directo y handoff del Sales-assisted
      family: volumen
      definition: SQL creados en el periodo, marcados como SDR o directo.
      formula: COUNT(sql_id) por origen y cohorte
      grain: SQL; cohorte
      milestone: SQL
      today: No se puede
