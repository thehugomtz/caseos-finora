id: R-032
type: research
research_question: ¿Cómo se ordenan las causas de «más leads, pero no más ventas» en un árbol MECE —cada brecha
  observada en una sola rama—, con qué tendría que ser cierto para validar o descartar cada hoja, el dato mínimo
  y la palanca del CRO?
case_question: 'Sirve a C-023 (matriz de causas: qué la valida, qué la descarta y qué palanca mueve) y a C-011 (descartar
  primero artefactos de medición y después contrastar ToFu, MoFu y BoFu). Ordena H-052, H-053, H-054, H-055, H-056,
  H-057, H-005 y H-006, y usa H-007 como regla de ubicación, dentro de la pregunta ejecutiva: qué explicaciones
  podemos defender ante el CRO y el CFO, qué huecos hay en su WoW y qué modelos proponemos.'
