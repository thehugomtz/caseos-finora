cos_assessment:
  summary: 'R-032 no trae evidencia nueva sobre causas: trae la estructura. Ordena «más leads, pero no más ventas»
    por el cociente ventas/leads. Primero va el Paso 0 (qué es venta y qué ventana se compara) y luego cinco ramas:
    lo nuevo no es demanda comprable → peor mezcla → antes del SQL → después del SQL → cobro. Las cuatro causas
    del CRO quedan casi una a una como ramas 1–4. Eso ordena C-011 y C-023, pero toca dos decisiones activas: D-001
    (tres ramas) y D-003 (las causas se contrastan, no se suman). Mi lectura: el árbol suma lugares, no causas.
    Así D-003 se sostiene y las hipótesis que tocan dos ramas (H-006, H-054, H-028) no quedan forzadas a una sola.
    Con pagos, lo único nuevo es que la brecha depende de la ventana. En mar–oct las altas (primeros pagadores observados)
    suben de 433 a 465; en T2 suben fuerte (144 → 219) y en T3 bajan (187 → 153). Eso abre una lectura de compra
    adelantada que sí se puede revisar hoy. Ojo con las cifras: la mediana del primer pago 2023 de R-032 (35.280
    COP, mar–oct) no es la de T-018 (36,8 mil). Es otra ventana, no un error, pero la story no debe mezclarlas.'
  run_id: RUN-20260929-190141-cos-d151
  at: '2026-09-29T19:17:28-06:00'
  impacts:
  - target: framing
    effect: changes_framing
    why: 'R-032 cambia la forma del árbol del CRO y toca dos decisiones activas. D-001 (tres ramas: cantidad, mezcla,
      compra según tiempo): la calidad (H-005, HC3q) pasa de «la diferencia persiste» a «mezcla», el tiempo pasa
      sobre todo al Paso 0 y H-007 deja de ser causa. D-003: R-032 dice que «cada pedazo de brecha cae en un solo
      término», y D-003 pidió no sumar calidad, atención, post-SQL y oferta. Eso vale para los lugares del funnel,
      no para las causas. H-006 toca al SDR (rama 3) y al AE (rama 4), H-054 nace antes del SQL y se ve después,
      y H-028 cruza mezcla y tasa. Además, el reparto entre mezcla y tasa depende de cuál se calcule primero. Al
      Paso 0 le faltan dos cosas. La primera es la unidad del lead (cuenta y episodio, con la caducidad de Q-064):
      sin eso, un estancado que vuelve como New (H-069) cuenta en las ramas 1 y 3. La segunda es una ventana elegida
      con la curva de tiempo a compra (Q-006/H-004): sin eso, «compran más tarde» se cuela en las ramas 3–5. El
      «qué es venta» es el hito que el framing dejó por acordar (X-052).'
  - target: C-011
    effect: changes_story
    why: 'C-011 dice «descartar primero artefactos de medición y después contrastar causas ToFu, MoFu y BoFu». Con
      R-032 cambian tres cosas. La mezcla deja de ser artefacto: no es un error de medición, es un cambio real en
      lo que entra, y pasa a la rama 2. Entran un Paso 0 (qué es venta y qué ventana) y una rama 5 (cobro). Y el
      orden sale del cociente, no de ToFu/MoFu/BoFu. F-127 («se descartan los artefactos, 4 de 8») queda doblemente
      en duda: X-017 ya sacó a HC3b y ahora sale también la mezcla. Las cifras de F-229 (mar–oct 433 → 465; T2 144
      → 219; T3 187 → 153) no están en ninguna tabla con esos cortes; lo más cercano son T-016 y T-093. Un matiz
      para la lámina: lo que en la rama 1 solo infla leads (no-prospectos, duplicados, cambios de definición, misma
      demanda por otra puerta) no baja pagadores, así que no explica la caída de T3-24. El desfase sí podría, pero
      eso es tiempo y va al Paso 0. Esta evaluación le da contenido a X-140, que hoy es solo de linaje.'
  - target: H-007
    effect: changes_framing
    why: R-032 dice que H-007 no es una causa sino la regla que ubica la caída. Encaja con su redacción («el deterioro
      aparece después de un punto del recorrido»). Pero H-007 es la «conversión post-SQL» que el caso trae como
      una de sus cuatro causas y que D-003 nombra. Si sigue como causa, compite con H-054, el avance del AE y H-056
      por la misma brecha.
  - target: H-005
    effect: changes_framing
    why: 'R-032 pone H-005 en la rama 2, «entra peor mezcla», medida solo con señales congeladas al crear el lead
      (lo de congelar ya venía de X-086). Lo nuevo es el lugar: en el framing, H-005 es HC3q, una causa debajo de
      «la diferencia persiste», no mezcla. Con eso comparte rama con H-002. Y la calidad que las señales no capturan
      se va a las tasas de las ramas 3–5, donde no se separa de H-006 sin un experimento (X-082).'
  - target: H-006
    effect: changes_framing
    why: R-032 deja H-006 solo en la rama 3, con firma de tiempo a primer toque y carga (F-231). Pero H-006 habla
      de SDRs y AEs, y X-085 ya incluía la carga por AE. La parte AE (demos y propuestas que se demoran con más
      SQL por AE) cae en la rama 4, en el «avance del AE», que en R-032 no tiene hipótesis. Si se mide solo el primer
      toque, se puede descartar H-006 aunque el cuello esté en los AEs.
  - target: H-054
    effect: changes_framing
    why: 'R-032 define H-054 como el exceso de caída después del SQL en los SQL que genera el SDR frente a otros
      orígenes. Lo común a todos va al avance del AE y a H-056. X-118 ya pedía SQL→Won por origen. Lo nuevo es la
      regla del exceso y lo que exige: si casi todos los SQL vienen del SDR, no hay contra qué comparar y H-054
      no se separa de la parte común. También deja claro que el árbol ubica dónde se ve la caída, no dónde nace
      (H-054 nace antes del traspaso).'
  - target: C-023
    effect: changes_story
    why: 'C-023 propone la matriz: qué valida cada causa, qué la descarta y qué palanca mueve. R-032 le da las filas
      (las hojas del árbol) y parte de las columnas. «Qué la valida» son las firmas de F-231: primer toque y carga;
      bolsa de estancados y compra de los retomados; aceptación del AE por origen del SQL. Aplica la condición de
      F-232: datos que no dependan de lo que Sales opine después. R-032 no trae nada para la columna de palanca,
      y F-230 obliga a decir que hoy no se valida ninguna hoja. Esta evaluación le da contenido a X-141, que hoy
      es solo de linaje.'
  - target: H-066
    effect: opens_new_hypothesis
