  title: Altas, monto del primer pago, reactivaciones y gasto S&M en ventanas mar–oct 2022, 2023 y 2024
  url: ''
  publisher: CaseOS · modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT substr(month,1,4) AS yr, COUNT(*) AS meses, SUM(new_customers) AS altas, ROUND(SUM(new_mrr_cop))
    AS new_mrr_cop, ROUND(SUM(new_mrr_cop)/SUM(new_customers)) AS new_mrr_por_alta, SUM(reactivated_customers) AS
    reactivaciones, ROUND(SUM(demand_gen_spend),3) AS demand_gen, ROUND(SUM(sales_capacity_spend),3) AS sales_capacity,
    ROUND(SUM(total_sm_spend),3) AS total_sm, ROUND(SUM(total_sm_spend)/SUM(new_customers),4) AS sm_por_alta FROM
    mart.monthly_metrics_phase1 WHERE substr(month,6,2) BETWEEN '03' AND '10' GROUP BY substr(month,1,4) ORDER BY
    yr
  verified: true
- id: DM-03
  title: Mediana y p75 del primer pago y altas sin pago en M1, cohortes limpias de mar–oct
  url: ''
  publisher: CaseOS · modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT year, COUNT(*) AS altas, median(m0_cop) AS mediana_m0, quantile_cont(m0_cop, 0.75) AS p75_m0, SUM(CASE
    WHEN early_months_observed >= 2 THEN 1 ELSE 0 END) AS altas_con_m1_observable, SUM(CASE WHEN early_months_observed
    >= 2 AND COALESCE(m1_cop,0) = 0 THEN 1 ELSE 0 END) AS altas_sin_pago_m1, ROUND(100.0 * SUM(CASE WHEN early_months_observed
    >= 2 AND COALESCE(m1_cop,0) = 0 THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN early_months_observed >= 2 THEN 1
    ELSE 0 END),0), 1) AS pct_sin_pago_m1 FROM mart.new_customers WHERE clean AND substr(cohort_month,6,2) BETWEEN
    '03' AND '10' GROUP BY year ORDER BY year
  verified: true
- id: DM-04
  title: Altas, monto del primer pago, reactivaciones y gasto por trimestre 2023–2024
  url: ''
  publisher: CaseOS · modelo de datos Finora (finora-eda)
  date: '2026-09-29'
  source_type: data_model
  quality: A
  note: SELECT substr(month,1,4) AS yr, CASE WHEN substr(month,6,2) IN ('01','02','03') THEN 'T1' WHEN substr(month,6,2)
    IN ('04','05','06') THEN 'T2' WHEN substr(month,6,2) IN ('07','08','09') THEN 'T3' ELSE 'T4' END AS trimestre,
    COUNT(*) AS meses, SUM(new_customers) AS altas, ROUND(SUM(new_mrr_cop)) AS new_mrr_cop, SUM(reactivated_customers)
    AS reactivaciones, ROUND(SUM(demand_gen_spend),3) AS demand_gen, ROUND(SUM(sales_capacity_spend),3) AS sales_capacity
    FROM mart.monthly_metrics_phase1 WHERE month >= '2023-01' GROUP BY 1,2 ORDER BY 1,2
