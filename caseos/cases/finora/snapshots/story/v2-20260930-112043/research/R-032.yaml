    stage_map:
    - funnel: Sales-assisted
      channel: Lead que entra como New y trabaja el SDR
      stages:
      - New
      - Working SDR
      - Engaged
      - SQL
      - Demo
      - Proposal
      - Won
      - Primer pago
      owner: Marketing (New) · SDR (Working SDR → SQL) · AE (SQL → Won) · Cobro/Onboarding (Won → Primer pago);
        dueños a confirmar
      notes: New, Working, Engaged, SQL y Won vienen del lenguaje del caso; Demo y Proposal salen de H-056 y hay
        que confirmarlos contra las etapas literales del Executive y del CRM. Nurture y Descartado son salidas,
        no etapas. Primer pago está fuera del CRM y se une por customer_id.
    - funnel: SQL directo
      channel: Entrada que se crea directamente como SQL, sin SDR
      stages:
      - SQL
      - Demo
      - Proposal
      - Won
      - Primer pago
      owner: AE · Cobro/Onboarding
      notes: Comparte el tramo AE con Sales-assisted y es el grupo de comparación de H-054.
    - funnel: Self-serve
      channel: Registro en el producto sin toque comercial
      stages:
      - Registro
      - Primer pago
      owner: Producto/Growth
      notes: Si hay toque comercial antes del pago, la venta pasa a Hybrid. Es clave para H-053.
    - funnel: Hybrid
      channel: Registro en el producto con toque del SDR o del AE antes del pago
      stages:
      - Registro
      - Toque comercial
      - Primer pago
      owner: Producto/Growth + SDR/AE
      notes: Hitos mínimos propuestos; la definición literal de Hybrid hay que confirmarla con el Executive. Sin
        esta marca, H-053 no se puede separar.
    - funnel: Reactivate
      channel: Ex-cliente que vuelve (como lead o directo en pagos)
      stages:
      - Ex-cliente (≥1 mes sin pago)
      - Reactivación (vuelve a pagar)
      owner: CS/AE (a confirmar)
      notes: Hoy se ve en pagos (reactivated_customer). No se mezcla con New ni en leads ni en ventas.
    required_events:
    - event: lead_created
      trigger: Se crea un lead en el CRM (formulario, importación o carga del SDR)
      properties:
      - lead_id
      - created_at
      - fuente/campaña/formulario
      - email y dominio
      - motion de entrada
      - señales de entrada congeladas (segmento, tamaño, industria, fit/intención)
      - match con customer_id (cliente actual o ex-cliente)
      - flag de duplicado y de spam
    - event: lead_status_changed
      trigger: Cambia el estado del lead (New, Working SDR, Engaged, SQL, Nurture, Descartado)
      properties:
      - lead_id
      - estado_desde
      - estado_hasta
      - changed_at
      - owner_id (SDR)
      - motivo de descarte
    - event: sales_activity_logged
      trigger: Se registra una llamada, un email o una reunión sobre un lead o una oportunidad
      properties:
      - lead_id u opportunity_id
      - tipo de actividad
      - timestamp
      - owner_id
      - resultado
    - event: sql_created
      trigger: El SDR entrega un SQL o se crea un SQL directo
      properties:
      - opportunity_id
      - origen (SDR / directo)
      - sdr_id
      - ae_id
      - criterios de calificación
      - created_at
    - event: sql_reviewed
      trigger: El AE acepta o rechaza el SQL
      properties:
      - opportunity_id
      - decisión
      - motivo
      - decided_at
    - event: opportunity_stage_changed
      trigger: La oportunidad pasa a Demo, Proposal, Won o Lost
      properties:
      - opportunity_id
      - etapa_desde
      - etapa_hasta
      - changed_at
      - plan y precio ofrecidos
      - competidor
      - motivo de pérdida
    - event: product_signup
      trigger: Se crea una cuenta en el producto
      properties:
      - account_id
      - email y dominio
      - signup_at
      - plan
      - lead_id si existe
    - event: subscription_started
      trigger: Compra o activación de un plan, por self-serve o cerrada por el AE
      properties:
      - account_id
      - customer_id
      - plan
      - precio
      - canal (self-serve / AE)
      - toque comercial previo (sí/no)
    - event: payment_attempted
      trigger: Intento de cobro, exitoso o fallido
      properties:
      - customer_id
      - opportunity_id
      - attempted_at
      - monto
      - medio de pago
      - resultado
      - motivo del fallo
    - event: team_roster_snapshot
      trigger: Foto semanal del equipo comercial
      properties:
      - semana
      - rep_id
      - rol (SDR/AE)
      - activo o en rampa
      - fecha de ingreso
    - event: definition_change_logged
      trigger: Cambia un formulario, una fuente, una definición de etapa, el plan de comisiones, un precio o un
        plan
      properties:
      - tipo de cambio
      - fecha efectiva
      - antes/después
      - responsable
    required_dimensions:
    - dimension: Motion o canal de entrada (Sales-assisted, SQL directo, Self-serve, Hybrid, Reactivate)
      why: Evita una tasa mezclada que no describe a nadie; cada rama se prueba por motion.
    - dimension: Cohorte de creación (semana o mes) y periodo (P0 base / P1 aumento)
      why: Compara con la misma madurez; es la prueba de la hoja 1.2.
    - dimension: Tipo de registro (prospecto nuevo, cliente actual, ex-cliente, duplicado, spam)
      why: Es la prueba de la hoja 1.1 y separa New de Reactivate.
    - dimension: Banda de entrada fijada al crear (fuente × segmento × fit/intención; industria)
      why: Separa mezcla y tasa (2.1). La industria ya existe en el modelo para el lado de pagos.
    - dimension: Origen del SQL (SDR / directo)
      why: Separa la hoja 4.1 de la parte común (4.2 y 4.3).
    - dimension: Dueño y carga de la semana (SDR, AE)
      why: Firma de capacidad en 3.1, 3.2 y 4.2.
    - dimension: Versión de la oferta vigente (precio/plan) y competidor
      why: Prueba de la hoja 4.3.
    - dimension: Toque comercial previo a la venta (sí/no)
      why: Separa Self-serve de Hybrid; es la prueba de la hoja 1.3.
    - dimension: Unidad de venta (Won / primer pago / monto del primer pago)
      why: 'Paso 0: se reportan las tres por separado hasta que el CRO elija una.'
    decision_enabled: 'Qué palanca mueve primero el CRO: definición, deduplicación y ruteo de leads; scoring y mezcla
      de fuentes con el CMO; capacidad y SLA del SDR; cadencias de seguimiento; criterio de SQL y comisiones; pricing
      y respuesta a la competencia con el CFO y el CPO; o handoff a cobro. También si conviene seguir comprando
      volumen de leads o invertir en conversión.'
    limitations:
    - 'El modelo no tiene leads, estados, oportunidades ni registros de producto: hoy no se puede validar ni descartar
      ninguna hoja de las Ramas 1 a 4.'
    - Del lado de ventas solo hay primer pago observado (primera aparición, no adquisición) y monto pagado observado
      (no MRR contratado).
    - 'El gasto S&M no tiene unidad documentada: no sirve como proxy de headcount ni para calcular costo por lead.'
    - El shift-share deja un término cruzado; la regla para asignarlo (por ejemplo, pesos promedio de ambos periodos)
      hay que fijarla antes de ver los datos.
    - La calidad no observada al entrar cae en las ramas de tasa; los discriminantes (carga, retomados, origen del
      SQL) reducen ese riesgo pero no lo eliminan.
    - La resta entre el SQL del SDR y el SQL directo (4.1) supone que ambos grupos habrían evolucionado igual sin
      el cambio.
    - 'Todo es observacional: ubica la brecha, no prueba causa. Para causalidad hacen falta experimentos (holdout
      de ruteo, cambio de comisiones escalonado).'
    - 'Los volúmenes son chicos (465 altas en mar–oct 2024, unas 58 por mes): los cortes por banda × motion × etapa
      pueden quedar sin potencia, así que conviene agrupar por trimestre.'
    - Los benchmarks externos (HBR 2011, Clozd, TTEC) son contexto y no describen a Finora.
    - Si el CRM no guarda el historial de estados del periodo base (por ejemplo, el límite de 18–24 meses de Salesforce
      estándar), P0 no se puede reconstruir.
    implementation_implications:
    - 'Pedido mínimo a Finora: export de leads con historial de estados y fechas; oportunidades con origen del SQL,
      decisión del AE y motivo de pérdida; registros de producto; equipo SDR/AE por semana; y bitácora de cambios.
      Todo con llave a customer_id.'
    - 'Data Engineering: stg_leads, stg_lead_status_history, stg_opportunities, stg_product_signups, stg_team_roster
      y un mart de cohortes (entrada × etapa × fecha) que se una a mart.new_customers por customer_id.'
    - Congelar las señales de entrada en la fecha de creación (snapshot), sin leerlas del registro actual.
    - 'Acordar con el CRO antes de calcular: unidad de venta, W, N (días para considerar estancado un lead), SLA
      de primer toque y regla del término cruzado.'
    - Reportar siempre por motion y nunca una conversión mezclada; volumen, tasa y valor en columnas separadas.
    - 'Para causalidad en H-053 y H-054: holdout de ruteo de registros de producto y cambio de comisiones escalonado
      por equipo.'
    - 'Orden de Analytics: primero las hojas 1.2 y 1.1 (baratas y cambian la lectura), luego mezcla vs tasa, y después
      las etapas.'
