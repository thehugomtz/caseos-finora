slide:
  id: S23
  file: slides/23.html
  claim_id: C-020
  role_in_story: recommendation
  kicker: "Revenue · clasificar inicio y fin de un descuento · propuesta"
  headline: "Si la suscripción no cambia, inicio o fin de descuento va a «Descuento»"
  takeaway: "El cambio del MRR neto se reparte por lo que cambió: la suscripción va a sus líneas, el descuento a «Descuento», y si cambian ambos se aplica una regla secuencial."
  question: "¿Cómo clasificar el inicio y el fin de un descuento para que no se confundan con contracción o expansión reales?"
  relationship: "the change in net MRR BRANCHES by what changed: subscription → its lines; discount only → «Descuento»; both → sequential rule"
  evidence_type: framework
  composition: decision_tree (izquierda → derecha)
  family: logic
  alternatives_considered:
    - id: matriz 2×2 (suscripción cambia × descuento cambia)
      score: {fidelity: 3, focal: 2, evidence: 2, variety: 3, risk: -1}
      rejected_because: "buena para los cuatro casos, pero pierde el orden de la regla secuencial"
    - id: tabla de reglas
      score: {fidelity: 1, focal: 1, evidence: 2, variety: 0, risk: 0}
      rejected_because: "prohibida por el brief"
  chosen_score: {fidelity: 3, focal: 3, evidence: 3, variety: 2, risk: -1}
  focal_point: discount_branch
  visual_hierarchy:
    1: rama «no cambió la suscripción → «Descuento»» (lima)
    2: rama de la suscripción y regla secuencial
    3: casos especiales
    4: control del puente
  objects:
    - {id: root, kind: node, content: "Cambio del MRR neto de una suscripción entre cierres de mes"}
    - {id: q1, kind: node, content: "¿Cambió lo contratado o el estado de la suscripción?"}
    - {id: discount_branch, kind: node, content: "«Descuento (inicio)» − · «Descuento (fin)» + · «Descuento (cambio)»"}
    - {id: sub_branch, kind: node, content: "New · Expansión · Contracción · Churn · Reactivación, sobre el MRR contratado"}
    - {id: sequential, kind: node, content: "primero el efecto suscripción con los términos del mes anterior; lo que resta es efecto descuento"}
  encodings:
    x_position: "orden de las preguntas"
    connectors: "respuesta sí / no"
    accent: "la regla del título"
  annotations:
    - {at: discount_branch, text: "Nunca Contracción ni Expansión"}
    - {at: bottom, text: "Control: por suscripción y mes, la suma de líneas iguala el cambio del MRR neto"}
  layout_intent:
    grid: "raíz cols 1–2; preguntas cols 3–5; resultados cols 7–12; casos especiales abajo"
    reading_path: "raíz → pregunta → rama"
    whitespace: "entre ramas sí/no"
  text_budget: 125
  must_show: [la relación de la intención visual]
  avoid: ["tabla", "tres cards", "IDs internos"]
  data: {source: "propuesta (C-020); sin cifras", values: []}
  notes: "Es una convención por declarar: ChartMogul, por defecto, manda el inicio y el fin a contracción y expansión (F-236). Recurrente contra único, mes gratis y pausa son decisiones, no hechos. F-131 salió del claim (X-100)."
  sources: [F-150, F-152, F-151, F-236, F-237]
