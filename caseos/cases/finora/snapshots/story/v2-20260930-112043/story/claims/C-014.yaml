id: C-014
type: claim
key: operar-foros
question: ¿Qué solución analítica le permite al CRO operar el funnel de forma recurrente y qué decisiones le permite
  tomar?
headline: Proponemos una vía formal por foro y otra de agentes para el día a día
answer: 'Primero la capa técnica: una cuenta común que une CRM, producto y facturación; el historial de etapas del
  CRM, que suele venir de forma nativa; la puerta y el canal por cuenta desde la primera visita; el gasto por canal,
  y la facturación con estado de suscripción. Si Finora ya lo registra, se conecta; si no, se instrumenta, porque
  lo que no se capture desde ya no se reconstruye después. Encima, una vía formal por foro que lee el bowtie por
  motion: el semanal decide oportunidades, estancamientos y handoffs; el mensual, la mezcla de motion y canal; el
  trimestral, la inversión y la capacidad. Y otra vía para el día a día: Análisis Ad hoc por hipótesis y agentes
  de IA que trabajan solo sobre métricas gobernadas y entran con un piloto controlado. El lado Revenue ya se puede
  operar mes a mes, pero con pagos observados el CRO confundiría el momento del cobro con churn y expansión: la
  facturación es la primera pieza técnica.'
