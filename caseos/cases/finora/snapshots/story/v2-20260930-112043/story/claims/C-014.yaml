limitations:
- 'Es propuesta: qué decide el CRO en cada foro aún no está definido por Finora.'
- No sabemos qué parte de la capa técnica ya existe en los sistemas de Finora; no se afirma que Finora tenga un
  problema de CRM o analítica digital (H-076).
- 'La atribución reparte crédito, no prueba causa: para decidir presupuesto hacen falta experimentos (F-144, F-149).'
- Los agentes van encima de métricas gobernadas, no en la base, y entran con piloto controlado (F-149).
- 'Lo que no se capture desde ya no se reconstruye: el to-be mide hacia adelante, salvo que Finora tenga historial
  (F-242).'
visual_intent: 'Stack: la capa técnica (cuenta común, historial de etapas, facturación) sostiene dos vías de uso,
  la formal por foro y la de agentes para el día a día.'
hugo_wording: 'Solución analítica para que el CRO opere el funnel de forma recurrente y qué decisiones le permite
  tomar (técnica: pulir CRM, analítica digital · decision making: dashboards automatizados por foro, análisis ad
  hoc, agentes de IA).'
