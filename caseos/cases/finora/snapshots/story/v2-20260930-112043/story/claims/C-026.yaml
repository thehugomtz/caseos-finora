limitations:
- 'Composición no es causa: no separa tipo de cliente, plan, tarifa ni descuento (F-093).'
- 'El peso de la composición depende de la base: 84% con dic-22 y 108% con ene-22. La dirección no cambia y la base
  la decides tú (X-060).'
- Primer pago observado no es adquisición. Won, primer pago o suscripción activa siguen por acordar (X-052).
- 'El escalón de inicios de 2023 puede ser en parte registro (H-024) u operación (H-025, H-068): sin confirmar.'
- El ticket estabilizado sigue siendo monto pagado y no sigue bajando en 2024 (F-161).
- El gasto está en unidad reportada, sin escala a COP (F-063), y Team queda fijo en 12% hasta may-23 (F-066). La
  asociación negativa en niveles no es efecto (F-119, F-219).
- 'La industria es la única segmentación disponible: no sustituye al canal ni a la ruta.'
- El detalle de C-002, C-003 y C-004 queda en anexo.
visual_intent: 'Converge: tres observaciones (la base sostiene, las cosechas nuevas diluyen, el gasto va en sentido
  contrario a las altas) llevan a una sola pregunta abierta, por dónde y cómo entra cada cliente, que conecta con
  Growth.'
hugo_wording: «Las 3, 4 y 5 vamos a rescatar lo mejor para explicarlo en una lámina, para que vean que si llegué
  a las observaciones y conectar, para poder conectar con el siguiente bloque» (N-055).
