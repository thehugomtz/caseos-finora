id: C-026
type: claim
key: overview-observaciones
question: ¿Qué observaciones sostienen los datos antes de entrar a Growth y qué dejan abierto?
headline: La caída por cliente coincide con quién entra, y el gasto no acompaña las altas
answer: 'Mezcla: la base previa sostiene su monto (+5% por cliente entre ene-22 y oct-24, a COP 97,4 mil), mientras
  las cosechas 2023 y 2024 ya son 65% de los activos, con COP 46,3 mil y COP 43,0 mil por cliente. Entradas: los
  primeros pagadores observados pasan de 27,2 a 54,7 por mes en un escalón a inicios de 2023, y el ticket de entrada
  estabilizado baja (la mediana del segundo pago pasa de COP 52,5 mil en 2022 a COP 36,8 mil en 2023); según el
  monto usual temprano, 91% de ese cambio ocurre dentro de cada industria. Gasto: entre ene–may y jun–dic de 2023
  el S&M por mes baja de 3,01 u a 1,44 u, mientras las altas suben de 45,2 a 60,6 por mes; además, la capacidad
  comercial pasa de 26% a 38% del S&M entre 2022 S1 y 2024 jul–oct, así que cruzar fechas no atribuye ventas. Lo
  que los pagos no dicen es por qué ruta, canal y etapa entra cada cliente, y esa pregunta abre Growth.'
