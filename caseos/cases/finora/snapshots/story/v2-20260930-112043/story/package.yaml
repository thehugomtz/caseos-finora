- claim_id: C-025
  key: cfo-casos
  question: 'Paga 100 y luego 80; la suscripción pasa de 100 a 130 con un descuento de 30 y sigue pagando 100; desaparece
    el descuento: ¿cómo se lee cada caso y qué pasa con el negocio subyacente?'
  headline: Con el modelo propuesto, cada caso del CFO se lee en su capa
  answer: 'Con el modelo propuesto, cada caso del enunciado (ejemplos, no datos de Finora) cae en su capa. Si paga
    100 y luego 80, el modelo distingue una contracción real (lo contratado baja a 80) de un inicio de descuento
    (lo contratado sigue en 100 y la diferencia va a «Descuento»). Si la suscripción pasa de 100 a 130 con un descuento
    de 30 y sigue pagando 100, el puente muestra expansión de 30 e inicio de descuento de −30, con el neto sin cambio;
    si después desaparece el descuento, la subida del pago va a fin de descuento, no a expansión. Hoy ese puente
    por capas no es construible (no hay lista, plan ni descuento en los datos), y el puente actual mezcla orígenes:
    29% del MRR de expansión se revierte al mes siguiente y 44% de los 751 churns observados vuelve a pagar al mes
    siguiente. Sobre el negocio subyacente, lo que se observa es composición de la base, no un efecto separable
    de precio o descuento: el MRR pagado observado por cliente activo pasa de COP 92,8 mil en ene-22 a COP 57,8
    mil en oct-24 (−38%), mientras el de la base previa cambia +5%; el revenue que dejamos de capturar por descuentos
    solo se medirá hacia adelante, con la capa de descuento.'
