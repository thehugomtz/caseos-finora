- claim_id: C-017
  key: descuento-objeto
  question: ¿Cómo debería Finora introducir descuentos temporales sin perder la respuesta a «¿por qué cambió nuestro
    MRR?»?
  headline: El descuento se registra como objeto propio, con origen, source y fecha de fin
  answer: 'Mecanismo Propuesto: cada descuento se registra como objeto propio, con tipo, valor, duración, fecha
    de inicio y de fin, motivo, aprobador y origen exclusivo (promoción digital o física, negociación, retención
    o partner), separado de la cantidad contratada y del precio de lista, y se lee desde la factura; el modelo separa
    la oferta, el código que la distribuye y el descuento aplicado con su vigencia. El source se captura en la adquisición
    de todos los clientes, no solo en el descuento, y el canal asignado al código se guarda aparte; negociación,
    retención y partner llevan registro propio, para que un precio especial no esconda un descuento ni un downgrade
    de retención se confunda con uno. Cómo pega el descuento en el MRR no es un estándar de mercado: es una convención
    que el CFO decide y declara, y las herramientas revisadas no separan por sí solas descuento de cambio de suscripción.
    Implicaciones Multidisciplinarias: con descuentos, MRR neto, revenue reconocido y caja pueden separarse según
    el tipo de contrato; el descuento cambia la composición de las cohortes, que hay que marcar y medir contra un
    grupo comparable; y el puente actual ya mezcla interrupciones con bajas (44% de los 751 churns observados vuelve
    a pagar al mes siguiente), lo mismo que un descuento que vence volvería a mezclar si no tiene fecha de fin.'
