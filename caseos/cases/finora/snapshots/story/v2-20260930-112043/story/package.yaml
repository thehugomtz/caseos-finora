- claim_id: C-028
  key: metricas-nuevas
  question: ¿Qué métricas propondrías que hoy no existen, y para qué decisión sirve cada una?
  headline: Proponemos métricas por ruta y de eficiencia, cada una atada a una decisión del CRO
  answer: 'Proponemos medir por ruta lo que hoy no existe y atar cada métrica a una decisión del CRO: entradas,
    alcance por etapa en cohorte y tiempo por tramo, para saber si falta volumen o tasa antes de pedir más SDR/AE
    o más gasto; tiempo a primer toque y carga por SDR/AE, para separar capacidad de calidad; estancamiento por
    etapa, para decidir qué tramo y qué dueño arreglar primero; valor y calidad por ruta (MRR inicial con run-rate
    y guardarraíles, no con el primer pago, y retención temprana), para decidir a qué puerta ponerle persona; y
    eficiencia (CAC y payback por ruta), para repartir el S&M entre rutas y canales. Hoy se calcula, con nombre
    honesto y solo en total, el MRR pagado observado y su puente, los clientes activos, el ARPA por cliente (lo
    que se pide como ARPU), el churn observado y las métricas de cohorte. La eficiencia hoy solo existe como S&M
    por alta en unidad reportada, 0,105 u en 2022 y 0,036 u en 2024 (−66%), y eso no es CAC: sin la unidad del gasto
    no hay CAC en COP ni payback, sin ruta ni canal no hay CAC por ruta, y el LTV con margen y el UCM necesitan
    margen bruto o costo de servir.'
  role_in_story: recommendation
