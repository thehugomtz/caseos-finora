  primary: es
  tone: direct, conversational
  technical_level: adaptive
  preserve_user_vocabulary: true
  avoid_unnecessary_jargon: true
  structured_language: es
  observed:
    register: Conversacional y directo; piensa en funnels, láminas y bloques; mezcla español con términos de ventas
      en inglés.
    technical_level: 'Analítico-negocio: maneja etapas del funnel, SDR/AE, ToFu/BoFu y métricas SaaS.'
    formality: Tú, informal, sin rodeos.
    preserved_terms:
    - Análisis Ad hoc
    - Mecanismo Propuesto
    - Implicaciones Multidisciplinarias
    - research
