id: D-018
type: decision
title: 'Leer D-007 como «no construir en esta etapa»: las propuestas de diseño (funnel, métricas, modelo de datos,
  tablero) entran a la historia'
date: '2026-09-29'
context: Propuesta del COS en su revisión de cobertura de las 8 preguntas (D-017, JOB-20260929-141319-a768, acción
  1); la registró Claude para que la decidas aquí. D-007 (brief v0.3) dice «Sin dashboards, métricas definitivas,
  modelo de datos ni deck». En D-017 pediste respuestas sólidas a Q4 (solución analítica para el CRO), Q6 (campos,
  tablas o definiciones) y Q7 (inicio y fin del descuento), que son justo eso. El borrador de Story las muestra
  como propuestas de diseño, sin construir nada, marcadas como pendientes de esta decisión.
options:
  A: Reemplazar D-007 por una decisión que la cite y admita propuestas de diseño sin construir nada (bowtie, catálogo
    de métricas, Propuesta de Modelo de datos, boceto de tablero). Las 8 preguntas entran al storytelling.
  B: 'Mantener D-007 tal cual: Q4, Q6 y Q7 quedan como anexo o próximos pasos.'
agent_recommendation: A
