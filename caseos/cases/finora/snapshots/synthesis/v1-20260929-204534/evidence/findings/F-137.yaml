id: F-137
type: finding
headline: 'El CAC solo existe como «S&M por alta en unidades reportadas»: sin la unidad del gasto no hay CAC en
  COP, ni payback, ni LTV:CAC, y sin motion o canal no hay CAC por Self Service/Assisted/Executive ni por Digital/KAM.'
evidence_text: El S&M llega como texto con «$» y tres decimales, sin unidad ni moneda. Entre mar-22 y oct-24 suma
  73,518 unidades para 1.476 altas limpias, es decir, 0,0498 unidades por alta, y ese número no se puede comparar
  con un ARPA en COP. Team + PayrollExpenses son el 26% del S&M, y no sabemos si incluyen KAM o retención. El modelo
  no tiene motion ni canal. a16z advierte que el CAC blended no dice si la adquisición pagada es rentable.
confidence: low
limitations:
- 'Aunque tuviéramos la unidad, el denominador es la primera aparición, no la adquisición: puede incluir clientes
  anteriores a 2022 que regresan. Además, el gasto no tiene rezago ni asignación entre adquisición y KAM.'
kind: measurement
claims:
- claim: El modelo no tiene usuarios o licencias, plan, intervalo de facturación, periodo de servicio, motion, canal,
    margen ni costo de servir, y la unidad del S&M no está documentada.
  source_id: DM-00
  source_type: data_model
  confidence: low
  freshness: Catálogo consultado 2026-09-29
  supports_or_contests: context
  notes: Por esto CAC en COP, payback, LTV con margen, LTV:CAC, UCM y ARPU por usuario quedan en rojo. · fuente
    no recuperada en la corrida (CaseOS)
  unverified: false
- claim: El gasto S&M llega como texto con «$» y tres decimales (por ejemplo, «$1.040» en Paid Media de ene-22),
    sin unidad ni moneda.
  source_id: DM-18
  source_type: data_model
  confidence: high
  freshness: Archivo crudo; consulta 2026-09-29
