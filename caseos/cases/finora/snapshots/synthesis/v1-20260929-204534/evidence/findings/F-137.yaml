- claim: 'Entre mar-22 y oct-24 el S&M suma 73,518 unidades para 1.476 altas limpias: 0,0498 unidades por alta.'
  source_id: DM-07
  source_type: data_model
  confidence: high
  freshness: Datos mar-22–oct-24; consulta 2026-09-29
  supports_or_contests: context
  notes: 'Es una razón en unidades del archivo: no es un CAC en COP y no se puede comparar con el ARPA.'
- claim: En los 34 meses, Team + PayrollExpenses son el 26% del S&M y Paid Media el 44%. Generación de Demanda suma
