id: F-141
type: finding
headline: La conversión que sirve es por cohorte de entrada, con ventana fija y solo en cohortes que ya la cumplieron.
  La tasa de período y el promedio de solo los que convirtieron castigan a las entradas recientes, y ese es justo
  el test de H-003.
evidence_text: Las herramientas de funnel cuentan como convertido a quien hace el primer paso en el rango de fechas
  y completa los demás dentro de una ventana (Amplitude). En análisis de supervivencia, dejar fuera a quienes todavía
  no tuvieron el evento («censurados») subestima fuerte la duración real (lifelines). Pasa lo mismo con los tiempos
  y conversiones de cohortes recientes. Con 30 a 84 altas por mes en 2023–2024, abrir por puerta × canal deja celdas
  chicas.
confidence: high
limitations:
- La ventana W y el umbral de estancamiento N se calibran con tiempos reales a pago por puerta, y Finora todavía
  no los entregó. Con pocas altas por celda hace falta reportar por trimestre y exigir un n mínimo.
kind: measurement
claims:
