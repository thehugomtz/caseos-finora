id: F-205
type: finding
headline: Tres artefactos del lado de pagos no alcanzan para explicar la caída de jul–oct 2024
evidence_text: 'Sin octubre (jul–sep), la caída sigue en −18% (153 vs 187): no es solo un efecto de borde (H-029).
  Contando reactivaciones, jul–oct cae −16% (260 vs 311) y su peso pasa de 19,3% a 21,9%: la dirección no cambia
  (H-037). En ene–jun sí cambia la magnitud: +38% con reactivaciones vs +29% sin ellas. De 7 salidas sin retorno
  en nov–dic-22, como mucho 2 coinciden en industria y monto exacto con primeras apariciones de ene-23 (H-024).'
confidence: high
limitations:
- Quedan sin probar los artefactos del CRM (H-052, H-027, H-051), el rezago entre Won y primer pago y un posible
  cambio de sistema de cobro. El cruce por monto exacto no detecta reapariciones con otro monto.
kind: measurement
