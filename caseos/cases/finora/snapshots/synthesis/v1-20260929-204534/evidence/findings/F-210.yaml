id: F-210
type: finding
headline: 'Q-063: propongo que solo cuente como intervención la interacción de ida y vuelta con SDR/AE. El formulario
  de «hablar con ventas» es la entrada, no un tramo sin persona.'
evidence_text: 'Un «touch» es cualquier interacción registrada; «influencia» es la que cambió la trayectoria (creó
  el deal, lo avanzó de etapa o reactivó uno estancado). Contar touches como bandera binaria sobreestima la contribución
  (SRC-07). Los estados de lead separan «intentando contacto» de «trabajando», y un lead puede pasar varias veces
  por intentos (SRC-06). Aplicado al funnel de Hugo: pasar a Working SDR (intentos) no mueve tramo; Engaged SDR
  en adelante sí (respuesta, llamada conectada, demo, propuesta, prueba montada por un AE). Así, el lead de campaña
  que nadie contactó y compró solo es Self Service con bandera, no Hybrid B. Origen (sourced) e influencia (influenced)
  necesitan definiciones gobernadas para no contar doble (SRC-08): la puerta es el origen y los tramos con persona
  son la influencia.'
confidence: medium
limitations:
- 'La opción la decide Hugo. La definición estricta requiere que el CRM guarde el resultado de cada actividad (intento,
  conectada, respondida) y marque las automatizadas. Conviene reportar la «zona gris»: los episodios que cambian
  de ruta entre la definición amplia y la estricta.'
kind: measurement
