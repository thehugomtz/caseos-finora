message: No es posible verificar con el panel ni la equivalencia entre el campo amount y un importe contractual
  en COP, ni si un cliente sin pago en el mes está cancelado, pausado o en atraso, por lo que las señales de Growth
  y Revenue se pueden describir pero no calificar como deterioro comercial o como artefacto de cobro.
