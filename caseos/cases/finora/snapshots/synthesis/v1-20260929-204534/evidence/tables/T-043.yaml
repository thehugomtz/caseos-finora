query: "-- E-011\nWITH act AS (\n  SELECT industry, AVG(activos) AS activos_prom\n  FROM (SELECT industry, month,
  SUM(active_customer) AS activos\n        FROM mart.customer_month\n        WHERE active_customer = 1 AND month
  BETWEEN '2024-01' AND '2024-07'\n        GROUP BY 1, 2) t\n  GROUP BY 1\n), ch AS (\n  SELECT industry,\n         COUNT(*)
  AS churns,\n         SUM(CASE WHEN months_to_return IS NULL OR months_to_return > 3 THEN 1 ELSE 0 END) AS churns_persistentes\n
  \ FROM mart.churn_events\n  WHERE month BETWEEN '2024-01' AND '2024-07'\n  GROUP BY 1\n), tick AS (\n  SELECT
  industry, MEDIAN(paid_mrr_cop) AS ticket_mediano_2024\n  FROM mart.customer_month\n  WHERE new_customer = 1 AND
  month BETWEEN '2024-01' AND '2024-10'\n  GROUP BY 1\n), fin AS (\n  SELECT industry, SUM(active_customer) AS activos_oct24,
  SUM(paid_mrr_cop) AS mrr_oct24\n  FROM mart.customer_month\n  WHERE month = '2024-10' AND active_customer = 1\n
  \ GROUP BY 1\n)\nSELECT f.industry,\n       ROUND(100.0 * c.churns_persistentes / (7 * a.activos_prom), 2) AS
  churn_persistente_pct,\n       ROUND(100.0 * c.churns / (7 * a.activos_prom), 2) AS churn_observado_pct,\n       ROUND(t.ticket_mediano_2024,
  0) AS ticket_mediano_2024,\n       f.activos_oct24,\n       ROUND(f.mrr_oct24 / 1000000.0, 2) AS mrr_oct24_millones\nFROM
  fin f\nJOIN act a ON a.industry = f.industry\nJOIN ch c ON c.industry = f.industry\nJOIN tick t ON t.industry
  = f.industry\nORDER BY churn_persistente_pct"
