message: 'El ticket de entrada mediano de 2024 en Retail (COP 26,2 mil) y en Servicios profesionales (COP 31,5 mil)
  queda por debajo del de Salud (COP 52,5 mil) y Restaurantes (COP 52,5 mil), mientras Retail suma 360 clientes
  activos en oct-24 frente a 124 en Salud: el volumen incorporado se asocia con el menor ticket mediano.'
