query: "-- E-006\nSELECT year AS anio_cohorte,\n       COUNT(*) AS altas,\n       ROUND(MEDIAN(m0_cop), 0) AS m0_mediana_cop,\n
  \      ROUND(MEDIAN(m1_cop), 0) AS m1_mediana_cop,\n       ROUND(100.0 * SUM(CASE WHEN m0_cop > 1.5 * m1_cop THEN
  1 ELSE 0 END) / COUNT(*), 1) AS pct_m0_supera_1_5x_m1,\n       ROUND(100.0 * SUM(CASE WHEN m1_cop > 1.5 * m0_cop
  THEN 1 ELSE 0 END) / COUNT(*), 1) AS pct_m1_supera_1_5x_m0,\n       ROUND(100.0 * SUM(CASE WHEN m1_cop = m0_cop
  THEN 1 ELSE 0 END) / COUNT(*), 1) AS pct_m1_igual_m0\nFROM mart.new_customers\nWHERE clean\nGROUP BY 1 ORDER BY
  1"
