title: La caída del ticket de entrada entre las cohortes 2022 y 2023 se observa también con el ticket estabilizado
question: ¿Cuál es el ticket de entrada estabilizado —el segundo pago o el monto usual, no el primer pago— por año
  de alta y por industria, en cohortes de ventana limpia? ¿Se sostiene la caída 2022→2023 de T-018 y el «menor ticket»
