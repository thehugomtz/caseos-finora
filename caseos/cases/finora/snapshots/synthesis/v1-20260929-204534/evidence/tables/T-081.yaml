message: En la ventana limpia (mar-22 a oct-24) la reactivación aporta COP 86,5 millones de entradas de MRR y la
  contracción −COP 89,5 millones de salidas, frente a un movimiento bruto de MRR de COP 404 millones y un cambio
  neto de COP 62 millones en el periodo.
