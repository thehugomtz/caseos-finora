query: '-- E-001

  SELECT month AS periodo, SUM(new_customer) AS valor, COUNT(DISTINCT month) AS meses, (SUM(new_customer)) / COUNT(DISTINCT
  month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10'' GROUP BY ALL
  ORDER BY periodo


  -- E-003

  SELECT substr(month, 1, 4) AS periodo, SUM(new_customer) AS valor, COUNT(DISTINCT month) AS meses, (SUM(new_customer))
  / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month WHERE month BETWEEN ''2022-03'' AND ''2024-10''
  GROUP BY ALL ORDER BY periodo


  -- E-004

  WITH m AS (SELECT month, month AS periodo, SUM(active_customer) AS valor FROM mart.customer_month WHERE month
  BETWEEN ''2024-01'' AND ''2024-10'' GROUP BY ALL) SELECT periodo, arg_max(valor, month) AS valor, max(month) AS
  mes_cierre, COUNT(*) AS meses FROM m GROUP BY ALL ORDER BY periodo'
