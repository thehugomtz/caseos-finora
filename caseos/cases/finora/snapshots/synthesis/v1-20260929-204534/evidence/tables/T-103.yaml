query: "-- E-003\nWITH s AS (SELECT month, total_sm_spend, team FROM mart.sm_monthly),\nn AS (SELECT month, new_customers
  FROM mart.monthly_metrics)\nSELECT s.month AS mes,\n       ROUND(s.total_sm_spend,3) AS sm_total_u,\n       ROUND(s.team
  / NULLIF(s.total_sm_spend,0),4) AS team_participacion,\n       n.new_customers AS altas_mismo_mes,\n       LEAD(n.new_customers)
  OVER (ORDER BY s.month) AS altas_mes_siguiente\nFROM s LEFT JOIN n ON n.month = s.month\nORDER BY s.month\n\n--
  E-002\nSELECT * FROM mart.sm_monthly ORDER BY 1\n\n-- E-001\nSELECT month AS periodo, SUM(new_customer) AS valor,
  COUNT(DISTINCT month) AS meses, (SUM(new_customer)) / COUNT(DISTINCT month) AS promedio_mensual FROM mart.customer_month
  WHERE month BETWEEN '2022-03' AND '2024-10' GROUP BY ALL ORDER BY periodo"
