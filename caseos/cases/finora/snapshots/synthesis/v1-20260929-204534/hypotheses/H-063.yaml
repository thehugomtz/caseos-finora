id: H-063
type: hypothesis
statement: Casi toda la baja del churn observado 2022→2024 está en las interrupciones temporales de pago, porque
  el churn que no vuelve en el trimestre casi no se movió (F-183). Esa baja de interrupciones viene de un cambio
  en la forma o el calendario de cobro (en línea con H-047), no solo de que entraron cosechas que se atrasan menos.
falsifier: Se cae si la tasa de meses en cero que vuelven a pagar dentro del trimestre no baja al mismo tiempo en
  cosechas de distinta antigüedad (2022 y 2023). En ese caso sería mezcla de cosechas o antigüedad, no un cambio
  en el cobro.
