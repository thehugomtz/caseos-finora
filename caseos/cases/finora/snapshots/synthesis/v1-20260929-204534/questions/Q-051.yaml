id: Q-051
type: question
text: ¿A qué periodo y a qué hito se refiere el CRO con «más leads, pero no más ventas»? Si es 2023 → 2024 y el
  hito es el primer pago, la meseta de primeras apariciones (54,2 → 55,4 por mes, F-078) es el tramo observado que
  le corresponde. Si es 2022 → 2024, el panel muestra lo contrario (27,2 → 55,4).
