task:
  work: datos
  draft_answer: 'Se pueden poner lado a lado dos cosas: cuántos pagadores nuevos entran por mes y de qué industria,
    y cómo se mueve cada categoría de gasto. Sobre los pagadores, lo investigado (R-003, R-005) dice que entran
    más, con un primer pago más bajo y sin una industria que concentre el cambio. Cruzando fechas se describe dirección
    y momento, por ejemplo si después de subir Generación de Demanda suben las primeras apariciones de pago uno
    o varios meses más tarde. Eso es asociación, no efecto: con 34 meses, sin canal y con la unidad del gasto sin
    documentar, no se puede decir que una categoría «generó» ventas ni sacar un CAC. Mi arranque: la lámina sirve
    para mostrar si las series van juntas o divergen (H-022) y por qué hace falta atribución por canal.'
  hugo_said:
  - text: Entradas y Actividad económica de los clientes y de diferentes segmentos
    ref: N-022
  - text: Inversión en Generación de Demanda para ToFu (Paid Media y Publicidad no web) / Team + Payroll Expenses
      + Travel / Habilitación ¿producto tal vez? (Software Tools + Freelance)
    ref: N-023
  - text: ¿Hasta donde si podemos determinar y relacionar un incremento en ventas con la inversión en las diferentes
      categorías? (Cruzar con fechas)
    ref: Q-018
  steps:
  - kind: data
    what: Primeras apariciones de pago por mes e industria, con su primer pago mediano. Reutilizar R-003 y R-005
      sin rehacerlos.
    where:
    - mart.new_customers
    - mart.monthly_metrics
  - kind: data
    what: Gasto por grupo y mes como índices contra un mes base, porque la unidad no está documentada (la clasificación
      sale de RT-004). Compararlo con primeras apariciones, monto nuevo y monto pagado total, con rezagos de uno
      a pocos meses. Revisar si la relación se sostiene en las dos mitades del periodo o si es solo una tendencia
      compartida.
    where:
    - mart.sm_monthly
    - mart.monthly_metrics
  - kind: proposal
    what: 'La vista de S2.2 con sus reglas de lectura: qué se puede decir (dirección y momento), qué no (efecto,
      CAC por canal) y qué dato permitiría ir más lejos (gasto y canal por cliente, pruebas controladas).'
    where: []
requested_via: delegado a Claude en el chat (29-sep 10:26, D-016)
why_it_matters: ''
short_answer: 'Altas y gasto de S&M no se mueven en el mismo sentido. En 2023, el tramo con más altas por mes coincide
  con menor gasto de generación de demanda y menor S&M total por mes. El S&M total por alta cambia −66% entre 2022
  y 2024. El paso de asociación a efecto no es evaluable con estos datos: faltan funnel con fechas y fuente del
  lead, y la unidad del gasto no está documentada'
headline: Altas y gasto de S&M no se mueven en el mismo sentido
what_is_established:
- En 2023, el tramo con más altas por mes coincide con menor gasto de generación de demanda y menor S&M total por
  mes. El mes de mayor gasto de la ventana limpia, oct-22, registra 32 altas.
- 'Hay señal de un escalón temporal: las altas mensuales pasan de 26 en dic-22 a 60 en ene-23, con el punto más
  alto en jun-24 con 84. La lectura por industria es direccional y muestra altas anuales mayores en 2023 que en
  2022 mar-dic en Retail, Servicios profesionales, Restaurantes, Producción, Tecnología y Salud.'
- Entre 2022 y 2024 las altas por mes cambian +104% mientras el valor inicial incorporado por mes cambia +6% por
  run-rate temprano y +17% por monto habitual. El ticket de entrada mediano pasa de COP 63,0 mil en 2022 a COP 42,0
  mil en 2024.
- Team equivale a una participación exactamente constante del S&M total en 17 meses consecutivos hasta may-23, y
  después su participación se mueve entre 30% en 2023 jun-dic y 23% en 2024 ene-oct. El descenso del gasto de habilitación
  coincide con el componente de freelance en cero desde may-23.
- La correlación en niveles entre S&M total y altas del mismo mes es −0,57 y en cambios mes a mes el mayor valor
  absoluto observado es 0,27 con valor p mínimo de 0,14. La conclusión sostenible es que el cruce no muestra relación
  positiva, no que exista una relación negativa.
- Faltan etapas del funnel con fechas y fuente del lead que liguen el gasto de un mes con clientes concretos, y
  la unidad del gasto no está documentada.
what_is_contested: []
what_remains_unknown:
- 'No se puede atribuir el movimiento de las altas al gasto de S&M: faltan etapas del funnel con fechas y fuente
  del lead, y la unidad del gasto no está documentada.'
- El cruce de fechas solo admite lectura de asociación y en sentido negativo o nulo; no sostiene que reducir gasto
  se relacione con más altas.
- 'La lectura por categoría está limitada por la construcción del archivo: participación constante de Team hasta
  may-23, cambios de participación posteriores y descenso de habilitación que coincide con freelance en cero desde
  may-23.'
alternative_explanations: []
case_implication: Si el archivo de S&M se usa para decisiones de presupuesto, convendría documentar primero su unidad
  y su regla de asignación, dado que la participación de Team permanece exactamente constante en 17 meses consecutivos
  hasta may-23. Si el objetivo es valor incorporado, podría revisarse el tablero comercial para seguir el ticket
  de entrada junto al conteo de altas, ya que entre 2022 y 2024 las altas por mes cambian +104% y el valor inicial
  por mes +6% por run-rate temprano.
