cos_assessment:
  summary: 'R-015 respalda H-022, pero solo como descripción. El gasto de S&M registrado baja mientras suben las
    primeras apariciones de pago. Aun así, la asociación solo aparece en niveles (−0,57), desaparece al comparar
    mes a mes, y no se puede evaluar si el gasto causa el cambio (F-119). Lo más útil para Growth es F-113: las
    primeras apariciones por mes suben +104% y el valor inicial que traen sube entre +6% y +17%. La pista está en
    el valor, no en el número. Hay tres decisiones grandes: (1) sumar límites al framing: el −66% no es CAC, antes
    de jun-23 las categorías son un reparto y no gasto observado, y «altas» debe cambiarse; (2) qué explica los
    cambios de ene-23 y de jun–dic-23 (Q-020); (3) si F-113 entra como la pista de Q-022.'
  run_id: RUN-20260929-103957-cos-6a2b
  at: '2026-09-29T11:19:36-06:00'
  impacts:
  - target: framing
    effect: changes_framing
    why: 'R-015 trae dos lecturas que el «No afirmar todavía» no cubre y que el CEO puede malinterpretar con facilidad.
      (1) El S&M por alta −66% (F-108) suena a «el CAC bajó 66%», pero la unidad no está documentada (T-005), el
      gasto no se liga a clientes ni a canal (F-119) y la primera aparición no es el hito de adquisición. (2) Antes
      de jun-23, el gasto por categoría es un reparto hecho desde arriba y no gasto observado: Team pesa un porcentaje
      fijo durante 17 meses (F-115; T-008). Además, F-107–F-111, F-113 y F-118 hablan de «altas», una etiqueta que
      el framing ya pide no usar sin vigencia verificada. T-012 también la usa, y R-004 y R-009 hacen algo parecido
      con «MRR».'
  - target: Q-020
    effect: opens_new_hypothesis
    why: 'R-015 le da a Q-020 dos fechas que ninguna hipótesis actual explica. (1) Las primeras apariciones saltan
      de 26 en dic-22 a 60 en ene-23, con el S&M todavía en 3,01 u/mes (ene–may-23). El salto no se sostiene igual
      en feb–may: el promedio de ene–may es 45,2 (F-107, F-110). (2) El tramo jun–dic-23 (60,6/mes) coincide con
      el cambio en cómo se arma el archivo de gasto: Team deja de ser un porcentaje fijo después de may-23, Freelance
      está en cero desde may-23 y el S&M baja de 3,45 u (may-23) a 1,10 u (ago-23) (F-108, F-115, F-117). El salto
      de enero llega antes que la caída del gasto. Si parte de ese salto fuera un efecto de cómo se registran los
