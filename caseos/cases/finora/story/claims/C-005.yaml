id: C-005
type: claim
key: funnel-puertas
question: ¿Cómo definir el funnel si no todos lo recorren igual?
headline: Proponemos rutas Executive, Self Service e Hybrid, con puerta y canal fijos al entrar
answer: 'La unidad es el journey: cuenta × intento (varias personas de una misma empresa son un solo journey). Al
  entrar se fijan dos atributos que ya no cambian: la puerta (producto o CRM/Ventas) y el canal (outbound SDR, inbound
  «hablar con ventas», referido o partner, o signup por paid media, publicidad no web u orgánico). La ruta se clasifica
  al final, por eventos: Executive si arranca con persona y nunca pasa por Checkout Self; Self Service si nunca
  interviene una persona; Hybrid A si arranca en el producto y después entra una persona; Hybrid B si arranca con
  persona y cierra por Checkout Self. Mientras el journey está abierto, la ruta es provisional. Reactivate no es
  otra ruta: es un loop para journeys estancados, con bandera, que no crea un New nuevo. Los clientes que vuelven
  a pagar son un loop de Revenue y se miden aparte.'
