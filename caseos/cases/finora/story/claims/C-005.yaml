id: C-005
type: claim
key: funnel-puertas
question: ¿Cómo definir y medir el funnel si no todos lo recorren igual?
headline: 'Proponemos un bowtie por puertas: Self Service, Assisted y Executive con nudo común'
answer: 'No es un funnel único: cada puerta tiene sus hitos a la izquierda. Self Service: visita por canal → registro
  → activación → primer pago. Assisted: entrada (pide ayuda, PQL derivado de Self Service u outbound que responde)
  → SQL → oportunidad → primer pago. Executive: cuenta objetivo → oportunidad directa, sin MQL → sponsor o business
  case → primer pago. Todas llegan a un nudo común y a un lado derecho común (retención, expansión, NRR), cortadas
  por Canal de adquisición (p. ej. Digital, WoM, outbound); la reactivación va aparte como otro tipo de entrada
  y AAARRR sirve como vocabulario común, no como secuencia.'
