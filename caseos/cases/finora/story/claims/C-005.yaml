limitations:
- Propuesta de especialista (R-016, R-019), pendiente de tu aceptación. F-140 y F-147 son de confianza media.
- Los datos del caso no traen puerta, canal ni etapas, así que el lado izquierdo no se puede medir hoy (F-142, fuente
  sin verificar). Eso no prueba que Finora no los registre.
- El hito del nudo (Won, primer pago o suscripción activa) está por acordar con el CRO.
- La puerta no se infiere de los pagos y el primer pago no sirve como valor de entrada (F-143).
visual_intent: 'Convergencia: caminos de entrada distintos, con hitos propios, que se juntan en un nudo y comparten
  el lado derecho.'
hugo_wording: 'Cómo definir y medir el funnel si no todos lo recorren igual (self-serve, entrada directa a SQL,
  estancamientos de semanas): Assisted / Self Service / Executive, con canales (incl. digital, WoM, clientes que
  no requirieron KAM).'
