- by: hugo
  at: '2026-09-29T13:43:28-06:00'
  text: 'Está muy bien, pero yo esperaba ver una propuesta detallada del mix y MECE con su respectivo funnel y como
    se deberia de medir cada uno, recordemos que el funnel actual es New

    Working SDR

    Engaged SDR

    SQL SDR

    Demo Account Executie

    Proposal Account Executive

    Won /// ese es el punto de partida pero tambien tenemos otros Self Service con sus respectivos canales, Hybrid
    que se refiere que en alguna parte del funnel fuepor Self Service y en algun otro fue intervenido por una persona
    (pudo haber empzado hasta arriba y ser intervenido abajo, o pudo ser contactado como new y el solito lo acabó,
    hay que bajar bien esa definición), y el otro era el funnel tradicionald e ejecutivos, lo importante es que
    cada uno tiene sus estapas, el de ejecutivos ya está bien definido y te lo acabo de pasar, hay que definir self
    service o hybrid, tal vez añadir un reactivate que son los que dicen que están estancados pero hay formas de
    reactivarlos y asignarlos a un funnel de acuerdo al caso, cada uno de esos funneles tienen sus pasos, es lo
    que hay que definir y a cada casuistica de funnel asignarle métricas MECE'
