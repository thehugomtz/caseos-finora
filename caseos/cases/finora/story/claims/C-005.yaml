- 'No hay CRM para probarla: hoy no se mide ninguna etapa antes del primer pago, ni la puerta (F-191).'
- 'Corrige lecturas previas: R-022 y R-023 leían Executive como cuentas nombradas o de KAM y Reactivate como ex-pagadores
  (F-187, F-189). Aquí mandan tus definiciones (N-033, N-035, N-037, N-038), y el «Assisted» del guion pasa a Hybrid.'
- 'Parámetros por decidir: qué cuenta como intervención (Q-063; R-029 propone solo la interacción de ida y vuelta
  con SDR/AE), el umbral de estancado (Q-064) y el nudo común (X-052).'
- No sabemos si en Finora existe Self Service como compra sin persona (Q-046). La ruta de un pagador no se infiere
  del monto.
visual_intent: 'Split and converge: rutas que entran por puertas distintas y se juntan en el primer pago; Reactivate
  como flecha de retorno a la izquierda y la vuelta de pagadores aparte, a la derecha.'
