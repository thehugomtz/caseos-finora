limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- 'Es propuesta: hoy el modelo no tiene leads, etapas, dueños, canal ni ruta (F-223).'
- Qué cuenta como intervención de persona sigue abierto (Q-063). Con la regla actual, una entrada que pide persona
  y que nadie atiende termina como Self Service (H-072).
- No sabemos si existe compra self-serve sin persona, ni si hay prueba gratis, freemium o pago al registrarse (Q-046).
- 'La ruta no se infiere del monto. La tasa de Hybrid refleja a quién eligen tocar SDR/AE (H-050): por eso las tasas
  se comparan entre puertas, no entre rutas.'
visual_intent: 'Split y converge: una entrada con puerta y canal fijos se abre en rutas según quién mueve cada tramo,
  y todas llegan al mismo nudo. Reactivate aparece como un loop que devuelve el journey a la etapa donde se estancó.'
