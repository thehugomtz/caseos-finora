limitations:
- 'Pendiente de tu aceptación: todos los findings citados están propuestos.'
- La industria es una segmentación disponible, no un sustituto de canal ni de ruta; no se afirma una causa industrial.
- No hay tamaño de cliente, motivos de churn ni estado de suscripción (F-106).
- 'Quienes se van pagaban más en promedio, pero no en mediana: la salida de pocas cuentas grandes también baja el
  promedio (F-101, F-102).'
- La cifra de composición depende de la base elegida (X-060).
visual_intent: 'Difusión contra concentración: la caída aparece en todas las industrias con distinta intensidad,
  mientras que el peso de las cosechas de menor ticket es lo que la concentra.'
hugo_wording: Dónde y en qué segmentos se concentra la pérdida de crecimiento (industria, churn, low tickets, mix).
