id: C-007
type: claim
key: perdida-cosechas
question: ¿Dónde y en qué segmentos se concentra la pérdida de crecimiento?
headline: La pérdida está en el monto por cliente de cosechas de menor ticket
answer: 'No se concentra en una industria: el MRR pagado observado por cliente activo bajó en las 6 entre dic-22
  y oct-24. Cayó más en Servicios profesionales (−46,6%), Restaurantes (−45,6%) y Retail (−43,1%) que en Producción
  (−18,8%), Tecnología (−15,5%) y Salud (−14,4%). Se asocia a cosechas: con base dic-22, la composición explica
  84% del cambio, y el menor ticket de entrada ocurre dentro de cada industria (96% del cambio 2022→2024). No se
  asocia a salidas persistentes: el churn observado baja de 3,52% a 2,04%, mientras que el de quienes no vuelven
  a pagar en un trimestre queda en 0,98% y 0,96%.'
