id: C-008
type: claim
key: perdida-burbuja
question: ¿Hay industrias de bajo churn, ticket alto y poco volumen?
headline: 'Salud combina menor churn persistente, ticket alto y poco volumen: señal a validar'
answer: 'Salud tiene el menor churn persistente (0,56 puntos mensuales), el ticket de entrada mediano de 2024 más
  alto por primer pago (COP 52,5 mil, igual que Restaurantes) y el menor volumen: 124 clientes activos en oct-24,
  frente a 459 en Restaurantes. También es la industria con menor caída del MRR por cliente (−14,4%) y aporta 11,7%
  del crecimiento del MRR. Con monto usual temprano, sostuvo COP 63,0 mil en 2023 y bajó a COP 48,8 mil en 2024.
  Propuesta: si con margen, costo de servir y canal se confirma, Salud es candidata a una prueba de Generación de
  Demanda dirigida. El CRO decidiría con la retención y el valor por cohorte de esa industria, frente a un grupo
  comparable.'
