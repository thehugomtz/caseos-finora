limitations:
- 'Pendiente de tu aceptación: F-104, F-099, F-103, F-105 y F-165 están propuestos, con confianza media.'
- Con pocos clientes activos, la señal puede moverse por unas cuantas cuentas.
- El ticket de 2024 es por primer pago; con monto usual temprano, Salud también baja en 2024 (T-067).
- Sin margen, costo de servir ni canal no hay economía por industria (F-138). H-044 sigue abierta y la industria
  no es causa.
