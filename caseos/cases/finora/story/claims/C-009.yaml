id: C-009
type: claim
key: metricas-semaforo
question: ¿Qué métricas propondrías que hoy no existen (MRR, ARR, ARPU, CAC, LTV, Churn, UCM) y cómo medirlas?
headline: 'Proponemos un árbol de ingreso recurrente con semáforo: qué se mide hoy y qué no'
answer: 'En verde, lo que se calcula hoy con nombre honesto: MRR pagado observado y su puente, clientes activos,
  ARPA por cliente (lo que se pide como ARPU; no hay datos de usuarios), churn observado y retención por cohorte.
  En amarillo, los proxies con una regla por aprobar: churn persistente con ventana de gracia, MRR normalizado por
  mes de servicio y ARR solo como run-rate. En rojo, lo que pide datos nuevos: CAC en COP y por funnel o canal,
  payback, LTV con margen, LTV:CAC y UCM. El churn muestra por qué importa el nombre: el observado baja de 3,52%
  en 2022 a 2,04% en 2024, mientras el persistente pasa de 0,98% a 0,96%.'
