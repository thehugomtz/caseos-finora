id: C-012
type: claim
key: hipotesis-capacidad
question: ¿Cómo se sabe si falta capacidad comercial o si bajó la calidad de la máquina de leads?
headline: Calidad y capacidad se separan con mezcla contra tasa, dentro de cada puerta
answer: 'En el árbol (C-023), la calidad es la hoja de mezcla y la capacidad es una hoja de antes del SQL. Se separan
  por puerta, entre el periodo base y el de la caída. Si empeora la mezcla de ajuste al entrar y la velocidad de
  atención está estable, apunta a calidad (H-005). Si la mezcla está estable, suben la carga y la espera y la caída
  se concentra en entradas atendidas tarde, apunta a capacidad (H-006). Si pasan ambas cosas, apunta a las dos a
  la vez (H-028). Dato mínimo: entradas con su banda de ajuste congelada al crearse y su primer contacto humano,
  más un roster semanal de SDR/AE con su ramp; el gasto de Team no mide capacidad. Con datos observados es asociación,
  porque SDR/AE eligen a quién tocar: para probar la palanca hacen falta experimentos naturales (llegadas fuera
  de horario, reparto por turnos) o un piloto.'
