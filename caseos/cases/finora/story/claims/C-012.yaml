limitations:
- Pendiente de tu aceptación; F-120 tiene confianza baja.
- 'Hoy no se puede separar H-005 de H-006: faltan entradas, reps y tiempos de contacto (F-120).'
- 'No usamos Self Service como grupo de control: depende de que haya existido sin SDR/AE en ambos periodos (X-012).'
- Las bandas de ajuste deben validarse antes en el periodo base. La capacidad también puede estar en el AE, no solo
  en el SDR (X-153).
visual_intent: 'Dos firmas distintas: calidad mueve la mezcla con la velocidad quieta; capacidad mueve la carga
  y la espera con la mezcla quieta.'
hugo_wording: La capacidad comercial instalada no alcanza la demanda generada, la calidad de la máquina de leads
  bajó.
