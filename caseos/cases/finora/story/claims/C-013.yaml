id: C-013
type: claim
key: operar-fuentes
question: ¿Qué modelo de datos se propone para operar el funnel, as-is vs to-be?
headline: Proponemos pasar de pagos por cliente-mes a una cuenta común con demanda, funnel y suscripción
answer: 'AS-IS: tres fuentes, todas de después del pago. Pagos, con grano cliente × mes (ID, mes y monto sin escala
  → customer_id, month y amount_cop): responde cuánto pagó cada cliente cada mes, el puente de monto pagado y las
  cohortes por primer pago. No responde nada de quien no pagó, ni plan, precio o descuento, ni si un cero es cancelación,
  mora o desfase (44% de los churn observados vuelve a pagar al mes siguiente), ni si un pico es prepago o expansión.
  Industria, con grano cliente (ID en otro formato): responde el corte por industria; no responde tamaño, segmento
  ni cambios en el tiempo. Gasto S&M, con grano mes × rubro y sin unidad: responde el gasto por rubro y una eficiencia
  agregada; no responde canal ni campaña. Ninguna de las tres responde canal, puerta, etapa, intervención, tiempo
  de cierre ni estancamiento. TO-BE: una espina y tres capas. Espina: account (una fila por cuenta; llave account_id)
  y account_xref (llave: sistema + ID de origen + inicio de vigencia), que une CRM, producto, facturación y los
  IDs de hoy. Demanda: channel (canal × versión de la regla source/medium), campaign, touch (un toque con UTMs;
  llave touch_id), campaign_member (persona × campaña) y campaign_spend (gasto por campaña, con moneda). Comercial:
  person, lead, opportunity, stage_history (un cambio de etapa: de, a, cuándo y quién), activity y assignment. Producto
  y facturación: product_event, subscription, subscription_item_version (lo contratado), discount (lo descontado),
  invoice (lo facturado) y payment (lo cobrado). Marts: funnel_entry, una fila por entrada con puerta, ruta y fecha
  de cada hito, que alimenta C-006; y account_month, cuenta × mes con MRR de lista y neto y estado de suscripción,
  que alimenta C-009 y se concilia cada mes con el monto pagado de hoy. BRECHA → MÉTRICA QUE HABILITA: llave común
  → cruzar entrada, toque y pago de una misma cuenta · touch, channel y campaign_spend → entradas, win rate y costo
  por Won por canal · puerta y ruta en funnel_entry → cohortes y win rate por puerta · stage_history → volumen y
  conversión por etapa · fechas de hitos → tiempo de cierre y Won → primer pago · activity y assignment → calidad
  del handoff, carga por SDR/AE y estancamiento · estado de suscripción → churn por cancelación separado de mora
  · contratado, descontado, facturado y cobrado → MRR de lista y neto, línea Descuento y efecto de cobro (S3).'
