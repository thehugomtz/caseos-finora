limitations:
- 'Pendiente de tu aceptación: F-238 a F-242 y los demás findings citados están propuestos.'
- Es diseño, no algo construido; si entra a la historia bajo D-007 depende de D-018.
- R-033 trata Reactivate como puerta y usa las rutas self_serve_puro, hybrid y sales_assisted; C-005 (R-031) lo
  trata como loop, con las rutas Executive, Self Service, Hybrid A y B. Hay que alinearlos antes de construir.
- 'Varias reglas son decisiones de negocio y deben quedar escritas antes (F-241): orden de puerta, cuándo una entrada
  es nueva, estados New/Working/Engaged, ventana W, umbral de estancamiento y base del puente (lista o neto).'
- Mide hacia adelante, salvo que Finora tenga historial en sus sistemas (F-242). Que el caso no traiga canal ni
  etapas no prueba que Finora no los registre.
visual_intent: 'From → to: tres fuentes aisladas de después del pago pasan a una espina de cuenta que une demanda,
  funnel y suscripción; cada brecha que se cierra enciende una métrica.'
