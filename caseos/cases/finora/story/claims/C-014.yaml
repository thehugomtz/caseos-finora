id: C-014
type: claim
key: operar-foros
question: ¿Cómo opera el CRO el funnel de forma recurrente y qué decide en cada foro?
headline: 'Proponemos un tablero por foro atado a decisiones: semanal, mensual y trimestral'
answer: 'Cada foro trae sus métricas (C-006, C-009) y la decisión que habilita. Semanal (CRO, líderes de SDR/AE
  y RevOps): estancamiento por etapa, calidad del handoff, tiempo en etapa, carga por SDR/AE y stock sin tocar del
  loop Reactivate → qué journeys avanzar, retomar o descalificar, y dónde reasignar capacidad. Mensual de Growth
  & Revenue (CRO, Marketing, CS/KAM y Finanzas): entradas y win rate de cohorte por puerta y canal, mezcla de Won
  por ruta, tiempo de cierre, MRR de entrada, puente de MRR y churn persistente → mover la Inversión en Marketing
  entre canales y ajustar el ruteo entre rutas. Trimestral (CEO, CFO y CRO): CAC y costo por Won por canal y ruta,
  payback, NRR/GRR por cohorte y MRR de lista contra neto → repartir entre Generación de Demanda, Team y Habilitación.
  Por encima van el Análisis Ad hoc por hoja del árbol (C-023) y agentes de IA que trabajan solo sobre métricas
  gobernadas (vigilancia de estancamientos, pre-lectura del foro, higiene del CRM), con un piloto controlado.'
