id: C-014
type: claim
key: operar-foros
question: ¿Qué decisiones le permite tomar al CRO y en qué foro?
headline: 'Proponemos un tablero por foro atado a decisiones: semanal, mensual y trimestral'
answer: 'La base es un bowtie por motion (Self Service, Assisted, Executive con KAM en la post-venta) que mide volumen,
  alcance y tiempo por hito. Cada foro tiene su decisión: el semanal decide oportunidades, el mensual la mezcla
  de motion y Canal de adquisición, y el trimestral la inversión y la capacidad. El análisis ad hoc se abre por
  hipótesis (H-001 a H-008). Los agentes de IA y la atribución van encima, no en la base: solo sobre métricas gobernadas
  y con un piloto controlado; para decidir presupuesto hacen falta experimentos.'
