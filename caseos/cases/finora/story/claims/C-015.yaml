id: C-015
type: claim
key: pricing-entrada
question: ¿Qué data observable de pricing introductorio podemos sacar?
headline: Lo observable es el primer y segundo pago; el descuento no es verificable
answer: 'Lo observable del pricing introductorio es el primer y el segundo pago de cada alta. La mediana del primer
  pago baja de COP 63,0 mil en 2022 a COP 36,8 mil en 2023 y COP 42,0 mil en 2024; la del segundo, de COP 52,5 mil
  a COP 36,8 mil y COP 38,9 mil. El segundo pago repite el primero en 73,5%, 90,3% y 77,3% de las altas, y el primero
  supera con holgura al segundo en 23,2%, 7,1% y 11,6%. Eso se asocia a pagos iniciales grandes en 2022, pero no
  dice si hubo descuento: sin lista ni descuento registrados, no es verificable.'
