- 'T-053 da otras medianas del segundo pago para las mismas cohortes. Parece otra definición (incluir o no a quien
  no pagó): falta conciliar.'
- 'La huella de un descuento limpio casi no aparece (F-134), pero ausencia de evidencia no es evidencia de ausencia:
