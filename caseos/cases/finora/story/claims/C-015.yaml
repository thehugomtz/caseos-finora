id: C-015
type: claim
key: pricing-entrada
question: ¿Qué data observable de pricing introductorio podemos sacar?
headline: Lo observable es el primer y segundo pago; el descuento no es verificable
answer: 'La mediana del primer pago de las altas es COP 63,0 mil en 2022, COP 36,8 mil en 2023 y COP 42,0 mil en
  2024. La del segundo pago, entre quienes lo hacen, es COP 52,5 mil, COP 36,8 mil y COP 38,9 mil. El segundo pago
  coincide exactamente con el primero en 73,5%, 90,3% y 77,3% de las altas, y el primer pago supera con holgura
  al segundo en 23,2%, 7,1% y 11,6%: la brecha inicial es sobre todo de 2022. Eso describe la forma del primer cobro,
  no un descuento: en los datos no hay lista, plan ni descuento.'
