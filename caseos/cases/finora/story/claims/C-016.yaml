id: C-016
type: claim
key: monto-dos-lecturas
question: ¿Por qué los ejemplos del CFO no se pueden leer con el monto pagado?
headline: Con solo el monto pagado, cada ejemplo del CFO admite lecturas distintas
answer: 'El dato es un monto por cliente y mes, sin lista, plan, descuento, crédito ni periodo de servicio. Una
  baja puede ser contracción o descuento, y un monto estable puede esconder una expansión compensada por un descuento.
  Además, el monto se comporta como caja: 25,3% del movimiento bruto sin altas vuelve exacto al nivel previo al
  mes siguiente, y 29% del MRR de expansión se revierte al mes siguiente. Por eso hoy no se puede asignar la caída
  por cliente entre precio de lista y descuento.'
