limitations:
- Propuesta de especialista (R-021, R-011), pendiente de tu aceptación. F-132 viene de fuente sin verificar.
- La asociación descuento → clientes de menor valor es evidencia externa; el churn al vencer el descuento tiene
  otras causas posibles (F-154).
- No sabemos si los contratos de Finora son mensuales cancelables o a plazo fijo (F-153).
- La convención oficial la decide el CFO; aquí solo se propone mostrar las dos capas.
visual_intent: 'Divergencia por capas: lista, neto, revenue y caja se separan cuando hay un descuento temporal.'
