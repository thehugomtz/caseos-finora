id: C-018
type: claim
key: descuento-capas
question: ¿Qué implica, más allá del mecanismo, introducir descuentos temporales?
headline: El CFO decide la convención; con descuentos, MRR neto, revenue y caja se separan
answer: 'No hay un estándar para tratar los descuentos temporales en el MRR: es una decisión de definición que el
  CFO toma y declara. Para Finora, lo más útil es mostrar la capa de lista y la de neto. Con descuentos temporales,
  el MRR neto, el revenue reconocido y la caja pueden separarse, y cuál vista aplica depende de si los contratos
  son mensuales cancelables o a plazo fijo. Además, cambian las cohortes: la evidencia externa asocia la adquisición
  con descuento a clientes de menor valor, así que Finora tendría que marcar esas cohortes y medirlas contra un
  grupo comparable.'
