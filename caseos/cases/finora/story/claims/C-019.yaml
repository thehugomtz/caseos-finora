id: C-019
type: claim
key: modelo-escalera
question: ¿Cómo separar el valor de la suscripción del precio efectivamente pagado?
headline: La Propuesta de Modelo de datos separa el valor en una escalera con vigencias
answer: 'Por suscripción y mes, cada peldaño lleva su fuente y su vigencia: lista (price_list_version, precio por
  plan y frecuencia) → contratado (subscription_item_version: plan, cantidad y precio acordado, sin descuentos)
  → descuento recurrente (discount_grant) → MRR neto = contratado − descuento recurrente → facturado (línea de factura,
  con el descuento aplicado vía discount_application) → cobrado (pago asignado a la factura). Lo contratado solo
  cambia con un subscription_change_event. El MRR, de lista y neto, se clasifica sobre los primeros peldaños comparando
  fotos de cierre (subscription_month_snapshot); facturado y cobrado son caja y solo generan un «efecto de cobro»,
  nunca movimientos de MRR. El monto pagado de hoy sigue como capa de «monto pagado observado» y se concilia contra
  lo cobrado.'
