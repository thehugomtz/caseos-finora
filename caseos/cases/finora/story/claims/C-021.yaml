id: C-021
type: claim
key: funnel-etapas
question: ¿Qué etapas aplican a cada funnel, por canal, literalmente como las del Executive?
headline: Cada ruta usa las etapas del Executive que le aplican, por canal y con dueño
answer: 'Por ruta y canal, en orden y con dueño. Es propuesta; solo Executive outbound es literal tuyo. EXECUTIVE
  · outbound SDR: New → Working SDR → Engaged SDR → SQL SDR → Demo AE → Proposal AE → Won; el SDR es dueño hasta
  SQL SDR y el AE desde Demo AE · inbound «hablar con ventas» (paid media, publicidad no web u orgánico): New →
  Engaged SDR → SQL SDR → Demo AE → Proposal AE → Won; se salta Working SDR porque la cuenta levantó la mano · referido
  o partner (tu WoM, por confirmar): New → Demo AE → Proposal AE → Won, solo con AE. SELF SERVICE · signup en producto
  (paid media, publicidad no web u orgánico): New → Signup Self → Activated Self → Checkout Self → Won; dueño Growth/Producto,
  por confirmar; si no hay prueba ni registro antes del pago, queda New → Checkout Self → Won. HYBRID A · signup
  en producto: New → Signup Self → Activated Self → Engaged SDR → SQL SDR → Demo AE → Proposal AE → Won; pasa de
  Growth/Producto al SDR y al AE; la persona entra por una señal de uso, fit o intención, o porque la cuenta pide
  ayuda; Engaged SDR y SQL SDR se pueden saltar; variante: la persona ayuda y la cuenta paga sola por Checkout Self.
  HYBRID B · outbound SDR: New → Working SDR → Engaged SDR → SQL SDR → Demo AE → Checkout Self → Won; pasa del SDR
  al AE y la cuenta cierra sola; Demo AE se puede saltar · inbound «hablar con ventas»: lo mismo, sin Working SDR.
  REACTIVATE (loop): un journey estancado en cualquier etapa abierta entra al loop y, si se re-engancha, vuelve
  a su etapa con su puerta y su ruta. QUÉ DEL EXECUTIVE APLICA A LOS OTROS: New y Won aplican a todas las rutas.
  Working SDR solo donde hay prospección outbound (Executive e Hybrid B outbound). Engaged SDR, SQL SDR y Demo AE
  aplican a Executive, a Hybrid A (se pueden saltar) y a Hybrid B. Proposal AE aplica a Executive y a Hybrid A;
  en Hybrid B la reemplaza Checkout Self. Self Service no usa ninguna etapa de SDR ni de AE: las cambia por Signup
  Self, Activated Self y Checkout Self.'
