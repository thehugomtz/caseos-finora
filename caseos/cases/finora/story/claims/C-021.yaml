limitations:
- 'Pendiente de tu aceptación: F-209 a F-211 y F-223 a F-225 están propuestos.'
- 'No afirmamos que Finora tenga criterios de etapa definidos: el brief da la secuencia y un traspaso SDR → AE que
  ocurre «sobre todo» y «normalmente». Demo y Proposal hay que confirmarlas contra el CRM.'
- Las etapas de Self Service e Hybrid son propuesta. Activated Self se define con Producto, y no sabemos si hay
  prueba, freemium o pago al registrarse (Q-046).
- La frontera entre Executive inbound e Hybrid A depende de Q-063. Una variante de Hybrid B (el SDR contacta y la
  cuenta se registra sola) es Hybrid B con la regla laxa y Self Service con la estricta.
- Faltan por confirmar el canal referido/partner y el dueño de Self Service. Parte de los saltos de etapa puede
  ser registro del CRM (H-051).
visual_intent: 'Reusar o reemplazar: qué etapas del Executive reusa cada ruta, cuáles salta y cuáles cambia por
  etapas de producto, con el traspaso de dueño (SDR → AE → cliente) visible en cada ruta.'
hugo_wording: «queria ver una prouesta aterrizada por casuistica de canal literalmente de los funeles asi como te
  pase la de new, working, SDR, engaged, bla bla quiero ver cuales aplican para los otros»
