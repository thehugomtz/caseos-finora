limitations:
- 'Pendiente de tu aceptación: F-228 a F-232 y los demás findings citados están propuestos.'
- Reordena las tres ramas de D-001 (cantidad, mezcla, compra según tiempo). Si lo adoptas, hace falta una decisión
  nueva que referencie D-001 (X-150); no se sobrescribe en silencio.
- 'Las hojas son causas candidatas: no afirmamos que en Finora cambiaron metas, comisiones, precio o competencia.
  La caída post-SQL no se atribuye al AE.'
- 'Comparar SQL directos contra SQL del SDR no es un experimento: vienen de orígenes distintos; solo sirve ver cómo
  cambia cada grupo en el tiempo, y aun así es asociación.'
- Si aparecen a la vez las firmas de mezcla y de capacidad, se reportan como interacción (H-028), no como hoja nueva.
visual_intent: 'Descomposición: la brecha se parte en orden (validez → puerta → mezcla contra tasa → etapa → cobro);
  cada pedazo cae en una sola hoja con su dato y su palanca, con la medición separada del negocio.'
