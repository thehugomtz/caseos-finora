id: C-024
type: claim
key: observable-semaforo
question: ¿Qué se puede leer del monto pagado y qué no?
headline: Con cliente, mes y monto se ve qué cambió, no por qué
answer: 'Se ve cuánto cambió el monto pagado y en qué movimiento del puente, pero parte de ese movimiento es calendario
  de cobro. 25,3% del movimiento bruto sin altas vuelve exacto al nivel previo al mes siguiente, 29% del MRR de
  expansión se revierte al mes siguiente y 44% de los churn observados vuelve a pagar al mes siguiente. En la reactivación,
  42,6% llega con un monto que cubre los meses del hueco más el corriente y 11,5% regresa al monto usual. En la
  contracción, solo 4,0% vuelve al nivel previo y 88,9% sigue igual o más abajo. Lo que no se ve es el porqué: suscripción,
  tarifa, descuento o cobro.'
