limitations:
- 'Pendiente de aceptación: F-246, F-247, F-249 y F-252 están propuestos (R-035, R-036).'
- 'Es propuesta: ninguna métrica propia de ruta se calcula hoy y ninguna métrica común se puede cortar por ruta
  (F-146).'
- 'El S&M por alta está en unidad reportada, sin escala a COP: no es CAC (F-137). Un CAC combinado depende de documentar
  la unidad del gasto y de acordar qué es adquirir un cliente.'
- Churn y MRR observados necesitan una regla de normalización y una ventana de gracia antes de llamarse así (F-136).
- 'Las decisiones del CRO a las que se atan las métricas son propuesta: Finora aún no las define.'
- La «reactivación» del modelo actual es retorno de pago de clientes, no el Reactivate de leads (F-252).
visual_intent: 'Link: cada métrica nueva se conecta con la decisión del CRO que habilita, separando lo que hoy se
  calcula de lo que pide dato nuevo.'
hugo_wording: Qué métricas propondrías que hoy no existen (MRR, ARR, ARPU, CAC, LTV, Churn, UCM) y cómo medirlas,
  robustecerlo y bajar lo que tenga sentido.
