  question: ¿Cómo clasificar el inicio y el fin de un descuento para que no se confundan con contracción o expansión
    reales?
  headline: Si la suscripción no cambia, inicio o fin de descuento va a «Descuento»
  answer: 'Se comparan cierres de mes consecutivos del mismo cliente, en este orden. a) ¿Cambió la lista o el precio
    pactado? → expansión, contracción o cambio de tarifa, con línea propia «Tarifa». b) ¿Cambió el descuento? →
    descuento nuevo o aumentado, o descuento reducido o terminado. c) ¿Solo cambió el cobro? → momento de cobro,
    fuera del MRR. El caso mixto se parte en líneas separadas, y cada mes los movimientos suman exactamente el cambio
    de bruto y de neto. Para los grupos del CFO: al entrar, el alta va por el bruto y el descuento inicial va en
    su propia línea. Quien sale, sale por su bruto, y su descuento se libera dentro del churn, nunca como fin de
    descuento. En quien continúa, solo el cambio de descuento va a la línea Descuento.'
