- claim_id: C-005
  key: funnel-puertas
  question: ¿Cómo definir el funnel si no todos lo recorren igual (self-serve, entrada directa a SQL, estancamientos
    de semanas)?
  headline: Proponemos rutas Executive, Self Service e Hybrid, más un loop de Reactivate
  answer: 'Con tus definiciones. Executive es el funnel actual SDR→AE (New → Working SDR → Engaged SDR → SQL SDR
    → Demo AE → Proposal AE → Won); la entrada directa a SQL también es Executive, con etapa de entrada SQL. Self
    Service es el recorrido sin persona, con sus canales. Hybrid mezcla tramos sin persona y con persona: en A empezó
    solo y después intervino un SDR/AE; en B lo tocó una persona y terminó solo. Reactivate no es otra ruta: es
    un loop sobre leads estancados que se reactivan y se asignan a un funnel según el caso. Para que el mix sea
    MECE: la unidad es la cuenta; la puerta (Producto o CRM/Ventas) y el canal se fijan al entrar y no cambian;
    la ruta sale de quién movió cada tramo. El formulario de «hablar con ventas» es una entrada por la puerta CRM,
    y un lead que nadie contactó y compró solo es Self Service con bandera. Un episodio reactivado no cuenta como
    entrada nueva: conserva su fecha y su puerta originales, y su primer pago cuenta una sola vez, con bandera.
    El nudo común es el primer pago, como recomendación que decides tú. La vuelta de pagadores que se ve en los
    pagos no es Reactivate: es otro loop, del lado Revenue.'
  role_in_story: recommendation
