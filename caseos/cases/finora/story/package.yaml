  key: descuento-objeto
  question: ¿Cómo debería Finora introducir descuentos temporales sin perder la respuesta a «¿por qué cambió el
    MRR?»?
  headline: Proponemos que el descuento exista como objeto propio, con fecha de fin
  answer: 'Mecanismo propuesto: cada descuento se registra como una concesión propia (tipo, valor, inicio, fin,
    motivo, canal y aprobador), separada del plan, la cantidad y el precio de lista, y se lee desde la factura.
    El puente de MRR suma líneas propias de «descuento nuevo o aumentado» y «descuento reducido o terminado». Hace
    falta porque las herramientas revisadas, usadas tal cual, mostrarían el fin de un descuento como expansión,
    y una expansión compensada por descuento como «sin cambio». Implicaciones multidisciplinarias: Ventas necesita
    reglas de aprobación y vencimiento; Finanzas, la convención de MRR y la conciliación con revenue y caja; Producto
    y Facturación, el objeto descuento y el periodo de servicio en la factura; Growth, marcar las cohortes con descuento
    y medirlas contra un grupo comparable.'
