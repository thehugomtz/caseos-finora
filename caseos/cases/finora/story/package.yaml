unresolved_questions:
- 'S2.1 · «Las relaciones que comentó Hugo»: el guion dice «por precisar». ¿Qué relaciones son? No la relleno. Si
  son volumen vs valor de entrada, o gasto vs primeros pagadores, ya están en S2.2.'
- 'Readiness: no hay findings aceptados. Orden sugerido de revisión: F-071, F-072, F-075 y F-097 (Overview y S2.4)
  → F-110, F-113, F-112 y F-107 (S2.2) → findings de R-010…R-021 (propuestas).'
- D-007 (activa) deja la solución fuera de etapa (sin dashboards, métricas definitivas ni modelo de datos). Tu guion
  aprobado incluye S2.5, S2.7 y S3.3, y D-016 delegó este borrador. ¿D-007 aplicaba solo a Framing, o hay que superarla
  con una decisión nueva?
- 'Churn observado 2024: T-002 da 2,04% y T-034, 1,9%. ¿Distinta ventana o distinto denominador?'
- 'Churn observado por industria 2024: F-052 (Producción mínimo, Tecnología máximo) no coincide con T-047 (Restaurantes
  1,46 a Tecnología 2,57).'
- 'Freelance: F-117 lo pone en cero desde may-23, pero T-006/T-009 marcan jun-23 como último mes con valor.'
- '¿Qué pasó a inicios de 2023: efecto de registro (H-024) o cambio en la operación comercial (H-025)?'
- 'Hito de adquisición del CRO (Won, primer pago o suscripción activa), ventana W y umbral de «estancado»: por acordar
  con Finora.'
- 'Unidad y escala del archivo de S&M, y clasificación de SoftwareTools/Freelance: sin documentar (X-001, X-002).'
- ¿Qué decide el CEO con el Overview y qué decisiones tiene el CRO en cada foro? Sin eso, S2.7 queda partial y Q-003
  se contesta solo en parte.
- ¿Los contratos de Finora son mensuales cancelables o a plazo fijo? De eso depende qué vista aplica (F-153).
- ¿Qué registra hoy Finora en su CRM, su analítica digital y su facturación? Los datos del caso no lo dicen.
- T-053 muestra en mediana el primer pago por encima del segundo; eso parece ir contra la premisa de H-032. Conviene
  evaluar el impacto.
- 'Sugerencia, no cambio: poner S2.4 junto a S2.2 dejaría contiguo «lo que sí vemos». El paquete sigue tu orden.'
