    atención y capacidad (H-006), el tramo post-SQL (H-007, BoFu) y la oferta, es decir producto, precio o condiciones
    (H-008, BoFu). Las entradas únicas con fecha (con canal, motion y segmento) y su vínculo con el pago bastan
    para distinguir H-001 a H-004. H-005 a H-007 necesitan datos que suelen estar en un CRM, aunque no siempre con
