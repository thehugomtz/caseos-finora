  question: ¿Cómo clasificar inicio y fin de un descuento para que no se confundan con contracción o expansión reales?
  headline: Si la suscripción no cambia, inicio o fin de descuento va a «Descuento»
  answer: 'La clasificación compara cierres de mes por componente (suscripción, tarifa, descuento). Si la suscripción
    no cambia, el inicio o el fin de un descuento va a una línea «Descuento» del puente y no cuenta como contracción
