- claim_id: C-019
  key: modelo-escalera
  question: ¿Cómo separar el valor de la suscripción del precio efectivamente pagado?
  headline: La Propuesta de Modelo de datos separa el valor en una escalera con vigencias
  answer: 'Escalera por suscripción y mes, cada peldaño con su tabla y su vigencia. La lista, en price_book_entry:
    tarifa por versión de plan, periodo y moneda, con valid_from y valid_to. El precio pactado, en subscription_item_version:
    plan, cantidad, add-ons y precio unitario, en intervalos sin traslape. El descuento, en discount_grant: tipo,
    valor, inicio, fin, motivo, aprobador y el change_event que lo originó. Después vienen el MRR neto; lo facturado,
    en invoice_line (subtotal, descuento, neto y periodo de servicio); y lo cobrado, en payment_allocation (llave
    pago + factura). Todo cuelga de customer_id y subscription_id. Cada cambio nace de un change_event con fecha
    efectiva, fecha de registro y evidencia. subscription_month_snapshot es la foto al cierre de mes con lista,
    bruto, descuento, neto y caja. mrr_movement es la diferencia entre snapshots consecutivos, partida por componente:
    suscripción, tarifa, descuento, entrada y salida. Facturado y cobrado nunca generan movimientos de MRR, solo
    «efecto de cobro», y el panel actual queda como monto pagado observado, conciliado contra lo cobrado. A facturación
    se le pide primero: tarifas con vigencia, y plan o cantidad por cliente.'
