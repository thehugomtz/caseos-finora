  key: hipotesis-capacidad
  question: ¿Cómo se separa una capacidad comercial insuficiente de una caída en la calidad de la máquina de leads?
  headline: Capacidad y calidad se separan comparando mezcla contra tasa por grupo de entrada
  answer: 'Si empeora la mezcla de ajuste al entrar y la velocidad está estable, apunta a calidad. Si la mezcla
    está estable, suben la carga y la espera, y la caída se concentra en entradas lentas, apunta a capacidad. Si
    pasan ambas cosas, probablemente interactúan. Si no pasa ninguna, hay que mirar post-SQL o cambios de definición.
    El dato mínimo es una tabla de entradas con el ajuste congelado al entrar y el primer contacto humano, y un
    roster semanal de SDR/AE con su ramp. Todo esto es asociación: para saber si más capacidad recupera compras
