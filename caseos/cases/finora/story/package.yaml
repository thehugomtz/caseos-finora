  question: ¿Qué puede y qué no puede responder cliente + mes + monto?
  headline: Con cliente, mes y monto se ve qué cambió, no por qué
  answer: 'Se puede: clientes activos, MRR pagado observado y su puente, primeros pagos, ticket estabilizado, churn
    observado y persistente, y cohortes. Con cuidado, el puente, porque el cobro se mezcla con el movimiento: 29%
    del MRR de expansión se revierte al mes siguiente, 44% de los churns observados vuelve a pagar al mes siguiente
    y 42,6% del MRR de reactivación llega cubriendo los meses del hueco más el corriente. La contracción, en cambio,
    casi no revierte: 4,0% regresa al nivel previo y 88,9% sigue igual o más abajo. Eso no descarta que parte de
    la contracción sea cobro. Si llega justo después de un primer pago o de una reactivación que cubría varios meses,
    la baja es la vuelta al monto usual y se sostiene; separarla pide el periodo de servicio. No se puede: lista,
    tarifa, plan, descuento, estado de la suscripción ni nada antes del pago. Además, la vuelta de pagadores es
    un loop de Revenue, no el Reactivate del funnel.'
