- claim_id: C-017
  key: descuento-objeto
  question: ¿Cómo debería Finora introducir descuentos temporales sin perder la respuesta a «¿por qué cambió nuestro
    MRR?»?
  headline: El descuento se registra como objeto propio, con origen, source y fecha de fin
  answer: 'Mecanismo propuesto: cada descuento vive como objeto propio (tipo, valor, inicio, fin pactado y real,
    alcance, motivo y aprobador) y tiene un solo origen: promoción con su oferta, código y canje; negociación; retención;
    o partner. Va separado de la cantidad contratada y del precio de lista, para que ni un precio especial ni un
    downgrade de retención escondan un descuento. El source se captura en la adquisición de todos los clientes,
    no solo en el código, y el código guarda aparte el canal asignado y su medio (digital, físico o QR). Además,
    sin estado de suscripción un mes gratis se confunde con churn, como pasa hoy, cuando 44% de los churns observados
    vuelve a pagar al mes siguiente. Implicaciones multidisciplinarias: Finanzas declara la convención de cómo pega
    el descuento en el MRR y qué vista usa (MRR neto, revenue o caja, según los contratos sean mensuales o a plazo
    fijo); Marketing marca las cohortes con descuento y las mide contra un grupo comparable; Ventas y CS registran
    aprobaciones y casos de retención; y Datos construye el modelo.'
