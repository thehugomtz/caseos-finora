- claim_id: C-028
  key: metricas-nuevas
  question: ¿Qué métricas proponemos que hoy no existen, incluida la eficiencia, y por qué cada una?
  headline: Proponemos métricas por ruta y de eficiencia, cada una atada a una decisión del CRO
  answer: 'Hoy solo existe el lado del pago: MRR pagado observado y su puente, clientes activos, ARPA, churn observado
    y cohortes. La única eficiencia que se puede calcular es el S&M por alta en unidad reportada (0,105 u en 2022
    y 0,036 u en 2024, −66%), y eso no es CAC. Proponemos sumar métricas en el orden del árbol, cada una por la
    decisión que habilita: entradas válidas y mezcla de ajuste al entrar (¿«más leads» es demanda comprable?); speed
    to lead, carga por SDR/AE y estancamiento por etapa (¿es capacidad o seguimiento?); aceptación de SQL por origen
    y tiempo de Won a primer pago (¿dónde se cae después del SQL?); y CAC en COP y payback por ruta y canal (¿dónde
    poner la siguiente unidad de S&M y de capacidad en el foro trimestral?). Para el CFO, el MRR contratado junto
    al pagado, el churn persistente con ventana de gracia y el ARPA de entrada estabilizado por cohorte y ruta dicen
    qué ruta trae MRR que se queda. El LTV con margen y el UCM esperan margen bruto y costo de servir.'
