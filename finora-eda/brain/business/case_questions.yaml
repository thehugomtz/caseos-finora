  - id: W7
    prioridad: BC
    prioridad_etiqueta: "Brecha crítica · después de W0 y W1"
    frente: "CFO"
    pregunta: "¿Qué distinguiría los componentes del valor y la pertenencia recurrente?"
    hipotesis:
      - id: HF1a/b
        texto: "Entrantes: cambió su aporte antes de descuentos, o descuentos de entrada explican parte de su aporte neto."
      - id: HF2a/b
        texto: "Salientes: la reducción se concentra en salidas reales, o descuentos previos explican la diferencia entre bruto y neto que desaparece."
      - id: HF3a/b/c
        texto: "Continuos: el valor antes de descuentos cambia por configuración o uso, o por tarifa; o descuentos compensan cambios netos."
    por_que_importa: "Enfoca la evolución del razonamiento del CFO sin diseñarla todavía: saber quién entra, sale o permanece no identifica qué cambió por suscripción, tarifa o descuento."
    impacto: 3
    capacidad: 0
    capacidad_nivel: bloqueada
    capacidad_texto: "Falta evidencia indispensable: no hay vigencia, características de suscripción, tarifas ni descuentos. El monto puede describirse; sus componentes no."
    metodo: "Precisar la evidencia de vigencia, características de suscripción, tarifas y descuentos aplicables; identificar si el histórico realmente contiene descuentos. No definir un esquema físico ni reglas finales de MRR."
    entregable: "Matriz: distinción requerida · ambigüedad actual · evidencia mínima · escenario que resolvería."
    criterio_cierre: "Sin componentes explícitos, la prueba conceptual se mantiene separada de la cuantificación real. Si el histórico no tuvo descuentos, se retira toda hipótesis que los trate como causa histórica."
    depende_de: [W0, W1]
    no_concluir:
      - "Salida real a partir de la ausencia de pago: no convertir ese proxy en churn."
      - "Ausencia de descuentos a partir de la ausencia de campos: no probar ausencia por falta de dato."
      - "Expansión real a partir de una diferencia de monto entre continuos."
      - "Inicio o fin de un descuento a partir del patrón de pagos solo."
    proxies_invalidos: []
    bloqueo:
      respuesta_titular: "No se puede responder con los datos actuales: faltan vigencia, tarifa y descuento"
      respuesta_texto: "El histórico tiene cliente, mes y monto. No registra la vigencia de la suscripción, sus características, la tarifa ni los descuentos aplicables. Esta pregunta no se investiga con sustitutos: abajo está la evidencia mínima que separaría cada componente y dónde podría estar."
      hechos_de_datos:
        - "Transactions registra un monto por cliente y mes; no registra plan, precio de lista, valor contratado ni descuento."
        - "No hay estado ni vigencia de la suscripción: un mes sin pago no distingue salida, pausa, atraso o descuento total."
        - "El enunciado habla de introducir descuentos temporales; no hay evidencia de que existieran en el histórico."
      interpretacion_permitida:
        - "El puente de pagos (W3) localiza contribuciones observadas; no identifica entrantes, salientes ni continuos contractuales."
        - "La prueba de identificabilidad (W1) dice qué distinciones no se pueden hacer con el monto solo; no cuantifica componentes reales."
      matriz:
        - hipotesis: HF1a
          pregunta: "¿Cambió el aporte antes de descuentos que incorporan los entrantes?"
          comparacion: "Aporte bruto de entrada distinto, frente a bruto estable con neto distinto por descuento o por cobro."
          evidencia_minima: "Pertenencia recurrente y primera entrada frente a retorno; condiciones de suscripción y tarifa al incorporarse, con periodo consistente."
          catalogo: [precios, estado_suscripcion]
          fuente: "Billing y Finanzas"
          bloqueada: "Si cambió el valor bruto de entrada o solo el neto."
          proxy_invalido: "W2 y W3 solo localizan lo observado; no elevan la capacidad de esta pregunta."
        - hipotesis: HF1b
          pregunta: "¿Descuentos de entrada explican parte del aporte neto de los entrantes?"
          comparacion: "Descuentos explícitos aplicables a entrantes, frente a ausencia de descuentos documentada."
          evidencia_minima: "Evidencia explícita de descuentos y condiciones comparables; primero, confirmar si existían en los periodos históricos."
          catalogo: [descuentos]
          fuente: "Billing y documentación comercial"
          bloqueada: "Si existió un componente de descuento de entrada."
          proxy_invalido: "La ausencia de campos no prueba ausencia de descuento."
        - hipotesis: HF2a
          pregunta: "¿La reducción del aporte se concentra en salidas reales?"
          comparacion: "Baja de relación confirmada, frente a una cuenta vigente con pago ausente."
          evidencia_minima: "Confirmación de vigencia y fin de relación, condiciones anteriores y contexto de factura o cobro."
          catalogo: [estado_suscripcion, motivos_churn]
          fuente: "Billing"
          bloqueada: "Churn real frente a pausa, atraso o cambio de identidad."
          proxy_invalido: "La ausencia de pago no prueba el fin de la vigencia."
        - hipotesis: HF2b
          pregunta: "¿Descuentos previos explican la diferencia entre bruto y neto que desaparece?"
          comparacion: "Salientes con descuento vigente antes de salir, frente a salientes sin descuento aplicable."
          evidencia_minima: "Condiciones de descuento vigentes antes de la salida y su vínculo con la relación que termina."
          catalogo: [descuentos, estado_suscripcion]
          fuente: "Billing"
          bloqueada: "Qué parte del neto perdido era descuento."
          proxy_invalido: "Una conciliación conceptual comprueba que no hay doble conteo; no demuestra una cifra histórica."
        - hipotesis: HF3a
          pregunta: "¿Cambia el valor antes de descuentos por configuración o uso?"
          comparacion: "Configuración distinta con tarifa comparable, frente a configuración estable."
          evidencia_minima: "Características y uso, y condiciones de tarifa en ambos cortes, con su fecha."
          catalogo: [precios]
          fuente: "Producto y Billing"
          bloqueada: "Si hubo expansión real por configuración."
          proxy_invalido: "Una diferencia de monto entre continuos no identifica expansión real."
        - hipotesis: HF3b
          pregunta: "¿Cambia el valor antes de descuentos por tarifa?"
          comparacion: "Tarifa distinta con configuración comparable, frente a tarifa estable."
          evidencia_minima: "Condiciones tarifarias efectivas, características de la suscripción y su contexto temporal."
          catalogo: [precios]
          fuente: "Billing y Finanzas"
          bloqueada: "Si hubo un cambio de pricing."
          proxy_invalido: "Uso y tarifa pueden coincidir: no se separan sin una convención de valoración."
        - hipotesis: HF3c
          pregunta: "¿Descuentos compensan o explican cambios netos entre continuos?"
          comparacion: "Descuento que cambia con bruto estable, frente a cambios de bruto o de cobro sin descuento."
          evidencia_minima: "Descuentos explícitos y vigencias efectivas en ambos cortes, junto al valor bruto; distinguir extensión de fin real."
          catalogo: [descuentos]
          fuente: "Billing"
          bloqueada: "Si el fin de un descuento se lee como expansión."
          proxy_invalido: "No se identifica inicio o fin de un descuento por el patrón de pagos solo."
    evidencia_faltante:
      - dato: "Vigencia y estado de la suscripción"
        catalogo: [estado_suscripcion]
        fuente: "Billing"
      - dato: "Características de la suscripción, tarifa y precio de lista"
