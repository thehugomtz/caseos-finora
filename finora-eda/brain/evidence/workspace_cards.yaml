  "7.1":
    muestra: Cascada del ticket de entrada promedio 2022 → mix → dentro de industria → 2024.
    metricas: [entry_ticket]
    metodo: "Descomposición de Shapley (punto medio): mix = Σ Δsᵢ · (aᵢ⁰ + aᵢ¹)/2; dentro = Σ Δaᵢ · (sᵢ⁰ + sᵢ¹)/2. Intervalos con 2.000 remuestreos bootstrap."
    codigo: finora_eda.py · decomposition(), shapley(), bootstrap_decomp()
    fuente: Transactions.csv + Industry.csv
    claims: [C-ADQ-04]
    caveats: [CV-M0-PICOS-2022]
  "7.2":
    muestra: Brecha del ticket promedio frente a 2022 por semestre, separada en mix y efecto dentro.
    metricas: [entry_ticket]
    metodo: La misma descomposición de Shapley, comparando cada semestre contra la base 2022 (mar–dic).
    codigo: finora_eda.py · decomposition() → evolution
    fuente: Transactions.csv + Industry.csv
    claims: [C-ADQ-03]
    caveats: [CV-M0-PICOS-2022]
  "7.3":
    muestra: Contribución de cada industria al mix y al efecto dentro, 2022 → 2024.
    metricas: [entry_ticket]
    metodo: Contribución de mix = cambio de participación × ticket promedio de ambos periodos; dentro = cambio de ticket × participación promedio.
    codigo: finora_eda.py · shapley() → supporting/mix_within_by_industry.csv
    fuente: Transactions.csv + Industry.csv
    claims: [C-ADQ-04]
    caveats: []
  "7.4":
    muestra: Robustez de la descomposición por comparación y variante.
    metricas: [entry_ticket]
    metodo: Tres comparaciones × tres variantes (M0, winsorizado, run-rate temprano), con Laspeyres como verificación e intervalos bootstrap.
    codigo: finora_eda.py · decomposition() → supporting/mix_within_decomposition.csv
    fuente: Transactions.csv + Industry.csv
    claims: [C-ADQ-04]
    caveats: []
