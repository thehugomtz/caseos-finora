# Datos que no existen en los archivos de Finora. Una hipótesis que los necesita es No evaluable.
version: 1
faltantes:
  - id: precios
    nombre: Precios de lista, planes y empaquetamiento
    campos_necesarios: [list_mrr, plan_id]
  - id: descuentos
    nombre: Descuentos recurrentes y temporales, con su vencimiento
    campos_necesarios: [recurring_discount, temporary_discount, temporary_discount_end]
  - id: creditos
    nombre: Créditos y concesiones no recurrentes
    campos_necesarios: [credits]
  - id: estado_suscripcion
    nombre: Estado de la suscripción (activa, pausada, cancelada)
    campos_necesarios: [subscription_status]
  - id: funnel
    nombre: Etapas del funnel con fechas de entrada y salida
    campos_necesarios: [stage, stage_entered_at, stage_exited_at]
  - id: atribucion
    nombre: Fuente del lead y atribución por canal
    campos_necesarios: [lead_source, channel]
  - id: motivos_churn
    nombre: Motivos de churn, downgrade o reactivación
    campos_necesarios: [churn_reason]
  - id: tamano_cliente
    nombre: Tamaño, geografía u otra segmentación además de la industria
    campos_necesarios: [employees, city]
  - id: semantica_amount
    nombre: Definición de amount (facturado, cobrado o contratado)
    campos_necesarios: [amount_definition]
