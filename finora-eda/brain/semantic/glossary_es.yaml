# Glosario único: nomenclatura en español para toda la experiencia de usuario.
version: 1
formato:
  numeros: es-CO            # punto de miles, coma decimal: 1.678 · 97,0
  meses: [ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]   # ene-22
  semestres: "2022 S1"
  trimestres: "2022 T1"
  montos_en_texto: "COP 57,8 mil · COP 97,0 millones"   # sin K/M: "M" es ambigua en finanzas latinoamericanas
  unidad_en_ejes: título del eje ("millones de COP")

estados_epistemicos:        # eje 1 · estado del claim (título de cada hallazgo)
  - Hecho observado
  - Evidencia fuerte
  - Direccional
  - Hipótesis
  - No evaluable
marcadores:                 # eje 2
  - Explorando
  - Precaución
  - Método
origen:                     # eje 3 (se usa desde la capa de escenarios)
  - Observado
  - Simulado
  - DEMO

terminos:
  Executive snapshot: Resumen ejecutivo
  Data quality & model: Calidad de datos y modelo
  Growth: Resultado del negocio
  Monetization: Ticket de entrada y monetización
  Sales & Marketing: Inversión comercial (S&M)
  Spend relationships: "Gasto y adquisición: ¿se mueven juntos?"
  Industries: Corte por industria
  Mix vs within: Mix vs. efecto dentro de la industria
  Cohorts: Cohortes
  MRR movements: Movimientos de MRR
  What we know: Lo que sabemos
  What we suspect: Lo que sospechamos
  What we cannot know: Lo que no podemos saber
  Paid MRR: MRR pagado
  New MRR: MRR nuevo
  Expansion: Expansión
  Contraction: Contracción
  Reactivation: Reactivación
  Churn: Churn (bajas)
  New customers: Altas
  Net adds: Altas netas
  Entry ticket: Ticket de entrada (M0)
  MRR per active customer: MRR por cliente activo
  Vintage: Cosecha (año de alta)
  Left-censored: Base previa (censura a la izquierda)
  Spillover: Arrastre de feb-22
  Demand Gen: Generación de demanda
  Sales/Acquisition capacity: Capacidad comercial
  Enablement: Habilitación
  Lag: Rezago
  Levels: Niveles
  MoM change: Cambio mes a mes
  Bridge: Puente
  Waterfall: Cascada
  Heatmap: Mapa de calor
  Table: Ver datos
  Open questions: Preguntas abiertas
  Read with care: Precauciones
  Understand / Explain / Decide: Entender / Explicar / Decidir
